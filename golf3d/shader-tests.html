<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loft Links — shader tests</title>
    <meta name="robots" content="noindex">
    <style>
        body { background: #061422; color: #eaf6ff; font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 1rem; line-height: 1.5; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: bold; }
        .skip { color: #fbbf24; }
        h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: #9fb6c9; margin: 1.4rem 0 0.3rem; border-bottom: 1px solid #ffffff1a; padding-bottom: 0.2rem; }
        #summary { font-size: 1.2rem; margin-bottom: 0.5rem; padding: 0.6rem 0.9rem; border-radius: 10px; background: #ffffff0d; }
        #summary.ok { color: #4ade80; }
        #summary.bad { color: #f87171; }
        .note { color: #9fb6c9; font-size: 0.8rem; }
        canvas { position: fixed; left: -9999px; width: 320px; height: 200px; }
    </style>
</head>
<body>
    <div id="summary">running…</div>
    <div id="results"></div>

    <!-- The other half of the suite, and the half tests.html deliberately
         cannot be. tests.html is pure logic — no three.js, no WebGL — which is
         what keeps it fast and what lets it run anywhere; the price is that it
         cannot tell you a shader is broken, because it never compiles one.

         This page pays that price instead. It brings up a real WebGL context,
         builds real holes through the real render.js, and asks the driver
         whether the programs actually linked. It needs a GPU (or SwiftShader),
         so it is allowed to be the slower, more fragile of the two. If no
         context can be had it says so and skips rather than failing: "this
         machine has no WebGL" is not a bug in the game. -->
    <canvas id="gl"></canvas>

    <script src="../vendor/three.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/balls.js"></script>
    <script src="js/celebrate.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/tour-ground.js"></script>
    <script src="js/portals.js"></script>
    <script src="js/textures.js"></script>
    <script src="js/shaders.js"></script>
    <script src="js/postfx.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/models.js"></script>
    <script src="js/life.js"></script>
    <script src="js/worlds.js"></script>
    <script src="js/sandfx.js"></script>
    <script src="js/groundfx.js"></script>
    <script src="js/swing.js"></script>
    <script src="js/bag.js"></script>
    <script src="js/render.js"></script>

    <script>
    (function () {
        'use strict';

        var SH = G3.shaders, R = G3.render, P = G3.physics;
        var passed = 0, failed = 0, skipped = 0;
        window.FAILS = [];
        var out = document.getElementById('results');
        var t0 = performance.now();

        function section(name) {
            var h = document.createElement('h2');
            h.textContent = name;
            out.appendChild(h);
        }

        function assert(name, cond, detail) {
            var div = document.createElement('div');
            if (cond) {
                passed++;
                div.className = 'pass';
                div.textContent = '✓ ' + name;
            } else {
                failed++;
                window.FAILS.push(name + (detail ? ' — ' + detail : ''));
                div.className = 'fail';
                div.textContent = 'FAIL: ' + name + (detail ? ' — ' + detail : '');
            }
            out.appendChild(div);
        }

        function skip(name, why) {
            skipped++;
            var div = document.createElement('div');
            div.className = 'skip';
            div.textContent = '○ skipped: ' + name + ' — ' + why;
            out.appendChild(div);
        }

        function note(text) {
            var div = document.createElement('div');
            div.className = 'note';
            div.textContent = '  ' + text;
            out.appendChild(div);
        }

        /* Run something that touches the renderer and turn a throw into a
           failed assertion rather than a dead page.

           This is not defensiveness for its own sake. The failure that made it
           necessary: drop a uniform from the material and leave it in the GLSL,
           and `u.<name>.value` throws inside buildHole — which used to take the
           whole suite down mid-run, leaving the summary reading "running…"
           forever and a headless driver waiting out its timeout. A suite that
           hangs on the very bug it exists to report is worse than no suite, so
           every renderer call goes through here. */
        function attempt(name, fn) {
            try {
                fn();
                return { ok: true };
            } catch (e) {
                var where = (e.stack || '').split('\n')[1] || '';
                assert(name, false, e.message + (where ? ' @' + where.trim() : ''));
                return { ok: false, err: e };
            }
        }

        /* ── reading the GLSL as text ───────────────────────────────────────

           Cheap, contextless checks that still catch the two mistakes this
           codebase is actually prone to: an `#ifdef` left open, and a uniform
           that exists on one side of the JS/GLSL boundary and not the other.
           Neither needs a GPU, so they run even where the rest of this page
           has to skip. */

        // Every `uniform <type> a, b, c;` declaration, flattened to names.
        function declaredUniforms(src) {
            var names = [], re = /^\s*uniform\s+\w+\s+([^;]+);/gm, m;
            while ((m = re.exec(src)) !== null) {
                m[1].split(',').forEach(function (n) {
                    n = n.trim().replace(/\[.*$/, '');
                    if (n) names.push(n);
                });
            }
            return names;
        }

        // Does the source mention this name anywhere other than its own
        // declaration? Used to find uniforms the JS supplies and the GLSL has
        // stopped reading.
        function usesName(src, name) {
            var re = new RegExp('\\b' + name + '\\b', 'g');
            var hits = (src.match(re) || []).length;
            var declared = declaredUniforms(src).filter(function (n) { return n === name; }).length;
            return hits > declared;
        }

        function ifdefBalance(src) {
            var open = (src.match(/^\s*#if(def|ndef)?\b/gm) || []).length;
            var close = (src.match(/^\s*#endif\b/gm) || []).length;
            return open - close;
        }

        section('SHADER SOURCE');

        var SOURCES = {
            SKY_VS: SH.SKY_VS, SKY_FS: SH.SKY_FS,
            WATER_VS: SH.WATER_VS, WATER_FS: SH.WATER_FS,
            TURF_FS_HEAD: SH.TURF_FS_HEAD, TURF_FS_BODY: SH.TURF_FS_BODY,
            SUR_FS_HEAD: SH.SUR_FS_HEAD, SUR_FS_BODY: SH.SUR_FS_BODY,
            RIDGE_VS: SH.RIDGE_VS, RIDGE_FS: SH.RIDGE_FS,
            BLACKHOLE_VS: SH.BLACKHOLE_VS, BLACKHOLE_FS: SH.BLACKHOLE_FS,
            LAVA_FS: SH.LAVA_FS
        };

        Object.keys(SOURCES).forEach(function (k) {
            assert(k + ' is a non-empty string',
                typeof SOURCES[k] === 'string' && SOURCES[k].length > 0);
        });

        // TURF_FS_BODY carries an #ifdef ALPHATEST/#endif pair of its own, and
        // WATER_FS is now mostly #ifdef PRETTY — an unbalanced one of either
        // takes the whole program out, with an error that points at three.js's
        // prelude rather than at the line that did it.
        Object.keys(SOURCES).forEach(function (k) {
            var d = ifdefBalance(SOURCES[k]);
            assert(k + ' has balanced #if/#endif', d === 0,
                d > 0 ? d + ' unclosed' : (-d) + ' unopened');
        });

        assert('WATER_FS guards its pretty path behind PRETTY',
            /#ifdef PRETTY/.test(SH.WATER_FS));

        /* A splice replaces the chunk it is spliced at, so it has to put that
           chunk back. Drop `<map_fragment>` from the surround's body and the
           ground silently loses its texture — it still compiles, still draws,
           and comes out a flat colour that looks like a lighting bug. */
        assert('the surround splice keeps the map fragment it replaces',
            SH.SUR_FS_BODY.indexOf('#include <map_fragment>') === 0);
        assert('the surround splice keeps the vertex chunk it replaces',
            SH.SUR_VS_BODY.indexOf('#include <begin_vertex>') === 0);
        assert('the surround body reads the varying its head declares',
            /varying vec3 vSur;/.test(SH.SUR_FS_HEAD) && /vSur\./.test(SH.SUR_FS_BODY) &&
            /vSur =/.test(SH.SUR_VS_BODY));

        /* The hills have no uniforms, so their JS/GLSL boundary is one
           attribute: render.js bakes `tint` per vertex and this is the half
           that reads it. Rename either end and the ranges come out black. */
        assert('the ridge shader declares the attribute render.js bakes',
            /attribute vec3 tint;/.test(SH.RIDGE_VS) && /vTint/.test(SH.RIDGE_FS));

        /* The wave level-of-detail is an aliasing fix, not an effect: the sea
           runs to the horizon, so a train finer than the pixel it lands in is
           static in both paths. It therefore has to sit outside the ifdef, and
           this is the test that says so — the cheap path losing it is a
           regression nobody would see in a screenshot of the pretty one. */
        (function () {
            var body = SH.WATER_FS;
            var fpDecl = body.indexOf('float fp =');
            // Not "before the first #ifdef" — the pretty helpers are declared
            // above main() — but "at nesting depth zero", which is the thing
            // actually being claimed: no conditional wraps it.
            var depth = fpDecl > -1 ? ifdefBalance(body.slice(0, fpDecl)) : -1;
            assert('the wave LOD footprint is computed for both water paths',
                fpDecl > -1 && depth === 0,
                fpDecl < 0 ? 'no `float fp =` found' : 'nested ' + depth + ' deep');

            // Same claim, for the trains that consume it: the five base ones
            // must be unconditional, whatever the pretty path adds after them.
            var firstTrain = body.indexOf('train(g, hgt, hsum, w,');
            var trainDepth = firstTrain > -1 ? ifdefBalance(body.slice(0, firstTrain)) : -1;
            assert('the base wave trains are unconditional',
                firstTrain > -1 && trainDepth === 0,
                firstTrain < 0 ? 'no base train call found' : 'nested ' + trainDepth + ' deep');
        })();

        /* The turf's own level of detail, and the same argument as the sea's:
           past the distance a blade covers a pixel, a cut-out is a stipple
           rather than grass (README → "Where the blades give up"). Two things
           have to hold and neither shows up in a compile.

           It has to sit *outside* `#ifdef ALPHATEST` — the whole point is to
           lift alpha before the discard decides, and a splice that closed the
           gaps after it would compile, draw, and change nothing at all. And
           the colour half has to survive with it: closing the gaps without
           `shellFar` leaves the top shell's own tint covering the ground,
           which is a sixth too bright and no test but this one would say so.

           Its two uniforms are handed across from the material's `userData`
           in render.js's `turfShader`, so a rename on either side is a shader
           silently reading zero or a throw inside `buildHole`. */
        (function () {
            var body = SH.TURF_FS_BODY, head = SH.TURF_FS_HEAD;
            var lod = body.indexOf('fwidth(');
            var depth = lod > -1 ? ifdefBalance(body.slice(0, lod)) : -1;
            assert('the turf LOD is measured before the cut-out is decided',
                lod > -1 && depth === 0,
                lod < 0 ? 'no fwidth() found' : 'nested ' + depth + ' deep');
            assert('the turf LOD closes the gaps and takes the far colour with it',
                /diffuseColor\.a = mix\(/.test(body) && /shellFar/.test(body));
            ['mowK', 'shellFar', 'turfNest'].forEach(function (n) {
                assert('the turf declares `' + n + '` and reads it',
                    declaredUniforms(head).indexOf(n) > -1 && usesName(head + body, n));
            });
        })();

        section('SKY AND WATER UNIFORMS');

        /* The bug this is here for: adding a uniform to the GLSL and forgetting
           the JS half, or the reverse. The first shows up as a shader that
           silently reads zero, the second as a `u.<name>.value` TypeError on
           whichever frame first touches it — both a long way from the edit. */
        var waterDecl = declaredUniforms(SH.WATER_FS).concat(declaredUniforms(SH.WATER_VS));
        var skyDecl = declaredUniforms(SH.SKY_FS).concat(declaredUniforms(SH.SKY_VS));

        // three.js declares these itself in its prelude; the shader may use
        // them without ever owning them.
        var BUILT_IN = ['modelMatrix', 'modelViewMatrix', 'projectionMatrix',
            'viewMatrix', 'normalMatrix', 'cameraPosition'];

        section('COMPILING THEM FOR REAL');

        var canvas = document.getElementById('gl');
        var renderer = null, glOK = false;

        try {
            /* Ask whether there is a context at all, so a machine that cannot
               give us one fails here rather than halfway through a hole — but
               ask on a canvas of our own. This used to ask the game's canvas
               for `webgl`, and a canvas keeps the first kind of context it is
               given: every test below then ran on WebGL1, while every phone
               the game is played on gets WebGL2 — another dialect of the
               shader language, and the only one with the multisampled buffer
               postfx.js draws the course into. Left alone, the game's canvas
               is given its context by render.js exactly as it is in the game. */
            var spare = document.createElement('canvas');
            var probe = spare.getContext('webgl2') || spare.getContext('webgl') || spare.getContext('experimental-webgl');
            glOK = !!probe;
            var lose = probe && probe.getExtension && probe.getExtension('WEBGL_lose_context');
            if (lose) lose.loseContext();
        } catch (e) {
            glOK = false;
        }

        function finish() {
            var ms = Math.round(performance.now() - t0);
            var el = document.getElementById('summary');
            el.className = failed ? 'bad' : 'ok';
            el.textContent = (failed ? '✗ ' + failed + ' failed, ' + passed + ' passed'
                                     : '✓ ' + passed + ' passed')
                + (skipped ? ', ' + skipped + ' skipped' : '')
                + ' — ' + ms + 'ms';
            window.DONE = true;
            window.PASSED = passed;
            window.FAILED = failed;
            window.SKIPPED = skipped;
        }

        if (!glOK) {
            skip('every WebGL test', 'no WebGL context on this machine');
            note('The source checks above still ran. For the compile tests, open this');
            note('page in a browser with WebGL, or headless Chromium on SwiftShader.');
            finish();
            return;
        }

        /* ── the real thing ─────────────────────────────────────────────────

           three.js does not throw when a program fails to link: it writes to
           console.error and carries on drawing nothing. That is exactly why a
           screenshot is not proof a shader compiled, and it is why this suite
           watches the console as well as asking the driver directly. */
        var caught = [];
        var realError = console.error;
        console.error = function () {
            caught.push(Array.prototype.slice.call(arguments).join(' '));
            realError.apply(console, arguments);
        };

        function drainErrors() {
            var got = caught.slice();
            caught.length = 0;
            return got;
        }

        // Ask the driver, rather than believing three.js's silence.
        function unlinkedPrograms() {
            var gl = renderer.getContext(), bad = [];
            renderer.info.programs.forEach(function (p) {
                if (!p.program) return;
                if (!gl.getProgramParameter(p.program, gl.LINK_STATUS)) {
                    bad.push(p.name || '(unnamed)');
                }
            });
            return bad;
        }

        // A hole that actually has water on it, so the water shader is in the
        // scene rather than merely constructed.
        function holeWithWater() {
            for (var i = 0; i < G3.COURSES.length; i++) {
                var c = G3.COURSES[i];
                for (var j = 0; j < c.holes.length; j++) {
                    if (c.holes[j].water && c.holes[j].water.length) {
                        return { course: c, hole: c.holes[j] };
                    }
                }
            }
            return null;
        }

        /* Everything from here needs the renderer, and every one of it runs
           inside the try/finally below: whatever happens — a throw we did not
           anticipate, a driver that dies halfway — the console gets handed
           back and the summary gets written. A suite is allowed to fail; it is
           not allowed to leave the page saying "running…". */
        try {

        var initOK = attempt('the renderer comes up', function () {
            canvas.width = 320; canvas.height = 200;
            R.init(canvas);
        }).ok;
        if (!initOK) return;
        assert('the renderer comes up', !!R.state.renderer && R.state.ready);

        renderer = R.state.renderer;

        var found = holeWithWater();
        assert('there is a hole with water to test against', !!found);

        function renderOnce() {
            renderer.render(R.state.scene, R.state.camera);
        }

        if (found) {
            var themeName = found.course.theme;

            /* Both water paths, built and drawn the way the game builds and
               draws them. The plain one matters as much as the pretty one and
               is the easier of the two to break unnoticed: nobody screenshots
               the cheap path. */
            [true, false].forEach(function (pretty) {
                var label = pretty ? 'pretty' : 'plain';
                drainErrors();
                var built = attempt('the ' + label + ' hole builds and draws', function () {
                    R.setWaterQuality(pretty);
                    R.buildHole(found.hole, themeName, null);
                    renderOnce();
                });
                if (!built.ok) return;

                assert('the ' + label + ' water shader is on the hole',
                    R.state.waterMats.length > 0);
                assert('the ' + label + ' water material agrees with the switch',
                    R.state.waterMats.every(function (m) {
                        return ('PRETTY' in m.defines) === pretty;
                    }));

                var errs = drainErrors();
                assert('building and drawing the ' + label + ' sea logs nothing',
                    errs.length === 0, errs.join(' | ').slice(0, 400));
                var bad = unlinkedPrograms();
                assert('every program links with the ' + label + ' sea',
                    bad.length === 0, bad.join(', '));
            });

            /* The switch itself. Flipping it marks the live materials for
               recompile rather than rebuilding the hole, which is a different
               code path from either of the two above and the one a player
               actually takes. */
            section('THE WATER SWITCH');
            var switchReady = attempt('a pretty hole to flip the switch on', function () {
                R.setWaterQuality(true);
                R.buildHole(found.hole, themeName, null);
                renderOnce();
            }).ok;
            drainErrors();

            if (switchReady) {
            R.setWaterQuality(false);
            renderOnce();
            var offErrs = drainErrors();
            assert('turning the fancy water off recompiles cleanly',
                offErrs.length === 0 && unlinkedPrograms().length === 0,
                offErrs.join(' | ').slice(0, 400));
            assert('and the materials lost the define',
                R.state.waterMats.every(function (m) { return !('PRETTY' in m.defines); }));

            R.setWaterQuality(true);
            renderOnce();
            var onErrs = drainErrors();
            assert('turning it back on recompiles cleanly',
                onErrs.length === 0 && unlinkedPrograms().length === 0,
                onErrs.join(' | ').slice(0, 400));
            assert('and the materials got it back',
                R.state.waterMats.every(function (m) { return 'PRETTY' in m.defines; }));
            }

            /* And the other half of the ridge boundary, against the real
               geometry: every range the build put in the scene carries a
               `tint` for every vertex it has. A missing attribute is not a
               compile error — it reads as zero, and a black mountain range on
               a blue sky is the sort of thing a screenshot of the tee will not
               show you. */
            section('THE HILLS ON THE HORIZON');
            (function () {
                var ranges = [];
                R.state.holeGroup.traverse(function (o) {
                    if (o.material && o.material.vertexShader === SH.RIDGE_VS) ranges.push(o);
                });
                assert('the themed hole built its ranges', ranges.length === 2,
                    ranges.length + ' found');
                ranges.forEach(function (m, i) {
                    var pos = m.geometry.attributes.position;
                    var tint = m.geometry.attributes.tint;
                    assert('range ' + i + ' has a tint for every vertex',
                        !!tint && tint.count === pos.count,
                        tint ? tint.count + ' vs ' + pos.count : 'no tint attribute');
                    assert('range ' + i + ' is not left black',
                        !!tint && Array.prototype.some.call(tint.array, function (v) { return v > 0.02; }));
                    assert('range ' + i + ' is out past the fog', !m.material.fog);
                });
            })();

            /* The turf stack's JS half, against the materials the build made.

               `fwidth` is core in WebGL 2 and an extension in WebGL 1, and a
               shader that uses it without declaring the extension does not
               compile there — silently, the way every GLSL failure in here
               fails. This machine may well be on a WebGL 2 context, in which
               case nothing below would ever notice the declaration going
               missing; asserting it is the only thing standing between that
               and a phone with a blank course on it. */
            section('THE TURF STACK');
            (function () {
                var sets = R.state.surf && R.state.surf.shells;
                if (!sets) { skip('the shell materials', 'no surfaces built'); return; }
                Object.keys(sets).forEach(function (kind) {
                    var mats = sets[kind];
                    assert(kind + ' has a stack of shells', mats.length > 1);
                    assert(kind + "'s shells declare the derivatives extension",
                        mats.every(function (m) {
                            return m.extensions && m.extensions.derivatives === true;
                        }));
                    assert(kind + "'s shells carry both uniforms across",
                        mats.every(function (m) {
                            return typeof m.userData.mowK === 'number' &&
                                m.userData.shellFar && m.userData.shellFar.isVector3;
                        }));
                    /* And the far colour is a correction rather than a repaint:
                       the layer it multiplies is the one standing in for the
                       stack, so it is near 1 and never wild. A zero here is a
                       course that goes black at distance. */
                    assert(kind + "'s far colour is a nudge, not a repaint",
                        mats.every(function (m) {
                            var v = m.userData.shellFar;
                            return v.x > 0.2 && v.x < 5 && v.y > 0.2 && v.y < 5 &&
                                v.z > 0.2 && v.z < 5;
                        }));
                });
            })();

            /* Uniforms, now that a real material exists to compare the source
               against. Checked in both directions, because the two failures
               look nothing alike and both are silent until they are not. */
            section('UNIFORMS, AGAINST A REAL MATERIAL');
            if (!R.state.waterMats.length) {
                skip('the uniform comparison', 'no water material survived the build');
            } else {
                var wu = R.state.waterMats[0].uniforms;
                waterDecl.forEach(function (n) {
                    if (BUILT_IN.indexOf(n) > -1) return;
                    assert('the water material supplies `' + n + '`', wu[n] !== undefined);
                });
                Object.keys(wu).forEach(function (n) {
                    assert('the water shader still reads `' + n + '`',
                        usesName(SH.WATER_FS, n) || usesName(SH.WATER_VS, n));
                });
            }

            if (R.state.sky) {
                var su = R.state.sky.uniforms;
                skyDecl.forEach(function (n) {
                    if (BUILT_IN.indexOf(n) > -1) return;
                    assert('the sky material supplies `' + n + '`', su[n] !== undefined);
                });
            }

            /* And one frame through the real per-frame path, which is where
               the uniform writes live — `u.skyTop.value` on a material that
               never declared skyTop is a TypeError, and it happens on frame
               one of a hole nobody may have loaded yet. */
            section('A FRAME, THE WAY THE GAME DRAWS ONE');
            if (!R.state.waterMats.length) {
                skip('the frame test', 'no water material survived the build');
            } else {
                var before = R.state.waterMats[0].uniforms.time.value;
                drainErrors();
                var ran = attempt('render.frame() runs without throwing', function () {
                    var world = P.createWorld(found.hole,
                        { x: found.hole.tee.x, z: found.hole.tee.z }, 0);
                    R.frame(0.016, world, { yaw: 0, power: 0 });
                    R.frame(0.016, world, { yaw: 0, power: 0 });
                });
                if (ran.ok) {
                    assert('render.frame() runs without throwing', true);
                    assert('and it advances the water clock',
                        R.state.waterMats[0].uniforms.time.value > before);
                }
                var frameErrs = drainErrors();
                assert('and it logs nothing', frameErrs.length === 0,
                    frameErrs.join(' | ').slice(0, 400));
            }

            /* Nothing is compiled while a hole is played (v1.176.0).

               three.js compiles a program the first time something wearing
               its material is drawn, and the page waits for the driver while
               it does. Two things made that happen in the middle of a hole.
               The bag's lamps left the scene whenever the bag was put away
               (the flyover, the victory lap, the dive, the replay) and the
               picker's two passes each counted only half the lights — and a
               lit material's program is compiled for a count of lights, so
               each of those was the whole course compiled again. And nothing
               was compiled before it was first shown. render.js now compiles
               a hole as it is built (warmPrograms) for the one count of
               lights there is (bag.js lightRig, render.js passLights). */
            section('NOTHING IS COMPILED WHILE A HOLE IS PLAYED');
            if (!G3.bag || !G3.bag.state || !G3.bag.state.ready) {
                skip('the warm-up tests', 'the bag did not build on this page');
            } else {
                // A hole with rails enough to be worth counting.
                var plainRail = function (w) {
                    return (!w.kind || w.kind === 'rail') &&

                }
                if (R.state.fx && G3.postfx.setPortal) {
                    G3.postfx.setPortal({ k: 0.5, open: 1, inCol: 0xf0a868, outCol: 0x1b2a55 });
                    R.frame(1 / 60, world, { yaw: 0, power: 0 });
                    G3.postfx.setPortal(null);
                }
                assert('startDive starts and opens a black hole at the cup', ok && bhSeen);
                assert('dive camera arches up over the green and plunges down into the hole',
                    maxY > y0 && minY < R.state.cupTop - 0.5);
                assert('dive drives the portal transition to completion in sync',
                    portalSeen && portalMax > 0.99 && doneCount === 1);
                if (R.state.fx) assert('cup black hole bends the green around it (postfx lens)', lensSeen);
                var errs = drainErrors(), bad = unlinkedPrograms();
                assert('black hole dive and portal shader render with no GL errors',
                    errs.length === 0 && bad.length === 0, errs.concat(bad).join(' | ').slice(0, 400));
            })();
        }

        /* The life on the long game (life.js) and the wind in the trees. A
           pond hole on the parkland, because it is the one place every kind
           of it turns up at once: a flock overhead, a pair of ducks on the
           water, butterflies over the flowers, and trees. Then a mini golf
           lane, where none of it belongs. And then frames, because all of it
           is only worth having if it moves. */
        if (glOK) {
            section('THE WORLD IS ALIVE');
            var pond = G3.COURSES.filter(function (c) { return c.id === 'parkland'; })[0];
            var lifeRun = attempt('a dressed hole builds and draws', function () {
                drainErrors();
                R.buildHole(pond.holes[3], pond.theme, null);
                renderOnce();
            });
            assert('a dressed hole builds and draws clean',
                lifeRun.ok && drainErrors().length === 0 && unlinkedPrograms().length === 0,
                lifeRun.err ? lifeRun.err.message : '');
            if (lifeRun.ok && G3.life) {
                var census = G3.life.census();
                assert('a flock circles the long game', census.birds >= 5, census.birds + ' birds');
                assert('ducks paddle on its pond', census.ducks >= 2, census.ducks + ' ducks');
                assert('butterflies over its flowers', census.butterflies >= 1, census.butterflies + ' butterflies');
                assert('its trees are hung to sway', R.state.canopies.length >= 4, R.state.canopies.length + ' crowns');

                var crown = R.state.canopies[0].g, tilt0 = crown.rotation.x + crown.rotation.z;
                var bird = G3.life.peek().bird, b0 = bird ? bird.position.clone() : null;
                var w2 = P.createWorld(pond.holes[3], { x: pond.holes[3].tee.x, z: pond.holes[3].tee.z }, 0);
                for (var fi = 0; fi < 30; fi++) R.frame(0.05, w2, { yaw: 0, power: 0 });
                assert('and they move with the clock',
                    !!bird && bird.position.distanceTo(b0) > 0.2 &&
                    Math.abs(crown.rotation.x + crown.rotation.z - tilt0) > 1e-4);
            }
            /* And the drawn holes, which get a world of their theme's own
               round the slab instead (life.js → the worlds round the drawn
               holes). Every one of them, because each theme is its own recipe
               and a recipe nobody built is a recipe nobody knows throws.

               Three things are asked of each. It is there: props, and at
               least one thing that moves. It is not the long game's: no ducks,
               no butterflies — those belong to dressing a fairway. And it is
               out of the way: no vertex of any prop stands within a unit of the
               hole's own footprint, where the ball could pass through it, or in
               the corridor behind the tee the camera watches the shot from. */
            var drawnThemes = 0, drawnCourses = 0, worldFault = '';
            G3.COURSES.forEach(function (course) {
                if (course.group === 'long' || !course.holes[0] || course.holes[0].open) return;
                var h = course.holes[0];
                drawnCourses++;
                var ok = attempt(course.id + ': its world builds', function () {
                    R.buildHole(h, course.theme, null);
                    for (var k = 0; k < 4; k++) R.frame(0.25, P.createWorld(h, { x: h.tee.x, z: h.tee.z }, 0), { yaw: 0, power: 0 });
                });
                if (!ok.ok || !G3.life) return;
                drawnThemes++;
                var c = G3.life.census();
                if (!worldFault && !(c.props > 50 && c.rigs + c.birds > 0)) {
                    worldFault = course.id + ' has no world: ' + JSON.stringify(c);
                }
                if (!worldFault && c.ducks + c.butterflies > 0) {
                    worldFault = course.id + ' was dressed like a fairway: ' + JSON.stringify(c);
                }
                var b = h.bounds, dx = h.cup.x - h.tee.x, dz = h.cup.z - h.tee.z, L = Math.hypot(dx, dz);
                var ux = dx / L, uz = dz / L, v = new THREE.Vector3();
                G3.life.peek().world.forEach(function (m) {
                    var pa = m.geometry.attributes.position;
                    for (var i = 0; i < pa.count && !worldFault; i++) {
                        v.fromBufferAttribute(pa, i);
                        if (v.x > b.minX - 1 && v.x < b.maxX + 1 && v.z > b.minZ - 1 && v.z < b.maxZ + 1) {
                            worldFault = course.id + ': a prop stands on the hole at (' +
                                v.x.toFixed(1) + ', ' + v.z.toFixed(1) + ')';
                        }
                        var ax = v.x - h.tee.x, az = v.z - h.tee.z;
                        var along = ax * ux + az * uz, across = Math.abs(ax * uz - az * ux);
                        if (!worldFault && along < 1 && along > -14 && across < 5.5) {
                            worldFault = course.id + ': a prop stands behind the tee, in the shot';
                        }
                    }
                });
            });
            assert('every drawn theme has a world round its holes', drawnCourses >= 9 && drawnThemes === drawnCourses && !/no world|fairway/.test(worldFault),
                drawnThemes + ' themes; ' + worldFault);
            assert('and nothing in it stands on a hole or between the camera and the shot', !worldFault, worldFault);
        }

        /* The World Tour's holes: every one builds with its simple set piece
           (worlds.js — what stands round a hole until its live world has
           loaded, and for good where it never does) and draws a frame
           without a word from the driver. The live worlds themselves are
           another renderer and another three.js (backdrop.mjs) and are not
           this suite's to compile. */
        if (G3.portals && G3.worlds) {
            section('WORLD TOUR');
            drainErrors();
            var tourFault = '', tourCount = 0;
            G3.portals.WORLDS.forEach(function (w) {
                if (tourFault) return;
                var got = attempt(w.id + ' builds', function () {
                    R.buildHole(w.hole, w.theme, null);
                    renderOnce();
                });
                var errs = drainErrors();
                if (!got.ok || errs.length || unlinkedPrograms().length) {
                    tourFault = w.id + ': ' + errs.join(' | ').slice(0, 300);
                    return;
                }
                if (!G3.worlds.SCENES[w.hole.scene]) { tourFault = w.id + ' has no set piece'; return; }
                if (!R.state.outer || R.state.outer.children.length < 2) { tourFault = w.id + ' has no outer group to put away'; return; }
                tourCount++;
            });
            assert('every tour hole builds with its set piece and draws clean',
                !tourFault && tourCount === G3.portals.WORLDS.length, tourFault);
            assert('with no live world drawn, the hole keeps its own sky',
                R.state.live === false && R.state.outer.visible === true && !R.state.scene.background);
        }

        if (glOK && G3.BALLS) {
            section('GOLF BALL COSMETICS & SHADERS');
            drainErrors();
            var hBall = G3.courseById('mini').holes[0];
            R.buildHole(hBall, 'seaside', null);
            assert('upgraded base ball sphere has denser geometry and casts shadows',
                R.state.ball && R.state.ball.castShadow === true &&
                R.state.ball.geometry.attributes.position.count >= 1500,
                R.state.ball ? R.state.ball.geometry.attributes.position.count + ' verts' : 'no ball');

            var ballFault = '';
            G3.BALLS.forEach(function (b) {
                if (ballFault) return;
                var ran = attempt('equip & render ball ' + b.id, function () {
                    R.setBallStyle(b.id);
                    renderOnce();
                });
                var errs = drainErrors(), bad = unlinkedPrograms();
                if (!ran.ok || errs.length || bad.length) {
                    ballFault = b.id + ': ' + (ran.err ? ran.err.message : errs.concat(bad).join(' | ')).slice(0, 300);
                }
            });
            assert('all ' + G3.BALLS.length + ' ball cosmetics and shaders compile and render clean',
                !ballFault, ballFault);

            // Check player color tinting (pass-and-play P2 -> P1) + night theme glass rendering
            var tintFault = attempt('pass-and-play tint + night crystal glass render', function () {
                R.setBallStyle('crystal-glass');
                R.setBallColour(0xff7d6b);
                renderOnce();
                R.buildHole(G3.courseById('neon').holes[0], 'neon', null);
                R.setBallColour(0xffffff);
                renderOnce();
                R.setBallStyle('black-hole');
                renderOnce();
                R.setBallStyle('tour-white');
                renderOnce();
            });
            assert('glass, singularity and pass-and-play tinting render clean day and night',
                tintFault.ok && drainErrors().length === 0 && unlinkedPrograms().length === 0,
                tintFault.err ? tintFault.err.message : '');

            // Exercise shop 3D preview renderer briefly
            var pvCanvas = document.createElement('canvas');
            pvCanvas.width = 160; pvCanvas.height = 160;
            var pvRun = attempt('shop 3D preview ticks holo & glass shaders cleanly', function () {
                var pv = R.createBallPreview(pvCanvas);
                if (!pv) return;
                pv.setStyle('holo-prism'); pv.tick(0.016, false);
                pv.setStyle('crystal-glass'); pv.tick(0.016, false);
                pv.setStyle('black-hole'); pv.tick(0.016, false);
                pv.dispose();
            });
            assert('shop 3D preview compiles and disposes without errors',
                pvRun.ok && drainErrors().length === 0,
                pvRun.err ? pvRun.err.message : '');
        }

        } catch (e) {
            assert('the suite runs to the end', false,
                e.message + ' @' + ((e.stack || '').split('\n')[1] || '').trim());
        } finally {
            console.error = realError;
            finish();
        }
    })();
    </script>
</body>
</html>
