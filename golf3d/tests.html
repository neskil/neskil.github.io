            assert('too much bend over-cooks it, the way shape() reads an over-cooked draw (early)',
                read(gesture(0.3, 0.3, 200 * (S.BOW.IDEAL + S.BOW.TOL + S.BOW.SPAN)), 'off', both).shape.off === -1);
            assert('a club that cannot draw does not, however it is swiped',
                read(gesture(0.3, 0.3, 36), 'off', ['fade']).shape === null);
            assert('with shapes off, a bow is no shape', read(gesture(0.3, 0.3, 36), 'off', null).shape === null);

            // The gate it makes, and the card it writes.
            var gate = SW.swipeGate(read(gesture(0.3, 0.3, 36), 'off', both));
            assert('a swiped shape travels with its gate', gate.shapeName === 'draw' && gate.shapeOff === 0 && gate.swipe);
            assert('a lazy swing carries its lost distance', SW.swipeGate(lazy).weight === lazy.weight);
            var rep = SW.swipeReport(lazy, { frac: 0.8 });
            assert('the card names the line, the tempo and the power',
                rep.length === 3 && rep[0].what === 'Line' && rep[1].what === 'Tempo' && rep[2].what === 'Power', JSON.stringify(rep));
            assert('and says what was wrong with the tempo', /lazy/.test(rep[1].says) && rep[1].tier !== 'good');
            assert('and what it cost', /−\d+%/.test(rep[2].says), rep[2].says);
            assert('in lines short enough for a small card',
                rep.every(function (r) { return r.says.length <= 26; }), JSON.stringify(rep));

            /* A scribble is not a swing. */
            (function () {
                var clean = gesture(0.3, 0.22);
                assert('a clean pull and swipe is not a scribble',
                    !SW.swipeMess(clean.pts, 0, 200).junk && SW.swipeMess(clean.pts, 0, 200).turns === 1);
                assert('nor is a bowed one, or a lazy one',
                    !SW.swipeMess(gesture(0.3, 0.3, 200 * (C.SWIPE.BOW.IDEAL + C.SWIPE.BOW.TOL)).pts, 0, 200).junk &&
                    !SW.swipeMess(gesture(0.15, 0.6).pts, 0, 200).junk);
                // Down, then loops: round and round on the way up.
                var pts = [], i, t = 0;
                for (i = 0; i <= 20; i++) pts.push([0, 10 * i, t += 0.01]);
                for (i = 1; i <= 80; i++) {
                    var a = i / 80 * Math.PI * 6;
                    pts.push([60 * Math.sin(a), 200 - 200 * i / 80 + 50 * Math.sin(a * 1.5), t += 0.01]);
                }
                var m = SW.swipeMess(pts, 0, 200);
                assert('loops and zig-zags are', m.junk, 'ratio ' + m.ratio.toFixed(2) + ', turns ' + m.turns);
                var tiny = [];
                for (i = 0; i <= 30; i++) tiny.push([(i % 2) * 2, 15 + (i % 3), i * 0.01]);
                assert('the shake in a thumb on a short putt is not', !SW.swipeMess(tiny, 0, 15).junk);
                var junky = SW.swipeRead({ pts: pts, x0: 0, y0: 0, low: { x: 0, y: 200 }, cross: { x: 0, y: 0, t: t },
                    through: [[0, 200], [0, 0]] }, { feel: 'normal', timing: 'snap', shapes: ['draw', 'fade'], rand: function () { return 0.1; } });
                assert('a scribble is read as junk, never as perfect', !!junky.junk && !junky.perfect);
                var jg = SW.swipeGate(junky);
                assert('and its gate carries it', jg.junk === junky.junk && !jg.perfect && SW.grade(jg).tier === 'bad');
                assert('the card says what it was', /scribble/.test(SW.swipeReport(junky)[0].says));
            })();
            (function () {
                var J = C.SWIPE.JUNK, seq, k;
                function roll(vals) { k = 0; seq = vals; return SW.swipeJunk(function () { return seq[k++ % seq.length]; }); }
                var duff = roll([0.1, 1, 1]), shank = roll([0.9, 0.1, 1, 1]);
                assert('a junk swing is a duff or a shank', duff.kind === 'duff' && shank.kind === 'shank');
                assert('a duff barely moves and goes about straight',
                    duff.power <= J.DUFF_POWER[1] && Math.abs(duff.yaw) <= J.DUFF_YAW + 1e-12);
                assert('a shank goes off sideways — right, usually — and not far',
                    shank.yaw < -J.SHANK_YAW[0] + 1e-12 && shank.power <= J.SHANK_POWER[1]);
                for (var i = 0; i < 200; i++) {
                    var j = SW.swipeJunk();
                    if (j.power > Math.max(J.DUFF_POWER[1], J.SHANK_POWER[1]) || j.power <= 0) {
                        assert('no junk swing goes far', false, JSON.stringify(j));
                        return;
                    }
                }
                assert('no junk swing goes far', true);
            })();
            var drawn = SW.swipeReport(read(gesture(0.3, 0.3, 36, 30), 'off', both));
            assert('a crooked shaped swipe reports the line and the shape', drawn[0].tier !== 'good' && drawn[1].what === 'Shape');
        })();

        section('The arcade arc');
        (function () {
            var SW = G3.swing, AR = C.ARC;
            // Run an arc: set the power at `power`, strike at `at` on the way back.
            function played(power, at, shape) {
                var a = SW.arcStart(shape);
                var guard = 0;
                while (a.phase === 'up' && a.pos < power && guard++ < 100000) SW.arcTick(a, 1 / 2000);
                SW.arcPress(a);
                while (!a.done && a.pos > at && guard++ < 200000) SW.arcTick(a, 1 / 2000);
                if (!a.done) SW.arcPress(a);
                return a;
            }

            var a = played(0.5, 0);
            assert('the second press sets the power where the needle was', approx(a.power, 0.5, 0.002));
            assert('a strike as it comes home is perfect', a.perfect && a.off === 0);
            var early = played(0.5, 0.3), late = played(0.5, -0.15);
            assert('early pulls and late pushes, as every miss does', early.off < 0 && late.off > 0);
            assert('a near miss costs less than a far one',
                Math.abs(played(0.5, a.win + 0.03).off) < Math.abs(early.off));

            var ran = SW.arcStart();
            var guard = 0;
            while (!ran.done && guard++ < 100000) SW.arcTick(ran, 1 / 200);
            assert('left alone it goes all the way round — the most power there is',
                ran.power === 1 && !ran.struck && ran.off === 1);

            assert('the power half of the dial is the meter, overdraw and all',
                SW.overOfFrac(SW.markAt()) < 1e-9 && approx(SW.overOfFrac(1), 1) && SW.overOfFrac(0.3) === 0);
            assert('the zone narrows past a full swing',
                played(SW.markAt() * 0.9, 0).win > played(1, 0).win);
            assert('a shape makes the zone the shape\'s, however soft the swing',
                played(0.4, 0, 'draw').over >= C.SHAPE.GATE);
            (function () {
                var worst = Infinity;
                for (var t = 0; t <= 1.0001; t += 0.05) worst = Math.min(worst, 2 * SW.arcWin(t) / AR.BACK);
                assert('there is time to react in the zone at every power', worst >= 0.15,
                    Math.round(worst * 1000) + 'ms');
            })();
            var g = SW.arcGate(played(0.5, 0.4));
            assert('a mistimed arc moves the ball even inside a full swing',
                SW.apply({ yaw: 0, power: 20 }, g).yaw !== 0 && g.arc);
        })();

        section('The needle');
        (function () {
            var SW = G3.swing, N = C.NEEDLE;
            var n = SW.needleStart(0);
            assert('it starts at the left edge', n.pos === -1);
            SW.needleTick(n, n.period / 4);
            assert('a quarter of a sweep later it is in the middle', approx(n.pos, 0, 1e-9));
            SW.needleTick(n, n.period / 4);
            assert('and at the right edge half a sweep in', approx(n.pos, 1, 1e-9));
            SW.needleTick(n, n.period / 2);
            assert('and back at the left after a whole one', approx(n.pos, -1, 1e-9));

            function tapAt(pos, over) {
                var m = SW.needleStart(over || 0);
                m.pos = pos;
                return SW.needlePress(m);
            }
            assert('a tap in the middle is perfect', tapAt(0).perfect && tapAt(N.WIN_MAX * 0.9).perfect);
            assert('left of it pulls, right of it pushes', tapAt(-0.6).off < 0 && tapAt(0.6).off > 0);
            var l = SW.apply({ yaw: 0, power: 20 }, SW.needleGate(tapAt(-0.7)));
            assert('and the ball goes the side the needle was on — left is left', l.yaw > 0);
            assert('the sweep quickens and the middle narrows the harder it is loaded',
                SW.needleStart(1).period < SW.needleStart(0).period && SW.needleStart(1).win < SW.needleStart(0).win);
            var worst = Math.min(SW.needleStart(0).win * SW.needleStart(0).period / 2,
                                 SW.needleStart(1).win * SW.needleStart(1).period / 2);
            assert('there is time to react in the middle at every power', worst >= 0.149,
                Math.round(worst * 1000) + 'ms');
            assert('the miss is bounded', Math.abs(tapAt(1).off) <= 1 && Math.abs(tapAt(-1).off) <= 1);
        })();

        section('The strike grade');
        (function () {
            var SW = G3.swing;
            assert('no gate, no grade', SW.grade(null) === null);
            assert('a clean strike is perfect', SW.grade({ struck: true, perfect: true, off: 0 }).word === 'Perfect');
            assert('a near miss is great, then good',
                SW.grade({ struck: true, off: 0.1 }).tier === 'great' && SW.grade({ struck: true, off: -0.3 }).tier === 'good');
            assert('a real miss names the side', SW.grade({ struck: true, off: -0.6 }).word === 'Pulled' &&
                SW.grade({ struck: true, off: 0.6 }).word === 'Pushed');
            assert('the worst is sprayed, and not swinging is a whiff',
                SW.grade({ struck: true, off: 1 }).word === 'Sprayed' && SW.grade({ struck: false, off: 1 }).word === 'Whiff');
            assert('a junk swing says which it was',
                SW.grade({ struck: true, off: 0, junk: { kind: 'duff' } }).word === 'Duffed' &&
                SW.grade({ struck: true, off: 0, junk: { kind: 'shank' } }).word === 'Shanked');
        })();

        /* ── scoring ───────────────────────────────────────────────────── */

        section('Shot shaping');
        (function () {
            var SW = G3.swing;
            /* A long flat field with nothing on it, so the only thing bending
               the ball is the spin it was asked for. */
            var field = {
                pads: [A.pad(-60, -10, 120, 160, 0, 'fairway', 0, 0)],
                water: [], walls: [], tee: { x: 0, z: 0, y: 0 }, cup: { x: 0, z: 140, y: 0 }
            };
            var from = { x: 0, z: 0, y: C.BALL_R };
            function club(id) { return C.CLUBS.filter(function (c) { return c.id === id; })[0]; }

            // Where it lands, how far it strays from the aim (+z) on the way,
            // and where it stops. x is left of the line, because +yaw is left.
            function fly(cl, frac, name, off) {
                var shot = { yaw: 0, power: cl.power * frac, spin: 0 };
                var s = SW.shape(shot, name, cl.loft, cl.bite, P.gravityOf(field), off, field);
                var w = P.createWorld(field, from, 0), lo = 0, hi = 0, top = 0, i;
                P.launch(w, s.yaw, s.power, s.loft, s.bite, s.topped);
                w.spin = s.spin;
                for (i = 0; i < 2000 && !w.firstLand; i++) {
                    P.advance(w, C.SIM_DT, {});
                    lo = Math.min(lo, w.ball.x); hi = Math.max(hi, w.ball.x); top = Math.max(top, w.ball.y);
                }
                var land = w.firstLand || w.ball;
                P.settle(w);
                return { shot: s, landX: land.x, carry: land.z, lo: lo, hi: hi, top: top,
                         restX: w.ball.x, rest: w.ball.z };
            }

            assert('straight is untouched',
                (function () { var s = SW.shape({ yaw: 0.3, power: 20, spin: 0 }, 'straight', 0.2, 0, C.GRAVITY);
                    return s.yaw === 0.3 && s.spin === 0 && s.bend === 0 && s.power === 20 && s.loft === 0.2; })());
            assert('a flat club cannot bend one — it never leaves the ground',
                SW.shape({ yaw: 0, power: 8, spin: 0 }, 'draw', 0, 0, C.GRAVITY).spin === 0);
            assert('every shape a club offers is one swing.js knows',
                C.CLUBS.every(function (c) {
                    return (c.shapes || []).every(function (n) { return SW.SHAPES.indexOf(n) > 0; });
                }));

            /* The challenge: a shape is never free. Straight inside a full
               swing is the one shot that plays without a strike. */
            assert('a straight full swing needs no strike', !SW.armsShape('straight', 0));
            assert('any shape does, even at half a swing',
                SW.SHAPES.slice(1).every(function (n) { return SW.armsShape(n, 0); }));
            assert('and its gate is at least as hard as SHAPE.GATE, or the overdraw if harder',
                SW.shapeOver('draw', 0) === C.SHAPE.GATE && SW.shapeOver('draw', 0.9) === 0.9 &&
                SW.shapeOver('straight', 0) === 0);

            ['driver', 'iron'].forEach(function (id) {
                var cl = club(id);
                [1, 0.5].forEach(function (frac) {
                    var tag = cl.name + ' at ' + Math.round(frac * 100) + '%';
                    var d = fly(cl, frac, 'draw'), f = fly(cl, frac, 'fade'), st = fly(cl, frac, 'straight');
                    /* The whole promise: aim at it and the shape is how the
                       ball gets there, not where it goes instead. */
                    assert(tag + ': a clean draw lands back on the line',
                        Math.abs(d.landX) < 0.06 * d.carry, d.landX.toFixed(2) + ' off at ' + d.carry.toFixed(1));
                    assert(tag + ': and so does a clean fade',
                        Math.abs(f.landX) < 0.06 * f.carry, f.landX.toFixed(2) + ' off at ' + f.carry.toFixed(1));
                    // Out right and back is a draw; out left and back a fade.
                    assert(tag + ': a draw bows out right of the line on the way',
                        d.lo < -0.03 * d.carry && d.hi < 0.02 * d.carry, d.lo.toFixed(2) + ' / ' + d.hi.toFixed(2));
                    assert(tag + ': a fade bows out left',
                        f.hi > 0.03 * f.carry && f.lo > -0.02 * f.carry, f.lo.toFixed(2) + ' / ' + f.hi.toFixed(2));
                    assert(tag + ': a shaped shot carries about as far as a straight one',
                        Math.abs(d.carry - st.carry) < 0.05 * st.carry && Math.abs(f.carry - st.carry) < 0.05 * st.carry);
                    assert(tag + ': a fade finishes shorter than a draw',
                        f.rest < d.rest - 0.5, f.rest.toFixed(1) + ' vs ' + d.rest.toFixed(1));
                    /* And the timing is what decides it. Early over-turns the
                       draw into a hook, left of the line; late leaves it
                       hanging out right. */
                    var early = fly(cl, frac, 'draw', -0.6), late = fly(cl, frac, 'draw', 0.6);
                    assert(tag + ': an early draw hooks past the line, a late one hangs out',
                        early.landX > 0.04 * early.carry && late.landX < -0.04 * late.carry,
                        early.landX.toFixed(2) + ' / ' + late.landX.toFixed(2));
                    var fe = fly(cl, frac, 'fade', -0.6), fl = fly(cl, frac, 'fade', 0.6);
                    assert(tag + ': an early fade never turns back, a late one slices',
                        fe.landX > 0.04 * fe.carry && fl.landX < -0.04 * fl.carry,
                        fe.landX.toFixed(2) + ' / ' + fl.landX.toFixed(2));
                });
            });

            ['iron', 'chipper'].forEach(function (id) {
                var cl = club(id), st = fly(cl, 1, 'straight');
                var bs = fly(cl, 1, 'backspin'), thin = fly(cl, 1, 'backspin', 0.8);
                var tp = fly(cl, 1, 'topped'), under = fly(cl, 1, 'topped', 0.8);
                assert(cl.name + ': backspin stops it nearer where it lands',
                    bs.rest - bs.carry < 0.6 * (st.rest - st.carry),
                    (bs.rest - bs.carry).toFixed(1) + ' vs ' + (st.rest - st.carry).toFixed(1));
                assert(cl.name + ': and a thin one does not',
                    thin.rest - thin.carry > bs.rest - bs.carry + 0.3);
                // Runs for its carry: more of a topped shot is on the ground.
                assert(cl.name + ': topped flies low and runs',
                    tp.top < 0.6 * st.top && (tp.rest - tp.carry) / tp.carry > (st.rest - st.carry) / st.carry,
                    tp.top.toFixed(2) + ' vs ' + st.top.toFixed(2) + '; ran ' + (tp.rest - tp.carry).toFixed(2) +
                    ' (carry ' + tp.carry.toFixed(2) + ') vs ' + (st.rest - st.carry).toFixed(2) + ' (carry ' + st.carry.toFixed(2) + ')');
                assert(cl.name + ': get under a topped one and it climbs',
                    under.top > tp.top * 1.3);
            });

            /* The flight itself (CONFIG.AIR_*): a long club's launch is lifted
               and the lift wears off, so a drive tops out past halfway and
               comes down steeper than it went up. A pitch is still a plain
               arc, and a topped drive gets no lift at all. */
            (function () {
                function arc(cl, topped) {
                    var w = P.createWorld(field, from, 0), top = 0, topZ = 0, vy = 0, vz = 0, t = 0, i;
                    P.launch(w, 0, cl.power, cl.loft, 0, topped);
                    for (i = 0; i < 4000 && !w.firstLand; i++) {
                        vy = w.ball.vy; vz = w.ball.vz;
                        P.advance(w, C.SIM_DT, {});
                        t += C.SIM_DT;
                        if (w.ball.y > top) { top = w.ball.y; topZ = w.ball.z; }
                    }
                    return { at: topZ / w.firstLand.z, fall: Math.atan2(-vy, vz), top: top, t: t };
                }
                var dr = club('driver'), pw = club('chipper'), d = arc(dr), p = arc(pw), tp = arc(dr, true);
                assert('a drive tops out past halfway', d.at > 0.53, (d.at * 100).toFixed(0) + '%');
                assert('…and comes down steeper than it went up', d.fall > dr.loft * 1.6,
                    (d.fall * 180 / Math.PI).toFixed(0) + '° against ' + (dr.loft * 180 / Math.PI).toFixed(0) + '°');
                assert('…for as long as hangTime says', Math.abs(P.hangTime(field, dr.power, dr.loft) - d.t) < 0.03,
                    P.hangTime(field, dr.power, dr.loft).toFixed(3) + ' against ' + d.t.toFixed(3));
                assert('a pitch is still a plain arc', Math.abs(p.at - 0.5) < 0.02 && !P.flies(field, pw.loft),
                    (p.at * 100).toFixed(1) + '%');
                assert('a drive struck topped is not lifted', tp.top < d.top * 0.6 && Math.abs(tp.at - 0.5) < 0.02,
                    tp.top.toFixed(2) + ' against ' + d.top.toFixed(2));
            })();

            /* The preview is the shot: the same shape, previewed, lands where
               it is played. */
            (function () {
                var cl = club('driver');
                var s = SW.shape({ yaw: 0, power: cl.power, spin: 0 }, 'draw', cl.loft, cl.bite, P.gravityOf(field), 0, field);
                var w = P.createWorld(field, from, 0);
                var pts = P.previewPath(w, s.yaw, s.power, s.loft, 2, s.bite, s.spin, s.topped);
                var end = pts[pts.length - 1], played = fly(cl, 1, 'draw');
                assert('the preview of a draw lands where the draw does',
                    Math.hypot(end.x - played.landX, end.z - played.carry) < 0.2,
                    end.x.toFixed(2) + ',' + end.z.toFixed(2) + ' vs ' + played.landX.toFixed(2) + ',' + played.carry.toFixed(2));
            })();

            /* A shaped miss is the gate's push as well as the shape's own. */
            (function () {
                var cl = club('driver');
                var g = SW.start(SW.shapeOver('draw', 0));
                SW.press(g);                       // far too early
                var missed = SW.apply({ yaw: 0, power: cl.power }, g);
                assert('a mistimed shape is pushed or pulled like any miss',
                    !g.perfect && missed.yaw !== 0);
            })();
        })();

        section('The range and its swing school');
        (function () {
            var SC = G3.school, SW = G3.swing;
            var range = G3.courseById('range').holes[0];

            // Every board says the distance from the tee to the middle of its
            // green, to within half a unit: a green moved without its number
            // is a board that lies.
            assert('the range has five targets', (range.targets || []).length === 5);
            (range.targets || []).forEach(function (t) {
                var d = Math.hypot((t.x0 + t.x1) / 2 - range.tee.x, (t.z0 + t.z1) / 2 - range.tee.z);
                assert('the ' + t.dist + ' m board is ' + t.dist + ' m from the tee', Math.abs(d - t.dist) <= 0.5,
                       'measured ' + d.toFixed(2));
                // Off-centre: the 30 m green has the cup in the middle of it.
                var s = P.surfaceUnder(range, t.x0 + 1, t.z0 + 1, 5);
                assert('the ' + t.dist + ' m target is green underfoot', !!(s && s.pad.kind === 'green'));
            });
            assert('the range hands out the driver', range.bag && range.bag.indexOf('driver') === 0);

            // The line, then the gate: two lessons, because there is one gate.
            assert('the school teaches the line, then the gate',
                SC.LESSONS.length === 2 && !SC.LESSONS[0].gate && SC.LESSONS[1].gate);

            // "Load it for me" has to open the gate it is teaching, or the
            // button loads a shot that skips the lesson.
            SC.LESSONS.forEach(function (l) {
                var over = P.overdraw(l.load * 10, 10);
                assert(l.title + ': its preset ' + (l.gate ? 'arms' : 'stays out of') + ' the gate',
                       l.gate ? SW.arms(over) : !SW.arms(over), 'overdraw ' + over.toFixed(2));
            });

            // Progress: storage junk normalises, counts stop at the goal, and
            // completing reports once.
            var p = SC.normalise({ line: 99, tempo: -3, bogus: 4, fade: 2 });
            assert('progress is clamped and cleaned — a retired lesson included', p.line === 2 && p.tempo === 0 && !('fade' in p) && !('bogus' in p),
                   JSON.stringify(p));
            assert('a finished lesson is not credited again', SC.credit(p, 'line') === false && p.line === 2);
            assert('the next lesson is the first open one', SC.firstOpen(p) === 'tempo');
            var done = [SC.credit(p, 'tempo'), SC.credit(p, 'tempo'), SC.credit(p, 'tempo')];
            assert('a lesson completes on its last credit, once', done.join() === 'false,false,true');

            // Clean is a strike inside the window or near it; running out never is.
            function played(at) {
                var g = SW.start(0.5);
                while (g.pos < at && !g.done) SW.tick(g, 0.001);
                SW.press(g);
                return g;
            }
            var onLine = played(SW.markAt());
            assert('striking on the line is clean', SC.clean(onLine), 'off ' + onLine.off);
            var early = played(0.2);
            assert('a strike far from the line is not clean', !SC.clean(early), 'off ' + early.off);
            var ran = SW.start(0.5);
            while (!ran.done) SW.tick(ran, 0.01);
            assert('running out of swing is not clean', !SC.clean(ran));
            assert('the live step says what to do', /strike/i.test(SC.stepFor(SW.start(0.5))));
            assert('the why names the real bonus', /\d+% further/.test(SC.WHY), SC.WHY);
        })();

        section('Scoring and the save file');
        (function () {
            assert('one stroke is an ace', S.term(1, 3).kind === 'ace');
            assert('two under par is an eagle', S.term(1, 3).label === 'Hole in One!' && S.term(2, 4).label === 'Eagle');
            assert('one under par is a birdie', S.term(2, 3).label === 'Birdie');
            assert('par is par', S.term(3, 3).label === 'Par');
            assert('one over is a bogey', S.term(4, 3).label === 'Bogey');
            assert('three under is an albatross', S.term(2, 5).label === 'Albatross');
            assert('far over gives up and counts', S.term(9, 3).label === '+6');

            assert('level par formats as E', S.formatVsPar(0) === 'E');
            assert('over par keeps its sign', S.formatVsPar(3) === '+3');
            assert('under par keeps its sign', S.formatVsPar(-2) === '-2');

            var holes = G3.COURSES[0].holes;
            assert('course par is the sum of the holes', S.coursePar(holes) === holes.reduce(function (a, h) { return a + h.par; }, 0));

            var partial = [3, 2];
            var t = S.totals(partial, holes);
            assert('totals only count holes played', t.played === 2 && t.strokes === 5);
            assert('totals compare against the par of those holes',
                t.vsPar === 5 - (holes[0].par + holes[1].par));
            assert('an empty card totals zero', S.totals([], holes).played === 0);
            assert('a gap in the card is skipped', S.totals([3, undefined, 4], holes).played === 2);

            var card = holes.map(function (h) { return h.par; });
            var first = S.recordRound(S.emptySave(), 'seaside', card, holes);
            assert('a first round is always a record', first.isBest);
            assert('the record is the round total', first.save.courses.seaside.best === S.coursePar(holes));
            assert('rounds are counted', first.save.rounds === 1 && first.save.courses.seaside.rounds === 1);

            var worse = card.slice(); worse[0] += 4;
            var second = S.recordRound(first.save, 'seaside', worse, holes);
            assert('a worse round is not a record', !second.isBest);
            assert('a worse round leaves the record alone', second.save.courses.seaside.best === first.save.courses.seaside.best);
            assert('but it still counts as a round', second.save.rounds === 2);

            var better = card.slice(); better[0] = 1;
            var third = S.recordRound(second.save, 'seaside', better, holes);
            assert('a better round takes the record', third.isBest);
            assert('an ace is counted', third.save.aces === 1);
            assert('the best card is kept', third.save.courses.seaside.bestCard[0] === 1);

            var other = S.recordRound(third.save, 'quarry', G3.COURSES[1].holes.map(function (h) { return h.par; }), G3.COURSES[1].holes);
            assert('another course keeps its own record', other.save.courses.quarry.best !== undefined);
            assert('and does not disturb the first', other.save.courses.seaside.best === third.save.courses.seaside.best);
            assert('courseRecord returns an empty record for an unplayed course',
                S.courseRecord(S.emptySave(), 'works').best === null);

            /* A showcase is judged against par: two deals add up to different
               pars, and the fewest strokes would only ever be the easiest
               deal. More strokes and further under par is the better round. */
            var easy = [{ par: 2 }, { par: 2 }], hard = [{ par: 5 }, { par: 5 }];
            var sc1 = S.recordRound(S.emptySave(), 'showcase', [3, 3], easy, { byPar: true });
            var sc2 = S.recordRound(sc1.save, 'showcase', [4, 5], hard, { byPar: true });
            assert('a showcase record goes to the round furthest under par, not the fewest strokes',
                sc2.isBest && sc2.save.courses.showcase.bestVsPar === -1 &&
                sc2.save.courses.showcase.best === 9 && sc2.save.courses.showcase.rounds === 2);
            var sc3 = S.recordRound(sc2.save, 'showcase', [2, 2], easy, { byPar: true });
            assert('…and level par on an easy deal does not beat it',
                !sc3.isBest && sc3.save.courses.showcase.bestVsPar === -1);

            // Round-trip through localStorage under a scratch key, so running
            // the tests never costs anyone their records.
            var realKey = C.SAVE_KEY;
            C.SAVE_KEY = 'loftLinks.test.tmp';
            try {
                S.save(third.save);
                var back = S.load();
                assert('a save round-trips', back.courses.seaside.best === third.save.courses.seaside.best &&
                    back.aces === third.save.aces);
                localStorage.setItem(C.SAVE_KEY, '{not json');
                assert('a corrupt save loads as empty', S.load().rounds === 0);
                localStorage.setItem(C.SAVE_KEY, JSON.stringify({ courses: { seaside: { best: 'x' } }, rounds: 'y' }));
                assert('nonsense fields are dropped', S.load().courses.seaside.best === null);
                localStorage.removeItem(C.SAVE_KEY);
                assert('a missing save loads as empty', S.load().rounds === 0);
            } finally {
                C.SAVE_KEY = realKey;
            }
        })();

        /* ── the geometry audit ─────────────────────────────────────────── */

        /* Everything above asks whether a hole is built to the rules. This asks
           whether it would survive being *looked at* — the faults that are
           invisible to the ball and obvious in a screenshot: a crack between
           two pads, a boulder swallowed by the hump it is standing on, a pond
           drawn above its own bank. `js/audit.js` holds the rules and
           `turntable.html` prints them under the pictures of the same hole;
           what happens here is that the courses are held to zero of them, so a
           new hole cannot quietly ship one.

           Errors fail the build. Warnings do not — they are the cases that are
           usually deliberate (a bare step somebody meant, two stones of an
           outcrop leaning together) and the count is printed so that a jump in
           it is visible on the way past. */
        /* ── a hole in a link ────────────────────────────────────────── */

        /* custom.js → "a hole in a link": the editor's document in a URL
           fragment. A link somebody sends has to come back as the same hole,
           whatever it is called, and one mangled on the way has to be turned
           away rather than half-built. */
        section('A hole in a link');
        (function () {
            var L = G3.holeLink;
            assert('the link codec is there', !!(L && L.encode && L.decode));
            if (!L) return;
            var doc = {
                name: 'Ålands Bästa — ⛳ “loop”', par: 3, theme: 'skelter', weather: 'fair',
                pads: [{ x: 0, z: 0, w: 7, d: 18.123456, y: 0, kind: 'green' }],
                extra: [{ x: 1, z: 6, w: 2, d: 0.4, h: 0.6, base: -0.1, kind: 'rail' }],
                water: [], gaps: [], decor: [],
                warps: [{ x: 3, z: 5, tx: 3, tz: 14, r: 0.85, yaw: 0 }],
                loops: [],
                tee: { x: 3.5, z: 1.5 }, cup: { x: 3.5, z: 16 }
            };
            var code = L.encode(doc), back = L.decode(code);
            assert('a hole survives the trip, name and all',
                !!back && back.name === doc.name && back.pads.length === 1 && back.warps.length === 1);
            assert('…with its numbers to the millimetre', !!back && back.pads[0].d === 18.123);
            assert('…in characters a URL carries as they are', /^v1\.[A-Za-z0-9_-]+$/.test(code), code.slice(0, 40));
            assert('a mangled link is turned away', L.decode(code.slice(0, code.length - 9) + '!!') === null &&
                L.decode('v2.' + code.slice(3)) === null && L.decode('') === null);
            assert('a link is read off the fragment', !!L.fromHash('#hole=' + code));
            var h = A.build({ name: back.name, par: back.par, pads: back.pads, extra: back.extra,
                warps: back.warps, tee: back.tee, cup: back.cup });
            assert('and what comes back builds, pipe and all', h.walls.length > 0 && h.warps.length === 1);
        })();

        section('The geometry audit');
        (function () {
            var found = G3.audit.all();
            var errors = found.filter(function (f) { return f.sev === 'error'; });
            var warnings = found.filter(function (f) { return f.sev === 'warn'; });

            assert('every hole is clean of geometry errors', errors.length === 0,
                errors.slice(0, 4).map(function (f) {
                    return f.course + '/' + f.hole + ': ' + f.code + ' — ' + f.msg;
                }).join(' | ') + (errors.length > 4 ? ' (+' + (errors.length - 4) + ' more)' : ''));
            note(warnings.length + ' warnings across ' + ALL.length + ' holes' +
                (warnings.length ? ': ' + warnings.map(function (f) { return f.code; })
                    .filter(function (c, i, a) { return a.indexOf(c) === i; }).join(', ') : ''));

            /* And the audit has to be able to fail, or the assertion above is
               a green tick that means nothing. Each rule gets a hole built to
               break exactly it — the same exercise shader-tests.html runs on
               its own suite, and for the same reason. A test that cannot fail
               reads as coverage and is worse than none. */
            function bare(over) {
                var h = { name: 'probe', pads: over.pads, walls: over.walls || [],
                          water: over.water || [], tee: { x: 0.5, z: 0.5 }, cup: { x: 1, z: 1 } };
                return G3.audit.hole(h);
            }
            function caught(findings, code) {
                return findings.some(function (f) { return f.code === code; });
            }

            assert('a clean probe hole reports nothing',
                bare({ pads: [A.pad(0, 0, 6, 6), A.pad(6, 0, 6, 6)] }).length === 0);
            assert('…and a crack between two pads is caught',
                caught(bare({ pads: [A.pad(0, 0, 6, 6), A.pad(6.04, 0, 6, 6)] }), 'crack'));
            assert('…and a step too small for a rail',
                caught(bare({ pads: [A.pad(0, 0, 6, 6), A.pad(6, 0, 6, 6, 0.1)] }), 'bare-step'));
            assert('…and a pad narrower than the ball',
                caught(bare({ pads: [A.pad(0, 0, 6, 6), A.pad(6, 0, 0.2, 6)] }), 'sliver-pad'));
            assert('…and a rock the ground has closed over',
                caught(bare({ pads: [A.pad(0, 0, 6, 6, 1)],
                              walls: [A.crag(3, 3, { y: 0, h: 0.5 })] }), 'prop-sunk'));
            assert('…and one standing in mid-air',
                caught(bare({ pads: [A.pad(0, 0, 6, 6)],
                              walls: [A.crag(3, 3, { y: 1.4 })] }), 'prop-afloat'));
            assert('…and one standing on nothing at all',
                caught(bare({ pads: [A.pad(0, 0, 6, 6)],
                              walls: [A.crag(30, 30, { y: 0 })] }), 'prop-adrift'));
            assert('…and water lying over the grass',
                caught(bare({ pads: [A.pad(0, 0, 6, 6)],
                              water: [A.rect(1, 1, 3, 3, 0.4)] }), 'water-over-land'));
            assert('…and water with ground over all of it',
                caught(bare({ pads: [A.pad(0, 0, 6, 6)],
                              water: [A.rect(1, 1, 3, 3, -0.6)] }), 'water-hidden'));
            assert('…and the same wall twice',
                caught(bare({ pads: [A.pad(0, 0, 6, 6)],
                              walls: [A.wall(2, 2, 1, 0.3, 0.6), A.wall(2, 2, 1, 0.3, 0.6)] }),
                    'twin-wall'));
            assert('…and one stone drawn on top of another',
                caught(bare({ pads: [A.pad(0, 0, 6, 6)],
                              walls: [A.crag(3, 3, { y: 0 }), A.crag(3.1, 3.05, { y: 0 })] }),
                    'stone-on-stone'));

            /* The outcrop scatter is the reason the last of those exists, so
               it gets its own statement: `crags` rolls again rather than
               dropping a stone where one already is, and it is still the same
               outcrop every load. */
            var seeded1 = A.crags(0, 0, 3, 6, 99, { y: 0 });
            var seeded2 = A.crags(0, 0, 3, 6, 99, { y: 0 });
            assert('an outcrop is the same outcrop on every load',
                seeded1.every(function (c, i) {
                    return approx(c.x, seeded2[i].x, 1e-12) && approx(c.z, seeded2[i].z, 1e-12);
                }));
            assert('and no two of its stones are in the same place',
                !caught(bare({ pads: [A.pad(-9, -9, 18, 18)], walls: seeded1 }), 'stone-on-stone'));
        })();

        /* ── the plans ─────────────────────────────────────────────────── */

        /* The course picker draws every hole from the hole data, which means a
           hole whose bounds are wrong now has somewhere new to be wrong: it
           comes out as a green smear, or as a speck in the corner of an empty
           frame, and nobody notices until they open the picker. So every plan
           is drawn here and asked the two things a plan has to get right —
           that there is a course in the frame at all, and that the tee and the
           cup are both inside it. */
        section('The plans');
        (function () {
            if (!G3.minimap) { assert('minimap.js is loaded', false); return; }
            var W = 48, worstFill = 1, worstName = '', offEdge = 0, offName = '';
            var t0m = performance.now();
            ALL.forEach(function (entry) {
                var h = entry.hole, tag = entry.course.id + '/' + h.name;
                var cv = G3.minimap.render(h, W, W);
                var d = cv.getContext('2d').getImageData(0, 0, W, W).data;
                var on = 0, i;
                for (i = 3; i < d.length; i += 4) if (d[i] > 0) on++;
                var fill = on / (W * W);
                if (fill < worstFill) { worstFill = fill; worstName = tag; }

                /* And the two ends have to be on the paper. The frame is
                   grown from the same bounds the plan is drawn from, so a hole
                   whose tee wandered outside its own bounds — which is exactly
                   what happens when a fence is edited and the ground is not —
                   fails here rather than in a screenshot. */
                var b2 = h.bounds;
                if (h.tee.x < b2.minX - 2 || h.tee.x > b2.maxX + 2 ||
                    h.tee.z < b2.minZ - 2 || h.tee.z > b2.maxZ + 2 ||
                    h.cup.x < b2.minX - 2 || h.cup.x > b2.maxX + 2 ||
                    h.cup.z < b2.minZ - 2 || h.cup.z > b2.maxZ + 2) {
                    offEdge++; offName = tag;
                }
            });
            assert('every hole draws something', worstFill > 0.08,
                worstName + ' fills only ' + (worstFill * 100).toFixed(1) + '% of its frame');
            assert('the tee and the cup are inside the frame the plan is drawn from',
                offEdge === 0, offName + ' is outside its own bounds');
            assert('a plan is cached rather than redrawn',
                G3.minimap.map('seaside', 0, 32, 32) === G3.minimap.map('seaside', 0, 32, 32));
            note(ALL.length + ' plans drawn in ' + Math.round(performance.now() - t0m) + 'ms');
        })();

        /* ── the bot ───────────────────────────────────────────────────── */

        section('The bot plays every hole');
        (function () {
            /* The bot itself is js/bot.js — the same module the game's
               simulation mode plays with, which is the point: what passes here
               is what a player can watch happen. All this section owns is the
               claim made of it. */
            var BOT = G3.bot, sims = 0;

            assert('the bot module is loaded', !!BOT);

            function play(hole, maxStrokes, bag) {
                var r = BOT.play(hole, maxStrokes, bag);
                r.shots.forEach(function (sh) { sims += sh.sims || 0; });
                return r;
            }

            // The long courses rebuilt to the line in PLAN.md §0. One joins
            // this list when it meets it, and is held there from then on.
            var REBUILT = ['parkland', 'whinstone', 'dunmore', 'redstone'];
            var b0 = performance.now();
            ALL.forEach(function (entry) {
                var h = entry.hole;
                // Out of the bag the hole hands out, not out of the whole
                // bag: a hole that takes the loft away has to be solvable
                // without it, and that is exactly what this now says.
                var r = play(h, 8, G3.bagFor(h));
                assert(entry.course.id + '/' + h.name + ': the bot holes out with the clubs it has (par ' + h.par + ')',
                    r.sunk, r.sunk ? '' : 'gave up after ' + r.strokes + ' strokes');
                if (r.sunk) {
                    assert(entry.course.id + '/' + h.name + ': and does it in a plausible number of strokes',
                        r.strokes <= h.par + 2, 'took ' + r.strokes);
                }
                /* A par 4 or 5 the bot can drive is a hole with no second shot
                   in it — PLAN.md §0, and the reason the long game was
                   rebuilt. Held on the courses that have been, a course at a
                   time; a perfect player still holes approaches, so it is
                   the tee shot that is asked about and not the card. A drive
                   that stops a step short of the green has reached it in all
                   but name, so the line is distance: an approach's worth left
                   on a par 4, two shots' worth on a par 5. */
                if (REBUILT.indexOf(entry.course.id) >= 0 && h.par >= 4 && r.shots.length) {
                    var first = r.shots[0].world, lie = first.sunk ? null :
                        P.surfaceUnder(h, first.ball.x, first.ball.z, first.ball.y);
                    var left = first.sunk ? 0 : Math.hypot(first.ball.x - h.cup.x, first.ball.z - h.cup.z);
                    var owed = h.par >= 5 ? 20 : 8;
                    assert(entry.course.id + '/' + h.name + ': the drive leaves a real second shot',
                        !(lie && lie.pad.kind === 'green') && left >= owed,
                        first.sunk ? 'holed it' : left.toFixed(1) + ' left against ' + owed +
                            (lie ? ', on ' + lie.pad.kind : ''));
                }
            });
            note(sims + ' simulated shots in ' + Math.round(performance.now() - b0) + 'ms');

            /* Some holes exist to be flown. Tidewater's islands and tabletop,
               Highland's steps and its wall: on those the loft is the hole, and
               a hole that turns out to have a quiet route along the floor is a
               hole that has lost its point — usually because a rail moved or a
               step got shorter, and always without anyone noticing.

               So the same bot plays them again out of half a bag, with only the
               clubs that keep the ball down, and has to fail. It is a stronger
               statement than "the wedge works here": it is "nothing else does".
               Holes without the flag are free to have a flat answer, and
               several deliberately do — Under the Boardwalk wants one. */
            var b1 = performance.now(), flatBag = [], marked = 0;
            C.ALL_CLUBS.forEach(function (club) {
                if (club.loft < LOFTED) flatBag.push(club);
            });
            assert('there are flat clubs to try', flatBag.length >= 2);
            ALL.forEach(function (entry) {
                var h = entry.hole;
                if (!h.needsLoft) return;
                marked++;
                var mine = G3.bagFor(h).filter(function (c) {
                    return c.loft < LOFTED;
                });
                var r = play(h, 10, mine.length ? mine : flatBag);
                assert(entry.course.id + '/' + h.name + ': cannot be played along the floor',
                    !r.sunk, 'the flat bag holed out in ' + r.strokes);
            });
            assert('some holes are marked as needing loft', marked >= 6, marked + ' marked');
            note(marked + ' holes checked against the flat bag in ' +
                 Math.round(performance.now() - b1) + 'ms');
        })();

        /* ── the hole lab ──────────────────────────────────────────────── */

        section('The hole lab');
        (function () {
            /* A putt aimed straight at the flag never drops (js/lab.js,
               README → "The hole lab"). A hole whose ace is the line at the pin
               asks how hard and never where, and Pocket Links made it a rule
               for the same reason.

               Held on every drawn hole with no clock on it. A clock makes the
               check twelve times dearer — it is played at twelve moments of
               the slowest beat — so the holes that move are measured by
               tools/hole-lab.mjs, and only the ones rebuilt to the rule are
               held here (CLOCKED), the way a long course joins REBUILT. OPEN
               is the clock-free holes PLAN.md still lists; each has to *fail*
               the rule to stay on it, so fixing one fails this until it comes
               off the list. */
            var L = G3.lab;
            var OPEN = ['skelter/Bounce Alley', 'skelter/The Gravitron', 'cinder/Fumarole',
                        'cinder/Blowhole', 'apogee/Apogee'];
            var CLOCKED = ['works/The Mill', 'clockwork/Pendulum'];
            assert('the lab module is loaded', !!L);
            var b0 = performance.now(), held = 0;
            ALL.forEach(function (entry) {
                var h = entry.hole, tag = entry.course.id + '/' + h.name;
                if (C.MINI_GROUPS.indexOf(entry.course.group) < 0) return;
                if (L.beat(h) && CLOCKED.indexOf(tag) < 0) return;
                var drop = L.straight(h);
                if (OPEN.indexOf(tag) >= 0) {
                    assert(tag + ': is still open in PLAN.md (a putt at the flag drops)', !!drop,
                        'it never drops now — take it off OPEN, and out of PLAN.md');
                    return;
                }
                held++;
                assert(tag + ': a putt struck straight at the flag never drops', !drop, drop ? drop.club + ' at ' +
                    Math.round(drop.power * 100) + '%' + (drop.at ? ', t ' + drop.at : '') : '');
            });
            note(held + ' holes held to the straight putt in ' + Math.round(performance.now() - b0) + 'ms');
        })();

        /* ── the intro flyover ─────────────────────────────────────────── */

        /* flyover.js is pure the way physics.js is pure, which is the whole
           reason it can be tested here at all: a camera path is normally the
           one thing you can only check by looking at it, and this one is four
           points, a curve through them and a rule about the ground.

           What is worth asserting is not "does it look nice" — nothing here can
           answer that, and the screenshot pass in CLAUDE.md is where that lives.
           It is the three things that would ruin it silently: it must arrive
           exactly at the seat the game is about to use, it must never be inside
           a hillside, and it must not kink. */
        (function () {
            section('The intro flyover');

            var F = C.FLY;
            assert('the module is loaded', !!G3.flyover);

            // The seat the game would take up behind the ball, worked out the
            // way render.js works it out. The flyover ends here, whatever else
            // it does; handing it in is the contract.
            function seatBehind(hole, ball, dist, pitch) {
                dist = dist || 9;
                pitch = pitch === undefined ? 0.46 : pitch;
                var yaw = Math.atan2(hole.cup.x - ball.x, hole.cup.z - ball.z);
                var back = dist * Math.cos(pitch);
                return {
                    px: ball.x - Math.sin(yaw) * back,
                    py: ball.y + dist * Math.sin(pitch),
                    pz: ball.z - Math.cos(yaw) * back,
                    tx: ball.x, ty: ball.y + 0.35, tz: ball.z
                };
            }

            function teeBall(hole) {
                var s = P.surfaceTop(hole, hole.tee.x, hole.tee.z);
                return { x: hole.tee.x, y: (s ? s.y : 0) + C.BALL_R, z: hole.tee.z };
            }

            function groundAt(hole, x, z, fallback) {
                var s = P.surfaceTop(hole, x, z);
                return s ? s.y : fallback;
            }

            // A copy, because `at` hands back the plan's own scratch and every
            // one of these tests wants two poses at once.
            function poseAt(plan, t) {
                var p = G3.flyover.at(plan, t);
                return { px: p.px, py: p.py, pz: p.pz, tx: p.tx, ty: p.ty, tz: p.tz };
            }

            /* ── the arrival ── */

            var flat = lab({ pads: [A.pad(0, 0, 12, 30)], tee: { x: 6, z: 3 }, cup: { x: 6, z: 26 } });
            var flatBall = teeBall(flat);
            var flatSeat = seatBehind(flat, flatBall);
            var plan = G3.flyover.plan(flat, flatBall, flatSeat);

            assert('a plan is four keys', plan.keys.length === 4, plan.keys.length + ' keys');
            assert('the run is inside its bounds',
                plan.dur >= F.MIN_SECONDS - 1e-9 && plan.dur <= F.MAX_SECONDS + 1e-9,
                plan.dur + 's');

            var landed = poseAt(plan, plan.dur);
            var exact = ['px', 'py', 'pz', 'tx', 'ty', 'tz'].every(function (k) {
                return approx(landed[k], flatSeat[k], 1e-9);
            });
            assert('it lands exactly on the seat, to the last decimal', exact,
                JSON.stringify(landed));
            var over = poseAt(plan, plan.dur * 3);
            assert('and stays there however long it is asked for',
                approx(over.px, flatSeat.px, 1e-9) && approx(over.pz, flatSeat.pz, 1e-9));

            /* ── the opening ── */

            var start = poseAt(plan, 0);
            var ux = (flat.cup.x - flatBall.x), uz = (flat.cup.z - flatBall.z);
            var d = Math.hypot(ux, uz);
            ux /= d; uz /= d;
            function along(x, z) { return (x - flatBall.x) * ux + (z - flatBall.z) * uz; }

            assert('it opens beyond the cup', along(start.px, start.pz) > d,
                along(start.px, start.pz).toFixed(2) + ' vs ' + d.toFixed(2));
            assert('looking back at it',
                approx(along(start.tx, start.tz), d, 0.2) &&
                along(start.px, start.pz) > along(start.tx, start.tz));
            assert('and above it', start.py > flat.cup.y + 2, start.py.toFixed(2));

            /* ── the travel ── */

            /* It runs one way down the hole. Not perfectly monotone — the path
               is bowed and eased, and a curve through four points wanders a
               little — but a sweep that doubles back is a sweep that reads as a
               mistake, so the tolerance here is tight rather than absent. */
            (function () {
                var i, s, prev = Infinity, worst = 0, pose;
                for (i = 0; i <= 80; i++) {
                    pose = G3.flyover.at(plan, plan.dur * i / 80);
                    s = along(pose.px, pose.pz);
                    if (s - prev > worst) worst = s - prev;
                    prev = s;
                }
                assert('it travels down the hole without doubling back', worst < 0.35,
                    'backed up ' + worst.toFixed(3) + ' units');
            })();

            /* No kink at a key. The tangents are the non-uniform Catmull-Rom
               ones for exactly this reason; the uniform form, on keys spaced by
               chord length rather than evenly, jerks at every beat. Measured as
               the longest step against the mean step, which is what a jerk
               actually looks like at a fixed sample rate. */
            (function () {
                var i, a, b, step, longest = 0, total = 0, n = 240;
                b = poseAt(plan, 0);
                for (i = 1; i <= n; i++) {
                    a = b;
                    b = poseAt(plan, plan.dur * i / n);
                    step = Math.hypot(b.px - a.px, b.py - a.py, b.pz - a.pz);
                    total += step;
                    if (step > longest) longest = step;
                }
                // The global ease alone puts the middle at about 1.5x the mean.
                assert('the path does not kink at a key', longest < (total / n) * 2.6,
                    longest.toFixed(3) + ' against a mean of ' + (total / n).toFixed(3));
            })();

            // Slow off the green, quick over the middle, stopped at the seat.
            // The last of those is the hand-off: there is nothing for the
            // game's own camera to absorb when it takes over.
            (function () {
                var a = poseAt(plan, plan.dur * 0.002), b = poseAt(plan, 0);
                var open = Math.hypot(a.px - b.px, a.py - b.py, a.pz - b.pz);
                var c = poseAt(plan, plan.dur), e = poseAt(plan, plan.dur * 0.998);
                var shut = Math.hypot(c.px - e.px, c.py - e.py, c.pz - e.pz);
                var m1 = poseAt(plan, plan.dur * 0.5), m2 = poseAt(plan, plan.dur * 0.502);
                var mid = Math.hypot(m1.px - m2.px, m1.py - m2.py, m1.pz - m2.pz);
                assert('it starts slowly', open < mid * 0.35, open.toFixed(4));
                assert('and arrives stopped', shut < mid * 0.35, shut.toFixed(4));
            })();

            /* ── the ground ── */

            /* The one that has teeth. A curve drawn between four points knows
               nothing about the hill between two of them, and a camera through
               a hillside is the failure a player cannot un-see. Sampled finer
               than the lift pass itself samples, so this is checking the curve
               rather than agreeing with the loop that built it. */
            function clearance(hole, ball, seat, samples) {
                var p = G3.flyover.plan(hole, ball, seat);
                var fallback = Math.max(ball.y, hole.cup.y);
                var i, prog, pose, g, worst = Infinity;
                for (i = 0; i <= samples; i++) {
                    prog = i / samples;
                    // Past the settle window the path is arriving at a camera
                    // that stands on the course, so there is nothing to clear.
                    if (prog > 1 - F.SETTLE) break;
                    pose = G3.flyover.at(p, prog * p.dur);
                    g = groundAt(hole, pose.px, pose.pz, fallback);
                    worst = Math.min(worst, pose.py - g);
                }
                return worst;
            }

            (function () {
                // A wall of ground across the middle of the hole, well above
                // the apex the path would otherwise take over a flat one — so
                // this fails outright if the lift pass stops running.
                var hill = lab({
                    pads: [A.pad(0, 0, 12, 12), A.pad(0, 12, 12, 8, 22), A.pad(0, 20, 12, 12)],
                    tee: { x: 6, z: 3 }, cup: { x: 6, z: 28 }
                });
                var b = teeBall(hill);
                var worst = clearance(hill, b, seatBehind(hill, b), 200);
                assert('it clears a ridge across the middle of the hole', worst > 1.2,
                    'came within ' + worst.toFixed(2) + ' units of it');
            })();

            (function () {
                var t0 = performance.now(), worst = Infinity, where = '', n = 0;
                ALL.forEach(function (entry) {
                    var h = entry.hole, b = teeBall(h);
                    var c = clearance(h, b, seatBehind(h, b), 120);
                    n++;
                    if (c < worst) { worst = c; where = entry.course.id + '/' + h.name; }
                });
                assert('every hole in the file is flown over rather than through',
                    worst > 1.2, where + ' came within ' + worst.toFixed(2) + ' units');
                note(n + ' holes planned and swept in ' +
                     Math.round(performance.now() - t0) + 'ms');
            })();

            /* ── the shape of it ── */

            // Bowed towards the course, not away from it: a dolly straight down
            // the axis of a hole shows you its length and nothing else.
            (function () {
                var wide = lab({
                    pads: [A.pad(0, 0, 8, 30), A.pad(8, 0, 16, 30)],
                    tee: { x: 4, z: 3 }, cup: { x: 4, z: 26 }
                });
                var b = teeBall(wide);
                var p = G3.flyover.plan(wide, b, seatBehind(wide, b));
                var mid = poseAt(p, p.dur * 0.45);
                assert('the sweep leans over the course rather than off its edge',
                    mid.px > 5, 'x = ' + mid.px.toFixed(2));
            })();

            // A long hole earns a longer look; both ends are clamped.
            (function () {
                assert('a short hole gets the shortest run',
                    approx(G3.flyover.seconds(2), F.MIN_SECONDS, 1e-9));
                assert('a long one gets the longest',
                    approx(G3.flyover.seconds(400), F.MAX_SECONDS, 1e-9));
                assert('and in between it follows the hole',
                    G3.flyover.seconds(80) > G3.flyover.seconds(30));
            })();

            /* ── the seat moving under it ── */

            (function () {
                var b = teeBall(flat);
                var p = G3.flyover.plan(flat, b, seatBehind(flat, b));
                var opened = poseAt(p, 0);
                var moved = seatBehind(flat, b, 16, 0.9);
                G3.flyover.retarget(p, moved);
                var landing = poseAt(p, p.dur);
                assert('retargeting moves the arrival',
                    approx(landing.px, moved.px, 1e-9) && approx(landing.py, moved.py, 1e-9));
                var reopened = poseAt(p, 0);
                assert('and leaves the opening where it was',
                    approx(reopened.px, opened.px, 1e-9) && approx(reopened.pz, opened.pz, 1e-9));
            })();

            /* ── the degenerate hole ── */

            // The editor can hand the game a cup on top of the tee, and a path
            // down a line of length zero is a path of NaNs unless it is asked.
            (function () {
                var same = lab({ tee: { x: 5, z: 10 }, cup: { x: 5, z: 10 } });
                var b = teeBall(same);
                var seat = { px: 5, py: 4, pz: 1, tx: 5, ty: 0.5, tz: 10 };
                var p = G3.flyover.plan(same, b, seat);
                var i, pose, finite = true;
                for (i = 0; i <= 40; i++) {
                    pose = G3.flyover.at(p, p.dur * i / 40);
                    if (!isFinite(pose.px) || !isFinite(pose.py) || !isFinite(pose.pz) ||
                        !isFinite(pose.tx) || !isFinite(pose.ty) || !isFinite(pose.tz)) finite = false;
                }
                assert('a cup on top of the tee still gives a path', finite);
                var end = poseAt(p, p.dur);
                assert('and it still ends on the seat',
                    approx(end.px, seat.px, 1e-9) && approx(end.pz, seat.pz, 1e-9));
            })();

            // The pose is the plan's own scratch, and every frame of every
            // sweep reads it. Handing back a fresh object instead would be
            // sixty allocations a second for the length of the intro.
            assert('sampling allocates nothing',
                G3.flyover.at(plan, 0) === G3.flyover.at(plan, 1));
        })();

        /* ── the ace replay ────────────────────────────────────────────── */

        /* replay.js is a tape: what the live roll did, written down a step at
           a time, and read back. The one promise worth holding it to is that
           what comes back is the shot that went in — every frame where it was,
           the events once each, and the moving walls on the shot's own clock.
           How it looks is the screenshot pass's business. */
        (function () {
            section('The ace replay');
            var RE = G3.replay, RP = C.REPLAY;
            assert('the module is loaded', !!RE);

            // A straight putt that drops, found by walking the weight up.
            var hole = lab({ pads: [A.pad(0, 0, 10, 20)], tee: { x: 5, z: 2 }, cup: { x: 5, z: 15 } });
            var yaw = Math.atan2(hole.cup.x - hole.tee.x, hole.cup.z - hole.tee.z);
            function tapeOf(power, dt) {
                var w = P.createWorld(hole, { x: hole.tee.x, z: hole.tee.z }, 3.25), i, ev;
                P.launch(w, yaw, power, 0);
                var tape = RE.begin(w, { yaw: yaw, feel: 0.5, kind: 'green' });
                for (i = 0; i < Math.ceil(C.MAX_SHOT_SECONDS / dt); i++) {
                    ev = P.advance(w, dt, {});
                    RE.record(tape, w, ev);
                    if (P.done(w)) break;
                }
                return { tape: RE.finish(tape), world: w };
            }
            var ace = null, pw;
            for (pw = 2; pw <= C.MAX_POWER && !ace; pw += 0.05) {
                var r = tapeOf(pw, C.SIM_DT);
                if (r.world.sunk) ace = r;
            }
            assert('a straight putt on the lab green drops', !!ace);
            if (!ace) return;
            var tape = ace.tape, f = tape.frames, w = ace.world;

            assert('a holed tape is playable on its own hole', RE.playable(tape, hole));
            assert('…and not on another one', !RE.playable(tape, lab({})));
            assert('a tape that stayed out is not playable',
                !RE.playable(tapeOf(1, C.SIM_DT).tape, hole));

            assert('the tape starts on the tee, at rest in time',
                f[0].t === 0 && approx(f[0].x, hole.tee.x, 1e-9) && approx(f[0].z, hole.tee.z, 1e-9));
            var last = f[f.length - 1];
            assert('…and ends where the live ball ended',
                last.x === w.ball.x && last.y === w.ball.y && last.z === w.ball.z);
            assert('its length is the shot\'s, on the world clock',
                approx(RE.length(tape), w.time - 3.25, 1e-9));

            var sunk = 0, k;
            for (k = 0; k < f.length; k++) if (f[k].ev & RE.SUNK) sunk++;
            assert('the drop is on the tape exactly once', sunk === 1, sunk + ' times');

            // Read back: exact on the frames, between them in between.
            var out = {}, exact = true, mono = true, prevI = 0;
            for (k = 0; k < f.length; k++) {
                RE.sample(tape, f[k].t, out);
                if (out.x !== f[k].x || out.z !== f[k].z || out.y !== f[k].y) exact = false;
                if (out.i < prevI) mono = false;
                prevI = out.i;
            }
            assert('every frame reads back exactly', exact);
            assert('the frame index only goes forward', mono);
            var mid = (f[5].t + f[6].t) / 2;
            RE.sample(tape, mid, out);
            assert('halfway between two frames is halfway between them',
                approx(out.x, (f[5].x + f[6].x) / 2, 1e-9) && approx(out.z, (f[5].z + f[6].z) / 2, 1e-9));
            assert('…and still reports the earlier frame', out.i === 5, 'i = ' + out.i);
            assert('the walls are driven off the shot\'s own clock', approx(out.time, 3.25 + mid, 1e-9));
            RE.sample(tape, -1, out);
            assert('before the strike the ball is on the tee', out.x === f[0].x && out.z === f[0].z && out.i === 0);
            RE.sample(tape, RE.length(tape) + 5, out);
            assert('after the end it stays where it stopped',
                out.x === last.x && out.z === last.z && out.i === f.length - 1);

            // The cut, and the slow motion that follows it.
            var len = RE.length(tape);
            assert('the cut is inside the tape, with time left to watch',
                tape.cutT >= 0 && tape.cutT <= len - RP.CUT_LEAD + 1e-9,
                tape.cutT.toFixed(2) + ' of ' + len.toFixed(2));
            RE.sample(tape, tape.cutT, out);
            var span = Math.hypot(hole.cup.x - hole.tee.x, hole.cup.z - hole.tee.z);
            var radius = Math.max(RP.CUT_MIN, Math.min(RP.CUT_MAX, span * RP.CUT_SHARE));
            assert('the cut comes as the ball closes on the cup',
                Math.hypot(out.x - hole.cup.x, out.z - hole.cup.z) <= radius + 1e-9);
            RE.sample(tape, tape.cutT * 0.5, out);
            assert('before the cut the tape runs at full speed', RE.rate(tape, tape.cutT * 0.5, out) === 1);
            assert('at the lip it is in slow motion',
                approx(RE.rate(tape, len, { x: hole.cup.x, z: hole.cup.z }), RP.SLOW, 1e-9));

            // The seats the cup camera may take.
            var seats = RE.seats(hole, { x: hole.cup.x, z: hole.cup.z - 3 }), allAt = true, allUp = true;
            seats.forEach(function (s) {
                if (!approx(Math.hypot(s.x - hole.cup.x, s.z - hole.cup.z), RP.SEAT_DIST, 1e-9)) allAt = false;
                if (s.y < hole.cup.y + RP.SEAT_UP - 1e-9) allUp = false;
            });
            assert('every cup seat is the same distance from the cup', allAt);
            assert('…and above it', allUp);
            assert('the first seat is beyond the cup, off the line in',
                seats[0].z > hole.cup.z && Math.abs(seats[0].x - hole.cup.x) > 0.5);
            var down = RE.seats(hole, { x: hole.cup.x, z: hole.cup.z });
            assert('a ball dropped straight in still gets seats', down.length === seats.length &&
                down.every(function (s) { return isFinite(s.x) && isFinite(s.z); }));

            // A tape that runs past its cap is not shown — half a shot is not the shot.
            var held = RP.MAX_FRAMES;
            RP.MAX_FRAMES = 10;
            var capped = tapeOf(pw - 0.05, C.SIM_DT).tape;
            RP.MAX_FRAMES = held;
            assert('a tape past its cap is not playable', capped.full && !RE.playable(capped, hole));
        })();

        /* ── done ──────────────────────────────────────────────────────── */

        var el = document.getElementById('summary');
        el.className = failed ? 'bad' : 'ok';
        el.textContent = (failed ? '✗ ' + failed + ' failed, ' : '✓ ') + passed + ' passed' +
            ' — ' + Math.round(performance.now() - t0) + 'ms';
        window.TEST_RESULT = { passed: passed, failed: failed, fails: window.FAILS };
        // The same four globals shader-tests.html sets, so one headless driver
        // can read either suite. CLAUDE.md documents the contract; this is the
        // half of it that was only ever documented.
        window.PASSED = passed;
        window.FAILED = failed;
        window.DONE = true;
    })();
    </script>
</body>
</html>
