                    }
                    if (open) { run += step; best = Math.max(best, run); } else { run = 0; }
                }
                return best;
            }
        })();

        /* ── ground that does something ─────────────────────────────────── */

        /* Ice, travelators, launch pads, pipes and backspin. Five mechanics
           that are each about four lines of physics.js, which is exactly why
           they need a section of their own: a change that quietly stops a belt
           pushing is a change nothing else in this file would notice, and the
           courses that depend on them would go on passing the bot because a
           dead belt is simply a plank.

           So every one of these is written to fail if the mechanic is removed
           rather than merely to pass while it is there. Where that means
           comparing two shots, the pair is the assertion. */

        section('Ground that does something');
        (function () {
            var flat = lab({ pads: [A.pad(0, 0, 10, 60)], cup: { x: 5, z: 55 } });
            var iced = lab({ pads: [A.pad(0, 0, 10, 60, 0, 'ice')], cup: { x: 5, z: 55 } });

            // ── ice ──
            assert('ice is the slickest surface in the game',
                C.FRICTION.ice > C.FRICTION.wood && C.FRICTION.ice > C.FRICTION.green);
            assert('…and holds a stopped ball on less than a plank does',
                C.HOLD.ice < C.HOLD.wood);
            var onGrass = shootFrom(flat, { x: 5, z: 2 }, 0, 10.5, 0).ball.z - 2;
            var onIce = shootFrom(iced, { x: 5, z: 2 }, 0, 10.5, 0).ball.z - 2;
            assert('a putt runs three times as far on ice as on grass',
                onIce > onGrass * 3,
                onIce.toFixed(1) + ' against ' + onGrass.toFixed(1));
            /* The number the whole of Icehouse Yard is designed against, and
               the reason it is asserted rather than remembered: every hole on
               that course is laid out so that a full swing is too much, and a
               friction tweak that shortened this by a third would leave six
               holes nobody can reach the pin on. */
            assert('and a full putter on ice outruns the longest mini golf hole',
                onIce > 28 && onIce < 36, 'runs ' + onIce.toFixed(1));
            var slopedIce = lab({
                pads: [A.pad(0, 0, 10, 30, 1.2, 'ice', 0, -0.04), A.pad(0, 30, 10, 8)],
                cup: { x: 5, z: 34 }
            });
            assert('a ball cannot come to rest on ice with any fall on it',
                shootFrom(slopedIce, { x: 5, z: 3 }, 0, C.MIN_POWER * 1.1, 0).ball.z > 29,
                'stopped at z=' + shootFrom(slopedIce, { x: 5, z: 3 }, 0, C.MIN_POWER * 1.1, 0).ball.z.toFixed(1));

            // ── the travelator ──
            var plain = lab({
                pads: [A.pad(0, 0, 10, 8), A.pad(0, 8, 10, 8, 0, 'wood'), A.pad(0, 16, 10, 30)],
                cup: { x: 5, z: 40 }
            });
            var belted = lab({
                pads: [A.pad(0, 0, 10, 8), A.belt(0, 8, 10, 8, 0, 9), A.pad(0, 16, 10, 30)],
                cup: { x: 5, z: 40 }
            });
            var noBelt = shootFrom(plain, { x: 5, z: 2 }, 0, 10.5, 0).ball.z;
            var withBelt = shootFrom(belted, { x: 5, z: 2 }, 0, 10.5, 0).ball.z;
            assert('a belt carries a ball further than the same board would',
                withBelt > noBelt + 4,
                withBelt.toFixed(1) + ' against ' + noBelt.toFixed(1));
            var across = lab({
                pads: [A.pad(0, 0, 20, 8), A.belt(0, 8, 20, 4, 8, 0), A.pad(0, 12, 20, 14)],
                tee: { x: 4, z: 2 }, cup: { x: 4, z: 22 }
            });
            assert('a belt across the line throws the ball off it',
                shootFrom(across, { x: 4, z: 2 }, 0, 13, 0).ball.x > 8,
                'finished at x=' + shootFrom(across, { x: 4, z: 2 }, 0, 13, 0).ball.x.toFixed(1));
            /* The bug this exists to prevent, and it is not hypothetical: drag
               is proportional to speed and therefore says nothing about a
               stopped ball, so without the `push` clause in the rest check a
               ball that arrived on a belt slowly enough would be declared at
               rest on a moving floor and sit there for ever. */
            var parked = shootFrom(belted, { x: 5, z: 10 }, Math.PI, 1.6, 0);
            assert('no ball ever comes to rest on a travelator',
                parked.ball.z > 16 && !parked.moving,
                'settled at z=' + parked.ball.z.toFixed(1));

            // ── the launch pad ──
            var padded = lab({
                pads: [A.pad(0, 0, 10, 40), A.sprung(5, 10, 1.2, 9.6)],
                cup: { x: 5, z: 35 }
            });
            var sprung = shotEvents(padded, { x: 5, z: 2 }, 0, 10.5, 0);
            assert('a launch pad fires at a ball that rolls on to it',
                sprung.world.sprung >= 1, 'sprung ' + sprung.world.sprung + ' times');
            var apex = (function () {
                var w = P.createWorld(padded, { x: 5, z: 2 }, 0), top = 0, i;
                P.launch(w, 0, 10.5, 0);
                for (i = 0; i < 4000 && !P.done(w); i++) {
                    P.advance(w, C.SIM_DT, {});
                    if (w.ball.y > top) top = w.ball.y;
                }
                return top;
            })();
            // v²/2g, which is the whole of what a pad is worth, and the number
            // every hole with one on it is laid out against.
            assert('and throws it as high as its rating says',
                Math.abs(apex - (C.BALL_R + 9.6 * 9.6 / (2 * C.GRAVITY))) < 0.15,
                'apex ' + apex.toFixed(2));
            assert('the kick fades on every firing within a shot',
                P.springKick({ sprung: 1 }, { spring: 9.6 }) <
                P.springKick({ sprung: 0 }, { spring: 9.6 }));
            assert('…and runs out rather than fading for ever',
                P.springKick({ sprung: 9 }, { spring: 9.6 }) === 0);
            /* Which is what stops the clock being the thing that ends a shot.
               A wedge dropped dead on the middle of a launch pad has no run on
               it to carry it off, so it lands on the pad, and lands on it
               again, and the only reason that terminates is SPRING_DECAY. */
            var lob = C.ALL_CLUBS.filter(function (c) { return c.id === 'wedge'; })[0];
            var dropped = shotEvents(
                lab({ pads: [A.pad(0, 0, 10, 26), A.sprung(5, 9.4, 1.5, 10.4)], cup: { x: 5, z: 22 } }),
                { x: 5, z: 2 }, 0, lob.power, lob.loft);
            assert('a ball dropped dead on a launch pad still settles',
                !dropped.world.moving && dropped.seconds < C.MAX_SHOT_SECONDS - 2,
                'still going after ' + dropped.seconds.toFixed(1) + 's');

            // ── the pipe ──
            var piped = lab({
                pads: [A.pad(0, 0, 10, 12), A.pad(0, 24, 10, 16)],
                warps: [A.pipe(5, 10, 5, 26, 0, 1.0)],
                cup: { x: 5, z: 36 }
            });
            var down = shotEvents(piped, { x: 5, z: 2 }, 0, 10.5, 0);
            assert('a putt into a mouth comes out of the far end',
                down.events.warp === 1 && down.world.ball.z > 24,
                'warps ' + (down.events.warp || 0) + ', z=' + down.world.ball.z.toFixed(1));
            assert('…and only once, whatever the far end is sitting in',
                down.events.warp === 1);
            assert('the pipe hands back the speed it was given',
                down.world.ball.z > 27, 'only reached ' + down.world.ball.z.toFixed(1));
            /* A mouth is a hole in the floor, so it swallows a ball on the
               floor and nothing else. Without this a pipe would be a magnet
               and "keep it down" would stop being a thing a hole can ask. */
            var overhead = P.createWorld(piped, { x: 5, z: 10 }, 0);
            overhead.ball.y = 1.4;
            overhead.grounded = false;
            assert('a ball in the air over a mouth is not swallowed',
                !P.warpUnder(piped, overhead.ball));
            assert('and one on the floor over it is',
                !!P.warpUnder(piped, { x: 5, z: 10, y: C.BALL_R }));
            var pipeless = lab({
                pads: [A.pad(0, 0, 10, 12), A.pad(0, 24, 10, 16)],
                cup: { x: 5, z: 36 }
            });
            assert('and a hole with no pipes on it warps nothing',
                !shotEvents(pipeless, { x: 5, z: 2 }, 0, 10.5, 0).events.warp);

            // ── backspin ──
            var green = lab({ pads: [A.pad(0, 0, 10, 60)], cup: { x: 5, z: 55 } });
            var free = shootFrom(green, { x: 5, z: 2 }, 0, 13.5, 38 * Math.PI / 180, 0, undefined, 0);
            var checked = shootFrom(green, { x: 5, z: 2 }, 0, 13.5, 38 * Math.PI / 180, 0, undefined, 0.78);
            assert('backspin costs the shot most of its run and none of its carry',
                checked.ball.z < free.ball.z - 6 && checked.ball.z > 8,
                'checked ' + checked.ball.z.toFixed(1) + ' against ' + free.ball.z.toFixed(1));
            assert('and it is spent on the first landing, not on every one',
                (function () {
                    var w = P.createWorld(green, { x: 5, z: 2 }, 0), i;
                    P.launch(w, 0, 13.5, 38 * Math.PI / 180, 0.78);
                    for (i = 0; i < 4000 && !P.done(w); i++) {
                        P.advance(w, C.SIM_DT, {});
                        if (!w.ball.bite) break;
                    }
                    return w.ball.bite === 0 && i < 4000;
                })());
            var spinner = C.ALL_CLUBS.filter(function (c) { return c.bite; });
            assert('exactly one club in the bag carries backspin',
                spinner.length === 1 && spinner[0].id === 'checker');
            assert('…and it is not in the default bag',
                C.CLUBS.indexOf(spinner[0]) < 0);

            // ── and what a hole is allowed to be built out of ──
            var machines = 0, mouths = 0, iceHoles = 0, bad = '';
            ALL.forEach(function (entry) {
                var h = entry.hole, tag = entry.course.id + '/' + h.name;
                h.pads.forEach(function (p) {
                    if (p.spring) {
                        machines++;
                        /* A launch pad is an inlay, and an inlay only wins a
                           *tie* in surfaceUnder — so a pad laid on ground that
                           has been rolled above it is a pad the ball never
                           touches. `build` keeps the ground under one flat;
                           this is what says it worked. */
                        var under = null, q;
                        for (q = 0; q < h.pads.length; q++) {
                            if (h.pads[q] === p || h.pads[q].inlay) continue;
                            if (P.padContains(h.pads[q], p.x + p.w / 2, p.z + p.d / 2)) under = h.pads[q];
                        }
                        if (under && Math.abs(P.padHeight(under, p.x + p.w / 2, p.z + p.d / 2) -
                                P.padHeight(p, p.x + p.w / 2, p.z + p.d / 2)) > 1e-9) {
                            bad = tag + ': a launch pad is buried in the ground under it';
                        }
                        if (p.spring <= C.LAND_REST) bad = tag + ': a launch pad too weak to fire';
                    }
                    if (p.push) {
                        machines++;
                        if (!p.push.x && !p.push.z) bad = tag + ': a travelator that pushes nowhere';
                    }
                    if (p.kind === 'ice') iceHoles++;
                });
                (h.warps || []).forEach(function (wp) {
                    mouths++;
                    // Out of one mouth and straight into another is a ball
                    // ping-ponging until the lock happens to expire somewhere.
                    (h.warps || []).forEach(function (other) {
                        if (Math.hypot(wp.tx - other.x, wp.tz - other.z) < other.r) {
                            bad = tag + ': a pipe empties into a mouth';
                        }
                    });
                    if (!P.surfaceTop(h, wp.tx, wp.tz)) bad = tag + ': a pipe empties into thin air';
                    if (P.outOfBounds(h, wp.tx, wp.tz)) bad = tag + ': a pipe empties out of bounds';
                });
            });
            assert('every piece of machinery on the course is built legally', !bad, bad);
            assert('there is machinery to check', machines >= 8, machines + ' found');
            assert('there are pipes to check', mouths >= 2, mouths + ' found');
            assert('and ice to play on', iceHoles >= 6, iceHoles + ' pads');
        })();

        /* ── walls you go through, bats that stop, and how hard down is ── */

        /* Three more mechanics with the same problem as the ground ones: each
           is a handful of lines, and each would go on passing every other test
           in this file if it quietly stopped working. An aperture with its
           opening sealed is a wall. A flipper that does not swing is a blade
           at a funny angle. A gravity multiplier nobody reads is 1. So again:
           written to fail when the mechanic is removed. */

        section('Ways through, bats, and gravity');
        (function () {
            // ── the aperture ──
            var door = A.aperture(0, 6, 8, 0.4, { gap: 1.4, at: 4, h: 1.7, head: 1.15 });
            var win = A.aperture(0, 6, 8, 0.4, { gap: 1.4, at: 4, h: 1.6, sill: 0.5, head: 1.4 });
            var shut = A.aperture(0, 6, 8, 0.4, { gap: 0, h: 1.5 });
            /* Two jambs and a lintel over the opening; a window adds a sill
               under it. A doorway with no lintel would be two blocks with a
               gap between them, which is what the older holes wrote by hand
               and is not a wall with a door in it — from the tee it reads as a
               hole in the fence rather than as a way through. */
            assert('a doorway is three pieces and a window is four',
                door.length === 3 && win.length === 4,
                door.length + ' / ' + win.length);
            assert('and a wall with no opening in it is just a wall',
                shut.length === 1 || shut.length === 2, shut.length + ' pieces');
            assert('every piece of an aperture is thick enough not to be tunnelled',
                door.concat(win).every(function (w) { return w.w >= 0.24 && w.d >= 0.24; }));

            var lane = lab({ pads: [A.pad(0, 0, 8, 20)], walls: door, cup: { x: 4, z: 17 } });
            var barred = lab({ pads: [A.pad(0, 0, 8, 20)], walls: shut, cup: { x: 4, z: 17 } });
            var through = shootFrom(lane, { x: 4, z: 2 }, 0, 12, 0);
            var stopped = shootFrom(barred, { x: 4, z: 2 }, 0, 12, 0);
            assert('a putt on the line of a doorway goes through it',
                through.ball.z > 8, 'reached ' + through.ball.z.toFixed(1));
            assert('…and the same putt at the same wall without one does not',
                stopped.ball.z < 6.5, 'reached ' + stopped.ball.z.toFixed(1));
            var offLine = shootFrom(lane, { x: 1.4, z: 2 }, 0, 12, 0);
            assert('and a putt off the line of it is stopped by the jamb',
                offLine.ball.z < 6.5, 'reached ' + offLine.ball.z.toFixed(1));

            /* The window is the interesting one: it is the only obstacle in
               the file that a rolling ball cannot pass and a lofted one can,
               which is the exact opposite of every wall and the exact opposite
               of `beam`. Both halves are the assertion. */
            var glazed = lab({ pads: [A.pad(0, 0, 8, 20)], walls: win, cup: { x: 4, z: 17 } });
            var rolled = shootFrom(glazed, { x: 4, z: 2 }, 0, 12, 0);
            var wed = C.ALL_CLUBS.filter(function (c) { return c.id === 'chipper'; })[0];
            var lofted = shootFrom(glazed, { x: 4, z: 2 }, 0, wed.power, wed.loft);
            assert('a window turns a putt back', rolled.ball.z < 6.5,
                'reached ' + rolled.ball.z.toFixed(1));
            assert('…and lets a pitch through it', lofted.ball.z > 8,
                'reached ' + lofted.ball.z.toFixed(1));

            // `at` has to actually move the opening, or every door is centred.
            var left = A.aperture(0, 6, 8, 0.4, { gap: 1.2, at: 2, h: 1.5 });
            var mid = A.aperture(0, 6, 8, 0.4, { gap: 1.2, h: 1.5 });
            assert('an opening can be put somewhere other than the middle',
                left[0].w < mid[0].w && Math.abs(mid[0].w - mid[1].w) < 1e-9,
                left[0].w.toFixed(2) + ' against ' + mid[0].w.toFixed(2));

            // ── the flipper ──
            var bat = A.flipper(4, 8, 3, { rest: -0.5, arc: 1.0, speed: 2 });
            var atRest = P.wallBox(bat, 0);
            var atEnd = P.wallBox(bat, Math.PI / 2);            // half a period
            var midSweep = P.wallBox(bat, Math.PI / 4);
            assert('a flipper starts at its rest angle',
                Math.abs(atRest.yaw - (-0.5)) < 1e-9, atRest.yaw.toFixed(3));
            assert('…reaches the far end of its arc',
                Math.abs(atEnd.yaw - 0.5) < 1e-9, atEnd.yaw.toFixed(3));
            assert('…and stops at both ends rather than running round',
                Math.abs(atRest.spin) < 1e-9 && Math.abs(atEnd.spin) < 1e-9);
            assert('but is moving in the middle of the sweep, and shoves the ball',
                Math.abs(midSweep.spin) > 0.5, midSweep.spin.toFixed(2));
            assert('and it never leaves the arc it was given', (function () {
                var k, y, lo = Infinity, hi = -Infinity;
                for (k = 0; k <= 60; k++) {
                    y = P.wallBox(bat, k / 60 * Math.PI).yaw;
                    lo = Math.min(lo, y); hi = Math.max(hi, y);
                }
                return lo > -0.5 - 1e-9 && hi < 0.5 + 1e-9;
            })());

            // ── gravity ──
            assert('gravity is the config number when a hole says nothing',
                P.gravityOf({}) === C.GRAVITY && P.gravityOf(null) === C.GRAVITY);
            assert('…and a hole may say otherwise',
                Math.abs(P.gravityOf({ gravity: 0.4 }) - C.GRAVITY * 0.4) < 1e-9);
            var earth = lab({ pads: [A.pad(0, 0, 10, 80)], cup: { x: 5, z: 75 } });
            var moon = lab({ pads: [A.pad(0, 0, 10, 80)], cup: { x: 5, z: 75 } });
            moon.gravity = 0.4;
            var pit = C.ALL_CLUBS.filter(function (c) { return c.id === 'chipper'; })[0];
            function flight(h) {
                var w = P.createWorld(h, { x: 5, z: 2 }, 0), top = 0, carry = null, i, ev;
                P.launch(w, 0, pit.power, pit.loft);
                for (i = 0; i < 6000 && !P.done(w); i++) {
                    ev = P.advance(w, C.SIM_DT, {});
                    if (w.ball.y > top) top = w.ball.y;
                    if (carry === null && ev.land) carry = w.ball.z - 2;
                }
                return { apex: top, carry: carry };
            }
            var e = flight(earth), m = flight(moon);
            /* Carry goes as 1/g and so does apex, so two fifths of a g is two
               and a half times both. Asserted as a ratio rather than as two
               numbers, because the point is the relationship: change
               CONFIG.GRAVITY and this still holds. */
            assert('a shot in two fifths of a g carries about two and a half times as far',
                m.carry / e.carry > 2.2 && m.carry / e.carry < 2.8,
                (m.carry / e.carry).toFixed(2) + '×');
            assert('…and hangs about two and a half times as high',
                m.apex / e.apex > 2.2 && m.apex / e.apex < 2.8,
                (m.apex / e.apex).toFixed(2) + '×');
            /* And the thing that does *not* change, which is what makes a
               low-gravity hole playable at all: what a surface will hold a
               stopped ball on is a gradient, and a gradient is a ratio of two
               forces that both scale with g. */
            var ramp = A.pad(0, 0, 6, 10, 0, 'green', 0, 0.1);
            assert('but the slope a green holds a ball on does not move',
                P.holdOf(ramp.kind) === C.HOLD.green);

            // ── and what the courses actually use ──
            var swung = 0, gaps = 0, shifted = 0, worst = '';
            ALL.forEach(function (entry) {
                var h = entry.hole, tag = entry.course.id + '/' + h.name;
                if (h.gravity) {
                    shifted++;
                    if (h.gravity <= 0 || h.gravity > 2) worst = tag + ': gravity out of range';
                }
                h.walls.forEach(function (wl) {
                    if (wl.swing) {
                        swung++;
                        if (!wl.swing.speed) worst = tag + ': a flipper that does not move';
                        if (wl.swing.from === wl.swing.to) worst = tag + ': a flipper with no arc';
                    }
                });
            });
            assert('the flippers on the course are all real ones', !worst, worst);
            assert('there are flippers to check', swung >= 3, swung + ' found');
            assert('and a hole where down is a different number', shifted >= 1);
        })();

        /* ── the bag ───────────────────────────────────────────────────── */

        section('Clubs');
        (function () {
            var seenId = {}, seenKey = {}, flat = 0, longest = null;
            assert('there is a bag', C.CLUBS.length >= 2);
            /* A club whose loft the clamp would trim is a club that does not
               do what its label says — the wedge sat a degree under the old
               45° ceiling and read as flat because of it. */
            assert('the bag has a club that really goes up',
                Math.max.apply(null, C.CLUBS.map(function (c) { return c.loft; })) >= 50 * Math.PI / 180);
            C.CLUBS.forEach(function (club) {
                assert(club.id + ': named, keyed and described',
                    !!club.name && !!club.short && !!club.key && !!club.blurb);
                assert(club.id + ': loft is inside what launch() will accept',
                    club.loft >= 0 && club.loft <= C.MAX_LOFT,
                    (club.loft * 180 / Math.PI).toFixed(1) + '°');
                assert(club.id + ': a full swing is a legal shot',
                    club.power > C.MIN_POWER && club.power <= C.MAX_POWER);
                assert(club.id + ': the id is unique', !seenId[club.id]);
                assert(club.id + ': the shortcut is unique', !seenKey[club.key]);
                seenId[club.id] = seenKey[club.key] = true;
                if (club.loft === 0) flat++;
                if (!longest || club.power > longest.power) longest = club;
            });
            assert('at least one club rolls flat', flat >= 1);
            assert('the longest club reaches the whole power range', longest.power === C.MAX_POWER);
            assert('the default club is in the bag',
                C.CLUBS.filter(function (c) { return c.id === C.DEFAULT_CLUB; }).length === 1);

            // The feel constants are read by the chrome, not the simulation,
            // but a typo in one of them is invisible until someone plays.
            assert('the overswing mark is a fraction of the swing',
                C.OVERSWING > 0.5 && C.OVERSWING < 1);

            // The bag has to be able to do the two things the courses ask of
            // it: roll a long way, and go over something.
            var open = lab({ pads: [A.pad(0, 0, 10, 40)], cup: { x: 9, z: 39 } });
            var reach = 0;
            C.CLUBS.forEach(function (club) {
                var w = shootFrom(open, { x: 5, z: 1 }, 0, club.power, club.loft);
                reach = Math.max(reach, w.ball.z - 1);
            });
            assert('some club reaches ten units in one shot', reach > 10, 'best is ' + reach.toFixed(1));

            /* The wedge tops out around five and a half units of carry, so the
               rail goes where a lofted club is over it and a rolling one is
               not — about two and a half units out. Any hole asking for more
               air than that has to offer a way round. */
            var fence = lab({ walls: [A.wall(0, 4.6, 10, 0.4, 0.5, { base: 0 })] });
            var carried = C.CLUBS.some(function (club) {
                return shootFrom(fence, { x: 5, z: 2 }, 0, club.power, club.loft).ball.z > 5.2;
            });
            assert('some club carries a rail the putter would bounce off', carried);
            assert('and the putter is not that club',
                shootFrom(fence, { x: 5, z: 2 }, 0, clubOf('putter').power, clubOf('putter').loft).ball.z < 4.8);

            function clubOf(id) {
                return C.CLUBS.filter(function (c) { return c.id === id; })[0];
            }
        })();

        /* ── the overdraw ──────────────────────────────────────────────── */

        section('Overdraw and spray');
        (function () {
            assert('the overdraw is a real stretch of meter, and a bounded one',
                C.OVERDRAW > 0 && C.OVERDRAW <= 0.5, (C.OVERDRAW * 100).toFixed(0) + '%');

            assert('a full swing is 0 into the overdraw, and the end of the meter is 1',
                P.overdraw(10, 10) === 0 && P.overdraw(10 * (1 + C.OVERDRAW), 10) === 1);
            assert('anything under a full swing is 0 into it',
                P.overdraw(4, 10) === 0 && P.overdraw(9.99, 10) === 0);
            assert('the overdraw is measured per club, not in raw power',
                approx(P.overdraw(28 * (1 + C.OVERDRAW / 2), 28),
                       P.overdraw(10.5 * (1 + C.OVERDRAW / 2), 10.5)));
            assert('past the end of the meter it is still 1', P.overdraw(99, 10) === 1);

            /* The rule the whole trade rests on: inside a full swing the shot
               is the shot, and the preview is not lying to you. */
            assert('a full swing sprays by nothing at all',
                P.spray(0).yaw === 0 && P.spray(0).power === 0);
            var honest = P.sprayShot(0.7, 12, 0, function () { return 1; });
            assert('…so the shot played is exactly the shot asked for',
                honest.yaw === 0.7 && honest.power === 12);

            var half = P.spray(0.5), full = P.spray(1);
            assert('the worst of it is the configured spray',
                approx(full.yaw, C.SPRAY_YAW) && approx(full.power, C.SPRAY_POWER));
            assert('spray grows with the overdraw',
                half.yaw > 0 && half.yaw < full.yaw && half.power < full.power);

            /* Exponential, not linear: half the overdraw has to buy much less
               than half the trouble, or there is no reason to stop at 100% and
               no reason to fear 130%. */
            assert('and grows exponentially, not in step with the meter',
                half.yaw < full.yaw * 0.35,
                'half the overdraw is ' + (half.yaw / full.yaw * 100).toFixed(0) + '% of the spray');
            var q = P.spray(0.25), t3 = P.spray(0.75);
            assert('each quarter of the overdraw costs more than the one before',
                (t3.yaw - half.yaw) > (half.yaw - q.yaw) && (half.yaw - q.yaw) > q.yaw);

            // Both draws are used, and both are bounded by what spray() says.
            var lo = P.sprayShot(0, 20, 1, function () { return 0; });
            var hi = P.sprayShot(0, 20, 1, function () { return 1; });
            assert('a thrashed shot misses left and right of the line',
                approx(lo.yaw, -C.SPRAY_YAW) && approx(hi.yaw, C.SPRAY_YAW));
            assert('…and heavy and light of the weight',
                approx(lo.power, 20 * (1 - C.SPRAY_POWER)) &&
                approx(hi.power, 20 * (1 + C.SPRAY_POWER)));

            // Line and weight are drawn separately: pulled and thin is two
            // mistakes, not the same one twice.
            var seq = [0, 1], k = 0;
            var mixed = P.sprayShot(0, 20, 1, function () { return seq[k++]; });
            assert('the line and the weight are two draws',
                mixed.yaw < 0 && mixed.power > 20);

            /* And the extra power is real: the simulation has to accept a
               swing past the longest club's ceiling, or the overdraw would be
               all cost and no distance. */
            var open = lab({ pads: [A.pad(0, 0, 10, 60)], cup: { x: 5, z: 55 } });
            var fullSwing = shootFrom(open, { x: 5, z: 1 }, 0, C.MAX_POWER, 0);
            var thrashed = shootFrom(open, { x: 5, z: 1 }, 0, C.MAX_POWER * (1 + C.OVERDRAW), 0);
            assert('an overdrawn swing goes further than a full one',
                thrashed.ball.z > fullSwing.ball.z + 1,
                fullSwing.ball.z.toFixed(1) + ' → ' + thrashed.ball.z.toFixed(1));

            var w = P.createWorld(open, { x: 5, z: 1 }, 0);
            P.launch(w, 0, C.MAX_POWER * (1 + C.OVERDRAW), 0);
            assert('launch() does not clip the overdraw off the top',
                approx(P.groundSpeed(w.ball), C.MAX_POWER * (1 + C.OVERDRAW), 0.01),
                P.groundSpeed(w.ball).toFixed(2));

            /* Nor the bonus on top of it. The biggest club at the top of its
               overdraw, struck clean, is the fastest ball the game can produce
               — and it is the one shot a ceiling written in terms of the
               meter alone would quietly shave. */
            (function () {
                var best = P.deliver(C.MAX_POWER * (1 + C.OVERDRAW), C.MAX_POWER);
                var w2 = P.createWorld(open, { x: 5, z: 1 }, 0);
                P.launch(w2, 0, best, 0);
                assert('nor the clean-strike bonus on top of it',
                    approx(P.groundSpeed(w2.ball), best, 0.01),
                    P.groundSpeed(w2.ball).toFixed(2) + ' of ' + best.toFixed(2));
            })();

            /* ── what the overdraw is worth ────────────────────────────────

               The meter is linear and delivery is not: past a full swing the
               club gives back more than the bar says, squared in the overdraw
               so the prize sits where the risk does. */
            assert('inside a full swing the meter is the shot, exactly',
                P.deliver(7, 10) === 7 && P.deliver(10, 10) === 10);
            assert('past a full swing the club delivers more than the meter reads',
                P.deliver(10 * (1 + C.OVERDRAW), 10) > 10 * (1 + C.OVERDRAW));
            assert('and the bonus is the whole of OVER_GAIN at the very top',
                approx(P.deliver(10 * (1 + C.OVERDRAW), 10),
                       10 * (1 + C.OVERDRAW) * (1 + C.OVER_GAIN)));
            /* Squared, so half way up is a quarter of the prize — the first
               half of the overdraw is nearly free of risk and has to be nearly
               free of reward too, or there is no decision anywhere on the bar. */
            (function () {
                var half = P.deliver(10 * (1 + C.OVERDRAW / 2), 10) / (10 * (1 + C.OVERDRAW / 2)) - 1;
                var full = P.deliver(10 * (1 + C.OVERDRAW), 10) / (10 * (1 + C.OVERDRAW)) - 1;
                assert('half the overdraw is a quarter of the bonus',
                    approx(half / full, 0.25, 0.01),
                    (half / full * 100).toFixed(0) + '%');
            })();
            assert('delivery never runs backwards up the bar', (function () {
                var prev = -1;
                for (var q = 0; q <= 1.0001; q += 0.05) {
                    var d = P.deliver(10 * (1 + C.OVERDRAW * q), 10);
                    if (d <= prev) return false;
                    prev = d;
                }
                return true;
            })());

            /* ── sidespin ──────────────────────────────────────────────────

               Only the gate puts it on, it bends the flight and nothing else,
               and the ground takes it away. */
            (function () {
                var flat = lab({ pads: [A.pad(0, 0, 40, 60)], cup: { x: 20, z: 55 } });
                function shotWithSpin(spin) {
                    var w = P.createWorld(flat, { x: 20, z: 1 }, 0);
                    P.launch(w, 0, 22, 20 * Math.PI / 180);
                    w.spin = spin;
                    for (var i = 0; i < 4000 && !P.done(w); i++) P.advance(w, 1 / 240, {});
                    return w.ball;
                }
                var straight = shotWithSpin(0);
                var drawn = shotWithSpin(-1);
                var faded = shotWithSpin(1);
                assert('spin bends the shot off the line it left on',
                    Math.abs(drawn.x - straight.x) > 0.4,
                    'moved ' + (drawn.x - straight.x).toFixed(2));
                assert('and the two signs bend it opposite ways',
                    (drawn.x - straight.x) * (faded.x - straight.x) < 0);
                assert('a bent shot is not a longer one',
                    Math.abs(drawn.z - straight.z) < Math.abs(drawn.x - straight.x) * 3 + 4);
                assert('launch() clears the spin, so it cannot outlive its shot', (function () {
                    var w = P.createWorld(flat, { x: 20, z: 1 }, 0);
                    w.spin = 1;
                    P.launch(w, 0, 10, 0);
                    return w.spin === 0;
                })());
                assert('the ground takes nearly all of it on the first bounce',
                    C.SPIN_LAND > 0 && C.SPIN_LAND < 0.5);
            })();

            // The cone is drawn from spray(), so its own constants have to be
            // the kind a renderer can use: an angle, a width and a cutoff.
            assert('the cone has a base angle, a width and a range',
                C.CONE_ANGLE > 0 && C.CONE_ANGLE < 0.2 &&
                C.CONE_WIDTH > 0 && C.CONE_RANGE > 2);
            assert('the cone fades out over a real stretch of its length',
                C.CONE_FADE > 0.1 && C.CONE_FADE < 0.9);
            assert('a full-power shot outruns the cone, so the cutoff matters',
                C.MAX_POWER / -Math.log(C.FRICTION.green) > C.CONE_RANGE);
        })();

        /* ── the swing gate ────────────────────────────────────────────── */

        section('The swing gate');
        (function () {
            var SW = G3.swing;

            // A helper: run a gate to a given position and press it there.
            function pressAt(variant, over, at, pos, alsoTop) {
                var g = SW.start(variant, over, at);
                var guard = 0;
                while (!g.done && guard++ < 20000) {
                    if (alsoTop && g.stage === 0 && g.dir > 0 && g.pos >= g.top - 0.002) SW.press(g);
                    // Walk it to the target and press exactly there, on the
                    // half of the swing the gate is live for.
                    if (SW.live(g) && ((g.dir < 0 && g.pos <= pos) || (g.dir > 0 && g.pos >= pos))) {
                        SW.press(g);
                        break;
                    }
                    SW.tick(g, 1 / 600);
                }
                return g;
            }

            assert('a full swing does not arm the gate', !SW.arms(0));
            assert('nor does the first sliver of overdraw', !SW.arms(C.SWING.ARM * 0.5));
            assert('a real thrash does', SW.arms(1) && SW.arms(C.SWING.ARM * 2));

            /* The target is the white line the bar already had on it. Nothing
               about the rule needs saying because the furniture says it. */
            assert('the gate is struck at a full swing, wherever the meter went',
                approx(SW.markAt(), 1 / (1 + C.OVERDRAW)));

            /* Harder the further you wind it, on both counts, and on the same
               curve the spray runs on — so the gate tightens exactly where the
               shot gets wild rather than on a schedule of its own. */
            assert('the strike zone shrinks as the overdraw grows',
                SW.windowFor(0) > SW.windowFor(0.5) && SW.windowFor(0.5) > SW.windowFor(1));
            assert('and the marker speeds up',
                SW.speedFor(0) < SW.speedFor(0.5) && SW.speedFor(0.5) < SW.speedFor(1));
            assert('the last quarter of the overdraw costs more room than the first',
                (SW.windowFor(0) - SW.windowFor(0.25)) < (SW.windowFor(0.75) - SW.windowFor(1)),
                'first ' + (SW.windowFor(0) - SW.windowFor(0.25)).toFixed(3) +
                ' vs last ' + (SW.windowFor(0.75) - SW.windowFor(1)).toFixed(3));

            assert('all four gates exist and are distinct',
                SW.VARIANTS.length === 4 &&
                SW.VARIANTS.length === SW.VARIANTS.filter(function (v, i, a) { return a.indexOf(v) === i; }).length);
            assert('a round meets all four in its first four thrashes', (function () {
                var seen = {};
                for (var i = 0; i < 4; i++) seen[SW.pick(i)] = 1;
                return Object.keys(seen).length === 4;
            })());
            assert('and the rotation wraps rather than falling off the end',
                SW.pick(4) === SW.pick(0) && SW.pick(-1) === SW.pick(3));

            /* The prize. A clean strike is the whole point of taking the gate
               on, so it has to hand the shot back untouched. */
            (function () {
                var g = pressAt('tempo', 0.8, 0.95, SW.markAt());
                assert('a strike on the line is perfect', g.perfect && g.off === 0);
                var out = SW.apply({ yaw: 0.4, power: 20 }, g);
                assert('and a perfect strike does not move the shot at all',
                    out.yaw === 0.4 && out.power === 20 && out.spin === 0);
            })();

            /* And the punishment, which is the old envelope exactly: a total
               miss costs the spray the dice used to roll at this overdraw,
               and nothing about how wild a thrash can get has changed. */
            (function () {
                var g = SW.start('tempo', 1, 1);
                var guard = 0;
                while (!g.done && guard++ < 20000) SW.tick(g, 1 / 600);
                assert('never swinging runs the gate out', g.done && !g.struck);
                assert('and counts as the latest possible strike', g.off === 1);
                var out = SW.apply({ yaw: 0, power: 20 }, g);
                var worst = P.spray(1);
                assert('a total miss is exactly the spray the dice used to roll',
                    approx(Math.abs(out.yaw), worst.yaw),
                    out.yaw.toFixed(4) + ' vs ' + worst.yaw.toFixed(4));
                assert('a mishit is always lighter, never heavier',
                    out.power < 20 && approx(out.power, 20 * (1 - worst.power)));
                assert('and it bends in the air as well as leaving off line',
                    out.spin !== 0);
            })();

            /* Early pulls, late pushes, and the bend goes the same way as the
               push — which is what makes a mishit read as one mistake rather
               than two unrelated ones. */
            (function () {
                var early = pressAt('tempo', 1, 1, SW.markAt() - SW.windowFor(1) - 0.1);
                var late = pressAt('tempo', 1, 1, SW.markAt() + SW.windowFor(1) + 0.1);
                assert('early and late miss opposite ways',
                    early.off < 0 && late.off > 0);
                var a = SW.apply({ yaw: 0, power: 20 }, early);
                var b = SW.apply({ yaw: 0, power: 20 }, late);
                assert('so the two shots leave on opposite sides of the line',
                    a.yaw * b.yaw < 0);
                assert('and each one bends the way it was already going',
                    a.yaw * a.spin > 0 && b.yaw * b.spin > 0);
                assert('a near miss costs less than a far one', (function () {
                    var near = pressAt('tempo', 1, 1, SW.markAt() + SW.windowFor(1) + 0.02);
                    return Math.abs(near.off) < Math.abs(late.off);
                })());
            })();

            /* The gates that turn are live on the way down only. A player who
               swings at the ball on the backswing has not hit the ball. */
            (function () {
                var g = SW.start('return', 0.8, 0.95);
                assert('the return gate is dead on the way up', !SW.live(g));
                var guard = 0;
                while (!g.turned && guard++ < 20000) SW.tick(g, 1 / 600);
                assert('it turns at the power that was loaded, not the end of the bar',
                    approx(g.pos, g.top, 0.01) && g.top < 1);
                assert('and comes alive coming down', SW.live(g));
            })();
            (function () {
                var g = SW.start('return', 0.8, 0.95);
                SW.press(g);
                assert('a swing on the backswing ends it as an early miss',
                    g.done && g.off < 0);
            })();

            /* The double gate: a press at the top, then the strike, and a bad
               top follows you down into a good one. */
            (function () {
                var clean = pressAt('double', 0.8, 0.95, SW.markAt(), true);
                assert('a clean top and a clean strike is still perfect',
                    clean.perfect, 'off ' + clean.off.toFixed(3));
                var sloppy = pressAt('double', 0.8, 0.95, SW.markAt(), false);
                assert('missing the top press entirely is not free',
                    !sloppy.perfect && Math.abs(sloppy.off) > 0,
                    'off ' + sloppy.off.toFixed(3));
            })();

            /* The fade gate hides the marker for the run in, and only that. */
            (function () {
                var g = SW.start('fade', 0.8, 1);
                assert('the fade gate shows the marker at the start', SW.visible(g));
                var guard = 0;
                while (SW.visible(g) && !g.done && guard++ < 20000) SW.tick(g, 1 / 600);
                assert('and hides it before the line', !g.done && g.pos < SW.markAt(),
                    'went dark at ' + g.pos.toFixed(3));
                while (!SW.visible(g) && !g.done && guard++ < 20000) SW.tick(g, 1 / 600);
                assert('and gives it back after, so a miss can be read',
                    !g.done && g.pos > SW.markAt(),
                    'came back at ' + g.pos.toFixed(3));
                assert('every other gate stays visible throughout',
                    SW.visible(SW.start('tempo', 0.8, 1)) && SW.visible(SW.start('return', 0.8, 1)));
            })();

            /* Whatever the gate does, it cannot reach outside the envelope the
               overdraw already had. This is the assertion that keeps the
               tuning honest: `off` is bounded, so `apply` is too. */
            assert('no gate can push a shot further off line than the spray allows', (function () {
                var worst = P.spray(1).yaw;
                for (var v = 0; v < SW.VARIANTS.length; v++) {
                    for (var at = 0.8; at <= 1.001; at += 0.05) {
                        for (var p = 0; p <= 1.001; p += 0.05) {
                            var g = pressAt(SW.VARIANTS[v], 1, at, p, v === 2);
                            var o = SW.apply({ yaw: 0, power: 20 }, g);
                            if (Math.abs(o.yaw) > worst + 1e-9) return false;
                            if (o.power > 20 + 1e-9 || o.power < 0) return false;
                        }
                    }
                }
                return true;
            })());
        })();

        /* ── scoring ───────────────────────────────────────────────────── */

        section('Scoring and the save file');
        (function () {
            assert('one stroke is an ace', S.term(1, 3).kind === 'ace');
            assert('two under par is an eagle', S.term(1, 3).label === 'Hole in One!' && S.term(2, 4).label === 'Eagle');
            assert('one under par is a birdie', S.term(2, 3).label === 'Birdie');
            assert('par is par', S.term(3, 3).label === 'Par');
            assert('one over is a bogey', S.term(4, 3).label === 'Bogey');
            assert('three under is an albatross', S.term(2, 5).label === 'Albatross');
            assert('far over gives up and counts', S.term(9, 3).label === '+6');

            assert('level par formats as E', S.formatVsPar(0) === 'E');
            assert('over par keeps its sign', S.formatVsPar(3) === '+3');
            assert('under par keeps its sign', S.formatVsPar(-2) === '-2');

            var holes = G3.COURSES[0].holes;
            assert('course par is the sum of the holes', S.coursePar(holes) === holes.reduce(function (a, h) { return a + h.par; }, 0));

            var partial = [3, 2];
            var t = S.totals(partial, holes);
            assert('totals only count holes played', t.played === 2 && t.strokes === 5);
            assert('totals compare against the par of those holes',
                t.vsPar === 5 - (holes[0].par + holes[1].par));
            assert('an empty card totals zero', S.totals([], holes).played === 0);
            assert('a gap in the card is skipped', S.totals([3, undefined, 4], holes).played === 2);

            var card = holes.map(function (h) { return h.par; });
            var first = S.recordRound(S.emptySave(), 'seaside', card, holes);
            assert('a first round is always a record', first.isBest);
            assert('the record is the round total', first.save.courses.seaside.best === S.coursePar(holes));
            assert('rounds are counted', first.save.rounds === 1 && first.save.courses.seaside.rounds === 1);

            var worse = card.slice(); worse[0] += 4;
            var second = S.recordRound(first.save, 'seaside', worse, holes);
            assert('a worse round is not a record', !second.isBest);
            assert('a worse round leaves the record alone', second.save.courses.seaside.best === first.save.courses.seaside.best);
            assert('but it still counts as a round', second.save.rounds === 2);

            var better = card.slice(); better[0] = 1;
            var third = S.recordRound(second.save, 'seaside', better, holes);
            assert('a better round takes the record', third.isBest);
            assert('an ace is counted', third.save.aces === 1);
            assert('the best card is kept', third.save.courses.seaside.bestCard[0] === 1);

            var other = S.recordRound(third.save, 'quarry', G3.COURSES[1].holes.map(function (h) { return h.par; }), G3.COURSES[1].holes);
            assert('another course keeps its own record', other.save.courses.quarry.best !== undefined);
            assert('and does not disturb the first', other.save.courses.seaside.best === third.save.courses.seaside.best);
            assert('courseRecord returns an empty record for an unplayed course',
                S.courseRecord(S.emptySave(), 'works').best === null);

            // Round-trip through localStorage under a scratch key, so running
            // the tests never costs anyone their records.
            var realKey = C.SAVE_KEY;
            C.SAVE_KEY = 'loftLinks.test.tmp';
            try {
                S.save(third.save);
                var back = S.load();
                assert('a save round-trips', back.courses.seaside.best === third.save.courses.seaside.best &&
                    back.aces === third.save.aces);
                localStorage.setItem(C.SAVE_KEY, '{not json');
                assert('a corrupt save loads as empty', S.load().rounds === 0);
                localStorage.setItem(C.SAVE_KEY, JSON.stringify({ courses: { seaside: { best: 'x' } }, rounds: 'y' }));
                assert('nonsense fields are dropped', S.load().courses.seaside.best === null);
                localStorage.removeItem(C.SAVE_KEY);
                assert('a missing save loads as empty', S.load().rounds === 0);
            } finally {
                C.SAVE_KEY = realKey;
            }
        })();

        /* ── the plans ─────────────────────────────────────────────────── */

        /* The course picker draws every hole from the hole data, which means a
           hole whose bounds are wrong now has somewhere new to be wrong: it
           comes out as a green smear, or as a speck in the corner of an empty
           frame, and nobody notices until they open the picker. So every plan
           is drawn here and asked the two things a plan has to get right —
           that there is a course in the frame at all, and that the tee and the
           cup are both inside it. */
        section('The plans');
        (function () {
            if (!G3.minimap) { assert('minimap.js is loaded', false); return; }
            var W = 48, worstFill = 1, worstName = '', offEdge = 0, offName = '';
            var t0m = performance.now();
            ALL.forEach(function (entry) {
                var h = entry.hole, tag = entry.course.id + '/' + h.name;
                var cv = G3.minimap.render(h, W, W);
                var d = cv.getContext('2d').getImageData(0, 0, W, W).data;
                var on = 0, i;
                for (i = 3; i < d.length; i += 4) if (d[i] > 0) on++;
                var fill = on / (W * W);
                if (fill < worstFill) { worstFill = fill; worstName = tag; }

                /* And the two ends have to be on the paper. The frame is
                   grown from the same bounds the plan is drawn from, so a hole
                   whose tee wandered outside its own bounds — which is exactly
                   what happens when a fence is edited and the ground is not —
                   fails here rather than in a screenshot. */
                var b2 = h.bounds;
                if (h.tee.x < b2.minX - 2 || h.tee.x > b2.maxX + 2 ||
                    h.tee.z < b2.minZ - 2 || h.tee.z > b2.maxZ + 2 ||
                    h.cup.x < b2.minX - 2 || h.cup.x > b2.maxX + 2 ||
                    h.cup.z < b2.minZ - 2 || h.cup.z > b2.maxZ + 2) {
                    offEdge++; offName = tag;
                }
            });
            assert('every hole draws something', worstFill > 0.08,
                worstName + ' fills only ' + (worstFill * 100).toFixed(1) + '% of its frame');
            assert('the tee and the cup are inside the frame the plan is drawn from',
                offEdge === 0, offName + ' is outside its own bounds');
            assert('a plan is cached rather than redrawn',
                G3.minimap.map('seaside', 0, 32, 32) === G3.minimap.map('seaside', 0, 32, 32));
            note(ALL.length + ' plans drawn in ' + Math.round(performance.now() - t0m) + 'ms');
        })();

        /* ── the bot ───────────────────────────────────────────────────── */

        section('The bot plays every hole');
        (function () {
            var BOT_DT = 1 / 60, BOT_SECONDS = 12, sims = 0;

            function d2(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }

            function trial(hole, from, yaw, power, loft, time, bite) {
                sims++;
                var w = P.createWorld(hole, from, time);
                if (!P.launch(w, yaw, power, loft, bite)) return null;
                P.settle(w, BOT_SECONDS, BOT_DT);
                return w;
            }

            /* A greedy player: fan out candidate shots, keep the one that ends
               nearest the cup, repeat. Two refinements around the best coarse
               shot give it the precision to actually hole out.

               It plays out of the same bag the player gets, so this is a test
               that the holes are solvable with the clubs that exist rather than
               with any loft the physics would accept.

               Two details matter. Holes with moving parts get candidates that
               wait before striking, because a bot that always fires at t=0
               would report a false failure on a timing hole. And a chosen shot
               has to go somewhere: without that rule the bot parks in a corner
               where every legal shot looks worse than standing still, and plays
               the same nothing until it runs out of strokes. */
            /* Is there a wall right in front of the ball, between it and the
               cup? A ball that rolls up against a rail comes to rest touching
               it, and from there no shot goes forward at all: the ball would
               have to climb the paint inside its own radius. A player looking
               at that lie plays sideways or backwards and gives up a stroke on
               purpose; a greedy bot cannot, because every retreat scores worse
               than standing still, so it re-plays the same nothing until it
               runs out of strokes.

               So the bot is told to see the lie, which is the honest fix — a
               shot that finishes jammed against a rail is genuinely worth
               about a stroke less than the same distance in the open, and that
               is what BLOCKED is. Only a wall *in front* counts; one behind or
               beside the ball costs nothing to play from. */
            var BLOCKED = 4;

            function blockedLie(hole, ball, cup, time) {
                var dx = cup.x - ball.x, dz = cup.z - ball.z;
                var len = Math.hypot(dx, dz);
                if (len < 1e-6) return false;
                var px = ball.x + dx / len * (C.BALL_R + 0.2);
                var pz = ball.z + dz / len * (C.BALL_R + 0.2);
                var i, B;
                for (i = 0; i < hole.walls.length; i++) {
                    B = P.wallBox(hole.walls[i], time);
                    if (ball.y - C.BALL_R >= B.top || ball.y + C.BALL_R <= B.base) continue;
                    if (P.circleBox(px, pz, C.BALL_R, B)) return true;
                }
                return false;
            }

            function bestShot(hole, from, time, bag) {
                var cup = hole.cup;
                var base = Math.atan2(cup.x - from.x, cup.z - from.z);
                var moves = hole.walls.some(function (wl) { return wl.move || wl.spin; });
                var waits = moves ? [0, 0.45, 0.95, 1.5] : [0];
                var here = d2(from, cup);
                var best = null;
                bag = bag || C.CLUBS;

                function consider(yaw, club, power, wait) {
                    // The club's own backspin, so the bot is playing the clubs
                    // the player is handed rather than five-sixths of them.
                    var w = trial(hole, from, yaw, power, club.loft, time + wait, club.bite);
                    if (!w) return;
                    var moved = Math.hypot(w.ball.x - from.x, w.ball.z - from.z);
                    var s;
                    if (w.sunk) s = -1000;
                    else if (w.splash || w.out) s = 500 + d2(w.origin, cup);
                    else s = d2(w.ball, cup) +
                        (blockedLie(hole, w.ball, cup, w.time) ? BLOCKED : 0);
                    if (!w.sunk && moved < 1 && s >= here) return;
                    if (!best || s < best.s) best = { s: s, yaw: yaw, club: club, power: power, wait: wait, world: w };
                }

                var i, N = 16;
                bag.forEach(function (club) {
                    for (i = 0; i < N; i++) {
                        [0.35, 0.7, 1].forEach(function (f) {
                            consider(base + (i / N) * Math.PI * 2, club, club.power * f, 0);
                        });
                    }
                });

                var b0 = best;
                if (!b0) return null;
                [-2, -1, 0, 1, 2].forEach(function (k) {
                    bag.forEach(function (club) {
                        [0.25, 0.5, 0.75, 1].forEach(function (f) {
                            waits.forEach(function (wait) {
                                consider(b0.yaw + k * 0.11, club, club.power * f, wait);
                            });
                        });
                    });
                });
                var b1 = best;
                [-3, -2, -1, 0, 1, 2, 3].forEach(function (k) {
                    [-0.7, -0.35, 0, 0.35, 0.7].forEach(function (dp) {
                        waits.forEach(function (wait) {
                            consider(b1.yaw + k * 0.03, b1.club,
                                Math.max(C.MIN_POWER, Math.min(b1.club.power, b1.power + dp)), wait);
                        });
                    });
                });
                return best;
            }

            function play(hole, maxStrokes, bag) {
                var from = { x: hole.tee.x, z: hole.tee.z, y: hole.tee.y + C.BALL_R };
                var time = 0, strokes = 0, penalties = 0, s, shot;
                for (s = 0; s < maxStrokes; s++) {
                    shot = bestShot(hole, from, time, bag);
                    if (!shot) break;
                    strokes++;
                    time = shot.world.time;
                    if (shot.world.sunk) return { sunk: true, strokes: strokes + penalties };
                    if (shot.world.splash || shot.world.out) {
                        penalties++;
                        from = { x: shot.world.origin.x, z: shot.world.origin.z, y: shot.world.origin.y };
                    } else {
                        from = { x: shot.world.ball.x, z: shot.world.ball.z, y: shot.world.ball.y };
                    }
                }
                return { sunk: false, strokes: strokes + penalties };
            }

            var b0 = performance.now();
            ALL.forEach(function (entry) {
                var h = entry.hole;
                // Out of the bag the hole hands out, not out of the whole
                // bag: a hole that takes the loft away has to be solvable
                // without it, and that is exactly what this now says.
                var r = play(h, 8, G3.bagFor(h));
                assert(entry.course.id + '/' + h.name + ': the bot holes out with the clubs it has (par ' + h.par + ')',
                    r.sunk, r.sunk ? '' : 'gave up after ' + r.strokes + ' strokes');
                if (r.sunk) {
                    assert(entry.course.id + '/' + h.name + ': and does it in a plausible number of strokes',
                        r.strokes <= h.par + 2, 'took ' + r.strokes);
                }
            });
            note(sims + ' simulated shots in ' + Math.round(performance.now() - b0) + 'ms');

            /* Some holes exist to be flown. Tidewater's islands and tabletop,
               Highland's steps and its wall: on those the loft is the hole, and
               a hole that turns out to have a quiet route along the floor is a
               hole that has lost its point — usually because a rail moved or a
               step got shorter, and always without anyone noticing.

               So the same bot plays them again out of half a bag, with only the
               clubs that keep the ball down, and has to fail. It is a stronger
               statement than "the wedge works here": it is "nothing else does".
               Holes without the flag are free to have a flat answer, and
               several deliberately do — Under the Boardwalk wants one. */
            var b1 = performance.now(), flatBag = [], marked = 0;
            C.CLUBS.forEach(function (club) {
                if (club.loft < LOFTED) flatBag.push(club);
            });
            assert('there are flat clubs to try', flatBag.length >= 2);
            ALL.forEach(function (entry) {
                var h = entry.hole;
                if (!h.needsLoft) return;
                marked++;
                var mine = G3.bagFor(h).filter(function (c) {
                    return c.loft < LOFTED;
                });
                var r = play(h, 10, mine.length ? mine : flatBag);
                assert(entry.course.id + '/' + h.name + ': cannot be played along the floor',
                    !r.sunk, 'the flat bag holed out in ' + r.strokes);
            });
            assert('some holes are marked as needing loft', marked >= 6, marked + ' marked');
            note(marked + ' holes checked against the flat bag in ' +
                 Math.round(performance.now() - b1) + 'ms');
        })();

        /* ── the intro flyover ─────────────────────────────────────────── */

        /* flyover.js is pure the way physics.js is pure, which is the whole
           reason it can be tested here at all: a camera path is normally the
           one thing you can only check by looking at it, and this one is four
           points, a curve through them and a rule about the ground.

           What is worth asserting is not "does it look nice" — nothing here can
           answer that, and the screenshot pass in CLAUDE.md is where that lives.
           It is the three things that would ruin it silently: it must arrive
           exactly at the seat the game is about to use, it must never be inside
           a hillside, and it must not kink. */
        (function () {
            section('The intro flyover');

            var F = C.FLY;
            assert('the module is loaded', !!G3.flyover);

            // The seat the game would take up behind the ball, worked out the
            // way render.js works it out. The flyover ends here, whatever else
            // it does; handing it in is the contract.
            function seatBehind(hole, ball, dist, pitch) {
                dist = dist || 9;
                pitch = pitch === undefined ? 0.46 : pitch;
                var yaw = Math.atan2(hole.cup.x - ball.x, hole.cup.z - ball.z);
                var back = dist * Math.cos(pitch);
                return {
                    px: ball.x - Math.sin(yaw) * back,
                    py: ball.y + dist * Math.sin(pitch),
                    pz: ball.z - Math.cos(yaw) * back,
                    tx: ball.x, ty: ball.y + 0.35, tz: ball.z
                };
            }

            function teeBall(hole) {
                var s = P.surfaceTop(hole, hole.tee.x, hole.tee.z);
                return { x: hole.tee.x, y: (s ? s.y : 0) + C.BALL_R, z: hole.tee.z };
            }

            function groundAt(hole, x, z, fallback) {
                var s = P.surfaceTop(hole, x, z);
                return s ? s.y : fallback;
            }

            // A copy, because `at` hands back the plan's own scratch and every
            // one of these tests wants two poses at once.
            function poseAt(plan, t) {
                var p = G3.flyover.at(plan, t);
                return { px: p.px, py: p.py, pz: p.pz, tx: p.tx, ty: p.ty, tz: p.tz };
            }

            /* ── the arrival ── */

            var flat = lab({ pads: [A.pad(0, 0, 12, 30)], tee: { x: 6, z: 3 }, cup: { x: 6, z: 26 } });
            var flatBall = teeBall(flat);
            var flatSeat = seatBehind(flat, flatBall);
            var plan = G3.flyover.plan(flat, flatBall, flatSeat);

            assert('a plan is four keys', plan.keys.length === 4, plan.keys.length + ' keys');
            assert('the run is inside its bounds',
                plan.dur >= F.MIN_SECONDS - 1e-9 && plan.dur <= F.MAX_SECONDS + 1e-9,
                plan.dur + 's');

            var landed = poseAt(plan, plan.dur);
            var exact = ['px', 'py', 'pz', 'tx', 'ty', 'tz'].every(function (k) {
                return approx(landed[k], flatSeat[k], 1e-9);
            });
            assert('it lands exactly on the seat, to the last decimal', exact,
                JSON.stringify(landed));
            var over = poseAt(plan, plan.dur * 3);
            assert('and stays there however long it is asked for',
                approx(over.px, flatSeat.px, 1e-9) && approx(over.pz, flatSeat.pz, 1e-9));

            /* ── the opening ── */

            var start = poseAt(plan, 0);
            var ux = (flat.cup.x - flatBall.x), uz = (flat.cup.z - flatBall.z);
            var d = Math.hypot(ux, uz);
            ux /= d; uz /= d;
            function along(x, z) { return (x - flatBall.x) * ux + (z - flatBall.z) * uz; }

            assert('it opens beyond the cup', along(start.px, start.pz) > d,
                along(start.px, start.pz).toFixed(2) + ' vs ' + d.toFixed(2));
            assert('looking back at it',
                approx(along(start.tx, start.tz), d, 0.2) &&
                along(start.px, start.pz) > along(start.tx, start.tz));
            assert('and above it', start.py > flat.cup.y + 2, start.py.toFixed(2));

            /* ── the travel ── */

            /* It runs one way down the hole. Not perfectly monotone — the path
               is bowed and eased, and a curve through four points wanders a
               little — but a sweep that doubles back is a sweep that reads as a
               mistake, so the tolerance here is tight rather than absent. */
            (function () {
                var i, s, prev = Infinity, worst = 0, pose;
                for (i = 0; i <= 80; i++) {
                    pose = G3.flyover.at(plan, plan.dur * i / 80);
                    s = along(pose.px, pose.pz);
                    if (s - prev > worst) worst = s - prev;
                    prev = s;
                }
                assert('it travels down the hole without doubling back', worst < 0.35,
                    'backed up ' + worst.toFixed(3) + ' units');
            })();

            /* No kink at a key. The tangents are the non-uniform Catmull-Rom
               ones for exactly this reason; the uniform form, on keys spaced by
               chord length rather than evenly, jerks at every beat. Measured as
               the longest step against the mean step, which is what a jerk
               actually looks like at a fixed sample rate. */
            (function () {
                var i, a, b, step, longest = 0, total = 0, n = 240;
                b = poseAt(plan, 0);
                for (i = 1; i <= n; i++) {
                    a = b;
                    b = poseAt(plan, plan.dur * i / n);
                    step = Math.hypot(b.px - a.px, b.py - a.py, b.pz - a.pz);
                    total += step;
                    if (step > longest) longest = step;
                }
                // The global ease alone puts the middle at about 1.5x the mean.
                assert('the path does not kink at a key', longest < (total / n) * 2.6,
                    longest.toFixed(3) + ' against a mean of ' + (total / n).toFixed(3));
            })();

            // Slow off the green, quick over the middle, stopped at the seat.
            // The last of those is the hand-off: there is nothing for the
            // game's own camera to absorb when it takes over.
            (function () {
                var a = poseAt(plan, plan.dur * 0.002), b = poseAt(plan, 0);
                var open = Math.hypot(a.px - b.px, a.py - b.py, a.pz - b.pz);
                var c = poseAt(plan, plan.dur), e = poseAt(plan, plan.dur * 0.998);
                var shut = Math.hypot(c.px - e.px, c.py - e.py, c.pz - e.pz);
                var m1 = poseAt(plan, plan.dur * 0.5), m2 = poseAt(plan, plan.dur * 0.502);
                var mid = Math.hypot(m1.px - m2.px, m1.py - m2.py, m1.pz - m2.pz);
                assert('it starts slowly', open < mid * 0.35, open.toFixed(4));
                assert('and arrives stopped', shut < mid * 0.35, shut.toFixed(4));
            })();

            /* ── the ground ── */

            /* The one that has teeth. A curve drawn between four points knows
               nothing about the hill between two of them, and a camera through
               a hillside is the failure a player cannot un-see. Sampled finer
               than the lift pass itself samples, so this is checking the curve
               rather than agreeing with the loop that built it. */
            function clearance(hole, ball, seat, samples) {
                var p = G3.flyover.plan(hole, ball, seat);
                var fallback = Math.max(ball.y, hole.cup.y);
                var i, prog, pose, g, worst = Infinity;
                for (i = 0; i <= samples; i++) {
                    prog = i / samples;
                    // Past the settle window the path is arriving at a camera
                    // that stands on the course, so there is nothing to clear.
                    if (prog > 1 - F.SETTLE) break;
                    pose = G3.flyover.at(p, prog * p.dur);
                    g = groundAt(hole, pose.px, pose.pz, fallback);
                    worst = Math.min(worst, pose.py - g);
                }
                return worst;
            }

            (function () {
                // A wall of ground across the middle of the hole, well above
                // the apex the path would otherwise take over a flat one — so
                // this fails outright if the lift pass stops running.
                var hill = lab({
                    pads: [A.pad(0, 0, 12, 12), A.pad(0, 12, 12, 8, 22), A.pad(0, 20, 12, 12)],
                    tee: { x: 6, z: 3 }, cup: { x: 6, z: 28 }
                });
                var b = teeBall(hill);
                var worst = clearance(hill, b, seatBehind(hill, b), 200);
                assert('it clears a ridge across the middle of the hole', worst > 1.2,
                    'came within ' + worst.toFixed(2) + ' units of it');
            })();

            (function () {
                var t0 = performance.now(), worst = Infinity, where = '', n = 0;
                ALL.forEach(function (entry) {
                    var h = entry.hole, b = teeBall(h);
                    var c = clearance(h, b, seatBehind(h, b), 120);
                    n++;
                    if (c < worst) { worst = c; where = entry.course.id + '/' + h.name; }
                });
                assert('every hole in the file is flown over rather than through',
                    worst > 1.2, where + ' came within ' + worst.toFixed(2) + ' units');
                note(n + ' holes planned and swept in ' +
                     Math.round(performance.now() - t0) + 'ms');
            })();

            /* ── the shape of it ── */

            // Bowed towards the course, not away from it: a dolly straight down
            // the axis of a hole shows you its length and nothing else.
            (function () {
                var wide = lab({
                    pads: [A.pad(0, 0, 8, 30), A.pad(8, 0, 16, 30)],
                    tee: { x: 4, z: 3 }, cup: { x: 4, z: 26 }
                });
                var b = teeBall(wide);
                var p = G3.flyover.plan(wide, b, seatBehind(wide, b));
                var mid = poseAt(p, p.dur * 0.45);
                assert('the sweep leans over the course rather than off its edge',
                    mid.px > 5, 'x = ' + mid.px.toFixed(2));
            })();

            // A long hole earns a longer look; both ends are clamped.
            (function () {
                assert('a short hole gets the shortest run',
                    approx(G3.flyover.seconds(2), F.MIN_SECONDS, 1e-9));
                assert('a long one gets the longest',
                    approx(G3.flyover.seconds(400), F.MAX_SECONDS, 1e-9));
                assert('and in between it follows the hole',
                    G3.flyover.seconds(80) > G3.flyover.seconds(30));
            })();

            /* ── the seat moving under it ── */

            (function () {
                var b = teeBall(flat);
                var p = G3.flyover.plan(flat, b, seatBehind(flat, b));
                var opened = poseAt(p, 0);
                var moved = seatBehind(flat, b, 16, 0.9);
                G3.flyover.retarget(p, moved);
                var landing = poseAt(p, p.dur);
                assert('retargeting moves the arrival',
                    approx(landing.px, moved.px, 1e-9) && approx(landing.py, moved.py, 1e-9));
                var reopened = poseAt(p, 0);
                assert('and leaves the opening where it was',
                    approx(reopened.px, opened.px, 1e-9) && approx(reopened.pz, opened.pz, 1e-9));
            })();

            /* ── the degenerate hole ── */

            // The editor can hand the game a cup on top of the tee, and a path
            // down a line of length zero is a path of NaNs unless it is asked.
            (function () {
                var same = lab({ tee: { x: 5, z: 10 }, cup: { x: 5, z: 10 } });
                var b = teeBall(same);
                var seat = { px: 5, py: 4, pz: 1, tx: 5, ty: 0.5, tz: 10 };
                var p = G3.flyover.plan(same, b, seat);
                var i, pose, finite = true;
                for (i = 0; i <= 40; i++) {
                    pose = G3.flyover.at(p, p.dur * i / 40);
                    if (!isFinite(pose.px) || !isFinite(pose.py) || !isFinite(pose.pz) ||
                        !isFinite(pose.tx) || !isFinite(pose.ty) || !isFinite(pose.tz)) finite = false;
                }
                assert('a cup on top of the tee still gives a path', finite);
                var end = poseAt(p, p.dur);
                assert('and it still ends on the seat',
                    approx(end.px, seat.px, 1e-9) && approx(end.pz, seat.pz, 1e-9));
            })();

            // The pose is the plan's own scratch, and every frame of every
            // sweep reads it. Handing back a fresh object instead would be
            // sixty allocations a second for the length of the intro.
            assert('sampling allocates nothing',
                G3.flyover.at(plan, 0) === G3.flyover.at(plan, 1));
        })();

        /* ── done ──────────────────────────────────────────────────────── */

        var el = document.getElementById('summary');
        el.className = failed ? 'bad' : 'ok';
        el.textContent = (failed ? '✗ ' + failed + ' failed, ' : '✓ ') + passed + ' passed' +
            ' — ' + Math.round(performance.now() - t0) + 'ms';
        window.TEST_RESULT = { passed: passed, failed: failed, fails: window.FAILS };
        // The same four globals shader-tests.html sets, so one headless driver
        // can read either suite. CLAUDE.md documents the contract; this is the
        // half of it that was only ever documented.
        window.PASSED = passed;
        window.FAILED = failed;
        window.DONE = true;
    })();
    </script>
</body>
</html>
