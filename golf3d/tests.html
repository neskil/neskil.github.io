<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loft Links — logic tests</title>
    <meta name="robots" content="noindex">
    <style>
        body { background: #061422; color: #eaf6ff; font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 1rem; line-height: 1.5; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: bold; }
        h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: #9fb6c9; margin: 1.4rem 0 0.3rem; border-bottom: 1px solid #ffffff1a; padding-bottom: 0.2rem; }
        #summary { font-size: 1.2rem; margin-bottom: 0.5rem; padding: 0.6rem 0.9rem; border-radius: 10px; background: #ffffff0d; }
        #summary.ok { color: #4ade80; }
        #summary.bad { color: #f87171; }
        .note { color: #9fb6c9; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="summary">running…</div>
    <div id="results"></div>

    <!-- Pure logic only: config, physics, course data and scoring. No render,
         audio or game module, so nothing here needs WebGL, an AudioContext or a
         DOM beyond this page. -->
    <script src="js/config.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/scoring.js"></script>

    <script>
    (function () {
        'use strict';

        var C = G3.CONFIG, P = G3.physics, S = G3.scoring, A = G3.authoring;
        var passed = 0, failed = 0;
        window.FAILS = [];
        var out = document.getElementById('results');
        var t0 = performance.now();

        function section(name) {
            var h = document.createElement('h2');
            h.textContent = name;
            out.appendChild(h);
        }

        function assert(name, cond, detail) {
            var div = document.createElement('div');
            if (cond) {
                passed++;
                div.className = 'pass';
                div.textContent = '✓ ' + name;
            } else {
                failed++;
                window.FAILS.push(name + (detail ? ' — ' + detail : ''));
                div.className = 'fail';
                div.textContent = 'FAIL: ' + name + (detail ? ' — ' + detail : '');
            }
            out.appendChild(div);
        }

        function note(text) {
            var div = document.createElement('div');
            div.className = 'note';
            div.textContent = '  ' + text;
            out.appendChild(div);
        }

        function approx(a, b, eps) { return Math.abs(a - b) <= (eps === undefined ? 0.001 : eps); }

        var ALL = [];
        G3.COURSES.forEach(function (course) {
            course.holes.forEach(function (h) { ALL.push({ course: course, hole: h }); });
        });

        // A bare hole to run the integrator on, so these tests do not depend on
        // the shipped course data staying the way it is today.
        function lab(opts) {
            opts = opts || {};
            var h = {
                pads: opts.pads || [A.pad(0, 0, 10, 20)],
                water: opts.water || [],
                walls: [],
                tee: { x: 5, z: 2 },
                cup: opts.cup || { x: 5, z: 15 }
            };
            h.walls = opts.walls || [];
            var t = P.surfaceTop(h, h.tee.x, h.tee.z);
            var c = P.surfaceTop(h, h.cup.x, h.cup.z);
            h.tee.y = t ? t.y : 0;
            h.cup.y = c ? c.y : 0;
            return h;
        }

        function shootFrom(hole, from, yaw, power, loft, time, dt) {
            var w = P.createWorld(hole, from, time || 0);
            P.launch(w, yaw, power, loft || 0);
            P.settle(w, C.MAX_SHOT_SECONDS, dt);
            return w;
        }

        /* ── pads and surfaces ──────────────────────────────────────────── */

        section('Pads and surfaces');
        (function () {
            var flat = A.pad(2, 3, 4, 6, 1);
            assert('a flat pad is its own height everywhere',
                approx(P.padHeight(flat, 2, 3), 1) && approx(P.padHeight(flat, 6, 9), 1));

            var tilt = A.pad(0, 0, 4, 4, 2, 'green', -0.5, 0.25);
            assert('a tilted pad is the plane through its corner',
                approx(P.padHeight(tilt, 0, 0), 2) &&
                approx(P.padHeight(tilt, 4, 0), 0) &&
                approx(P.padHeight(tilt, 0, 4), 3));

            /* The curved ground. Only two things have to be true of a hump —
               that its height is what it says and that its gradient is the
               derivative of that height — because the solver reads the second
               to decide which way the ball rolls and the renderer reads the
               first to draw the hill it rolls down. Let those disagree and the
               ball runs uphill on a picture of a slope, which is the one bug
               this whole feature could have that nobody would think to look
               for. So the gradient is checked against a finite difference of
               the height, over a pad carrying two overlapping humps — because
               superposition is where a hand-derived derivative goes wrong. */
            var oneHump = A.pad(0, 0, 20, 20, 0, 'fairway');
            oneHump.bumps = [{ cx: 8, cz: 9, r: 5, a: 1.2 }];
            assert('a hump is at its full height in the middle',
                approx(P.padHeight(oneHump, 8, 9), 1.2));
            assert('half height half way out',
                approx(P.padHeight(oneHump, 8 + 2.5, 9), 0.6));
            assert('and back to the plane at its own radius',
                approx(P.padHeight(oneHump, 8 + 5, 9), 0));
            assert('the ground well beyond it is untouched',
                approx(P.padHeight(oneHump, 19, 1), 0));
            assert('the summit of a hump is flat', approx(P.slopeAt(oneHump, 8, 9), 0, 1e-9));
            assert('and so is the ground at its foot',
                approx(P.slopeAt(oneHump, 8, 4), 0, 1e-9));
            assert('a hollow is the same hump upside down', (function () {
                var dip = A.pad(0, 0, 20, 20, 0, 'fairway');
                dip.bumps = [{ cx: 8, cz: 9, r: 5, a: -1.2 }];
                return approx(P.padHeight(dip, 8, 9), -1.2) &&
                    approx(P.padHeight(dip, 10.5, 9), -0.6);
            })());

            var humped = A.pad(0, 0, 20, 20, 0, 'fairway');
            humped.bumps = [
                { cx: 8, cz: 9, r: 5, a: 1.2 },
                { cx: 12, cz: 11, r: 6, a: -0.8 }
            ];
            (function () {
                var worst = 0, e = 1e-4, px, pz, g, dx, dz, d;
                for (px = 2; px <= 18; px += 0.5) {
                    for (pz = 2; pz <= 18; pz += 0.5) {
                        g = P.padGrad(humped, px, pz, {});
                        dx = (P.padHeight(humped, px + e, pz) - P.padHeight(humped, px - e, pz)) / (2 * e);
                        dz = (P.padHeight(humped, px, pz + e) - P.padHeight(humped, px, pz - e)) / (2 * e);
                        d = Math.max(Math.abs(g.x - dx), Math.abs(g.z - dz));
                        if (d > worst) worst = d;
                    }
                }
                assert('the gradient of a hump is the derivative of its height',
                    worst < 1e-5, 'off by ' + worst.toExponential(2));
            })();
            assert('a pad\'s own tilt still shows up in its gradient', (function () {
                var tilted = A.pad(0, 0, 20, 20, 0, 'fairway', 0.3, -0.2);
                tilted.bumps = [{ cx: 8, cz: 9, r: 5, a: 1.2 }];
                var g = P.padGrad(tilted, 19, 1, {});   // clear of the hump
                return approx(g.x, 0.3) && approx(g.z, -0.2);
            })());

            // A disc pad is the circle inside its footprint, not the footprint.
            var round = A.circle(10, 10, 4, 'green');
            assert('a disc pad contains its middle', P.padContains(round, 10, 10));
            assert('and the rim of its circle', P.padContains(round, 13.99, 10));
            assert('but not the corner of its box',
                !P.padContains(round, 13.5, 13.5) && P.padContains(A.pad(6, 6, 8, 8), 13.5, 13.5));

            /* Static friction, which is the whole reason a hole can be built
               out of slopes. A ball put down at rest on a lie the surface can
               hold has to still be there afterwards, and one on a lie it
               cannot hold has to have gone. Both directions matter: the first
               is what makes a green puttable and the second is what makes a
               dune a hazard. */
            (function () {
                function restsOn(kind, g) {
                    var lab2 = {
                        pads: [A.pad(-20, -2, 40, 40, 0, kind, 0, -g)],
                        water: [], walls: [], tee: { x: 0, z: 0, y: 0 }, cup: { x: 0, z: 300, y: 0 }
                    };
                    var w = P.createWorld(lab2, { x: 0, z: 0, y: C.BALL_R }, 0);
                    w.moving = true; w.grounded = true;
                    P.settle(w, 6, 1 / 120);
                    return Math.abs(w.ball.z) < 0.05 && !w.out;
                }
                assert('a ball rests on a lie inside the green\'s angle of repose',
                    restsOn('green', C.HOLD.green - 0.02));
                assert('and rolls off one outside it',
                    !restsOn('green', C.HOLD.green + 0.06));
                assert('rough holds a ball a green would shed',
                    restsOn('rough', C.HOLD.green + 0.06));
                assert('and a plank sheds one the green would hold',
                    !restsOn('wood', C.HOLD.green - 0.02));
            })();

            assert('padContains includes the edges',
                P.padContains(flat, 2, 3) && P.padContains(flat, 6, 9));
            assert('padContains excludes just outside',
                !P.padContains(flat, 1.9, 5) && !P.padContains(flat, 4, 9.1));

            var bridge = lab({ pads: [A.pad(0, 0, 10, 20), A.pad(4, 5, 2, 6, 1.4, 'wood')] });
            var below = P.surfaceUnder(bridge, 5, 8, 0.5);
            var above = P.surfaceUnder(bridge, 5, 8, 2);
            assert('a ball under a bridge stands on the ground', below && approx(below.y, 0));
            assert('a ball on a bridge stands on the bridge', above && approx(above.y, 1.4));
            assert('surfaceTop ignores the ceiling', approx(P.surfaceTop(bridge, 5, 8).y, 1.4));
            assert('nothing underfoot off the pad', P.surfaceUnder(bridge, 50, 50, 99) === null);
            assert('ballTop sits the ball on the surface',
                approx(P.ballTop(bridge, 5, 8), 1.4 + C.BALL_R));

            var pond = lab({ water: [A.rect(2, 2, 3, 3, -0.5)] });
            assert('waterAt finds the pond', P.waterAt(pond, 3, 3) !== null);
            assert('waterAt is null on dry land', P.waterAt(pond, 8, 8) === null);
            assert('waterAt tolerates a hole with no water', P.waterAt(lab(), 1, 1) === null);
        })();

        /* ── walls ─────────────────────────────────────────────────────── */

        section('Walls, gates and blades');
        (function () {
            var stat = A.wall(4, 6, 2, 0.4, 0.6);
            var B = P.wallBox(stat, 12.5);
            assert('a static wall ignores time', approx(B.cx, 5) && approx(B.cz, 6.2) && B.yaw === 0);
            assert('half-extents come from the footprint', approx(B.hw, 1) && approx(B.hd, 0.2));
            assert('top is base plus height', approx(B.top - B.base, 0.6));
            assert('a static wall has no surface velocity',
                P.wallPointVelocity(B, 5, 6.2).x === 0 && P.wallPointVelocity(B, 5, 6.2).z === 0);

            var gate = A.slider(2, 6, 1.5, 0.4, { amp: 0.8, speed: 2 });
            assert('a gate is at its base position at t=0', approx(P.wallBox(gate, 0).cx, 2.75));
            assert('a gate reaches +amp a quarter period later',
                approx(P.wallBox(gate, Math.PI / 4).cx, 3.55, 1e-6));
            assert('a gate does not drift on the other axis',
                approx(P.wallBox(gate, 1.3).cz, 6.2));
            var g0 = P.wallBox(gate, 1.0), g1 = P.wallBox(gate, 1.0 + 1e-4);
            assert('gate velocity matches the finite difference',
                approx(g0.vx, (g1.cx - g0.cx) / 1e-4, 0.01), 'got ' + g0.vx.toFixed(4));

            var blade = A.spinner(5, 10, 3, 0.4, { spin: 1.5 });
            assert('a blade turns with time', approx(P.wallBox(blade, 2).yaw, 3, 1e-9));
            var Bb = P.wallBox(blade, 0);
            var pv = P.wallPointVelocity(Bb, 5 + 1.2, 10);
            assert('a blade tip moves across the sweep, not along the arm',
                approx(pv.x, 0, 1e-9) && approx(pv.z, -1.5 * 1.2, 1e-9),
                'got (' + pv.x.toFixed(3) + ', ' + pv.z.toFixed(3) + ')');

            // Circle vs box, including the rotated case.
            var box = P.wallBox(A.wall(0, 0, 4, 2, 1), 0);   // centre (2,1), half (2,1)
            assert('a circle clear of a box does not collide', P.circleBox(9, 9, C.BALL_R, box) === null);
            assert('a circle overlapping a box collides', P.circleBox(2, 1.05, C.BALL_R, box) !== null);

            var west = P.circleBox(-0.1, 1, C.BALL_R, box);
            assert('the normal points out of the west face', west && approx(west.nx, -1) && approx(west.nz, 0));
            assert('penetration depth is the overlap', west && approx(west.depth, C.BALL_R - 0.1, 1e-9),
                'got ' + (west && west.depth));

            var south = P.circleBox(2, -0.05, C.BALL_R, box);
            assert('the normal points out of the south face', south && approx(south.nz, -1) && approx(south.nx, 0));

            var corner = P.circleBox(-0.08, -0.08, C.BALL_R, box);
            assert('a corner contact gives a diagonal normal', corner && corner.nx < 0 && corner.nz < 0);

            var inside = P.circleBox(2, 0.9, C.BALL_R, box);
            assert('a centre inside the box escapes through the nearest face',
                inside && approx(inside.nz, -1) && inside.depth > C.BALL_R);

            var turned = P.wallBox(A.wall(0, 0, 4, 1, 1, { yaw: Math.PI / 2 }), 0);
            // Rotated 90°, the long axis runs along z, so a point 1.6 to the
            // east is now clear and one 1.6 to the north is not.
            assert('a rotated box is clear along its short axis',
                P.circleBox(2 + 1.6, 0.5, C.BALL_R, turned) === null);
            assert('a rotated box is solid along its long axis',
                P.circleBox(2, 0.5 + 1.6, C.BALL_R, turned) !== null);
        })();

        /* ── the integrator ────────────────────────────────────────────── */

        section('The integrator');
        (function () {
            var flat = lab();
            var w = shootFrom(flat, { x: 5, z: 2 }, 0, 10);
            assert('a shot eventually comes to rest', !w.moving);
            assert('a resting ball has no speed', P.speedOf(w.ball) < 1e-9);
            assert('the ball stays on its pad',
                w.ball.x > 0 && w.ball.x < 10 && w.ball.z > 0 && w.ball.z < 20);
            assert('a grounded ball sits one radius above the surface',
                approx(w.ball.y, C.BALL_R, 1e-6), 'y = ' + w.ball.y);

            // Coast distance under exponential drag is v0 / -ln(k), give or
            // take the last few centimetres below the stop threshold.
            var far = shootFrom(lab({ pads: [A.pad(0, 0, 10, 40)], cup: { x: 9, z: 39 } }), { x: 5, z: 1 }, 0, C.MAX_POWER);
            var travelled = far.ball.z - 1;
            var predicted = C.MAX_POWER / -Math.log(C.FRICTION.green);
            assert('full power coasts about v0 / -ln(k)', approx(travelled, predicted, 0.6),
                travelled.toFixed(2) + ' vs ' + predicted.toFixed(2));

            assert('a shot under MIN_POWER is refused', (function () {
                var t = P.createWorld(flat, { x: 5, z: 2 }, 0);
                return P.launch(t, 0, C.MIN_POWER * 0.5, 0) === false && !t.moving;
            })());

            // Frame-rate independence: the game loop hands advance() a real
            // frame time, the tests hand it 1/120. Both must agree.
            var slow = shootFrom(flat, { x: 5, z: 2 }, 0.2, 9, 0, 0, 1 / 30);
            var fast = shootFrom(flat, { x: 5, z: 2 }, 0.2, 9, 0, 0, 1 / 120);
            var gap = Math.hypot(slow.ball.x - fast.ball.x, slow.ball.z - fast.ball.z);
            assert('an unobstructed roll is frame-rate independent', gap < 0.02,
                gap.toFixed(4) + ' units apart');

            var railed = lab({ walls: [A.wall(0, 10, 6, 0.4, 0.6)] });
            var slowB = shootFrom(railed, { x: 5, z: 2 }, 0.35, 12, 0, 0, 1 / 30);
            var fastB = shootFrom(railed, { x: 5, z: 2 }, 0.35, 12, 0, 0, 1 / 120);
            var gapB = Math.hypot(slowB.ball.x - fastB.ball.x, slowB.ball.z - fastB.ball.z);
            assert('bounce sampling error stays small', gapB < 0.35, gapB.toFixed(4) + ' units apart');

            // Nothing may tunnel through the thinnest wall the courses allow.
            var thin = lab({ walls: [A.wall(0, 10, 10, 0.24, 0.6)] });
            var hard = shootFrom(thin, { x: 5, z: 2 }, 0, C.MAX_POWER);
            assert('full power does not tunnel through a 0.24 wall', hard.ball.z < 10,
                'ended at z = ' + hard.ball.z.toFixed(2));

            var sandy = lab({ pads: [A.pad(0, 0, 10, 5), A.pad(0, 5, 10, 4, 0, 'sand'), A.pad(0, 9, 10, 11)] });
            var inSand = shootFrom(sandy, { x: 5, z: 2 }, 0, 10);
            var onGrass = shootFrom(lab(), { x: 5, z: 2 }, 0, 10);
            assert('sand stops the ball short of the same shot on grass',
                inSand.ball.z < onGrass.ball.z - 1.5,
                inSand.ball.z.toFixed(2) + ' vs ' + onGrass.ball.z.toFixed(2));

            var wet = lab({
                pads: [A.pad(0, 0, 10, 8), A.pad(0, 12, 10, 8)],
                water: [A.rect(0, 8, 10, 4, -0.5)]
            });
            var splashed = shootFrom(wet, { x: 5, z: 2 }, 0, 12);
            assert('a ball hit into water splashes', splashed.splash);
            assert('a splashed ball stops moving', !splashed.moving && P.speedOf(splashed.ball) === 0);
            assert('a splashed ball is not also holed', !splashed.sunk);
            assert('the shot origin is kept for the replay',
                approx(splashed.origin.z, 2) && approx(splashed.origin.x, 5));

            var cliff = lab({ pads: [A.pad(0, 0, 10, 8)] });
            var lost = shootFrom(cliff, { x: 5, z: 2 }, 0, 12);
            assert('a ball with nowhere to land is out of play', lost.out);
            assert('an out ball stops moving', !lost.moving);

            // A ledge: the ball must leave the ground and land lower, not slide
            // down an invisible ramp.
            var step = lab({ pads: [A.pad(0, 0, 10, 8, 2), A.pad(0, 8, 10, 12, 0)] });
            var dropped = shootFrom(step, { x: 5, z: 2 }, 0, 9);
            assert('a ball rolling off a ledge lands on the lower pad',
                dropped.ball.z > 8 && approx(dropped.ball.y, C.BALL_R, 0.02),
                'z ' + dropped.ball.z.toFixed(2) + ' y ' + dropped.ball.y.toFixed(3));
            assert('and it is grounded again afterwards', dropped.grounded);

            // A kerb the ball cannot climb turns it back.
            var kerb = lab({ pads: [A.pad(0, 0, 10, 8, 0), A.pad(0, 8, 10, 12, 1.5)] });
            var blocked = shootFrom(kerb, { x: 5, z: 2 }, 0, 8);
            assert('a step too tall to climb is not climbed', blocked.ball.z < 8.2,
                'z = ' + blocked.ball.z.toFixed(2));

            /* …and so does the face of that kerb when the ball meets it in
               mid-air. Pads are surfaces rather than solids, so a ball flying
               into the side of a step used to sail through the hillside and
               drop out of the world underneath it. Hit low and hard enough to
               still be climbing when it gets there: it must not end up on the
               far side and it must not be lost. */
            var flown = shootFrom(kerb, { x: 5, z: 2 }, 0, 20, 0.12);
            assert('a ball flown into the face of a step does not pass through it',
                !flown.out && flown.ball.z < 8.2,
                (flown.out ? 'lost' : 'z = ' + flown.ball.z.toFixed(2)));

            /* The same test must not close a bridge, and the difference is the
               whole rule: under a bridge there is ground below the ball, inside
               a hillside there is not. */
            var span = lab({ pads: [A.pad(0, 0, 10, 20, 0), A.pad(3, 8, 4, 4, 1.4)] });
            var under = shootFrom(span, { x: 5, z: 2 }, 0, 14, 0);
            assert('a ball rolling under a bridge still gets through',
                under.ball.z > 12 && under.ball.y < 1,
                'z ' + under.ball.z.toFixed(2) + ' y ' + under.ball.y.toFixed(2));

            /* The band a riser used to leak through. Reading "inside the face"
               off the ball's crown rather than its centre leaves a radius of
               clearance in which the centre is already under the surface and
               nothing has fired: a shot that grazes the top of the step slips
               in through the last few centimetres, and from in there every
               step puts it back where it was while gravity keeps working, so
               it sinks out of the world. It is a narrow window, so sweep the
               band across three step heights rather than guessing the one
               launch that finds it. */
            (function () {
                var lost = 0, sank = 0, rises = [0.3, 0.4, 0.55], r, i, hill, shot, lie;
                for (r = 0; r < rises.length; r++) {
                    hill = lab({
                        pads: [A.pad(0, 0, 10, 8, 0), A.pad(0, 8, 10, 32, rises[r])],
                        cup: { x: 5, z: 38 }
                    });
                    for (i = 0; i <= 40; i++) {
                        shot = shootFrom(hill, { x: 5, z: 2 }, 0, 8 + i * 0.2, 0.05 + i * 0.01);
                        if (shot.out) { lost++; continue; }
                        lie = P.surfaceUnder(hill, shot.ball.x, shot.ball.z, shot.ball.y);
                        if (!lie || shot.ball.y < lie.y - 1e-9) sank++;
                    }
                }
                assert('no shot at a terrace riser falls through it', lost === 0, lost + ' of 123 lost');
                assert('and none comes to rest inside the hill', sank === 0, sank + ' of 123 buried');
            })();

            // A ball that clears the riser has to land on the terrace, not be
            // turned back by it: the face must be solid without being tall.
            var terrace = lab({ pads: [A.pad(0, 0, 10, 8, 0), A.pad(0, 8, 10, 32, 0.4)], cup: { x: 5, z: 38 } });
            var over = shootFrom(terrace, { x: 5, z: 5 }, 0, 10, 0.6);
            assert('a ball lofted over a riser lands on the terrace above it',
                over.ball.z > 8 && approx(over.ball.y, 0.4 + C.BALL_R, 0.02),
                'z ' + over.ball.z.toFixed(2) + ' y ' + over.ball.y.toFixed(3));

            /* And a ball that is inside the hill already — however it got there
               — has to be pushed out of it. Undoing the last step is no help
               when the step before was inside too. */
            var stuck = P.createWorld(terrace, { x: 5, z: 9, y: 0.2 }, 0);
            stuck.moving = true;
            P.settle(stuck, 4);
            assert('a ball buried in a face is pushed out, not swallowed',
                !stuck.out && approx(stuck.ball.y, C.BALL_R, 1e-6) && stuck.ball.z < 8,
                'x ' + stuck.ball.x.toFixed(2) + ' y ' + stuck.ball.y.toFixed(2) + ' z ' + stuck.ball.z.toFixed(2));

            // Loft: a rail that stops a flat shot should be flyable.
            var fence = lab({ walls: [A.wall(0, 7, 10, 0.4, 0.5, { base: 0 })] });
            var flatShot = shootFrom(fence, { x: 5, z: 2 }, 0, 11, 0);
            var lofted = shootFrom(fence, { x: 5, z: 2 }, 0, 11, 0.7);
            assert('a flat shot is stopped by a rail', flatShot.ball.z < 7.2,
                'z = ' + flatShot.ball.z.toFixed(2));
            assert('a lofted shot carries the same rail', lofted.ball.z > 7.5,
                'z = ' + lofted.ball.z.toFixed(2));
            assert('loft is capped at MAX_LOFT', (function () {
                var t = P.createWorld(fence, { x: 5, z: 2 }, 0);
                P.launch(t, 0, 10, 5);            // absurd loft
                return t.ball.vy <= 10 * Math.sin(C.MAX_LOFT) + 1e-9;
            })());

            // A tilted green must break the ball sideways, and must still let
            // the shot end.
            var tilted = lab({ pads: [A.pad(0, 0, 10, 20, 1.2, 'green', -0.12, 0)] });
            var broken = shootFrom(tilted, { x: 5, z: 2 }, 0, 9);
            assert('a ball on a tilted green drifts downhill', broken.ball.x > 5.3,
                'x = ' + broken.ball.x.toFixed(2));
            assert('a shot on a slope still comes to rest', !broken.moving);

            /* The cup. There is no capture rule to test any more — the hole is
               a hole — so these check the geometry and then measure what falls
               out of it. */
            var cupHole = lab({ cup: { x: 5, z: 12 } });

            var overCup = P.surfaceUnder(cupHole, 5, 12, Infinity);
            var besideCup = P.surfaceUnder(cupHole, 5, 12 - C.HOLE_R - 0.05, Infinity);
            assert('the green is missing over the cup',
                overCup && approx(overCup.y, cupHole.cup.y - C.CUP_DEPTH, 1e-9),
                'ground at ' + (overCup && overCup.y));
            assert('and present again just outside the rim',
                besideCup && approx(besideCup.y, cupHole.cup.y, 1e-9));
            assert('the floor of the cup is its own surface', overCup.pad.kind === 'cup');
            assert('the cup is deeper than the ball is wide', C.CUP_DEPTH > C.BALL_R * 2);

            // Ten units of grass costs about twelve of swing, so the pace that
            // arrives at the hole is what matters: scan for one that does.
            var dropped = null, sp;
            for (sp = 12; sp <= C.MAX_POWER && !dropped; sp += 0.25) {
                var attempt = shootFrom(cupHole, { x: 5, z: 2 }, 0, sp);
                if (attempt.sunk) dropped = attempt;
            }
            assert('a ball rolled at the cup drops in', !!dropped);
            dropped = dropped || shootFrom(cupHole, { x: 5, z: 2 }, 0, 13);
            assert('a holed ball ends below the green',
                dropped.ball.y + C.BALL_R < cupHole.cup.y,
                'centre at ' + dropped.ball.y.toFixed(3) + ' vs rim ' + cupHole.cup.y);
            assert('a holed ball ends inside the shaft',
                Math.hypot(dropped.ball.x - 5, dropped.ball.z - 12) <= C.HOLE_R - C.BALL_R + 1e-6);
            assert('and it stops', !dropped.moving && P.speedOf(dropped.ball) === 0);

            assert('a ball rolled past the edge of the hole stays out',
                !shootFrom(cupHole, { x: 5 + C.HOLE_R + 0.06, z: 2 }, 0, 13).sunk);

            /* A lip-out: struck from close enough that it is still travelling
               when it gets there, the ball crosses the mouth faster than it can
               fall, catches the far edge and is thrown back out. Nothing
               scripts this — it is the rim collision and gravity. */
            var fast = shootFrom(cupHole, { x: 5, z: 10 }, 0, C.MAX_POWER);
            assert('a ball hit far too hard rides over the hole', !fast.sunk);
            assert('and ends up past it', fast.ball.z > 12, 'ended at z = ' + fast.ball.z.toFixed(2));

            // A ball dropped in from above cannot bounce back out of a hole
            // this deep.
            var lobbed = shootFrom(lab({ cup: { x: 5, z: 6.9 } }), { x: 5, z: 2 }, 0, 9.5, C.CLUBS[3].loft);
            assert('a ball that lands in the cup stays in', lobbed.sunk);

            /* A raised green with an open edge — a tabletop, a summit — puts
               air under the putting surface, and the shaft used to be an
               infinitely deep well with no sides: a ball flying beneath the
               green arrived inside the mouth from below or from the side and
               was counted as holed without ever touching the green. Two
               guards, one for each way in. */
            var table = lab({
                pads: [A.pad(0, 0, 10, 6), A.pad(3, 10, 5, 5, 1.2)],
                cup: { x: 5, z: 12.5 }
            });
            assert('the tabletop cup is where the test thinks it is', approx(table.cup.y, 1.2));
            assert('a ball passing under a raised green is not holed from below', (function () {
                var t = P.createWorld(table, { x: 5, z: 4 }, 0);
                P.launch(t, 0, 22, 0.07);
                for (var i = 0; i < 400 && !P.done(t); i++) P.advance(t, C.SIM_DT);
                return !t.sunk;
            })(), 'it flew under the table and dropped in');
            assert('and it is out of play rather than quietly forgotten', (function () {
                var t = P.createWorld(table, { x: 5, z: 4 }, 0);
                P.launch(t, 0, 22, 0.07);
                P.settle(t);
                return t.out || t.splash;
            })());
            assert('a ball crossing the mouth just under the rim is not holed', (function () {
                // Launched from inside the table's own level, below the lip:
                // the only way it reaches the shaft is sideways.
                var t = P.createWorld(table, { x: 5, z: 4 }, 0);
                t.ball.y = 1.2 - 0.2;
                t.grounded = false;
                P.launch(t, 0, 20, 0);
                for (var i = 0; i < 400 && !P.done(t); i++) P.advance(t, C.SIM_DT);
                return !t.sunk;
            })());
            assert('but a ball arriving across the green still drops in', (function () {
                var t = P.createWorld(table, { x: 5, z: 11 }, 0);
                P.launch(t, 0, 4.2, 0);
                P.settle(t);
                return t.sunk;
            })());

            assert('a ball flying over the cup is not swallowed', (function () {
                var t = P.createWorld(cupHole, { x: 5, z: 2 }, 0);
                P.launch(t, 0, 13, 0.6);
                for (var i = 0; i < 400; i++) {
                    P.advance(t, C.SIM_DT);
                    if (t.sunk && t.ball.y > cupHole.cup.y) return false;
                }
                return true;
            })());

            // The pace at which the hole stops accepting the ball is emergent:
            // it is the speed at which the ball crosses the mouth faster than
            // it can fall past the far rim. Worth knowing, and worth noticing
            // if it ever changes.
            var firstIn = 0, lastIn = 0, p;
            for (p = 10; p <= C.MAX_POWER; p += 0.1) {
                if (shootFrom(cupHole, { x: 5, z: 2 }, 0, p).sunk) {
                    if (!firstIn) firstIn = p;
                    lastIn = p;
                }
            }
            assert('there is a workable range of pace that holes out from ten units',
                firstIn > 0 && lastIn - firstIn > 1,
                'from ' + firstIn.toFixed(1) + ' to ' + lastIn.toFixed(1));
            note('from ten units the cup accepts swings of ' + firstIn.toFixed(1) + ' to ' +
                 lastIn.toFixed(1) + ' — everything slower is short, everything faster rides the lip');

            assert('a settled world reports done', P.done(w));
            assert('a rolling world does not report done', (function () {
                var t = P.createWorld(flat, { x: 5, z: 2 }, 0);
                P.launch(t, 0, 10, 0);
                P.advance(t, C.SIM_DT);
                return !P.done(t);
            })());
            assert('advance on a finished world changes nothing', (function () {
                var before = splashed.ball.z;
                P.advance(splashed, 1);
                return splashed.ball.z === before;
            })());

            var clone = P.cloneWorld(w);
            clone.ball.x += 5;
            assert('cloneWorld does not share the ball', w.ball.x !== clone.ball.x);
            assert('cloneWorld keeps the clock', clone.time === w.time);

            var pv = P.previewPath(P.createWorld(flat, { x: 5, z: 2 }, 0), 0, 10, 0, 0.5);
            assert('previewPath starts at the ball', pv.length > 2 && approx(pv[0].z, 2));
            assert('previewPath goes where the shot goes', pv[pv.length - 1].z > pv[0].z);
            assert('previewPath does not disturb the world', (function () {
                var t = P.createWorld(flat, { x: 5, z: 2 }, 0);
                P.previewPath(t, 1, 12, 0.4, 0.8);
                return t.ball.z === 2 && !t.moving;
            })());

            // A rail inside the preview window is part of the shot, so the
            // path rides through it and tags where it turns.
            assert('previewPath leaves an open shot untagged', (function () {
                return !P.previewPath(P.createWorld(flat, { x: 5, z: 2 }, 0), 0, 14, 0, 1)
                    .some(function (q) { return q.bounce; });
            })());

            var railed = lab({ walls: [A.wall(3, 8, 4, 0.4, 0.6)] });
            var bank = P.previewPath(P.createWorld(railed, { x: 5, z: 2 }, 0), 0, 14, 0, 1);
            var turn = -1;
            bank.forEach(function (q, qi) { if (q.bounce && turn < 0) turn = qi; });
            assert('previewPath tags the point it meets a rail',
                turn > 0 && approx(bank[turn].z, 8.2 - 0.2 - C.BALL_R, 0.05),
                'turn at z = ' + (turn > 0 ? bank[turn].z.toFixed(2) : 'never'));
            assert('previewPath carries on past the rail',
                turn > 0 && bank.length > turn + 4 &&
                bank[bank.length - 1].z < bank[turn].z,
                'ends at z = ' + bank[bank.length - 1].z.toFixed(2));
            assert('the ricochet is tagged once, not every step',
                bank.filter(function (q) { return q.bounce; }).length === 1);

            // Two rails inside one window is where honest prediction ends.
            var slot = lab({ walls: [A.wall(6, 0, 0.4, 20, 0.6), A.wall(3.6, 0, 0.4, 20, 0.6)] });
            var caged = P.previewPath(P.createWorld(slot, { x: 5, z: 2 }, 0), 1.1, 20, 0, 1);
            assert('previewPath stops at the second rail',
                caged.length < Math.ceil(1 / C.SIM_DT) &&
                caged.filter(function (q) { return q.bounce; }).length === 1,
                'length ' + caged.length);
            assert('the ricochet gets room the straight path does not',
                bank.length > Math.ceil(1 / C.SIM_DT) + 1,
                'length ' + bank.length);
        })();

        /* ── course data ───────────────────────────────────────────────── */

        section('Course data');
        (function () {
            assert('seven courses', G3.COURSES.length === 7);
            assert('forty-two holes in total', ALL.length === 42);
            assert('courseById finds a course', G3.courseById('quarry').id === 'quarry');
            assert('courseById falls back to the first', G3.courseById('nope').id === G3.COURSES[0].id);

            G3.COURSES.forEach(function (course) {
                assert(course.name + ': six holes', course.holes.length === 6);
                assert(course.name + ': has a theme and a blurb', !!course.theme && !!course.blurb);
            });

            var minThick = Infinity, worstGap = Infinity, worstGapName = '';
            ALL.forEach(function (entry) {
                var h = entry.hole, tag = entry.course.id + '/' + h.name;

                assert(tag + ': named and described', !!h.name && !!h.blurb);
                assert(tag + ': par is sane', h.par >= 2 && h.par <= 5);

                var teePad = P.surfaceTop(h, h.tee.x, h.tee.z);
                var cupPad = P.surfaceTop(h, h.cup.x, h.cup.z);
                assert(tag + ': there is ground under the tee', !!teePad);
                assert(tag + ': there is ground under the cup', !!cupPad);
                assert(tag + ': tee height matches its pad', teePad && approx(h.tee.y, teePad.y, 1e-9));
                /* surfaceTop in the middle of the cup is the floor of the cup,
                   so the lip is checked from just outside the rim — against the
                   pad's own surface there, not against cup.y. On a tilted green
                   those differ, and correctly so: the liner is sunk vertically,
                   the way a real one is, so one side of the rim sits proud. */
                var bx = h.cup.x + C.HOLE_R + 0.08, bz = h.cup.z + C.HOLE_R + 0.08;
                var beside = P.surfaceTop(h, bx, h.cup.z);
                var alsoBeside = P.surfaceTop(h, h.cup.x, bz);
                assert(tag + ': the ground carries on around the cup',
                    beside && alsoBeside &&
                    approx(beside.y, P.padHeight(beside.pad, bx, h.cup.z), 1e-9) &&
                    approx(alsoBeside.y, P.padHeight(alsoBeside.pad, h.cup.x, bz), 1e-9) &&
                    Math.abs(beside.y - h.cup.y) < 0.12 && Math.abs(alsoBeside.y - h.cup.y) < 0.12,
                    'lip ' + h.cup.y.toFixed(3) + ', ground ' + (beside && beside.y.toFixed(3)));
                assert(tag + ': the cup is cut a full depth into it',
                    cupPad && approx(cupPad.y, h.cup.y - C.CUP_DEPTH, 1e-9));

                /* The whole mouth of the cup has to be inside one pad. The rim
                   is a full circle in the physics and a hole punched out of one
                   slab in the renderer; a cup overhanging the edge of its pad
                   would be neither. */
                var own = null, q;
                for (q = 0; q < h.pads.length; q++) {
                    if (P.padContains(h.pads[q], h.cup.x, h.cup.z) &&
                        Math.abs(P.padHeight(h.pads[q], h.cup.x, h.cup.z) - h.cup.y) < 0.06) own = h.pads[q];
                }
                var clear = own ? Math.min(h.cup.x - own.x, own.x + own.w - h.cup.x,
                                           h.cup.z - own.z, own.z + own.d - h.cup.z) : 0;
                assert(tag + ': the mouth of the cup is clear of the pad edge',
                    clear > C.HOLE_R + 0.05, 'only ' + clear.toFixed(2) + ' to the edge');

                // Neither end may be inside a wall — a cup buried in a rail
                // cannot be holed and a tee inside one launches from a bounce.
                var teeBlocked = false, cupBlocked = false;
                h.walls.forEach(function (wl) {
                    var B = P.wallBox(wl, 0);
                    if (h.tee.y + C.BALL_R > B.base && h.tee.y + C.BALL_R - C.BALL_R < B.top &&
                        P.circleBox(h.tee.x, h.tee.z, C.BALL_R, B)) teeBlocked = true;
                    if (h.cup.y + C.BALL_R > B.base && h.cup.y < B.top &&
                        P.circleBox(h.cup.x, h.cup.z, C.HOLE_R, B)) cupBlocked = true;
                    minThick = Math.min(minThick, wl.w, wl.d);
                });
                assert(tag + ': the tee is clear of the walls', !teeBlocked);
                assert(tag + ': the cup is clear of the walls', !cupBlocked);

                /* Pads may only overlap when the surface lookup can tell them
                   apart. There are two ways to earn that. One is being clearly
                   a bridge above the other, which is a height gap. The other is
                   being an inlay — a green or a bunker laid into the ground it
                   sits on — which wins the tie by rule rather than by height,
                   and only ever changes what the ground is made of rather than
                   where it is. Anything else makes surfaceUnder depend on array
                   order, which is the bug this assertion exists to prevent.

                   An inlay has to actually be flush, though, or it is a step
                   nobody authored: checked here across the whole overlap
                   rather than at its middle, because a flat disc laid on
                   rolling ground is flush in the centre however wrong it is at
                   the rim. */
                var clash = null, seam = null, worstSeam = 0;
                for (var i = 0; i < h.pads.length && !clash; i++) {
                    for (var j = i + 1; j < h.pads.length && !clash; j++) {
                        var a = h.pads[i], b = h.pads[j];
                        var ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
                        var oz = Math.min(a.z + a.d, b.z + b.d) - Math.max(a.z, b.z);
                        if (ox <= 1e-9 || oz <= 1e-9) continue;   // touching is fine
                        /* Bounding boxes are the cheap reject and nothing more.
                           Two round bunkers beside a round green have boxes
                           that overlap and discs that do not, and asking the
                           boxes would fail a hole that is perfectly well built.
                           So the overlap is walked with the same padContains
                           the ball is standing on. */
                        var x0 = Math.max(a.x, b.x), z0 = Math.max(a.z, b.z);
                        var sx2, sz2, gap, both = false;
                        for (sx2 = 0.2; sx2 < ox; sx2 += 0.4) {
                            for (sz2 = 0.2; sz2 < oz; sz2 += 0.4) {
                                if (!P.padContains(a, x0 + sx2, z0 + sz2)) continue;
                                if (!P.padContains(b, x0 + sx2, z0 + sz2)) continue;
                                both = true;
                                gap = Math.abs(P.padHeight(a, x0 + sx2, z0 + sz2) -
                                               P.padHeight(b, x0 + sx2, z0 + sz2));
                                if (!a.inlay !== !b.inlay) {
                                    // One is laid into the other: they have to
                                    // agree everywhere, not merely in the middle.
                                    if (gap > worstSeam) { worstSeam = gap; seam = tag; }
                                } else if (gap < 0.35) {
                                    clash = i + '/' + j;
                                }
                            }
                        }
                        if (both && !a.inlay && !b.inlay && !clash &&
                            Math.abs(P.padHeight(a, x0 + ox / 2, z0 + oz / 2) -
                                     P.padHeight(b, x0 + ox / 2, z0 + oz / 2)) < 0.35) {
                            clash = i + '/' + j;
                        }
                    }
                }
                assert(tag + ': no two pads fight for the same ground', !clash, 'pads ' + clash);
                assert(tag + ': anything inlaid is flush with what it is laid into',
                    worstSeam <= C.STEP_UP,
                    (seam || '') + ' is out by ' + worstSeam.toFixed(3));

                /* Every hole has to put something on the line between the tee
                   and the cup: a wall, a hazard, a change of surface, a slope
                   or a step. A hole you can hole out on by aiming at the flag
                   and letting go is a corridor, not a hole. */
                var line = straightLineTrouble(h);
                assert(tag + ': the direct line is not empty', line.length > 0,
                    'nothing between the tee and the cup');

                /* Whatever moves has to let the ball past. Not at every phase
                   — a sweeper's whole job is to block the line and then move
                   off it — but often enough that waiting is a tactic and not a
                   life sentence. So: walk the line the obstacle sits on at 24
                   phases of its cycle, and count how many of them leave an
                   aiming window the ball can be steered through. A hole that
                   can be sealed shut scores zero here and the bot below never
                   finishes it. */
                var movers = h.walls.filter(function (wl) { return wl.move || wl.spin; });
                if (movers.length) {
                    movers.forEach(function (wl) {
                        var B0 = P.wallBox(wl, 0);
                        var period = wl.spin ? (2 * Math.PI / Math.abs(wl.spin)) : (2 * Math.PI / wl.move.speed);
                        var open = 0, widest = 0, k, t, g;
                        for (k = 0; k < 24; k++) {
                            t = period * k / 24;
                            g = widestGap(h, B0.cz, t);
                            widest = Math.max(widest, g);
                            if (g > 0.25) open++;
                        }
                        if (widest < worstGap) { worstGap = widest; worstGapName = tag; }
                        assert(tag + ': the way past this ' + (wl.spin ? 'blade' : 'gate') + ' opens and stays open',
                            open >= 8, 'only ' + open + ' of 24 phases are passable');
                        assert(tag + ': and it opens wide enough to aim at',
                            widest > 0.4, 'widest window ' + widest.toFixed(2));
                    });
                }
            });

            assert('no wall is thinner than 0.24', minThick >= 0.24, 'thinnest is ' + minThick.toFixed(3));

            /* A parkland bunker is cut into the grass around it, which is
               what makes it read as a bunker rather than a beige patch. That
               cut is also the one thing that could turn it into a well: a ball
               climbs STEP_UP and no more, so a bunker sunk deeper than that is
               a hazard you cannot putt out of — only fly out of — and the
               difference would never show up in a screenshot.

               Only pads that were deliberately sunk are checked. A sand pad
               level with its neighbours is fine by construction, and one at
               the foot of somebody else's slope (Highland's 'Over the Top'
               keeps its sand exactly there, on purpose) is that hole's
               business rather than this assertion's. */
            var worstDip = 0, worstDipName = '';
            ALL.forEach(function (entry) {
                entry.hole.pads.forEach(function (p) {
                    if (p.kind !== 'sand' || p.y >= 0) return;
                    if (-p.y > worstDip) {
                        worstDip = -p.y;
                        worstDipName = entry.course.id + '/' + entry.hole.name;
                    }
                });
            });
            /* A tree stands in the rough or on the edge of a fairway — never
               in a bunker and never on a green. Both would be absurd to look
               at, and a trunk in the sand is worse than absurd: it is a wall
               inside the one surface a ball cannot be putted out of. Easy to
               do by accident, too, since a treeline is authored as two ends
               and the bunkers it runs past are authored somewhere else. */
            var rooted = 0, badTree = '';
            ALL.forEach(function (entry) {
                entry.hole.walls.forEach(function (wl) {
                    if (wl.kind !== 'tree') return;
                    rooted++;
                    entry.hole.pads.forEach(function (p) {
                        if (p.kind !== 'sand' && p.kind !== 'green') return;
                        if (Math.min(p.x + p.w, wl.x + wl.w) - Math.max(p.x, wl.x) <= 0) return;
                        if (Math.min(p.z + p.d, wl.z + wl.d) - Math.max(p.z, wl.z) <= 0) return;
                        badTree = entry.course.id + '/' + entry.hole.name + ', a tree in the ' + p.kind;
                    });
                });
            });
            assert('no tree grows out of a bunker or a green', !badTree, badTree);
            assert('there are trees to check', rooted >= 20, rooted + ' trees');

            /* What an open hole owes the player. There is no fence to stop the
               ball, so three things have to hold or the course is unfair
               rather than merely open: nothing pretends to be a rail, the
               boundary contains the parts of the hole you are required to
               stand on, and — the one that would be invisible until somebody
               made a green too steep — the lie at every cup is inside its
               surface's angle of repose. A green that will not hold a ball
               beside its own hole cannot be putted on at all, and it is the
               reason CONFIG.HOLD.green is the number it is. */
            var openHoles = 0;
            ALL.forEach(function (entry) {
                var h = entry.hole, tag = entry.course.id + '/' + h.name;
                if (!h.open) return;
                openHoles++;
                assert(tag + ': an open hole has no rails on it',
                    h.walls.length === 0, h.walls.length + ' walls');
                assert(tag + ': and a boundary to be outside of', !!h.fence);
                assert(tag + ': the tee is in bounds',
                    !P.outOfBounds(h, h.tee.x, h.tee.z));
                var own = null, q;
                for (q = 0; q < h.pads.length; q++) {
                    if (h.pads[q].inlay && P.padContains(h.pads[q], h.cup.x, h.cup.z)) own = h.pads[q];
                }
                assert(tag + ': the whole green is in bounds', own && (function () {
                    var k, a2, ok2 = true;
                    for (k = 0; k < 16; k++) {
                        a2 = k / 16 * Math.PI * 2;
                        if (P.outOfBounds(h, h.cup.x + Math.cos(a2) * own.r,
                                             h.cup.z + Math.sin(a2) * own.r)) ok2 = false;
                    }
                    return ok2;
                })());
            });
            assert('there are open holes to check', openHoles === 6, openHoles + ' found');

            var worstLie = 0, worstLieName = '';
            ALL.forEach(function (entry) {
                var h = entry.hole;
                var lie = P.surfaceUnder(h, h.cup.x + C.HOLE_R + 0.1, h.cup.z, Infinity);
                if (!lie) return;
                var g2 = P.slopeAt(lie.pad, h.cup.x + C.HOLE_R + 0.1, h.cup.z) / P.holdOf(lie.pad.kind);
                if (g2 > worstLie) {
                    worstLie = g2;
                    worstLieName = entry.course.id + '/' + entry.hole.name + ' (' + lie.pad.kind + ')';
                }
            });
            assert('every cup sits on ground that will hold a ball beside it',
                worstLie <= 1, worstLieName + ' is at ' +
                (worstLie * 100).toFixed(0) + '% of what its surface can hold');

            assert('a ball can climb out of every bunker cut into the grass',
                worstDip <= C.STEP_UP + 1e-9,
                worstDipName + ' is sunk ' + worstDip.toFixed(3) +
                ' and STEP_UP is ' + C.STEP_UP);
            note('tightest window on any moving obstacle: ' + worstGap.toFixed(2) + ' of aim at ' +
                 worstGapName + ' (ball is ' + (C.BALL_R * 2).toFixed(2) + ' across)');

            /* What a ball would meet if it simply rolled from the tee to the
               cup. Returns the kinds of trouble found, so a failure says which
               hole is a plain corridor rather than just that one is. Walls are
               sampled at a few phases, because a gate that is off the line at
               t=0 is still on it a moment later. */
            function straightLineTrouble(hole) {
                var found = {}, teeY = hole.tee.y;
                var dx = hole.cup.x - hole.tee.x, dz = hole.cup.z - hole.tee.z;
                var len = Math.hypot(dx, dz), steps = Math.ceil(len / 0.1), i, t, x, z, surf, w, k, phase, B;
                // Stop before the cup: the hole in the ground is not an
                // obstacle on the way to itself, and counting it would make
                // this assertion pass for any corridor ever written.
                var stopAt = Math.max(0, (len - (C.HOLE_R + C.BALL_R)) / len);

                var px = -dz / len, pz = dx / len;      // perpendicular to the line

                for (i = 1; i < steps; i++) {
                    t = i / steps;
                    if (t > stopAt) break;
                    x = hole.tee.x + dx * t;
                    z = hole.tee.z + dz * t;

                    surf = P.surfaceUnder(hole, x, z, Infinity);
                    if (!surf) { found.gap = true; continue; }
                    /* Fairway counts for nothing here, and neither does
                       green: they are the two surfaces a hole is *supposed*
                       to be made of, and letting a parkland hole pass this
                       assertion by having a fairway on it would make the
                       assertion say nothing at all. */
                    if (surf.pad.kind !== 'green' && surf.pad.kind !== 'fairway') {
                        found[surf.pad.kind] = true;
                    }
                    if (Math.abs(surf.pad.sx || 0) + Math.abs(surf.pad.sz || 0) > 0.05) found.slope = true;
                    /* And on an open course the ground itself is the trouble:
                       a line that crosses a lie steeper than the surface will
                       hold is a line the ball will not simply run along. This
                       is the only signal the links holes could earn from their
                       contours, so it is deliberately the strict version —
                       "the ball would not stay here", not "this is not flat". */
                    if (P.slopeAt(surf.pad, x, z) > P.holdOf(surf.pad.kind)) found.contour = true;
                    if (Math.abs(surf.y - teeY) > 0.25) found.step = true;
                    // Water only counts if the line is over it rather than over
                    // a walkway above it — a bridge is not a hazard.
                    var pond = P.waterAt(hole, x, z);
                    if (pond && surf.y <= pond.y + 0.01) found.water = true;
                    // Ground narrow enough that missing the line costs you the
                    // ball is a challenge whether or not anything is in the way.
                    if (walkableWidth(hole, x, z, px, pz, surf.y) < 2.6) found.narrow = true;

                    for (k = 0; k < hole.walls.length; k++) {
                        w = hole.walls[k];
                        for (phase = 0; phase < 4; phase++) {
                            B = P.wallBox(w, phase * 0.6);
                            if (surf.y + C.BALL_R - C.BALL_R >= B.top || surf.y + C.BALL_R + C.BALL_R <= B.base) continue;
                            if (P.circleBox(x, z, C.BALL_R, B)) { found.wall = true; break; }
                        }
                    }
                }
                return Object.keys(found);
            }

            // How much ground there is either side of a point, across the line
            // of play, before it runs out or steps away.
            function walkableWidth(hole, x, z, px, pz, y) {
                var total = 0, dir, step, s2;
                for (dir = -1; dir <= 1; dir += 2) {
                    for (step = 0.15; step <= 1.6; step += 0.15) {
                        s2 = P.surfaceUnder(hole, x + px * dir * step, z + pz * dir * step, Infinity);
                        if (!s2 || Math.abs(s2.y - y) > 0.3) break;
                        total += 0.15;
                    }
                }
                return total;
            }

            // The widest stretch of open ground along a line, at a moment in
            // time. Used above to prove a gate cannot seal a hole shut.
            function widestGap(hole, z, t) {
                var step = 0.05, best = 0, run = 0, x;
                var boxes = hole.walls.map(function (wl) { return P.wallBox(wl, t); });
                for (x = hole.bounds.minX; x <= hole.bounds.maxX; x += step) {
                    var floor = P.surfaceUnder(hole, x, z, Infinity);
                    var open = !!floor;
                    if (open) {
                        for (var i = 0; i < boxes.length && open; i++) {
                            var B = boxes[i];
                            if (floor.y + C.BALL_R <= B.base || floor.y + C.BALL_R - C.BALL_R >= B.top) continue;
                            if (P.circleBox(x, z, C.BALL_R, B)) open = false;
                        }
                    }
                    if (open) { run += step; best = Math.max(best, run); } else { run = 0; }
                }
                return best;
            }
        })();

        /* ── the bag ───────────────────────────────────────────────────── */

        section('Clubs');
        (function () {
            var seenId = {}, seenKey = {}, flat = 0, longest = null;
            assert('there is a bag', C.CLUBS.length >= 2);
            C.CLUBS.forEach(function (club) {
                assert(club.id + ': named, keyed and described',
                    !!club.name && !!club.short && !!club.key && !!club.blurb);
                assert(club.id + ': loft is inside what launch() will accept',
                    club.loft >= 0 && club.loft <= C.MAX_LOFT,
                    (club.loft * 180 / Math.PI).toFixed(1) + '°');
                assert(club.id + ': a full swing is a legal shot',
                    club.power > C.MIN_POWER && club.power <= C.MAX_POWER);
                assert(club.id + ': the id is unique', !seenId[club.id]);
                assert(club.id + ': the shortcut is unique', !seenKey[club.key]);
                seenId[club.id] = seenKey[club.key] = true;
                if (club.loft === 0) flat++;
                if (!longest || club.power > longest.power) longest = club;
            });
            assert('at least one club rolls flat', flat >= 1);
            assert('the longest club reaches the whole power range', longest.power === C.MAX_POWER);
            assert('the default club is in the bag',
                C.CLUBS.filter(function (c) { return c.id === C.DEFAULT_CLUB; }).length === 1);

            // The feel constants are read by the chrome, not the simulation,
            // but a typo in one of them is invisible until someone plays.
            assert('the overswing mark is a fraction of the swing',
                C.OVERSWING > 0.5 && C.OVERSWING < 1);

            // The bag has to be able to do the two things the courses ask of
            // it: roll a long way, and go over something.
            var open = lab({ pads: [A.pad(0, 0, 10, 40)], cup: { x: 9, z: 39 } });
            var reach = 0;
            C.CLUBS.forEach(function (club) {
                var w = shootFrom(open, { x: 5, z: 1 }, 0, club.power, club.loft);
                reach = Math.max(reach, w.ball.z - 1);
            });
            assert('some club reaches ten units in one shot', reach > 10, 'best is ' + reach.toFixed(1));

            /* The wedge tops out around five and a half units of carry, so the
               rail goes where a lofted club is over it and a rolling one is
               not — about two and a half units out. Any hole asking for more
               air than that has to offer a way round. */
            var fence = lab({ walls: [A.wall(0, 4.6, 10, 0.4, 0.5, { base: 0 })] });
            var carried = C.CLUBS.some(function (club) {
                return shootFrom(fence, { x: 5, z: 2 }, 0, club.power, club.loft).ball.z > 5.2;
            });
            assert('some club carries a rail the putter would bounce off', carried);
            assert('and the putter is not that club',
                shootFrom(fence, { x: 5, z: 2 }, 0, clubOf('putter').power, clubOf('putter').loft).ball.z < 4.8);

            function clubOf(id) {
                return C.CLUBS.filter(function (c) { return c.id === id; })[0];
            }
        })();

        /* ── the overdraw ──────────────────────────────────────────────── */

        section('Overdraw and spray');
        (function () {
            assert('the overdraw is a real stretch of meter, and a bounded one',
                C.OVERDRAW > 0 && C.OVERDRAW <= 0.5, (C.OVERDRAW * 100).toFixed(0) + '%');

            assert('a full swing is 0 into the overdraw, and the end of the meter is 1',
                P.overdraw(10, 10) === 0 && P.overdraw(10 * (1 + C.OVERDRAW), 10) === 1);
            assert('anything under a full swing is 0 into it',
                P.overdraw(4, 10) === 0 && P.overdraw(9.99, 10) === 0);
            assert('the overdraw is measured per club, not in raw power',
                approx(P.overdraw(28 * (1 + C.OVERDRAW / 2), 28),
                       P.overdraw(10.5 * (1 + C.OVERDRAW / 2), 10.5)));
            assert('past the end of the meter it is still 1', P.overdraw(99, 10) === 1);

            /* The rule the whole trade rests on: inside a full swing the shot
               is the shot, and the preview is not lying to you. */
            assert('a full swing sprays by nothing at all',
                P.spray(0).yaw === 0 && P.spray(0).power === 0);
            var honest = P.sprayShot(0.7, 12, 0, function () { return 1; });
            assert('…so the shot played is exactly the shot asked for',
                honest.yaw === 0.7 && honest.power === 12);

            var half = P.spray(0.5), full = P.spray(1);
            assert('the worst of it is the configured spray',
                approx(full.yaw, C.SPRAY_YAW) && approx(full.power, C.SPRAY_POWER));
            assert('spray grows with the overdraw',
                half.yaw > 0 && half.yaw < full.yaw && half.power < full.power);

            /* Exponential, not linear: half the overdraw has to buy much less
               than half the trouble, or there is no reason to stop at 100% and
               no reason to fear 130%. */
            assert('and grows exponentially, not in step with the meter',
                half.yaw < full.yaw * 0.35,
                'half the overdraw is ' + (half.yaw / full.yaw * 100).toFixed(0) + '% of the spray');
            var q = P.spray(0.25), t3 = P.spray(0.75);
            assert('each quarter of the overdraw costs more than the one before',
                (t3.yaw - half.yaw) > (half.yaw - q.yaw) && (half.yaw - q.yaw) > q.yaw);

            // Both draws are used, and both are bounded by what spray() says.
            var lo = P.sprayShot(0, 20, 1, function () { return 0; });
            var hi = P.sprayShot(0, 20, 1, function () { return 1; });
            assert('a thrashed shot misses left and right of the line',
                approx(lo.yaw, -C.SPRAY_YAW) && approx(hi.yaw, C.SPRAY_YAW));
            assert('…and heavy and light of the weight',
                approx(lo.power, 20 * (1 - C.SPRAY_POWER)) &&
                approx(hi.power, 20 * (1 + C.SPRAY_POWER)));

            // Line and weight are drawn separately: pulled and thin is two
            // mistakes, not the same one twice.
            var seq = [0, 1], k = 0;
            var mixed = P.sprayShot(0, 20, 1, function () { return seq[k++]; });
            assert('the line and the weight are two draws',
                mixed.yaw < 0 && mixed.power > 20);

            /* And the extra power is real: the simulation has to accept a
               swing past the longest club's ceiling, or the overdraw would be
               all cost and no distance. */
            var open = lab({ pads: [A.pad(0, 0, 10, 60)], cup: { x: 5, z: 55 } });
            var fullSwing = shootFrom(open, { x: 5, z: 1 }, 0, C.MAX_POWER, 0);
            var thrashed = shootFrom(open, { x: 5, z: 1 }, 0, C.MAX_POWER * (1 + C.OVERDRAW), 0);
            assert('an overdrawn swing goes further than a full one',
                thrashed.ball.z > fullSwing.ball.z + 1,
                fullSwing.ball.z.toFixed(1) + ' → ' + thrashed.ball.z.toFixed(1));

            var w = P.createWorld(open, { x: 5, z: 1 }, 0);
            P.launch(w, 0, C.MAX_POWER * (1 + C.OVERDRAW), 0);
            assert('launch() does not clip the overdraw off the top',
                approx(P.groundSpeed(w.ball), C.MAX_POWER * (1 + C.OVERDRAW), 0.01),
                P.groundSpeed(w.ball).toFixed(2));

            // The cone is drawn from spray(), so its own constants have to be
            // the kind a renderer can use: an angle, a width and a cutoff.
            assert('the cone has a base angle, a width and a range',
                C.CONE_ANGLE > 0 && C.CONE_ANGLE < 0.2 &&
                C.CONE_WIDTH > 0 && C.CONE_RANGE > 2);
            assert('the cone fades out over a real stretch of its length',
                C.CONE_FADE > 0.1 && C.CONE_FADE < 0.9);
            assert('a full-power shot outruns the cone, so the cutoff matters',
                C.MAX_POWER / -Math.log(C.FRICTION.green) > C.CONE_RANGE);
        })();

        /* ── scoring ───────────────────────────────────────────────────── */

        section('Scoring and the save file');
        (function () {
            assert('one stroke is an ace', S.term(1, 3).kind === 'ace');
            assert('two under par is an eagle', S.term(1, 3).label === 'Hole in One!' && S.term(2, 4).label === 'Eagle');
            assert('one under par is a birdie', S.term(2, 3).label === 'Birdie');
            assert('par is par', S.term(3, 3).label === 'Par');
            assert('one over is a bogey', S.term(4, 3).label === 'Bogey');
            assert('three under is an albatross', S.term(2, 5).label === 'Albatross');
            assert('far over gives up and counts', S.term(9, 3).label === '+6');

            assert('level par formats as E', S.formatVsPar(0) === 'E');
            assert('over par keeps its sign', S.formatVsPar(3) === '+3');
            assert('under par keeps its sign', S.formatVsPar(-2) === '-2');

            var holes = G3.COURSES[0].holes;
            assert('course par is the sum of the holes', S.coursePar(holes) === holes.reduce(function (a, h) { return a + h.par; }, 0));

            var partial = [3, 2];
            var t = S.totals(partial, holes);
            assert('totals only count holes played', t.played === 2 && t.strokes === 5);
            assert('totals compare against the par of those holes',
                t.vsPar === 5 - (holes[0].par + holes[1].par));
            assert('an empty card totals zero', S.totals([], holes).played === 0);
            assert('a gap in the card is skipped', S.totals([3, undefined, 4], holes).played === 2);

            var card = holes.map(function (h) { return h.par; });
            var first = S.recordRound(S.emptySave(), 'seaside', card, holes);
            assert('a first round is always a record', first.isBest);
            assert('the record is the round total', first.save.courses.seaside.best === S.coursePar(holes));
            assert('rounds are counted', first.save.rounds === 1 && first.save.courses.seaside.rounds === 1);

            var worse = card.slice(); worse[0] += 4;
            var second = S.recordRound(first.save, 'seaside', worse, holes);
            assert('a worse round is not a record', !second.isBest);
            assert('a worse round leaves the record alone', second.save.courses.seaside.best === first.save.courses.seaside.best);
            assert('but it still counts as a round', second.save.rounds === 2);

            var better = card.slice(); better[0] = 1;
            var third = S.recordRound(second.save, 'seaside', better, holes);
            assert('a better round takes the record', third.isBest);
            assert('an ace is counted', third.save.aces === 1);
            assert('the best card is kept', third.save.courses.seaside.bestCard[0] === 1);

            var other = S.recordRound(third.save, 'quarry', G3.COURSES[1].holes.map(function (h) { return h.par; }), G3.COURSES[1].holes);
            assert('another course keeps its own record', other.save.courses.quarry.best !== undefined);
            assert('and does not disturb the first', other.save.courses.seaside.best === third.save.courses.seaside.best);
            assert('courseRecord returns an empty record for an unplayed course',
                S.courseRecord(S.emptySave(), 'works').best === null);

            // Round-trip through localStorage under a scratch key, so running
            // the tests never costs anyone their records.
            var realKey = C.SAVE_KEY;
            C.SAVE_KEY = 'loftLinks.test.tmp';
            try {
                S.save(third.save);
                var back = S.load();
                assert('a save round-trips', back.courses.seaside.best === third.save.courses.seaside.best &&
                    back.aces === third.save.aces);
                localStorage.setItem(C.SAVE_KEY, '{not json');
                assert('a corrupt save loads as empty', S.load().rounds === 0);
                localStorage.setItem(C.SAVE_KEY, JSON.stringify({ courses: { seaside: { best: 'x' } }, rounds: 'y' }));
                assert('nonsense fields are dropped', S.load().courses.seaside.best === null);
                localStorage.removeItem(C.SAVE_KEY);
                assert('a missing save loads as empty', S.load().rounds === 0);
            } finally {
                C.SAVE_KEY = realKey;
            }
        })();

        /* ── the bot ───────────────────────────────────────────────────── */

        section('The bot plays every hole');
        (function () {
            var BOT_DT = 1 / 60, BOT_SECONDS = 12, sims = 0;

            function d2(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }

            function trial(hole, from, yaw, power, loft, time) {
                sims++;
                var w = P.createWorld(hole, from, time);
                if (!P.launch(w, yaw, power, loft)) return null;
                P.settle(w, BOT_SECONDS, BOT_DT);
                return w;
            }

            /* A greedy player: fan out candidate shots, keep the one that ends
               nearest the cup, repeat. Two refinements around the best coarse
               shot give it the precision to actually hole out.

               It plays out of the same bag the player gets, so this is a test
               that the holes are solvable with the clubs that exist rather than
               with any loft the physics would accept.

               Two details matter. Holes with moving parts get candidates that
               wait before striking, because a bot that always fires at t=0
               would report a false failure on a timing hole. And a chosen shot
               has to go somewhere: without that rule the bot parks in a corner
               where every legal shot looks worse than standing still, and plays
               the same nothing until it runs out of strokes. */
            function bestShot(hole, from, time, bag) {
                var cup = hole.cup;
                var base = Math.atan2(cup.x - from.x, cup.z - from.z);
                var moves = hole.walls.some(function (wl) { return wl.move || wl.spin; });
                var waits = moves ? [0, 0.45, 0.95, 1.5] : [0];
                var here = d2(from, cup);
                var best = null;
                bag = bag || C.CLUBS;

                function consider(yaw, club, power, wait) {
                    var w = trial(hole, from, yaw, power, club.loft, time + wait);
                    if (!w) return;
                    var moved = Math.hypot(w.ball.x - from.x, w.ball.z - from.z);
                    var s;
                    if (w.sunk) s = -1000;
                    else if (w.splash || w.out) s = 500 + d2(w.origin, cup);
                    else s = d2(w.ball, cup);
                    if (!w.sunk && moved < 1 && s >= here) return;
                    if (!best || s < best.s) best = { s: s, yaw: yaw, club: club, power: power, wait: wait, world: w };
                }

                var i, N = 16;
                bag.forEach(function (club) {
                    for (i = 0; i < N; i++) {
                        [0.35, 0.7, 1].forEach(function (f) {
                            consider(base + (i / N) * Math.PI * 2, club, club.power * f, 0);
                        });
                    }
                });

                var b0 = best;
                if (!b0) return null;
                [-2, -1, 0, 1, 2].forEach(function (k) {
                    bag.forEach(function (club) {
                        [0.25, 0.5, 0.75, 1].forEach(function (f) {
                            waits.forEach(function (wait) {
                                consider(b0.yaw + k * 0.11, club, club.power * f, wait);
                            });
                        });
                    });
                });
                var b1 = best;
                [-3, -2, -1, 0, 1, 2, 3].forEach(function (k) {
                    [-0.7, -0.35, 0, 0.35, 0.7].forEach(function (dp) {
                        waits.forEach(function (wait) {
                            consider(b1.yaw + k * 0.03, b1.club,
                                Math.max(C.MIN_POWER, Math.min(b1.club.power, b1.power + dp)), wait);
                        });
                    });
                });
                return best;
            }

            function play(hole, maxStrokes, bag) {
                var from = { x: hole.tee.x, z: hole.tee.z, y: hole.tee.y + C.BALL_R };
                var time = 0, strokes = 0, penalties = 0, s, shot;
                for (s = 0; s < maxStrokes; s++) {
                    shot = bestShot(hole, from, time, bag);
                    if (!shot) break;
                    strokes++;
                    time = shot.world.time;
                    if (shot.world.sunk) return { sunk: true, strokes: strokes + penalties };
                    if (shot.world.splash || shot.world.out) {
                        penalties++;
                        from = { x: shot.world.origin.x, z: shot.world.origin.z, y: shot.world.origin.y };
                    } else {
                        from = { x: shot.world.ball.x, z: shot.world.ball.z, y: shot.world.ball.y };
                    }
                }
                return { sunk: false, strokes: strokes + penalties };
            }

            var b0 = performance.now();
            ALL.forEach(function (entry) {
                var h = entry.hole;
                var r = play(h, 8);
                assert(entry.course.id + '/' + h.name + ': the bot holes out with the clubs it has (par ' + h.par + ')',
                    r.sunk, r.sunk ? '' : 'gave up after ' + r.strokes + ' strokes');
                if (r.sunk) {
                    assert(entry.course.id + '/' + h.name + ': and does it in a plausible number of strokes',
                        r.strokes <= h.par + 2, 'took ' + r.strokes);
                }
            });
            note(sims + ' simulated shots in ' + Math.round(performance.now() - b0) + 'ms');

            /* Some holes exist to be flown. Tidewater's islands and tabletop,
               Highland's steps and its wall: on those the loft is the hole, and
               a hole that turns out to have a quiet route along the floor is a
               hole that has lost its point — usually because a rail moved or a
               step got shorter, and always without anyone noticing.

               So the same bot plays them again out of half a bag, with only the
               clubs that keep the ball down, and has to fail. It is a stronger
               statement than "the wedge works here": it is "nothing else does".
               Holes without the flag are free to have a flat answer, and
               several deliberately do — Under the Boardwalk wants one. */
            var b1 = performance.now(), flatBag = [], marked = 0;
            C.CLUBS.forEach(function (club) {
                if (club.loft < 10 * Math.PI / 180) flatBag.push(club);
            });
            assert('there are flat clubs to try', flatBag.length >= 2);
            ALL.forEach(function (entry) {
                var h = entry.hole;
                if (!h.needsLoft) return;
                marked++;
                var r = play(h, 10, flatBag);
                assert(entry.course.id + '/' + h.name + ': cannot be played along the floor',
                    !r.sunk, 'the flat bag holed out in ' + r.strokes);
            });
            assert('some holes are marked as needing loft', marked >= 6, marked + ' marked');
            note(marked + ' holes checked against the flat bag in ' +
                 Math.round(performance.now() - b1) + 'ms');
        })();

        /* ── done ──────────────────────────────────────────────────────── */

        var el = document.getElementById('summary');
        el.className = failed ? 'bad' : 'ok';
        el.textContent = (failed ? '✗ ' + failed + ' failed, ' : '✓ ') + passed + ' passed' +
            ' — ' + Math.round(performance.now() - t0) + 'ms';
        window.TEST_RESULT = { passed: passed, failed: failed, fails: window.FAILS };
    })();
    </script>
</body>
</html>
