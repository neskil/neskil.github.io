            // Authoring decor helpers & flexible argument handling
            var helperKinds = ['buoy', 'piling', 'bench', 'boat', 'sailboat', 'bin', 'barrel', 'crate', 'palm', 'pine', 'sign', 'windmill'];
            var helpersOk = helperKinds.every(function (k) {
                return typeof A[k] === 'function' && A[k](1, 2).kind === k;
            });
            assert('all decor authoring helpers are exported and produce correct kinds', helpersOk);
            var autoYDecor = A.sign(1, 2, { yaw: 0.5 });
            var explicitYDecor = A.sign(1, 2, 1.4, { yaw: 0.5 });
            assert('decor helper shifts opts and tracks explicitY state',
                autoYDecor.explicitY === false && autoYDecor.yaw === 0.5 &&
                explicitYDecor.explicitY === true && explicitYDecor.y === 1.4 && explicitYDecor.yaw === 0.5);

            /* ── the mown ground holds a ball ────────────────────────────

               The steepness check above walks every contoured pad and skips
               `open` holes outright, with a comment saying Whinstone's ground
               is its own thing. That was true when Whinstone was the only open
               hole on the card. It is now eighteen of them, and half those
               holes have four units of climb on them, so "the long game is
               exempt" had quietly become "the courses with the most terrain on
               them are the ones nothing measures".

               What replaces it is narrower and says what it means. The links
               is a scattered dune field and its *fairways* are supposed to be
               wild — a lie on the shoulder of a dune is the whole course, and
               `dunes` has no way to keep off ground it is not told about. So:

               - **Every green holds a ball, everywhere on it.** No exceptions,
                 open or drawn, links or parkland. A green steeper than
                 CONFIG.HOLD.green sheds a ball from wherever it lands, which
                 makes it a roof rather than a green, and the existing checks
                 only ever looked at the ring around the cup — a landform
                 crossing the far side of a green would pass every one of them.
               - **A hole written in rows keeps its fairway inside the angle of
                 repose too.** A `shaped` hole's field is placed by hand, pad
                 by pad, so there is no excuse for a fairway you cannot stop on
                 — and it is exactly the thing that goes wrong when a row is
                 given more tilt: the tilt and the landform on top of it add,
                 and the sum is nobody's number until it is measured. Every one
                 of the twelve parkland and heath holes was over this line at
                 some point while the climbs were being written.

               Both are measured inside the boundary, because ground outside
               the stakes is country rather than golf course. */
            var worstMown = 0, mownAt = '', mownKinds = 0;
            ALL.forEach(function (entry) {
                var h = entry.hole;
                h.pads.forEach(function (p) {
                    if (!hasRelief(p)) return;
                    var mown = p.kind === 'green' ||
                        (p.kind === 'fairway' && h.shaped);
                    if (!mown) return;
                    mownKinds++;
                    var hold = P.holdOf(p.kind), x, z, g;
                    for (x = p.x; x <= p.x + p.w + 1e-9; x += 0.3) {
                        for (z = p.z; z <= p.z + p.d + 1e-9; z += 0.3) {
                            if (!P.padContains(p, x, z)) continue;
                            if (h.fence && P.outOfBounds(h, x, z)) continue;
                            g = P.slopeAt(p, x, z) / hold;
                            if (g > worstMown) {
                                worstMown = g;
                                mownAt = entry.course.id + '/' + h.name +
                                    ' (' + p.kind + ' at ' + x.toFixed(1) + ', ' + z.toFixed(1) + ')';
                            }
                        }
                    }
                });
            });
            assert('there is mown ground on rolling holes to check', mownKinds >= 20,
                mownKinds + ' pads');
            assert('a green — and a written fairway — holds a ball everywhere on it',
                worstMown <= 1, mownAt + ' is at ' +
                (worstMown * 100).toFixed(0) + '% of what its surface can hold');

            /* ── and the long game has ground on it ──────────────────────

               The one statement about these courses that no other assertion
               makes, and the one that would go quietly if somebody flattened a
               hole to fix something else. Every hole in the long game is
               supposed to be built out of the shape of its own ground: not a
               corridor with a bunker in it, but a piece of country with height
               in it that you have to read before you can play it.

               Two and a half units is not a demanding line — it is a little
               over a ball's diameter every two units of a par four, and every
               hole on the three courses clears it. It is set where it is
               because that is roughly where relief stops being visible from
               the tee: the whole of Ashdown Park sat under it before the
               climbs were written, which is exactly the state this exists to
               keep it out of. Measured inside the boundary, because a mountain
               out in the country is scenery rather than golf. */
            var relief = {}, thinnest = Infinity, thinnestAt = '';
            ALL.forEach(function (entry) {
                var h = entry.hole;
                if (!h.long && entry.course.group !== 'long') return;
                var lo = Infinity, hi = -Infinity, x, z, sf;
                var b = h.bounds;
                for (x = b.minX; x <= b.maxX; x += 0.7) {
                    for (z = b.minZ; z <= b.maxZ; z += 0.7) {
                        if (P.outOfBounds(h, x, z)) continue;
                        sf = P.surfaceUnder(h, x, z, Infinity);
                        if (!sf) continue;
                        if (sf.y < lo) lo = sf.y;
                        if (sf.y > hi) hi = sf.y;
                    }
                }
                var range = hi - lo;
                relief[entry.course.id] = (relief[entry.course.id] || 0) + range / 6;
                if (range < thinnest) {
                    thinnest = range;
                    thinnestAt = entry.course.id + '/' + h.name;
                }
            });
            assert('every long-game hole has real height in it',
                thinnest >= 2.5,
                thinnestAt + ' has ' + thinnest.toFixed(2) + ' of relief inside its boundary');
            note('relief per long course, averaged over its six holes: ' +
                Object.keys(relief).map(function (k) {
                    return k + ' ' + relief[k].toFixed(1);
                }).join(', '));

            /* What an open hole owes the player. There is no fence to stop the
               ball, so three things have to hold or the course is unfair
               rather than merely open: nothing pretends to be a rail, the
               boundary contains the parts of the hole you are required to
               stand on, and — the one that would be invisible until somebody
               made a green too steep — the lie at every cup is inside its
               surface's angle of repose. A green that will not hold a ball
               beside its own hole cannot be putted on at all, and it is the
               reason CONFIG.HOLD.green is the number it is. */
            var openHoles = 0;
            ALL.forEach(function (entry) {
                var h = entry.hole, tag = entry.course.id + '/' + h.name;
                if (!h.open) return;
                openHoles++;
                /* No *rails*, which is not the same as no walls: a parkland
                   hole has trees on it and they are as solid open as they were
                   fenced. What may not be there is the thing `enclose` builds,
                   because a boundary you can bounce off is not a boundary you
                   may cross. */
                assert(tag + ': an open hole has no rails on it',
                    h.walls.every(function (wl) { return wl.kind !== 'rail'; }),
                    h.walls.filter(function (wl) { return wl.kind === 'rail'; }).length + ' rails');
                assert(tag + ': and a boundary to be outside of', !!h.fence);
                assert(tag + ': the tee is in bounds',
                    !P.outOfBounds(h, h.tee.x, h.tee.z));
                /* A disc green is walked round its own outline — the one
                   physics.padRadius gives, wave and oval and all, from the
                   disc's own middle rather than from the pin, which on an oval
                   with the flag cut towards one end are two very different
                   circles. A green cut out of `bands` is a cell of a row and
                   has no outline to walk, so it is held to the clearing every
                   cup is promised. Either way the statement is the same one:
                   the surface you have to putt on may not be partly out of
                   bounds. */
                var own = null, q;
                for (q = 0; q < h.pads.length; q++) {
                    if (h.pads[q].inlay && P.padContains(h.pads[q], h.cup.x, h.cup.z)) own = h.pads[q];
                }
                assert(tag + ': the whole green is in bounds', (function () {
                    var k, a2, rr, ok2 = true;
                    var ox = own ? own.x + own.w / 2 : h.cup.x;
                    var oz = own ? own.z + own.d / 2 : h.cup.z;
                    for (k = 0; k < 32; k++) {
                        a2 = k / 32 * Math.PI * 2;
                        rr = own ? P.padRadius(own, a2) : A.CUP_FLAT;
                        if (P.outOfBounds(h, ox + Math.cos(a2) * rr,
                                             oz + Math.sin(a2) * rr)) ok2 = false;
                    }
                    return ok2;
                })());
                /* And the ground has to run past the line. An open hole is
                   only fair if a ball that crosses the boundary lands on
                   something: a fence with a cliff behind it is a rail that
                   costs a stroke. */
                /* …except where there is no country to have: Coral Keys is
                   islands in a sea, everything past them is water, and the
                   water is the penalty a boundary would have been. */
                if (h.stakes !== false) assert(tag + ': there is country outside the boundary',
                    P.fenceRects(h).every(function (f) {
                        return [[f.x - 2, f.z + f.d / 2], [f.x + f.w + 2, f.z + f.d / 2],
                                [f.x + f.w / 2, f.z - 2], [f.x + f.w / 2, f.z + f.d + 2]]
                            .some(function (pt) {
                                return !!P.surfaceUnder(h, pt[0], pt[1], Infinity);
                            });
                    }));
            });
            assert('there are open holes to check', openHoles === 30, openHoles + ' found');

            var worstLie = 0, worstLieName = '';
            ALL.forEach(function (entry) {
                var h = entry.hole;
                var lie = P.surfaceUnder(h, h.cup.x + C.HOLE_R + 0.1, h.cup.z, Infinity);
                if (!lie) return;
                var g2 = P.slopeAt(lie.pad, h.cup.x + C.HOLE_R + 0.1, h.cup.z) / P.holdOf(lie.pad.kind);
                if (g2 > worstLie) {
                    worstLie = g2;
                    worstLieName = entry.course.id + '/' + entry.hole.name + ' (' + lie.pad.kind + ')';
                }
            });
            assert('every cup sits on ground that will hold a ball beside it',
                worstLie <= 1, worstLieName + ' is at ' +
                (worstLie * 100).toFixed(0) + '% of what its surface can hold');

            assert('a ball can climb out of every bunker cut into the grass',
                worstDip <= C.STEP_UP + 1e-9,
                worstDipName + ' is sunk ' + worstDip.toFixed(3) +
                ' and STEP_UP is ' + C.STEP_UP);
            note('tightest window on any moving obstacle: ' + worstGap.toFixed(2) + ' of aim at ' +
                 worstGapName + ' (ball is ' + (C.BALL_R * 2).toFixed(2) + ' across)');

            /* What a ball would meet if it simply rolled from the tee to the
               cup. Returns the kinds of trouble found, so a failure says which
               hole is a plain corridor rather than just that one is. Walls are
               sampled at a few phases, because a gate that is off the line at
               t=0 is still on it a moment later. */
            function straightLineTrouble(hole) {
                var found = {}, teeY = hole.tee.y;
                var dx = hole.cup.x - hole.tee.x, dz = hole.cup.z - hole.tee.z;
                var len = Math.hypot(dx, dz), steps = Math.ceil(len / 0.1), i, t, x, z, surf, w, k, phase, B;
                // Stop before the cup: the hole in the ground is not an
                // obstacle on the way to itself, and counting it would make
                // this assertion pass for any corridor ever written.
                var stopAt = Math.max(0, (len - (C.HOLE_R + C.BALL_R)) / len);

                var px = -dz / len, pz = dx / len;      // perpendicular to the line

                // A gravity well near the line bends it (physics.wellPull),
                // which is trouble on it as surely as a wall is.
                (hole.wells || []).forEach(function (wl) {
                    var u = Math.max(0, Math.min(1, ((wl.x - hole.tee.x) * dx + (wl.z - hole.tee.z) * dz) / (len * len)));
                    if (Math.hypot(hole.tee.x + dx * u - wl.x, hole.tee.z + dz * u - wl.z) < wl.core * 4) found.well = true;
                });

                for (i = 1; i < steps; i++) {
                    t = i / steps;
                    if (t > stopAt) break;
                    x = hole.tee.x + dx * t;
                    z = hole.tee.z + dz * t;

                    surf = P.surfaceUnder(hole, x, z, Infinity);
                    if (!surf) { found.gap = true; continue; }
                    /* Fairway counts for nothing here, and neither does
                       green: they are the two surfaces a hole is *supposed*
                       to be made of, and letting a parkland hole pass this
                       assertion by having a fairway on it would make the
                       assertion say nothing at all. */
                    if (surf.pad.kind !== 'green' && surf.pad.kind !== 'fairway') {
                        found[surf.pad.kind] = true;
                    }
                    if (Math.abs(surf.pad.sx || 0) + Math.abs(surf.pad.sz || 0) > 0.05) found.slope = true;
                    /* And on an open course the ground itself is the trouble:
                       a line that crosses a lie steeper than the surface will
                       hold is a line the ball will not simply run along. This
                       is the only signal the links holes could earn from their
                       contours, so it is deliberately the strict version —
                       "the ball would not stay here", not "this is not flat". */
                    if (P.slopeAt(surf.pad, x, z) > P.holdOf(surf.pad.kind)) found.contour = true;
                    // And a line that leaves the property is the plainest
                    // trouble there is: that is what a dogleg *is*.
                    if (P.outOfBounds(hole, x, z)) found.outOfBounds = true;
                    if (Math.abs(surf.y - teeY) > 0.25) found.step = true;
                    // Water only counts if the line is over it rather than over
                    // a walkway above it — a bridge is not a hazard.
                    var pond = P.waterAt(hole, x, z);
                    if (pond && surf.y <= pond.y + 0.01) found.water = true;
                    // Ground narrow enough that missing the line costs you the
                    // ball is a challenge whether or not anything is in the way.
                    if (walkableWidth(hole, x, z, px, pz, surf.y) < 2.6) found.narrow = true;

                    for (k = 0; k < hole.walls.length; k++) {
                        w = hole.walls[k];
                        for (phase = 0; phase < 4; phase++) {
                            B = P.wallBox(w, phase * 0.6);
                            if (surf.y + C.BALL_R - C.BALL_R >= B.top || surf.y + C.BALL_R + C.BALL_R <= B.base) continue;
                            if (P.circleBox(x, z, C.BALL_R, B)) { found.wall = true; break; }
                        }
                    }
                }
                return Object.keys(found);
            }

            /* How far inside its own outline a point is. Zero on the edge,
               largest in the middle, and negative outside — the same answer
               for a disc pad and a rectangular one, which is what lets the
               inlay check above look at the rim without caring which it is. */
            function edgeDist(pad, x, z) {
                if (pad.r) {
                    var dx = x - (pad.x + pad.w / 2), dz = z - (pad.z + pad.d / 2);
                    // Off the disc's own waved edge, not off its circle.
                    return P.padRadius(pad, Math.atan2(dz, dx)) - Math.hypot(dx, dz);
                }
                return Math.min(x - pad.x, pad.x + pad.w - x,
                                z - pad.z, pad.z + pad.d - z);
            }

            // How much ground there is either side of a point, across the line
            // of play, before it runs out or steps away.
            function walkableWidth(hole, x, z, px, pz, y) {
                var total = 0, dir, step, s2;
                for (dir = -1; dir <= 1; dir += 2) {
                    for (step = 0.15; step <= 1.6; step += 0.15) {
                        s2 = P.surfaceUnder(hole, x + px * dir * step, z + pz * dir * step, Infinity);
                        if (!s2 || Math.abs(s2.y - y) > 0.3) break;
                        total += 0.15;
                    }
                }
                return total;
            }

            // The widest stretch of open ground along a line, at a moment in
            // time. Used above to prove a gate cannot seal a hole shut.
            function widestGap(hole, z, t) {
                var step = 0.05, best = 0, run = 0, x;
                var boxes = hole.walls.map(function (wl) { return P.wallBox(wl, t); });
                for (x = hole.bounds.minX; x <= hole.bounds.maxX; x += step) {
                    var floor = P.surfaceUnder(hole, x, z, Infinity);
                    var open = !!floor;
                    if (open) {
                        for (var i = 0; i < boxes.length && open; i++) {
                            var B = boxes[i];
                            if (floor.y + C.BALL_R <= B.base || floor.y + C.BALL_R - C.BALL_R >= B.top) continue;
                            if (P.circleBox(x, z, C.BALL_R, B)) open = false;
                        }
                    }
                    if (open) { run += step; best = Math.max(best, run); } else { run = 0; }
                }
                return best;
            }
        })();

        /* ── ground that does something ─────────────────────────────────── */

        /* Ice, travelators, launch pads, pipes and backspin. Five mechanics
           that are each about four lines of physics.js, which is exactly why
           they need a section of their own: a change that quietly stops a belt
           pushing is a change nothing else in this file would notice, and the
           courses that depend on them would go on passing the bot because a
           dead belt is simply a plank.

           So every one of these is written to fail if the mechanic is removed
           rather than merely to pass while it is there. Where that means
           comparing two shots, the pair is the assertion. */

        section('Ground that does something');
        (function () {
            var flat = lab({ pads: [A.pad(0, 0, 10, 60)], cup: { x: 5, z: 55 } });
            var iced = lab({ pads: [A.pad(0, 0, 10, 60, 0, 'ice')], cup: { x: 5, z: 55 } });

            // ── ice ──
            assert('ice is the slickest surface in the game',
                C.FRICTION.ice > C.FRICTION.wood && C.FRICTION.ice > C.FRICTION.green);
            assert('…and holds a stopped ball on less than a plank does',
                C.HOLD.ice < C.HOLD.wood);
            var onGrass = shootFrom(flat, { x: 5, z: 2 }, 0, 10.5, 0).ball.z - 2;
            var onIce = shootFrom(iced, { x: 5, z: 2 }, 0, 10.5, 0).ball.z - 2;
            assert('a putt runs three times as far on ice as on grass',
                onIce > onGrass * 3,
                onIce.toFixed(1) + ' against ' + onGrass.toFixed(1));
            /* The number the whole of Icehouse Yard is designed against, and
               the reason it is asserted rather than remembered: every hole on
               that course is laid out so that a full swing is too much, and a
               friction tweak that shortened this by a third would leave six
               holes nobody can reach the pin on. */
            assert('and a full putter on ice outruns the longest mini golf hole',
                onIce > 28 && onIce < 36, 'runs ' + onIce.toFixed(1));
            var slopedIce = lab({
                pads: [A.pad(0, 0, 10, 30, 1.2, 'ice', 0, -0.04), A.pad(0, 30, 10, 8)],
                cup: { x: 5, z: 34 }
            });
            assert('a ball cannot come to rest on ice with any fall on it',
                shootFrom(slopedIce, { x: 5, z: 3 }, 0, C.MIN_POWER * 1.1, 0).ball.z > 29,
                'stopped at z=' + shootFrom(slopedIce, { x: 5, z: 3 }, 0, C.MIN_POWER * 1.1, 0).ball.z.toFixed(1));

            // ── the travelator ──
            var plain = lab({
                pads: [A.pad(0, 0, 10, 8), A.pad(0, 8, 10, 8, 0, 'wood'), A.pad(0, 16, 10, 30)],
                cup: { x: 5, z: 40 }
            });
            var belted = lab({
                pads: [A.pad(0, 0, 10, 8), A.belt(0, 8, 10, 8, 0, 9), A.pad(0, 16, 10, 30)],
                cup: { x: 5, z: 40 }
            });
            var noBelt = shootFrom(plain, { x: 5, z: 2 }, 0, 10.5, 0).ball.z;
            var withBelt = shootFrom(belted, { x: 5, z: 2 }, 0, 10.5, 0).ball.z;
            assert('a belt carries a ball further than the same board would',
                withBelt > noBelt + 4,
                withBelt.toFixed(1) + ' against ' + noBelt.toFixed(1));
            var across = lab({
                pads: [A.pad(0, 0, 20, 8), A.belt(0, 8, 20, 4, 8, 0), A.pad(0, 12, 20, 14)],
                tee: { x: 4, z: 2 }, cup: { x: 4, z: 22 }
            });
            assert('a belt across the line throws the ball off it',
                shootFrom(across, { x: 4, z: 2 }, 0, 13, 0).ball.x > 8,
                'finished at x=' + shootFrom(across, { x: 4, z: 2 }, 0, 13, 0).ball.x.toFixed(1));
            /* The bug this exists to prevent, and it is not hypothetical: drag
               is proportional to speed and therefore says nothing about a
               stopped ball, so without the `push` clause in the rest check a
               ball that arrived on a belt slowly enough would be declared at
               rest on a moving floor and sit there for ever. */
            var parked = shootFrom(belted, { x: 5, z: 10 }, Math.PI, 1.6, 0);
            assert('no ball ever comes to rest on a travelator',
                parked.ball.z > 16 && !parked.moving,
                'settled at z=' + parked.ball.z.toFixed(1));

            // ── the launch pad ──
            var padded = lab({
                pads: [A.pad(0, 0, 10, 40), A.sprung(5, 10, 1.2, 9.6)],
                cup: { x: 5, z: 35 }
            });
            var sprung = shotEvents(padded, { x: 5, z: 2 }, 0, 10.5, 0);
            assert('a launch pad fires at a ball that rolls on to it',
                sprung.world.sprung >= 1, 'sprung ' + sprung.world.sprung + ' times');
            var apex = (function () {
                var w = P.createWorld(padded, { x: 5, z: 2 }, 0), top = 0, i;
                P.launch(w, 0, 10.5, 0);
                for (i = 0; i < 4000 && !P.done(w); i++) {
                    P.advance(w, C.SIM_DT, {});
                    if (w.ball.y > top) top = w.ball.y;
                }
                return top;
            })();
            // v²/2g, which is the whole of what a pad is worth, and the number
            // every hole with one on it is laid out against.
            assert('and throws it as high as its rating says',
                Math.abs(apex - (C.BALL_R + 9.6 * 9.6 / (2 * C.GRAVITY))) < 0.15,
                'apex ' + apex.toFixed(2));
            assert('the kick fades on every firing within a shot',
                P.springKick({ sprung: 1 }, { spring: 9.6 }) <
                P.springKick({ sprung: 0 }, { spring: 9.6 }));
            assert('…and runs out rather than fading for ever',
                P.springKick({ sprung: 9 }, { spring: 9.6 }) === 0);
            /* Which is what stops the clock being the thing that ends a shot.
               A wedge dropped dead on the middle of a launch pad has no run on
               it to carry it off, so it lands on the pad, and lands on it
               again, and the only reason that terminates is SPRING_DECAY. */
            var lob = C.ALL_CLUBS.filter(function (c) { return c.id === 'wedge'; })[0];
            var dropped = shotEvents(
                lab({ pads: [A.pad(0, 0, 10, 26), A.sprung(5, 9.4, 1.5, 10.4)], cup: { x: 5, z: 22 } }),
                { x: 5, z: 2 }, 0, lob.power, lob.loft);
            assert('a ball dropped dead on a launch pad still settles',
                !dropped.world.moving && dropped.seconds < C.MAX_SHOT_SECONDS - 2,
                'still going after ' + dropped.seconds.toFixed(1) + 's');

            // ── the pipe ──
            var piped = lab({
                pads: [A.pad(0, 0, 10, 12), A.pad(0, 24, 10, 16)],
                warps: [A.pipe(5, 10, 5, 26, 0, 1.0)],
                cup: { x: 5, z: 36 }
            });
            var down = shotEvents(piped, { x: 5, z: 2 }, 0, 13, 0);
            assert('a putt into a mouth comes out of the far end',
                down.events.warp === 1 && down.world.ball.z > 24,
                'warps ' + (down.events.warp || 0) + ', z=' + down.world.ball.z.toFixed(1));
            assert('…and only once, whatever the far end is sitting in',
                down.events.warp === 1);
            /* Measured against the same putt on unbroken ground, moved on by
               the sixteen units the pipe skips: a pipe that handed back less
               than it was given would come up short of that. */
            var unpiped = shootFrom(lab({ pads: [A.pad(0, 0, 10, 40)], cup: { x: 5, z: 36 } }),
                { x: 5, z: 2 }, 0, 13, 0);
            assert('the pipe hands back the speed it was given',
                down.world.ball.z > unpiped.ball.z + 16 - 0.3,
                'reached ' + down.world.ball.z.toFixed(2) + ' against ' + (unpiped.ball.z + 16).toFixed(2));
            /* A mouth is a hole in the floor, so it swallows a ball on the
               floor and nothing else. Without this a pipe would be a magnet
               and "keep it down" would stop being a thing a hole can ask. */
            var overhead = P.createWorld(piped, { x: 5, z: 10 }, 0);
            overhead.ball.y = 1.4;
            overhead.grounded = false;
            assert('a ball in the air over a mouth is not swallowed',
                !P.warpUnder(piped, overhead.ball));
            assert('and one on the floor over it is',
                !!P.warpUnder(piped, { x: 5, z: 10, y: C.BALL_R }));
            var pipeless = lab({
                pads: [A.pad(0, 0, 10, 12), A.pad(0, 24, 10, 16)],
                cup: { x: 5, z: 36 }
            });
            assert('and a hole with no pipes on it warps nothing',
                !shotEvents(pipeless, { x: 5, z: 2 }, 0, 10.5, 0).events.warp);

            // ── the loop ──
            /* physics.js, "the loop". A lane of boards with a loop of radius
               1.1 stood on it, its foot at z = 10 and its way out a unit to
               the east. Every shot starts a unit short of the foot. */
            var LR = 1.1, ring = A.loop(5, 10, 0, LR, 1);
            var looped = lab({ pads: [A.pad(0, 0, 10, 40, 0, 'wood')], loops: [ring], cup: { x: 2, z: 38 } });
            var round = shotEvents(looped, { x: 5, z: 9 }, 0, 16, 0);
            assert('a ball hit hard enough goes round the loop and out of the far side',
                round.events.loop === 1 && round.events.loopRound === 1 && !round.events.loopFell &&
                    round.world.ball.z > 12,
                JSON.stringify(round.events) + ', z=' + round.world.ball.z.toFixed(1));
            assert('…on the line one corkscrew across from the one it went in on',
                Math.abs(round.world.ball.x - 6) < 0.02, 'x=' + round.world.ball.x.toFixed(3));
            var back = shotEvents(looped, { x: 5, z: 9 }, 0, 6, 0);
            assert('a slow one runs back down and out of the mouth it went in by',
                back.events.loop === 1 && !back.events.loopRound && !back.events.loopFell &&
                    back.world.ball.z < 10 && Math.abs(back.world.ball.x - 5) < 0.02,
                JSON.stringify(back.events) + ', z=' + back.world.ball.z.toFixed(1));
            var fell = shotEvents(looped, { x: 5, z: 9 }, 0, 9, 0);
            assert('one that passes a quarter of the way but not the top comes off the track',
                fell.events.loopFell >= 1, JSON.stringify(fell.events));
            /* The line between those is the physics and nothing else: a ball
               needs √(5gR) at the foot to make the top with no friction at
               all, and the boards take some more. So the first speed that
               gets round clean — never leaving the track — is above that and
               not wildly above it. A loop that any putt got round, or that
               nothing in the bag could, would show here first. (A ball that
               comes off and lands on the far side also comes out of the far
               end, slowly, and does so from a little under √(5gR); that is a
               fall, not a loop, and it is not what this asks.) */
            var need = Math.sqrt(5 * C.GRAVITY * LR), first = null, sp;
            for (sp = 6; sp <= 24 && first === null; sp += 0.25) {
                var tw = P.createWorld(looped, { x: 5, z: 10 }, 0), got = false, lost = false, ti, te;
                tw.ball.vz = sp; tw.moving = true;
                for (ti = 0; ti < 1200 && !P.done(tw); ti++) {
                    te = P.advance(tw, C.SIM_DT, {});
                    if (te.loopRound) got = true;
                    if (te.loopFell) lost = true;
                }
                if (got && !lost) first = sp;
            }
            assert('what it takes to get round is √(5gR) at the foot and a little for the boards',
                first !== null && first >= need && first <= need * 1.45,
                'first round at ' + first + ' against ' + need.toFixed(2));
            /* While it rides, the ball's middle is the radius from the middle
               of the loop, exactly — the track is the function the renderer
               draws, so a ball off it by anything would be a ball drawn
               through the rails. */
            (function () {
                var w = P.createWorld(looped, { x: 5, z: 9 }, 0), worst = 0, rides = 0, i, F = P.loopFrame(ring);
                var cy = P.loopBase(looped, ring) + LR;
                P.launch(w, 0, 16, 0, 0);
                for (i = 0; i < 2000 && !P.done(w); i++) {
                    P.advance(w, C.SIM_DT, {});
                    if (!w.ride) continue;
                    rides++;
                    var fw = (w.ball.x - ring.x) * F.fx + (w.ball.z - ring.z) * F.fz;
                    worst = Math.max(worst, Math.abs(Math.sqrt(fw * fw + (w.ball.y - cy) * (w.ball.y - cy)) - LR));
                }
                assert('a riding ball is on the track, the radius from the middle, all the way round',
                    rides > 10 && worst < 1e-9, rides + ' frames, worst ' + worst.toExponential(2));
            })();
            /* And one that comes off falls inside the loop and lands back on
               the track — it was falling straight through the boards. */
            (function () {
                var w = P.createWorld(looped, { x: 5, z: 9 }, 0), F = P.loopFrame(ring), i, off = false, caught = false, worst = 0;
                var cy = P.loopBase(looped, ring) + LR;
                P.launch(w, 0, 9, 0, 0);
                for (i = 0; i < 2000 && !P.done(w); i++) {
                    var ev = P.advance(w, C.SIM_DT, {});
                    if (ev.loopFell) off = true;
                    if (off && w.ride) caught = true;
                    if (off && !w.grounded && !w.ride) {
                        var fw = (w.ball.x - ring.x) * F.fx + (w.ball.z - ring.z) * F.fz;
                        worst = Math.max(worst, Math.sqrt(fw * fw + (w.ball.y - cy) * (w.ball.y - cy)) - LR);
                    }
                }
                assert('a ball that comes off the top falls inside the loop and is caught by the track',
                    off && caught && worst < 0.25, 'caught ' + caught + ', outside by ' + worst.toFixed(2));
            })();
            assert('a ball crossing the foot sideways walks under the loop',
                !shotEvents(looped, { x: 2, z: 10.2 }, Math.PI / 2, 9, 0).events.loop);
            assert('and one crossing it backwards does too',
                !shotEvents(looped, { x: 5, z: 12 }, Math.PI, 9, 0).events.loop);
            (function () {
                var w = P.createWorld(looped, { x: 5, z: 9.8 }, 0), i, took = false;
                w.ball.y = 0.9; w.grounded = false; w.ball.vz = 4; w.moving = true;
                for (i = 0; i < 6; i++) if (P.advance(w, C.SIM_DT, {}).loop) took = true;
                assert('a ball in the air over the foot is not taken', !took);
            })();
            (function () {
                var a = P.createWorld(looped, { x: 5, z: 9 }, 0), i;
                P.launch(a, 0, 16, 0, 0);
                for (i = 0; i < 400 && !a.ride; i++) P.advance(a, C.SIM_DT, {});
                P.advance(a, C.SIM_DT * 3, {});
                var b = P.cloneWorld(a);
                P.advance(a, C.SIM_DT * 5, {});
                P.advance(b, C.SIM_DT * 5, {});
                assert('a world cloned on the loop rides on exactly as the original does',
                    b.ride && a.ride && b.ride.th === a.ride.th && b.ball.y === a.ball.y && b.ride !== a.ride);
            })();
            assert('the aim line stops at the mouth of a loop',
                (function () {
                    var w = P.createWorld(looped, { x: 5, z: 9 }, 0);
                    var pts = P.previewPath(w, 0, 16, 0, 3);
                    return pts.every(function (q) { return q.y < 0.5; });
                })());
            /* On the courses: the track stands clear of every wall on the
               hole. The ball is never collided with anything while it rides,
               so a wall standing in the loop would be a wall the ball is
               drawn going through — which is exactly what the first housing
               on Loop the Loop was. */
            var loopsSeen = 0;
            ALL.forEach(function (entry) {
                var h = entry.hole;
                (h.loops || []).forEach(function (L) {
                    loopsSeen++;
                    var F = P.loopFrame(L), base = P.loopBase(h, L), hit = '', i, q = {};
                    for (i = 0; i <= 96 && !hit; i++) {
                        P.loopPoint(L, F, base, i / 96 * Math.PI * 2, q);
                        h.walls.forEach(function (wl) {
                            var B = P.wallBox(wl, 0);
                            if (q.y + C.BALL_R > B.base && q.y - C.BALL_R < B.top &&
                                P.circleBox(q.x, q.z, C.BALL_R, B)) hit = 'at ' + (i / 96 * 360).toFixed(0) + '°';
                        });
                    }
                    assert(entry.course.id + '/' + h.name + ': nothing stands in the loop', !hit, hit);
                    var foot = P.surfaceTop(h, L.x, L.z);
                    q = P.loopPoint(L, F, base, Math.PI * 2, {});
                    var out = P.surfaceTop(h, q.x, q.z);
                    assert(entry.course.id + '/' + h.name + ': the loop stands on level floor, in and out',
                        foot && out && approx(foot.y, out.y, 1e-9) &&
                            P.slopeAt(foot.pad, L.x, L.z) < 1e-9 && P.slopeAt(out.pad, q.x, q.z) < 1e-9);
                });
            });
            assert('there is a loop on the courses', loopsSeen >= 1);

            // ── backspin ──
            var green = lab({ pads: [A.pad(0, 0, 10, 60)], cup: { x: 5, z: 55 } });
            var free = shootFrom(green, { x: 5, z: 2 }, 0, 13.5, 38 * Math.PI / 180, 0, undefined, 0);
            var checked = shootFrom(green, { x: 5, z: 2 }, 0, 13.5, 38 * Math.PI / 180, 0, undefined, 0.78);
            assert('backspin costs the shot most of its run and none of its carry',
                checked.ball.z < free.ball.z - 6 && checked.ball.z > 8,
                'checked ' + checked.ball.z.toFixed(1) + ' against ' + free.ball.z.toFixed(1));
            assert('and it is spent on the first landing, not on every one',
                (function () {
                    var w = P.createWorld(green, { x: 5, z: 2 }, 0), i;
                    P.launch(w, 0, 13.5, 38 * Math.PI / 180, 0.78);
                    for (i = 0; i < 4000 && !P.done(w); i++) {
                        P.advance(w, C.SIM_DT, {});
                        if (!w.ball.bite) break;
                    }
                    return w.ball.bite === 0 && i < 4000;
                })());
            var spinner = C.ALL_CLUBS.filter(function (c) { return c.bite; });
            assert('exactly one club in the bag carries backspin',
                spinner.length === 1 && spinner[0].id === 'checker');
            assert('…and it is not in the default bag',
                C.CLUBS.indexOf(spinner[0]) < 0);

            // ── and what a hole is allowed to be built out of ──
            var machines = 0, mouths = 0, iceHoles = 0, bad = '';
            ALL.forEach(function (entry) {
                var h = entry.hole, tag = entry.course.id + '/' + h.name;
                h.pads.forEach(function (p) {
                    if (p.spring) {
                        machines++;
                        /* A launch pad is an inlay, and an inlay only wins a
                           *tie* in surfaceUnder — so a pad laid on ground that
                           has been rolled above it is a pad the ball never
                           touches. `build` keeps the ground under one flat;
                           this is what says it worked. */
                        var under = null, q;
                        for (q = 0; q < h.pads.length; q++) {
                            if (h.pads[q] === p || h.pads[q].inlay) continue;
                            if (P.padContains(h.pads[q], p.x + p.w / 2, p.z + p.d / 2)) under = h.pads[q];
                        }
                        if (under && Math.abs(P.padHeight(under, p.x + p.w / 2, p.z + p.d / 2) -
                                P.padHeight(p, p.x + p.w / 2, p.z + p.d / 2)) > 1e-9) {
                            bad = tag + ': a launch pad is buried in the ground under it';
                        }
                        if (p.spring <= C.LAND_REST) bad = tag + ': a launch pad too weak to fire';
                    }
                    if (p.push) {
                        machines++;
                        if (!p.push.x && !p.push.z) bad = tag + ': a travelator that pushes nowhere';
                    }
                    if (p.kind === 'ice') iceHoles++;
                });
                (h.warps || []).forEach(function (wp) {
                    mouths++;
                    // Out of one mouth and straight into another is a ball
                    // ping-ponging until the lock happens to expire somewhere.
                    (h.warps || []).forEach(function (other) {
                        if (Math.hypot(wp.tx - other.x, wp.tz - other.z) < other.r) {
                            bad = tag + ': a pipe empties into a mouth';
                        }
                    });
                    if (!P.surfaceTop(h, wp.tx, wp.tz)) bad = tag + ': a pipe empties into thin air';
                    if (P.outOfBounds(h, wp.tx, wp.tz)) bad = tag + ': a pipe empties out of bounds';
                });
            });
            assert('every piece of machinery on the course is built legally', !bad, bad);
            assert('there is machinery to check', machines >= 8, machines + ' found');
            assert('there are pipes to check', mouths >= 2, mouths + ' found');
            assert('and ice to play on', iceHoles >= 6, iceHoles + ' pads');
        })();

        /* ── walls you go through, bats that stop, and how hard down is ── */

        /* Three more mechanics with the same problem as the ground ones: each
           is a handful of lines, and each would go on passing every other test
           in this file if it quietly stopped working. An aperture with its
           opening sealed is a wall. A flipper that does not swing is a blade
           at a funny angle. A gravity multiplier nobody reads is 1. So again:
           written to fail when the mechanic is removed. */

        section('Ways through, bats, and gravity');
        (function () {
            // ── the aperture ──
            var door = A.aperture(0, 6, 8, 0.4, { gap: 1.4, at: 4, h: 1.7, head: 1.15 });
            var win = A.aperture(0, 6, 8, 0.4, { gap: 1.4, at: 4, h: 1.6, sill: 0.5, head: 1.4 });
            var shut = A.aperture(0, 6, 8, 0.4, { gap: 0, h: 1.5 });
            /* Two jambs and a lintel over the opening; a window adds a sill
               under it. A doorway with no lintel would be two blocks with a
               gap between them, which is what the older holes wrote by hand
               and is not a wall with a door in it — from the tee it reads as a
               hole in the fence rather than as a way through. */
            assert('a doorway is three pieces and a window is four',
                door.length === 3 && win.length === 4,
                door.length + ' / ' + win.length);
            assert('and a wall with no opening in it is just a wall',
                shut.length === 1 || shut.length === 2, shut.length + ' pieces');
            assert('every piece of an aperture is thick enough not to be tunnelled',
                door.concat(win).every(function (w) { return w.w >= 0.24 && w.d >= 0.24; }));

            var lane = lab({ pads: [A.pad(0, 0, 8, 20)], walls: door, cup: { x: 4, z: 17 } });
            var barred = lab({ pads: [A.pad(0, 0, 8, 20)], walls: shut, cup: { x: 4, z: 17 } });
            var through = shootFrom(lane, { x: 4, z: 2 }, 0, 12, 0);
            var stopped = shootFrom(barred, { x: 4, z: 2 }, 0, 12, 0);
            assert('a putt on the line of a doorway goes through it',
                through.ball.z > 8, 'reached ' + through.ball.z.toFixed(1));
            assert('…and the same putt at the same wall without one does not',
                stopped.ball.z < 6.5, 'reached ' + stopped.ball.z.toFixed(1));
            var offLine = shootFrom(lane, { x: 1.4, z: 2 }, 0, 12, 0);
            assert('and a putt off the line of it is stopped by the jamb',
                offLine.ball.z < 6.5, 'reached ' + offLine.ball.z.toFixed(1));

            /* The window is the interesting one: it is the only obstacle in
               the file that a rolling ball cannot pass and a lofted one can,
               which is the exact opposite of every wall and the exact opposite
               of `beam`. Both halves are the assertion. */
            var glazed = lab({ pads: [A.pad(0, 0, 8, 20)], walls: win, cup: { x: 4, z: 17 } });
            var rolled = shootFrom(glazed, { x: 4, z: 2 }, 0, 12, 0);
            var wed = C.ALL_CLUBS.filter(function (c) { return c.id === 'chipper'; })[0];
            var lofted = shootFrom(glazed, { x: 4, z: 2 }, 0, wed.power, wed.loft);
            assert('a window turns a putt back', rolled.ball.z < 6.5,
                'reached ' + rolled.ball.z.toFixed(1));
            assert('…and lets a pitch through it', lofted.ball.z > 8,
                'reached ' + lofted.ball.z.toFixed(1));

            // `at` has to actually move the opening, or every door is centred.
            var left = A.aperture(0, 6, 8, 0.4, { gap: 1.2, at: 2, h: 1.5 });
            var mid = A.aperture(0, 6, 8, 0.4, { gap: 1.2, h: 1.5 });
            assert('an opening can be put somewhere other than the middle',
                left[0].w < mid[0].w && Math.abs(mid[0].w - mid[1].w) < 1e-9,
                left[0].w.toFixed(2) + ' against ' + mid[0].w.toFixed(2));

            // ── the flipper ──
            var bat = A.flipper(4, 8, 3, { rest: -0.5, arc: 1.0, speed: 2 });
            var atRest = P.wallBox(bat, 0);
            var atEnd = P.wallBox(bat, Math.PI / 2);            // half a period
            var midSweep = P.wallBox(bat, Math.PI / 4);
            assert('a flipper starts at its rest angle',
                Math.abs(atRest.yaw - (-0.5)) < 1e-9, atRest.yaw.toFixed(3));
            assert('…reaches the far end of its arc',
                Math.abs(atEnd.yaw - 0.5) < 1e-9, atEnd.yaw.toFixed(3));
            assert('…and stops at both ends rather than running round',
                Math.abs(atRest.spin) < 1e-9 && Math.abs(atEnd.spin) < 1e-9);
            assert('but is moving in the middle of the sweep, and shoves the ball',
                Math.abs(midSweep.spin) > 0.5, midSweep.spin.toFixed(2));
            assert('and it never leaves the arc it was given', (function () {
                var k, y, lo = Infinity, hi = -Infinity;
                for (k = 0; k <= 60; k++) {
                    y = P.wallBox(bat, k / 60 * Math.PI).yaw;
                    lo = Math.min(lo, y); hi = Math.max(hi, y);
                }
                return lo > -0.5 - 1e-9 && hi < 0.5 + 1e-9;
            })());

            // ── gravity ──
            assert('gravity is the config number when a hole says nothing',
                P.gravityOf({}) === C.GRAVITY && P.gravityOf(null) === C.GRAVITY);
            assert('…and a hole may say otherwise',
                Math.abs(P.gravityOf({ gravity: 0.4 }) - C.GRAVITY * 0.4) < 1e-9);
            var earth = lab({ pads: [A.pad(0, 0, 10, 80)], cup: { x: 5, z: 75 } });
            var moon = lab({ pads: [A.pad(0, 0, 10, 80)], cup: { x: 5, z: 75 } });
            moon.gravity = 0.4;
            var pit = C.ALL_CLUBS.filter(function (c) { return c.id === 'chipper'; })[0];
            function flight(h) {
                var w = P.createWorld(h, { x: 5, z: 2 }, 0), top = 0, carry = null, i, ev;
                P.launch(w, 0, pit.power, pit.loft);
                for (i = 0; i < 6000 && !P.done(w); i++) {
                    ev = P.advance(w, C.SIM_DT, {});
                    if (w.ball.y > top) top = w.ball.y;
                    if (carry === null && ev.land) carry = w.ball.z - 2;
                }
                return { apex: top, carry: carry };
            }
            var e = flight(earth), m = flight(moon);
            /* Carry goes as 1/g and so does apex, so two fifths of a g is two
               and a half times both. Asserted as a ratio rather than as two
               numbers, because the point is the relationship: change
               CONFIG.GRAVITY and this still holds. */
            assert('a shot in two fifths of a g carries about two and a half times as far',
                m.carry / e.carry > 2.2 && m.carry / e.carry < 2.8,
                (m.carry / e.carry).toFixed(2) + '×');
            assert('…and hangs about two and a half times as high',
                m.apex / e.apex > 2.2 && m.apex / e.apex < 2.8,
                (m.apex / e.apex).toFixed(2) + '×');
            /* And the thing that does *not* change, which is what makes a
               low-gravity hole playable at all: what a surface will hold a
               stopped ball on is a gradient, and a gradient is a ratio of two
               forces that both scale with g. */
            var ramp = A.pad(0, 0, 6, 10, 0, 'green', 0, 0.1);
            assert('but the slope a green holds a ball on does not move',
                P.holdOf(ramp.kind) === C.HOLD.green);

            // ── and what the courses actually use ──
            var swung = 0, gaps = 0, shifted = 0, worst = '';
            ALL.forEach(function (entry) {
                var h = entry.hole, tag = entry.course.id + '/' + h.name;
                if (h.gravity) {
                    shifted++;
                    /* A sanity bound rather than a design rule: it is here to
                       catch a hole that says 20 when it meant 2, not to have
                       an opinion about how heavy a heavy hole may be. Apogee
                       Yard is built out of this number and walks it from 0.3
                       to 2.4, so the bound has to be wider than the card. */
                    if (h.gravity <= 0 || h.gravity > 3) worst = tag + ': gravity out of range';
                }
                h.walls.forEach(function (wl) {
                    if (wl.swing) {
                        swung++;
                        if (!wl.swing.speed) worst = tag + ': a flipper that does not move';
                        if (wl.swing.from === wl.swing.to) worst = tag + ': a flipper with no arc';
                    }
                });
            });
            assert('the flippers on the course are all real ones', !worst, worst);
            assert('there are flippers to check', swung >= 3, swung + ' found');
            assert('and a hole where down is a different number', shifted >= 1);
        })();

        /* ── the bag ───────────────────────────────────────────────────── */

        section('Clubs');
        (function () {
            var seenId = {}, seenKey = {}, flat = 0, longest = null;
            assert('there is a bag', C.CLUBS.length >= 2);
            /* A club whose loft the clamp would trim is a club that does not
               do what its label says — the wedge sat a degree under the old
               45° ceiling and read as flat because of it. */
            assert('the bag has a club that really goes up',
                Math.max.apply(null, C.CLUBS.map(function (c) { return c.loft; })) >= 50 * Math.PI / 180);
            C.CLUBS.forEach(function (club) {
                assert(club.id + ': named, keyed and described',
                    !!club.name && !!club.short && !!club.key && !!club.blurb);
                assert(club.id + ': loft is inside what launch() will accept',
                    club.loft >= 0 && club.loft <= C.MAX_LOFT,
                    (club.loft * 180 / Math.PI).toFixed(1) + '°');
                assert(club.id + ': a full swing is a legal shot',
                    club.power > C.MIN_POWER && club.power <= C.MAX_POWER);
                assert(club.id + ': the id is unique', !seenId[club.id]);
                assert(club.id + ': the shortcut is unique', !seenKey[club.key]);
                seenId[club.id] = seenKey[club.key] = true;
                if (club.loft === 0) flat++;
                if (!longest || club.power > longest.power) longest = club;
            });
            assert('at least one club rolls flat', flat >= 1);
            assert('the longest club reaches the whole power range', longest.power === C.MAX_POWER);
            assert('the default club is in the bag',
                C.CLUBS.filter(function (c) { return c.id === C.DEFAULT_CLUB; }).length === 1);

            // The feel constants are read by the chrome, not the simulation,
            // but a typo in one of them is invisible until someone plays.
            assert('the overswing mark is a fraction of the swing',
                C.OVERSWING > 0.5 && C.OVERSWING < 1);

            // The bag has to be able to do the two things the courses ask of
            // it: roll a long way, and go over something.
            var open = lab({ pads: [A.pad(0, 0, 10, 40)], cup: { x: 9, z: 39 } });
            var reach = 0;
            C.CLUBS.forEach(function (club) {
                var w = shootFrom(open, { x: 5, z: 1 }, 0, club.power, club.loft);
                reach = Math.max(reach, w.ball.z - 1);
            });
            assert('some club reaches ten units in one shot', reach > 10, 'best is ' + reach.toFixed(1));

            /* The wedge tops out around five and a half units of carry, so the
               rail goes where a lofted club is over it and a rolling one is
               not — about two and a half units out. Any hole asking for more
               air than that has to offer a way round. */
            var fence = lab({ walls: [A.wall(0, 4.6, 10, 0.4, 0.5, { base: 0 })] });
            var carried = C.CLUBS.some(function (club) {
                return shootFrom(fence, { x: 5, z: 2 }, 0, club.power, club.loft).ball.z > 5.2;
            });
            assert('some club carries a rail the putter would bounce off', carried);
            assert('and the putter is not that club',
                shootFrom(fence, { x: 5, z: 2 }, 0, clubOf('putter').power, clubOf('putter').loft).ball.z < 4.8);

            function clubOf(id) {
                return C.CLUBS.filter(function (c) { return c.id === id; })[0];
            }
        })();

        /* ── the overdraw ──────────────────────────────────────────────── */

        section('Overdraw and spray');
        (function () {
            assert('the overdraw is a real stretch of meter, and a bounded one',
                C.OVERDRAW > 0 && C.OVERDRAW <= 0.5, (C.OVERDRAW * 100).toFixed(0) + '%');

            assert('a full swing is 0 into the overdraw, and the end of the meter is 1',
                P.overdraw(10, 10) === 0 && P.overdraw(10 * (1 + C.OVERDRAW), 10) === 1);
            assert('anything under a full swing is 0 into it',
                P.overdraw(4, 10) === 0 && P.overdraw(9.99, 10) === 0);
            assert('the overdraw is measured per club, not in raw power',
                approx(P.overdraw(28 * (1 + C.OVERDRAW / 2), 28),
                       P.overdraw(10.5 * (1 + C.OVERDRAW / 2), 10.5)));
            assert('past the end of the meter it is still 1', P.overdraw(99, 10) === 1);

            /* The rule the whole trade rests on: inside a full swing the shot
               is the shot, and the preview is not lying to you. */
            assert('a full swing sprays by nothing at all',
                P.spray(0).yaw === 0 && P.spray(0).power === 0);
            var honest = P.sprayShot(0.7, 12, 0, function () { return 1; });
            assert('…so the shot played is exactly the shot asked for',
                honest.yaw === 0.7 && honest.power === 12);

            var half = P.spray(0.5), full = P.spray(1);
            assert('the worst of it is the configured spray',
                approx(full.yaw, C.SPRAY_YAW) && approx(full.power, C.SPRAY_POWER));
            assert('spray grows with the overdraw',
                half.yaw > 0 && half.yaw < full.yaw && half.power < full.power);

            /* Exponential, not linear: half the overdraw has to buy much less
               than half the trouble, or there is no reason to stop at 100% and
               no reason to fear 130%. */
            assert('and grows exponentially, not in step with the meter',
                half.yaw < full.yaw * 0.35,
                'half the overdraw is ' + (half.yaw / full.yaw * 100).toFixed(0) + '% of the spray');
            var q = P.spray(0.25), t3 = P.spray(0.75);
            assert('each quarter of the overdraw costs more than the one before',
                (t3.yaw - half.yaw) > (half.yaw - q.yaw) && (half.yaw - q.yaw) > q.yaw);

            // Both draws are used, and both are bounded by what spray() says.
            var lo = P.sprayShot(0, 20, 1, function () { return 0; });
            var hi = P.sprayShot(0, 20, 1, function () { return 1; });
            assert('a thrashed shot misses left and right of the line',
                approx(lo.yaw, -C.SPRAY_YAW) && approx(hi.yaw, C.SPRAY_YAW));
            assert('…and heavy and light of the weight',
                approx(lo.power, 20 * (1 - C.SPRAY_POWER)) &&
                approx(hi.power, 20 * (1 + C.SPRAY_POWER)));

            // Line and weight are drawn separately: pulled and thin is two
            // mistakes, not the same one twice.
            var seq = [0, 1], k = 0;
            var mixed = P.sprayShot(0, 20, 1, function () { return seq[k++]; });
            assert('the line and the weight are two draws',
                mixed.yaw < 0 && mixed.power > 20);

            /* And the extra power is real: the simulation has to accept a
               swing past the longest club's ceiling, or the overdraw would be
               all cost and no distance. */
            var open = lab({ pads: [A.pad(0, 0, 10, 60)], cup: { x: 5, z: 55 } });
            var fullSwing = shootFrom(open, { x: 5, z: 1 }, 0, C.MAX_POWER, 0);
            var thrashed = shootFrom(open, { x: 5, z: 1 }, 0, C.MAX_POWER * (1 + C.OVERDRAW), 0);
            assert('an overdrawn swing goes further than a full one',
                thrashed.ball.z > fullSwing.ball.z + 1,
                fullSwing.ball.z.toFixed(1) + ' → ' + thrashed.ball.z.toFixed(1));

            var w = P.createWorld(open, { x: 5, z: 1 }, 0);
            P.launch(w, 0, C.MAX_POWER * (1 + C.OVERDRAW), 0);
            assert('launch() does not clip the overdraw off the top',
                approx(P.groundSpeed(w.ball), C.MAX_POWER * (1 + C.OVERDRAW), 0.01),
                P.groundSpeed(w.ball).toFixed(2));

            /* Nor the bonus on top of it. The biggest club at the top of its
               overdraw, struck clean, is the fastest ball the game can produce
               — and it is the one shot a ceiling written in terms of the
               meter alone would quietly shave. */
            (function () {
                var best = P.deliver(C.MAX_POWER * (1 + C.OVERDRAW), C.MAX_POWER);
                var w2 = P.createWorld(open, { x: 5, z: 1 }, 0);
                P.launch(w2, 0, best, 0);
                assert('nor the clean-strike bonus on top of it',
                    approx(P.groundSpeed(w2.ball), best, 0.01),
                    P.groundSpeed(w2.ball).toFixed(2) + ' of ' + best.toFixed(2));
            })();

            /* ── what the overdraw is worth ────────────────────────────────

               The meter is linear and delivery is not: past a full swing the
               club gives back more than the bar says, squared in the overdraw
               so the prize sits where the risk does. */
            assert('inside a full swing the meter is the shot, exactly',
                P.deliver(7, 10) === 7 && P.deliver(10, 10) === 10);
            assert('past a full swing the club delivers more than the meter reads',
                P.deliver(10 * (1 + C.OVERDRAW), 10) > 10 * (1 + C.OVERDRAW));
            assert('and the bonus is the whole of OVER_GAIN at the very top',
                approx(P.deliver(10 * (1 + C.OVERDRAW), 10),
                       10 * (1 + C.OVERDRAW) * (1 + C.OVER_GAIN)));
            /* Squared, so half way up is a quarter of the prize — the first
               half of the overdraw is nearly free of risk and has to be nearly
               free of reward too, or there is no decision anywhere on the bar. */
            (function () {
                var half = P.deliver(10 * (1 + C.OVERDRAW / 2), 10) / (10 * (1 + C.OVERDRAW / 2)) - 1;
                var full = P.deliver(10 * (1 + C.OVERDRAW), 10) / (10 * (1 + C.OVERDRAW)) - 1;
                assert('half the overdraw is a quarter of the bonus',
                    approx(half / full, 0.25, 0.01),
                    (half / full * 100).toFixed(0) + '%');
            })();
            assert('delivery never runs backwards up the bar', (function () {
                var prev = -1;
                for (var q = 0; q <= 1.0001; q += 0.05) {
                    var d = P.deliver(10 * (1 + C.OVERDRAW * q), 10);
                    if (d <= prev) return false;
                    prev = d;
                }
                return true;
            })());

            /* ── sidespin ──────────────────────────────────────────────────

               Only the gate puts it on, it bends the flight and nothing else,
               and the ground takes it away. */
            (function () {
                var flat = lab({ pads: [A.pad(0, 0, 40, 60)], cup: { x: 20, z: 55 } });
                function shotWithSpin(spin) {
                    var w = P.createWorld(flat, { x: 20, z: 1 }, 0);
                    P.launch(w, 0, 22, 20 * Math.PI / 180);
                    w.spin = spin;
                    for (var i = 0; i < 4000 && !P.done(w); i++) P.advance(w, 1 / 240, {});
                    return w.ball;
                }
                var straight = shotWithSpin(0);
                var drawn = shotWithSpin(-1);
                var faded = shotWithSpin(1);
                assert('spin bends the shot off the line it left on',
                    Math.abs(drawn.x - straight.x) > 0.4,
                    'moved ' + (drawn.x - straight.x).toFixed(2));
                assert('and the two signs bend it opposite ways',
                    (drawn.x - straight.x) * (faded.x - straight.x) < 0);
                assert('a bent shot is not a longer one',
                    Math.abs(drawn.z - straight.z) < Math.abs(drawn.x - straight.x) * 3 + 4);
                assert('launch() clears the spin, so it cannot outlive its shot', (function () {
                    var w = P.createWorld(flat, { x: 20, z: 1 }, 0);
                    w.spin = 1;
                    P.launch(w, 0, 10, 0);
                    return w.spin === 0;
                })());
                assert('the ground takes nearly all of it on the first bounce',
                    C.SPIN_LAND > 0 && C.SPIN_LAND < 0.5);
            })();

            // The cone is drawn from spray(), so its own constants have to be
            // the kind a renderer can use: an angle, a width and a cutoff.
            assert('the cone has a base angle, a width and a range',
                C.CONE_ANGLE > 0 && C.CONE_ANGLE < 0.2 &&
                C.CONE_WIDTH > 0 && C.CONE_RANGE > 2);
            assert('the cone fades out over a real stretch of its length',
                C.CONE_FADE > 0.1 && C.CONE_FADE < 0.9);
            assert('a full-power shot outruns the cone, so the cutoff matters',
                C.MAX_POWER / -Math.log(C.FRICTION.green) > C.CONE_RANGE);
        })();

        /* ── the swing gate ────────────────────────────────────────────── */

        section('The swing gate');
        (function () {
            var SW = G3.swing;

            // A helper: run a gate to a given position and press it there.
            function pressAt(over, pos) {
                var g = SW.start(over);
                var guard = 0;
                while (!g.done && guard++ < 20000) {
                    if (g.pos >= pos) { SW.press(g); break; }
                    SW.tick(g, 1 / 600);
                }
                return g;
            }

            assert('a full swing does not arm the gate', !SW.arms(0));
            assert('nor does the first sliver of overdraw', !SW.arms(C.SWING.ARM * 0.5));
            assert('a real thrash does', SW.arms(1) && SW.arms(C.SWING.ARM * 2));

            /* The target is the white line the bar already had on it. Nothing
               about the rule needs saying because the furniture says it. */
            assert('the gate is struck at a full swing, wherever the meter went',
                approx(SW.markAt(), 1 / (1 + C.OVERDRAW)));

            /* Harder the further you wind it, on both counts, and on the same
               curve the spray runs on — so the gate tightens exactly where the
               shot gets wild rather than on a schedule of its own. */
            assert('the strike zone shrinks as the overdraw grows',
                SW.windowFor(0) > SW.windowFor(0.5) && SW.windowFor(0.5) > SW.windowFor(1));
            assert('and the marker speeds up',
                SW.speedFor(0) < SW.speedFor(0.5) && SW.speedFor(0.5) < SW.speedFor(1));
            assert('the last quarter of the overdraw costs more room than the first',
                (SW.windowFor(0) - SW.windowFor(0.25)) < (SW.windowFor(0.75) - SW.windowFor(1)),
                'first ' + (SW.windowFor(0) - SW.windowFor(0.25)).toFixed(3) +
                ' vs last ' + (SW.windowFor(0.75) - SW.windowFor(1)).toFixed(3));

            /* The number the player actually experiences, which is neither of
               the two the gate is built from: how long the marker spends inside
               the zone, in seconds. Width and speed are free to be retuned
               against each other, and this is what neither of them is allowed
               to break — a demand under about a seventh of a second is not a
               hard shot, it is a coin toss, because it is shorter than the time
               it takes to see the marker arrive and move a thumb.

               It was 60ms at the top of the meter once, which is how this
               assertion came to exist. */
            (function () {
                var floor = 0.15, worst = Infinity, worstAt = 0, t;
                for (t = 0; t <= 1.0001; t += 0.05) {
                    var ms = 2 * SW.windowFor(t) / SW.speedFor(t);
                    if (ms < worst) { worst = ms; worstAt = t; }
                }
                assert('there is time to react at every point of the overdraw',
                    worst >= floor,
                    'tightest is ' + Math.round(worst * 1000) + 'ms at ' +
                    Math.round(worstAt * 100) + '% overdraw');
            })();

            /* And the run in to it, which is the half that makes the demand
               readable: a marker you can only see for a moment before it
               arrives cannot be anticipated however wide the zone is. */
            assert('and enough run-up to read the marker coming',
                SW.markAt() / SW.speedFor(1) > 0.5,
                Math.round(SW.markAt() / SW.speedFor(1) * 1000) + 'ms at a full thrash');

            /* One gate, the same everywhere. There were four, rotating by
               hole, and the rotation read as the game changing its mind. */
            assert('there is one gate, not a rotation of them',
                !SW.VARIANTS && !SW.pick && typeof SW.start(0.5).variant === 'undefined');

            /* The prize. A clean strike is the whole point of taking the gate
               on, so it has to hand the shot back untouched. */
            (function () {
                var g = pressAt(0.8, SW.markAt());
                assert('a strike on the line is perfect', g.perfect && g.off === 0);
                var out = SW.apply({ yaw: 0.4, power: 20 }, g);
                assert('and a perfect strike does not move the shot at all',
                    out.yaw === 0.4 && out.power === 20 && out.spin === 0);
            })();

            /* And the punishment, which is the old envelope exactly: a total
               miss costs the spray the dice used to roll at this overdraw,
               and nothing about how wild a thrash can get has changed. */
            (function () {
                var g = SW.start(1);
                var guard = 0;
                while (!g.done && guard++ < 20000) SW.tick(g, 1 / 600);
                assert('never swinging runs the gate out', g.done && !g.struck);
                assert('and counts as the latest possible strike', g.off === 1);
                var out = SW.apply({ yaw: 0, power: 20 }, g);
                var worst = P.spray(1);
                assert('a total miss is exactly the spray the dice used to roll',
                    approx(Math.abs(out.yaw), worst.yaw),
                    out.yaw.toFixed(4) + ' vs ' + worst.yaw.toFixed(4));
                assert('a mishit is always lighter, never heavier',
                    out.power < 20 && approx(out.power, 20 * (1 - worst.power)));
                assert('and it bends in the air as well as leaving off line',
                    out.spin !== 0);
            })();

            /* Early pulls, late pushes, and the bend goes the same way as the
               push — which is what makes a mishit read as one mistake rather
               than two unrelated ones. */
            (function () {
                var early = pressAt(1, SW.markAt() - SW.windowFor(1) - 0.1);
                var late = pressAt(1, SW.markAt() + SW.windowFor(1) + 0.1);
                assert('early and late miss opposite ways',
                    early.off < 0 && late.off > 0);
                var a = SW.apply({ yaw: 0, power: 20 }, early);
                var b = SW.apply({ yaw: 0, power: 20 }, late);
                assert('so the two shots leave on opposite sides of the line',
                    a.yaw * b.yaw < 0);
                assert('and each one bends the way it was already going',
                    a.yaw * a.spin > 0 && b.yaw * b.spin > 0);
                /* And the right way round. +yaw is left on screen and +spin
                   bends left, and every word the game says about a miss — the
                   toasts, the school — says early pulls left and draws. */
                assert('early is the pull: left of the line, bending left',
                    a.yaw > 0 && a.spin > 0 && b.yaw < 0 && b.spin < 0);
                assert('a near miss costs less than a far one', (function () {
                    var near = pressAt(1, SW.markAt() + SW.windowFor(1) + 0.02);
                    return Math.abs(near.off) < Math.abs(late.off);
                })());
            })();

            /* Whatever the gate does, it cannot reach outside the envelope the
               overdraw already had. This is the assertion that keeps the
               tuning honest: `off` is bounded, so `apply` is too. */
            assert('no gate can push a shot further off line than the spray allows', (function () {
                var worst = P.spray(1).yaw;
                for (var p = 0; p <= 1.001; p += 0.02) {
                    var g = pressAt(1, p);
                    var o = SW.apply({ yaw: 0, power: 20 }, g);
                    if (Math.abs(o.yaw) > worst + 1e-9) return false;
                    if (o.power > 20 + 1e-9 || o.power < 0) return false;
                }
                return true;
            })());
        })();

        section('The touch swing');
        (function () {
            var SW = G3.swing;
            var S = C.SWIPE, F = S.FEEL;
            // A through-swing from (0, 200) up to the start line at y = 0,
            // finishing `dx` pixels to the side.
            function angle(dx) { return SW.swipeAngle({ x: 0, y: 200 }, { x: dx, y: 0 }); }

            assert('the pull loads the meter in proportion, and no further than all of it',
                SW.swipeLoad(0, 300) === 0 && approx(SW.swipeLoad(150, 300), 0.5) &&
                SW.swipeLoad(900, 300) === 1 && SW.swipeLoad(-40, 300) === 0);
            assert('a lane with no length loads nothing rather than dividing by it',
                SW.swipeLoad(50, 0) === 0);

            assert('a straight swipe up is no angle at all', angle(0) === 0);
            assert('drifting right is positive, left negative', angle(30) > 0 && angle(-30) < 0);
            assert('the angle does not care how long the swing was',
                approx(SW.swipeAngle({ x: 0, y: 100 }, { x: 10, y: 0 }),
                       SW.swipeAngle({ x: 0, y: 400 }, { x: 40, y: 0 })));
            assert('a swipe that never came back up reads as straight, not as NaN',
                SW.swipeAngle({ x: 0, y: 0 }, { x: 10, y: 0 }) === 0);

            ['easy', 'normal', 'hard'].forEach(function (f) {
                assert(f + ': a slightly crooked swipe is still clean',
                    SW.swipeOff(F[f].TOL * 0.9, 0, f) === 0);
                assert(f + ': the tolerance narrows the further the meter was pulled',
                    SW.swipeTol(0, f) > SW.swipeTol(0.5, f) && SW.swipeTol(0.5, f) > SW.swipeTol(1, f));
            });
            assert('the feels get stricter in order, on the lean and on the cost',
                F.easy.TOL > F.normal.TOL && F.normal.TOL > F.hard.TOL &&
                F.easy.SPAN > F.normal.SPAN && F.normal.SPAN > F.hard.SPAN &&
                F.easy.FLOOR <= F.normal.FLOOR && F.normal.FLOOR <= F.hard.FLOOR);
            assert('the same 6° lean is clean on easy and a miss on normal',
                SW.swipeOff(6 * Math.PI / 180, 0, 'easy') === 0 && SW.swipeOff(6 * Math.PI / 180, 0, 'normal') > 0);
            assert('past it the miss grows, and stops at a total one',
                approx(SW.swipeOff(F.normal.TOL + F.normal.SPAN * 0.5, 0, 'normal'), 0.5) &&
                SW.swipeOff(Math.PI / 2, 0, 'normal') === 1 && SW.swipeOff(-Math.PI / 2, 0, 'normal') === -1);
            assert('an unknown feel falls back to the default rather than throwing',
                SW.swipeTol(0, 'bogus') === SW.swipeTol(0, S.DEFAULT.feel));

            /* The direction is the point: a swipe that drifts right sends the
               ball right. +yaw is left on screen, so right is a smaller yaw. */
            (function () {
                var right = SW.apply({ yaw: 0, power: 20 }, SW.swiped(0, SW.swipeOff(angle(80), 0, 'normal'), 'normal'));
                var left = SW.apply({ yaw: 0, power: 20 }, SW.swiped(0, SW.swipeOff(angle(-80), 0, 'normal'), 'normal'));
                assert('a swipe drifting right pushes the ball right, and fades it',
                    right.yaw < 0 && right.spin < 0);
                assert('one drifting left pulls it left, and draws it',
                    left.yaw > 0 && left.spin > 0);
                var clean = SW.apply({ yaw: 0.3, power: 20 }, SW.swiped(0.5, 0, 'normal'));
                assert('a straight one hands the shot back untouched',
                    clean.yaw === 0.3 && clean.power === 20 && clean.spin === 0);
            })();
            assert('a crooked swipe inside a full swing still goes somewhere',
                SW.apply({ yaw: 0, power: 20 }, SW.swiped(0, 1, 'easy')).yaw !== 0);
            assert('and hurts more on hard than on easy',
                Math.abs(SW.apply({ yaw: 0, power: 20 }, SW.swiped(0, 1, 'hard')).yaw) >
                Math.abs(SW.apply({ yaw: 0, power: 20 }, SW.swiped(0, 1, 'easy')).yaw));
            assert('and nothing a swipe does reaches past the spray at a full thrash',
                Math.abs(SW.apply({ yaw: 0, power: 20 }, SW.swiped(1, -1, 'hard')).yaw) <= P.spray(1).yaw + 1e-9);

            /* A whole gesture: pulled straight down 200 px over `back` seconds,
               then swiped up over `through`, bowing `bow` px at its middle and
               finishing `dx` to the side. Times in seconds. */
            function gesture(back, through, bow, dx) {
                var pts = [], up = [], i;
                for (i = 0; i <= 20; i++) pts.push([0, 10 * i, back * i / 20]);
                for (i = 1; i <= 20; i++) {
                    var f = i / 20, x = Math.sin(Math.PI * f) * (bow || 0) + f * (dx || 0), y = 200 - 200 * f;
                    pts.push([x, y, back + through * f]);
                    up.push([x, y]);
                }
                return { pts: pts, x0: 0, y0: 0, low: { x: 0, y: 200, t: back },
                         cross: { x: dx || 0, y: 0, t: back + through }, through: [[0, 200]].concat(up) };
            }
            function read(g, timing, shapes, feel) {
                return SW.swipeRead(g, { over: 0, feel: feel || 'normal', timing: timing, shapes: shapes });
            }

            var t = SW.swipeTimes(gesture(0.4, 0.2).pts, 0, 200, 0.6);
            assert('the two halves are timed', approx(t.back, 0.4, 0.03) && approx(t.through, 0.2, 0.03),
                t.back.toFixed(3) + ' / ' + t.through.toFixed(3));
            (function () {
                var g = gesture(0.4, 0.2);
                // Hold at the bottom for a second before swiping.
                g.pts.splice(21, 0, [0, 200, 0.9]);
                g.pts.slice(22).forEach(function (p) { p[2] += 1; });
                g.cross.t += 1;
                var h = SW.swipeTimes(g.pts, 0, 200, g.cross.t);
                assert('a pause at the bottom is not counted as a slow swing',
                    approx(h.through, 0.2, 0.05), h.through.toFixed(3));
            })();

            var even = read(gesture(0.3, 0.3), 'rhythm'), rushed = read(gesture(0.6, 0.12), 'rhythm'),
                lazy = read(gesture(0.15, 0.6), 'rhythm');
            assert('rhythm: up at the pace of down is clean', even.tempo.said === 'clean' && even.perfect);
            assert('rhythm: much faster up is rushed, and pulls', rushed.tempo.said === 'rushed' && rushed.off < 0);
            assert('rhythm: much slower up is lazy, pushes, and costs distance',
                lazy.tempo.said === 'lazy' && lazy.off > 0 && lazy.weight < 1);
            var crisp = read(gesture(0.5, S.TIMING.snap.TARGET), 'snap'),
                snatched = read(gesture(0.5, 0.05), 'snap'), quit = read(gesture(0.5, 0.9), 'snap');
            assert('snap: the target time through is clean, however long the pull took',
                crisp.tempo.said === 'clean' && read(gesture(2, S.TIMING.snap.TARGET), 'snap').tempo.said === 'clean');
            assert('snap: far too quick is snatched, far too slow quit on',
                snatched.tempo.said === 'rushed' && quit.tempo.said === 'lazy' && quit.weight < 1);
            assert('with timing off only the line counts',
                read(gesture(0.1, 0.9), 'off').perfect && read(gesture(0.1, 0.9), 'off').weight === 1);
            assert('and a crooked swipe is not perfect whatever its timing',
                !read(gesture(0.3, 0.3, 0, 60), 'rhythm').perfect);

            // The bow: drawn shapes.
            assert('a straight swipe has no bow', approx(SW.swipeBow(gesture(0.3, 0.3).through, { x: 0, y: 200 }, { x: 0, y: 0 }), 0, 1e-9));
            var bowR = SW.swipeBow(gesture(0.3, 0.3, 36).through, { x: 0, y: 200 }, { x: 0, y: 0 });
            assert('a bow to the right reads positive, as a fraction of the swipe', approx(bowR, 0.18, 0.01), bowR.toFixed(3));
            var both = ['draw', 'fade'];
            assert('a clean bow right is a clean draw', (function () {
                var r = read(gesture(0.3, S.TIMING.snap.TARGET, 200 * S.BOW.IDEAL), 'snap', both);
                return r.shape && r.shape.name === 'draw' && r.shape.cook === 0 && r.perfect;
            })());
            assert('a bow left is a fade', read(gesture(0.3, 0.3, -200 * S.BOW.IDEAL), 'off', both).shape.name === 'fade');
            assert('a wobble under the threshold is no shape at all',
                read(gesture(0.3, 0.3, 200 * S.BOW.MIN * 0.5), 'off', both).shape === null);
