<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loft Links — logic tests</title>
    <meta name="robots" content="noindex">
    <style>
        body { background: #061422; color: #eaf6ff; font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 1rem; line-height: 1.5; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: bold; }
        h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: #9fb6c9; margin: 1.4rem 0 0.3rem; border-bottom: 1px solid #ffffff1a; padding-bottom: 0.2rem; }
        #summary { font-size: 1.2rem; margin-bottom: 0.5rem; padding: 0.6rem 0.9rem; border-radius: 10px; background: #ffffff0d; }
        #summary.ok { color: #4ade80; }
        #summary.bad { color: #f87171; }
        .note { color: #9fb6c9; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="summary">running…</div>
    <div id="results"></div>

    <!-- Pure logic only: config, physics, course data and scoring. No render,
         audio or game module, so nothing here needs WebGL, an AudioContext or a
         DOM beyond this page. -->
    <script src="js/config.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/custom.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/swing.js"></script>
    <script src="js/school.js"></script>
    <script src="js/minimap.js"></script>
    <script src="js/flyover.js"></script>
    <script src="js/replay.js"></script>
    <script src="js/bot.js"></script>
    <script src="js/lab.js"></script>

    <script>
    (function () {
        'use strict';

        var C = G3.CONFIG, P = G3.physics, S = G3.scoring, A = G3.authoring;

        /* Relief, as opposed to shape. A pad whose only bumps have a spine
           (courses `trough` and `channel`: a half-pipe, a banked turn) is
           ground somebody built to be steep, the way a ramp is a tilt
           somebody wrote — and like a ramp it is exempt from "holds a ball
           everywhere". Relief is the humps, and any pad carrying one is
           held to every rule here whatever else it carries. The cup's own
           clearing is checked separately and has no exemptions. */
        function hasRelief(p) {
            return !!(p.bumps && p.bumps.some(function (m) { return !m.line && !m.ring; }));
        }

        /* Where the bag stops keeping the ball down and starts putting it in
           the air. It is not a config value — the simulation only ever sees a
           launch angle — it is the line these tests draw so that "a lofted
           club" means one thing in all three places that ask. It sits between
           the putters and the driver: the driver used to be a 6° club that
           barely left the ground and sat below this line with them, and at
           10° it gets a metre of air and carries water, so a hole it flies is
           a hole that has been flown. "Along the floor" means along the floor. */
        var LOFTED = 9 * Math.PI / 180;
        var passed = 0, failed = 0;
        window.FAILS = [];
        var out = document.getElementById('results');
        var t0 = performance.now();

        function section(name) {
            var h = document.createElement('h2');
            h.textContent = name;
            out.appendChild(h);
        }

        function assert(name, cond, detail) {
            var div = document.createElement('div');
            if (cond) {
                passed++;
                div.className = 'pass';
                div.textContent = '✓ ' + name;
            } else {
                failed++;
                window.FAILS.push(name + (detail ? ' — ' + detail : ''));
                div.className = 'fail';
                div.textContent = 'FAIL: ' + name + (detail ? ' — ' + detail : '');
            }
            out.appendChild(div);
        }

        function note(text) {
            var div = document.createElement('div');
            div.className = 'note';
            div.textContent = '  ' + text;
            out.appendChild(div);
        }

        function approx(a, b, eps) { return Math.abs(a - b) <= (eps === undefined ? 0.001 : eps); }

        var ALL = [];
        G3.COURSES.forEach(function (course) {
            course.holes.forEach(function (h) { ALL.push({ course: course, hole: h }); });
        });

        // A bare hole to run the integrator on, so these tests do not depend on
        // the shipped course data staying the way it is today.
        function lab(opts) {
            opts = opts || {};
            var h = {
                pads: opts.pads || [A.pad(0, 0, 10, 20)],
                water: opts.water || [],
                warps: opts.warps || null,
                loops: opts.loops || null,
                walls: [],
                tee: opts.tee || { x: 5, z: 2 },
                cup: opts.cup || { x: 5, z: 15 }
            };
            h.walls = opts.walls || [];
            var t = P.surfaceTop(h, h.tee.x, h.tee.z);
            var c = P.surfaceTop(h, h.cup.x, h.cup.z);
            h.tee.y = t ? t.y : 0;
            h.cup.y = c ? c.y : 0;
            // What the real builder works out at the end of every hole, and
            // the one field on a hole that is about looking at it rather than
            // playing it. The flyover frames off it; nothing else here reads it.
            var minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity, q, pd;
            for (q = 0; q < h.pads.length; q++) {
                pd = h.pads[q];
                minX = Math.min(minX, pd.x); maxX = Math.max(maxX, pd.x + pd.w);
                minZ = Math.min(minZ, pd.z); maxZ = Math.max(maxZ, pd.z + pd.d);
            }
            h.bounds = { minX: minX, maxX: maxX, minZ: minZ, maxZ: maxZ };
            return h;
        }

        function shootFrom(hole, from, yaw, power, loft, time, dt, bite) {
            var w = P.createWorld(hole, from, time || 0);
            P.launch(w, yaw, power, loft || 0, bite);
            P.settle(w, C.MAX_SHOT_SECONDS, dt);
            return w;
        }

        // Play a shot and hand back the events as well as the world, for the
        // mechanics below — a pipe is only observable as an event.
        function shotEvents(hole, from, yaw, power, loft, bite) {
            var w = P.createWorld(hole, from, 0), all = {}, i, ev;
            P.launch(w, yaw, power, loft || 0, bite);
            for (i = 0; i < Math.ceil(C.MAX_SHOT_SECONDS / C.SIM_DT); i++) {
                ev = P.advance(w, C.SIM_DT, {});
                for (var k in ev) if (ev[k]) all[k] = (all[k] || 0) + 1;
                if (P.done(w)) break;
            }
            return { world: w, events: all, seconds: i * C.SIM_DT };
        }

        /* ── pads and surfaces ──────────────────────────────────────────── */

        section('Pads and surfaces');
        (function () {
            var flat = A.pad(2, 3, 4, 6, 1);
            assert('a flat pad is its own height everywhere',
                approx(P.padHeight(flat, 2, 3), 1) && approx(P.padHeight(flat, 6, 9), 1));

            var tilt = A.pad(0, 0, 4, 4, 2, 'green', -0.5, 0.25);
            assert('a tilted pad is the plane through its corner',
                approx(P.padHeight(tilt, 0, 0), 2) &&
                approx(P.padHeight(tilt, 4, 0), 0) &&
                approx(P.padHeight(tilt, 0, 4), 3));

            /* The curved ground. Only two things have to be true of a hump —
               that its height is what it says and that its gradient is the
               derivative of that height — because the solver reads the second
               to decide which way the ball rolls and the renderer reads the
               first to draw the hill it rolls down. Let those disagree and the
               ball runs uphill on a picture of a slope, which is the one bug
               this whole feature could have that nobody would think to look
               for. So the gradient is checked against a finite difference of
               the height, over a pad carrying two overlapping humps — because
               superposition is where a hand-derived derivative goes wrong. */
            var oneHump = A.pad(0, 0, 20, 20, 0, 'fairway');
            oneHump.bumps = [{ cx: 8, cz: 9, r: 5, a: 1.2 }];
            assert('a hump is at its full height in the middle',
                approx(P.padHeight(oneHump, 8, 9), 1.2));
            assert('half height half way out',
                approx(P.padHeight(oneHump, 8 + 2.5, 9), 0.6));
            assert('and back to the plane at its own radius',
                approx(P.padHeight(oneHump, 8 + 5, 9), 0));
            assert('the ground well beyond it is untouched',
                approx(P.padHeight(oneHump, 19, 1), 0));
            assert('the summit of a hump is flat', approx(P.slopeAt(oneHump, 8, 9), 0, 1e-9));
            assert('and so is the ground at its foot',
                approx(P.slopeAt(oneHump, 8, 4), 0, 1e-9));
            assert('a hollow is the same hump upside down', (function () {
                var dip = A.pad(0, 0, 20, 20, 0, 'fairway');
                dip.bumps = [{ cx: 8, cz: 9, r: 5, a: -1.2 }];
                return approx(P.padHeight(dip, 8, 9), -1.2) &&
                    approx(P.padHeight(dip, 10.5, 9), -0.6);
            })());

            var humped = A.pad(0, 0, 20, 20, 0, 'fairway');
            humped.bumps = [
                { cx: 8, cz: 9, r: 5, a: 1.2 },
                { cx: 12, cz: 11, r: 6, a: -0.8 }
            ];
            (function () {
                var worst = 0, e = 1e-4, px, pz, g, dx, dz, d;
                for (px = 2; px <= 18; px += 0.5) {
                    for (pz = 2; pz <= 18; pz += 0.5) {
                        g = P.padGrad(humped, px, pz, {});
                        dx = (P.padHeight(humped, px + e, pz) - P.padHeight(humped, px - e, pz)) / (2 * e);
                        dz = (P.padHeight(humped, px, pz + e) - P.padHeight(humped, px, pz - e)) / (2 * e);
                        d = Math.max(Math.abs(g.x - dx), Math.abs(g.z - dz));
                        if (d > worst) worst = d;
                    }
                }
                assert('the gradient of a hump is the derivative of its height',
                    worst < 1e-5, 'off by ' + worst.toExponential(2));
            })();
            assert('a pad\'s own tilt still shows up in its gradient', (function () {
                var tilted = A.pad(0, 0, 20, 20, 0, 'fairway', 0.3, -0.2);
                tilted.bumps = [{ cx: 8, cz: 9, r: 5, a: 1.2 }];
                var g = P.padGrad(tilted, 19, 1, {});   // clear of the hump
                return approx(g.x, 0.3) && approx(g.z, -0.2);
            })());

            /* ── curved ground: a bump with a spine ──

               A trough lays the hump's profile along a segment and a channel
               round a circle or an arc; physics.padHeight measures from the
               nearest point of the spine and nothing else changes. The
               derivative check is the one above, over all three spines at
               once — an arc's ends are where a hand-derived gradient would be
               wrong, so the grid crosses them. */
            var curved = A.pad(0, 0, 20, 20, 1, 'green');
            curved.bumps = [
                A.trough(3, 4, 15, 6, 2.5, -1),
                A.channel(10, 12, 4, 2, 0.6),
                A.channel(10, 12, 7, 1.8, -0.5, 0.3, 2.2)
            ];
            assert('a trough is at its full depth all along its spine',
                approx(P.padHeight({ x: 0, z: 0, w: 20, d: 20, y: 1, bumps: [curved.bumps[0]] }, 3, 4), 0) &&
                approx(P.padHeight({ x: 0, z: 0, w: 20, d: 20, y: 1, bumps: [curved.bumps[0]] }, 9, 5), 0));
            assert('…and back to the pad at its radius from it',
                approx(P.padHeight({ x: 0, z: 0, w: 20, d: 20, y: 1, bumps: [curved.bumps[0]] }, 9, 5 + 2.5 / Math.cos(Math.atan2(2, 12))), 1, 1e-6));
            assert('a channel is at full height round the whole of its ring',
                [0, 1.3, 2.9, 4.4].every(function (t) {
                    return approx(P.padHeight({ x: 0, z: 0, w: 20, d: 20, y: 1, bumps: [curved.bumps[1]] },
                        10 + Math.cos(t) * 4, 12 + Math.sin(t) * 4), 1.6);
                }));
            assert('an arc channel stops in a rounded end, not across the whole circle',
                approx(P.padHeight({ x: 0, z: 0, w: 20, d: 20, y: 1, bumps: [curved.bumps[2]] },
                    10 + Math.cos(4) * 7, 12 + Math.sin(4) * 7), 1));
            (function () {
                var worst = 0, e = 1e-4, px, pz, g, dx, dz, d;
                for (px = 0.25; px <= 19.75; px += 0.5) {
                    for (pz = 0.25; pz <= 19.75; pz += 0.5) {
                        g = P.padGrad(curved, px, pz, {});
                        dx = (P.padHeight(curved, px + e, pz) - P.padHeight(curved, px - e, pz)) / (2 * e);
                        dz = (P.padHeight(curved, px, pz + e) - P.padHeight(curved, px, pz - e)) / (2 * e);
                        d = Math.max(Math.abs(g.x - dx), Math.abs(g.z - dz));
                        if (d > worst) worst = d;
                    }
                }
                assert('the gradient of curved ground is the derivative of its height',
                    worst < 1e-4, 'off by ' + worst.toExponential(2));
            })();
            /* And what it is for. A putt aimed fifty degrees off the
               line of a half-pipe runs up the wall and is handed back, and
               a ball that comes to rest does it in the bottom — the wall is
               steeper than a green holds. The same putt on the flat leaves
               the pad. */
            (function () {
                var pipeH = lab({ pads: [A.pad(0, 0, 8, 30, 1)], cup: { x: 4, z: 28 } });
                pipeH.pads[0].bumps = [A.trough(4, 0, 4, 30, 4, -1)];
                var flatH = lab({ pads: [A.pad(0, 0, 8, 30, 1)], cup: { x: 4, z: 28 } });
                var inPipe = shootFrom(pipeH, { x: 4, z: 2 }, 0.9, 7);
                var onFlat = shootFrom(flatH, { x: 4, z: 2 }, 0.9, 7);
                assert('a half-pipe hands a putt back off its wall',
                    !inPipe.out && Math.abs(inPipe.ball.x - 4) < 1.2 && inPipe.ball.z > 4,
                    'finished at x ' + inPipe.ball.x.toFixed(2) + ', z ' + inPipe.ball.z.toFixed(2));
                assert('…where the same putt on the flat goes off the side',
                    onFlat.ball.x > 8 || onFlat.ball.y < 0.5,
                    'finished at x ' + onFlat.ball.x.toFixed(2));
            })();
            /* ── Challenge mode: surfaces that are a function ──

               A field is closed-form terms faded out by `calm` round the cup
               and the tee; the gradient is M∇F + F∇M and is checked here
               against a finite difference, masks overlapping and all. */
            (function () {
                var fp = { x: 0, z: 0, w: 20, d: 20, y: 1, field: [
                    { wave: [0.7, 0.3], a: 0.5, ph: 0.4 },
                    { ripple: [10, 10], k: 1.1, a: 0.6, fall: 0.08 },
                    { saddle: [8, 12], a: 0.3, s: 6 },
                    { gauss: [14, 5], a: -0.9, s: 2.5 },
                    { spiral: [12, 13], k: 1.7, n: 3, a: 0.4 }
                ], calm: [{ x: 4, z: 4, r0: 1.4, r1: 3 }, { x: 5.5, z: 6, r0: 1, r1: 3.2 }] };
                var worst = 0, e = 1e-5, x, z, g, dx, dz;
                for (x = 0.13; x < 20; x += 0.37) {
                    for (z = 0.11; z < 20; z += 0.41) {
                        g = P.padGrad(fp, x, z, {});
                        dx = (P.padHeight(fp, x + e, z) - P.padHeight(fp, x - e, z)) / (2 * e);
                        dz = (P.padHeight(fp, x, z + e) - P.padHeight(fp, x, z - e)) / (2 * e);
                        worst = Math.max(worst, Math.abs(g.x - dx), Math.abs(g.z - dz));
                    }
                }
                assert('the gradient of a function surface is the derivative of its height',
                    worst < 1e-6, 'off by ' + worst.toExponential(2));
                assert('…and a calm is flat ground, at the pad\'s own height',
                    approx(P.padHeight(fp, 4, 4), 1, 1e-12) && P.slopeAt(fp, 4.6, 4.3) === 0);
            })();

            /* The library is curated (courses.js → CHALLENGE_LIBRARY), so it is
               the library that is proven: every variant in it on flat ground
               at the cup and holed by the bot. A deal is six of the eight
               families, one variant each, and a seed is a deal. */
            (function () {
                var a1 = G3.dealChallenge(424242), a2 = G3.dealChallenge(424242), b1 = G3.dealChallenge(99);
                var names = function (c) { return c.holes.map(function (h) { return h.name; }).join(','); };
                assert('a challenge deal is its seed', names(a1) === names(a2));
                assert('a challenge is six holes in the neon theme, keyed by its deal',
                    a1.holes.length === 6 && a1.theme === 'neon' && a1.isChallenge &&
                    a1.from.every(function (r, i) { return r.id === 'challenge-424242' && r.index === i; }));
                var lib = G3.challengeLibrary(), byName = {};
                lib.holes.forEach(function (h) { byName[h.name] = h; });
                var seen = {}, s, c;
                for (s = 1; s <= 40; s++) {
                    c = G3.dealChallenge(s * 7919);
                    c.holes.forEach(function (h) { seen[h.name] = true; });
                }
                assert('forty deals between them reach every variant in the library',
                    lib.holes.every(function (h) { return seen[h.name]; }),
                    lib.holes.filter(function (h) { return !seen[h.name]; }).map(function (h) { return h.name; }).join(', '));
                assert('…and every hole a deal hands out is one out of the library',
                    Object.keys(seen).every(function (n) { return !!byName[n]; }));
                assert('…and a different seed is, as a rule, a different six',
                    names(a1) !== names(b1), names(a1) + ' against ' + names(b1));
                var flatWorst = 0, flatAt = '', failed = [], over = [];
                lib.holes.forEach(function (h) {
                    var lie = P.surfaceUnder(h, h.cup.x, h.cup.z, Infinity), k, t, q;
                    for (k = 0; k < 16; k++) {
                        for (t = 0.2; t <= 1.25; t += 0.35) {
                            q = P.slopeAt(lie.pad, h.cup.x + Math.cos(k / 16 * 6.283) * t, h.cup.z + Math.sin(k / 16 * 6.283) * t);
                            if (q > flatWorst) { flatWorst = q; flatAt = h.name; }
                        }
                    }
                    var r = G3.bot.play(h, 10, G3.bagFor(h));
                    if (!r.sunk) failed.push(h.name);
                    else if (r.strokes > h.par + 2) over.push(h.name + ' took ' + r.strokes);
                });
                assert('there are at least sixteen curated challenge holes', lib.holes.length >= 16, lib.holes.length + '');
                assert('every challenge cup is cut into flat ground', flatWorst < 1e-9,
                    flatAt + ' slopes ' + flatWorst.toExponential(2));
                assert('the bot holes every hole in the challenge library', !failed.length, failed.join('; '));
                assert('…and in a plausible number of strokes', !over.length, over.join('; '));
            })();

            /* ── wells and voids ──

               A gravity well pulls towards its middle, harder the closer you
               are, and keeps what gets inside its core: the shot is out and
               replayed. A void is a hole in a pad — no ground there at all —
               and a ball rolled over one drops through it. */
            (function () {
                var wl = lab({ pads: [A.pad(0, 0, 20, 30)], cup: { x: 10, z: 28 } });
                wl.wells = [{ x: 14, z: 12, pull: 24, core: 0.8 }];
                var near = P.wellPull(wl, 12, 12), nx = near.x, far = P.wellPull(wl, 4, 12).x;
                assert('a well pulls towards its middle, and harder close in',
                    nx > 0 && Math.abs(near.z) < 1e-9 && nx > far * 5, nx.toFixed(2) + ' against ' + far.toFixed(3));
                var bent = shootFrom(wl, { x: 10, z: 2 }, 0, 7);
                var straight = shootFrom(lab({ pads: [A.pad(0, 0, 20, 30)], cup: { x: 10, z: 28 } }), { x: 10, z: 2 }, 0, 7);
                assert('…and a putt past one bends towards it',
                    bent.ball.x > straight.ball.x + 0.3 || bent.out,
                    'x ' + bent.ball.x.toFixed(2) + ' against ' + straight.ball.x.toFixed(2));
                var eaten = shootFrom(wl, { x: 14, z: 4 }, 0, 6);
                assert('…and a ball rolled into its core is swallowed', eaten.out && eaten.swallowed);
                var holed = lab({ pads: [A.pad(0, 0, 10, 30)], cup: { x: 5, z: 28 } });
                holed.pads[0].voids = [{ x: 5, z: 9, r: 1.2 }];
                assert('a void is no ground at all',
                    !P.padContains(holed.pads[0], 5, 9) && P.padContains(holed.pads[0], 5, 6));
                var fell = shootFrom(holed, { x: 5, z: 2 }, 0, 10);
                assert('…and a ball rolled over one drops through it', fell.out, 'finished at z ' + fell.ball.z.toFixed(2));
            })();

            /* A curved rail is chords (courses.arc), each turned to the
               tangent of the circle at its middle. Rolled straight out from
               the centre, a ball meets a chord face on and comes straight
               back — which only happens if the yaw is the tangent's: a chord
               turned a right angle off it would let the ball through. */
            (function () {
                var ring = A.arc(5, 8, 3, 0, Math.PI, { n: 18 });
                var worstR = 0, worstGap = 0, i, B, B2, ex, ez, fx, fz;
                for (i = 0; i < ring.length; i++) {
                    B = P.wallBox(ring[i], 0);
                    worstR = Math.max(worstR, Math.abs(Math.hypot(B.cx - 5, B.cz - 8) - 3));
                }
                assert('an arc\'s chords stand on its circle', worstR < 0.02, 'off by ' + worstR.toFixed(3));
                var arcHole = lab({ pads: [A.pad(0, 0, 10, 20)], walls: ring, cup: { x: 9, z: 18 } });
                // Rolled free it would run past z 12; off the rail it comes
                // back the way it went, with the rail's 62% of its pace.
                var back = shootFrom(arcHole, { x: 5, z: 8 }, 0, 6);
                assert('a ball rolled out from the middle of an arc comes straight back off it',
                    back.ball.z < 10.5 && Math.abs(back.ball.x - 5) < 0.4,
                    'finished at x ' + back.ball.x.toFixed(2) + ', z ' + back.ball.z.toFixed(2));
            })();

            /* A rounded corner (courses.roundCorners) is three things that
               have to agree: the ground stops on the curve, an arc of rail
               stands on it, and the straight rails either side stop where
               the arc starts. If the last two leave a chink, a ball fired
               into the corner finds it — so fire balls at every bearing,
               from the middle and from beside each corner, and none may
               leave the hole. */
            (function () {
                var h = A.build({ name: 'Round Lab', par: 3, pads: [A.pad(0, 0, 8, 16)],
                    tee: { x: 4, z: 2 }, cup: { x: 4, z: 13 } });
                var p = h.pads[0], c = p.round || {};
                assert('a lane\'s four outside corners are rounded',
                    c.sw > 0 && c.se > 0 && c.nw > 0 && c.ne > 0, JSON.stringify(c));
                assert('…the ground stops on the curve',
                    !P.padContains(p, 0.08, 0.08) && !P.padContains(p, 7.92, 15.92) &&
                    P.padContains(p, c.sw * 0.5, c.sw * 0.5) && P.padContains(p, 0.05, 4));
                var bends = [];
                h.walls.forEach(function (wl) { if (wl.bend && bends.indexOf(wl.bend) < 0) bends.push(wl.bend); });
                assert('…and each corner has a bend of rail round it', bends.length === 4, bends.length + ' bends');
                var square = A.build({ name: 'Square Lab', par: 3, round: 0, pads: [A.pad(0, 0, 8, 16)],
                    tee: { x: 4, z: 2 }, cup: { x: 4, z: 13 } });
                assert('`round: 0` keeps a hole square', !square.pads[0].round);
                /* Measured against the same lane with its corners square, so
                   what is counted is what the rounding let out — a ball sent
                   across the cup at full pace can be thrown over a straight
                   rail as well, and that is the cup's business, not this. */
                var leaks = [], from = [{ x: 4, z: 8 }, { x: 1.6, z: 1.6 }, { x: 6.4, z: 1.6 },
                    { x: 1.6, z: 14.4 }, { x: 6.4, z: 14.4 }], k, j, yaw;
                for (k = 0; k < from.length; k++) {
                    for (j = 0; j < 48; j++) {
                        yaw = j / 48 * Math.PI * 2;
                        if (shootFrom(h, from[k], yaw, C.MAX_POWER).out &&
                            !shootFrom(square, from[k], yaw, C.MAX_POWER).out) leaks.push(from[k].x + ',' + from[k].z + ' @' + j);
                    }
                }
                assert('…and no ball fired into a rounded corner gets out', !leaks.length, leaks.slice(0, 5).join(' '));
            })();

            /* A windmill (courses.mill): four sails turning in front of a
               door, and the ball meets only the one that is down. So the same
               putt at the door has to go through when the sails are a quarter
               turn round and come back when a sail is straight down — and
               the box it came back off has to be where the drawn sail's tip
               is, since the renderer turns the sails by the same angle. */
            (function () {
                var walls = A.mill(0, 8, 8, { speed: 0.8, phase: 0 });
                var sail = walls.filter(function (wl) { return wl.sails; })[0];
                var sl = sail.sails, q = Math.PI / 2 / sl.speed;
                var h = A.build({ name: 'Mill Lab', par: 3, round: 0, pads: [A.pad(0, 0, 8, 16)],
                    extra: walls, tee: { x: 4, z: 2 }, cup: { x: 4, z: 13.5 } });
                var down = P.wallBox(sail, 0), across = P.wallBox(sail, q / 2);
                assert('a sail pointing down reaches the ball and is over the door',
                    down.base < 2 * C.BALL_R && Math.abs(down.cx - 4) < 1e-6);
                assert('…and between two sails the door has daylight',
                    across.base > 2 * C.BALL_R && Math.abs(across.cx - 4) > 1,
                    'base ' + across.base.toFixed(2) + ', x ' + across.cx.toFixed(2));
                var tipX = sl.hx + sl.len * Math.sin(0.3), tipY = sl.hy - sl.len * Math.cos(0.3);
                var at = P.wallBox(sail, 0.3 / sl.speed);
                assert('the sail the ball meets is the sail that is drawn',
                    Math.abs(at.cx - tipX) < 1e-6 && Math.abs(at.base - tipY) < 1e-6);
                // Rolled from just short of the sails, so the clock at the
                // door is the clock the shot was struck at, give or take.
                function putt(t) {
                    var w = P.createWorld(h, { x: 4, z: 6.4 }, t);
                    P.launch(w, 0, 9);
                    P.settle(w, C.MAX_SHOT_SECONDS);
                    return w;
                }
                var shut = putt(0), open = putt(q / 2 - 0.12);
                assert('a putt at the door with a sail down comes back off it', shut.ball.z < 8,
                    'finished at z ' + shut.ball.z.toFixed(2));
                assert('…and the same putt between two sails goes through', open.ball.z > 10.5,
                    'finished at z ' + open.ball.z.toFixed(2));
            })();

            /* A disc pad is the shape inside its footprint, not the footprint
               — and the shape is a circle with a wave on it, not a circle
               (courses.WAVE). What the wave may do is bounded in one
               direction only, and everything else on a hole is built on that
               bound: a disc never reaches past its own r, so a clearance
               measured against r is a clearance the shape cannot break. */
            var round = A.circle(10, 10, 4, 'green');
            assert('a disc pad contains its middle', P.padContains(round, 10, 10));
            assert('and the point just inside its own edge', (function () {
                var k, a2, rr, ok2 = true;
                for (k = 0; k < 64; k++) {
                    a2 = k / 64 * Math.PI * 2;
                    rr = P.padRadius(round, a2);
                    if (!P.padContains(round, 10 + Math.cos(a2) * (rr - 0.01),
                                              10 + Math.sin(a2) * (rr - 0.01))) ok2 = false;
                    if (P.padContains(round, 10 + Math.cos(a2) * (rr + 0.01),
                                             10 + Math.sin(a2) * (rr + 0.01))) ok2 = false;
                }
                return ok2;
            })());
            assert('a waved disc stays inside the circle it is cut from', (function () {
                var k, a2, rr, ok2 = true, bitten = false;
                for (k = 0; k < 64; k++) {
                    a2 = k / 64 * Math.PI * 2;
                    rr = P.padRadius(round, a2);
                    if (rr > round.r + 1e-9) ok2 = false;
                    if (rr < round.r - 0.05) bitten = true;
                }
                return ok2 && bitten;
            })());
            assert('and a disc with no wave on it is the circle it always was',
                (function () {
                    var plain = A.pad(6, 6, 8, 8, 0, 'green');
                    plain.r = 4;
                    return P.padRadius(plain, 1.1) === 4 &&
                        P.padContains(plain, 13.99, 10) && !P.padContains(plain, 14.01, 10);
                })());
            assert('but not the corner of its box',
                !P.padContains(round, 13.5, 13.5) && P.padContains(A.pad(6, 6, 8, 8), 13.5, 13.5));

            /* Static friction, which is the whole reason a hole can be built
               out of slopes. A ball put down at rest on a lie the surface can
               hold has to still be there afterwards, and one on a lie it
               cannot hold has to have gone. Both directions matter: the first
               is what makes a green puttable and the second is what makes a
               dune a hazard. */
            (function () {
                function restsOn(kind, g) {
                    var lab2 = {
                        pads: [A.pad(-20, -2, 40, 40, 0, kind, 0, -g)],
                        water: [], walls: [], tee: { x: 0, z: 0, y: 0 }, cup: { x: 0, z: 300, y: 0 }
                    };
                    var w = P.createWorld(lab2, { x: 0, z: 0, y: C.BALL_R }, 0);
                    w.moving = true; w.grounded = true;
                    P.settle(w, 6, 1 / 120);
                    return Math.abs(w.ball.z) < 0.05 && !w.out;
                }
                assert('a ball rests on a lie inside the green\'s angle of repose',
                    restsOn('green', C.HOLD.green - 0.02));
                assert('and rolls off one outside it',
                    !restsOn('green', C.HOLD.green + 0.06));
                assert('rough holds a ball a green would shed',
                    restsOn('rough', C.HOLD.green + 0.06));
                assert('and a plank sheds one the green would hold',
                    !restsOn('wood', C.HOLD.green - 0.02));
            })();

            assert('padContains includes the edges',
                P.padContains(flat, 2, 3) && P.padContains(flat, 6, 9));
            assert('padContains excludes just outside',
                !P.padContains(flat, 1.9, 5) && !P.padContains(flat, 4, 9.1));

            var bridge = lab({ pads: [A.pad(0, 0, 10, 20), A.pad(4, 5, 2, 6, 1.4, 'wood')] });
            var below = P.surfaceUnder(bridge, 5, 8, 0.5);
            var above = P.surfaceUnder(bridge, 5, 8, 2);
            assert('a ball under a bridge stands on the ground', below && approx(below.y, 0));
            assert('a ball on a bridge stands on the bridge', above && approx(above.y, 1.4));
            assert('surfaceTop ignores the ceiling', approx(P.surfaceTop(bridge, 5, 8).y, 1.4));
            assert('nothing underfoot off the pad', P.surfaceUnder(bridge, 50, 50, 99) === null);
            assert('ballTop sits the ball on the surface',
                approx(P.ballTop(bridge, 5, 8), 1.4 + C.BALL_R));

            var pond = lab({ water: [A.rect(2, 2, 3, 3, -0.5)] });
            assert('waterAt finds the pond', P.waterAt(pond, 3, 3) !== null);
            assert('waterAt is null on dry land', P.waterAt(pond, 8, 8) === null);
            assert('waterAt tolerates a hole with no water', P.waterAt(lab(), 1, 1) === null);
        })();

        /* ── walls ─────────────────────────────────────────────────────── */

        section('Walls, gates and blades');
        (function () {
            var stat = A.wall(4, 6, 2, 0.4, 0.6);
            var B = P.wallBox(stat, 12.5);
            assert('a static wall ignores time', approx(B.cx, 5) && approx(B.cz, 6.2) && B.yaw === 0);
            assert('half-extents come from the footprint', approx(B.hw, 1) && approx(B.hd, 0.2));
            assert('top is base plus height', approx(B.top - B.base, 0.6));
            assert('a static wall has no surface velocity',
                P.wallPointVelocity(B, 5, 6.2).x === 0 && P.wallPointVelocity(B, 5, 6.2).z === 0);

            var gate = A.slider(2, 6, 1.5, 0.4, { amp: 0.8, speed: 2 });
            assert('a gate is at its base position at t=0', approx(P.wallBox(gate, 0).cx, 2.75));
            assert('a gate reaches +amp a quarter period later',
                approx(P.wallBox(gate, Math.PI / 4).cx, 3.55, 1e-6));
            assert('a gate does not drift on the other axis',
                approx(P.wallBox(gate, 1.3).cz, 6.2));
            var g0 = P.wallBox(gate, 1.0), g1 = P.wallBox(gate, 1.0 + 1e-4);
            assert('gate velocity matches the finite difference',
                approx(g0.vx, (g1.cx - g0.cx) / 1e-4, 0.01), 'got ' + g0.vx.toFixed(4));

            var blade = A.spinner(5, 10, 3, 0.4, { spin: 1.5 });
            assert('a blade turns with time', approx(P.wallBox(blade, 2).yaw, 3, 1e-9));
            var Bb = P.wallBox(blade, 0);
            var pv = P.wallPointVelocity(Bb, 5 + 1.2, 10);
            assert('a blade tip moves across the sweep, not along the arm',
                approx(pv.x, 0, 1e-9) && approx(pv.z, -1.5 * 1.2, 1e-9),
                'got (' + pv.x.toFixed(3) + ', ' + pv.z.toFixed(3) + ')');

            // Circle vs box, including the rotated case.
            var box = P.wallBox(A.wall(0, 0, 4, 2, 1), 0);   // centre (2,1), half (2,1)
            assert('a circle clear of a box does not collide', P.circleBox(9, 9, C.BALL_R, box) === null);
            assert('a circle overlapping a box collides', P.circleBox(2, 1.05, C.BALL_R, box) !== null);

            var west = P.circleBox(-0.1, 1, C.BALL_R, box);
            assert('the normal points out of the west face', west && approx(west.nx, -1) && approx(west.nz, 0));
            assert('penetration depth is the overlap', west && approx(west.depth, C.BALL_R - 0.1, 1e-9),
                'got ' + (west && west.depth));

            var south = P.circleBox(2, -0.05, C.BALL_R, box);
            assert('the normal points out of the south face', south && approx(south.nz, -1) && approx(south.nx, 0));

            var corner = P.circleBox(-0.08, -0.08, C.BALL_R, box);
            assert('a corner contact gives a diagonal normal', corner && corner.nx < 0 && corner.nz < 0);

            var inside = P.circleBox(2, 0.9, C.BALL_R, box);
            assert('a centre inside the box escapes through the nearest face',
                inside && approx(inside.nz, -1) && inside.depth > C.BALL_R);

            var turned = P.wallBox(A.wall(0, 0, 4, 1, 1, { yaw: Math.PI / 2 }), 0);
            // Rotated 90°, the long axis runs along z, so a point 1.6 to the
            // east is now clear and one 1.6 to the north is not.
            assert('a rotated box is clear along its short axis',
                P.circleBox(2 + 1.6, 0.5, C.BALL_R, turned) === null);
            assert('a rotated box is solid along its long axis',
                P.circleBox(2, 0.5 + 1.6, C.BALL_R, turned) !== null);
        })();

        /* ── the integrator ────────────────────────────────────────────── */

        section('The integrator');
        (function () {
            var flat = lab();
            var w = shootFrom(flat, { x: 5, z: 2 }, 0, 10);
            assert('a shot eventually comes to rest', !w.moving);
            assert('a resting ball has no speed', P.speedOf(w.ball) < 1e-9);
            assert('the ball stays on its pad',
                w.ball.x > 0 && w.ball.x < 10 && w.ball.z > 0 && w.ball.z < 20);
            assert('a grounded ball sits one radius above the surface',
                approx(w.ball.y, C.BALL_R, 1e-6), 'y = ' + w.ball.y);

            // Coast distance under drag a·v plus rolling resistance c is
            // v0/a - (c/a²)·ln(1 + a·v0/c) — v0/a when c is zero — give or
            // take the last few centimetres below the stop threshold.
            var far = shootFrom(lab({ pads: [A.pad(0, 0, 10, 40)], cup: { x: 9, z: 39 } }), { x: 5, z: 1 }, 0, C.MAX_POWER);
            var travelled = far.ball.z - 1;
            var ka = -Math.log(C.FRICTION.green), kc = P.rollOf('green');
            var predicted = C.MAX_POWER / ka - (kc ? kc / (ka * ka) * Math.log(1 + ka * C.MAX_POWER / kc) : 0);
            assert('full power coasts what drag and rolling resistance predict', approx(travelled, predicted, 0.6),
                travelled.toFixed(2) + ' vs ' + predicted.toFixed(2));

            assert('a shot under MIN_POWER is refused', (function () {
                var t = P.createWorld(flat, { x: 5, z: 2 }, 0);
                return P.launch(t, 0, C.MIN_POWER * 0.5, 0) === false && !t.moving;
            })());

            // Frame-rate independence: the game loop hands advance() a real
            // frame time, the tests hand it 1/120. Both must agree.
            var slow = shootFrom(flat, { x: 5, z: 2 }, 0.2, 9, 0, 0, 1 / 30);
            var fast = shootFrom(flat, { x: 5, z: 2 }, 0.2, 9, 0, 0, 1 / 120);
            var gap = Math.hypot(slow.ball.x - fast.ball.x, slow.ball.z - fast.ball.z);
            assert('an unobstructed roll is frame-rate independent', gap < 0.02,
                gap.toFixed(4) + ' units apart');

            var railed = lab({ walls: [A.wall(0, 10, 6, 0.4, 0.6)] });
            var slowB = shootFrom(railed, { x: 5, z: 2 }, 0.35, 12, 0, 0, 1 / 30);
            var fastB = shootFrom(railed, { x: 5, z: 2 }, 0.35, 12, 0, 0, 1 / 120);
            var gapB = Math.hypot(slowB.ball.x - fastB.ball.x, slowB.ball.z - fastB.ball.z);
            assert('bounce sampling error stays small', gapB < 0.35, gapB.toFixed(4) + ' units apart');

            // Nothing may tunnel through the thinnest wall the courses allow.
            var thin = lab({ walls: [A.wall(0, 10, 10, 0.24, 0.6)] });
            var hard = shootFrom(thin, { x: 5, z: 2 }, 0, C.MAX_POWER);
            assert('full power does not tunnel through a 0.24 wall', hard.ball.z < 10,
                'ended at z = ' + hard.ball.z.toFixed(2));

            var sandy = lab({ pads: [A.pad(0, 0, 10, 5), A.pad(0, 5, 10, 4, 0, 'sand'), A.pad(0, 9, 10, 11)] });
            var inSand = shootFrom(sandy, { x: 5, z: 2 }, 0, 10);
            var onGrass = shootFrom(lab(), { x: 5, z: 2 }, 0, 10);
            assert('sand stops the ball short of the same shot on grass',
                inSand.ball.z < onGrass.ball.z - 1.5,
                inSand.ball.z.toFixed(2) + ' vs ' + onGrass.ball.z.toFixed(2));

            var wet = lab({
                pads: [A.pad(0, 0, 10, 8), A.pad(0, 12, 10, 8)],
                water: [A.rect(0, 8, 10, 4, -0.5)]
            });
            var splashed = shootFrom(wet, { x: 5, z: 2 }, 0, 12);
            assert('a ball hit into water splashes', splashed.splash);
            assert('a splashed ball stops moving', !splashed.moving && P.speedOf(splashed.ball) === 0);
            assert('a splashed ball is not also holed', !splashed.sunk);
            assert('the shot origin is kept for the replay',
                approx(splashed.origin.z, 2) && approx(splashed.origin.x, 5));

            var cliff = lab({ pads: [A.pad(0, 0, 10, 8)] });
            var lost = shootFrom(cliff, { x: 5, z: 2 }, 0, 12);
            assert('a ball with nowhere to land is out of play', lost.out);
            assert('an out ball stops moving', !lost.moving);

            // A ledge: the ball must leave the ground and land lower, not slide
            // down an invisible ramp.
            var step = lab({ pads: [A.pad(0, 0, 10, 8, 2), A.pad(0, 8, 10, 12, 0)] });
            var dropped = shootFrom(step, { x: 5, z: 2 }, 0, 9);
            assert('a ball rolling off a ledge lands on the lower pad',
                dropped.ball.z > 8 && approx(dropped.ball.y, C.BALL_R, 0.02),
                'z ' + dropped.ball.z.toFixed(2) + ' y ' + dropped.ball.y.toFixed(3));
            assert('and it is grounded again afterwards', dropped.grounded);

            // A kerb the ball cannot climb turns it back.
            var kerb = lab({ pads: [A.pad(0, 0, 10, 8, 0), A.pad(0, 8, 10, 12, 1.5)] });
            var blocked = shootFrom(kerb, { x: 5, z: 2 }, 0, 8);
            assert('a step too tall to climb is not climbed', blocked.ball.z < 8.2,
                'z = ' + blocked.ball.z.toFixed(2));

            /* …and so does the face of that kerb when the ball meets it in
               mid-air. Pads are surfaces rather than solids, so a ball flying
               into the side of a step used to sail through the hillside and
               drop out of the world underneath it. Hit low and hard enough to
               still be climbing when it gets there: it must not end up on the
               far side and it must not be lost. It comes back off the face
               with a good deal of pace and hops away low, so the ground runs
               on behind the tee: a ball that rolls off the back of an
               eight-unit pad is out for an ordinary reason, not this one. And
               it is struck topped: a lifted drive climbs over the step, which
               is a different shot from the one this is about. */
            var faced = lab({ pads: [A.pad(0, -4, 10, 12, 0), A.pad(0, 8, 10, 12, 1.5)] });
            var flown = P.createWorld(faced, { x: 5, z: 2 }, 0);
            P.launch(flown, 0, 20, 0.12, 0, true);
            P.settle(flown, C.MAX_SHOT_SECONDS);
            assert('a ball flown into the face of a step does not pass through it',
                !flown.out && flown.ball.z < 8.2,
                (flown.out ? 'lost' : 'z = ' + flown.ball.z.toFixed(2)));

            /* The same test must not close a bridge, and the difference is the
               whole rule: under a bridge there is ground below the ball, inside
               a hillside there is not. */
            var span = lab({ pads: [A.pad(0, 0, 10, 20, 0), A.pad(3, 8, 4, 4, 1.4)] });
            var under = shootFrom(span, { x: 5, z: 2 }, 0, 14, 0);
            assert('a ball rolling under a bridge still gets through',
                under.ball.z > 12 && under.ball.y < 1,
                'z ' + under.ball.z.toFixed(2) + ' y ' + under.ball.y.toFixed(2));

            /* The band a riser used to leak through. Reading "inside the face"
               off the ball's crown rather than its centre leaves a radius of
               clearance in which the centre is already under the surface and
               nothing has fired: a shot that grazes the top of the step slips
               in through the last few centimetres, and from in there every
               step puts it back where it was while gravity keeps working, so
               it sinks out of the world. It is a narrow window, so sweep the
               band across three step heights rather than guessing the one
               launch that finds it. */
            (function () {
                var lost = 0, sank = 0, rises = [0.3, 0.4, 0.55], r, i, hill, shot, lie;
                for (r = 0; r < rises.length; r++) {
                    hill = lab({
                        pads: [A.pad(0, 0, 10, 8, 0), A.pad(0, 8, 10, 32, rises[r])],
                        cup: { x: 5, z: 38 }
                    });
                    for (i = 0; i <= 40; i++) {
                        shot = shootFrom(hill, { x: 5, z: 2 }, 0, 8 + i * 0.2, 0.05 + i * 0.01);
                        if (shot.out) { lost++; continue; }
                        lie = P.surfaceUnder(hill, shot.ball.x, shot.ball.z, shot.ball.y);
                        if (!lie || shot.ball.y < lie.y - 1e-9) sank++;
                    }
                }
                assert('no shot at a terrace riser falls through it', lost === 0, lost + ' of 123 lost');
                assert('and none comes to rest inside the hill', sank === 0, sank + ' of 123 buried');
            })();

            // A ball that clears the riser has to land on the terrace, not be
            // turned back by it: the face must be solid without being tall.
            var terrace = lab({ pads: [A.pad(0, 0, 10, 8, 0), A.pad(0, 8, 10, 32, 0.4)], cup: { x: 5, z: 38 } });
            var over = shootFrom(terrace, { x: 5, z: 5 }, 0, 10, 0.6);
            assert('a ball lofted over a riser lands on the terrace above it',
                over.ball.z > 8 && approx(over.ball.y, 0.4 + C.BALL_R, 0.02),
                'z ' + over.ball.z.toFixed(2) + ' y ' + over.ball.y.toFixed(3));

            /* And a ball that is inside the hill already — however it got there
               — has to be pushed out of it. Undoing the last step is no help
               when the step before was inside too. */
            var stuck = P.createWorld(terrace, { x: 5, z: 9, y: 0.2 }, 0);
            stuck.moving = true;
            P.settle(stuck, 4);
            assert('a ball buried in a face is pushed out, not swallowed',
                !stuck.out && approx(stuck.ball.y, C.BALL_R, 1e-6) && stuck.ball.z < 8,
                'x ' + stuck.ball.x.toFixed(2) + ' y ' + stuck.ball.y.toFixed(2) + ' z ' + stuck.ball.z.toFixed(2));

            // Loft: a rail that stops a flat shot should be flyable.
            var fence = lab({ walls: [A.wall(0, 7, 10, 0.4, 0.5, { base: 0 })] });
            var flatShot = shootFrom(fence, { x: 5, z: 2 }, 0, 11, 0);
            var lofted = shootFrom(fence, { x: 5, z: 2 }, 0, 11, 0.7);
            assert('a flat shot is stopped by a rail', flatShot.ball.z < 7.2,
                'z = ' + flatShot.ball.z.toFixed(2));
            assert('a lofted shot carries the same rail', lofted.ball.z > 7.5,
                'z = ' + lofted.ball.z.toFixed(2));
            assert('loft is capped at MAX_LOFT', (function () {
                var t = P.createWorld(fence, { x: 5, z: 2 }, 0);
                P.launch(t, 0, 10, 5);            // absurd loft
                return t.ball.vy <= 10 * Math.sin(C.MAX_LOFT) + 1e-9;
            })());

            // A tilted green must break the ball sideways, and must still let
            // the shot end.
            var tilted = lab({ pads: [A.pad(0, 0, 10, 20, 1.2, 'green', -0.12, 0)] });
            var broken = shootFrom(tilted, { x: 5, z: 2 }, 0, 9);
            assert('a ball on a tilted green drifts downhill', broken.ball.x > 5.3,
                'x = ' + broken.ball.x.toFixed(2));
            assert('a shot on a slope still comes to rest', !broken.moving);

            /* The dish gathering green: 9 pads with flush outer rim, sunken floor,
               smooth corner banking, and slope within green repose limits. */
            var dPads = A.dish(5, 12, 7.0, 2.6, 0.08, 0);
            assert('dish produces nine pads', dPads.length === 9);
            assert('all dish pads are green', dPads.every(function (p) { return p.kind === 'green'; }));
            var dHole = lab({ pads: dPads, cup: { x: 5, z: 12 } });
            var dCenter = P.surfaceUnder(dHole, 5, 12.8, Infinity);
            assert('dish floor is sunk by depth', dCenter && approx(dCenter.y, -0.08, 1e-6));
            assert('dish floor is flat', dCenter && dCenter.pad.sx === 0 && dCenter.pad.sz === 0);
            var dRimW = P.surfaceUnder(dHole, 1.51, 12, Infinity);
            var dRimE = P.surfaceUnder(dHole, 8.49, 12, Infinity);
            var dRimS = P.surfaceUnder(dHole, 5, 8.51, Infinity);
            var dRimN = P.surfaceUnder(dHole, 5, 15.49, Infinity);
            assert('dish outer rims meet surrounding base height',
                dRimW && approx(dRimW.y, 0, 0.01) &&
                dRimE && approx(dRimE.y, 0, 0.01) &&
                dRimS && approx(dRimS.y, 0, 0.01) &&
                dRimN && approx(dRimN.y, 0, 0.01));
            // Check that worst slope is well within green hold limit (0.18)
            var worstDishSlope = 0;
            dPads.forEach(function (p) {
                var s = Math.hypot(p.sx || 0, p.sz || 0);
                if (s > worstDishSlope) worstDishSlope = s;
            });
            assert('dish slope is within green hold limit', worstDishSlope <= C.HOLD.green,
                'worst dish slope is ' + worstDishSlope.toFixed(4) + ' vs hold ' + C.HOLD.green);
            // Ball rolling onto dish slopes down toward the cup
            var gathered = shootFrom(dHole, { x: 5, z: 9.0 }, 0, 1.5);
            assert('ball on dish gathers towards cup', gathered.ball.z > 9.2);

            /* The cup. There is no capture rule to test any more — the hole is
               a hole — so these check the geometry and then measure what falls
               out of it. */
            var cupHole = lab({ cup: { x: 5, z: 12 } });

            var overCup = P.surfaceUnder(cupHole, 5, 12, Infinity);
            var besideCup = P.surfaceUnder(cupHole, 5, 12 - C.HOLE_R - 0.05, Infinity);
            assert('the green is missing over the cup',
                overCup && approx(overCup.y, cupHole.cup.y - C.CUP_DEPTH, 1e-9),
                'ground at ' + (overCup && overCup.y));
            assert('and present again just outside the rim',
                besideCup && approx(besideCup.y, cupHole.cup.y, 1e-9));
            assert('the floor of the cup is its own surface', overCup.pad.kind === 'cup');
            assert('the cup is deeper than the ball is wide', C.CUP_DEPTH > C.BALL_R * 2);

            // Ten units of grass costs about twelve of swing, so the pace that
            // arrives at the hole is what matters: scan for one that does.
            var dropped = null, sp;
            for (sp = 12; sp <= C.MAX_POWER && !dropped; sp += 0.25) {
                var attempt = shootFrom(cupHole, { x: 5, z: 2 }, 0, sp);
                if (attempt.sunk) dropped = attempt;
            }
            assert('a ball rolled at the cup drops in', !!dropped);
            dropped = dropped || shootFrom(cupHole, { x: 5, z: 2 }, 0, 13);
            assert('a holed ball ends below the green',
                dropped.ball.y + C.BALL_R < cupHole.cup.y,
                'centre at ' + dropped.ball.y.toFixed(3) + ' vs rim ' + cupHole.cup.y);
            assert('a holed ball ends inside the shaft',
                Math.hypot(dropped.ball.x - 5, dropped.ball.z - 12) <= C.HOLE_R - C.BALL_R + 1e-6);
            assert('and it stops', !dropped.moving && P.speedOf(dropped.ball) === 0);

            assert('a ball rolled past the edge of the hole stays out',
                !shootFrom(cupHole, { x: 5 + C.HOLE_R + 0.06, z: 2 }, 0, 13).sunk);

            /* A lip-out: struck from close enough that it is still travelling
               when it gets there, the ball crosses the mouth faster than it can
               fall, catches the far edge and is thrown back out. Nothing
               scripts this — it is the rim collision and gravity. */
            var fast = shootFrom(cupHole, { x: 5, z: 10 }, 0, C.MAX_POWER);
            assert('a ball hit far too hard rides over the hole', !fast.sunk);
            assert('and ends up past it', fast.ball.z > 12, 'ended at z = ' + fast.ball.z.toFixed(2));

            // A ball dropped in from above cannot bounce back out of a hole
            // this deep.
            var lobbed = shootFrom(lab({ cup: { x: 5, z: 6.9 } }), { x: 5, z: 2 }, 0, 9.5, C.CLUBS[3].loft);
            assert('a ball that lands in the cup stays in', lobbed.sunk);

            /* A raised green with an open edge — a tabletop, a summit — puts
               air under the putting surface, and the shaft used to be an
               infinitely deep well with no sides: a ball flying beneath the
               green arrived inside the mouth from below or from the side and
               was counted as holed without ever touching the green. Two
               guards, one for each way in. */
            var table = lab({
                pads: [A.pad(0, 0, 10, 6), A.pad(3, 10, 5, 5, 1.2)],
                cup: { x: 5, z: 12.5 }
            });
            assert('the tabletop cup is where the test thinks it is', approx(table.cup.y, 1.2));
            assert('a ball passing under a raised green is not holed from below', (function () {
                var t = P.createWorld(table, { x: 5, z: 4 }, 0);
                P.launch(t, 0, 22, 0.07);
                for (var i = 0; i < 400 && !P.done(t); i++) P.advance(t, C.SIM_DT);
                return !t.sunk;
            })(), 'it flew under the table and dropped in');
            assert('and it is out of play rather than quietly forgotten', (function () {
                var t = P.createWorld(table, { x: 5, z: 4 }, 0);
                P.launch(t, 0, 22, 0.07);
                P.settle(t);
                return t.out || t.splash;
            })());
            assert('a ball crossing the mouth just under the rim is not holed', (function () {
                // Launched from inside the table's own level, below the lip:
                // the only way it reaches the shaft is sideways.
                var t = P.createWorld(table, { x: 5, z: 4 }, 0);
                t.ball.y = 1.2 - 0.2;
                t.grounded = false;
                P.launch(t, 0, 20, 0);
                for (var i = 0; i < 400 && !P.done(t); i++) P.advance(t, C.SIM_DT);
                return !t.sunk;
            })());
            assert('but a ball arriving across the green still drops in', (function () {
                var t = P.createWorld(table, { x: 5, z: 11 }, 0);
                P.launch(t, 0, 4.2, 0);
                P.settle(t);
                return t.sunk;
            })());

            assert('a ball flying over the cup is not swallowed', (function () {
                var t = P.createWorld(cupHole, { x: 5, z: 2 }, 0);
                P.launch(t, 0, 13, 0.6);
                for (var i = 0; i < 400; i++) {
                    P.advance(t, C.SIM_DT);
                    if (t.sunk && t.ball.y > cupHole.cup.y) return false;
                }
                return true;
            })());

            // The pace at which the hole stops accepting the ball is emergent:
            // it is the speed at which the ball crosses the mouth faster than
            // it can fall past the far rim. Worth knowing, and worth noticing
            // if it ever changes.
            var firstIn = 0, lastIn = 0, p;
            for (p = 10; p <= C.MAX_POWER; p += 0.1) {
                if (shootFrom(cupHole, { x: 5, z: 2 }, 0, p).sunk) {
                    if (!firstIn) firstIn = p;
                    lastIn = p;
                }
            }
            assert('there is a workable range of pace that holes out from ten units',
                firstIn > 0 && lastIn - firstIn > 1,
                'from ' + firstIn.toFixed(1) + ' to ' + lastIn.toFixed(1));
            note('from ten units the cup accepts swings of ' + firstIn.toFixed(1) + ' to ' +
                 lastIn.toFixed(1) + ' — everything slower is short, everything faster rides the lip');

            assert('a settled world reports done', P.done(w));
            assert('a rolling world does not report done', (function () {
                var t = P.createWorld(flat, { x: 5, z: 2 }, 0);
                P.launch(t, 0, 10, 0);
                P.advance(t, C.SIM_DT);
                return !P.done(t);
            })());
            assert('advance on a finished world changes nothing', (function () {
                var before = splashed.ball.z;
                P.advance(splashed, 1);
                return splashed.ball.z === before;
            })());

            var clone = P.cloneWorld(w);
            clone.ball.x += 5;
            assert('cloneWorld does not share the ball', w.ball.x !== clone.ball.x);
            assert('cloneWorld keeps the clock', clone.time === w.time);

            var pv = P.previewPath(P.createWorld(flat, { x: 5, z: 2 }, 0), 0, 10, 0, 0.5);
            assert('previewPath starts at the ball', pv.length > 2 && approx(pv[0].z, 2));
            assert('previewPath goes where the shot goes', pv[pv.length - 1].z > pv[0].z);
            assert('previewPath does not disturb the world', (function () {
                var t = P.createWorld(flat, { x: 5, z: 2 }, 0);
                P.previewPath(t, 1, 12, 0.4, 0.8);
                return t.ball.z === 2 && !t.moving;
            })());

            // A rail inside the preview window is part of the shot, so the
            // path rides through it and tags where it turns.
            assert('previewPath leaves an open shot untagged', (function () {
                return !P.previewPath(P.createWorld(flat, { x: 5, z: 2 }, 0), 0, 14, 0, 1)
                    .some(function (q) { return q.bounce; });
            })());

            var railed = lab({ walls: [A.wall(3, 8, 4, 0.4, 0.6)] });
            var bank = P.previewPath(P.createWorld(railed, { x: 5, z: 2 }, 0), 0, 14, 0, 1);
            var turn = -1;
            bank.forEach(function (q, qi) { if (q.bounce && turn < 0) turn = qi; });
            assert('previewPath tags the point it meets a rail',
                turn > 0 && approx(bank[turn].z, 8.2 - 0.2 - C.BALL_R, 0.05),
                'turn at z = ' + (turn > 0 ? bank[turn].z.toFixed(2) : 'never'));
            assert('previewPath carries on past the rail',
                turn > 0 && bank.length > turn + 4 &&
                bank[bank.length - 1].z < bank[turn].z,
                'ends at z = ' + bank[bank.length - 1].z.toFixed(2));
            assert('the ricochet is tagged once, not every step',
                bank.filter(function (q) { return q.bounce; }).length === 1);

            // Two rails inside one window is where honest prediction ends.
            var slot = lab({ walls: [A.wall(6, 0, 0.4, 20, 0.6), A.wall(3.6, 0, 0.4, 20, 0.6)] });
            var caged = P.previewPath(P.createWorld(slot, { x: 5, z: 2 }, 0), 1.1, 20, 0, 1);
            assert('previewPath stops at the second rail',
                caged.length < Math.ceil(1 / C.SIM_DT) &&
                caged.filter(function (q) { return q.bounce; }).length === 1,
                'length ' + caged.length);
            assert('the ricochet gets room the straight path does not',
                bank.length > Math.ceil(1 / C.SIM_DT) + 1,
                'length ' + bank.length);
        })();

        /* ── course data ───────────────────────────────────────────────── */

        section('Course data');
        (function () {
            assert('eighteen courses', G3.COURSES.length === 18);
            assert('a hundred and eight holes in total', ALL.length === 108);
            assert('courseById finds a course', G3.courseById('quarry').id === 'quarry');
            assert('courseById falls back to the first', G3.courseById('nope').id === G3.COURSES[0].id);

            var groupIds = G3.COURSE_GROUPS.map(function (g) { return g.id; });
            assert('the groups are named and described', G3.COURSE_GROUPS.every(function (g) {
                return !!g.id && !!g.name && !!g.blurb;
            }));
            assert('and each has a mark and a colour of its own',
                G3.COURSE_GROUPS.every(function (g) { return !!g.icon && /^#[0-9a-f]{6}$/i.test(g.tint); }));

            /* The draw is dressed as a fifth kind, out of the same four
               fields, because the picker builds every tab on the row the same
               way — a tab missing a tint is a whole panel of `color-mix()`
               declarations thrown away, which is exactly how the block used to
               ship in white outline. */
            (function () {
                var d = G3.SHUFFLE_GROUP;
                assert('the draw is dressed like a kind of golf',
                    !!d && !!d.id && !!d.name && !!d.icon && !!d.blurb && /^#[0-9a-f]{6}$/i.test(d.tint));
                /* And is not one. Nothing may be filed under it: a course that
                   was would be reachable only from a tab that never draws a
                   list. */
                assert('…but it is not a group any course belongs to',
                    groupIds.indexOf(d.id) < 0 && G3.coursesInGroup(d.id).length === 0);
                assert('and it is telling the tabs apart by colour, not just by name',
                    G3.COURSE_GROUPS.every(function (g) {
                        return g.tint.toLowerCase() !== d.tint.toLowerCase();
                    }));
            })();

            G3.COURSES.forEach(function (course) {
                assert(course.name + ': six holes', course.holes.length === 6);
                assert(course.name + ': has a theme and a blurb', !!course.theme && !!course.blurb);
                /* A course with no group, or one nobody prints a heading for,
                   would simply not appear in the picker. */
                assert(course.name + ': is filed under a group that exists',
                    groupIds.indexOf(course.group) >= 0, course.group);
            });

            assert('every course is in exactly one group\'s list',
                G3.COURSE_GROUPS.reduce(function (n, g) {
                    return n + G3.coursesInGroup(g.id).length;
                }, 0) === G3.COURSES.length);

            assert('the next course is the one after it',
                G3.nextCourseId(G3.COURSES[0].id) === G3.COURSES[1].id);
            assert('and the last one wraps round to the first',
                G3.nextCourseId(G3.COURSES[G3.COURSES.length - 1].id) === G3.COURSES[0].id);
            assert('an unknown course still offers somewhere to go',
                !!G3.courseById(G3.nextCourseId('nope')));

            (function () {
                var range = G3.courseById('range');
                assert('courseById finds driving range', range && range.id === 'range');
                assert('driving range is marked as range course', range.isRange === true);
                assert('driving range has one practice hole', range.holes.length === 1);
                assert('driving range hole has tee and target cup', !!range.holes[0].tee && !!range.holes[0].cup);
                assert('driving range bag has full set of clubs', range.holes[0].bag && range.holes[0].bag.length >= 7);
                assert('driving range cup is a target ahead of tee', (range.holes[0].cup.z - range.holes[0].tee.z) >= 30);

                assert('all clubs have non-negative carry distance', C.CLUBS.every(function (c) { return c.carry >= 0; }));
                assert('lofted clubs have positive carry distance', C.CLUBS.filter(function (c) { return c.loft > 0; }).every(function (c) { return c.carry > 0; }));
                assert('all clubs have total distance >= carry', C.CLUBS.every(function (c) { return c.total >= c.carry; }));
                assert('all extra clubs have carry and total', C.EXTRA_CLUBS.every(function (c) {
                    return c.carry >= 0 && c.total >= c.carry;
                }));
                var driver = C.CLUBS.filter(function (c) { return c.id === 'driver'; })[0];
                var wedge = C.CLUBS.filter(function (c) { return c.id === 'wedge'; })[0];
                assert('driver carries farther than wedge', driver && wedge && driver.carry > wedge.carry);
            })();

            /* ── shuffle ────────────────────────────────────────────────

               The draw is the one piece of course logic with a random source
               in it, so it takes one: every assertion below hands `rng` a
               function of its own and nothing here is left to chance. */
            (function () {
                var ids = G3.COURSES.map(function (c) { return c.id; });
                var modeIds = G3.SHUFFLE_MODES.map(function (m) { return m.id; });
                // A save file with a record on the four mini golf courses and
                // nothing anywhere else, which is what most save files look
                // like after an evening.
                var played = { courses: {} };
                G3.coursesInGroup('mini').forEach(function (c, i) {
                    played.courses[c.id] = { best: 20 + i, bestVsPar: 2, bestCard: null, rounds: i + 1 };
                });
                var all = { courses: {} };
                G3.COURSES.forEach(function (c, i) {
                    all.courses[c.id] = { best: 20, bestVsPar: 0, bestCard: null, rounds: i === 0 ? 3 : 1 };
                });
                function fixed(n) { return function () { return n; }; }

                assert('every shuffle mode is named, marked and described',
                    G3.SHUFFLE_MODES.length >= 2 && G3.SHUFFLE_MODES.every(function (m) {
                        return !!m.id && !!m.name && !!m.icon && !!m.blurb;
                    }));
                /* Both sentences, because the picker prints one of the two on
                   every option and a mode with no `eased` line would go blank
                   at exactly the moment it most needs to explain itself — the
                   moment its own net has run out and quietly widened. */
                assert('…and says what it means once it has run out, too',
                    G3.SHUFFLE_MODES.every(function (m) { return !!m.eased; }));
                assert('a mode whose meaning moves names what it has moved to',
                    G3.SHUFFLE_MODES.every(function (m) {
                        return !m.blurbKind || m.blurbKind.indexOf('%s') >= 0;
                    }));
                assert('groupById finds a kind, and is honest about one that is not',
                    G3.groupById('mini').name === 'Mini golf' && G3.groupById('nope') === null &&
                    G3.groupById(G3.SHUFFLE_GROUP.id) === null);
                assert('and no two of them share an id',
                    modeIds.filter(function (id, i) { return modeIds.indexOf(id) !== i; }).length === 0);
                assert('shuffleModeById finds one, and falls back to the first',
                    G3.shuffleModeById('kind').id === 'kind' &&
                    G3.shuffleModeById('nope').id === G3.SHUFFLE_MODES[0].id);

                assert('a draw never offers the course you are already on',
                    modeIds.every(function (m) {
                        return G3.shuffleDraw({ mode: m, from: 'works', save: played, group: 'crazy' })
                            .courses.every(function (c) { return c.id !== 'works'; });
                    }));
                assert('an unknown mode draws like "anything"',
                    G3.shuffleDraw({ mode: 'nope', from: 'works' }).courses.length ===
                    G3.COURSES.length - 1);
                assert('and it says so, rather than reporting the mode it was handed',
                    G3.shuffleDraw({ mode: 'nope' }).mode === 'any');
                assert('a draw from nowhere in particular offers everything',
                    G3.shuffleDraw({ mode: 'any' }).courses.length === G3.COURSES.length);

                var kind = G3.shuffleDraw({ mode: 'kind', from: 'works', group: 'crazy' });
                assert('"same kind" stays inside the kind',
                    kind.courses.length === G3.coursesInGroup('crazy').length - 1 &&
                    kind.courses.every(function (c) { return c.group === 'crazy'; }) && !kind.eased);
                assert('and the tab it is looking at wins over the course it came from',
                    G3.shuffleDraw({ mode: 'kind', from: 'works', group: 'long' })
                        .courses.every(function (c) { return c.group === 'long'; }));
                assert('with no tab named it uses the kind you are standing in',
                    G3.shuffleDraw({ mode: 'kind', from: 'works' })
                        .courses.every(function (c) { return c.group === 'crazy'; }));

                var fresh = G3.shuffleDraw({ mode: 'fresh', from: 'seaside', save: played });
                assert('"new to you" offers only what has never been finished',
                    fresh.courses.length === G3.COURSES.length - 4 && !fresh.eased &&
                    fresh.courses.every(function (c) { return !played.courses[c.id]; }));
                var everywhere = G3.shuffleDraw({ mode: 'fresh', from: 'quarry', save: all });
                assert('and when there is nothing new left it offers the least played',
                    everywhere.eased && everywhere.courses.length === G3.COURSES.length - 2 &&
                    everywhere.courses.every(function (c) { return all.courses[c.id].rounds === 1; }),
                    everywhere.courses.length + ' offered');

                var rec = G3.shuffleDraw({ mode: 'record', from: 'seaside', save: played });
                assert('"beat a best" offers only courses with a record on them',
                    rec.courses.length === 3 && !rec.eased &&
                    rec.courses.every(function (c) { return c.group === 'mini'; }));
                var norec = G3.shuffleDraw({ mode: 'record', from: 'seaside', save: S.emptySave() });
                assert('and before the first round it widens rather than offering nothing',
                    norec.eased && norec.courses.length === G3.COURSES.length - 1);
                assert('a missing save file is read as a fresh one',
                    G3.shuffleDraw({ mode: 'fresh' }).courses.length === G3.COURSES.length &&
                    G3.shuffleDraw({ mode: 'record' }).eased);

                /* ── which kinds the draw may reach for ─────────────────

                   A second filter, asked before the mode and answering a
                   different question: not "where have I been" but "what do I
                   want dealt to me at all". The properties worth pinning are
                   that it holds on every mode, that it is read rather than
                   trusted, and that it cannot leave the button with nothing
                   to press. */
                var groupIdList = G3.COURSE_GROUPS.map(function (g) { return g.id; });

                assert('kinds left unsaid means every kind',
                    G3.shuffleDraw({ mode: 'any' }).courses.length === G3.COURSES.length &&
                    G3.shuffleDraw({ mode: 'any' }).kinds.join() === groupIdList.join() &&
                    !G3.shuffleDraw({ mode: 'any' }).widened);
                var mini = G3.shuffleDraw({ mode: 'any', kinds: ['mini'] });
                assert('one kind ticked draws only that kind',
                    mini.courses.length === G3.coursesInGroup('mini').length &&
                    mini.courses.every(function (c) { return c.group === 'mini'; }) &&
                    !mini.widened);
                var two = G3.shuffleDraw({ mode: 'any', kinds: ['mini', 'long'] });
                assert('…and two ticked draws from both, and nothing else',
                    two.courses.length === G3.coursesInGroup('mini').length +
                        G3.coursesInGroup('long').length &&
                    two.courses.every(function (c) {
                        return c.group === 'mini' || c.group === 'long';
                    }));
                assert('the ticks hold on every mode, not just "anything"',
                    modeIds.every(function (m) {
                        return G3.shuffleDraw({
                            mode: m, from: 'seaside', group: 'crazy',
                            kinds: ['long'], save: played
                        }).courses.every(function (c) { return c.group === 'long'; });
                    }));
                /* The one mode whose own filter can disagree with the ticks:
                   "same kind" is aimed at a kind that has been left out, so
                   there is nothing of that kind to offer. It eases to what
                   the ticks *do* allow rather than to the whole list — the
                   ticks are the coarser answer and outlive the mode. */
                var crossed = G3.shuffleDraw({
                    mode: 'kind', from: 'seaside', group: 'mini', kinds: ['long']
                });
                assert('"same kind" aimed at a kind you have ruled out stays inside the ticks',
                    crossed.eased && !crossed.widened && crossed.courses.length ===
                        G3.coursesInGroup('long').length &&
                    crossed.courses.every(function (c) { return c.group === 'long'; }));
                /* Read rather than trusted, the same as the mode and the
                   random source: a group id nothing answers to is dropped,
                   and dropping every one of them is the empty set below. */
                var noise = G3.shuffleDraw({ mode: 'any', kinds: ['mini', 'nope', 'shuffle'] });
                assert('a kind nothing answers to is dropped, not drawn from',
                    noise.kinds.join() === 'mini' && !noise.widened &&
                    noise.courses.every(function (c) { return c.group === 'mini'; }));
                [[], ['nope'], ['shuffle']].forEach(function (kinds) {
                    var none = G3.shuffleDraw({ mode: 'any', from: 'seaside', kinds: kinds });
                    assert('ticking nothing widens back to every kind rather than offering none: ' +
                        (kinds.join() || '(empty)'),
                        none.widened && none.kinds.join() === groupIdList.join() &&
                        none.courses.length === G3.COURSES.length - 1);
                });
                assert('and the dice still name a course when they do',
                    !!G3.courseById(G3.randomCourseId({
                        mode: 'fresh', from: 'seaside', kinds: [], rng: fixed(0.5)
                    })));
                assert('the ticks reach the dice, not just the count',
                    [0, 0.25, 0.5, 0.99].every(function (n) {
                        return G3.courseById(G3.randomCourseId({
                            mode: 'any', from: 'seaside', kinds: ['crazy'], rng: fixed(n)
                        })).group === 'crazy';
                    }));

                /* `shuffleKinds` is the same normalising, for the picker's own
                   sentence rather than for a draw — and it is the one place
                   the empty set stays empty, because "you have ruled out
                   everything" and "these two" need different words. */
                assert('shuffleKinds hands back the groups, in the picker\'s order',
                    G3.shuffleKinds().map(function (g) { return g.id; }).join() ===
                        groupIdList.join() &&
                    G3.shuffleKinds(['long', 'mini']).map(function (g) { return g.id; })
                        .join() === groupIdList.filter(function (id) {
                            return id === 'mini' || id === 'long';
                        }).join());
                assert('…and an empty set of ticks stays empty there',
                    G3.shuffleKinds([]).length === 0 && G3.shuffleKinds(['nope']).length === 0);

                assert('the dice pick out of the draw, in order',
                    G3.randomCourseId({ mode: 'any', from: null, rng: fixed(0) }) === ids[0] &&
                    G3.randomCourseId({ mode: 'any', from: null, rng: fixed(0.999) }) ===
                        ids[ids.length - 1]);
                // A source outside 0 \u2264 n < 1 is read as 0 rather than trusted:
                // it should cost an unfair draw, never an undefined course.
                assert('a broken source of randomness still names a course',
                    [fixed(1), fixed(-0.5), function () { return NaN; }, function () { }]
                        .every(function (rng) {
                            return G3.randomCourseId({ mode: 'any', from: null, rng: rng }) === ids[0];
                        }));
                assert('the draw is what is picked from, not the whole list',
                    G3.randomCourseId({ mode: 'kind', from: 'works', group: 'crazy', rng: fixed(0) }) !==
                        'works' &&
                    G3.courseById(G3.randomCourseId({
                        mode: 'kind', from: 'works', group: 'crazy', rng: fixed(0.99)
                    })).group === 'crazy');

                // Walked rather than sampled: thirteen draws spread evenly over
                // the unit interval must reach all thirteen other courses, which

               it is the whole assertion on a hole with terrain on it. Sunk

                        // hillside as a step nothing climbs out of.
                        hh = P.padHeight(q, px, pz);

                worstFooting <= 0.35,
                footingAt + ' is out by ' + worstFooting.toFixed(2));

            /* ── decor props ───────────────────────────────────────────
               Decor props are visual dressings. They must have valid kinds,
               finite coordinates, must not sit within the cup or tee clearing,
               and must never be solid walls. */
            var decorCount = 0, badDecor = '';
            var VALID_DECOR = ['buoy', 'piling', 'bench', 'boat', 'rowboat', 'sailboat', 'bin', 'barrel', 'crate', 'palm', 'pine', 'sign', 'windmill'];
            ALL.forEach(function (entry) {
                (entry.hole.decor || []).forEach(function (d) {
                    decorCount++;
                    if (VALID_DECOR.indexOf(d.kind) < 0) {
                        badDecor = 'unknown kind ' + d.kind + ' in ' + entry.course.id + '/' + entry.hole.name;
                    }
                    if (!isFinite(d.x) || !isFinite(d.z) || !isFinite(d.y)) {
                        badDecor = 'non-finite coords for ' + d.kind + ' in ' + entry.course.id + '/' + entry.hole.name;
                    }
                    var cupDist = Math.hypot(d.x - entry.hole.cup.x, d.z - entry.hole.cup.z);
                    if (cupDist < 0.6) {
                        badDecor = d.kind + ' too close to cup in ' + entry.course.id + '/' + entry.hole.name;
                    }
                    var teeDist = Math.hypot(d.x - entry.hole.tee.x, d.z - entry.hole.tee.z);
                    if (teeDist < 0.6) {
                        badDecor = d.kind + ' too close to tee in ' + entry.course.id + '/' + entry.hole.name;
                    }
                });
            });
            assert('decor props have valid kinds, finite coordinates, and clear the tee and cup', !badDecor, badDecor);
            assert('there is decor to check', decorCount > 0, decorCount + ' decor props');
