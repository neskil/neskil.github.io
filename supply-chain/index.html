<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain Simulation | Niklas Billgren</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.25rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        #back-btn:hover {
            transform: scale(1.05);
            background: rgba(40, 50, 70, 0.9);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .controls-panel {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            width: 300px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }

        .controls-panel h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .controls-panel p.desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .control-group {
            margin-bottom: 1.25rem;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .control-group span {
            color: var(--accent-color);
            font-weight: 600;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px var(--accent-color);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .controls-panel {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
                width: auto;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" id="back-btn" title="Back to Home">←</a>

    <canvas id="supplyChainCanvas"></canvas>

    <div class="controls-panel">
        <h2>Interactive Supply Chain</h2>
        <p class="desc">A demand-driven (pull) simulation. Consumers request goods, triggering factories to source raw materials.</p>
        
        <div class="control-group">
            <label for="densitySlider">Node Density <span id="densityVal">Medium</span></label>
            <!-- Range 10000 (Very dense) to 50000 (Sparse) - inverted logic -->
            <input type="range" id="densitySlider" min="10000" max="50000" step="5000" value="25000">
        </div>

        <div class="control-group">
            <label for="demandSlider">Demand Frequency <span id="demandVal">Normal</span></label>
            <!-- Range 0.001 to 0.05 -->
            <input type="range" id="demandSlider" min="0.001" max="0.05" step="0.001" value="0.005">
        </div>

        <div class="control-group" style="margin-bottom: 0;">
            <label for="speedSlider">Simulation Speed <span id="speedVal">1.0x</span></label>
            <input type="range" id="speedSlider" min="0.2" max="3.0" step="0.2" value="1.0">
        </div>
    </div>

    <!-- Configuration for the JS script -->
    <script>
        window.SupplyChainConfig = {
            density: 25000,
            demandFrequency: 0.005,
            speedMultiplier: 1.0
        };
    </script>
    
    <!-- Load the shared simulation logic -->
    <script src="../js/supply-chain.js"></script>

    <!-- UI Interaction Logic -->
    <script>
        const densitySlider = document.getElementById('densitySlider');
        const demandSlider = document.getElementById('demandSlider');
        const speedSlider = document.getElementById('speedSlider');
        
        const densityVal = document.getElementById('densityVal');
        const demandVal = document.getElementById('demandVal');
        const speedVal = document.getElementById('speedVal');

        function updateConfig() {
            // Update labels
            const dVal = parseInt(densitySlider.value);
            if(dVal <= 15000) densityVal.textContent = 'High';
            else if(dVal <= 30000) densityVal.textContent = 'Medium';
            else densityVal.textContent = 'Low';

            const dfVal = parseFloat(demandSlider.value);
            if(dfVal <= 0.003) demandVal.textContent = 'Low';
            else if(dfVal <= 0.015) demandVal.textContent = 'Normal';
            else demandVal.textContent = 'High';

            speedVal.textContent = parseFloat(speedSlider.value).toFixed(1) + 'x';

            // Re-init canvas logic
            if (window.reinitSupplyChain) {
                window.reinitSupplyChain({
                    density: dVal,
                    demandFrequency: dfVal,
                    speedMultiplier: parseFloat(speedSlider.value)
                });
            }
        }

        densitySlider.addEventListener('change', updateConfig);
        demandSlider.addEventListener('input', updateConfig); // 'input' for smooth speed/demand updates, 'change' for density to avoid thrashing
        speedSlider.addEventListener('input', updateConfig);
    </script>
</body>
</html>
