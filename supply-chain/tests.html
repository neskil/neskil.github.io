<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supply Chain Tycoon — logic tests</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: monospace; padding: 1rem; }
        .pass { color: #34d399; }
        .fail { color: #f87171; font-weight: bold; }
        #summary { font-size: 1.2rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div id="summary">running…</div>
    <div id="results"></div>

    <!-- Pure logic only: no render/input/ui/main, no canvas needed. Same
         single-token loader as index.html (see supply-chain/CLAUDE.md); the
         version here only feeds SC.VERSION and is irrelevant to the tests. -->
    <script>window.SC_VERSION = '1.56.0';</script>
    <script>
    (function () {
        var mods = ['config', 'state', 'save', 'audio', 'sfx', 'rng', 'map', 'camera',
                    'roads', 'factories', 'economy', 'vehicles', 'stats',
                    'inspect', 'research', 'placement', 'tutorial'];
        for (var i = 0; i < mods.length; i++)
            document.write('<script src="js/' + mods[i] + '.js?v=' + SC_VERSION + '"><\/script>');
    })();
    </script>

    <script>
    let passed = 0, failed = 0;
    function assert(name, cond, detail) {
        const div = document.createElement('div');
        if (cond) { passed++; div.className = 'pass'; div.textContent = '✓ ' + name; }
        else { failed++; div.className = 'fail'; div.textContent = '✗ ' + name + (detail ? ' — ' + detail : ''); }
        document.getElementById('results').appendChild(div);
    }
    function approx(a, b, eps) { return Math.abs(a - b) <= (eps || 0.001); }

    // Deterministic fixture: straight vertical river at x=1100, halfW=40.
    // S1(red) and S2(blue) -> F -> C, all on the left bank.
    function fixture() {
        SC.newState();
        SC.map._resetSeq();
        SC.state.river = { spine: [{ x: 1100, y: 0 }, { x: 1100, y: SC.CONFIG.WORLD_H }],
                           halfWidths: [40, 40] };
        const S1 = SC.map.makeNode('supplier', 100, 100, { active: true, mat: 'wheat' });
        const S2 = SC.map.makeNode('supplier', 100, 300, { active: true, mat: 'water' });
        const F  = SC.map.makeNode('factory',  400, 200, { active: true, recipe: 'bread' });
        const C  = SC.map.makeNode('city',     700, 200, { active: true, isHQ: true });
        return { S1, S2, F, C };
    }

    // ── Map / river ─────────────────────────────────
    (function() {
        fixture();
        assert('point inside river detected', SC.map.isInRiver(1100, 500));
        assert('point on land not in river', !SC.map.isInRiver(300, 500));
        assert('segment across river detected', SC.map.segmentCrossesRiver(900, 500, 1300, 500));
        assert('segment on one bank does not cross', !SC.map.segmentCrossesRiver(100, 100, 700, 300));

        // River is x in [1060,1140] at y=500; a 900->1300 segment enters the
        // water at t=(1060-900)/400=0.4 and exits at t=(1140-900)/400=0.6 —
        // riverCrossing should isolate roughly that middle stretch (plus a
        // small pad), not the whole [0,1] segment, so a bridge/ferry renders
        // only over the water.
        const c = SC.map.riverCrossing(900, 500, 1300, 500);
        assert('riverCrossing finds the water stretch of a crossing segment',
            c && c.t0 > 0.25 && c.t0 < 0.45 && c.t1 > 0.55 && c.t1 < 0.75);
        assert('riverCrossing returns null for a segment that stays on one bank',
            SC.map.riverCrossing(100, 100, 700, 300) === null);
    })();

    // ── Roads: quote, build, demolish ───────────────
    (function() {
        const { S1, S2, F } = fixture();
        const q = SC.roads.quote(S1, S2);
        assert('road quote length', approx(q.len, 200));
        assert('road quote cost = len * rate', q.cost === Math.round(200 * SC.CONFIG.ROAD_COST_PER_UNIT));
        assert('bridge multiplier applied', (function() {
            const A = SC.map.makeNode('city', 900, 500, { active: true });
            const B = SC.map.makeNode('city', 1300, 500, { active: true });
            const qb = SC.roads.quote(A, B);
            return qb.bridge && qb.cost === Math.round(400 * SC.CONFIG.ROAD_COST_PER_UNIT * SC.CONFIG.BRIDGE_MULT);
        })());

        const m0 = SC.state.money;
        const res = SC.roads.build(S1, F);
        assert('build succeeds and charges money', res.ok && SC.state.money === m0 - res.edge.cost);
        assert('adjacency updated', S1.edges.includes(F) && F.edges.includes(S1));
        assert('duplicate road rejected', SC.roads.quote(S1, F) === null);

        const money1 = SC.state.money;
        assert('demolish refunds half', SC.roads.demolish(res.edge) &&
            SC.state.money === money1 + Math.round(res.edge.cost * SC.CONFIG.ROAD_REFUND));
        assert('adjacency removed after demolish', !S1.edges.includes(F));
    })();

    // ── Road overlap rules: no laying a road over the network ───────
    // Clean state each time (the shared fixture's cluster would get in the
    // way of the geometry): A─B runs east-west at y=300, C─D north-south at
    // x=500, crossing it at (500, 300). River far away at x=1100.
    function crossFixture() {
        SC.newState();
        SC.map._resetSeq();
        SC.state.river = { spine: [{ x: 1100, y: 0 }, { x: 1100, y: SC.CONFIG.WORLD_H }],
                           halfWidths: [40, 40] };
        SC.state.money = 100000;
        return {
            A: SC.map.makeNode('supplier', 200, 300, { active: true, mat: 'wheat' }),
            B: SC.map.makeNode('supplier', 800, 300, { active: true, mat: 'water' }),
            C: SC.map.makeNode('factory',  500, 100, { active: true, recipe: 'bread' }),
            D: SC.map.makeNode('city',     500, 600, { active: true, isHQ: true })
        };
    }

    (function() {
        const { A, B, C, D } = crossFixture();
        SC.roads.build(A, B);

        const q = SC.roads.quote(C, D);
        assert('a road across another is blocked before the research',
            q && q.blocked === 'crossing' && q.crossings.length === 1);
        assert('the block comes with a reason to show the player',
            SC.roads.blockMessage(q).length > 0);
        const before = SC.state.money;
        const res = SC.roads.build(C, D);
        assert('building it is refused, free of charge',
            !res.ok && res.reason === 'crossing' && SC.state.money === before &&
            SC.state.edges.length === 1);

        // A road may not brush past a site it doesn't connect to either —
        // E sits on the far side of D, so C→E would run straight over D.
        const E = SC.map.makeNode('city', 500, 900, { active: true });
        const qNode = SC.roads.quote(C, E);
        assert('a road running over a site is blocked, naming it',
            qNode && qNode.blocked === 'node' && qNode.node === D);
        assert('the same road is fine once it stops at that site',
            SC.roads.quote(C, D).blocked === 'crossing' && !SC.roads.quote(D, E).blocked);

        // Clearance is the same gap manual placement keeps the other way
        // round: threading past D at exactly NODE_ROAD_CLEARANCE is legal,
        // a unit closer is not.
        const gap = SC.CONFIG.NODE_ROAD_CLEARANCE;
        assert('a road clearing a site by NODE_ROAD_CLEARANCE is allowed',
            !SC.roads.checkSegment(200, 600 + gap, 800, 600 + gap, []).blocked);
        assert('a unit closer than that is not',
            SC.roads.checkSegment(200, 600 + gap - 1, 800, 600 + gap - 1, []).blocked === 'node');
    })();

    // ── Interchanges: a legal crossing builds (and pays for) a junction ──
    (function() {
        const { A, B, C, D } = crossFixture();
        SC.state.research.completed.intersections = true;
        SC.roads.build(A, B);

        const q = SC.roads.quote(C, D);
        const fee = SC.CONFIG.PLACEMENT_INTERSECTION_PRICE;
        const rate = SC.CONFIG.ROAD_COST_PER_UNIT;
        assert('a crossing is quoted once the research is done', q && !q.blocked);
        assert('the quote prices both spans plus the interchange fee',
            q.cost === Math.round(200 * rate) + Math.round(300 * rate) + fee && q.fee === fee);

        const before = SC.state.money;
        const res = SC.roads.build(C, D);
        assert('the crossing road builds and charges the quote',
            res.ok && SC.state.money === before - q.cost);
        assert('an interchange junction lands on the crossing',
            res.junctions.length === 1 && res.junctions[0].kind === 'junction' &&
            approx(res.junctions[0].x, 500) && approx(res.junctions[0].y, 300));
        assert('both roads are split at it — 4 spans, 4 arms',
            SC.state.edges.length === 4 && res.junctions[0].edges.length === 4);
        assert('the two roads now genuinely connect',
            SC.roads.findPath(A, C) && SC.roads.findPath(A, C).path.includes(res.junctions[0]));
        assert('no road is left crossing another', !SC.roads.hasCrossings());
    })();

    // ── Interchange geometry: needs room, and not in midstream ───────
    (function() {
        const { A, B } = crossFixture();
        SC.state.research.completed.intersections = true;
        SC.roads.build(A, B);
        // The build ghost checks bare pointer positions, which (unlike real
        // sites) can sit right on top of a road: crossing one a few units
        // from where the road would start leaves no room for a junction.
        assert('a crossing too close to the road\'s own end is refused',
            SC.roads.checkSegment(650, 280, 650, 700, []).blocked === 'tight');
        assert('the same crossing further along is fine',
            !SC.roads.checkSegment(650, 100, 650, 700, []).blocked);

        // An interchange can't float on the river: E─F spans it, G─H would
        // cross E─F midstream.
        const E = SC.map.makeNode('supplier', 900, 800, { active: true, mat: 'ore' });
        const F = SC.map.makeNode('supplier', 1300, 800, { active: true, mat: 'coal' });
        const G = SC.map.makeNode('city', 1100, 600, { active: true });
        const H = SC.map.makeNode('city', 1100, 1000, { active: true });
        SC.roads.build(E, F);
        assert('an interchange in the river is refused',
            SC.roads.quote(G, H).blocked === 'water');
    })();

    // ── Pathfinding ─────────────────────────────────
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.roads.build(S1, S2);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        const r = SC.roads.findPath(S1, C);
        assert('Dijkstra finds multi-hop path', r && r.path.length === 4 && r.path[0] === S1 && r.path[3] === C);
        assert('unreachable returns null', SC.roads.findPath(S1, SC.map.makeNode('city', 2000, 1000, { active: true })) === null);
        SC.roads.build(S1, F);
        const r2 = SC.roads.findPath(S1, C);
        assert('Dijkstra prefers the shorter route', r2.path.length === 3 && approx(r2.dist, Math.hypot(300, 100) + 300));
    })();

    // ── Order planning ──────────────────────────────
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.roads.build(S1, F);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        const order = SC.economy.spawnOrder();
        assert('spawned order is craftable bread x1', order && order.product === 'bread' && order.qty === 1);
        assert('planning succeeds with full route', SC.economy.planOrder(order) && order.factory === F);
        assert('one craft task queued', F.queue.length === 1);
        assert('two raw haul jobs created', SC.state.jobs.length === 2 &&
            SC.state.jobs.every(j => j.type === 'raw' && j.drop === F));

        // Unplanned when disconnected
        SC.newState(); SC.map._resetSeq();
        SC.state.river = { spine: [{ x: 1100, y: 0 }, { x: 1100, y: SC.CONFIG.WORLD_H }], halfWidths: [40, 40] };
        const A = SC.map.makeNode('city', 700, 200, { active: true });
        SC.map.makeNode('supplier', 100, 100, { active: true, mat: 'wheat' });
        SC.map.makeNode('supplier', 100, 300, { active: true, mat: 'water' });
        SC.map.makeNode('factory', 400, 200, { active: true, recipe: 'bread' });
        const o2 = SC.economy.spawnOrder();
        assert('no-route order flagged', !SC.economy.planOrder(o2) && o2.noRoute);
    })();

    // ── Full haul cycle: raws -> craft -> delivery -> payout ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.roads.build(S1, F);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        SC.vehicles.addTruck(F);
        SC.vehicles.addTruck(F);
        const order = SC.economy.spawnOrder();
        SC.economy.planOrder(order);

        const before = SC.state.money;
        for (let i = 0; i < 3000 && SC.state.orders.length; i++) {
            SC.vehicles.tick(0.1);
            SC.factories.tick(0.1);
        }
        assert('order fully delivered', SC.state.delivered === 1 && SC.state.orders.length === 0);
        assert('payout received', SC.state.money === before + order.payout);
        assert('factory queue drained', F.queue.length === 0 && !F.crafting);
        // A truck may still be travelling back to its home yard right after
        // its last delivery — give that a little time to finish before
        // checking full idleness (no job, no path, no cargo, parked home).
        for (let i = 0; i < 500; i++) SC.vehicles.tick(0.1);
        assert('trucks idle and parked at their home yard', SC.state.trucks.every(t =>
            !t.jobs.length && !t.path && !t.cargo.length && t.node === t.homeYard));
    })();

    // ── Expiry cancels work ─────────────────────────
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.roads.build(S1, F);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        const order = SC.economy.spawnOrder();
        SC.economy.planOrder(order);
        SC.economy.expireOrder(order);
        assert('expiry removes order and counts a miss', SC.state.orders.length === 0 && SC.state.missed === 1);
        assert('expiry cancels pending jobs', SC.state.jobs.length === 0);
        assert('expiry clears factory queue', F.queue.length === 0);
    })();

    // ── Economy: upgrades & truck prices ────────────
    (function() {
        fixture();
        SC.state.money = 100000;
        const p0 = SC.upgradePrice('truckSpeed');
        const s0 = SC.truckSpeed();
        const res = SC.economy.buyUpgrade('truckSpeed');
        assert('upgrade purchase levels up and charges', res.ok &&
            SC.state.upgrades.truckSpeed === 1 && SC.state.money === 100000 - p0);
        assert('truck speed increased', SC.truckSpeed() > s0);
        SC.state.upgrades.truckSpeed = SC.CONFIG.UPGRADES.truckSpeed.max;
        assert('maxed upgrade rejected', SC.upgradePrice('truckSpeed') === null &&
            !SC.economy.buyUpgrade('truckSpeed').ok);
        // Truck prices ladder per yard: growth tracks trucks homed at the
        // active yard, and a fresh yard resets the ladder to base price.
        const hq = SC.state.nodes.find(n => n.isHQ);
        SC.state.activeYard = hq;
        const t0 = SC.truckPrice();
        assert('first truck at a yard costs base price', t0 === SC.CONFIG.TRUCK_PRICE);
        SC.vehicles.addTruck(hq, hq);
        SC.vehicles.addTruck(hq, hq);
        assert('truck price grows with trucks at the active yard', SC.truckPrice() > t0);
        const yard = SC.map.makeNode('yard', 900, 900, { active: true });
        SC.state.activeYard = yard;
        assert('a new yard resets the truck price ladder', SC.truckPrice() === SC.CONFIG.TRUCK_PRICE);
    })();

    // ── Truck capacity: base, upgrade effect, bundling, partial cancel ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        assert('base truck capacity is 1', SC.truckCapacity() === 1);
        SC.economy.buyUpgrade('truckCapacity');
        assert('capacity upgrade raises capacity by the configured boost',
            SC.truckCapacity() === 1 + SC.CONFIG.UPGRADES.truckCapacity.boost);

        SC.roads.build(S1, F);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        SC.state.upgrades.truckCapacity = SC.CONFIG.UPGRADES.truckCapacity.max; // capacity 4
        const truck = SC.vehicles.addTruck(S1);

        // Three separate raw jobs, same pickup+drop: one truck should
        // scoop up all three in a single bundle (capacity allows it).
        const order = { id: 99, city: C, product: 'bread', qty: 3, deliveredUnits: 0,
                         payout: 300, deadline: 100, deadlineTotal: 100,
                         planned: true, noRoute: false, done: false };
        for (let i = 0; i < 3; i++) {
            SC.vehicles.addJob({ type: 'raw', item: 'wheat', pickup: S1, drop: F, order, task: null });
        }
        SC.vehicles.dispatch();
        assert('one truck bundles multiple same-route jobs up to capacity',
            truck.jobs.length === 3 && SC.state.jobs.length === 0);

        // A fourth, different-route job stays queued — bundling only
        // pools jobs sharing the exact same pickup and drop.
        SC.vehicles.addJob({ type: 'raw', item: 'water', pickup: S2, drop: F, order, task: null });
        const truck2 = SC.vehicles.addTruck(S2);
        SC.vehicles.dispatch();
        assert('a different pickup/drop job does not join the first bundle',
            truck.jobs.length === 3 && truck2.jobs.length === 1);

        // Cancelling one order's jobs trims the bundle without aborting
        // jobs from a different order sharing the same route. Start the
        // truck away from the pickup so it's still mid-transit ('toPickup')
        // when we cancel — a same-node pickup would complete instantly.
        const order2 = { id: 100, city: C, product: 'bread', qty: 1, deliveredUnits: 0,
                          payout: 100, deadline: 100, deadlineTotal: 100,
                          planned: true, noRoute: false, done: false };
        const mixedTruck = SC.vehicles.addTruck(F);
        SC.vehicles.addJob({ type: 'raw', item: 'wheat', pickup: S1, drop: F, order, task: null });
        SC.vehicles.addJob({ type: 'raw', item: 'wheat', pickup: S1, drop: F, order: order2, task: null });
        SC.vehicles.dispatch();
        assert('mixed-order bundle formed', mixedTruck.jobs.length === 2);
        assert('truck still travelling toward pickup', mixedTruck.phase === 'toPickup' && !!mixedTruck.path);
        SC.vehicles.cancelJobsForOrder(order2);
        assert('cancelling one order only removes its job from the bundle',
            mixedTruck.jobs.length === 1 && mixedTruck.jobs[0].order === order);
        assert('truck with a remaining job keeps hauling', mixedTruck.phase === 'toPickup');

        SC.vehicles.cancelJobsForOrder(order);
        assert('cancelling the last job in a bundle idles the truck',
            mixedTruck.jobs.length === 0 && mixedTruck.phase === null);
    })();

    // ── Truck capacity: multi-unit haul delivers correctly end-to-end ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.state.upgrades.truckCapacity = SC.CONFIG.UPGRADES.truckCapacity.max;
        SC.roads.build(S1, F);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        SC.vehicles.addTruck(F);
        SC.vehicles.addTruck(F);

        const order = SC.economy.spawnOrder();
        order.qty = 3;
        SC.economy.planOrder(order);

        const before = SC.state.money;
        for (let i = 0; i < 4000 && SC.state.orders.length; i++) {
            SC.vehicles.tick(0.1);
            SC.factories.tick(0.1);
        }
        assert('multi-unit order delivered with capacity upgrade active',
            SC.state.delivered === 1 && SC.state.money === before + order.payout);
        assert('no leftover jobs or cargo after the run', SC.state.jobs.length === 0 &&
            SC.state.trucks.every(t => !t.jobs.length && t.cargo.length === 0));
    })();

    // ── Truck yards: pricing, HQ as default, isYard ─────
    (function() {
        fixture();
        assert('HQ counts as a yard even without a yard node',
            SC.isYard(SC.state.nodes.find(n => n.isHQ)));
        assert('a plain city is not a yard', !SC.isYard(SC.state.nodes.find(n => n.kind === 'city' && !n.isHQ) || { kind: 'city' }));
        assert('yard price grows with yards bought', (function() {
            const p0 = SC.yardPrice();
            SC.state.yardsBought = 2;
            return SC.yardPrice() > p0;
        })());
    })();

    // ── Truck yards: placement (not research-gated), activeYard, buyTruck ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.state.activeYard = C; // HQ

        assert('yard placement works without any research done',
            !SC.research.isDone('manualPlacement'));
        const before = SC.state.money;
        const price = SC.yardPrice();
        const res = SC.placement.place('yard', null, 900, 900);
        assert('yard placed on open land and charged the growing price',
            res.ok && res.node.kind === 'yard' && SC.state.money === before - price);
        assert('yardsBought incremented', SC.state.yardsBought === 1);
        assert('a second yard now costs more', SC.yardPrice() > price);
        assert('new yard is itself a yard', SC.isYard(res.node));

        SC.state.activeYard = res.node;
        const truckBefore = SC.state.trucks.length;
        const tRes = SC.vehicles.buyTruck();
        assert('bought truck stations at the active yard',
            tRes.ok && tRes.truck.homeYard === res.node && tRes.truck.node === res.node);
        assert('trucks list grew by one', SC.state.trucks.length === truckBefore + 1);

        SC.state.activeYard = null;
        const tRes2 = SC.vehicles.buyTruck();
        assert('a null/invalid active yard falls back to HQ',
            tRes2.ok && tRes2.truck.homeYard.isHQ);
    })();

    // ── Junctions: a routing waypoint, gated behind the (cheap) research ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        const price = SC.CONFIG.PLACEMENT_JUNCTION_PRICE;
        assert('junction price matches config', SC.placement.price('junction') === price);

        // Locked until the 'junctions' research is done (yards stay ungated).
        assert('junction is locked before the junctions research',
            !SC.placement.isUnlocked('junction') && SC.placement.isUnlocked('yard'));
        const locked = SC.placement.place('junction', null, 900, 900);
        assert('placing a junction is refused while locked',
            !locked.ok && locked.reason === 'locked');

        SC.state.research.completed.junctions = true;
        assert('junction unlocks once the research is complete', SC.placement.isUnlocked('junction'));
        const before = SC.state.money;
        const res = SC.placement.place('junction', null, 900, 900);
        assert('junction placed on open land and charged the flat price',
            res.ok && res.node.kind === 'junction' && SC.state.money === before - price);
        assert('a junction is not a yard', !SC.isYard(res.node));

        // Route every road THROUGH the junction — the only way from either
        // supplier to the factory (and on to HQ) is via this waypoint, so a
        // full order plan proves Dijkstra/the planner treat it as an
        // ordinary passthrough node, not a dead end or a phantom supplier.
        SC.roads.build(S1, res.node);
        SC.roads.build(S2, res.node);
        SC.roads.build(res.node, F);
        SC.roads.build(F, C);
        assert('pathfinding routes straight through the junction',
            SC.roads.findPath(S1, F) && SC.roads.findPath(S1, F).path.includes(res.node));
        const order = SC.economy.spawnOrder();
        assert('an order plans end-to-end through a junction waypoint',
            SC.economy.planOrder(order) && order.factory === F);
    })();

    // ── Save keeps a placed junction ──────────────────────────
    (function() {
        const { S1, F } = fixture();
        SC.state.money = 100000;
        SC.state.research.completed.junctions = true; // unlock placement
        const junction = SC.placement.place('junction', null, 900, 900).node;
        SC.roads.build(S1, junction);
        SC.roads.build(junction, F);

        SC.save.restore(SC.save.serialize());
        // Restore rebuilds state.nodes from scratch, so S1/F/junction above
        // are now stale objects — re-find everything by kind/mat instead of
        // reusing them, the same way the yard round-trip test above does.
        const st = SC.state;
        const restored = st.nodes.find(n => n.kind === 'junction');
        assert('junction node restored', !!restored);
        assert('the restored junction kept both its roads', restored.edges.length === 2);
        const restoredS1 = st.nodes.find(n => n.kind === 'supplier' && n.mat === 'wheat');

    // ── Field expansion: growth, frontier seeding, schedule, save ──
    (function() {
        SC.newState(); SC.map._resetSeq();
        SC.map.generateWorld('expand-test');
        const C = SC.CONFIG, ex = C.WORLD_EXPAND;
        const w0 = SC.state.worldW, h0 = SC.state.worldH;
        assert('fresh state starts at the base field size',
            w0 === C.WORLD_W && h0 === C.WORLD_H && SC.state.expansions === 0);
        assert('SC.worldW/worldH track the live state', SC.worldW() === w0 && SC.worldH() === h0);

        const n0 = SC.state.nodes.length;
        const lockedBefore = SC.state.nodes.filter(n => !n.active).map(n => n.id);
        let evt = null;
        SC.on('fieldExpanded', d => { evt = d; });
        SC.map.expandField();
        assert('expandField grows the field by one step',
            SC.state.worldW === w0 + ex.stepW && SC.state.worldH === h0 + ex.stepH);
        assert('expandField increments the expansion count', SC.state.expansions === 1);
        assert('expandField emits fieldExpanded with the new size',
            evt && evt.worldW === SC.state.worldW && evt.expansions === 1);

        const seeded = SC.state.nodes.slice(n0);
        assert('expansion seeds new frontier sites', seeded.length >= 1);
        assert('seeded sites are active (never join the milestone queue)',
            seeded.every(n => n.active));
        assert('seeded sites sit in the frontier band',
            seeded.every(n => n.x > w0 - C.NODE_MARGIN || n.y > h0 - C.NODE_MARGIN));
        assert('seeded sites stay inside the new bounds',
            seeded.every(n => n.x <= SC.state.worldW - C.NODE_MARGIN + 1 &&
                              n.y <= SC.state.worldH - C.NODE_MARGIN + 1));
        assert('seeded sites avoid the river',
            seeded.every(n => !SC.map.isInRiver(n.x, n.y)));
        assert('milestone queue order is untouched by expansion',
            JSON.stringify(SC.state.nodes.filter(n => !n.active).map(n => n.id)) ===
            JSON.stringify(lockedBefore));

        // Scheduled firing off the delivery count
        SC.state.delivered = ex.at[1] - 1;
        assert('maybeExpandField waits below the threshold', SC.map.maybeExpandField() === false);
        SC.state.delivered = ex.at[1];
        assert('maybeExpandField fires at the threshold', SC.map.maybeExpandField() === true);
        assert('scheduled expansion advanced the count', SC.state.expansions === 2);
        SC.state.delivered = 99999;
        SC.state.expansions = ex.at.length;
        assert('maybeExpandField stops when the schedule runs out',
            SC.map.maybeExpandField() === false);

        // riverAt keeps its original spine mapping after the field grew
        const rv = SC.map.riverAt(h0 * 0.5);
        assert('riverAt still maps y onto the original spine after expansion',
            rv && rv.x > 0 && rv.halfW > 0);

        // Save round-trip keeps the grown size
        SC.state.expansions = 2;
        const grownW = SC.state.worldW, grownH = SC.state.worldH;
        SC.save.restore(SC.save.serialize());
        assert('field size survives a save round-trip',
            SC.state.worldW === grownW && SC.state.worldH === grownH && SC.state.expansions === 2);

        // Back-compat: a save without field data falls back to the base size
        const legacy = SC.save.serialize();
        delete legacy.worldW; delete legacy.worldH; delete legacy.expansions;
        SC.save.restore(legacy);
        assert('legacy saves without field data restore at the base size',
            SC.state.worldW === C.WORLD_W && SC.state.worldH === C.WORLD_H && SC.state.expansions === 0);
    })();

        // identical-length normal one: count ticks to finish each leg.
        const e2 = SC.roads.build(S2, F).edge; // same 316.23u length as S1->F, unpaved
        function ticksToTraverse(from, to) {
            const truck = SC.vehicles.addTruck(from);
            truck.phase = 'returning'; // plain travel, no pickup/drop logic
            truck.path = SC.roads.findPath(from, to).path;
            truck.pathIdx = 0; truck.progress = 0;
            let n = 0;
            while (truck.path && n < 1000) { SC.vehicles.tick(0.05); n++; }
            SC.state.trucks.pop();
            return n;
        }
        const hwyTicks = ticksToTraverse(S1, F); // paved leg
        const stdTicks = ticksToTraverse(S2, F); // unpaved leg
        assert('truck crosses a highway edge faster than a normal one',
            hwyTicks < stdTicks && approx(stdTicks / hwyTicks, SC.CONFIG.HIGHWAY_SPEED_MULT, 0.2));

    (function() {

        const nearSup = SC.map.makeNode('supplier', 200,  500, { mat: 'ore' });

        assert('far-bank point classified as +1', SC.map.sideOf(1800, 500) === 1);

        SC.state.time = 0; // inside Normal's 3-min grace window
        assert('river grace is active at t=0', SC.map.riverGraceRemaining() > 0);

        // A milestone-style unlock skips the far supplier for the near one.
        const u1 = SC.map.unlockNext(n => n.kind !== 'city');
        assert('grace unlocks the near-bank site first', u1 === nearSup && nearSup.active);
        assert('grace holds back the far-bank supplier', !farSup.active);
        assert('far-bank supplier reported as grace-held',
            SC.map.anyHeldByRiverGrace(n => n.kind !== 'city'));

        // A customer-DC unlock is held too when only the far-bank city remains.
        assert('no city unlocks while the far-bank city is grace-held',
            SC.map.unlockNext(n => n.kind === 'city') === null && !farCity.active);
        assert('far-bank city reported as grace-held',
            SC.map.anyHeldByRiverGrace(n => n.kind === 'city'));

        // Once the window closes, the far-bank sites unlock normally.
        SC.state.time = SC.diff().riverGraceMin * 60 + 1;
        assert('river grace has expired after the window', SC.map.riverGraceRemaining() === 0);
        assert('no site is grace-held once the window closes',
            !SC.map.anyHeldByRiverGrace(n => n.kind !== 'city'));
        assert('far-bank supplier unlocks after grace', SC.map.unlockNext(n => n.kind !== 'city') === farSup && farSup.active);
        assert('far-bank city unlocks after grace', SC.map.unlockNext(n => n.kind === 'city') === farCity && farCity.active);

    // ── Pool sites tether to the network — no far-corner strandings ──
    (function() {
        // Worst nearest-neighbour distance across several seeds on a given
        // difficulty (a proxy for how spread-out the generated map is).
        function worstIsolation(difficulty) {
            let worst = 0;
            for (const seed of ['spread-1', 'spread-2', 'spread-3', 'spread-4', 'spread-5', 'spread-6']) {
                SC.newState(difficulty); SC.map._resetSeq();
                SC.map.generateWorld(seed);
                const nodes = SC.state.nodes;
                const cap = SC.nodeMaxSpread() * 2; // leash ceiling after full relaxation
                for (const n of nodes) {
                    let nearest = Infinity;
                    for (const m of nodes) if (m !== n) nearest = Math.min(nearest, Math.hypot(m.x - n.x, m.y - n.y));
                    worst = Math.max(worst, nearest);
                    assert(`[${difficulty}] every site has a neighbour within the spread cap`,
                        nearest <= cap, `seed ${seed}: nearest ${Math.round(nearest)} > cap ${cap}`);
                }
            }
            return worst;
        }
        const easyWorst = worstIsolation('easy');
        const normalWorst = worstIsolation('normal');
        const hardWorst = worstIsolation('hard');

        // Per-difficulty spread cap is wired up and ordered as intended.
        SC.newState('easy');   assert('easy spread cap is the tightest', SC.nodeMaxSpread() === 520);
        SC.newState('normal'); assert('normal spread cap is the baseline', SC.nodeMaxSpread() === 620);
        SC.newState('hard');   assert('hard spread cap is the loosest', SC.nodeMaxSpread() === 820);
        assert('spread cap falls back to CONFIG when a preset omits nodeSpread', (function() {
            SC.newState('normal');
            const saved = SC.DIFFICULTIES.normal.nodeSpread;
            delete SC.DIFFICULTIES.normal.nodeSpread;
            const fell = SC.nodeMaxSpread() === SC.CONFIG.NODE_MAX_SPREAD;
            SC.DIFFICULTIES.normal.nodeSpread = saved;
            return fell;
        })());

        // The scaling actually bites: Hard maps sprawl more than Easy ones.
        assert('harder difficulty spreads sites out more than easier',
            hardWorst > easyWorst, `hard ${Math.round(hardWorst)} vs easy ${Math.round(easyWorst)}`);
        assert('normal spread sits between easy and hard',
            normalWorst >= easyWorst - 1 && normalWorst <= hardWorst + 1,
            `easy ${Math.round(easyWorst)}, normal ${Math.round(normalWorst)}, hard ${Math.round(hardWorst)}`);
    })();

    // ── Intersections: math, and the retrofit tool for legacy crossings ──
    // New roads build their own interchanges now (see the overlap-rule tests
    // above), so the manual tool only ever meets a crossing from a save made
    // before that rule — which `_addRawEdge` reproduces here.
    (function() {
        SC.newState();
        SC.map._resetSeq();
        SC.state.river = { spine: [{ x: 1100, y: 0 }, { x: 1100, y: SC.CONFIG.WORLD_H }],
                           halfWidths: [40, 40] };
        SC.state.money = 100000;

        // 1. Math check
        const a = { x: 100, y: 100 };
        const b = { x: 300, y: 300 };
        const c = { x: 100, y: 300 };
        const d = { x: 300, y: 100 };

        const pt = SC.roads.getLineIntersection(a, b, c, d);
        assert('getLineIntersection detects true crossing', pt && approx(pt.x, 200) && approx(pt.y, 200));

        const ptNo = SC.roads.getLineIntersection(a, { x: 150, y: 150 }, c, d);
        assert('getLineIntersection rejects non-overlapping segments', ptNo === null);

        // 2. Research lock
        assert('intersection is locked before intersections research', !SC.placement.isUnlocked('intersection'));

        SC.state.research.completed.intersections = true;
        assert('intersection is unlocked after research', SC.placement.isUnlocked('intersection'));

        // 3. Placement & road splitting test
        const nA = SC.map.makeNode('supplier', 100, 100, { active: true, mat: 'wheat' });
        const nB = SC.map.makeNode('factory', 300, 300, { active: true, recipe: 'bread' });
        const nC = SC.map.makeNode('supplier', 100, 300, { active: true, mat: 'water' });
        const nD = SC.map.makeNode('city', 300, 100, { active: true });

        const edge1 = SC.roads._addRawEdge(nA, nB);
        const edge2 = SC.roads._addRawEdge(nC, nD);

        assert('two roads exist', SC.state.edges.length === 2);
        assert('and they cross without meeting — the legacy case',
            SC.roads.hasCrossings());

        const crossing = SC.roads.findClosestCrossing(200, 200, 40);
        assert('closest crossing detected', crossing !== null && approx(crossing.x, 200) && approx(crossing.y, 200));

        edge1.level = 1;

        const truck = SC.vehicles.addTruck(nA, nA);
        truck.path = [nA, nB];
        truck.pathIdx = 0;
        truck.progress = 0.4;
        truck.phase = 'toDrop';

        const price = SC.CONFIG.PLACEMENT_INTERSECTION_PRICE;
        const beforeMoney = SC.state.money;
        const res = SC.placement.place('intersection', null, 201, 199);

        assert('intersection successfully placed', res.ok && res.node.kind === 'junction');
        assert('money charged for intersection', SC.state.money === beforeMoney - price);
        assert('edges split into 4 segments', SC.state.edges.length === 4);

        assert('junction connects to all 4 endpoints', res.node.edges.length === 4);

        const split1 = SC.state.edges.find(e => (e.a === nA && e.b === res.node) || (e.a === res.node && e.b === nA));
        const split2 = SC.state.edges.find(e => (e.a === nB && e.b === res.node) || (e.a === res.node && e.b === nB));
        assert('split segments keep highway level', split1 && split1.level === 1 && split2 && split2.level === 1);

        assert('truck path has 3 nodes now', truck.path.length === 3 && truck.path[1] === res.node);
        assert('truck progress mapped correctly', approx(truck.progress, 0.8));
        assert('truck pathIdx is still 0', truck.pathIdx === 0);
        assert('the retrofit leaves no crossing behind', !SC.roads.hasCrossings());
    })();

    // ── Tutorial: step progression, skipping, persistence ────────────
    (function() {
        const { S1, S2, F, C } = fixture();   // wheat + water + bakery + HQ
        SC.state.gameStarted = true;
        SC.tutorial.start();

        assert('tutorial starts on the wheat step', SC.tutorial.current().id === 'wheat');
        assert('tutorial points at the bakery and the wheat farm',
            SC.tutorial.focus().length === 2 &&
            SC.tutorial.focus().includes(F) && SC.tutorial.focus().includes(S1));

        // Roading an unrelated pair must not advance the step.
        SC.state.money = 99999;
        SC.roads.build(S2, C);
        SC.tutorial.refresh();
        assert('an unrelated road does not advance the tutorial',
            SC.tutorial.current().id === 'wheat');

        SC.roads.build(F, S1);
        SC.tutorial.refresh();
        assert('roading bakery→wheat advances to the water step',
            SC.tutorial.current().id === 'water');
        assert('water step points at the bakery and the water pump',
            SC.tutorial.focus().includes(F) && SC.tutorial.focus().includes(S2));

        // Bakery→water also routes the bakery to HQ (via the S2→C road built
        // above), so this must clear BOTH remaining build steps at once.
        SC.roads.build(F, S2);
        SC.tutorial.refresh();
        assert('one road can satisfy two steps at once',
            SC.tutorial.current().id === 'deliver');

        // The final step waits on an actual delivery.
        assert('deliver step highlights nothing', SC.tutorial.focus().length === 0);
        SC.state.delivered = 1;
        SC.tutorial.refresh();
        assert('a delivery finishes the tutorial', SC.tutorial.current() === null);
        assert('finished tutorial is inactive', !SC.tutorial.active());
        assert('finished tutorial stores step -1', SC.state.tutorialStep === -1);
    })();

    // ── Tutorial: save round-trip resumes mid-sequence ───────────────

        const { S1, F } = fixture();
        SC.state.gameStarted = true;

        SC.save.store();
        SC.newState();
        assert('save round-trip loads', SC.save.load());
        assert('tutorial step survives a save round-trip', SC.state.tutorialStep === step);

        // A save written before the tutorial existed must not drop the player
        // into step 1 mid-run.
        const raw = JSON.parse(localStorage.getItem(SC.save.KEY) || '{}');
        delete raw.tutorialStep;
        localStorage.setItem(SC.save.KEY, JSON.stringify(raw));
        SC.newState();
        SC.save.load();
        assert('a pre-tutorial save restores as finished, not step 1',
            SC.state.tutorialStep === -1);
        SC.save.clear();
    })();
