<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supply Chain Tycoon — logic tests</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: monospace; padding: 1rem; }
        .pass { color: #34d399; }
        .fail { color: #f87171; font-weight: bold; }
        #summary { font-size: 1.2rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div id="summary">running…</div>
    <div id="results"></div>

    <!-- Pure logic only: no render/input/ui/main, no canvas needed -->
    <script src="js/config.js?v=1.15.0"></script>
    <script src="js/state.js?v=1.15.0"></script>
    <script src="js/save.js?v=1.15.0"></script>
    <script src="js/sfx.js?v=1.15.0"></script>
    <script src="js/rng.js?v=1.15.0"></script>
    <script src="js/map.js?v=1.15.0"></script>
    <script src="js/camera.js?v=1.15.0"></script>
    <script src="js/roads.js?v=1.15.0"></script>
    <script src="js/factories.js?v=1.15.0"></script>
    <script src="js/economy.js?v=1.15.0"></script>
    <script src="js/vehicles.js?v=1.15.0"></script>
    <script src="js/inspect.js?v=1.15.0"></script>
    <script src="js/research.js?v=1.15.0"></script>
    <script src="js/placement.js?v=1.15.0"></script>

    <script>
    let passed = 0, failed = 0;
    function assert(name, cond, detail) {
        const div = document.createElement('div');
        if (cond) { passed++; div.className = 'pass'; div.textContent = '✓ ' + name; }
        else { failed++; div.className = 'fail'; div.textContent = '✗ ' + name + (detail ? ' — ' + detail : ''); }
        document.getElementById('results').appendChild(div);
    }
    function approx(a, b, eps) { return Math.abs(a - b) <= (eps || 0.001); }

    // Deterministic fixture: straight vertical river at x=1100, halfW=40.
    // S1(red) and S2(blue) -> F -> C, all on the left bank.
    function fixture() {
        SC.newState();
        SC.map._resetSeq();
        SC.state.river = { spine: [{ x: 1100, y: 0 }, { x: 1100, y: SC.CONFIG.WORLD_H }],
                           halfWidths: [40, 40] };
        const S1 = SC.map.makeNode('supplier', 100, 100, { active: true, mat: 'wheat' });
        const S2 = SC.map.makeNode('supplier', 100, 300, { active: true, mat: 'water' });
        const F  = SC.map.makeNode('factory',  400, 200, { active: true, recipe: 'bread' });
        const C  = SC.map.makeNode('city',     700, 200, { active: true, isHQ: true });
        return { S1, S2, F, C };
    }

    // ── Map / river ─────────────────────────────────
    (function() {
        fixture();
        assert('point inside river detected', SC.map.isInRiver(1100, 500));
        assert('point on land not in river', !SC.map.isInRiver(300, 500));
        assert('segment across river detected', SC.map.segmentCrossesRiver(900, 500, 1300, 500));
        assert('segment on one bank does not cross', !SC.map.segmentCrossesRiver(100, 100, 700, 300));
    })();

    // ── Roads: quote, build, demolish ───────────────
    (function() {
        const { S1, S2, F } = fixture();
        const q = SC.roads.quote(S1, S2);
        assert('road quote length', approx(q.len, 200));
        assert('road quote cost = len * rate', q.cost === Math.round(200 * SC.CONFIG.ROAD_COST_PER_UNIT));
        assert('bridge multiplier applied', (function() {
            const A = SC.map.makeNode('city', 900, 500, { active: true });
            const B = SC.map.makeNode('city', 1300, 500, { active: true });
            const qb = SC.roads.quote(A, B);
            return qb.bridge && qb.cost === Math.round(400 * SC.CONFIG.ROAD_COST_PER_UNIT * SC.CONFIG.BRIDGE_MULT);
        })());

        const m0 = SC.state.money;
        const res = SC.roads.build(S1, F);
        assert('build succeeds and charges money', res.ok && SC.state.money === m0 - res.edge.cost);
        assert('adjacency updated', S1.edges.includes(F) && F.edges.includes(S1));
        assert('duplicate road rejected', SC.roads.quote(S1, F) === null);

        const money1 = SC.state.money;
        assert('demolish refunds half', SC.roads.demolish(res.edge) &&
            SC.state.money === money1 + Math.round(res.edge.cost * SC.CONFIG.ROAD_REFUND));
        assert('adjacency removed after demolish', !S1.edges.includes(F));
    })();

    // ── Pathfinding ─────────────────────────────────
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.roads.build(S1, S2);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        const r = SC.roads.findPath(S1, C);
        assert('Dijkstra finds multi-hop path', r && r.path.length === 4 && r.path[0] === S1 && r.path[3] === C);
        assert('unreachable returns null', SC.roads.findPath(S1, SC.map.makeNode('city', 2000, 1000, { active: true })) === null);
        SC.roads.build(S1, F);
        const r2 = SC.roads.findPath(S1, C);
        assert('Dijkstra prefers the shorter route', r2.path.length === 3 && approx(r2.dist, Math.hypot(300, 100) + 300));
    })();

    // ── Order planning ──────────────────────────────
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.roads.build(S1, F);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        const order = SC.economy.spawnOrder();
        assert('spawned order is craftable bread x1', order && order.product === 'bread' && order.qty === 1);
        assert('planning succeeds with full route', SC.economy.planOrder(order) && order.factory === F);
        assert('one craft task queued', F.queue.length === 1);
        assert('two raw haul jobs created', SC.state.jobs.length === 2 &&
            SC.state.jobs.every(j => j.type === 'raw' && j.drop === F));

        // Unplanned when disconnected
        SC.newState(); SC.map._resetSeq();
        SC.state.river = { spine: [{ x: 1100, y: 0 }, { x: 1100, y: SC.CONFIG.WORLD_H }], halfWidths: [40, 40] };
        const A = SC.map.makeNode('city', 700, 200, { active: true });
        SC.map.makeNode('supplier', 100, 100, { active: true, mat: 'wheat' });
        SC.map.makeNode('supplier', 100, 300, { active: true, mat: 'water' });
        SC.map.makeNode('factory', 400, 200, { active: true, recipe: 'bread' });
        const o2 = SC.economy.spawnOrder();
        assert('no-route order flagged', !SC.economy.planOrder(o2) && o2.noRoute);
    })();

    // ── Full haul cycle: raws -> craft -> delivery -> payout ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.roads.build(S1, F);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        SC.vehicles.addTruck(F);
        SC.vehicles.addTruck(F);
        const order = SC.economy.spawnOrder();
        SC.economy.planOrder(order);

        const before = SC.state.money;
        for (let i = 0; i < 3000 && SC.state.orders.length; i++) {
            SC.vehicles.tick(0.1);
            SC.factories.tick(0.1);
        }
        assert('order fully delivered', SC.state.delivered === 1 && SC.state.orders.length === 0);
        assert('payout received', SC.state.money === before + order.payout);
        assert('factory queue drained', F.queue.length === 0 && !F.crafting);
        // A truck may still be travelling back to its home yard right after
        // its last delivery — give that a little time to finish before
        // checking full idleness (no job, no path, no cargo, parked home).
        for (let i = 0; i < 500; i++) SC.vehicles.tick(0.1);
        assert('trucks idle and parked at their home yard', SC.state.trucks.every(t =>
            !t.jobs.length && !t.path && !t.cargo.length && t.node === t.homeYard));
    })();

    // ── Expiry cancels work ─────────────────────────
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.roads.build(S1, F);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        const order = SC.economy.spawnOrder();
        SC.economy.planOrder(order);
        SC.economy.expireOrder(order);
        assert('expiry removes order and counts a miss', SC.state.orders.length === 0 && SC.state.missed === 1);
        assert('expiry cancels pending jobs', SC.state.jobs.length === 0);
        assert('expiry clears factory queue', F.queue.length === 0);
    })();

    // ── Economy: upgrades & truck prices ────────────
    (function() {
        fixture();
        SC.state.money = 100000;
        const p0 = SC.upgradePrice('truckSpeed');
        const s0 = SC.truckSpeed();
        const res = SC.economy.buyUpgrade('truckSpeed');
        assert('upgrade purchase levels up and charges', res.ok &&
            SC.state.upgrades.truckSpeed === 1 && SC.state.money === 100000 - p0);
        assert('truck speed increased', SC.truckSpeed() > s0);
        SC.state.upgrades.truckSpeed = SC.CONFIG.UPGRADES.truckSpeed.max;
        assert('maxed upgrade rejected', SC.upgradePrice('truckSpeed') === null &&
            !SC.economy.buyUpgrade('truckSpeed').ok);
        // Truck prices ladder per yard: growth tracks trucks homed at the
        // active yard, and a fresh yard resets the ladder to base price.
        const hq = SC.state.nodes.find(n => n.isHQ);
        SC.state.activeYard = hq;
        const t0 = SC.truckPrice();
        assert('first truck at a yard costs base price', t0 === SC.CONFIG.TRUCK_PRICE);
        SC.vehicles.addTruck(hq, hq);
        SC.vehicles.addTruck(hq, hq);
        assert('truck price grows with trucks at the active yard', SC.truckPrice() > t0);
        const yard = SC.map.makeNode('yard', 900, 900, { active: true });
        SC.state.activeYard = yard;
        assert('a new yard resets the truck price ladder', SC.truckPrice() === SC.CONFIG.TRUCK_PRICE);
    })();

    // ── Truck capacity: base, upgrade effect, bundling, partial cancel ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        assert('base truck capacity is 1', SC.truckCapacity() === 1);
        SC.economy.buyUpgrade('truckCapacity');
        assert('capacity upgrade raises capacity by the configured boost',
            SC.truckCapacity() === 1 + SC.CONFIG.UPGRADES.truckCapacity.boost);

        SC.roads.build(S1, F);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        SC.state.upgrades.truckCapacity = SC.CONFIG.UPGRADES.truckCapacity.max; // capacity 4
        const truck = SC.vehicles.addTruck(S1);

        // Three separate raw jobs, same pickup+drop: one truck should
        // scoop up all three in a single bundle (capacity allows it).
        const order = { id: 99, city: C, product: 'bread', qty: 3, deliveredUnits: 0,
                         payout: 300, deadline: 100, deadlineTotal: 100,
                         planned: true, noRoute: false, done: false };
        for (let i = 0; i < 3; i++) {
            SC.vehicles.addJob({ type: 'raw', item: 'wheat', pickup: S1, drop: F, order, task: null });
        }
        SC.vehicles.dispatch();
        assert('one truck bundles multiple same-route jobs up to capacity',
            truck.jobs.length === 3 && SC.state.jobs.length === 0);

        // A fourth, different-route job stays queued — bundling only
        // pools jobs sharing the exact same pickup and drop.
        SC.vehicles.addJob({ type: 'raw', item: 'water', pickup: S2, drop: F, order, task: null });
        const truck2 = SC.vehicles.addTruck(S2);
        SC.vehicles.dispatch();
        assert('a different pickup/drop job does not join the first bundle',
            truck.jobs.length === 3 && truck2.jobs.length === 1);

        // Cancelling one order's jobs trims the bundle without aborting
        // jobs from a different order sharing the same route. Start the
        // truck away from the pickup so it's still mid-transit ('toPickup')
        // when we cancel — a same-node pickup would complete instantly.
        const order2 = { id: 100, city: C, product: 'bread', qty: 1, deliveredUnits: 0,
                          payout: 100, deadline: 100, deadlineTotal: 100,
                          planned: true, noRoute: false, done: false };
        const mixedTruck = SC.vehicles.addTruck(F);
        SC.vehicles.addJob({ type: 'raw', item: 'wheat', pickup: S1, drop: F, order, task: null });
        SC.vehicles.addJob({ type: 'raw', item: 'wheat', pickup: S1, drop: F, order: order2, task: null });
        SC.vehicles.dispatch();
        assert('mixed-order bundle formed', mixedTruck.jobs.length === 2);
        assert('truck still travelling toward pickup', mixedTruck.phase === 'toPickup' && !!mixedTruck.path);
        SC.vehicles.cancelJobsForOrder(order2);
        assert('cancelling one order only removes its job from the bundle',
            mixedTruck.jobs.length === 1 && mixedTruck.jobs[0].order === order);
        assert('truck with a remaining job keeps hauling', mixedTruck.phase === 'toPickup');

        SC.vehicles.cancelJobsForOrder(order);
        assert('cancelling the last job in a bundle idles the truck',
            mixedTruck.jobs.length === 0 && mixedTruck.phase === null);
    })();

    // ── Truck capacity: multi-unit haul delivers correctly end-to-end ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.state.upgrades.truckCapacity = SC.CONFIG.UPGRADES.truckCapacity.max;
        SC.roads.build(S1, F);
        SC.roads.build(S2, F);
        SC.roads.build(F, C);
        SC.vehicles.addTruck(F);
        SC.vehicles.addTruck(F);

        const order = SC.economy.spawnOrder();
        order.qty = 3;
        SC.economy.planOrder(order);

        const before = SC.state.money;
        for (let i = 0; i < 4000 && SC.state.orders.length; i++) {
            SC.vehicles.tick(0.1);
            SC.factories.tick(0.1);
        }
        assert('multi-unit order delivered with capacity upgrade active',
            SC.state.delivered === 1 && SC.state.money === before + order.payout);
        assert('no leftover jobs or cargo after the run', SC.state.jobs.length === 0 &&
            SC.state.trucks.every(t => !t.jobs.length && t.cargo.length === 0));
    })();

    // ── Truck yards: pricing, HQ as default, isYard ─────
    (function() {
        fixture();
        assert('HQ counts as a yard even without a yard node',
            SC.isYard(SC.state.nodes.find(n => n.isHQ)));
        assert('a plain city is not a yard', !SC.isYard(SC.state.nodes.find(n => n.kind === 'city' && !n.isHQ) || { kind: 'city' }));
        assert('yard price grows with yards bought', (function() {
            const p0 = SC.yardPrice();
            SC.state.yardsBought = 2;
            return SC.yardPrice() > p0;
        })());
    })();

    // ── Truck yards: placement (not research-gated), activeYard, buyTruck ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.state.activeYard = C; // HQ

        assert('yard placement works without any research done',
            !SC.research.isDone('manualPlacement'));
        const before = SC.state.money;
        const price = SC.yardPrice();
        const res = SC.placement.place('yard', null, 900, 900);
        assert('yard placed on open land and charged the growing price',
            res.ok && res.node.kind === 'yard' && SC.state.money === before - price);
        assert('yardsBought incremented', SC.state.yardsBought === 1);
        assert('a second yard now costs more', SC.yardPrice() > price);
        assert('new yard is itself a yard', SC.isYard(res.node));

        SC.state.activeYard = res.node;
        const truckBefore = SC.state.trucks.length;
        const tRes = SC.vehicles.buyTruck();
        assert('bought truck stations at the active yard',
            tRes.ok && tRes.truck.homeYard === res.node && tRes.truck.node === res.node);
        assert('trucks list grew by one', SC.state.trucks.length === truckBefore + 1);

        SC.state.activeYard = null;
        const tRes2 = SC.vehicles.buyTruck();
        assert('a null/invalid active yard falls back to HQ',
            tRes2.ok && tRes2.truck.homeYard.isHQ);
    })();

    // ── Truck yards: idle trucks return home, dispatch favors home region ──
    (function() {
        SC.newState();
        SC.map._resetSeq();
        SC.state.river = { spine: [{ x: 2100, y: 0 }, { x: 2100, y: SC.CONFIG.WORLD_H }], halfWidths: [10, 10] };
        const hq = SC.map.makeNode('city', 0, 0, { active: true, isHQ: true });
        const yard = SC.map.makeNode('yard', 1000, 0, { active: true });
        const supplierNearYard = SC.map.makeNode('supplier', 1000, 200, { active: true, mat: 'wheat' });
        const factory = SC.map.makeNode('factory', 1000, 400, { active: true, recipe: 'bread' });
        SC.state.money = 100000;
        SC.roads.build(hq, yard);
        SC.roads.build(yard, supplierNearYard);
        SC.roads.build(supplierNearYard, factory);

        // A truck idling at HQ (far from the job) vs one already at the
        // yard (right next to it) — dispatch should favor the nearer one.
        const farTruck = SC.vehicles.addTruck(hq, hq);
        const nearTruck = SC.vehicles.addTruck(yard, yard);
        SC.vehicles.addJob({ type: 'raw', item: 'wheat', pickup: supplierNearYard, drop: factory, order: null, task: null });
        SC.vehicles.dispatch();
        assert('dispatch picks the truck already near its yard over the far one',
            nearTruck.jobs.length === 1 && farTruck.jobs.length === 0);

        // An idle truck away from its yard heads back when there's no work.
        const wanderer = SC.vehicles.addTruck(factory, yard); // parked far from home
        SC.vehicles.dispatch();
        assert('idle truck with no work heads toward its home yard',
            wanderer.phase === 'returning' && !!wanderer.path);
        for (let i = 0; i < 200 && wanderer.path; i++) SC.vehicles.tick(0.1);
        assert('truck eventually arrives at its home yard',
            !wanderer.path && wanderer.node === yard);

        // Already-home trucks don't get sent anywhere.
        const settled = SC.vehicles.addTruck(hq, hq);
        SC.vehicles.dispatch();
        assert('a truck already at its home yard stays put', !settled.path && settled.phase === null);
    })();

    // ── Save keeps yards, activeYard, and per-truck homeYard ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        SC.roads.build(S1, F);
        const yard = SC.placement.place('yard', null, 900, 900).node;
        SC.roads.build(C, yard);
        SC.state.activeYard = yard;
        const truck = SC.vehicles.addTruck(yard, yard);

        const data = SC.save.serialize();
        SC.save.restore(data);
        const st = SC.state;
        assert('yardsBought survives restore', st.yardsBought === 1);
        const restoredYard = st.nodes.find(n => n.kind === 'yard');
        assert('yard node restored', !!restoredYard);
        assert('activeYard restored to the yard node', st.activeYard === restoredYard);
        const restoredTruck = st.trucks.find(t => t.homeYard === restoredYard);
        assert('truck homeYard restored to the yard node', !!restoredTruck);
    })();

    // ── Camera math ─────────────────────────────────
    (function() {
        SC.newState();
        SC.camera.setViewport(1200, 800);
        SC.camera.fitWorld();
        const w = SC.camera.toWorld(600, 400);
        const s = SC.camera.toScreen(w.x, w.y);
        assert('toScreen inverts toWorld', approx(s.x, 600, 0.01) && approx(s.y, 400, 0.01));
        const anchor = SC.camera.toWorld(300, 200);
        SC.camera.zoomAt(300, 200, 1.5);
        const after = SC.camera.toWorld(300, 200);
        assert('zoomAt keeps anchor point fixed', approx(anchor.x, after.x, 0.5) && approx(anchor.y, after.y, 0.5));
        SC.camera.pan(-10000, -10000);
        const cam = SC.camera.cam;
        assert('pan clamps to world bounds', cam.x <= SC.CONFIG.WORLD_W + 120 && cam.y <= SC.CONFIG.WORLD_H + 120);
    })();

    // ── Generated world sanity ──────────────────────
    (function() {
        SC.newState();
        SC.map._resetSeq();
        SC.map.generateWorld();
        const active = SC.state.nodes.filter(n => n.active);
        assert('starter cluster: HQ, bakery, wheat+water suppliers', (function() {
            return active.some(n => n.isHQ) &&
                   active.some(n => n.kind === 'factory' && !n.forSale && n.recipe === 'bread') &&
                   active.some(n => n.mat === 'wheat') &&
                   active.some(n => n.mat === 'water');
        })());
        assert('no node spawned in the river', SC.state.nodes.every(n => !SC.map.isInRiver(n.x, n.y)));
        assert('locked pool exists for milestones', SC.state.nodes.some(n => !n.active));
        assert('HQ is the only active order-taking city at start',
            active.filter(n => n.kind === 'city').length === 1 && active.find(n => n.kind === 'city').isHQ);
        assert('locked pool still holds customer DCs for later', SC.state.nodes.some(n => n.kind === 'city' && !n.active));
        const n1 = SC.map.unlockNext();
        assert('unlockNext (no filter) activates a site', n1 && n1.active);
        assert('starter products craftable', SC.economy.craftableProducts().includes('bread'));
    })();

    // ── Seeded RNG: deterministic stream, independent of global state ──
    (function() {
        const a = SC.rng.create('daily-2026-07-16');
        const b = SC.rng.create('daily-2026-07-16');
        const seqA = [a.next(), a.next(), a.next()];
        const seqB = [b.next(), b.next(), b.next()];
        assert('same seed produces the same sequence', seqA.every((v, i) => v === seqB[i]));

        const c = SC.rng.create('a-completely-different-seed');
        assert('a different seed produces a different sequence',
            c.next() !== SC.rng.create('daily-2026-07-16').next());

        assert('next() stays in [0, 1)', seqA.every(v => v >= 0 && v < 1));
        const r = SC.rng.create('range-test');
        for (let i = 0; i < 20; i++) {
            const v = r.range(5, 10);
            assert('range() stays within bounds', v >= 5 && v < 10);
        }
        const ri = SC.rng.create('int-test');
        for (let i = 0; i < 20; i++) {
            const v = ri.int(1, 3);
            assert('int() is an integer within inclusive bounds',
                Number.isInteger(v) && v >= 1 && v <= 3);
        }
        assert('randomSeed produces a non-empty string', typeof SC.rng.randomSeed() === 'string' &&
            SC.rng.randomSeed().length > 0);
    })();

    // ── Seeded worlds: same seed -> identical map, different -> different ──
    (function() {
        SC.newState(); SC.map._resetSeq();
        SC.map.generateWorld('shared-map-42');
        const seedA = SC.state.seed;
        const nodesA = SC.state.nodes.map(n => ({ kind: n.kind, x: n.x, y: n.y, mat: n.mat, recipe: n.recipe }));
        const riverA = JSON.stringify(SC.state.river);

        SC.newState(); SC.map._resetSeq();
        SC.map.generateWorld('shared-map-42');
        const nodesB = SC.state.nodes.map(n => ({ kind: n.kind, x: n.x, y: n.y, mat: n.mat, recipe: n.recipe }));
        const riverB = JSON.stringify(SC.state.river);

        assert('generateWorld records the seed used', seedA === 'shared-map-42');
        assert('same seed reproduces an identical river', riverA === riverB);
        assert('same seed reproduces an identical node layout',
            nodesA.length === nodesB.length &&
            nodesA.every((n, i) => JSON.stringify(n) === JSON.stringify(nodesB[i])));

        SC.newState(); SC.map._resetSeq();
        SC.map.generateWorld('a-totally-different-seed');
        const nodesC = SC.state.nodes.map(n => ({ x: n.x, y: n.y }));
        assert('a different seed produces a different layout',
            JSON.stringify(nodesC) !== JSON.stringify(nodesA.map(n => ({ x: n.x, y: n.y }))));

        SC.newState(); SC.map._resetSeq();
        SC.map.generateWorld(); // no seed -> random
        assert('an unseeded world still records a (random) seed',
            typeof SC.state.seed === 'string' && SC.state.seed.length > 0);
    })();

    // ── Save round-trip: seed survives ──────────────
    (function() {
        SC.newState(); SC.map._resetSeq();
        SC.map.generateWorld('save-me-42');

        SC.vehicles.dispatch();
        assert('truck at a dry supplier waits in the loading phase', truck.phase === 'loading');
        assert('loading truck is not counted as idle for dispatch', truck.jobs.length === 1);

        // Regen refills the stock; the waiting truck then loads and departs
        for (let i = 0; i < 100 && truck.phase === 'loading'; i++) {
            SC.economy.tickSuppliers(0.1);
            SC.vehicles.tick(0.1);
        }
        assert('truck departs once regen catches up', truck.phase === 'toDrop' || truck.phase === null);
        assert('the loaded unit was taken from stock', S1.stock < 1);
    })();

    // ── Supplier upgrades: price ladder, cap/regen boost, max level ──
    (function() {
        const { S1 } = fixture();
        SC.state.money = 100000;
        const p0 = SC.supplierUpgradePrice(S1);
        assert('level-0 upgrade costs the base price', p0 === SC.CONFIG.SUPPLIER_UPGRADE_BASE);
        const cap0 = SC.supplierCap(S1), regen0 = SC.supplierRegen(S1);
        const res = SC.economy.upgradeSupplier(S1);
        assert('upgrade charges and levels the supplier',
            res.ok && S1.level === 1 && SC.state.money === 100000 - p0);
        assert('upgrade raises cap and regen',
            SC.supplierCap(S1) > cap0 && SC.supplierRegen(S1) > regen0);
        assert('next level costs more', SC.supplierUpgradePrice(S1) > p0);
        S1.level = SC.CONFIG.SUPPLIER_MAX_LEVEL;
        assert('maxed supplier cannot upgrade further',
            SC.supplierUpgradePrice(S1) === null && !SC.economy.upgradeSupplier(S1).ok);
        assert('cities cannot be supplier-upgraded',
            !SC.economy.upgradeSupplier(SC.state.nodes.find(n => n.kind === 'city')).ok);

        // Fertilizer research boosts every supplier's regen globally
        const r0 = SC.supplierRegen(S1);
        SC.state.research.completed.fertilizer = true;
        assert('fertilizer research boosts supplier regen',
            approx(SC.supplierRegen(S1), r0 * (1 + SC.RESEARCH.fertilizer.supplierRegenBonus), 0.001));
    })();

    // ── Road upgrades: research gate, cost, routing and truck speed ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        const e1 = SC.roads.build(S1, F).edge;
        assert('road upgrade locked before pavedRoads research',
            SC.roads.upgradeQuote(e1) === null && !SC.roads.upgrade(e1).ok);

        SC.state.research.completed.pavedRoads = true;
        const q = SC.roads.upgradeQuote(e1);
        assert('upgrade quote scales with length',
            q && q.cost === Math.round(e1.len * SC.CONFIG.ROAD_UPGRADE_PER_UNIT));
        const m0 = SC.state.money;
        assert('upgrade charges and marks the edge a highway',
            SC.roads.upgrade(e1).ok && e1.level === 1 && SC.state.money === m0 - q.cost);
        assert('an edge cannot be upgraded twice', SC.roads.upgradeQuote(e1) === null);

        // Dijkstra weighs highways by travel time, so a paved detour of
        // equal length beats the unpaved one.
        assert('pathfinding dist shrinks on a highway',
            approx(SC.roads.pathDist(S1, F), e1.len / SC.CONFIG.HIGHWAY_SPEED_MULT, 0.01));

        // A truck physically crosses a highway edge faster than an
        // identical-length normal one: count ticks to finish each leg.
        const e2 = SC.roads.build(S2, F).edge; // same 316.23u length as S1->F, unpaved
        function ticksToTraverse(from, to) {
            const truck = SC.vehicles.addTruck(from);
            truck.phase = 'returning'; // plain travel, no pickup/drop logic
            truck.path = SC.roads.findPath(from, to).path;
            truck.pathIdx = 0; truck.progress = 0;
            let n = 0;
            while (truck.path && n < 1000) { SC.vehicles.tick(0.05); n++; }
            SC.state.trucks.pop();
            return n;
        }
        const hwyTicks = ticksToTraverse(S1, F); // paved leg
        const stdTicks = ticksToTraverse(S2, F); // unpaved leg
        assert('truck crosses a highway edge faster than a normal one',
            hwyTicks < stdTicks && approx(stdTicks / hwyTicks, SC.CONFIG.HIGHWAY_SPEED_MULT, 0.2));
    })();

    // ── Research-gated upgrade caps (Overdrive / Automation) ──
    (function() {
        fixture();
        SC.state.money = 100000;
        SC.state.upgrades.truckSpeed = SC.CONFIG.UPGRADES.truckSpeed.max;
        assert('truckSpeed capped at config max without research',
            SC.upgradePrice('truckSpeed') === null);
        SC.state.research.completed.overdrive = true;
        assert('overdrive research raises the truckSpeed cap',
            SC.upgradeMax('truckSpeed') === SC.CONFIG.UPGRADES.truckSpeed.max + 3 &&
            SC.upgradePrice('truckSpeed') !== null);
        assert('buying past the old cap works once researched',
            SC.economy.buyUpgrade('truckSpeed').ok &&
            SC.state.upgrades.truckSpeed === SC.CONFIG.UPGRADES.truckSpeed.max + 1);
        assert('factorySpeed cap untouched by overdrive',
            SC.upgradeMax('factorySpeed') === SC.CONFIG.UPGRADES.factorySpeed.max);
    })();

    // ── Deeper chains pay a value premium ───────────
    (function() {
        // A world where ONLY robots (depth 3) are craftable: the spawned
        // order's payout must include the 1.5× depth premium on top of
        // base value (robot city sits right next to the factory, so the
        // distance term stays small).
        SC.newState(); SC.map._resetSeq();
        SC.state.river = { spine: [{ x: 2100, y: 0 }, { x: 2100, y: SC.CONFIG.WORLD_H }], halfWidths: [10, 10] };
        const city = SC.map.makeNode('city', 100, 100, { active: true, isHQ: true });
        SC.map.makeNode('factory', 150, 100, { active: true, recipe: 'robot' });
        SC.map.makeNode('factory', 300, 100, { active: true, recipe: 'circuit' });
        SC.map.makeNode('factory', 450, 100, { active: true, recipe: 'wire' });
        SC.map.makeNode('factory', 600, 100, { active: true, recipe: 'steel' });
        for (const mat of ['copper', 'rubber', 'chips', 'ore', 'coal']) {
            SC.map.makeNode('supplier', 700 + Math.random() * 100, 300, { active: true, mat });
        }
        const o = SC.economy.spawnOrder();
        const mult = 1 + SC.CONFIG.ORDER_DEPTH_VALUE * (SC.depthOf('robot') - 1);
        assert('only robots are orderable in this world', o && o.product === 'robot');
        assert('depth premium applied to the payout',
            o.payout >= SC.GOODS.robot.value * mult); // 900 * 1.5 = 1350 minimum
    })();

    // ── Save round-trip: supplier stock/levels + highway edges ──
    (function() {
        const { S1, F } = fixture();
        SC.state.money = 100000;
        const edge = SC.roads.build(S1, F).edge;
        SC.state.research.completed.pavedRoads = true;
        SC.roads.upgrade(edge);
        SC.economy.upgradeSupplier(S1);
        S1.stock = 3.5;

        SC.save.restore(SC.save.serialize());
        const rS1 = SC.state.nodes.find(n => n.kind === 'supplier' && n.mat === 'wheat');
        assert('supplier level survives a round-trip', rS1.level === 1);
        assert('supplier stock survives a round-trip', approx(rS1.stock, 3.5, 0.001));
        assert('highway level survives a round-trip', SC.state.edges[0].level === 1);
    })();

    // ── Premium Contracts / Preservatives: payout & deadline bonuses ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        // F(400,200) -> C(700,200) = 300u: payout is fully deterministic
        const o1 = SC.economy.spawnOrder();
        const base = Math.round((SC.GOODS.bread.value + SC.CONFIG.ORDER_DIST_PAY * 300) / 5) * 5;
        assert('baseline bread payout matches the formula', o1.payout === base);

        SC.state.research.completed.premiumContracts = true;
        const o2 = SC.economy.spawnOrder();
        const boosted = Math.round(((SC.GOODS.bread.value + SC.CONFIG.ORDER_DIST_PAY * 300) * 1.15) / 5) * 5;
        assert('premium contracts boost payouts by 15%', o2.payout === boosted && o2.payout > o1.payout);

        const dm = SC.diff().deadlineMult; // Normal = 0.8 (20% tighter than base)
        assert('baseline deadline is the config range scaled by difficulty',
            o1.deadline >= SC.CONFIG.ORDER_DEADLINE[0] * dm && o1.deadline <= SC.CONFIG.ORDER_DEADLINE[1] * dm);
        assert('normal difficulty tightens deadlines by 20%', dm === 0.8);
        SC.state.research.completed.coldStorage = true;
        const o3 = SC.economy.spawnOrder();
        assert('preservatives stretch deadlines by 25%',
            o3.deadline >= SC.CONFIG.ORDER_DEADLINE[0] * dm * 1.25 &&
            o3.deadline <= SC.CONFIG.ORDER_DEADLINE[1] * dm * 1.25);
    })();

    // ── Regional Marketing / Bulk Logistics research effects ──
    (function() {
        fixture();
        assert('customer spawn multiplier is 1 with no research', SC.research.customerSpawnMult() === 1);
        SC.state.research.completed.rapidExpansion = true;
        assert('regional marketing shortens customer spawn intervals',
            approx(SC.research.customerSpawnMult(), SC.RESEARCH.rapidExpansion.customerSpawnMult));

        SC.state.upgrades.truckCapacity = SC.CONFIG.UPGRADES.truckCapacity.max;
        assert('truckCapacity capped without bulk logistics', SC.upgradePrice('truckCapacity') === null);
        SC.state.research.completed.bulkLogistics = true;
        assert('bulk logistics raises the capacity cap by 2',
            SC.upgradeMax('truckCapacity') === SC.CONFIG.UPGRADES.truckCapacity.max + 2 &&
            SC.upgradePrice('truckCapacity') !== null);
    })();

    // ── Order cap scales with the customer network ──
    (function() {
        fixture(); // one active city (HQ)
        assert('order cap is the base with only HQ active',
            SC.economy.maxActiveOrders() === SC.CONFIG.ORDER_MAX_ACTIVE);
        SC.map.makeNode('city', 900, 900, { active: true });
        SC.map.makeNode('city', 1500, 300, { active: true });
        assert('each extra active DC raises the order cap',
            SC.economy.maxActiveOrders() === SC.CONFIG.ORDER_MAX_ACTIVE + 2 * SC.CONFIG.ORDER_PER_CITY);
        assert('inactive cities do not count', (function() {
            SC.map.makeNode('city', 1800, 900, { active: false });
            return SC.economy.maxActiveOrders() === SC.CONFIG.ORDER_MAX_ACTIVE + 2 * SC.CONFIG.ORDER_PER_CITY;
        })());
    })();

    // ── Truck reassignment: idle trucks re-home between yards ──
    (function() {
        const { S1, F, C } = fixture(); // C is HQ
        SC.state.money = 100000;
        const yard = SC.map.makeNode('yard', 900, 900, { active: true });
        const t1 = SC.vehicles.addTruck(C, C);
        const t2 = SC.vehicles.addTruck(C, C);

        const res = SC.vehicles.reassignTruck(yard);
        assert('an idle truck re-homes to the target yard',
            res.ok && res.truck.homeYard === yard);
        assert('other trucks keep their home', [t1, t2].filter(t => t.homeYard === C).length === 1);

        // Busy trucks are not eligible
        SC.roads.build(S1, F);
        const busy = [t1, t2].find(t => t.homeYard === C);
        busy.jobs = [{ type: 'raw', item: 'wheat', pickup: S1, drop: F, order: null, task: null }];
        busy.phase = 'toPickup';
        const res2 = SC.vehicles.reassignTruck(C); // pull one back to HQ
        assert('a truck with jobs is not eligible to move',
            res2.ok === true ? res2.truck !== busy : true);
        const res3 = SC.vehicles.reassignTruck(SC.map.makeNode('city', 1900, 1200, { active: true }));
        assert('reassigning to a non-yard is rejected', !res3.ok && res3.reason === 'invalid');
    })();

    // ── Promotions: research gate, cost, faster orders, expiry ──
    (function() {
        const { S1, S2, F, C } = fixture();
        SC.state.money = 100000;
        assert('promotion locked without the research',
            !SC.economy.startPromotion().ok && SC.economy.startPromotion().reason === 'locked');

        SC.state.research.completed.promotions = true;
        const m0 = SC.state.money;
        const res = SC.economy.startPromotion();
        assert('promotion charges its cost and activates',
            res.ok && SC.state.money === m0 - SC.CONFIG.PROMO_COST && SC.economy.isPromoActive());
        assert('a second promotion cannot overlap',
            !SC.economy.startPromotion().ok && SC.economy.startPromotion().reason === 'active');
        assert('promo raises the concurrent-order cap',
            SC.economy.maxActiveOrders() === SC.CONFIG.ORDER_MAX_ACTIVE + SC.CONFIG.PROMO_ORDER_CAP_BONUS);

        // The clock toward the next order runs ~1/PROMO_ORDER_MULT faster
        SC.state.orders.length = 0;
        SC.state.nextOrderIn = 10;
        SC.economy.tick(1);
        assert('order clock ticks faster during a promotion',
            approx(SC.state.nextOrderIn, 10 - 1 / SC.CONFIG.PROMO_ORDER_MULT, 0.01));

        SC.state.time += SC.CONFIG.PROMO_DURATION + 1;
        assert('promotion expires after its duration',
            !SC.economy.isPromoActive() && SC.economy.promoTimeLeft() === 0);
        assert('a new promotion can start after expiry', SC.economy.startPromotion().ok);
    })();

    // ── Default fail state: countdown, recovery, foreclosure ──
    (function() {
        fixture();
        let over = null, warned = false, recovered = false;
        SC.on('gameOver', d => { over = d; });
        SC.on('debtWarning', () => { warned = true; });
        SC.on('debtRecovered', () => { recovered = true; });

        SC.state.money = -(SC.creditLimit() + 200); // beyond the limit
        SC.economy.tick(0.1);
        assert('crossing the limit starts the default countdown',
            warned && SC.state.defaultIn !== null && SC.state.defaultIn <= SC.diff().defaultGrace);

        // Paying the debt back down clears the countdown
        SC.state.money = -100;
        SC.economy.tick(0.1);
        assert('recovering above the limit clears the countdown',
            recovered && SC.state.defaultIn === null && !SC.state.gameOver);

        // Sink again and let the clock run out
        SC.state.money = -(SC.creditLimit() + 200);
        for (let i = 0; i < 2000 && !SC.state.gameOver; i++) SC.economy.tick(0.1);
        assert('running out the grace period forecloses the run',
            SC.state.gameOver && over && over.debt > SC.creditLimit());
    })();

    // ── Difficulty presets: interest, deadlines, sandbox no-fail ──
    (function() {
        SC.newState('easy');
        assert('easy keeps the classic 10%/min rate and full deadlines',
            SC.diff().interestPerMin === 0.10 && SC.diff().deadlineMult === 1.0 &&
            SC.state.money === SC.DIFFICULTIES.easy.startMoney);

        SC.newState('hard');
        assert('hard raises interest and tightens deadlines further',
            SC.diff().interestPerMin > 0.15 && SC.diff().deadlineMult < 0.8);

        SC.newState('bogus');
        assert('unknown difficulty falls back to normal', SC.state.difficulty === 'normal');

        // Sandbox: no interest, never forecloses
        fixture();
        SC.state.difficulty = 'sandbox';
        SC.state.money = -(SC.creditLimit() + 500);
        SC.state.interestPaid = 0;
        for (let i = 0; i < 1500; i++) SC.economy.tick(0.1); // 150s, past any grace
        assert('sandbox charges no interest', SC.state.interestPaid === 0);
        assert('sandbox never defaults',
            !SC.state.gameOver && SC.state.defaultIn === null);
    })();

    // ── Save round-trip: difficulty, promo timer, default countdown ──
    (function() {
        SC.newState('hard');
        SC.map._resetSeq();
        SC.state.river = { spine: [{ x: 1100, y: 0 }, { x: 1100, y: SC.CONFIG.WORLD_H }], halfWidths: [40, 40] };
        SC.map.makeNode('city', 700, 200, { active: true, isHQ: true });
        SC.state.promoUntil = 123;
        SC.state.defaultIn = 17.5;

        SC.save.restore(SC.save.serialize());
        assert('difficulty survives a round-trip', SC.state.difficulty === 'hard');
        assert('promo timer survives a round-trip', SC.state.promoUntil === 123);
        assert('default countdown survives a round-trip (no reload cheese)',
            approx(SC.state.defaultIn, 17.5));
    })();

    document.getElementById('summary').textContent = `${passed} passed / ${failed} failed`;
    document.getElementById('summary').className = failed ? 'fail' : 'pass';
    </script>
</body>
</html>
