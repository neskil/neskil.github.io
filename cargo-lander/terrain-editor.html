<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terrain Editor — Cargo Lander</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #0d1117; color: #e6edf3; display: flex; height: 100vh; overflow: hidden; }

#sidebar {
  width: 320px; min-width: 320px; background: #161b22; border-right: 1px solid #30363d;
  display: flex; flex-direction: column; overflow: hidden;
}
#sidebar-top { padding: 12px; border-bottom: 1px solid #30363d; }
#sidebar-top h1 { font-size: 13px; font-weight: 600; color: #58a6ff; margin-bottom: 8px; }

textarea#input {
  width: 100%; height: 120px; background: #0d1117; color: #e6edf3;
  border: 1px solid #30363d; border-radius: 4px; padding: 8px;
  font-family: monospace; font-size: 11px; resize: none;
}
textarea#input:focus { outline: none; border-color: #58a6ff; }

.btn {
  display: inline-block; padding: 5px 12px; font-family: monospace; font-size: 12px;
  background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px;
  cursor: pointer; user-select: none;
}
.btn:hover { background: #30363d; }
.btn.primary { background: #1f6feb; border-color: #1f6feb; }
.btn.primary:hover { background: #388bfd; }
.btn.danger { color: #f85149; border-color: #f85149; }
.btn.danger:hover { background: #3d1a1a; }

#poly-list { flex: 1; overflow-y: auto; padding: 8px; }
.poly-item {
  padding: 6px 8px; border-radius: 4px; cursor: pointer;
  border: 1px solid transparent; margin-bottom: 4px; font-size: 12px;
}
.poly-item:hover { background: #21262d; }
.poly-item.active { background: #1c2d3f; border-color: #58a6ff; }
.poly-header { display: flex; justify-content: space-between; align-items: center; }
.poly-name { font-weight: 600; }
.poly-count { font-size: 11px; color: #8b949e; }

#point-panel { padding: 8px; border-top: 1px solid #30363d; min-height: 0; }
#point-panel h3 { font-size: 11px; color: #8b949e; margin-bottom: 6px; }
.point-row {
  display: flex; align-items: center; gap: 4px; padding: 3px 0;
  font-size: 11px; cursor: pointer; border-radius: 3px; padding: 3px 4px;
}
.point-row:hover { background: #21262d; }
.point-row.selected { background: #1c2d3f; }
.point-idx { color: #8b949e; width: 22px; }
.point-coord { flex: 1; }
.point-coord input {
  width: 52px; background: #0d1117; color: #e6edf3; border: 1px solid #30363d;
  border-radius: 3px; padding: 1px 4px; font-family: monospace; font-size: 11px;
}
.point-coord input:focus { outline: none; border-color: #58a6ff; }
.point-del { color: #6e7681; cursor: pointer; font-size: 14px; line-height: 1; }
.point-del:hover { color: #f85149; }

#point-list-wrap { max-height: 180px; overflow-y: auto; }

#toolbar { padding: 8px; border-top: 1px solid #30363d; display: flex; flex-wrap: wrap; gap: 4px; }

#output-area { padding: 8px; border-top: 1px solid #30363d; }
#output-area textarea {
  width: 100%; height: 80px; background: #0d1117; color: #a5d6ff;
  border: 1px solid #30363d; border-radius: 4px; padding: 6px;
  font-family: monospace; font-size: 10px; resize: none;
}

#canvas-wrap { flex: 1; position: relative; overflow: hidden; }
canvas#main { display: block; cursor: crosshair; }

#coords { position: absolute; bottom: 8px; right: 8px; font-size: 11px; color: #8b949e; pointer-events: none; }
#hint { position: absolute; top: 8px; left: 8px; font-size: 11px; color: #8b949e; pointer-events: none; background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 4px; }

.color-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-top">
    <h1>Terrain Editor</h1>
    <textarea id="input" placeholder="Paste level JS here (full registerLevel({...}) or just the terrainPolygons: [...] block)&#10;&#10;Then click Load →"></textarea>
    <div style="display:flex;gap:4px;margin-top:6px;">
      <button class="btn primary" onclick="loadInput()">Load</button>
      <button class="btn" onclick="fitView()">Fit view</button>
      <button class="btn" onclick="addPolygon()">+ poly</button>
    </div>
  </div>

  <div id="poly-list"></div>

  <div id="point-panel" style="display:none;">
    <h3>Points — <span id="poly-label"></span> <button class="btn danger" style="padding:2px 7px;font-size:10px;" onclick="deletePolygon()">delete poly</button></h3>
    <div id="point-list-wrap"><div id="point-list"></div></div>
    <div style="margin-top:6px;display:flex;gap:4px;">
      <button class="btn" style="font-size:11px;padding:3px 8px;" onclick="addPoint()">+ point at cursor</button>
    </div>
  </div>

  <div id="toolbar">
    <span style="font-size:11px;color:#8b949e;align-self:center;">Mode:</span>
    <button class="btn" id="mode-select" onclick="setMode('select')">Select</button>
    <button class="btn" id="mode-add" onclick="setMode('add')">Add pts</button>
    <button class="btn" id="mode-pan" onclick="setMode('pan')">Pan</button>
  </div>

  <div id="output-area">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <span style="font-size:11px;color:#8b949e;">Export</span>
      <button class="btn" style="font-size:10px;padding:2px 7px;" onclick="copyOutput()">Copy</button>
    </div>
    <textarea id="output" readonly></textarea>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="main"></canvas>
  <div id="coords">x: 0, y: 0</div>
  <div id="hint">Scroll = zoom · Drag = pan · Click point = select · Drag point = move</div>
</div>

<script>
const canvas = document.getElementById('main');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

const POLY_COLORS = ['#58a6ff','#3fb950','#f78166','#d2a8ff','#ffa657','#79c0ff','#56d364','#ff7b72'];
const HUB_COLOR = '#ffd700';
const SEG_COLOR = '#ff9966';
const GRAV_COLOR = '#ff66cc';

let state = {
  polygons: [],    // [{pts: [{x,y},...], comment:''}]
  segments: [],    // [{x1,y1,x2,y2}]
  hubs: [],        // [{x, color, name}]
  gravWell: null,
  selectedPoly: -1,
  selectedPoint: -1,
  dragging: false,
  dragPoly: -1,
  dragPt: -1,
  mode: 'select',  // select | add | pan
  view: { x: 0, y: 0, scale: 0.4 },
  mouse: { wx: 0, wy: 0 },
  panStart: null,
};

function resize() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  draw();
}
window.addEventListener('resize', resize);
resize();

// ── Parse ────────────────────────────────────────────────────────────────────

function loadInput() {
  const txt = document.getElementById('input').value.trim();
  if (!txt) return;
  try { parseLevel(txt); } catch(e) { alert('Parse error: ' + e.message); console.error(e); }
}

function parseLevel(src) {
  state.polygons = [];
  state.segments = [];
  state.hubs = [];
  state.gravWell = null;

  // Extract terrainPolygons
  let polyMatch = src.match(/terrainPolygons\s*:\s*(\[[\s\S]*?\n\s*\](?=\s*,|\s*\n\s*[a-z]))/);
  if (!polyMatch) {
    // Try just an array
    polyMatch = src.match(/^(\[[\s\S]*\])$/m);
  }
  if (polyMatch) {
    const raw = polyMatch[1];
    const polys = parsePolygonArray(raw);
    state.polygons = polys;
  }

  // Extract segments
  const segMatch = src.match(/segments\s*:\s*\[([\s\S]*?)\]/);
  if (segMatch) {
    const segs = [];
    const re = /\{\s*x1\s*:\s*([-\d.]+)\s*,\s*y1\s*:\s*([-\d.]+)\s*,\s*x2\s*:\s*([-\d.]+)\s*,\s*y2\s*:\s*([-\d.]+)\s*\}/g;
    let m;
    while ((m = re.exec(segMatch[1])) !== null) {
      segs.push({x1:+m[1],y1:+m[2],x2:+m[3],y2:+m[4]});
    }
    state.segments = segs;
  }

  // Extract deliveryHubs
  const hubMatch = src.match(/deliveryHubs\s*:\s*\[([\s\S]*?)\]/);
  if (hubMatch) {
    const re = /\{\s*x\s*:\s*([-\d.]+)[\s\S]*?color\s*:\s*["'](.*?)["'][\s\S]*?name\s*:\s*["'](.*?)["']/g;
    let m;
    while ((m = re.exec(hubMatch[1])) !== null) {
      state.hubs.push({x:+m[1], color:m[2], name:m[3]});
    }
  }

  // Extract gravityWell
  const gwMatch = src.match(/gravityWell\s*:\s*\{([\s\S]*?)\}/);
  if (gwMatch) {
    const gx = gwMatch[1].match(/x\s*:\s*([-\d.]+)/);
    const gy = gwMatch[1].match(/y\s*:\s*([-\d.]+)/);
    if (gx && gy) state.gravWell = {x:+gx[1], y:+gy[1]};
  }

  state.selectedPoly = state.polygons.length > 0 ? 0 : -1;
  state.selectedPoint = -1;
  fitView();
  renderSidebar();
  updateOutput();
}

function parsePolygonArray(raw) {
  // Parse JS array of arrays of {x,y} — eval in sandboxed way
  // We'll do a text transform: extract inner arrays
  const polys = [];
  // Find comment lines preceding each polygon
  const lines = raw.split('\n');
  let comment = '';
  let inPoly = false;
  let depth = 0;
  let current = '';
  let comments = [];
  let polyStrings = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();
    if (!inPoly) {
      if (trimmed.startsWith('//')) {
        comment = trimmed.replace(/^\/\/\s*/, '');
      } else if (trimmed.startsWith('[')) {
        inPoly = true;
        depth = 0;
        current = '';
        comments.push(comment);
        comment = '';
        for (const ch of line) {
          if (ch === '[') depth++;
          else if (ch === ']') depth--;
          current += ch;
        }
        if (depth === 0) { polyStrings.push(current); inPoly = false; current = ''; }
      }
    } else {
      current += '\n' + line;
      for (const ch of line) {
        if (ch === '[') depth++;
        else if (ch === ']') depth--;
      }
      if (depth === 0) { polyStrings.push(current); inPoly = false; current = ''; }
    }
  }

  for (let i = 0; i < polyStrings.length; i++) {
    const ps = polyStrings[i].trim();
    if (!ps || ps === '[' || ps === '[]') continue;
    // Parse {x: N, y: N} pairs
    const pts = [];
    const re = /\{\s*x\s*:\s*([-\d.]+)\s*,\s*y\s*:\s*([-\d.]+)\s*\}/g;
    let m;
    while ((m = re.exec(ps)) !== null) {
      pts.push({x:+m[1], y:+m[2]});
    }
    if (pts.length > 0) polys.push({pts, comment: comments[i] || ''});
  }
  return polys;
}

// ── Output ───────────────────────────────────────────────────────────────────

function buildOutput() {
  const lines = ['terrainPolygons: ['];
  state.polygons.forEach((poly, pi) => {
    if (poly.comment) lines.push(`        // ${poly.comment}`);
    lines.push('        [');
    poly.pts.forEach((pt, i) => {
      const comma = i < poly.pts.length - 1 ? ',' : '';
      lines.push(`            {x: ${Math.round(pt.x)}, y: ${Math.round(pt.y)}}${comma}`);
    });
    const comma = pi < state.polygons.length - 1 ? ',' : '';
    lines.push(`        ]${comma}`);
  });
  lines.push('    ]');
  return lines.join('\n');
}

function updateOutput() {
  document.getElementById('output').value = buildOutput();
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('output').value)
    .then(() => { const b = document.querySelector('#output-area .btn'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy',1200); });
}

// ── Sidebar ───────────────────────────────────────────────────────────────────

function renderSidebar() {
  const list = document.getElementById('poly-list');
  list.innerHTML = '';
  state.polygons.forEach((poly, i) => {
    const d = document.createElement('div');
    d.className = 'poly-item' + (i === state.selectedPoly ? ' active' : '');
    const dot = `<span class="color-dot" style="background:${POLY_COLORS[i % POLY_COLORS.length]}"></span>`;
    d.innerHTML = `<div class="poly-header">${dot}<span class="poly-name">${poly.comment || 'Polygon ' + (i+1)}</span><span class="poly-count">${poly.pts.length} pts</span></div>`;
    d.onclick = () => { state.selectedPoly = i; state.selectedPoint = -1; renderSidebar(); renderPointList(); draw(); };
    list.appendChild(d);
  });

  if (state.selectedPoly >= 0) {
    document.getElementById('point-panel').style.display = '';
    renderPointList();
  } else {
    document.getElementById('point-panel').style.display = 'none';
  }
}

function renderPointList() {
  const pi = state.selectedPoly;
  if (pi < 0 || pi >= state.polygons.length) return;
  const poly = state.polygons[pi];
  document.getElementById('poly-label').textContent = poly.comment || 'Polygon ' + (pi+1);
  const container = document.getElementById('point-list');
  container.innerHTML = '';
  poly.pts.forEach((pt, i) => {
    const row = document.createElement('div');
    row.className = 'point-row' + (i === state.selectedPoint ? ' selected' : '');
    row.innerHTML = `<span class="point-idx">${i}</span>
      <span class="point-coord">x:<input type="number" value="${Math.round(pt.x)}" onchange="setPtCoord(${pi},${i},'x',this.value)" onclick="e=>e.stopPropagation()">
      y:<input type="number" value="${Math.round(pt.y)}" onchange="setPtCoord(${pi},${i},'y',this.value)" onclick="e=>e.stopPropagation()"></span>
      <span class="point-del" onclick="deletePoint(${pi},${i})">×</span>`;
    row.onclick = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.classList.contains('point-del')) return;
      state.selectedPoint = i;
      renderPointList();
      draw();
    };
    container.appendChild(row);
  });
}

function setPtCoord(pi, pti, axis, val) {
  state.polygons[pi].pts[pti][axis] = +val;
  draw();
  updateOutput();
}

function deletePoint(pi, pti) {
  if (state.polygons[pi].pts.length <= 3) { alert('Polygon needs at least 3 points.'); return; }
  state.polygons[pi].pts.splice(pti, 1);
  if (state.selectedPoint >= state.polygons[pi].pts.length) state.selectedPoint = state.polygons[pi].pts.length - 1;
  renderPointList();
  draw();
  updateOutput();
}

function addPoint() {
  if (state.selectedPoly < 0) return;
  const pt = { x: Math.round(state.mouse.wx), y: Math.round(state.mouse.wy) };
  state.polygons[state.selectedPoly].pts.push(pt);
  state.selectedPoint = state.polygons[state.selectedPoly].pts.length - 1;
  renderPointList();
  draw();
  updateOutput();
}

function deletePolygon() {
  if (state.selectedPoly < 0) return;
  if (!confirm('Delete this polygon?')) return;
  state.polygons.splice(state.selectedPoly, 1);
  state.selectedPoly = Math.min(state.selectedPoly, state.polygons.length - 1);
  state.selectedPoint = -1;
  renderSidebar();
  draw();
  updateOutput();
}

function addPolygon() {
  const cx = state.mouse.wx || 500;
  const cy = state.mouse.wy || 400;
  state.polygons.push({ pts: [{x:cx-50,y:cy},{x:cx+50,y:cy},{x:cx,y:cy-80}], comment: 'New polygon' });
  state.selectedPoly = state.polygons.length - 1;
  state.selectedPoint = -1;
  renderSidebar();
  draw();
  updateOutput();
}

// ── Coordinate transforms ────────────────────────────────────────────────────

function worldToScreen(wx, wy) {
  return {
    sx: wx * state.view.scale + state.view.x,
    sy: wy * state.view.scale + state.view.y
  };
}

function screenToWorld(sx, sy) {
  return {
    wx: (sx - state.view.x) / state.view.scale,
    wy: (sy - state.view.y) / state.view.scale
  };
}

// ── Draw ─────────────────────────────────────────────────────────────────────

const POINT_RADIUS = 6;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid
  drawGrid();

  // Terrain polygons
  state.polygons.forEach((poly, pi) => {
    const color = POLY_COLORS[pi % POLY_COLORS.length];
    const isActive = pi === state.selectedPoly;

    ctx.beginPath();
    poly.pts.forEach((pt, i) => {
      const {sx, sy} = worldToScreen(pt.x, pt.y);
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    ctx.closePath();
    ctx.fillStyle = color + (isActive ? '33' : '1a');
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = isActive ? 2 : 1;
    ctx.stroke();

    // Points
    poly.pts.forEach((pt, pti) => {
      const {sx, sy} = worldToScreen(pt.x, pt.y);
      const isSelected = isActive && pti === state.selectedPoint;
      ctx.beginPath();
      ctx.arc(sx, sy, isSelected ? POINT_RADIUS + 2 : POINT_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = isSelected ? '#fff' : color;
      ctx.fill();
      ctx.strokeStyle = isSelected ? color : '#0d1117';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Index label
      if (isActive) {
        ctx.fillStyle = '#e6edf3';
        ctx.font = '10px monospace';
        ctx.fillText(pti, sx + 8, sy - 4);
      }
    });

    // Comment label at centroid
    if (poly.comment) {
      const cx = poly.pts.reduce((s,p)=>s+p.x,0)/poly.pts.length;
      const cy = poly.pts.reduce((s,p)=>s+p.y,0)/poly.pts.length;
      const {sx, sy} = worldToScreen(cx, cy);
      ctx.fillStyle = color + 'cc';
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(poly.comment, sx, sy);
      ctx.textAlign = 'left';
    }
  });

  // Segments
  state.segments.forEach(seg => {
    const a = worldToScreen(seg.x1, seg.y1);
    const b = worldToScreen(seg.x2, seg.y2);
    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy);
    ctx.lineTo(b.sx, b.sy);
    ctx.strokeStyle = SEG_COLOR;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath(); ctx.arc(a.sx, a.sy, 4, 0, Math.PI*2); ctx.fillStyle = SEG_COLOR; ctx.fill();
    ctx.beginPath(); ctx.arc(b.sx, b.sy, 4, 0, Math.PI*2); ctx.fillStyle = SEG_COLOR; ctx.fill();
  });

  // Delivery hubs
  state.hubs.forEach(hub => {
    const {sx, sy} = worldToScreen(hub.x, 0);
    ctx.save();
    ctx.strokeStyle = hub.color || HUB_COLOR;
    ctx.setLineDash([3, 3]);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = hub.color || HUB_COLOR;
    ctx.font = '11px monospace';
    ctx.fillText(hub.name || 'hub', sx + 4, 20);
    ctx.fillText('x=' + hub.x, sx + 4, 32);
    ctx.restore();
  });

  // Gravity well
  if (state.gravWell) {
    const {sx, sy} = worldToScreen(state.gravWell.x, state.gravWell.y);
    ctx.beginPath();
    ctx.arc(sx, sy, 10, 0, Math.PI * 2);
    ctx.strokeStyle = GRAV_COLOR;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = GRAV_COLOR + '33';
    ctx.fill();
    ctx.fillStyle = GRAV_COLOR;
    ctx.font = '10px monospace';
    ctx.fillText('gravity well', sx + 14, sy + 4);
  }

  // Origin cross
  const o = worldToScreen(0, 0);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(o.sx - 10, o.sy); ctx.lineTo(o.sx + 10, o.sy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(o.sx, o.sy - 10); ctx.lineTo(o.sx, o.sy + 10); ctx.stroke();
}

function drawGrid() {
  const step = gridStep();
  const tl = screenToWorld(0, 0);
  const br = screenToWorld(canvas.width, canvas.height);

  const x0 = Math.floor(tl.wx / step) * step;
  const y0 = Math.floor(tl.wy / step) * step;

  ctx.strokeStyle = '#1e2630';
  ctx.lineWidth = 1;
  for (let wx = x0; wx < br.wx; wx += step) {
    const {sx} = worldToScreen(wx, 0);
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height); ctx.stroke();
  }
  for (let wy = y0; wy < br.wy; wy += step) {
    const {sy} = worldToScreen(0, wy);
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy); ctx.stroke();
  }

  // Grid labels
  ctx.fillStyle = '#3d4a5c';
  ctx.font = '10px monospace';
  for (let wx = x0; wx < br.wx; wx += step) {
    const {sx} = worldToScreen(wx, 0);
    if (sx > 4 && sx < canvas.width - 4) ctx.fillText(wx, sx + 2, canvas.height - 4);
  }
  for (let wy = y0; wy < br.wy; wy += step) {
    const {sy} = worldToScreen(0, wy);
    if (sy > 14 && sy < canvas.height - 4) ctx.fillText(wy, 2, sy - 2);
  }
}

function gridStep() {
  const unitsVisible = canvas.width / state.view.scale;
  const rawStep = unitsVisible / 8;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const nice = [1, 2, 5, 10].map(f => f * mag).find(s => s >= rawStep) || mag * 10;
  return nice;
}

// ── Fit view ─────────────────────────────────────────────────────────────────

function fitView() {
  if (state.polygons.length === 0) { state.view = {x: 200, y: 200, scale: 0.3}; draw(); return; }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  state.polygons.forEach(p => p.pts.forEach(pt => {
    minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
    minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);
  }));
  const pad = 80;
  const sw = canvas.width - pad * 2;
  const sh = canvas.height - pad * 2;
  const dw = maxX - minX || 100;
  const dh = maxY - minY || 100;
  const scale = Math.min(sw / dw, sh / dh, 2);
  state.view.scale = scale;
  state.view.x = pad + (sw - dw * scale) / 2 - minX * scale;
  state.view.y = pad + (sh - dh * scale) / 2 - minY * scale;
  draw();
}

// ── Mode ─────────────────────────────────────────────────────────────────────

function setMode(m) {
  state.mode = m;
  ['select','add','pan'].forEach(id => {
    document.getElementById('mode-' + id).style.background = id === m ? '#1f6feb' : '';
    document.getElementById('mode-' + id).style.borderColor = id === m ? '#1f6feb' : '';
  });
  canvas.style.cursor = m === 'pan' ? 'grab' : m === 'add' ? 'crosshair' : 'default';
}
setMode('select');

// ── Mouse ─────────────────────────────────────────────────────────────────────

function getPolyPointAt(sx, sy) {
  for (let pi = 0; pi < state.polygons.length; pi++) {
    for (let pti = 0; pti < state.polygons[pi].pts.length; pti++) {
      const pt = state.polygons[pi].pts[pti];
      const {sx: px, sy: py} = worldToScreen(pt.x, pt.y);
      const r = POINT_RADIUS + 4;
      if (Math.abs(sx - px) < r && Math.abs(sy - py) < r) return [pi, pti];
    }
  }
  return null;
}

let isPanning = false;
let panLast = null;

canvas.addEventListener('mousedown', e => {
  const sx = e.offsetX, sy = e.offsetY;
  const w = screenToWorld(sx, sy);
  state.mouse.wx = w.wx; state.mouse.wy = w.wy;

  if (state.mode === 'pan' || e.button === 1 || (e.button === 0 && e.altKey)) {
    isPanning = true;
    panLast = {sx, sy};
    canvas.style.cursor = 'grabbing';
    return;
  }

  if (state.mode === 'add' && e.button === 0) {
    if (state.selectedPoly < 0) return;
    // Insert after nearest edge
    const poly = state.polygons[state.selectedPoly];
    const idx = nearestEdgeIndex(poly.pts, w.wx, w.wy);
    poly.pts.splice(idx + 1, 0, {x: Math.round(w.wx), y: Math.round(w.wy)});
    state.selectedPoint = idx + 1;
    renderSidebar();
    renderPointList();
    draw();
    updateOutput();
    return;
  }

  if (state.mode === 'select' && e.button === 0) {
    const hit = getPolyPointAt(sx, sy);
    if (hit) {
      const [pi, pti] = hit;
      state.selectedPoly = pi;
      state.selectedPoint = pti;
      state.dragging = true;
      state.dragPoly = pi;
      state.dragPt = pti;
      renderSidebar();
      renderPointList();
      draw();
    } else {
      // Check if click is inside a polygon to select it
      for (let pi = 0; pi < state.polygons.length; pi++) {
        if (pointInPoly(w.wx, w.wy, state.polygons[pi].pts)) {
          state.selectedPoly = pi;
          state.selectedPoint = -1;
          renderSidebar();
          renderPointList();
          draw();
          return;
        }
      }
    }
  }
});

canvas.addEventListener('mousemove', e => {
  const sx = e.offsetX, sy = e.offsetY;
  const w = screenToWorld(sx, sy);
  state.mouse.wx = w.wx; state.mouse.wy = w.wy;
  document.getElementById('coords').textContent = `x: ${Math.round(w.wx)}, y: ${Math.round(w.wy)}`;

  if (isPanning && panLast) {
    state.view.x += sx - panLast.sx;
    state.view.y += sy - panLast.sy;
    panLast = {sx, sy};
    draw();
    return;
  }

  if (state.dragging && state.dragPt >= 0) {
    const snap = e.shiftKey ? 50 : (e.ctrlKey ? 1 : 10);
    const pt = state.polygons[state.dragPoly].pts[state.dragPt];
    pt.x = Math.round(w.wx / snap) * snap;
    pt.y = Math.round(w.wy / snap) * snap;
    renderPointList();
    draw();
    updateOutput();
  }
});

canvas.addEventListener('mouseup', e => {
  if (isPanning) { isPanning = false; canvas.style.cursor = state.mode === 'pan' ? 'grab' : 'default'; }
  if (state.dragging) { state.dragging = false; state.dragPoly = -1; state.dragPt = -1; }
});

canvas.addEventListener('mouseleave', e => {
  isPanning = false; state.dragging = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const sx = e.offsetX, sy = e.offsetY;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const wx = (sx - state.view.x) / state.view.scale;
  const wy = (sy - state.view.y) / state.view.scale;
  state.view.scale = Math.max(0.05, Math.min(4, state.view.scale * factor));
  state.view.x = sx - wx * state.view.scale;
  state.view.y = sy - wy * state.view.scale;
  draw();
}, {passive: false});

// ── Helpers ───────────────────────────────────────────────────────────────────

function pointInPoly(px, py, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function nearestEdgeIndex(pts, wx, wy) {
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i+1) % pts.length];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const d = Math.hypot(wx - mx, wy - my);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 's') setMode('select');
  if (e.key === 'a') setMode('add');
  if (e.key === 'p') setMode('pan');
  if (e.key === 'f') fitView();
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedPoly >= 0 && state.selectedPoint >= 0) {
    deletePoint(state.selectedPoly, state.selectedPoint);
  }
});

// Init with default level 4 polygon from paste
document.getElementById('input').placeholder =
  'Paste level JS here (full registerLevel({...}) or just the terrainPolygons array)\n\nShortcuts: S=select  A=add pts  P=pan  F=fit\nDrag points to move · Shift=snap50 · Ctrl=snap1\nDelete/Backspace = delete selected point';
</script>
</body>
