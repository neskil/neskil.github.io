<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terrain Editor — Cargo Lander</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',monospace;background:#0d1117;color:#e6edf3;display:flex;height:100vh;overflow:hidden;font-size:12px}

#sidebar{width:310px;min-width:310px;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}

.sec{padding:9px 11px;border-bottom:1px solid #30363d}
.sec-title{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#8b949e;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}

select,textarea,input[type=number],input[type=text]{
  background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;
  font-family:monospace;font-size:11px;padding:3px 6px
}
select:focus,textarea:focus,input:focus{outline:none;border-color:#58a6ff}
select{width:100%;padding:4px 6px;margin-bottom:5px}

.row{display:flex;gap:4px;align-items:center}
.btn{padding:3px 10px;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:4px;cursor:pointer;font:11px monospace;white-space:nowrap;user-select:none}
.btn:hover{background:#30363d}
.btn.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn.on:hover{background:#388bfd}
.btn.del{color:#f85149}.btn.del:hover{background:#2d1515;border-color:#f85149}

#level-card{background:#0d1117;border:1px solid #30363d;border-radius:4px;padding:7px 9px;margin-top:6px;display:none}
#level-card .lname{font-size:12px;font-weight:700;color:#58a6ff;margin-bottom:4px}
#level-card .lmeta{font-size:10px;color:#8b949e;line-height:1.7}
.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;margin-right:4px}

details>summary{font-size:10px;color:#8b949e;cursor:pointer;margin-top:5px;user-select:none}
details textarea{width:100%;height:70px;margin-top:5px;resize:none;font-size:10px}

#poly-list{flex:1;overflow-y:auto;padding:7px;min-height:40px}
.pitem{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.pitem:hover{background:#21262d}
.pitem.active{background:#1c2d3f;border-color:#388bfd}
.pdot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.pname{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcnt{font-size:10px;color:#8b949e}
.peye{font-size:12px;color:#8b949e;cursor:pointer;padding:0 2px}.peye:hover{color:#e6edf3}

#pt-panel{border-top:1px solid #30363d;padding:8px;display:none}
#pt-panel .sec-title{margin-bottom:5px}
#pt-list-wrap{max-height:150px;overflow-y:auto}
.ptrow{display:flex;align-items:center;gap:3px;padding:2px 3px;border-radius:3px;cursor:pointer}
.ptrow:hover{background:#21262d}.ptrow.sel{background:#1c2d3f}
.pidx{color:#8b949e;width:18px;font-size:10px;flex-shrink:0}
.clabel{color:#8b949e;font-size:10px}
.cinput{width:50px;font-size:10px;padding:1px 4px}
.xbtn{color:#6e7681;font-size:13px;cursor:pointer;line-height:1}.xbtn:hover{color:#f85149}

#rename-row{display:flex;gap:4px;margin-bottom:5px;align-items:center}
#rename-row label{font-size:10px;color:#8b949e;white-space:nowrap}
#rename-row input{flex:1;font-size:11px}

#toolbar{padding:7px 9px;border-top:1px solid #30363d;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
#snap-bar{padding:5px 9px;border-top:1px solid #30363d;display:flex;gap:4px;align-items:center}
#snap-bar label{font-size:10px;color:#8b949e}

#out-area{padding:7px 9px;border-top:1px solid #30363d}
#out-area textarea{width:100%;height:68px;resize:none;color:#79c0ff;font-size:10px}

#canvas-wrap{flex:1;position:relative;overflow:hidden}
canvas{display:block}

#statusbar{position:absolute;bottom:0;left:0;right:0;height:22px;background:rgba(13,17,23,.88);border-top:1px solid #30363d;display:flex;align-items:center;padding:0 10px;gap:16px;font-size:10px;color:#8b949e;pointer-events:none}
#statusbar span{color:#c9d1d9}

#kbd{position:absolute;top:8px;left:8px;background:rgba(13,17,23,.75);border:1px solid #30363d;border-radius:4px;padding:4px 8px;font-size:10px;color:#8b949e;pointer-events:none;line-height:1.6}
#lvl-overlay{position:absolute;top:8px;right:8px;background:rgba(13,17,23,.75);border:1px solid #30363d;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;color:#58a6ff;pointer-events:none;display:none}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sec">
    <div class="sec-title">Load Level</div>
    <select id="lsel">
      <option value="">— choose level file —</option>
      <option value="level1.js">level1.js — L1: Local Distribution</option>
      <option value="level2.js">level2.js — L2: Cross-Dock Sorting</option>
      <option value="level3.js">level3.js — L3: Gale-Force Winds</option>
      <option value="level4.js">level4.js — L4: Gravity Anomaly</option>
      <option value="level5.js">level5.js — L5: The Needle's Eye</option>
      <option value="level6.js">level6.js — L6: Sand Worm's Lair</option>
      <option value="level7.js">level7.js — L7: The Deep Haul</option>
      <option value="levelTest.js">levelTest.js — Sandbox</option>
    </select>
    <div class="row">
      <button class="btn on" onclick="loadFromServer()" style="flex:1">Load from server</button>
      <button class="btn" onclick="fitView()">Fit</button>
      <button class="btn" onclick="addPolygon()">+ Poly</button>
    </div>
    <div id="level-card"></div>
    <details>
      <summary>Or paste JS</summary>
      <textarea id="paste-in" placeholder="Paste full registerLevel({...}) or just terrainPolygons: [...]"></textarea>
      <button class="btn on" style="width:100%;margin-top:3px" onclick="loadFromPaste()">Parse &amp; load</button>
    </details>
  </div>

  <div class="sec" style="padding-bottom:4px">
    <div class="sec-title">Polygons</div>
  </div>
  <div id="poly-list"></div>

  <div id="pt-panel">
    <div class="sec-title">
      <span>Points</span>
      <button class="btn del" style="padding:1px 6px;font-size:10px" onclick="deletePoly()">delete poly</button>
    </div>
    <div id="rename-row">
      <label>Label:</label>
      <input type="text" id="poly-rename" oninput="renameActivePoly(this.value)">
    </div>
    <div id="pt-list-wrap"><div id="pt-list"></div></div>
    <button class="btn" style="margin-top:5px;width:100%;font-size:10px" onclick="insertAtCursor()">+ insert point at cursor</button>
  </div>

  <div id="toolbar">
    <span style="font-size:10px;color:#8b949e">Mode:</span>
    <button class="btn on" id="m-select" onclick="setMode('select')">Select</button>
    <button class="btn" id="m-add" onclick="setMode('add')">Add pts</button>
    <button class="btn" id="m-pan" onclick="setMode('pan')">Pan</button>
  </div>
  <div id="snap-bar">
    <label>Snap:</label>
    <button class="btn" id="sn1"  onclick="setSnap(1)">1</button>
    <button class="btn on" id="sn10" onclick="setSnap(10)">10</button>
    <button class="btn" id="sn50" onclick="setSnap(50)">50</button>
    <button class="btn" id="sn100" onclick="setSnap(100)">100</button>
    <span style="font-size:10px;color:#8b949e;margin-left:2px">Shift=×5</span>
  </div>

  <div id="out-area">
    <div class="row" style="margin-bottom:4px">
      <span style="font-size:10px;color:#8b949e;flex:1">Export — positions + polygons</span>
      <button class="btn" id="copy-btn" onclick="copyOut()">Copy</button>
    </div>
    <textarea id="out" readonly style="height:90px"></textarea>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="main"></canvas>
  <div id="kbd">S=select · A=add pts · P=pan · F=fit · Del=delete pt<br>Add mode: click near edge to insert point on it · hover shows preview<br>Drag HQ/Cargo/Hub bars to reposition · scroll=zoom · Alt+drag=pan</div>
  <div id="lvl-overlay"></div>
  <div id="statusbar">
    x: <span id="sx">0</span> &nbsp; y: <span id="sy">0</span>
    &nbsp;&nbsp; snap: <span id="sdisp">10</span>
    &nbsp;&nbsp; <span id="pdisp"></span>
  </div>
</div>

<script>
const canvas = document.getElementById('main');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvas-wrap');

const POLY_COLORS = ['#58a6ff','#3fb950','#f78166','#d2a8ff','#ffa657','#79c0ff','#56d364','#ff7b72','#e3b341','#a5d6ff'];

const DEFAULT_PAL = {
  skyTop:'#020617', skyMid:'#040b16', skyBot:'#051114',
  terrainFill:'#06101c', rockEdge:'#38bdf8',
  rockGlow:'rgba(56,189,248,', fog:'rgba(56,189,248,0.1)'
};

const S = {
  polygons: [],   // [{pts:[{x,y}], comment:'', hidden:false}]
  segments: [],   // [{x1,y1,x2,y2}]
  hubs: [],       // [{x, width?, color, type, name}]
  gravWell: null, // {x,y,radius,orbitRadius,strength}
  oob: null,      // {type,color,mistColor,surfaceY,drag,buoyancy,monsterDepth}
  palette: Object.assign({}, DEFAULT_PAL),
  startX: 0,
  collectionX: null,
  padScale: 1,
  levelName: '',
  selPoly: -1,
  selPt: -1,
  dragging: false, dragPi: -1, dragPti: -1,
  dragMarker: null,  // 'hq' | 'depot' | {hub:i} — dragging a spawn/hub marker
  edgePreview: null, // {pi, edgeIdx, pt} — shown in Add pts mode on hover
  hoverMarker: null, // 'hq' | 'depot' | {hub:i} — for cursor feedback
  mode: 'select',
  snap: 10,
  view: { x:200, y:150, scale:0.35 },
  mouse: { wx:0, wy:0 },
};

// ── Transform ─────────────────────────────────────────────────────────────────
const w2s = (wx,wy) => ({ sx: wx*S.view.scale + S.view.x, sy: wy*S.view.scale + S.view.y });
const s2w = (sx,sy) => ({ wx: (sx-S.view.x)/S.view.scale, wy: (sy-S.view.y)/S.view.scale });

// ── Resize ────────────────────────────────────────────────────────────────────
function resize() {
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight - 22;
  draw();
}
window.addEventListener('resize', resize);
resize();

// ── Level loading ─────────────────────────────────────────────────────────────
async function loadFromServer() {
  const f = document.getElementById('lsel').value;
  if (!f) { alert('Choose a level file first.'); return; }
  try {
    const src = await fetch('/' + f + '?t=' + Date.now()).then(r => {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    });
    applySource(src);
  } catch(e) { alert('Could not load ' + f + ':\n' + e); }
}

function loadFromPaste() {
  const src = document.getElementById('paste-in').value.trim();
  if (src) applySource(src);
}

function applySource(src) {
  const cfg = evalLevel(src);
  if (cfg) {
    applyConfig(cfg);
  } else {
    // fallback: regex-parse just polygons
    const polys = regexParsePolys(src);
    if (!polys.length) { alert('Could not parse any polygons from this source.'); return; }
    resetState();
    S.polygons = polys;
    S.selPoly = 0;
    fitView(); renderSidebar(); updateOut();
  }
}

function evalLevel(src) {
  let captured = null;
  const rl  = c => { captured = c; };
  const qP  = t     => ({id:'primary', text:t, type:'primary'});
  const qNC = (r=300) => ({id:'no_crash', text:'Zero crashes', type:'bonus', reward:r});
  const qNL = (t='No cargo lost', r=250) => ({id:'no_cargo_lost', text:t, type:'bonus', reward:r});
  const qQ  = (t,g,r=200) => ({id:'quick', text:t, type:'bonus', reward:r, timeGoal:g});
  const qSW = (r=500) => ({id:'survive_worm', text:'Survive the worm', type:'bonus', reward:r});
  try {
    // eslint-disable-next-line no-new-func
    new Function('registerLevel','questPrimary','questNoCrash','questNoCargoLost','questQuick','questSurviveWorm', src)
      (rl, qP, qNC, qNL, qQ, qSW);
  } catch(e) { console.warn('evalLevel failed:', e); return null; }
  return captured;
}

function applyConfig(cfg) {
  resetState();
  S.polygons  = (cfg.terrainPolygons || []).map((pts, i) => ({
    pts: pts.map(p => ({x:p.x, y:p.y})),
    comment: guessComment(pts, i),
    hidden: false
  }));
  S.segments  = cfg.segments || [];
  S.hubs      = cfg.deliveryHubs || [];
  S.gravWell  = cfg.gravityWell  || null;
  S.oob       = cfg.outOfBounds  || null;
  S.palette   = Object.assign({}, DEFAULT_PAL, cfg.palette || {});
  S.startX    = cfg.startX    || 0;
  S.collectionX = cfg.collectionX != null ? cfg.collectionX : null;
  S.padScale  = cfg.padScale  || 1;
  S.levelName = cfg.name || '';
  S.selPoly   = S.polygons.length > 0 ? 0 : -1;

  const ol = document.getElementById('lvl-overlay');
  ol.textContent = cfg.name || '';
  ol.style.display = cfg.name ? '' : 'none';

  renderLevelCard(cfg);
  fitView();
  renderSidebar();
  updateOut();
}

function resetState() {
  S.polygons=[]; S.segments=[]; S.hubs=[]; S.gravWell=null; S.oob=null;
  S.palette=Object.assign({},DEFAULT_PAL); S.startX=0; S.collectionX=null;
  S.padScale=1; S.levelName=''; S.selPoly=-1; S.selPt=-1;
  document.getElementById('lvl-overlay').style.display='none';
  document.getElementById('level-card').style.display='none';
}

function guessComment(pts, i) {
  const ys = pts.map(p=>p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  if (minY < -50) return 'Ceiling';
  if (pts.length <= 6 && maxY - minY < 300) return `Obstacle ${i}`;
  if (i === 0) return 'Ground';
  return `Polygon ${i+1}`;
}

function regexParsePolys(src) {
  const polys = [];
  const re = /\{\s*x\s*:\s*([-\d.]+)\s*,\s*y\s*:\s*([-\d.]+)\s*\}/g;
  const blocks = src.split(/\n\s*\[/);
  blocks.slice(1).forEach((block, i) => {
    const pts = []; let m;
    re.lastIndex = 0;
    while ((m = re.exec(block)) !== null) pts.push({x:+m[1], y:+m[2]});
    if (pts.length >= 3) polys.push({pts, comment:`Polygon ${i+1}`, hidden:false});
  });
  return polys;
}

function renderLevelCard(cfg) {
  const card = document.getElementById('level-card');
  if (!cfg) { card.style.display='none'; return; }
  const oob = cfg.outOfBounds || {};
  const oobColors = {water:'#0ea5e9',goo:'#ef4444',sand:'#d97706',acid:'#84cc16',void:'#6366f1'};
  const oc = oobColors[oob.type] || '#888';
  card.style.display = '';
  card.innerHTML = `<div class="lname">${cfg.name||''}</div><div class="lmeta">` +
    (oob.type ? `<span class="badge" style="background:${oc}22;color:${oc}">${oob.type}</span>` : '') +
    `grav=${cfg.gravity??'—'} wind=${cfg.wind??0} budget=$${cfg.budget??'—'}<br>` +
    `OOB surface y=${oob.surfaceY??'—'} · monster y=${oob.monsterDepth??'—'}` +
    (cfg.gravityWell ? `<br>well @ (${cfg.gravityWell.x},${cfg.gravityWell.y}) r=${cfg.gravityWell.radius}` : '') +
    `</div>`;
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw() {
  const W=canvas.width, H=canvas.height;
  drawSky(W,H);
  drawOOB(W,H);
  drawGrid(W,H);
  drawSpawnMarkers();
  drawHubs();
  drawGravWell();
  drawSegments();
  drawPolygons();
  drawEdgePreview();
}

function drawSky(W,H) {
  const p = S.palette;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,   p.skyTop || '#020617');
  g.addColorStop(0.5, p.skyMid || '#040b16');
  g.addColorStop(1,   p.skyBot || '#051114');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

function drawOOB(W,H) {
  if (!S.oob) return;
  const { surfaceY, monsterDepth, color, mistColor, type } = S.oob;
  if (surfaceY == null) return;

  const { sy: surfSY } = w2s(0, surfaceY);
  const { sy: mistSY } = w2s(0, surfaceY - 150);

  // Mist gradient band above the surface
  const mTop = Math.min(mistSY, surfSY), mBot = Math.max(mistSY, surfSY);
  if (mBot > 0 && mTop < H && mistColor) {
    const gm = ctx.createLinearGradient(0, mTop, 0, mBot);
    gm.addColorStop(0, 'transparent');
    gm.addColorStop(1, mistColor);
    ctx.fillStyle = gm;
    ctx.fillRect(0, Math.max(0,mTop), W, Math.min(H,mBot) - Math.max(0,mTop));
  }

  // OOB body below surface
  if (surfSY < H) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = color || 'rgba(14,165,233,0.4)';
    ctx.fillRect(0, Math.max(0,surfSY), W, H - Math.max(0,surfSY));
    ctx.restore();
  }

  // Surface line + label
  if (surfSY > -20 && surfSY < H + 20) {
    ctx.save();
    ctx.strokeStyle = color || '#0ea5e9';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([8,4]);
    ctx.beginPath(); ctx.moveTo(0,surfSY); ctx.lineTo(W,surfSY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color || '#0ea5e9';
    ctx.font = '10px monospace';
    ctx.fillText(`${type||'OOB'} surface  y=${surfaceY}`, 8, surfSY - 5);
    ctx.restore();
  }

  // Monster depth line
  if (monsterDepth != null) {
    const { sy: monSY } = w2s(0, monsterDepth);
    if (monSY > -20 && monSY < H + 20) {
      ctx.save();
      ctx.strokeStyle = '#f85149';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.5;
      ctx.setLineDash([3,6]);
      ctx.beginPath(); ctx.moveTo(0,monSY); ctx.lineTo(W,monSY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#f85149';
      ctx.font = '10px monospace';
      ctx.fillText(`monster depth  y=${monsterDepth}`, 8, monSY - 4);
      ctx.restore();
    }
  }
}

function drawGrid(W,H) {
  const step = niceStep();
  const tl = s2w(0,0), br = s2w(W,H);
  const x0 = Math.floor(tl.wx/step)*step;
  const y0 = Math.floor(tl.wy/step)*step;

  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let wx=x0; wx<br.wx+step; wx+=step) {
    const {sx} = w2s(wx,0);
    ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx,H); ctx.stroke();
  }
  for (let wy=y0; wy<br.wy+step; wy+=step) {
    const {sy} = w2s(0,wy);
    ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(W,sy); ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.font = '9px monospace';
  for (let wx=x0; wx<br.wx+step; wx+=step) {
    const {sx} = w2s(wx,0);
    if (sx>4 && sx<W-4) ctx.fillText(wx, sx+2, H-5);
  }
  for (let wy=y0; wy<br.wy+step; wy+=step) {
    const {sy} = w2s(0,wy);
    if (sy>14 && sy<H-5) ctx.fillText(wy, 3, sy-2);
  }

  // Origin cross
  const o = w2s(0,0);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(o.sx-12,o.sy); ctx.lineTo(o.sx+12,o.sy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(o.sx,o.sy-12); ctx.lineTo(o.sx,o.sy+12); ctx.stroke();
}

function niceStep() {
  const units = canvas.width / S.view.scale;
  const raw = units / 8;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  return [1,2,5,10].map(f=>f*mag).find(s=>s>=raw) || mag*10;
}

function drawPolygons() {
  const terrainFill = S.palette.terrainFill || '#06101c';
  const rockEdge    = S.palette.rockEdge    || '#38bdf8';

  S.polygons.forEach((poly, pi) => {
    if (poly.hidden) return;
    const isActive = pi === S.selPoly;
    const ac = POLY_COLORS[pi % POLY_COLORS.length];
    if (poly.pts.length < 2) return;

    ctx.save();
    ctx.beginPath();
    poly.pts.forEach((pt,i) => {
      const {sx,sy} = w2s(pt.x, pt.y);
      i===0 ? ctx.moveTo(sx,sy) : ctx.lineTo(sx,sy);
    });
    ctx.closePath();

    // Terrain fill
    ctx.fillStyle = terrainFill;
    ctx.globalAlpha = isActive ? 0.88 : 0.72;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Rock edge glow (wide, soft)
    ctx.strokeStyle = isActive ? ac : rockEdge;
    ctx.lineWidth = 5;
    ctx.globalAlpha = isActive ? 0.22 : 0.12;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Rock edge sharp line
    ctx.lineWidth = isActive ? 2 : 1.5;
    ctx.stroke();

    // Vertex handles
    poly.pts.forEach((pt, pti) => {
      const {sx,sy} = w2s(pt.x, pt.y);
      const isSel = isActive && pti===S.selPt;

      // Halo
      ctx.beginPath(); ctx.arc(sx, sy, isSel ? 11 : 7, 0, Math.PI*2);
      ctx.fillStyle = ac;
      ctx.globalAlpha = isActive ? (isSel ? 0.30 : 0.14) : 0.06;
      ctx.fill(); ctx.globalAlpha = 1;

      // Core dot
      ctx.beginPath(); ctx.arc(sx, sy, isSel ? 5 : 3.5, 0, Math.PI*2);
      ctx.fillStyle = isSel ? '#fff' : (isActive ? ac : rockEdge);
      ctx.fill();
      if (isSel) {
        ctx.strokeStyle = ac; ctx.lineWidth = 2; ctx.stroke();
      }

      // Index label (active poly only)
      if (isActive) {
        ctx.fillStyle = '#e6edf3'; ctx.font = '9px monospace';
        ctx.fillText(pti, sx+7, sy-3);
      }
    });

    // Centroid label
    if (poly.comment) {
      const cx = poly.pts.reduce((s,p)=>s+p.x,0)/poly.pts.length;
      const cy = poly.pts.reduce((s,p)=>s+p.y,0)/poly.pts.length;
      const {sx,sy} = w2s(cx,cy);
      ctx.fillStyle = isActive ? ac : ac+'88';
      ctx.font = (isActive?'bold ':'') + '11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(poly.comment, sx, sy);
      ctx.textAlign = 'left';
    }

    ctx.restore();
  });
}

function drawSegments() {
  S.segments.forEach((seg,i) => {
    const a = w2s(seg.x1,seg.y1), b = w2s(seg.x2,seg.y2);
    ctx.save();
    ctx.strokeStyle = '#ff9966'; ctx.lineWidth = 2.5;
    ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
    ctx.setLineDash([]);
    [a,b].forEach(({sx,sy}) => {
      ctx.beginPath(); ctx.arc(sx,sy,4,0,Math.PI*2); ctx.fillStyle='#ff9966'; ctx.fill();
    });
    const mx=(a.sx+b.sx)/2, my=(a.sy+b.sy)/2;
    ctx.fillStyle='#ff996688'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText(`seg${i}`, mx, my-7); ctx.textAlign='left';
    ctx.restore();
  });
}

function drawHubs() {
  const H = canvas.height, W = canvas.width;
  S.hubs.forEach((hub, hi) => {
    const col = hub.color || '#ffd700';
    const {sx} = w2s(hub.x, 0);
    const baseW = 80;
    const padW  = (hub.width || baseW * S.padScale) * S.view.scale;
    const isHov = S.hoverMarker?.hub === hi || S.dragMarker?.hub === hi;

    ctx.save();
    // Vertical guide
    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.setLineDash([4,4]); ctx.globalAlpha = isHov ? 0.6 : 0.3;
    ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx,H); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;

    // Pad width bar near top of screen
    const barY = 8;
    ctx.fillStyle = col+(isHov?'44':'28'); ctx.fillRect(sx-padW/2, barY, padW, 20);
    ctx.strokeStyle = col; ctx.lineWidth = isHov ? 2 : 1.5; ctx.strokeRect(sx-padW/2, barY, padW, 20);

    // Drag handle ↔ indicator when hovered
    if (isHov) {
      ctx.fillStyle = col; ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText('↔', sx, barY - 2);
    }

    // Labels
    ctx.fillStyle = col; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.fillText(hub.name || 'Hub', sx, barY+13);
    ctx.font = '9px monospace';
    ctx.fillText(`x=${hub.x}${hub.type?' ['+hub.type+']':''}`, sx, barY+30);
    ctx.textAlign = 'left';
    ctx.restore();
  });
}

function drawGravWell() {
  if (!S.gravWell) return;
  const {x, y, radius=100, orbitRadius=0, strength=1} = S.gravWell;
  const {sx,sy} = w2s(x,y);
  const r   = radius      * S.view.scale;
  const orb = orbitRadius * S.view.scale;

  ctx.save();
  // Orbit ring
  if (orb > 1) {
    ctx.beginPath(); ctx.arc(sx,sy,orb,0,Math.PI*2);
    ctx.strokeStyle='#ff66cc44'; ctx.lineWidth=1; ctx.setLineDash([4,6]); ctx.stroke();
    ctx.setLineDash([]);
  }
  // Pull radius glow fill
  const rg = ctx.createRadialGradient(sx,sy,0,sx,sy,r);
  rg.addColorStop(0,'#ff66cc55'); rg.addColorStop(0.6,'#ff66cc1a'); rg.addColorStop(1,'transparent');
  ctx.fillStyle=rg;
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
  // Pull radius ring
  ctx.strokeStyle='#ff66cc'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.stroke();
  // Core
  ctx.beginPath(); ctx.arc(sx,sy,5,0,Math.PI*2); ctx.fillStyle='#ff66cc'; ctx.fill();
  // Labels
  ctx.fillStyle='#ff66cccc'; ctx.font='10px monospace';
  ctx.fillText(`gravity well  str=${strength}`, sx+12, sy+2);
  ctx.fillText(`r=${radius}  orbit=${orbitRadius}`, sx+12, sy+14);
  ctx.restore();
}

function drawSpawnMarkers() {
  spawnLine(S.startX, 'HQ', '#38bdf8', S.hoverMarker==='hq'||S.dragMarker==='hq');
  if (S.collectionX != null)
    spawnLine(S.collectionX, 'Cargo', '#4ade80', S.hoverMarker==='depot'||S.dragMarker==='depot');
}

function spawnLine(worldX, label, color, isHov) {
  const {sx} = w2s(worldX, 0);
  const H = canvas.height;
  ctx.save();
  // Dashed vertical line
  ctx.strokeStyle=color; ctx.lineWidth=1; ctx.setLineDash([3,5]); ctx.globalAlpha=isHov?0.7:0.4;
  ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx,H); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
  // Triangle marker — filled more on hover
  ctx.fillStyle=isHov?color+'88':color+'33'; ctx.strokeStyle=color; ctx.lineWidth=isHov?2:1.5;
  ctx.beginPath(); ctx.moveTo(sx,42); ctx.lineTo(sx-7,52); ctx.lineTo(sx+7,52); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // Labels
  ctx.fillStyle=color; ctx.font='bold 10px monospace'; ctx.textAlign='center';
  ctx.fillText(label, sx, 40);
  if (isHov) ctx.fillText('↔', sx, 30);
  ctx.font='9px monospace';
  ctx.fillText('x='+worldX, sx, 63);
  ctx.textAlign='left';
  ctx.restore();
}

function drawEdgePreview() {
  const ep = S.edgePreview;
  if (!ep) return;
  const poly = S.polygons[ep.pi];
  if (!poly || poly.hidden) return;
  const ac = POLY_COLORS[ep.pi % POLY_COLORS.length];
  const a = poly.pts[ep.edgeIdx], b = poly.pts[(ep.edgeIdx+1) % poly.pts.length];
  const as = w2s(a.x,a.y), bs = w2s(b.x,b.y);
  const {sx,sy} = w2s(ep.pt.x, ep.pt.y);

  ctx.save();
  // Highlight the edge that will be split
  ctx.strokeStyle=ac; ctx.lineWidth=3; ctx.globalAlpha=0.75;
  ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(as.sx,as.sy); ctx.lineTo(bs.sx,bs.sy); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
  // Preview dot
  ctx.beginPath(); ctx.arc(sx,sy,9,0,Math.PI*2);
  ctx.fillStyle=ac+'33'; ctx.fill();
  ctx.beginPath(); ctx.arc(sx,sy,4,0,Math.PI*2);
  ctx.fillStyle=ac; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  // Coordinate label
  ctx.fillStyle=ac; ctx.font='9px monospace'; ctx.textAlign='center';
  ctx.fillText(`${ep.pt.x}, ${ep.pt.y}`, sx, sy-13);
  ctx.textAlign='left';
  ctx.restore();
}

// ── Fit view ──────────────────────────────────────────────────────────────────
function fitView() {
  if (!S.polygons.length) { S.view={x:200,y:150,scale:0.35}; draw(); return; }
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  S.polygons.forEach(p => p.pts.forEach(pt => {
    minX=Math.min(minX,pt.x); maxX=Math.max(maxX,pt.x);
    minY=Math.min(minY,pt.y); maxY=Math.max(maxY,pt.y);
  }));
  // Include OOB surface in vertical range so it's visible
  if (S.oob?.surfaceY != null) maxY = Math.max(maxY, S.oob.surfaceY + 100);
  const pad=80;
  const sw=canvas.width-pad*2, sh=canvas.height-pad*2;
  const scale = Math.min(sw/(maxX-minX||100), sh/(maxY-minY||100), 2);
  S.view.scale = scale;
  S.view.x = pad + (sw-(maxX-minX)*scale)/2 - minX*scale;
  S.view.y = pad + (sh-(maxY-minY)*scale)/2 - minY*scale;
  draw();
}

// ── Mode & Snap ───────────────────────────────────────────────────────────────
function setMode(m) {
  S.mode = m;
  ['select','add','pan'].forEach(id => {
    document.getElementById('m-'+id).className = 'btn' + (id===m?' on':'');
  });
  canvas.style.cursor = m==='pan'?'grab' : m==='add'?'crosshair':'default';
}
setMode('select');

function setSnap(n) {
  S.snap = n;
  [1,10,50,100].forEach(v => document.getElementById('sn'+v).className='btn'+(v===n?' on':''));
  document.getElementById('sdisp').textContent = n;
}

// ── Sidebar rendering ─────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('poly-list');
  list.innerHTML = '';
  S.polygons.forEach((poly, i) => {
    const col = POLY_COLORS[i%POLY_COLORS.length];
    const d = document.createElement('div');
    d.className = 'pitem'+(i===S.selPoly?' active':'');
    d.innerHTML =
      `<div class="pdot" style="background:${col};opacity:${poly.hidden?.4:1}"></div>` +
      `<span class="pname" style="opacity:${poly.hidden?.4:1}">${poly.comment||'Polygon '+(i+1)}</span>` +
      `<span class="pcnt">${poly.pts.length}pt</span>` +
      `<span class="peye" title="toggle visibility" onclick="toggleHide(${i},event)">${poly.hidden?'◌':'●'}</span>`;
    d.onclick = () => { S.selPoly=i; S.selPt=-1; renderSidebar(); renderPtList(); draw(); };
    list.appendChild(d);
  });

  const hasPoly = S.selPoly>=0 && S.selPoly<S.polygons.length;
  document.getElementById('pt-panel').style.display = hasPoly?'':'none';
  if (hasPoly) {
    document.getElementById('poly-rename').value = S.polygons[S.selPoly].comment || '';
    renderPtList();
  }
  document.getElementById('pdisp').textContent =
    hasPoly ? `poly ${S.selPoly+1}/${S.polygons.length}` + (S.selPt>=0?`  pt ${S.selPt}`:'') : '';
}

function renderPtList() {
  const pi = S.selPoly;
  if (pi<0 || pi>=S.polygons.length) return;
  const poly = S.polygons[pi];
  const container = document.getElementById('pt-list');
  container.innerHTML = '';
  poly.pts.forEach((pt, i) => {
    const row = document.createElement('div');
    row.className = 'ptrow'+(i===S.selPt?' sel':'');
    row.innerHTML =
      `<span class="pidx">${i}</span>` +
      `<span class="clabel">x</span><input class="cinput" type="number" value="${Math.round(pt.x)}" onchange="setPt(${pi},${i},'x',this.value)" onclick="event.stopPropagation()">` +
      `<span class="clabel">y</span><input class="cinput" type="number" value="${Math.round(pt.y)}" onchange="setPt(${pi},${i},'y',this.value)" onclick="event.stopPropagation()">` +
      `<span class="xbtn" onclick="deletePt(${pi},${i})">×</span>`;
    row.onclick = e => {
      if (e.target.tagName==='INPUT'||e.target.classList.contains('xbtn')) return;
      S.selPt=i; renderPtList(); renderSidebar(); draw();
    };
    container.appendChild(row);
  });
}

function toggleHide(pi, e) {
  e.stopPropagation();
  S.polygons[pi].hidden = !S.polygons[pi].hidden;
  renderSidebar(); draw();
}

function renameActivePoly(val) {
  if (S.selPoly>=0) S.polygons[S.selPoly].comment = val;
  renderSidebar(); updateOut();
}

function setPt(pi, pti, axis, val) {
  S.polygons[pi].pts[pti][axis] = +val;
  draw(); updateOut();
}

function deletePt(pi, pti) {
  if (S.polygons[pi].pts.length<=3) { alert('Minimum 3 points.'); return; }
  S.polygons[pi].pts.splice(pti,1);
  if (S.selPt>=S.polygons[pi].pts.length) S.selPt=S.polygons[pi].pts.length-1;
  renderSidebar(); renderPtList(); draw(); updateOut();
}

function addPolygon() {
  const cx=S.mouse.wx||500, cy=S.mouse.wy||400;
  S.polygons.push({pts:[{x:cx-60,y:cy},{x:cx+60,y:cy},{x:cx,y:cy-100}], comment:'New polygon', hidden:false});
  S.selPoly=S.polygons.length-1; S.selPt=-1;
  renderSidebar(); draw(); updateOut();
}

function deletePoly() {
  if (S.selPoly<0||!confirm('Delete this polygon?')) return;
  S.polygons.splice(S.selPoly,1);
  S.selPoly=Math.min(S.selPoly,S.polygons.length-1); S.selPt=-1;
  renderSidebar(); draw(); updateOut();
}

function insertAtCursor() {
  if (S.selPoly<0) return;
  const poly = S.polygons[S.selPoly];
  const idx = nearestEdge(poly.pts, S.mouse.wx, S.mouse.wy);
  const proj = projectOntoSeg(S.mouse.wx, S.mouse.wy, poly.pts[idx], poly.pts[(idx+1)%poly.pts.length]);
  poly.pts.splice(idx+1, 0, {x:snap(proj.x), y:snap(proj.y)});
  S.selPt = idx+1;
  renderSidebar(); renderPtList(); draw(); updateOut();
}

// ── Export ────────────────────────────────────────────────────────────────────
function buildOut() {
  const lines = [];
  lines.push(`startX: ${S.startX},`);
  if (S.collectionX != null) lines.push(`collectionX: ${S.collectionX},`);
  if (S.hubs.length) {
    lines.push('deliveryHubs: [');
    S.hubs.forEach((h,i) => {
      const fields = Object.entries(h)
        .map(([k,v]) => `${k}: ${typeof v==='string'?JSON.stringify(v):v}`)
        .join(', ');
      lines.push(`    { ${fields} }${i<S.hubs.length-1?',':''}`);
    });
    lines.push('],');
  }
  lines.push('terrainPolygons: [');
  S.polygons.forEach((poly, pi) => {
    if (poly.comment) lines.push(`    // ${poly.comment}`);
    lines.push('    [');
    poly.pts.forEach((pt,i) => {
      lines.push(`        {x: ${Math.round(pt.x)}, y: ${Math.round(pt.y)}}${i<poly.pts.length-1?',':''}`);
    });
    lines.push(`    ]${pi<S.polygons.length-1?',':''}`);
  });
  lines.push(']');
  return lines.join('\n');
}

function updateOut() { document.getElementById('out').value = buildOut(); }

function copyOut() {
  navigator.clipboard.writeText(document.getElementById('out').value).then(() => {
    const b = document.getElementById('copy-btn');
    b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy',1400);
  });
}

// ── Mouse ─────────────────────────────────────────────────────────────────────
const HIT = 10;
let isPan=false, panLast=null;

function hitPoint(sx,sy) {
  for (let pi=S.polygons.length-1; pi>=0; pi--) {
    if (S.polygons[pi].hidden) continue;
    for (let pti=0; pti<S.polygons[pi].pts.length; pti++) {
      const {sx:px,sy:py} = w2s(S.polygons[pi].pts[pti].x, S.polygons[pi].pts[pti].y);
      if (Math.hypot(sx-px,sy-py)<HIT) return [pi,pti];
    }
  }
  return null;
}

function hitMarker(sx, sy) {
  // Spawn triangles live at screen y 35–65
  if (sy > 30 && sy < 68) {
    const hqSX = w2s(S.startX, 0).sx;
    if (Math.abs(sx-hqSX) < 14) return 'hq';
    if (S.collectionX != null) {
      const depSX = w2s(S.collectionX, 0).sx;
      if (Math.abs(sx-depSX) < 14) return 'depot';
    }
  }
  // Hub bars live at screen y 5–35
  if (sy > 3 && sy < 38) {
    for (let i=0; i<S.hubs.length; i++) {
      const hub=S.hubs[i];
      const hubSX = w2s(hub.x, 0).sx;
      const padW = (hub.width || 80*S.padScale) * S.view.scale;
      if (sx >= hubSX-padW/2-6 && sx <= hubSX+padW/2+6) return {hub:i};
    }
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const sx=e.offsetX, sy=e.offsetY;
  const {wx,wy} = s2w(sx,sy);
  S.mouse.wx=wx; S.mouse.wy=wy;

  if (S.mode==='pan'||e.button===1||e.altKey) {
    isPan=true; panLast={sx,sy}; canvas.style.cursor='grabbing'; return;
  }
  if (S.mode==='add'&&e.button===0&&S.selPoly>=0) {
    const poly=S.polygons[S.selPoly];
    const idx=nearestEdge(poly.pts,wx,wy);
    const proj=projectOntoSeg(wx,wy,poly.pts[idx],poly.pts[(idx+1)%poly.pts.length]);
    poly.pts.splice(idx+1,0,{x:snap(proj.x),y:snap(proj.y)});
    S.selPt=idx+1; S.edgePreview=null;
    renderSidebar(); renderPtList(); draw(); updateOut(); return;
  }
  if (S.mode==='select'&&e.button===0) {
    // Marker drag takes priority over polygon points
    const mhit = hitMarker(sx, sy);
    if (mhit) { S.dragMarker=mhit; return; }

    const hit=hitPoint(sx,sy);
    if (hit) {
      const [pi,pti]=hit;
      S.selPoly=pi; S.selPt=pti; S.dragging=true; S.dragPi=pi; S.dragPti=pti;
      renderSidebar(); renderPtList(); draw();
    } else {
      for (let pi=S.polygons.length-1;pi>=0;pi--) {
        if (!S.polygons[pi].hidden&&inPoly(wx,wy,S.polygons[pi].pts)) {
          S.selPoly=pi; S.selPt=-1; renderSidebar(); renderPtList(); draw(); return;
        }
      }
    }
  }
});

canvas.addEventListener('mousemove', e => {
  const sx=e.offsetX, sy=e.offsetY;
  const {wx,wy}=s2w(sx,sy);
  S.mouse.wx=wx; S.mouse.wy=wy;
  document.getElementById('sx').textContent=Math.round(wx);
  document.getElementById('sy').textContent=Math.round(wy);

  if (isPan&&panLast) {
    S.view.x+=sx-panLast.sx; S.view.y+=sy-panLast.sy; panLast={sx,sy}; draw(); return;
  }

  // Dragging a spawn marker or hub
  if (S.dragMarker) {
    const s=e.shiftKey?S.snap*5:S.snap;
    const snappedX=Math.round(wx/s)*s;
    if (S.dragMarker==='hq') S.startX=snappedX;
    else if (S.dragMarker==='depot') S.collectionX=snappedX;
    else if (S.dragMarker.hub!=null) S.hubs[S.dragMarker.hub].x=snappedX;
    draw(); updateOut(); return;
  }

  // Dragging a polygon vertex
  if (S.dragging&&S.dragPti>=0) {
    const s=e.shiftKey?S.snap*5:S.snap;
    const pt=S.polygons[S.dragPi].pts[S.dragPti];
    pt.x=Math.round(wx/s)*s; pt.y=Math.round(wy/s)*s;
    renderPtList(); draw(); updateOut(); return;
  }

  // Edge preview in Add pts mode
  if (S.mode==='add'&&S.selPoly>=0&&S.selPoly<S.polygons.length) {
    const poly=S.polygons[S.selPoly];
    if (!poly.hidden && poly.pts.length>=2) {
      const idx=nearestEdge(poly.pts,wx,wy);
      const proj=projectOntoSeg(wx,wy,poly.pts[idx],poly.pts[(idx+1)%poly.pts.length]);
      S.edgePreview={pi:S.selPoly, edgeIdx:idx, pt:{x:snap(proj.x),y:snap(proj.y)}};
      draw(); return;
    }
  } else if (S.edgePreview) {
    S.edgePreview=null; draw();
  }

  // Hover detection for marker cursor feedback
  const mhov = hitMarker(sx, sy);
  if (mhov !== S.hoverMarker) {
    S.hoverMarker = mhov;
    canvas.style.cursor = mhov ? 'ew-resize' : (S.mode==='pan'?'grab':S.mode==='add'?'crosshair':'default');
    draw();
  }
});

canvas.addEventListener('mouseup', () => {
  if (isPan){isPan=false;canvas.style.cursor=S.mode==='pan'?'grab':'default';}
  if (S.dragMarker) { S.dragMarker=null; }
  S.dragging=false; S.dragPi=-1; S.dragPti=-1;
});
canvas.addEventListener('mouseleave', () => {
  isPan=false; S.dragging=false; S.dragMarker=null; S.edgePreview=null; draw();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f=e.deltaY<0?1.15:1/1.15;
  const {wx,wy}=s2w(e.offsetX,e.offsetY);
  S.view.scale=Math.max(0.04,Math.min(4,S.view.scale*f));
  S.view.x=e.offsetX-wx*S.view.scale; S.view.y=e.offsetY-wy*S.view.scale;
  draw();
},{passive:false});

// ── Keyboard ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const tag=e.target.tagName;
  if (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  if (e.key==='s') setMode('select');
  if (e.key==='a') setMode('add');
  if (e.key==='p') setMode('pan');
  if (e.key==='f') fitView();
  if ((e.key==='Delete'||e.key==='Backspace')&&S.selPoly>=0&&S.selPt>=0)
    deletePt(S.selPoly,S.selPt);
});

// ── Helpers ───────────────────────────────────────────────────────────────────
const snap = v => Math.round(v/S.snap)*S.snap;

function inPoly(px,py,pts) {
  let inside=false;
  for (let i=0,j=pts.length-1;i<pts.length;j=i++) {
    const {x:xi,y:yi}=pts[i],{x:xj,y:yj}=pts[j];
    if (((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

function distToSeg(px,py,a,b) {
  const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy;
  if (len2===0) return Math.hypot(px-a.x,py-a.y);
  const t=Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/len2));
  return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy));
}

function projectOntoSeg(px,py,a,b) {
  const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy;
  if (len2===0) return {x:a.x,y:a.y};
  const t=Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/len2));
  return {x:a.x+t*dx, y:a.y+t*dy};
}

function nearestEdge(pts,wx,wy) {
  let best=0,bestD=Infinity;
  for (let i=0;i<pts.length;i++) {
    const d=distToSeg(wx,wy,pts[i],pts[(i+1)%pts.length]);
    if (d<bestD){bestD=d;best=i;}
  }
  return best;
}
