<h1>CargoLander — Test Suite</h1>
<p class="subtitle">Self-contained browser test runner — no external dependencies</p>

<div id="summary">Loading tests…</div>
<div id="results"></div>

<!-- Hidden canvas elements the game scripts may look for -->
<canvas id="cargoCanvas" width="1280" height="720"></canvas>
<canvas id="webglCanvas" width="1280" height="720"></canvas>

<script>
// ─── 1. MINIMAL TEST FRAMEWORK ───────────────────────────────────────────────

const _tests   = [];
let _currentCategory = 'Uncategorised';

function category(name) { _currentCategory = name; }

function test(name, fn) {
  _tests.push({ name, fn, category: _currentCategory });
}

function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'Assertion failed');
}

function assertEquals(a, b, msg) {
  if (a !== b) throw new Error((msg ? msg + ': ' : '') + `expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
}

function assertClose(a, b, tolerance, msg) {
  if (typeof tolerance !== 'number') tolerance = 1e-9;
  if (Math.abs(a - b) > tolerance) {
    throw new Error((msg ? msg + ': ' : '') + `expected ${b} ± ${tolerance}, got ${a}`);
  }
}

function assertFinite(v, msg) {
  if (!isFinite(v)) throw new Error((msg || 'Value') + ` is not finite: ${v}`);
}

// ─── 2. BROWSER MOCKS (must exist before loading scripts) ────────────────────

// --- localStorage mock ---
const _lsStore = {};
const mockLocalStorage = {
  getItem:    (k)    => (_lsStore[k] !== undefined ? _lsStore[k] : null),
  setItem:    (k, v) => { _lsStore[k] = String(v); },
  removeItem: (k)    => { delete _lsStore[k]; },
  clear:      ()     => { Object.keys(_lsStore).forEach(k => delete _lsStore[k]); },
};
Object.defineProperty(window, 'localStorage', {
  value: mockLocalStorage, writable: true, configurable: true
});

// --- AudioContext mock ---
class MockAudioNode {
  connect() { return this; }
  disconnect() {}
}
class MockOscillatorNode extends MockAudioNode {
  constructor() {
    super();
    this.type = 'sine';
    this.frequency = { value: 440, setValueAtTime() {}, setTargetAtTime() {}, linearRampToValueAtTime() {} };
    this.detune = { value: 0 };
  }
  start() {}
  stop() {}
}
class MockGainNode extends MockAudioNode {
  constructor() {
    super();
    this.gain = { value: 1, setValueAtTime() {}, setTargetAtTime() {}, linearRampToValueAtTime() {}, exponentialRampToValueAtTime() {} };
  }
}
class MockBiquadFilter extends MockAudioNode {
  constructor() {
    super();
    this.type = 'lowpass';
    this.frequency = { value: 350, setValueAtTime() {}, setTargetAtTime() {}, linearRampToValueAtTime() {} };
    this.Q = { value: 1 };
    this.gain = { value: 0 };
  }
}
class MockBufferSource extends MockAudioNode {
  constructor() {
    super();
    this.buffer = null;
    this.loop = false;
  }
  start() {}
  stop() {}
}
class MockAudioContext {
  constructor() {
    this.currentTime = 0;
    this.destination = new MockAudioNode();
    this.state = 'running';
  }
  createOscillator()       { return new MockOscillatorNode(); }
  createGain()             { return new MockGainNode(); }
  createBiquadFilter()     { return new MockBiquadFilter(); }
  createBufferSource()     { return new MockBufferSource(); }
  createBuffer(ch, len, sr){ return { getChannelData: () => new Float32Array(len) }; }
  resume()                 { return Promise.resolve(); }
}
window.AudioContext = MockAudioContext;

// --- document.getElementById mock ---
// Return real canvas elements for known IDs; light stubs for everything else.
const _realGetById = document.getElementById.bind(document);
document.getElementById = function(id) {
  const real = _realGetById(id);
  if (real) return real;
  // DOM stubs for UI elements game scripts touch
  return {
    id,
    style:          { display: 'none', setProperty() {} },
    classList:      { add() {}, remove() {}, contains() { return false; } },
    textContent:    '',
    innerHTML:      '',
    value:          '',
    checked:        false,
    addEventListener() {},
    getBoundingClientRect() { return { left: 0, top: 0, width: 1280, height: 720 }; },
    getContext(type) {
      if (type === '2d') {
        // Minimal Canvas2D stub
        return _makeCanvas2DStub();
      }
      // WebGL: return null so ShaderOverlay handles missing WebGL gracefully
      return null;
    }
  };
};

function _makeCanvas2DStub() {
  const noop = () => {};
  const stub = {
    save: noop, restore: noop, translate: noop, rotate: noop, scale: noop,
    fillRect: noop, strokeRect: noop, clearRect: noop, beginPath: noop,
    moveTo: noop, lineTo: noop, closePath: noop, fill: noop, stroke: noop,
    arc: noop, arcTo: noop, quadraticCurveTo: noop, bezierCurveTo: noop,
    fillText: noop, strokeText: noop, measureText: () => ({ width: 50 }),
    createLinearGradient: () => ({
      addColorStop: noop,
    }),
    createRadialGradient: () => ({
      addColorStop: noop,
    }),
    drawImage: noop, clip: noop, setTransform: noop, resetTransform: noop,
    createPattern: () => ({}),
    fillStyle: '#000', strokeStyle: '#000', lineWidth: 1,
    globalAlpha: 1, globalCompositeOperation: 'source-over',
    textAlign: 'left', textBaseline: 'alphabetic', font: '10px sans-serif',
    shadowBlur: 0, shadowColor: '#000', shadowOffsetX: 0, shadowOffsetY: 0,
    lineCap: 'butt', lineJoin: 'miter',
  };
  return stub;
}

// Patch the real canvas elements to return stubs too
(function patchRealCanvases() {
  ['cargoCanvas', 'webglCanvas'].forEach(id => {
    const el = _realGetById(id);
    if (!el) return;
    const _origGetCtx = el.getContext.bind(el);
    el.getContext = function(type, ...args) {
      if (type === '2d')    return _makeCanvas2DStub();
      if (type === 'webgl') return null; // Force ShaderOverlay into null-gl path
      return _origGetCtx(type, ...args);
    };
    // Provide width/height
    if (!el.width)  el.width  = 1280;
    if (!el.height) el.height = 720;
    el.addEventListener = el.addEventListener || (() => {});
    el.getBoundingClientRect = el.getBoundingClientRect || (() => ({ left: 0, top: 0, width: 1280, height: 720 }));
  });
})();

// Stub window properties the game reads
window.innerWidth  = window.innerWidth  || 1280;
window.innerHeight = window.innerHeight || 720;

// Stub requestAnimationFrame so game.init() doesn't kick off a real loop
const _realRAF = window.requestAnimationFrame;
window.requestAnimationFrame = (cb) => {
  // Do NOT call cb — just return a fake ID
  return 1;
};

// Stub confirm() so career reset tests don't block
window.confirm = () => true;

// ShaderOverlay is stubbed out between shaders.js and game.js (see script tags below)
// so that game.init() never calls real WebGL APIs.
</script>

<!--
  Load game scripts in the required order.
  ShaderOverlay is replaced with a no-op stub after shaders.js loads so that
  game.js's `new ShaderOverlay('webglCanvas')` never touches real WebGL APIs.
  CargoAudio will use our MockAudioContext.
  CargoGame constructor reads localStorage (our mock) and creates CargoPhysics.
  'game' singleton is created but init() is NOT called here — tests call it explicitly.
-->
<script src="audio.js"></script>
<script src="shaders.js"></script>
<script>
// Patch ShaderOverlay so it gracefully handles null WebGL context.
// top-level `class` in shaders.js creates a non-reassignable lexical binding,
// so we cannot replace `window.ShaderOverlay`. Instead we patch the prototype
// methods and the constructor chain to no-op when this.gl is null.
(function patchShaderOverlay() {
  const proto = ShaderOverlay.prototype;

  // Guard initShaders and initBuffers — called from constructor
  const _initShaders = proto.initShaders;
  proto.initShaders = function() {
    if (!this.gl) return; // skip if no WebGL context
    return _initShaders.call(this);
  };

  const _initBuffers = proto.initBuffers;
  proto.initBuffers = function() {
    if (!this.gl) return;
    return _initBuffers.call(this);
  };

  // Guard resize — called after init()
  const _resize = proto.resize;
  proto.resize = function(w, h) {
    if (!this.gl) return;
    return _resize.call(this, w, h);
  };

  // Guard render — called every frame
  const _render = proto.render;
  proto.render = function(physics, camera) {
    if (!this.gl) return;
    return _render.call(this, physics, camera);
  };
})();
</script>
<script src="physics.js"></script>
<script src="game.js"></script>

<script>
// ─── 3. HELPER: build a minimal input-state object for physics.update() ──────
function makeInput(overrides) {
  return Object.assign({
    up: false, down: false, left: false, right: false,
    mouseLeft: false, mouseRight: false,
    q: false, e: false,
    mouseX: 0, mouseY: 0,
  }, overrides);
}

// Build a minimal level config that matches what CargoPhysics.initLevel() needs.
// We use levels[0] from the real game data when available, otherwise this fallback.
function getLevel0() {
  return (typeof levels !== 'undefined' && levels[0]) ? levels[0] : {
    name: 'Test Level', gravity: 0.15, wind: 0,
    terrainType: 'flat', targetCargo: 2, budget: 1000, timeLimit: 180,
    allowedTypes: ['normal'],
    deliveryHubs: [{ x: 750, color: '#38bdf8', type: 'normal', name: 'Hub' }],
    palette: { skyTop:'#000', skyMid:'#000', skyBot:'#000', terrainFill:'#111', rockEdge:'#22c55e', rockGlow:'rgba(34,197,94,' },
    quests: []
  };
}

// ─── 4. TEST DEFINITIONS ─────────────────────────────────────────────────────

// ── A. LEVEL DEFINITIONS ─────────────────────────────────────────────────────
category('A. Level Definitions');

test('levels array exists and is accessible', () => {
  assert(typeof levels !== 'undefined', 'levels is not defined');
  assert(Array.isArray(levels), 'levels should be an array');
});

test('exactly 5 levels exist', () => {
  assertEquals(levels.length, 5, 'levels.length');
});

const REQUIRED_LEVEL_FIELDS = ['name', 'targetCargo', 'deliveryHubs', 'palette', 'gravity', 'terrainType', 'budget', 'timeLimit'];

levels && levels.forEach((level, i) => {
  test(`level[${i}] "${level.name}" has required fields`, () => {
    for (const field of REQUIRED_LEVEL_FIELDS) {
      assert(field in level, `level[${i}] missing field: ${field}`);
    }
  });

  test(`level[${i}] palette has all required color fields`, () => {
    const req = ['skyTop', 'skyMid', 'skyBot', 'terrainFill', 'rockEdge', 'rockGlow'];
    for (const f of req) {
      assert(f in level.palette, `level[${i}].palette missing: ${f}`);
      assert(typeof level.palette[f] === 'string', `level[${i}].palette.${f} should be a string`);
    }
  });

  test(`level[${i}] deliveryHubs is non-empty`, () => {
    assert(Array.isArray(level.deliveryHubs), 'deliveryHubs should be an array');
    assert(level.deliveryHubs.length >= 1, `level[${i}] should have at least 1 deliveryHub`);
  });

  test(`level[${i}] targetCargo is a positive integer`, () => {
    assert(Number.isInteger(level.targetCargo), `targetCargo should be an integer`);
    assert(level.targetCargo > 0, 'targetCargo should be positive');
  });

  test(`level[${i}] rockGlow is a partial rgba string`, () => {
    assert(level.palette.rockGlow.startsWith('rgba('), `rockGlow should start with 'rgba('`);
    assert(level.palette.rockGlow.endsWith(','), `rockGlow should end with ','`);
  });
});

test('level IDs / names are unique', () => {
  const names = levels.map(l => l.name);
  const unique = new Set(names);
  assertEquals(unique.size, names.length, 'level names should be unique');
});

// ── B. UPGRADE CATALOG ───────────────────────────────────────────────────────
category('B. Upgrade Catalog');

test('upgradeCatalog exists and is accessible', () => {
  assert(typeof upgradeCatalog !== 'undefined', 'upgradeCatalog is not defined');
  assert(Array.isArray(upgradeCatalog), 'upgradeCatalog should be an array');
});

test('exactly 6 upgrades in catalog', () => {
  assertEquals(upgradeCatalog.length, 6, 'upgradeCatalog.length');
});

test('total maxLevel across all upgrades equals 15', () => {
  const total = upgradeCatalog.reduce((s, u) => s + u.maxLevel, 0);
  assertEquals(total, 15, 'sum of maxLevel');
});

test('each upgrade has id, name, maxLevel, basePrice, desc', () => {
  for (const u of upgradeCatalog) {
    assert(typeof u.id       === 'string' && u.id.length > 0, `upgrade missing id`);
    assert(typeof u.name     === 'string' && u.name.length > 0, `upgrade ${u.id} missing name`);
    assert(typeof u.maxLevel === 'number' && u.maxLevel >= 1, `upgrade ${u.id} invalid maxLevel`);
    assert(typeof u.basePrice === 'number' && u.basePrice > 0, `upgrade ${u.id} invalid basePrice`);
    assert(typeof u.desc     === 'string' && u.desc.length > 0, `upgrade ${u.id} missing desc`);
  }
});

test('upgrade IDs are unique', () => {
  const ids = upgradeCatalog.map(u => u.id);
  assertEquals(new Set(ids).size, ids.length, 'upgrade ids should be unique');
});

test('known upgrade IDs present', () => {
  const ids = upgradeCatalog.map(u => u.id);
  for (const expected of ['thrusterEfficiency', 'boostMode', 'magneticDeck', 'winchExtender', 'hullPlating', 'shieldRegen']) {
    assert(ids.includes(expected), `upgrade '${expected}' not found in catalog`);
  }
});

// ── C. CargoPhysics ──────────────────────────────────────────────────────────
category('C. CargoPhysics');

test('CargoPhysics can be instantiated', () => {
  const p = new CargoPhysics();
  assert(p instanceof CargoPhysics, 'should be an instance of CargoPhysics');
});

test('CargoPhysics has correct default properties', () => {
  const p = new CargoPhysics();
  assertClose(p.gravity, 0.15, 1e-9, 'default gravity');
  assertEquals(p.wind, 0, 'default wind');
  assert(Array.isArray(p.terrainPoints), 'terrainPoints should be array');
  assert(Array.isArray(p.boxes),         'boxes should be array');
  assert(Array.isArray(p.particles),     'particles should be array');
  assert(Array.isArray(p.deliveryHubs),  'deliveryHubs should be array');
  assertEquals(p.lander, null, 'lander should be null before init');
});

test('initLevel populates terrainPoints (> 10 points)', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  assert(p.terrainPoints.length > 10, `terrainPoints.length should be > 10, got ${p.terrainPoints.length}`);
});

test('getTerrainHeight returns finite numbers across the level', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  for (let x = 0; x <= 1600; x += 100) {
    const y = p.getTerrainHeight(x);
    assertFinite(y, `getTerrainHeight(${x})`);
    assert(!isNaN(y), `getTerrainHeight(${x}) is NaN`);
  }
});

test('getTerrainHeight is consistent (same x, same y)', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  for (const x of [0, 200, 800, 1400, 1600]) {
    const y1 = p.getTerrainHeight(x);
    const y2 = p.getTerrainHeight(x);
    assertEquals(y1, y2, `getTerrainHeight(${x}) should be deterministic`);
  }
});

test('getTerrainHeight within reasonable bounds (not Infinity, not 0)', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  for (let x = 0; x <= 1600; x += 50) {
    const y = p.getTerrainHeight(x);
    assert(y > 0 && y < 5000, `getTerrainHeight(${x}) = ${y} is out of plausible range`);
  }
});

test('getTerrainHeight at negative x returns finite number', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  assertFinite(p.getTerrainHeight(-100), 'getTerrainHeight(-100)');
  assertFinite(p.getTerrainHeight(-500), 'getTerrainHeight(-500)');
});

test('getTerrainHeight beyond levelWidth returns finite number', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  assertFinite(p.getTerrainHeight(1700), 'getTerrainHeight(1700)');
  assertFinite(p.getTerrainHeight(2200), 'getTerrainHeight(2200)');
});

test('lander is initialized after initLevel', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  assert(p.lander !== null, 'lander should not be null after initLevel');
});

test('lander has required fields after initLevel', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  const l = p.lander;
  const required = ['x', 'y', 'vx', 'vy', 'fuel', 'angle', 'width', 'height',
                    'deckWidth', 'deckOffset', 'basketHeight', 'maxFuel',
                    'integrity', 'maxIntegrity', 'crashed', 'landed', 'vehicleType',
                    'enginePower', 'strafePower'];
  for (const f of required) {
    assert(f in l, `lander missing field: ${f}`);
  }
});

test('lander starts with correct defaults', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  const l = p.lander;
  assertClose(l.vx, 0, 1e-9, 'initial vx');
  assertClose(l.vy, 0, 1e-9, 'initial vy');
  assertClose(l.angle, 0, 1e-9, 'initial angle');
  assertEquals(l.crashed, false, 'initial crashed');
  assertEquals(l.deckWidth, 56, 'deckWidth');
  assertEquals(l.deckOffset, 12, 'deckOffset');
  assertEquals(l.basketHeight, 24, 'basketHeight');
  assertEquals(l.fuel, 100, 'initial fuel');
  assertEquals(l.maxFuel, 100, 'maxFuel');
});

test('startDepot is set after initLevel', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  assert(p.startDepot !== null && typeof p.startDepot === 'object', 'startDepot should be set');
  assert('x' in p.startDepot && 'y' in p.startDepot, 'startDepot needs x,y');
  assert('width' in p.startDepot && 'height' in p.startDepot, 'startDepot needs width,height');
  assertFinite(p.startDepot.y, 'startDepot.y');
});

test('collectionPoint is set after initLevel', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  assert(p.collectionPoint !== null && typeof p.collectionPoint === 'object', 'collectionPoint should be set');
  assert('x' in p.collectionPoint && 'y' in p.collectionPoint, 'collectionPoint needs x,y');
  assertFinite(p.collectionPoint.y, 'collectionPoint.y');
});

test('deliveryHubs array is populated after initLevel', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  assert(Array.isArray(p.deliveryHubs), 'deliveryHubs should be array');
  assert(p.deliveryHubs.length >= 1, 'should have at least 1 delivery hub');
  for (const hub of p.deliveryHubs) {
    assert('x' in hub && 'y' in hub, 'each hub needs x and y');
    assertFinite(hub.y, 'hub.y');
  }
});

test('monster starts null before any OOB', () => {
  const p = new CargoPhysics();
  p.initLevel(getLevel0(), 1280, 720);
  assertEquals(p.monster, null, 'monster should be null initially');
});

test('physics.update() runs 10 frames without throwing', () => {
  const p = new CargoPhysics();
  const lvl = getLevel0();
  p.initLevel(lvl, 1280, 720);
  const input = makeInput();
  for (let i = 0; i < 10; i++) {
    p.update(1.0, lvl, input);
  }
  // No exception = pass
});

test('without thrust, lander vy increases each frame (gravity)', () => {
  const p = new CargoPhysics();
  const lvl = getLevel0();
  p.initLevel(lvl, 1280, 720);
  // Lift lander well off the ground so collisions don't interfere
  p.lander.y = 200;
  p.lander.landed = false;
  const before = p.lander.vy;
  p.update(1.0, lvl, makeInput({ up: false }));
  assert(p.lander.vy > before, `vy should increase due to gravity: was ${before}, now ${p.lander.vy}`);
});

test('with thrust input, lander vy decreases (goes up)', () => {
  const p = new CargoPhysics();
  const lvl = Object.assign({}, getLevel0(), { vehicle: 'basic' });
  p.initLevel(lvl, 1280, 720);
  p.lander.vehicleType = 'basic';
  p.lander.y = 400;
  p.lander.landed = false;
  // Prime engine power over several frames with thrust
  for (let i = 0; i < 30; i++) {
    p.update(1.0, lvl, makeInput({ up: true }));
  }
  // After 30 frames of thrust, lander should be moving upward (vy < 0)
  assert(p.lander.vy < 0, `vy should be negative after thrust: got ${p.lander.vy}`);
});

test('fuel decreases when thrusting', () => {
  const p = new CargoPhysics();
  const lvl = Object.assign({}, getLevel0(), { vehicle: 'basic' });
  p.initLevel(lvl, 1280, 720);
  p.lander.vehicleType = 'basic';
  p.lander.y = 400;
  p.lander.landed = false;
  const fuelBefore = p.lander.fuel;
  for (let i = 0; i < 30; i++) {
    p.update(1.0, lvl, makeInput({ up: true }));
  }
  assert(p.lander.fuel < fuelBefore, `fuel should decrease when thrusting: was ${fuelBefore}, now ${p.lander.fuel}`);
});

test('fuel does not decrease when not thrusting', () => {
  const p = new CargoPhysics();
  const lvl = getLevel0();
  p.initLevel(lvl, 1280, 720);
  // Hover the lander in the air without thrust
  p.lander.y = 300;
  p.lander.landed = false;
  const fuelBefore = p.lander.fuel;
  for (let i = 0; i < 10; i++) {
    p.update(1.0, lvl, makeInput());
  }
  assertEquals(p.lander.fuel, fuelBefore, 'fuel should not change without thrust');
});

test('lander does not fall below terrain after 60 simulated frames', () => {
  const p = new CargoPhysics();
  const lvl = getLevel0();
  p.initLevel(lvl, 1280, 720);
  const input = makeInput();
  for (let i = 0; i < 60; i++) {
    p.update(1.0, lvl, input);

// Helper: compute rank score the same way the game does
function computeRankScore(upgrades, highscores) {
  const maxUpgrades = upgradeCatalog.reduce((s, u) => s + u.maxLevel, 0); // 13
  const ownedLevels = upgradeCatalog.reduce((s, u) => s + (upgrades[u.id] || 0), 0);
  const upgScore = ownedLevels / maxUpgrades;
  const levelsMastered = levels.filter((_, i) => (highscores[i] || 0) >= 5000).length;
  const masterScore = levelsMastered / levels.length;
  return upgScore * 0.55 + masterScore * 0.45;
}

test('score formula matches specification', () => {
  // No upgrades, no mastered levels -> score = 0
  assertClose(computeRankScore({}, {}), 0.0, 1e-9, 'score with nothing');
  // All upgrades, no mastered
  const allUpg = { thrusterEfficiency: 3, boostMode: 3, magneticDeck: 2, winchExtender: 2, hullPlating: 3, shieldRegen: 2 };
  assertClose(computeRankScore(allUpg, {}), 0.55, 1e-9, 'score with max upgrades');
  // No upgrades, all mastered
  const allHigh = { 0: 9999, 1: 9999, 2: 9999, 3: 9999, 4: 9999 };
  assertClose(computeRankScore({}, allHigh), 0.45, 1e-9, 'score with all mastered');
  // Both maxed
  assertClose(computeRankScore(allUpg, allHigh), 1.0, 1e-9, 'score with everything maxed');
});

  // Temporarily set game state to all zeros and call updatePilotRank
  const g = new CargoGame();
  g.upgrades = { thrusterEfficiency: 0, boostMode: 0, magneticDeck: 0, winchExtender: 0, hullPlating: 0, shieldRegen: 0 };
  g.highscores = {};
  // updatePilotRank sets textContent via setText() which calls getElementById(id)
  // The mock just captures calls; we verify the logic via the score thresholds:
  const score = computeRankScore(g.upgrades, g.highscores);
  assertEquals(score, 0, 'score should be 0 with no progress');
  // rank = 'Rookie Hauler', tier = 'CLASS F' at score < 0.01
  assert(score < 0.01, 'score below CLASS F threshold');
});

test('rank improves as upgrades are added', () => {
  function rankFor(upgCount) {
    const upgrades = {};
    upgradeCatalog.forEach(u => { upgrades[u.id] = 0; });
    // Add levels one by one to whichever upgrade has room
    let added = 0;
    for (const u of upgradeCatalog) {
      while (upgrades[u.id] < u.maxLevel && added < upgCount) {
        upgrades[u.id]++;
        added++;
      }
    }
    return computeRankScore(upgrades, {});
  }
  const s0 = rankFor(0);
  const s7 = rankFor(7);
  const s13 = rankFor(13);
  assert(s0 < s7, 'score should increase with upgrades');
  assert(s7 < s13, 'score should keep increasing with more upgrades');
});

test('tier thresholds produce correct rank strings', () => {
  const thresholds = [
    { score: 0.00, tier: 'CLASS F' },
    { score: 0.01, tier: 'CLASS E' },
    { score: 0.12, tier: 'CLASS D' },
    { score: 0.30, tier: 'CLASS C' },
    { score: 0.50, tier: 'CLASS B' },
    { score: 0.70, tier: 'CLASS A' },
    { score: 0.90, tier: 'CLASS S' },
  ];
  for (const { score, tier } of thresholds) {
    let actualTier;
    if      (score >= 0.90) actualTier = 'CLASS S';
    else if (score >= 0.70) actualTier = 'CLASS A';
    else if (score >= 0.50) actualTier = 'CLASS B';
    else if (score >= 0.30) actualTier = 'CLASS C';
    else if (score >= 0.12) actualTier = 'CLASS D';
    else if (score >= 0.01) actualTier = 'CLASS E';
    else                    actualTier = 'CLASS F';
    assertEquals(actualTier, tier, `score ${score} → ${tier}`);
  }
});

  CargoAudio.setThruster(0.5);
  CargoAudio.setThruster(0);
  CargoAudio.playLoad();
  CargoAudio.playUnload();
  CargoAudio.playCollision(5);
  CargoAudio.playCrash();
  CargoAudio.setWarning(true);
  CargoAudio.setWarning(false);
  CargoAudio.playSuccess();
  CargoAudio.setMuted(true); // restore
});

// ─── 5. RUN TESTS AND RENDER RESULTS ─────────────────────────────────────────
(function runTests() {
  let passed = 0, failed = 0, skipped = 0;
  const byCategory = {};

  for (const t of _tests) {
    if (!byCategory[t.category]) byCategory[t.category] = [];
    let status = 'pass', error = null;
    try {
      t.fn();
      passed++;
    } catch (e) {
      status = 'fail';
      error = e.stack || e.message || String(e);
      failed++;
      console.error(`[TEST FAILURE] Category: "${t.category}", Test: "${t.name}"\nError: ${error}`);
    }
    byCategory[t.category].push({ name: t.name, status, error });
  }

  // Build summary
  const summaryEl = document.getElementById('summary');
  summaryEl.innerHTML =
    `Tests complete — ` +
    `<span class="pass">${passed} passed</span> / ` +
    `<span class="fail">${failed} failed</span>` +
    (skipped ? ` / <span class="skip">${skipped} skipped</span>` : '') +
    ` out of ${_tests.length} total`;

  // Build results
  const resultsEl = document.getElementById('results');
  for (const [cat, tests] of Object.entries(byCategory)) {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    catDiv.innerHTML = `<h2>${cat}</h2>`;
    for (const t of tests) {
      const row = document.createElement('div');
      row.className = 'test-row';
      row.innerHTML =
        `<span class="badge ${t.status}">${t.status.toUpperCase()}</span>` +
        `<span class="test-name">${t.name}</span>` +
        (t.error ? `<span class="test-err">${t.error.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>` : '');
      catDiv.appendChild(row);
    }
    resultsEl.appendChild(catDiv);
  }

  // Also log to console for CI-style inspection
  console.log(`[CargoLander Tests] ${passed}/${_tests.length} passed, ${failed} failed`);
  if (failed > 0) {
    console.error(`[CargoLander Tests] ${failed} test(s) failed`);
  }
})();
</script>
