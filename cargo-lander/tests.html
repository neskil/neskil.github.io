<script>
// ─── 1. MINIMAL TEST FRAMEWORK ───────────────────────────────────────────────

const _tests   = [];
let _currentCategory = 'Uncategorised';

function category(name) { _currentCategory = name; }

function test(name, fn) {
  _tests.push({ name, fn, category: _currentCategory });
}

function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'Assertion failed');
}

function assertEquals(a, b, msg) {
  if (a !== b) throw new Error((msg ? msg + ': ' : '') + `expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
}

function assertClose(a, b, tolerance, msg) {
  if (typeof tolerance !== 'number') tolerance = 1e-9;
  if (Math.abs(a - b) > tolerance) {
    throw new Error((msg ? msg + ': ' : '') + `expected ${b} ± ${tolerance}, got ${a}`);
  }
}

function assertFinite(v, msg) {
  if (!isFinite(v)) throw new Error((msg || 'Value') + ` is not finite: ${v}`);
}

// ─── 2. BROWSER MOCKS (must exist before loading scripts) ────────────────────

// --- localStorage mock ---
const _lsStore = {};
const mockLocalStorage = {
  getItem:    (k)    => (_lsStore[k] !== undefined ? _lsStore[k] : null),
  setItem:    (k, v) => { _lsStore[k] = String(v); },
  removeItem: (k)    => { delete _lsStore[k]; },
  clear:      ()     => { Object.keys(_lsStore).forEach(k => delete _lsStore[k]); },
};
Object.defineProperty(window, 'localStorage', {
  value: mockLocalStorage, writable: true, configurable: true
});

// --- AudioContext mock ---
class MockAudioParam {
  constructor(initialValue = 0) {
    this.value = initialValue;
  }
  setValueAtTime(val) { this.value = val; return this; }
  setTargetAtTime(val) { this.value = val; return this; }
  linearRampToValueAtTime(val) { this.value = val; return this; }
  exponentialRampToValueAtTime(val) { this.value = val; return this; }
}

class MockAudioNode {
  connect() { return this; }
  disconnect() {}
}
class MockOscillatorNode extends MockAudioNode {
  constructor() {
    super();
    this.type = 'sine';
    this.frequency = new MockAudioParam(440);
    this.detune = new MockAudioParam(0);
  }
  start() {}
  stop() {}
}
class MockGainNode extends MockAudioNode {
  constructor() {
    super();
    this.gain = new MockAudioParam(1);
  }
}
class MockBiquadFilter extends MockAudioNode {
  constructor() {
    super();
    this.type = 'lowpass';
    this.frequency = new MockAudioParam(350);
    this.Q = new MockAudioParam(1);
    this.gain = new MockAudioParam(0);
  }
}
class MockBufferSource extends MockAudioNode {
  constructor() {
    super();
    this.buffer = null;
    this.loop = false;
  }
  start() {}
  stop() {}
}
class MockAudioContext {
  constructor() {
    this.currentTime = 0;
    this.destination = new MockAudioNode();
    this.state = 'running';
  }
  createOscillator()       { return new MockOscillatorNode(); }
  createGain()             { return new MockGainNode(); }
  createBiquadFilter()     { return new MockBiquadFilter(); }
  createBufferSource()     { return new MockBufferSource(); }
  createBuffer(ch, len, sr){ return { getChannelData: () => new Float32Array(len) }; }
  resume()                 { return Promise.resolve(); }
}
window.AudioContext = MockAudioContext;

// --- document.getElementById mock ---
// Return real canvas elements for known IDs; light stubs for everything else.
const _realGetById = document.getElementById.bind(document);
document.getElementById = function(id) {
  const real = _realGetById(id);
  if (real) return real;
  // DOM stubs for UI elements game scripts touch
  return {
    id,
    style:          { display: 'none', setProperty() {} },
    classList:      { add() {}, remove() {}, toggle() {}, contains() { return false; } },
    dataset:        {},
    textContent:    '',
    innerHTML:      '',
    value:          '',
    checked:        false,
    children:       [],
    firstChild:     null,
    addEventListener() {},
    appendChild(child) { return child; },
    removeChild(child) { return child; },
    insertBefore(child) { return child; },
    remove() {},
    querySelector() { return null; },
    querySelectorAll() { return []; },
    setAttribute() {},
    getAttribute() { return null; },
    getBoundingClientRect() { return { left: 0, top: 0, width: 1280, height: 720 }; },
    getContext(type) {
      if (type === '2d') {
        // Minimal Canvas2D stub
        return _makeCanvas2DStub();
      }
      // WebGL: return null so ShaderOverlay handles missing WebGL gracefully
      return null;
    }
  };
};

function _makeCanvas2DStub() {
  const noop = () => {};
  const stub = {
    save: noop, restore: noop, translate: noop, rotate: noop, scale: noop,
    fillRect: noop, strokeRect: noop, clearRect: noop, beginPath: noop,
    moveTo: noop, lineTo: noop, closePath: noop, fill: noop, stroke: noop,
    arc: noop, arcTo: noop, ellipse: noop, roundRect: noop, rect: noop,
    quadraticCurveTo: noop, bezierCurveTo: noop, setLineDash: noop, getLineDash: () => [],
    fillText: noop, strokeText: noop, measureText: () => ({ width: 50 }),
    createLinearGradient: () => ({
      addColorStop: noop,
    }),
    createRadialGradient: () => ({
      addColorStop: noop,
    }),
    drawImage: noop, clip: noop, setTransform: noop, resetTransform: noop,
    createPattern: () => ({}),
    fillStyle: '#000', strokeStyle: '#000', lineWidth: 1,
    globalAlpha: 1, globalCompositeOperation: 'source-over',
    textAlign: 'left', textBaseline: 'alphabetic', font: '10px sans-serif',
    shadowBlur: 0, shadowColor: '#000', shadowOffsetX: 0, shadowOffsetY: 0,
    lineCap: 'butt', lineJoin: 'miter',
  };
  return stub;
}

// Patch the real canvas elements to return stubs too
(function patchRealCanvases() {
  ['cargoCanvas', 'webglCanvas'].forEach(id => {
    const el = _realGetById(id);
    if (!el) return;
    const _origGetCtx = el.getContext.bind(el);
    el.getContext = function(type, ...args) {
      if (type === '2d')    return _makeCanvas2DStub();
      if (type === 'webgl') return null; // Force ShaderOverlay into null-gl path
      return _origGetCtx(type, ...args);
    };
    // Provide width/height
    if (!el.width)  el.width  = 1280;
    if (!el.height) el.height = 720;
    el.addEventListener = el.addEventListener || (() => {});
    el.getBoundingClientRect = el.getBoundingClientRect || (() => ({ left: 0, top: 0, width: 1280, height: 720 }));
  });
})();

// Stub window properties the game reads
window.innerWidth  = window.innerWidth  || 1280;
window.innerHeight = window.innerHeight || 720;

// Stub requestAnimationFrame so game.init() doesn't kick off a real loop
const _realRAF = window.requestAnimationFrame;
window.requestAnimationFrame = (cb) => {
  // Do NOT call cb — just return a fake ID
  return 1;
};

// Stub confirm() so career reset tests don't block
window.confirm = () => true;

// ShaderOverlay is stubbed out between shaders.js and game.js (see script tags below)
// so that game.init() never calls real WebGL APIs.
</script>

<script>
// Patch ShaderOverlay so it gracefully handles null WebGL context.
// top-level `class` in shaders.js creates a non-reassignable lexical binding,
// so we cannot replace `window.ShaderOverlay`. Instead we patch the prototype
// methods and the constructor chain to no-op when this.gl is null.
(function patchShaderOverlay() {
  const proto = ShaderOverlay.prototype;

  // Guard initShaders and initBuffers — called from constructor
  const _initShaders = proto.initShaders;
  proto.initShaders = function() {
    if (!this.gl) return; // skip if no WebGL context
    return _initShaders.call(this);
  };

  const _initBuffers = proto.initBuffers;
  proto.initBuffers = function() {
    if (!this.gl) return;
    return _initBuffers.call(this);
  };

  // Guard resize — called after init()
  const _resize = proto.resize;
  proto.resize = function(w, h) {
    if (!this.gl) return;
    return _resize.call(this, w, h);
  };

  // Guard render — called every frame
  const _render = proto.render;
  proto.render = function(physics, camera) {
    if (!this.gl) return;
    return _render.call(this, physics, camera);
  };
})();
</script>

// ─── 4. BEHAVIORAL SMOKE TESTS ───────────────────────────────────────────────
category('Behavioral Smoke Tests');

let testGame;

test('Engine Initialization', () => {
  mockLocalStorage.clear();
  testGame = new CargoGame();
  
  // Initialize game (this should set up rendering and physics)
  // requestAnimationFrame is mocked so it won't actually loop automatically
  testGame.init('cargoCanvas');
  
  assert(testGame.physics != null, 'Game physics should be initialized');
});

test('Level Loading', () => {
  assert(levels && levels.length > 0, 'Levels should exist to be tested');
  
  // Load each level sequentially
  for (let i = 0; i < levels.length; i++) {
    testGame.startLevel(i);
    assert(testGame.currentLevelIndex === i, 'Game should successfully load level ' + i);
    assert(testGame.physics.lander != null, 'Lander should be spawned for level ' + i);
  }
});

test('Update Loop Simulation', () => {
  // Run the update loop for the last loaded level for several frames
  for (let i = 0; i < 100; i++) {
    // 16ms delta time
    testGame.update(16);
  }
  // If no error is thrown, this test passes
});

test('Input Simulation - Movement', () => {
  // Simulate thrusters and rotation
  const mockKeys = ['ArrowUp', 'ArrowLeft', 'ArrowRight', 'ArrowDown'];
  
  mockKeys.forEach(k => {
    window.dispatchEvent(new KeyboardEvent('keydown', { key: k }));

test('Level Restart & State Cleanup', () => {
  // Simulate player restarting the level
  testGame.startLevel(testGame.currentLevelIndex);

  // Ensure we can run an update tick immediately after restart without crashes
  testGame.update(16);
});

test('Big Cargo — deck single-load capacity', () => {
  // Big/oversized crates (spawnCargo(..., {big: true})) should claim the
  // entire basic-lander deck: once one is attached, no other box (big or
  // normal) can also attach until it's removed. Level 1 uses the basic
  // vehicle, so it exercises the multi-box deck path.
  testGame.startLevel(0);
  const p = testGame.physics;
  const lander = p.lander;

  p.spawnCargo('normal', lander.x, null, lander.y - 40, { big: true });
  const bigBox = p.boxes[p.boxes.length - 1];
  assert(bigBox.big === true, 'spawnCargo({big:true}) should flag the box as big');
  assert(bigBox.size > p.BOX_SIZE, 'Big box should be larger than the standard BOX_SIZE');

  bigBox.x = lander.x;
  bigBox.y = lander.y - lander.deckOffset - bigBox.size / 2 + 2;
  bigBox.vx = 0; bigBox.vy = 0;
  for (let i = 0; i < 5; i++) p.updateOnDeckStates();
  assert(bigBox.onDeck === true, 'Big box should attach to an empty deck');

  p.spawnCargo('normal', lander.x + 5, null, lander.y - 40);
  const secondBox = p.boxes[p.boxes.length - 1];
  secondBox.x = lander.x + 5;
  secondBox.y = lander.y - lander.deckOffset - secondBox.size / 2 + 2;
  secondBox.vx = 0; secondBox.vy = 0;
  for (let i = 0; i < 5; i++) p.updateOnDeckStates();
  assert(secondBox.onDeck === false, 'A second box should not find a slot while a big box occupies the deck');
  assertEquals(p.boxes.filter(b => b.onDeck).length, 1, 'Only the big box should be on deck');
});

// ─── 4b. LEVEL CONFIG VALIDATION ─────────────────────────────────────────────
// Cheap shape checks over every registered level — catches broken level files
// (typo'd fields, malformed polygons, undeliverable cargo) without running the
// game. Optional fields are only validated when present.
//
// The scalar/object-shaped fields (mission params, palette, outOfBounds,
// gravityWell) are checked generically against LEVEL_SCHEMA (levelSchema.js —
// shared with level-editor.html) instead of a hand-written assertion per
// field, so a new schema field is automatically covered here too. Geometry
// (terrainPolygons/waterBodies/hazards/deliveryHubs/quests) stays hand-checked
// below — it's out of the schema's scope, see levelSchema.js's header comment.
category('Level Config Validation');

// Checks a single schema field's value against its declared type/constraints.
// `label` is the dotted path used in failure messages (e.g. 'gravity' or
// 'palette.skyTop').
function schemaCheckValue(field, v, label) {
  switch (field.type) {
    case 'string':
    case 'color':
    case 'rgba':
    case 'rgbaPrefix':
      assert(typeof v === 'string', `${label} must be a string, got ${typeof v}`);
      if (field.required) assert(v.length > 0, `${label} must be non-empty`);
      if (field.options) assert(field.options.includes(v), `${label} has unknown value '${v}'`);
      break;
    case 'number':
      assert(isFinite(v), `${label} must be a finite number, got ${v}`);
      if (field.positive) assert(v > 0, `${label} must be positive, got ${v}`);
      break;
    case 'integer':
      assert(Number.isInteger(v), `${label} must be an integer, got ${v}`);
      if (field.min != null) assert(v >= field.min, `${label} must be >= ${field.min}, got ${v}`);
      break;
    case 'boolean':
      assert(typeof v === 'boolean', `${label} must be a boolean, got ${typeof v}`);
      break;
    case 'stringList':
      assert(Array.isArray(v), `${label} must be an array`);
      if (field.required) assert(v.length > 0, `${label} must be non-empty`);
      if (field.enumValues) for (const t of v) assert(field.enumValues.includes(t), `${label} has unknown value '${t}'`);
      break;
    default:
      throw new Error(`unhandled schema field type '${field.type}' for ${label}`);
  }
  if (field.validate) assert(field.validate(v), `${label} failed its custom validation check, got ${JSON.stringify(v)}`);
}

// Checks every field in a schema section (LEVEL_SCHEMA.fields, .palette.fields,
// etc.) against an object, skipping absent optional fields and failing on
// absent required ones.
function schemaCheckSection(obj, sectionFields, labelPrefix) {
  for (const f of sectionFields) {
    const v = obj ? obj[f.key] : undefined;
    if (v === undefined) {
      assert(!f.required, `${labelPrefix}${f.key} is required`);
      continue;
    }
    schemaCheckValue(f, v, labelPrefix + f.key);
  }
}

levels.forEach((lv, i) => {
  const label = `L${i + 1} "${lv.name}"`;

  test(`${label} — mission parameters`, () => {
    // startX/startY/collectionX/collectionY/startDepotWidth/collectionWidth
    // are part of LEVEL_SCHEMA.fields too — schemaCheckSection covers them
    // generically like everything else here (none are required, so they're
    // simply skipped on levels that omit them).
    schemaCheckSection(lv, LEVEL_SCHEMA.fields, '');
  });

  test(`${label} — delivery hubs`, () => {
    // Most levels declare deliveryHubs statically, but a few (e.g. L9) build
    // their hubs at runtime via setupPhysics() -> physics.createDeliveryHub().
    // Skip the static-shape checks for those; there's nothing to validate here
    // without actually running physics init.
    if (typeof lv.setupPhysics === 'function' && !Array.isArray(lv.deliveryHubs)) return;

    assert(Array.isArray(lv.deliveryHubs) && lv.deliveryHubs.length > 0, 'must have at least one delivery hub');
    for (const hub of lv.deliveryHubs) {
      assert(typeof hub.name === 'string' && hub.name.length > 0, 'every hub needs a name');
      assertFinite(hub.x, `hub '${hub.name}' x`);
      assert(typeof hub.color === 'string' && hub.color.length > 0, `hub '${hub.name}' needs a color`);
      assert(typeof hub.type === 'string' && hub.type.length > 0, `hub '${hub.name}' needs a type`);
      if (hub.width !== undefined) assert(isFinite(hub.width) && hub.width > 0, `hub '${hub.name}' width must be positive`);
    }
    // At least one allowed cargo type must be deliverable somewhere, or the
    // mission is unwinnable. (Not EVERY type — undeliverable decoy cargo is a
    // legitimate design, e.g. L6's red boxes.)
    const hasChute = lv.deliveryHubs.some(h => h.type === 'chute');
    const deliverable = lv.allowedTypes.some(t => hasChute || lv.deliveryHubs.some(h => h.type === t));
    assert(deliverable, 'no allowed cargo type can be delivered to any hub — mission is unwinnable');
  });

  test(`${label} — palette`, () => {
    assert(lv.palette && typeof lv.palette === 'object', 'palette is required');
    schemaCheckSection(lv.palette, LEVEL_SCHEMA.palette.fields, 'palette.');
  });

  test(`${label} — out of bounds`, () => {
    // L9 uses the bare boolean `true` shorthand ("thick lateral fog, no zone
    // mechanics") instead of the full object — nothing further to check.
    if (lv.outOfBounds === undefined || typeof lv.outOfBounds === 'boolean') return;
    assert(typeof lv.outOfBounds === 'object', 'outOfBounds must be an object or boolean');
    schemaCheckSection(lv.outOfBounds, LEVEL_SCHEMA.outOfBounds.fields, 'outOfBounds.');
  });

  test(`${label} — gravity well`, () => {
    if (lv.gravityWell === undefined) return;
    assert(typeof lv.gravityWell === 'object', 'gravityWell must be an object');
    schemaCheckSection(lv.gravityWell, LEVEL_SCHEMA.gravityWell.fields, 'gravityWell.');
  });

  test(`${label} — radar ping zone`, () => {
    if (lv.radarPingZone === undefined) return;
    assert(typeof lv.radarPingZone === 'object', 'radarPingZone must be an object');
    schemaCheckSection(lv.radarPingZone, LEVEL_SCHEMA.radarPingZone.fields, 'radarPingZone.');
  });

  test(`${label} — terrain geometry`, () => {
    // Levels use either hand-authored polygons or a named procedural terrainType
    assert(Array.isArray(lv.terrainPolygons) || typeof lv.terrainType === 'string',
      'level needs terrainPolygons or a terrainType');
    for (const [pi, poly] of (lv.terrainPolygons || []).entries()) {
      const pts = Array.isArray(poly) ? poly : poly.pts;
      assert(Array.isArray(pts) && pts.length >= 3, `terrain polygon ${pi} needs >= 3 points`);
      for (const p of pts) {
        assert(isFinite(p.x) && isFinite(p.y), `terrain polygon ${pi} has a non-numeric point`);
      }
    }
    for (const [wi, wb] of (lv.waterBodies || []).entries()) {
      if (!wb.pts) continue; // legacy {x,width} rects are auto-converted
      assert(wb.pts.length >= 3, `water body ${wi} needs >= 3 points`);
      for (const p of wb.pts) {
        assert(isFinite(p.x) && isFinite(p.y), `water body ${wi} has a non-numeric point`);
      }
    }
  });

  test(`${label} — hazards`, () => {
    for (const [hi, h] of (lv.hazards || []).entries()) {
      if (h.type === 'laser') {
        assert(Array.isArray(h.pts) && h.pts.length === 2, `laser hazard ${hi} needs exactly 2 pts (a line segment)`);
        for (const p of h.pts) assert(isFinite(p.x) && isFinite(p.y), `laser hazard ${hi} has a non-numeric point`);
        if (h.onMs !== undefined) assert(h.onMs > 0, `laser hazard ${hi} onMs must be positive`);
        if (h.offMs !== undefined) assert(h.offMs > 0, `laser hazard ${hi} offMs must be positive`);
      } else if (h.type === 'incinerator') {
        assert(Array.isArray(h.pts) && h.pts.length >= 3, `incinerator hazard ${hi} needs >= 3 pts (a closed polygon)`);
        for (const p of h.pts) assert(isFinite(p.x) && isFinite(p.y), `incinerator hazard ${hi} has a non-numeric point`);
        if (h.onMs !== undefined) assert(h.onMs > 0, `incinerator hazard ${hi} onMs must be positive`);
        if (h.offMs !== undefined) assert(h.offMs > 0, `incinerator hazard ${hi} offMs must be positive`);
      } else if (h.type === 'crusher') {
        assert(Array.isArray(h.pts) && h.pts.length === 2, `crusher hazard ${hi} needs exactly 2 pts (a line segment)`);
        for (const p of h.pts) assert(isFinite(p.x) && isFinite(p.y), `crusher hazard ${hi} has a non-numeric point`);
        assert(isFinite(h.thickness), `crusher hazard ${hi} needs numeric thickness`);
      } else if (h.pts) {
        assert(h.pts.length >= 3, `'${h.type || 'zone'}' hazard ${hi} needs >= 3 points`);
        for (const p of h.pts) assert(isFinite(p.x) && isFinite(p.y), `hazard ${hi} has a non-numeric point`);
      }
    }
  });

  test(`${label} — quests`, () => {
    assert(Array.isArray(lv.quests) && lv.quests.length > 0, 'quests must be a non-empty array');
    const ids = new Set();
    for (const q of lv.quests) {
      assert(typeof q.id === 'string' && q.id.length > 0, 'every quest needs an id');
      assert(!ids.has(q.id), `duplicate quest id '${q.id}'`);
      ids.add(q.id);
      assert(typeof q.text === 'string' && q.text.length > 0, `quest '${q.id}' needs text`);
      assert(q.type === 'primary' || q.type === 'bonus', `quest '${q.id}' has unknown type '${q.type}'`);
      if (q.reward !== undefined) assert(isFinite(q.reward) && q.reward > 0, `quest '${q.id}' reward must be positive`);
    }
    assert(lv.quests.filter(q => q.type === 'primary').length <= 1, 'at most one primary quest per level');
  });
});

// ─── 4c. UPGRADE CATALOG VALIDATION ──────────────────────────────────────────
category('Upgrade Catalog Validation');

test('Upgrade catalog shape', () => {
  assert(Array.isArray(upgradeCatalog) && upgradeCatalog.length > 0, 'upgradeCatalog must be a non-empty array');
  const ids = new Set();
  for (const u of upgradeCatalog) {
    assert(typeof u.id === 'string' && u.id.length > 0, 'every upgrade needs an id');
    assert(!ids.has(u.id), `duplicate upgrade id '${u.id}'`);
    ids.add(u.id);
    assert(typeof u.name === 'string' && u.name.length > 0, `upgrade '${u.id}' needs a name`);
    assert(typeof u.desc === 'string' && u.desc.length > 0, `upgrade '${u.id}' needs a description`);
    assert(Number.isInteger(u.maxLevel) && u.maxLevel >= 1, `upgrade '${u.id}' maxLevel must be an integer >= 1`);
    assert(isFinite(u.basePrice) && u.basePrice > 0, `upgrade '${u.id}' basePrice must be positive`);
  }
});

// ─── 5. RUN TESTS AND RENDER RESULTS ─────────────────────────────────────────
(function runTests() {
  let passed = 0, failed = 0, skipped = 0;
  const byCategory = {};

  for (const t of _tests) {
    if (!byCategory[t.category]) byCategory[t.category] = [];
    let status = 'pass', error = null;
    try {
      t.fn();
      passed++;
      console.log(`  ✅ ${t.name}`);
    } catch (e) {
      status = 'fail';
      error = e.stack || e.message || String(e);
      failed++;
      console.error(`  ❌ ${t.name}\n     ${error}`);
    }
    byCategory[t.category].push({ name: t.name, status, error });
  }

  // Build summary
  const summaryEl = document.getElementById('summary');
  summaryEl.innerHTML =
    `Tests complete — ` +
    `<span class="pass">${passed} passed</span> / ` +
    `<span class="fail">${failed} failed</span>` +
    (skipped ? ` / <span class="skip">${skipped} skipped</span>` : '') +
    ` out of ${_tests.length} total`;

  // Build results
  const resultsEl = document.getElementById('results');
  for (const [cat, tests] of Object.entries(byCategory)) {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    catDiv.innerHTML = `<h2>${cat}</h2>`;
    for (const t of tests) {
      const row = document.createElement('div');
      row.className = 'test-row';
      row.innerHTML =
        `<span class="badge ${t.status}">${t.status.toUpperCase()}</span>` +
        `<span class="test-name">${t.name}</span>` +
        (t.error ? `<span class="test-err">${t.error.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>` : '');
      catDiv.appendChild(row);
    }
    resultsEl.appendChild(catDiv);
  }

  // Also log to console for CI-style inspection
  console.log(`[CargoLander Tests] ${passed}/${_tests.length} passed, ${failed} failed`);
  if (failed > 0) {
    console.error(`[CargoLander Tests] ${failed} test(s) failed`);
  }
})();
</script>
