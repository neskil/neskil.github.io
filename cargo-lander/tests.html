<script>
// ─── 1. MINIMAL TEST FRAMEWORK ───────────────────────────────────────────────

const _tests   = [];
let _currentCategory = 'Uncategorised';

function category(name) { _currentCategory = name; }

function test(name, fn) {
  _tests.push({ name, fn, category: _currentCategory });
}

function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'Assertion failed');
}

function assertEquals(a, b, msg) {
  if (a !== b) throw new Error((msg ? msg + ': ' : '') + `expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
}

function assertClose(a, b, tolerance, msg) {
  if (typeof tolerance !== 'number') tolerance = 1e-9;
  if (Math.abs(a - b) > tolerance) {
    throw new Error((msg ? msg + ': ' : '') + `expected ${b} ± ${tolerance}, got ${a}`);
  }
}

function assertFinite(v, msg) {
  if (!isFinite(v)) throw new Error((msg || 'Value') + ` is not finite: ${v}`);
}

// ─── 2. BROWSER MOCKS (must exist before loading scripts) ────────────────────

// --- localStorage mock ---
const _lsStore = {};
const mockLocalStorage = {
  getItem:    (k)    => (_lsStore[k] !== undefined ? _lsStore[k] : null),
  setItem:    (k, v) => { _lsStore[k] = String(v); },
  removeItem: (k)    => { delete _lsStore[k]; },
  clear:      ()     => { Object.keys(_lsStore).forEach(k => delete _lsStore[k]); },
};
Object.defineProperty(window, 'localStorage', {
  value: mockLocalStorage, writable: true, configurable: true
});

// --- AudioContext mock ---
class MockAudioParam {
  constructor(initialValue = 0) {
    this.value = initialValue;
  }
  setValueAtTime(val) { this.value = val; return this; }
  setTargetAtTime(val) { this.value = val; return this; }
  linearRampToValueAtTime(val) { this.value = val; return this; }
  exponentialRampToValueAtTime(val) { this.value = val; return this; }
}

class MockAudioNode {
  connect() { return this; }
  disconnect() {}
}
class MockOscillatorNode extends MockAudioNode {
  constructor() {
    super();
    this.type = 'sine';
    this.frequency = new MockAudioParam(440);
    this.detune = new MockAudioParam(0);
  }
  start() {}
  stop() {}
}
class MockGainNode extends MockAudioNode {
  constructor() {
    super();
    this.gain = new MockAudioParam(1);
  }
}
class MockBiquadFilter extends MockAudioNode {
  constructor() {
    super();
    this.type = 'lowpass';
    this.frequency = new MockAudioParam(350);
    this.Q = new MockAudioParam(1);
    this.gain = new MockAudioParam(0);
  }
}
class MockBufferSource extends MockAudioNode {
  constructor() {
    super();
    this.buffer = null;
    this.loop = false;
  }
  start() {}
  stop() {}
}
class MockAudioContext {
  constructor() {
    this.currentTime = 0;
    this.destination = new MockAudioNode();
    this.state = 'running';
  }
  createOscillator()       { return new MockOscillatorNode(); }
  createGain()             { return new MockGainNode(); }
  createBiquadFilter()     { return new MockBiquadFilter(); }
  createBufferSource()     { return new MockBufferSource(); }
  createBuffer(ch, len, sr){ return { getChannelData: () => new Float32Array(len) }; }
  resume()                 { return Promise.resolve(); }
}
window.AudioContext = MockAudioContext;

// --- document.getElementById mock ---
// Return real canvas elements for known IDs; light stubs for everything else.
const _realGetById = document.getElementById.bind(document);
document.getElementById = function(id) {
  const real = _realGetById(id);
  if (real) return real;
  // DOM stubs for UI elements game scripts touch
  return {
    id,
    style:          { display: 'none', setProperty() {} },
    classList:      { add() {}, remove() {}, toggle() {}, contains() { return false; } },
    dataset:        {},
    textContent:    '',
    innerHTML:      '',
    value:          '',
    checked:        false,
    children:       [],
    firstChild:     null,
    addEventListener() {},
    appendChild(child) { return child; },
    removeChild(child) { return child; },
    insertBefore(child) { return child; },
    remove() {},
    querySelector() { return null; },
    querySelectorAll() { return []; },
    setAttribute() {},
    getAttribute() { return null; },
    getBoundingClientRect() { return { left: 0, top: 0, width: 1280, height: 720 }; },
    getContext(type) {
      if (type === '2d') {
        // Minimal Canvas2D stub
        return _makeCanvas2DStub();
      }
      // WebGL: return null so ShaderOverlay handles missing WebGL gracefully
      return null;
    }
  };
};

function _makeCanvas2DStub() {
  const noop = () => {};
  const stub = {
    save: noop, restore: noop, translate: noop, rotate: noop, scale: noop,
    fillRect: noop, strokeRect: noop, clearRect: noop, beginPath: noop,
    moveTo: noop, lineTo: noop, closePath: noop, fill: noop, stroke: noop,
    arc: noop, arcTo: noop, ellipse: noop, roundRect: noop, rect: noop,
    quadraticCurveTo: noop, bezierCurveTo: noop, setLineDash: noop, getLineDash: () => [],
    fillText: noop, strokeText: noop, measureText: () => ({ width: 50 }),
    createLinearGradient: () => ({
      addColorStop: noop,
    }),
    createRadialGradient: () => ({
      addColorStop: noop,
    }),
    drawImage: noop, clip: noop, setTransform: noop, resetTransform: noop,
    createPattern: () => ({}),
    fillStyle: '#000', strokeStyle: '#000', lineWidth: 1,
    globalAlpha: 1, globalCompositeOperation: 'source-over',
    textAlign: 'left', textBaseline: 'alphabetic', font: '10px sans-serif',
    shadowBlur: 0, shadowColor: '#000', shadowOffsetX: 0, shadowOffsetY: 0,
    lineCap: 'butt', lineJoin: 'miter',
  };
  return stub;
}

// Patch the real canvas elements to return stubs too
(function patchRealCanvases() {
  ['cargoCanvas', 'webglCanvas'].forEach(id => {
    const el = _realGetById(id);
    if (!el) return;
    const _origGetCtx = el.getContext.bind(el);
    el.getContext = function(type, ...args) {
      if (type === '2d')    return _makeCanvas2DStub();
      if (type === 'webgl') return null; // Force ShaderOverlay into null-gl path
      return _origGetCtx(type, ...args);
    };
    // Provide width/height
    if (!el.width)  el.width  = 1280;
    if (!el.height) el.height = 720;
    el.addEventListener = el.addEventListener || (() => {});
    el.getBoundingClientRect = el.getBoundingClientRect || (() => ({ left: 0, top: 0, width: 1280, height: 720 }));
  });
})();

// Stub window properties the game reads
window.innerWidth  = window.innerWidth  || 1280;
window.innerHeight = window.innerHeight || 720;

// Stub requestAnimationFrame so game.init() doesn't kick off a real loop
const _realRAF = window.requestAnimationFrame;
window.requestAnimationFrame = (cb) => {
  // Do NOT call cb — just return a fake ID
  return 1;
};

// Stub confirm() so career reset tests don't block
window.confirm = () => true;

// ShaderOverlay is stubbed out between shaders.js and game.js (see script tags below)
// so that game.init() never calls real WebGL APIs.
</script>

<script>
// Patch ShaderOverlay so it gracefully handles null WebGL context.
// top-level `class` in shaders.js creates a non-reassignable lexical binding,
// so we cannot replace `window.ShaderOverlay`. Instead we patch the prototype
// methods and the constructor chain to no-op when this.gl is null.
(function patchShaderOverlay() {
  const proto = ShaderOverlay.prototype;

  // Guard initShaders and initBuffers — called from constructor
  const _initShaders = proto.initShaders;
  proto.initShaders = function() {
    if (!this.gl) return; // skip if no WebGL context
    return _initShaders.call(this);
  };

  const _initBuffers = proto.initBuffers;
  proto.initBuffers = function() {
    if (!this.gl) return;
    return _initBuffers.call(this);
  };

  // Guard resize — called after init()
  const _resize = proto.resize;
  proto.resize = function(w, h) {
    if (!this.gl) return;
    return _resize.call(this, w, h);
  };

  // Guard render — called every frame
  const _render = proto.render;
  proto.render = function(physics, camera) {
    if (!this.gl) return;
    return _render.call(this, physics, camera);
  };
})();
</script>

<script>
// ─── 3. HELPER: build a minimal input-state object for physics.update() ──────
function makeInput(overrides) {
  return Object.assign({
    up: false, down: false, left: false, right: false,
    mouseLeft: false, mouseRight: false,
    q: false, e: false,
    mouseX: 0, mouseY: 0,
  }, overrides);
}

// Build a minimal level config that matches what CargoPhysics.initLevel() needs.
// We use levels[0] from the real game data when available, otherwise this fallback.
function getLevel0() {
  return (typeof levels !== 'undefined' && levels[0]) ? levels[0] : {
    name: 'Test Level', gravity: 0.12, wind: 0,
    terrainType: 'flat', targetCargo: 2, deposit: 1000, timeLimit: 180,
    allowedTypes: ['normal'],
    deliveryHubs: [{ x: 750, color: '#38bdf8', type: 'normal', name: 'Hub' }],
    palette: { skyTop:'#000', skyMid:'#000', skyBot:'#000', terrainFill:'#111', rockEdge:'#22c55e', rockGlow:'rgba(34,197,94,' },
    quests: []
  };
}

// ─── 4. BEHAVIORAL SMOKE TESTS ───────────────────────────────────────────────
category('Behavioral Smoke Tests');

let testGame;

test('Engine Initialization', () => {
  mockLocalStorage.clear();
  testGame = new CargoGame();
  
  // Initialize game (this should set up rendering and physics)
  // requestAnimationFrame is mocked so it won't actually loop automatically
  testGame.init('cargoCanvas');
  
  assert(testGame.physics != null, 'Game physics should be initialized');
});

test('Level Loading', () => {
  assert(levels && levels.length > 0, 'Levels should exist to be tested');
  
  // Load each level sequentially
  for (let i = 0; i < levels.length; i++) {
    testGame.startLevel(i);
    assert(testGame.currentLevelIndex === i, 'Game should successfully load level ' + i);
    assert(testGame.physics.lander != null, 'Lander should be spawned for level ' + i);
  }
});

test('Update Loop Simulation', () => {
  // Run the update loop for the last loaded level for several frames
  for (let i = 0; i < 100; i++) {
    // 16ms delta time
    testGame.update(16);
  }
  // If no error is thrown, this test passes
});

test('Reduced Gravity and Air Resistance Tuning', () => {
  const phys = new CargoPhysics();
  phys.initLevel(levels[0], 1600, 1300);
  assert(phys.LANDER_DRAG >= 0.990, 'LANDER_DRAG should be at least 0.990 for reduced air resistance');
  assert(phys.gravity === 0.12, 'L1 gravity should be tuned down to 0.12');
});

// Terrain polygons are authored with either winding — L1's ground runs its
// outer surface left-to-right, L1's island and L4's ridge run the other way.
// Physics (surface scan, collision bodies) and rendering (edge glow, spike
// normals, grass extent) all classify an edge as "floor vs ceiling" from the
// endpoint order, so all of them normalise through polygonIsReversed() first.
// This asserts the classification is geometrically true rather than merely
// self-consistent: directly above a floor edge is open air, every time.
test('Floor Edges Have Air Above Them On Every Level', () => {
  const EPS = 2;
  for (let i = 0; i < levels.length; i++) {
    const phys = new CargoPhysics();
    phys.initLevel(levels[i], 1600, 1300);
    let checked = 0;
    for (const poly of phys.terrainPolygons) {
      if (!poly || poly.length < 3) continue;
      const flip = phys.polygonIsReversed(poly);
      for (let e = 0; e < poly.length; e++) {
        const a = poly[e], b = poly[(e + 1) % poly.length];
        if (a.invisibleEdge) continue; // deliberately non-physical, not drawn either
        const p1 = flip ? b : a, p2 = flip ? a : b;
        if (!(p1.x < p2.x)) continue; // classified as ceiling/underside, skip
        // Predominantly vertical edges are walls — you can't land on them and
        // the floor/ceiling distinction says nothing useful. L2's ground closes
        // with a 10px-wide, 1080px-tall edge that is exactly this case.
        if (Math.abs(p2.y - p1.y) > Math.abs(p2.x - p1.x)) continue;
        const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
        assert(!phys.pointInPolygon(mx, my - EPS, poly),
          `${levels[i].name}: edge (${p1.x},${p1.y})→(${p2.x},${p2.y}) is treated as a floor but is solid above — it's the polygon's underside`);
        checked++;
      }
    }
    // The sandbox level is terrainType:'flat' with no polygons at all — nothing
    // to check there, but any level that *has* geometry must expose some floor.
    if (phys.terrainPolygons.length) {
      assert(checked > 0, `${levels[i].name}: has terrain polygons but no floor edges`);
    }
  }
});

// Reversing a polygon's vertex order is a pure authoring choice — it describes
// the same shape, so nothing the player can observe may change. Guards the
// endpoint-swap approach: reversing the vertex *list* instead would shift every
// invisibleEdge/edgeHazard flag one edge along.
test('Polygon Winding Is An Authoring Detail, Not A Behaviour Change', () => {
  const cfg = levels[0];
  const reversed = JSON.parse(JSON.stringify(cfg));
  reversed.terrainPolygons = cfg.terrainPolygons.map(p => {
    const pts = Array.isArray(p) ? p : p.pts;
    return JSON.parse(JSON.stringify(pts)).reverse();
  });

  const a = new CargoPhysics(); a.initLevel(cfg, 1600, 1300);
  const b = new CargoPhysics(); b.initLevel(reversed, 1600, 1300);

  for (let x = -900; x <= 1600; x += 25) {
    assert(Math.abs(a.getPolygonSurfaceY(x) - b.getPolygonSurfaceY(x)) < 0.01,
      `surface at x=${x} moved when the polygons were reversed: ${a.getPolygonSurfaceY(x)} vs ${b.getPolygonSurfaceY(x)}`);
  }
  assert(a.segments.length === b.segments.length,
    `collision segment count changed with winding: ${a.segments.length} vs ${b.segments.length}`);
});

// Auto-snapped pads (no explicit startY/collectionY/hub.y) must land on the
// terrain's top surface, not on the flat closing edge that runs back along a
// ground polygon's underside. Regression guard for v0.19.9: making
// getPolygonSurfaceY() winding-agnostic put every L1 pad at y≈1340 — below the
// level's own worldBounds.bottomY, i.e. buried under the map.
test('Auto-Snapped Pads Sit On Terrain Surface, Not Polygon Underside', () => {
  for (let i = 0; i < levels.length; i++) {
    const cfg = levels[i];
    const phys = new CargoPhysics();
    phys.initLevel(cfg, 1600, 1300);
    const bottomY = cfg.worldBounds && cfg.worldBounds.bottomY;
    if (bottomY === undefined) continue;

    const snapped = [];
    if (cfg.startY === undefined) snapped.push(['HQ', phys.startDepot]);
    if (cfg.collectionY === undefined) snapped.push(['cargo depot', phys.collectionPoint]);
    (cfg.deliveryHubs || []).forEach((hub, h) => {
      if (hub.y === undefined) snapped.push([hub.name || `hub ${h}`, phys.deliveryHubs[h]]);
    });

    for (const [label, pad] of snapped) {
      assert(pad.y < bottomY,
        `${cfg.name}: ${label} snapped to y=${Math.round(pad.y)}, below worldBounds.bottomY=${bottomY}`);
    }
  }
});

// L1 is the level the underside-snap bug actually shipped on — pin its three
// pads to the terrain vertices they sit between so a future terrain edit that
// re-buries them fails loudly here.
test('Level 1 Pads Snap To Their Terrain Vertices', () => {
  const phys = new CargoPhysics();
  phys.initLevel(levels[0], 1600, 1300);
  assert(Math.abs(phys.startDepot.y - 770) < 1, `L1 HQ should sit at y≈770, got ${phys.startDepot.y}`);
  assert(Math.abs(phys.collectionPoint.y - 420) < 1, `L1 cargo depot should sit at y≈420, got ${phys.collectionPoint.y}`);
  assert(Math.abs(phys.deliveryHubs[0].y - 700) < 1, `L1 Verdant Depot should sit at y≈700, got ${phys.deliveryHubs[0].y}`);
});

test('Level 4 Cargo Pickup', () => {
  mockLocalStorage.clear();
  const g = new CargoGame();
  g.init('cargoCanvas');
  g.startLevel(3); // Level 4 is index 3
  const phys = g.physics;
  const col = phys.collectionPoint;
  // Land lander at collection point
  phys.lander.x = col.x + col.width / 2;
  phys.lander.y = col.y - 11;
  phys.lander.landed = true;
  phys.lander.currentPad = 'collection';
  Matter.Body.setPosition(phys.landerBody, { x: phys.lander.x, y: phys.lander.y });

  // Update auto load for 200 frames
  for (let i = 0; i < 200; i++) {
    g.update(1.0);
  }
  assert(phys.boxes.length > 0, 'Boxes should spawn at collection point on L4');
  const onDeck = phys.boxes.filter(b => b.onDeck);
  assert(onDeck.length > 0, 'Box should attach to deck on L4');
});

test('Big Cargo — deck single-load capacity', () => {
  // Big/oversized crates (spawnCargo(..., {big: true})) should claim the
  // entire basic-lander deck: once one is attached, no other box (big or
  // normal) can also attach until it's removed. Level 1 uses the basic
  // vehicle, so it exercises the multi-box deck path.
  testGame.startLevel(0);
  const p = testGame.physics;
  const lander = p.lander;

  p.spawnCargo('normal', lander.x, null, lander.y - 40, { big: true });
  const bigBox = p.boxes[p.boxes.length - 1];
  assert(bigBox.big === true, 'spawnCargo({big:true}) should flag the box as big');
  assert(bigBox.size > p.BOX_SIZE, 'Big box should be larger than the standard BOX_SIZE');

  bigBox.x = lander.x;
  bigBox.y = lander.y - lander.deckOffset - bigBox.size / 2 + 2;
  bigBox.vx = 0; bigBox.vy = 0;
  for (let i = 0; i < 5; i++) p.updateOnDeckStates();
  assert(bigBox.onDeck === true, 'Big box should attach to an empty deck');

  p.spawnCargo('normal', lander.x + 5, null, lander.y - 40);
  const secondBox = p.boxes[p.boxes.length - 1];
  secondBox.x = lander.x + 5;
  secondBox.y = lander.y - lander.deckOffset - secondBox.size / 2 + 2;
  secondBox.vx = 0; secondBox.vy = 0;

  assert(secondBox.onDeck === false, 'A second box should not find a slot while a big box occupies the deck');
  assertEquals(p.boxes.filter(b => b.onDeck).length, 1, 'Only the big box should be on deck');
});

// Ambient-traffic lane profile. updateAmbientTraffic() used to re-derive each
// truck's clearance altitude every frame by scanning `segments` inside a 500px
// directional lookahead; that scan is now baked into two lookup tables by
// buildTrafficLanes() (physics/atmosphere.js). This pins the tables to the
// scan they replaced — the reference implementation below is the old code,
// verbatim — so a future change to bucketing or the lookahead window can't
// silently shift every level's traffic altitude.
test('Traffic lane profile matches the per-frame scan it replaced', () => {
  // The old scan, reproduced exactly (minus its dead `this.engine` branch —
  // that property has never existed on CargoPhysics, so it never contributed).
  const referenceSafeAlt = (phys, x, headingEast) => {
    let obstacleHeight = 1000;
    const R = 500;
    const minX = Math.min(x, x + (headingEast ? R : -R));
    const maxX = Math.max(x, x + (headingEast ? R : -R));
    for (const s of phys.segments) {
      if (Math.max(s.x1, s.x2) >= minX && Math.min(s.x1, s.x2) <= maxX) {
        obstacleHeight = Math.min(obstacleHeight, s.y1, s.y2);
      }
    }
    return obstacleHeight - 140;
  };

  for (let i = 0; i < levels.length; i++) {
    testGame.startLevel(i);
    const phys = testGame.physics;
    phys.trafficLanes = null;
    phys.buildTrafficLanes();
    const L = phys.trafficLanes;
    assert(L && !L.empty && L.east.length > 1, `L${i + 1}: lane profile should be built`);

    // Exact at the table's own sample points; between them the only permitted
    // deviation is bucket quantisation of where a step lands.
    for (let b = 0; b < L.east.length; b++) {
      const x = L.originX + b * L.bucket;
      assertEquals(phys.trafficLaneAlt(x, true), referenceSafeAlt(phys, x, true),
        `L${i + 1}: eastbound lane at x=${x}`);
      assertEquals(phys.trafficLaneAlt(x, false), referenceSafeAlt(phys, x, false),
        `L${i + 1}: westbound lane at x=${x}`);
    }
  }
});

test('Facade geometry reads towers off the terrain, not off level config', () => {
  const i5 = levels.findIndex(l => l.terrainDecor === 'facade');
  assert(i5 >= 0, 'expected at least one facade level to exercise');
  testGame.startLevel(i5);
  testGame._facadeGeo = null;   // drop any cache from an earlier level
  const geos = testGame._facadeGeometry();
  assert(geos.length > 0, 'facade geometry should find at least one polygon');

  const main = geos.reduce((a, b) => (b.maxX - b.minX) > (a.maxX - a.minX) ? b : a);
  assert(main.floors.length > 2, 'main polygon should expose several floor edges');
  assert(main.baseY > main.topY, 'baseY (lowest floor) must sit below topY');

  // Every floor edge must run left-to-right — the winding normalisation is what
  // stops walls and ceilings being mistaken for roofs.
  for (const f of main.floors) assert(f.x1 < f.x2, 'floor edges must run left to right');

  // A roof column resolves to that roof.
  const roofEdge = main.floors.reduce((a, b) => b.y1 < a.y1 ? b : a);
  const midX = (roofEdge.x1 + roofEdge.x2) / 2;
  assertClose(testGame._facadeSurfaceY(main, midX), roofEdge.y1, 2, 'roof column surface');

  // And it must be the polygon's OWN topmost floor, never the lowest surface on
  // the map — physics.getPolygonSurfaceY() answers the latter, which would hang
  // a tower's windows off the street. The two only diverge where polygons
  // overlap in x (on a plain crenellated skyline each column has one floor), so
  // assert the invariant everywhere and require it to bite at least once.
  let sawStrictlyAbove = false;
  for (const geo of geos) {
    for (let x = geo.minX; x <= geo.maxX; x += 20) {
      const own = testGame._facadeSurfaceY(geo, x);
      if (own === null) continue;
      const lowest = testGame.physics.getPolygonSurfaceY(x);
      assert(own <= lowest + 1, `facade surface ${own} dipped below the map surface ${lowest} at x=${x}`);
      if (own < lowest - 1) sawStrictlyAbove = true;
    }
  }
  assert(sawStrictlyAbove,
    'expected some column where a polygon\'s own roof sits above the lowest surface — otherwise this is not testing anything');

  // Ground must follow the local street. Cutting at the polygon's global lowest
  // floor instead draws one flat line of windows across the whole map.
  const ground = testGame._facadeGroundY(main, midX, roofEdge.y1, 500);
  assert(ground > roofEdge.y1, 'ground must sit below the roof');
  assert(ground <= main.baseY, 'ground must not exceed the polygon floor');

  // Off the polygon entirely there is no surface to decorate.
  assertEquals(testGame._facadeSurfaceY(main, main.minX - 500), null, 'surface off-polygon');
});

// ─── 4b. LEVEL CONFIG VALIDATION ─────────────────────────────────────────────
// Cheap shape checks over every registered level — catches broken level files
// (typo'd fields, malformed polygons, undeliverable cargo) without running the
// game. Optional fields are only validated when present.
//
// The scalar/object-shaped fields (mission params, palette, outOfBounds,
// gravityWell) are checked generically against LEVEL_SCHEMA (levelSchema.js —
// shared with level-editor.html) instead of a hand-written assertion per
// field, so a new schema field is automatically covered here too. Geometry
// (terrainPolygons/waterBodies/hazards/deliveryHubs/quests) stays hand-checked
// below — it's out of the schema's scope, see levelSchema.js's header comment.
category('Level Config Validation');

// Checks a single schema field's value against its declared type/constraints.
// `label` is the dotted path used in failure messages (e.g. 'gravity' or
// 'palette.skyTop').
function schemaCheckValue(field, v, label) {
  switch (field.type) {
    case 'string':
    case 'color':
    case 'rgba':
    case 'rgbaPrefix':
      assert(typeof v === 'string', `${label} must be a string, got ${typeof v}`);
      if (field.required) assert(v.length > 0, `${label} must be non-empty`);
      if (field.options) assert(field.options.includes(v), `${label} has unknown value '${v}'`);
      break;
    case 'number':
      assert(isFinite(v), `${label} must be a finite number, got ${v}`);
      if (field.positive) assert(v > 0, `${label} must be positive, got ${v}`);
      break;
    case 'integer':
      assert(Number.isInteger(v), `${label} must be an integer, got ${v}`);
      if (field.min != null) assert(v >= field.min, `${label} must be >= ${field.min}, got ${v}`);
      break;
    case 'boolean':
      assert(typeof v === 'boolean', `${label} must be a boolean, got ${typeof v}`);
      break;
    case 'stringList':
      assert(Array.isArray(v), `${label} must be an array`);
      if (field.required) assert(v.length > 0, `${label} must be non-empty`);
      if (field.enumValues) for (const t of v) assert(field.enumValues.includes(t), `${label} has unknown value '${t}'`);
      break;
    default:
      throw new Error(`unhandled schema field type '${field.type}' for ${label}`);
  }
  if (field.validate) assert(field.validate(v), `${label} failed its custom validation check, got ${JSON.stringify(v)}`);
}

// Checks every field in a schema section (LEVEL_SCHEMA.fields, .palette.fields,
// etc.) against an object, skipping absent optional fields and failing on
// absent required ones.
function schemaCheckSection(obj, sectionFields, labelPrefix) {
  for (const f of sectionFields) {
    const v = obj ? obj[f.key] : undefined;
    if (v === undefined) {
      assert(!f.required, `${labelPrefix}${f.key} is required`);
      continue;
    }
    schemaCheckValue(f, v, labelPrefix + f.key);
  }
}

levels.forEach((lv, i) => {
  const label = `L${i + 1} "${lv.name}"`;

  test(`${label} — mission parameters`, () => {
    // startX/startY/collectionX/collectionY/startDepotWidth/collectionWidth
    // are part of LEVEL_SCHEMA.fields too — schemaCheckSection covers them
    // generically like everything else here (none are required, so they're
    // simply skipped on levels that omit them).
    schemaCheckSection(lv, LEVEL_SCHEMA.fields, '');
  });

  test(`${label} — delivery hubs`, () => {
    // Most levels declare deliveryHubs statically, but a few (e.g. L9) build
    // their hubs at runtime via setupPhysics() -> physics.createDeliveryHub().
    // Skip the static-shape checks for those; there's nothing to validate here
    // without actually running physics init.
    if (typeof lv.setupPhysics === 'function' && !Array.isArray(lv.deliveryHubs)) return;

    assert(Array.isArray(lv.deliveryHubs) && lv.deliveryHubs.length > 0, 'must have at least one delivery hub');
    for (const hub of lv.deliveryHubs) {
      assert(typeof hub.name === 'string' && hub.name.length > 0, 'every hub needs a name');
      assertFinite(hub.x, `hub '${hub.name}' x`);
      assert(typeof hub.color === 'string' && hub.color.length > 0, `hub '${hub.name}' needs a color`);
      assert(typeof hub.type === 'string' && hub.type.length > 0, `hub '${hub.name}' needs a type`);
      if (hub.width !== undefined) assert(isFinite(hub.width) && hub.width > 0, `hub '${hub.name}' width must be positive`);
    }
    // At least one allowed cargo type must be deliverable somewhere, or the
    // mission is unwinnable. (Not EVERY type — undeliverable decoy cargo is a
    // legitimate design, e.g. L6's red boxes.)
    const hasChute = lv.deliveryHubs.some(h => h.type === 'chute');
    const deliverable = lv.allowedTypes.some(t => hasChute || lv.deliveryHubs.some(h => h.type === t));
    assert(deliverable, 'no allowed cargo type can be delivered to any hub — mission is unwinnable');
  });

  test(`${label} — palette`, () => {
    assert(lv.palette && typeof lv.palette === 'object', 'palette is required');
    schemaCheckSection(lv.palette, LEVEL_SCHEMA.palette.fields, 'palette.');
  });

  test(`${label} — out of bounds`, () => {
    // L9 uses the bare boolean `true` shorthand ("thick lateral fog, no zone
    // mechanics") instead of the full object — nothing further to check.
    if (lv.outOfBounds === undefined || typeof lv.outOfBounds === 'boolean') return;
    assert(typeof lv.outOfBounds === 'object', 'outOfBounds must be an object or boolean');
    schemaCheckSection(lv.outOfBounds, LEVEL_SCHEMA.outOfBounds.fields, 'outOfBounds.');
  });

  test(`${label} — world bounds`, () => {
    if (lv.worldBounds === undefined) return;
    assert(typeof lv.worldBounds === 'object', 'worldBounds must be an object');
    schemaCheckSection(lv.worldBounds, LEVEL_SCHEMA.worldBounds.fields, 'worldBounds.');
    // monsterDepth was folded into worldBounds.bottomY — a level regressing to
    // the old field would silently lose its worm boundary.
    if (lv.outOfBounds && typeof lv.outOfBounds === 'object') {
      assert(lv.outOfBounds.monsterDepth === undefined, 'outOfBounds.monsterDepth is retired — use worldBounds.bottomY');
    }
  });

  test(`${label} — gravity well`, () => {
    if (lv.gravityWell === undefined) return;
    assert(typeof lv.gravityWell === 'object', 'gravityWell must be an object');
    schemaCheckSection(lv.gravityWell, LEVEL_SCHEMA.gravityWell.fields, 'gravityWell.');
  });

  test(`${label} — radar ping zone`, () => {
    if (lv.radarPingZone === undefined) return;
    assert(typeof lv.radarPingZone === 'object', 'radarPingZone must be an object');
    schemaCheckSection(lv.radarPingZone, LEVEL_SCHEMA.radarPingZone.fields, 'radarPingZone.');
  });

  test(`${label} — wind gust cycle`, () => {
    if (lv.windGust === undefined) return;
    assert(typeof lv.windGust === 'object', 'windGust must be an object');
    schemaCheckSection(lv.windGust, LEVEL_SCHEMA.windGust.fields, 'windGust.');
  });

  test(`${label} — facade glazing`, () => {
    if (lv.facade === undefined) return;
    assert(typeof lv.facade === 'object', 'facade must be an object');
    schemaCheckSection(lv.facade, LEVEL_SCHEMA.facade.fields, 'facade.');
    const g = (k) => lv.facade[k] !== undefined ? lv.facade[k]
      : LEVEL_SCHEMA.facade.fields.find(f => f.key === k).default;
    // A pane at least as wide as its cell merges with its neighbour into a solid
    // lit slab instead of a window grid.
    assert(g('windowW') < g('cellW'), `facade.windowW (${g('windowW')}) must be smaller than facade.cellW (${g('cellW')})`);
    assert(g('windowH') < g('cellH'), `facade.windowH (${g('windowH')}) must be smaller than facade.cellH (${g('cellH')})`);
    for (const k of ['litChance', 'warmRatio', 'flicker']) {
      assert(g(k) >= 0 && g(k) <= 1, `facade.${k} must be within 0..1, got ${g(k)}`);
    }
    // A facade block on a level that doesn't draw one is dead config — the
    // renderer only reads it under terrainDecor:'facade'.
    assertEquals(lv.terrainDecor, 'facade',
      'level has a facade block but terrainDecor is not \'facade\'');
  });

  test(`${label} — terrain geometry`, () => {
    // Levels use either hand-authored polygons or a named procedural terrainType
    assert(Array.isArray(lv.terrainPolygons) || typeof lv.terrainType === 'string',
      'level needs terrainPolygons or a terrainType');
    for (const [pi, poly] of (lv.terrainPolygons || []).entries()) {
      const pts = Array.isArray(poly) ? poly : poly.pts;
      assert(Array.isArray(pts) && pts.length >= 3, `terrain polygon ${pi} needs >= 3 points`);
      for (const p of pts) {
        assert(isFinite(p.x) && isFinite(p.y), `terrain polygon ${pi} has a non-numeric point`);
      }
    }
    for (const [wi, wb] of (lv.waterBodies || []).entries()) {
      if (!wb.pts) continue; // legacy {x,width} rects are auto-converted
      assert(wb.pts.length >= 3, `water body ${wi} needs >= 3 points`);
      for (const p of wb.pts) {
        assert(isFinite(p.x) && isFinite(p.y), `water body ${wi} has a non-numeric point`);
      }
    }
  });

  test(`${label} — hazards`, () => {
    for (const [hi, h] of (lv.hazards || []).entries()) {
      if (h.type === 'laser') {
        assert(Array.isArray(h.pts) && h.pts.length === 2, `laser hazard ${hi} needs exactly 2 pts (a line segment)`);
        for (const p of h.pts) assert(isFinite(p.x) && isFinite(p.y), `laser hazard ${hi} has a non-numeric point`);
        if (h.onMs !== undefined) assert(h.onMs > 0, `laser hazard ${hi} onMs must be positive`);
        if (h.offMs !== undefined) assert(h.offMs > 0, `laser hazard ${hi} offMs must be positive`);
      } else if (h.type === 'incinerator') {
        assert(Array.isArray(h.pts) && h.pts.length >= 3, `incinerator hazard ${hi} needs >= 3 pts (a closed polygon)`);
        for (const p of h.pts) assert(isFinite(p.x) && isFinite(p.y), `incinerator hazard ${hi} has a non-numeric point`);
        if (h.onMs !== undefined) assert(h.onMs > 0, `incinerator hazard ${hi} onMs must be positive`);
        if (h.offMs !== undefined) assert(h.offMs > 0, `incinerator hazard ${hi} offMs must be positive`);
      } else if (h.type === 'crusher') {
        assert(Array.isArray(h.pts) && h.pts.length === 2, `crusher hazard ${hi} needs exactly 2 pts (a line segment)`);
        for (const p of h.pts) assert(isFinite(p.x) && isFinite(p.y), `crusher hazard ${hi} has a non-numeric point`);
        assert(isFinite(h.thickness), `crusher hazard ${hi} needs numeric thickness`);
      } else if (h.pts) {
        assert(h.pts.length >= 3, `'${h.type || 'zone'}' hazard ${hi} needs >= 3 points`);
        for (const p of h.pts) assert(isFinite(p.x) && isFinite(p.y), `hazard ${hi} has a non-numeric point`);
      }
    }
  });

  test(`${label} — quests`, () => {
    assert(Array.isArray(lv.quests) && lv.quests.length > 0, 'quests must be a non-empty array');
    const ids = new Set();
    for (const q of lv.quests) {
      assert(typeof q.id === 'string' && q.id.length > 0, 'every quest needs an id');
      assert(!ids.has(q.id), `duplicate quest id '${q.id}'`);
      ids.add(q.id);
      assert(typeof q.text === 'string' && q.text.length > 0, `quest '${q.id}' needs text`);
      assert(q.type === 'primary' || q.type === 'bonus', `quest '${q.id}' has unknown type '${q.type}'`);
      if (q.reward !== undefined) assert(isFinite(q.reward) && q.reward > 0, `quest '${q.id}' reward must be positive`);
    }
    assert(lv.quests.filter(q => q.type === 'primary').length <= 1, 'at most one primary quest per level');
  });
});

// ─── 4b2. ALTITUDE FOG BAND ──────────────────────────────────────────────────
category('Altitude Fog Band');

// Levels can declare a fog band with fogBandTopY/fogBandBottomY. It is the soft
// ceiling on L6 — the density curve is shared between the renderer and the hull
// abrasion, so these lock down the curve's shape and the damage plumbing.
test('fogDensityAt is 0 on levels without a band', () => {
  const phys = new CargoPhysics();
  phys.initLevel(levels[0], 1600, 1300);
  assertEquals(phys.fogDensityAt(0), 0, 'no band configured => no density anywhere');
  assertEquals(phys.fogDensityAt(-5000), 0, 'not even far above the map');
});

test('fogDensityAt ramps 0 -> 1 across the band', () => {
  const lv = levels.find(l => l.fogBandTopY != null && l.fogBandBottomY != null);
  assert(lv, 'at least one level should configure a fog band');
  const phys = new CargoPhysics();
  phys.initLevel(lv, 1600, 1300);
  const top = lv.fogBandTopY, bot = lv.fogBandBottomY;
  assert(top < bot, 'fogBandTopY must be above (smaller than) fogBandBottomY');

  assertEquals(phys.fogDensityAt(bot), 0, 'clear at the bottom edge');
  assertEquals(phys.fogDensityAt(bot + 500), 0, 'clear well below the band');
  assertEquals(phys.fogDensityAt(top), 1, 'full density at the top edge');
  assertEquals(phys.fogDensityAt(top - 2000), 1, 'stays capped above the band');
  assertClose(phys.fogDensityAt((top + bot) / 2), 0.5, 0.001, 'smoothstep is symmetric at the midpoint');

  // Monotonic increase as the lander climbs
  let prev = -1;
  for (let y = bot; y >= top; y -= 10) {
    const d = phys.fogDensityAt(y);
    assertFinite(d, `density at y=${y}`);
    assert(d >= prev, `density must not drop while climbing (y=${y})`);
    prev = d;
  }
});

test('fog abrasion scales with density and spares levels with no band', () => {
  const lv = levels.find(l => (l.fogBandDamage || 0) > 0);
  assert(lv, 'L6 should configure fogBandDamage');
  const phys = new CargoPhysics();
  phys.initLevel(lv, 1600, 1300);

  // Below the band: no damage, and fogDensity reports clear.
  phys.lander.y = lv.fogBandBottomY + 100;
  phys.lander.integrity = 100;
  for (let i = 0; i < 60; i++) phys.updateAltitudeFog(1);
  assertEquals(phys.fogDensity, 0, 'below the band the lander is in clear air');
  assertEquals(phys.lander.integrity, 100, 'clear air must not abrade the hull');

  // At full density: one simulated second costs ~fogBandDamage hull.
  phys.lander.y = lv.fogBandTopY - 50;
  phys.lander.integrity = 100;
  for (let i = 0; i < 60; i++) phys.updateAltitudeFog(1);
  assertEquals(phys.fogDensity, 1, 'above the top edge density is capped at 1');
  assertClose(100 - phys.lander.integrity, lv.fogBandDamage, 0.001,
    'one second at full density should cost exactly fogBandDamage hull');

  // A crashed lander stops taking grit damage.
  phys.lander.crashed = true;
  const afterCrash = phys.lander.integrity;
  for (let i = 0; i < 60; i++) phys.updateAltitudeFog(1);
  assertEquals(phys.lander.integrity, afterCrash, 'a crashed lander takes no fog damage');
  assertEquals(phys.fogDensity, 0, 'crashed lander reports no fog');
});

// ─── 4b3. SANDWORM STRIKE TUNING ─────────────────────────────────────────────
category('Sandworm Strike Tuning');

// The strike shape moved from hardcoded constants onto the sandworm hazard so
// L6 could get a hunting worm without changing L9's. Defaults must reproduce
// the original numbers exactly, or every other worm level silently re-tunes.
test('_sandWormTuning defaults reproduce the original strike', () => {
  const phys = new CargoPhysics();
  const d = phys._sandWormTuning(null);
  assertEquals(d.trackFrames, 1.2, 'default tracking window');
  assertEquals(d.steer, 2.5, 'default steer');
  assertEquals(d.maxSpeed, 50, 'default speed cap');
  assertEquals(d.decay, 0.88, 'default decay');
  assertEquals(d.retractSpeed, 12, 'default retract speed');
  assertEquals(d.hitRadius, 80, 'default hit radius');
  assertEquals(d.damage, 8, 'default contact damage');
});

test('_sandWormTuning takes overrides from the hazard', () => {
  const phys = new CargoPhysics();
  const t = phys._sandWormTuning({ trackFrames: 14, decay: 0.94, hitRadius: 85, damage: 6 });
  assertEquals(t.trackFrames, 14, 'override applied');
  assertEquals(t.decay, 0.94, 'override applied');
  assertEquals(t.hitRadius, 85, 'override applied');
  assertEquals(t.damage, 6, 'override applied');
  assertEquals(t.steer, 2.5, 'unspecified fields keep their default');
});

// Drives a real strike to prove the tuning reaches where the level design says
// it does. Math.random is stubbed to 0 so the probabilistic spawn fires on the
// first frame instead of the test depending on luck.
// Drives a real strike to prove the tuning reaches where the level design says
// it does. Math.random is stubbed with a fixed script rather than a constant,
// because the spawn block now rolls three times in a known order:
//   1. spawn chance      — needs a tiny value to pass
//   2. spawn X offset    — 0.5 keeps the worm directly under the lander
//   3. bluff chance      — < bluffChance picks a threat display, >= a real strike
// A constant stub of 0 would silently turn every strike test into a bluff test.
function stubRandom(script) {
  const real = Math.random;
  let i = 0;
  Math.random = () => (i < script.length ? script[i++] : 0.999);
  return () => { Math.random = real; };
}

function simulateWormStrike(lv, landerX, landerY, frames, opts = {}) {
  const phys = new CargoPhysics();
  phys.initLevel(lv, 1600, 1300);
  phys.lander.x = landerX;
  phys.lander.y = landerY;
  phys.lander.crashed = false;
  phys.lander.integrity = phys.lander.maxIntegrity;

  const restore = stubRandom([0, 0.5, opts.bluff ? 0 : 0.999]);
  let peakY = Infinity, spawned = false, sawBluff = false, sawHold = false;
  try {
    for (let i = 0; i < frames; i++) {
      phys.updateMonster(lv, 1);
      if (phys.sandWorm) {
        spawned = true;
        peakY = Math.min(peakY, phys.sandWorm.y);
        if (phys.sandWorm.isBluff) sawBluff = true;
        if (phys.sandWorm.state === 'holding') sawHold = true;
      }
      // Hold the lander still — we're measuring the strike, not evasion
      phys.lander.y = landerY;
      phys.lander.x = landerX;
    }
  } finally {
    restore();
  }
  return {
    spawned, peakY, sawBluff, sawHold,
    hullLost: phys.lander.maxIntegrity - phys.lander.integrity,
    phys,
  };
}

test('L6 worm owns the valley but not the freight corridor', () => {
  const lv = levels.find(l => l.name.startsWith('L6'));
  assert(lv, 'L6 should exist');
  const worm = lv.hazards.find(h => h.type === 'sandworm');
  let cx = 0, cy = 0;
  for (const p of worm.pts) { cx += p.x; cy += p.y; }
  cx /= worm.pts.length; cy /= worm.pts.length;

  // The separation between the two hazards is enforced by the SPAWN ZONE, not
  // by the arc — the mound sits close enough to the lane that any leap worth
  // watching overshoots it. What matters is that a corridor crossing never
  // summons a worm in the first place.
  const zoneCeiling = cy - worm.reach;
  assert(zoneCeiling > lv.ambientTrafficMaxY,
    `zone ceiling (y=${zoneCeiling.toFixed(0)}) must sit below the freight lane floor (y=${lv.ambientTrafficMaxY}) so corridor runs stay worm-free`);

  // ...and that it still owns the ground it is supposed to: the mound peak and
  // both valley floors either side of it.
  const covered = (x, y) => Math.hypot(x - cx, y - cy) <= worm.reach;
  assert(covered(900, 520), 'zone must cover the mound peak');
  assert(covered(700, 800), 'zone must cover the west valley floor');
  assert(covered(1100, 800), 'zone must cover the east valley floor');

  // A committed strike from just above the sand should connect.
  const r = simulateWormStrike(lv, 900, 460, 260);
  assert(r.spawned, 'a worm should spawn while hovering low inside the zone');
  assert(!r.sawBluff, 'this run should be a committed strike, not a bluff');
  assert(r.hullLost > 0, 'a stationary lander over the mound should take a hit');

  // Calmer than the first difficulty pass, which carried ~600px and read as a
  // reflex check. Bound it so a future tweak cannot quietly restore that.
  const climb = 520 - r.peakY;
  assert(climb > 150, `strike should clear the sand meaningfully, got ${climb.toFixed(0)}px`);
  assert(climb < 480, `strike should stay calmer than the old ~600px arc, got ${climb.toFixed(0)}px`);
});

test('L6 worm bluffs rear up and sink back without tracking', () => {
  const lv = levels.find(l => l.name.startsWith('L6'));
  const worm = lv.hazards.find(h => h.type === 'sandworm');
  assert(worm.bluffChance > 0, 'L6 should configure bluffs');

  const bluff = simulateWormStrike(lv, 900, 460, 300, { bluff: true });
  assert(bluff.spawned && bluff.sawBluff, 'the scripted roll should produce a bluff');
  assert(bluff.sawHold, 'a bluff should pass through the holding state');

  // A bluff never homes, and its shorter arc must not reach as far as a real one.
  const real = simulateWormStrike(lv, 900, 460, 260);
  assert(bluff.peakY > real.peakY,
    `bluff should stop short of a committed strike (bluff y=${bluff.peakY.toFixed(0)}, real y=${real.peakY.toFixed(0)})`);
});

test('L6 worm goes quiet between appearances', () => {
  const lv = levels.find(l => l.name.startsWith('L6'));
  const worm = lv.hazards.find(h => h.type === 'sandworm');
  assert(worm.cooldownFrames > 0, 'L6 should configure a cooldown');

  const phys = new CargoPhysics();
  phys.initLevel(lv, 1600, 1300);
  phys.lander.x = 900; phys.lander.y = 460; phys.lander.crashed = false;

  // Spawn rolls always pass, so without a cooldown the zone would hold a worm
  // on essentially every frame. Count the frames where nothing is out.
  const restore = stubRandom([]);
  Math.random = () => 0.0001; // passes the spawn roll; also picks "bluff"
  let quiet = 0;
  try {
    for (let i = 0; i < 900; i++) {
      phys.updateMonster(lv, 1);
      phys.lander.y = 460; phys.lander.x = 900;
      if (!phys.sandWorm) quiet++;
    }
  } finally {
    restore();
  }
  assert(quiet > 120, `the zone should have real gaps between worms, got ${quiet} quiet frames of 900`);
});

test('L6 worm ignores the lander outside its zone', () => {
  const lv = levels.find(l => l.name.startsWith('L6'));
  const worm = lv.hazards.find(h => h.type === 'sandworm');
  let cx = 0, cy = 0;
  for (const p of worm.pts) { cx += p.x; cy += p.y; }
  cx /= worm.pts.length; cy /= worm.pts.length;

  // Just past the zone edge, straight up — the corridor has to stay worm-free
  // or the "traffic vs worm" choice collapses into "everything kills you".
  const r = simulateWormStrike(lv, cx, cy - (worm.reach + 60), 240);
  assert(!r.spawned, 'no worm should spawn outside the declared reach');
  assertEquals(r.hullLost, 0, 'and the hull should be untouched');
});

test('worm-lair levels declare a matching sandworm hazard', () => {
  for (const lv of levels.filter(l => l.terrainType === 'worm-lair')) {
    const worms = (lv.hazards || []).filter(h => h.type === 'sandworm');
    assert(worms.length > 0, `${lv.name}: terrainType 'worm-lair' needs a sandworm hazard to mark its zone`);
    for (const h of worms) {
      assert(Array.isArray(h.pts) && h.pts.length >= 3, `${lv.name}: sandworm hazard needs a polygon`);
      assert(h.reach == null || h.reach > 0, `${lv.name}: sandworm reach must be positive`);
      // decay >= 1 would mean the strike never slows down and never retracts.
      assert(h.decay == null || (h.decay > 0 && h.decay < 1), `${lv.name}: sandworm decay must be in (0, 1)`);
      assert(h.trackFrames == null || h.trackFrames >= 0, `${lv.name}: sandworm trackFrames must be >= 0`);
    }
  }
});

category('Upgrade Catalog Validation');

test('Upgrade catalog shape', () => {
  assert(Array.isArray(upgradeCatalog) && upgradeCatalog.length > 0, 'upgradeCatalog must be a non-empty array');
  const ids = new Set();
  for (const u of upgradeCatalog) {

// ─── 4c2. PLATFORM CAPABILITY ────────────────────────────────────────────────
category('Platform Capability');

// iPhone Safari ships no element Fullscreen API, so documentElement
// .requestFullscreen is undefined and calling it throws synchronously — which
// escaped the inline onclick and painted index.html's red window.onerror banner
// over the game. These simulate that browser by shadowing the methods.
(function () {
  const KEYS = ['requestFullscreen', 'webkitRequestFullscreen', 'msRequestFullscreen'];

  function withoutFullscreenApi(fn) {
    const el = document.documentElement;
    for (const k of KEYS) Object.defineProperty(el, k, { value: undefined, configurable: true });
    try { return fn(); } finally { for (const k of KEYS) delete el[k]; }
  }

  test('Fullscreen toggle is silent on browsers without the API (iPhone)', () => {
    const g = new CargoGame();
    withoutFullscreenApi(() => {
      assert(g.isFullscreenSupported() === false, 'API should read as unsupported when the methods are missing');
      // The bug: this threw TypeError instead of degrading.
      g.toggleFullscreen();
    });
  });

  test('Fullscreen buttons are hidden when the API is missing', () => {
    const g = new CargoGame();
    const made = ['menu-fullscreen-btn', 'hud-fullscreen-btn'].map(id => {
      const el = document.createElement('button');
      el.id = id;
      el.style.display = 'flex';
      document.body.appendChild(el);
      return el;
    });
    try {
      withoutFullscreenApi(() => g.updateFullscreenAvailability());
      for (const el of made) {
        assert(el.style.display === 'none', `${el.id} should be hidden with no Fullscreen API`);
      }
      // And left alone when the API is there.
      for (const el of made) el.style.display = 'flex';
      Object.defineProperty(document.documentElement, 'requestFullscreen',
        { value: function () { return Promise.resolve(); }, configurable: true });
      try {
        g.updateFullscreenAvailability();
        for (const el of made) {
          assert(el.style.display === 'flex', `${el.id} should stay visible when fullscreen works`);
        }
      } finally {
        delete document.documentElement.requestFullscreen;
      }
    } finally {
      for (const el of made) el.remove();
    }
  });

  test('Fullscreen toggle calls the prefixed request when that is all there is', () => {
    const g = new CargoGame();
    const el = document.documentElement;
    let calls = 0;
    Object.defineProperty(el, 'requestFullscreen', { value: undefined, configurable: true });
    Object.defineProperty(el, 'webkitRequestFullscreen',
      { value: function () { calls++; /* returns undefined, like real prefixed impls */ }, configurable: true });
    try {
      assert(g.isFullscreenSupported() === true, 'prefixed-only browsers (iPad) still support fullscreen');
      g.toggleFullscreen();
      assertEquals(calls, 1, 'prefixed requestFullscreen should have been called once');
    } finally {
      delete el.requestFullscreen;
      delete el.webkitRequestFullscreen;
    }
  });

  test('Fullscreen toggle swallows a refused request', () => {
    const g = new CargoGame();
    const el = document.documentElement;
    Object.defineProperty(el, 'requestFullscreen', {
      value: function () { throw new TypeError('refused by permissions policy'); },
      configurable: true
    });
    try {
      g.toggleFullscreen(); // must not propagate to window.onerror
    } finally {
      delete el.requestFullscreen;
    }
  });
})();

// ─── 4d. DEPLOY HYGIENE ──────────────────────────────────────────────────────
category('Deploy Hygiene');

// GitHub Pages caches hard, so every local <script src> carries ?v=VERSION and
// the release ritual is to bump all of them together. Nothing enforced that, and
// they drifted: at v0.19.8 index.html was current while tests.html was still
// pinned to 0.19.7 — meaning this very suite was exercising cached, stale JS
// while reporting green. Sync XHR because the runner above is synchronous.
test('Cache-busting ?v= matches CargoGame.VERSION everywhere', () => {
  const readLocal = (path) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', path, false);
    xhr.send(null);
    assert(xhr.status === 200 || xhr.status === 0, `could not read ${path} (status ${xhr.status})`);
    return xhr.responseText;
  };

  // Parse rather than regex the markup: a text scan finds its own pattern
  // source in this very file and reports a phantom mismatch.
  const parse = (html) => new DOMParser().parseFromString(html, 'text/html');

  for (const page of ['index.html', 'tests.html']) {
    const doc = parse(readLocal(page));
    const srcs = Array.from(doc.querySelectorAll('script[src]'))
      .map(el => el.getAttribute('src'))
      .filter(src => !/^(https?:)?\/\//.test(src));
    assert(srcs.length > 0, `${page} has no local <script src> tags`);

    let versioned = 0;
    for (const src of srcs) {
      // vendor/ is third-party and never edited, so it needs no cache-bust.
      if (src.startsWith('vendor/')) continue;
      const q = src.indexOf('?v=');
      assert(q !== -1,
        `${page} loads ${src} with no ?v= — Pages will serve it from cache after a deploy`);
      const v = src.slice(q + 3);
      assert(v === CargoGame.VERSION,
        `${page} pins ${src} but CargoGame.VERSION is ${CargoGame.VERSION} — bump them together or Pages serves stale JS`);
      versioned++;
    }
    assert(versioned > 0, `${page} has no versioned local scripts`);
  }

  // The repo-root landing page also carries a ?v= on its link into the game,
  // but it lives above this suite's web root and can't be fetched from here —
  // run-tests.sh checks that one against the filesystem instead.
});

// ─── 5. RUN TESTS AND RENDER RESULTS ─────────────────────────────────────────
(function runTests() {
  let passed = 0, failed = 0, skipped = 0;
  const byCategory = {};

  for (const t of _tests) {
    if (!byCategory[t.category]) byCategory[t.category] = [];
    let status = 'pass', error = null;
    try {
      t.fn();
      passed++;
      console.log(`  ✅ ${t.name}`);
    } catch (e) {
      status = 'fail';
      error = e.stack || e.message || String(e);
      failed++;
      console.error(`  ❌ ${t.name}\n     ${error}`);
    }
    byCategory[t.category].push({ name: t.name, status, error });
  }

  // Build summary
  const summaryEl = document.getElementById('summary');
  summaryEl.innerHTML =
    `Tests complete — ` +
    `<span class="pass">${passed} passed</span> / ` +
    `<span class="fail">${failed} failed</span>` +
    (skipped ? ` / <span class="skip">${skipped} skipped</span>` : '') +
    ` out of ${_tests.length} total`;

  // Build results
  const resultsEl = document.getElementById('results');
  for (const [cat, tests] of Object.entries(byCategory)) {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    catDiv.innerHTML = `<h2>${cat}</h2>`;
    for (const t of tests) {
      const row = document.createElement('div');
      row.className = 'test-row';
      row.innerHTML =
        `<span class="badge ${t.status}">${t.status.toUpperCase()}</span>` +
        `<span class="test-name">${t.name}</span>` +
        (t.error ? `<span class="test-err">${t.error.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>` : '');
      catDiv.appendChild(row);
    }
    resultsEl.appendChild(catDiv);
  }

  // Also log to console for CI-style inspection
  console.log(`[CargoLander Tests] ${passed}/${_tests.length} passed, ${failed} failed`);
  if (failed > 0) {
    console.error(`[CargoLander Tests] ${failed} test(s) failed`);
  }
})();
</script>
