<!doctype html>
<!-- Temporary headless-screenshot probe (not part of the game, safe to delete):
     loads the game in an iframe, jumps to a level, parks the camera at a
     given spot via freeCam, and lets headless Chrome screenshot the result.
     Usage: probe-screenshot.html?level=8&x=1500&y=750&zoom=0.8
     Add &debug=1 to dump extra diagnostics (radar/HUD element state, console
     errors forwarded from the iframe) into the on-screen status line instead
     of just the shader link status — used to track down the missing-minimap
     report on 2026-07-10. -->
<html>

<body style="margin:0">
    <iframe id="f" src="index.html" style="width:1280px;height:800px;border:0"></iframe>
    <script>
        const q = new URLSearchParams(location.search);
        const levelIdx = parseInt(q.get('level') || '0');
        const camX = parseFloat(q.get('x') || '0');
        const camY = parseFloat(q.get('y') || '0');
        const camZoom = parseFloat(q.get('zoom') || '1');
        const debug = q.get('debug') === '1';

        const consoleErrors = [];

        const f = document.getElementById('f');
        f.addEventListener('load', () => {
            const iw = f.contentWindow;
            // &hide=fnName1,fnName2 — no-ops these CargoGame.prototype methods
            // before the level starts, for bisecting which draw call produces a
            // given visual (used to track down the "diagonal shading wedge"
            // report on 2026-07-10 by disabling candidates one at a time).
            const hide = (q.get('hide') || '').split(',').filter(Boolean);
            for (const fn of hide) {
                if (typeof iw.CargoGame.prototype[fn] === 'function') {
                    iw.CargoGame.prototype[fn] = function () { };
                }
            }
            if (debug) {
                const origErr = iw.console.error.bind(iw.console);
                iw.console.error = (...args) => { consoleErrors.push(args.join(' ')); origErr(...args); };
                iw.addEventListener('error', (e) => consoleErrors.push('window.onerror: ' + e.message));
            }

            setTimeout(() => {
                const g = iw.game;
                g.startLevel(levelIdx);
                setTimeout(() => {
                    const profileDiv = iw.document.getElementById('init-profiling-game');
                    if (profileDiv) {
                        const clone = document.importNode(profileDiv, true);
                        clone.id = 'init-profiling';
                        document.body.appendChild(clone);
                    }
                    if (q.get('followcam') !== '1') {
                        g.freeCam = true;
                        g.camera.x = camX;
                        g.camera.y = camY;
                        g.camera.zoom = camZoom;
                        g.camera.targetZoom = camZoom;
                    } else {
                        g.camera.zoom = camZoom;
                        g.camera.targetZoom = camZoom;
                    }

                    // &script=eatenByMonster / noCargoExtract — scripted repros for
                    // the 2026-07-10 gameplay fixes (monster-kill = hard fail,
                    // no-cargo overtime-extraction exploit).
                    const script = q.get('script');
                    if (script === 'eatenByMonster') {
                        g.physics.lander.eatenByMonster = true;
                        g.physics.lander.crashed = true;
                        g.physics.lander.integrity = 0;
                    } else if (script === 'noCargoExtract') {
                        g.physics.lander.landed = true;
                        g.physics.lander.currentPad = 'start';
                        g.deliveredCount = 0;
                        g.completeMission();
                    } else if (script === 'thrusting') {
                        g.physics.lander.thrusting = true;
                        g.physics.lander.enginePower = 1;
                        g.physics.lander.fuel = 100;
                        g.keys.ArrowUp = true;
                        g.keys.w = true;
                    } else if (script === 'falling') {
                        g.physics.lander.landed = false;
                        g.physics.lander.vy = 6;
                        g.physics.lander.fuel = 100;
                    } else if (script === 'parachuteSim') {
                        // Manually drives applyGravityAndWind() in a synchronous
                        // loop instead of relying on requestAnimationFrame (which
                        // doesn't reliably tick during --screenshot's virtual-time
                        // fast-forward) — verifies the ~1s deploy delay and the
                        // velocity cap without needing real animation frames.
                        const l = g.physics.lander;
                        l.landed = false; l.fuel = 0; l.vy = 8; l.vx = 0;
                        const lv = g.physics.currentLevelConfig;
                        const log = [];
                        try {
                            for (let i = 1; i <= 90; i++) {
                                g.physics.applyGravityAndWind(lv, 1);
                                if (i === 30 || i === 59 || i === 61 || i === 90) {
                                    log.push(`f${i}: vy=${l.vy.toFixed(2)} timer=${(l.chuteTimer||0).toFixed(0)} deployed=${!!l.chuteDeployed}`);
                                }
                            }
                        } catch (simErr) {
                            log.push('SIM ERROR: ' + simErr.message);
                        }
                        window.__parachuteSimLog = log;
                    } else if (script === 'dropLight') {
                        const hub = g.physics.deliveryHubs[0];
                        g.physics.lander.landed = true;
                        g.physics.lander.currentPad = hub.type;
                        g.physics.lander.x = hub.x + hub.width / 2;
                        g.physics.lander.y = hub.y - 14;
                        g.physics.boxes.push({
                            id: 'probe-box', x: hub.x + hub.width / 2, y: hub.y - 20,
                            type: hub.type, size: g.physics.BOX_SIZE, onDeck: true,
                            emoji: '📦', vx: 0, vy: 0, mass: 1, age: 0,
                        });
                    } else if (script === 'parachute') {
                        // Headless Chrome's --virtual-time-budget fast-forwards
                        // setTimeout but doesn't reliably keep requestAnimationFrame
                        // ticking for --screenshot captures, so the real ~1s timer
                        // in applyGravityAndWind() can't be observed this way — force
                        // the deployed state directly to verify the visual instead.
                        g.physics.lander.landed = false;
                        g.physics.lander.y -= 300;
                        g.physics.lander.vy = 8;
                        g.physics.lander.fuel = 0;
                        g.physics.lander.chuteDeployed = true;
                    }

                    const st = document.createElement('div');
                    st.style.cssText = 'position:fixed;left:4px;bottom:4px;background:#000;color:#0f0;font:11px monospace;padding:2px 6px;z-index:99;max-width:1270px;white-space:pre-wrap';
                    try {
                        const sh = g.shaders, gl = sh && sh.gl;
                        let msg = !gl ? 'no webgl'
                            : 'postFX link: ' + gl.getProgramParameter(sh.postFXProgram, gl.LINK_STATUS);
                        if (gl && !gl.getProgramParameter(sh.postFXProgram, gl.LINK_STATUS)) {
                            st.style.color = '#f00';
                            msg += ' | ' + gl.getProgramInfoLog(sh.postFXProgram);
                        }
                        if (debug) {
                            const doc = iw.document;
                            const radarContainer = doc.getElementById('radar-container');
                            const radarCanvas = doc.getElementById('radar-canvas');
                            const cs = radarContainer ? iw.getComputedStyle(radarContainer) : null;
                            msg += '\nradar-container: ' + (radarContainer ? `found, display=${cs.display} visibility=${cs.visibility} w=${cs.width} h=${cs.height} opacity=${cs.opacity}` : 'MISSING FROM DOM');
                            msg += '\nradar-canvas: ' + (radarCanvas ? `found, ${radarCanvas.width}x${radarCanvas.height}` : 'MISSING FROM DOM');
                            msg += '\nuiCollapsed=' + g.uiCollapsed + ' gameState=' + g.gameState;
                            const l = g.physics.lander;
                            msg += '\nlander: fuel=' + l.fuel.toFixed(2) + ' vy=' + l.vy.toFixed(2) + ' chuteTimer=' + (l.chuteTimer || 0).toFixed(1) + ' chuteDeployed=' + !!l.chuteDeployed + ' landed=' + l.landed;
                            msg += '\nconsole errors: ' + (consoleErrors.length ? consoleErrors.join(' || ') : 'none');
                            if (iw.__parachuteSimLog) msg += '\n' + iw.__parachuteSimLog.join('\n');
                        }
                        st.textContent = msg;
                    } catch (e) { st.style.color = '#f00'; st.textContent = 'probe err: ' + e.message; }
                    document.body.appendChild(st);
                }, 600);
            }, 1200);
        });
    </script>
</body>

</html>
