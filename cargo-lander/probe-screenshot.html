<!doctype html>
<!-- Temporary headless-screenshot probe (not part of the game, safe to delete):
     loads the game in an iframe, jumps to a level, parks the camera at a
     given spot via freeCam, and lets headless Chrome screenshot the result.
     Usage: probe-screenshot.html?level=8&x=1500&y=750&zoom=0.8
     Add &debug=1 to dump extra diagnostics (radar/HUD element state, console
     errors forwarded from the iframe) into the on-screen status line instead
     of just the shader link status — used to track down the missing-minimap
     report on 2026-07-10. -->
<html lang="en">

<head>
    <meta name="robots" content="noindex">
</head>

<body style="margin:0">
    <iframe id="f" style="width:1280px;height:800px;border:0"></iframe>
    <script>
        // Suppress the first-run pilot-portrait selector modal before the
        // iframe ever loads index.html — game.init() checks this
        // synchronously during its own script execution (not from a later
        // callback), so setting it from an iframe 'load' handler is too late.
        // This page is served from the same origin as the game, so its
        // localStorage is already shared with the iframe once it navigates.
        try { localStorage.setItem('cargoLanderHasSeenPortraitSelector', '1'); } catch (e) {}
        // Same for the first-run "How to Play" tutorial modal — it otherwise
        // covers the whole scene in headless screenshots (fresh localStorage).
        try { localStorage.setItem('cargoLanderHasSeenTutorial', '1'); } catch (e) {}
        document.getElementById('f').src = 'index.html';

        const q = new URLSearchParams(location.search);
        // &vw=900&vh=420 — size the game iframe (default 1280x800), for
        // checking responsive/mobile layouts headlessly. Set before the iframe
        // loads its content so the game boots at the target viewport size.
        {
            const vw = parseInt(q.get('vw') || '0'), vh = parseInt(q.get('vh') || '0');
            const fEl = document.getElementById('f');
            if (vw > 0) fEl.style.width = vw + 'px';
            if (vh > 0) fEl.style.height = vh + 'px';
        }
        const levelIdx = parseInt(q.get('level') || '0');
        const camX = parseFloat(q.get('x') || '0');
        const camY = parseFloat(q.get('y') || '0');
        const camZoom = parseFloat(q.get('zoom') || '1');
        const debug = q.get('debug') === '1';

        const consoleErrors = [];

        const f = document.getElementById('f');
        f.addEventListener('load', () => {
            const iw = f.contentWindow;
            // &hide=fnName1,fnName2 — no-ops these CargoGame.prototype methods
            // before the level starts, for bisecting which draw call produces a
            // given visual (used to track down the "diagonal shading wedge"
            // report on 2026-07-10 by disabling candidates one at a time).
            const hide = (q.get('hide') || '').split(',').filter(Boolean);
            for (const fn of hide) {
                if (typeof iw.CargoGame.prototype[fn] === 'function') {
                    iw.CargoGame.prototype[fn] = function () { };
                }
            }
            if (debug) {
                const origErr = iw.console.error.bind(iw.console);
                iw.console.error = (...args) => { consoleErrors.push(args.join(' ')); origErr(...args); };
                iw.addEventListener('error', (e) => consoleErrors.push('window.onerror: ' + e.message));
            }

            setTimeout(() => {
                const g = iw.game;
                g.startLevel(levelIdx);
                setTimeout(() => {
                    const profileDiv = iw.document.getElementById('init-profiling-game');
                    if (profileDiv) {
                        const clone = document.importNode(profileDiv, true);
                        clone.id = 'init-profiling';
                        document.body.appendChild(clone);
                    }
                    if (q.get('followcam') !== '1') {
                        g.freeCam = true;
                        g.camera.x = camX;
                        g.camera.y = camY;
                        g.camera.zoom = camZoom;
                        g.camera.targetZoom = camZoom;
                    } else {
                        g.camera.zoom = camZoom;
                        g.camera.targetZoom = camZoom;
                    }

                    // &script=eatenByMonster / noCargoExtract — scripted repros for
                    // the 2026-07-10 gameplay fixes (monster-kill = hard fail,
                    // no-cargo overtime-extraction exploit).
                    // &lanes=1 mirrors the dev panel's "Show Traffic Lanes" toggle,
                    // so the precomputed ambient-traffic path can be screenshotted.
                    if (q.get('lanes') === '1') g.showTrafficLanes = true;

                    const script = q.get('script');
                    if (script === 'eatenByMonster') {
                        g.physics.lander.eatenByMonster = true;
                        g.physics.lander.crashed = true;
                        g.physics.lander.integrity = 0;
                    } else if (script === 'noCargoExtract') {
                        g.physics.lander.landed = true;
                        g.physics.lander.currentPad = 'start';
                        g.deliveredCount = 0;
                        g.completeMission();
                    } else if (script === 'thrusting') {
                        g.physics.lander.thrusting = true;
                        g.physics.lander.enginePower = 1;
                        g.physics.lander.fuel = 100;
                        g.keys.ArrowUp = true;
                        g.keys.w = true;
                    } else if (script === 'falling') {
                        g.physics.lander.landed = false;
                        g.physics.lander.vy = 6;
                        g.physics.lander.fuel = 100;
                    } else if (script === 'fullscreenUnsupported') {
                        // Reproduces iPhone Safari, which implements no element
                        // Fullscreen API: tapping Fullscreen used to throw a
                        // TypeError out of the inline onclick and paint
                        // index.html's red #error-log banner over the game.
                        // A clean shot here means the banner stayed hidden.
                        const de = iw.document.documentElement;
                        for (const k of ['requestFullscreen', 'webkitRequestFullscreen', 'msRequestFullscreen']) {
                            Object.defineProperty(de, k, { value: undefined, configurable: true });
                        }
                        g.updateFullscreenAvailability();
                        // Click the real button rather than calling the method:
                        // the symptom depends on the exception escaping the
                        // inline onclick *inside the iframe*, which is what
                        // reaches index.html's window.onerror. Calling
                        // g.toggleFullscreen() from out here throws in the parent
                        // instead and the banner never shows either way.
                        const fsBtn = iw.document.getElementById('hud-fullscreen-btn');
                        if (fsBtn) fsBtn.click();
                    } else if (script === 'shieldGauge') {
                        // Vitals-cluster check: shield upgrade owned (row should
                        // appear) with partial charge, fuel/hull dropped to
                        // partial levels so the quarter-tick marks + E/F read.
                        g.upgrades.shieldRegen = 2;
                        g.physics.lander.maxShieldCharge = 100;
                        g.physics.lander.shieldCharge = 60;
                        g.physics.lander.fuel = g.physics.lander.maxFuel * 0.55;
                        g.physics.lander.integrity = g.physics.lander.maxIntegrity * 0.8;
                    } else if (script === 'parachuteSim') {
                        // Manually drives applyGravityAndWind() in a synchronous
                        // loop instead of relying on requestAnimationFrame (which
                        // doesn't reliably tick during --screenshot's virtual-time
                        // fast-forward) — verifies the ~1s deploy delay and the
                        // velocity cap without needing real animation frames.
                        const l = g.physics.lander;
                        l.landed = false; l.fuel = 0; l.vy = 8; l.vx = 0;
                        const lv = g.physics.currentLevelConfig;
                        const log = [];
                        try {
                            for (let i = 1; i <= 90; i++) {
                                g.physics.applyGravityAndWind(lv, 1);
                                if (i === 30 || i === 59 || i === 61 || i === 90) {
                                    log.push(`f${i}: vy=${l.vy.toFixed(2)} timer=${(l.chuteTimer||0).toFixed(0)} deployed=${!!l.chuteDeployed}`);
                                }
                            }
                        } catch (simErr) {
                            log.push('SIM ERROR: ' + simErr.message);
                        }
                        window.__parachuteSimLog = log;
                    } else if (script === 'touchHud') {
                        // Forces the mobile touch HUD on regardless of the real
                        // browser/device this probe runs in, so the on-screen
                        // d-pad/thrust buttons and the bottom-left version/FPS
                        // stamp can be screenshotted at an arbitrary --window-size
                        // (e.g. a short landscape phone viewport) without a real
                        // touchscreen.
                        g.isTouchDevice = true;
                        g.updateMobileControlsVisibility();
                    } else if (script === 'dropLight') {
                        const hub = g.physics.deliveryHubs[0];
                        g.physics.lander.landed = true;
                        g.physics.lander.currentPad = hub.type;
                        g.physics.lander.x = hub.x + hub.width / 2;
                        g.physics.lander.y = hub.y - 14;
                        g.physics.boxes.push({
                            id: 'probe-box', x: hub.x + hub.width / 2, y: hub.y - 20,
                            type: hub.type, size: g.physics.BOX_SIZE, onDeck: true,
                            emoji: '📦', vx: 0, vy: 0, mass: 1, age: 0,
                        });
                    } else if (script === 'hubStyles') {
                        // Lines up one fake hub per `style` variant next to the
                        // level's real hub so a single screenshot shows crane /
                        // house / depot / silo / none rendering side by side.
                        const base = g.physics.deliveryHubs[0];
                        ['house', 'depot', 'silo', 'none'].forEach((st, i) => {
                            g.physics.deliveryHubs.push({
                                x: base.x + (i + 1) * 160, y: base.y,
                                width: base.width, height: base.height,
                                color: ['#f87171', '#4ade80', '#c084fc', '#fbbf24'][i],
                                type: 'normal', name: st.toUpperCase(), style: st,
                            });
                        });
                    } else if (script === 'trafficSim') {
                        // Ambient-traffic lane check. updateAmbientTraffic() sets each
                        // truck's altitude from `min(baseY, highestTerrainAhead - 140)`,
                        // so a level's roof heights — not just ambientTrafficMinY/MaxY —
                        // decide where the lane actually sits. rAF doesn't tick reliably
                        // under --virtual-time-budget, so drive it synchronously.
                        // Optional &simx=/&simy= park the lander first (traffic spawns
                        // and despawns relative to it, so the sample is position-local).
                        const l = g.physics.lander;
                        const simX = parseFloat(q.get('simx') ?? l.x);
                        const simY = parseFloat(q.get('simy') ?? l.y);
                        l.x = simX; l.y = simY; l.landed = false;
                        if (iw.Matter && g.physics.landerBody) {
                            iw.Matter.Body.setPosition(g.physics.landerBody, { x: simX, y: simY });
                        }
                        const log = [];
                        try {
                            // ~60s at 60fps — long enough to reach steady state.
                            // Trucks spawn 2000px out and only despawn at 2500px,
                            // so a short run reads as artificially empty.
                            const frames = parseInt(q.get('simframes') || '3600', 10);
                            for (let i = 0; i < frames; i++) g.physics.updateAmbientTraffic(1);
                            const tr = g.physics.ambientTraffic || [];
                            const ys = tr.filter(t => !t.flyingOff).map(t => t.y).sort((a, b) => a - b);
                            const near = tr.filter(t => Math.abs(t.x - simX) < 700).length;
                            log.push(`trafficSim @(${simX},${simY}): n=${tr.length} within700px=${near}`);
                            if (ys.length) {
                                const q1 = ys[Math.floor(ys.length * 0.25)];
                                const q3 = ys[Math.floor(ys.length * 0.75)];
                                log.push(`  lane y: min=${ys[0].toFixed(0)} q1=${q1.toFixed(0)} med=${ys[Math.floor(ys.length / 2)].toFixed(0)} q3=${q3.toFixed(0)} max=${ys[ys.length - 1].toFixed(0)}`);
                            }
                        } catch (simErr) {
                            log.push('SIM ERROR: ' + simErr.message);
                        }
                        iw.__probeSimLog = log;
                    } else if (script === 'wormWatch') {
                        // Sandworm behaviour check. Parks the lander low inside a
                        // sandworm zone and ticks updateMonster() synchronously
                        // until the creature is out of the sand, then freezes so
                        // the screenshot catches it mid-surface alongside the lair
                        // dressing. &wormBluff=1 forces a threat display instead of
                        // a committed strike; &wormFrames caps the search.
                        const l = g.physics.lander;
                        const lv = g.physics.currentLevelConfig;
                        const wx = parseFloat(q.get('wormx') || '900');
                        const wy = parseFloat(q.get('wormy') || '460');
                        l.landed = false; l.currentPad = null;
                        l.x = wx; l.y = wy; l.vx = 0; l.vy = 0;
                        if (iw.Matter && g.physics.landerBody) {
                            iw.Matter.Body.setPosition(g.physics.landerBody, { x: wx, y: wy });
                        }
                        // Scripted RNG, same trick as tests.html: the spawn block
                        // rolls chance -> spawnX -> bluff, in that order.
                        const wantBluff = q.get('wormBluff') === '1';
                        const realRandom = Math.random;
                        const script3 = [0, 0.5, wantBluff ? 0 : 0.999];
                        let ri = 0;
                        Math.random = () => (ri < script3.length ? script3[ri++] : 0.999);
                        const log = [];
                        try {
                            const maxF = parseInt(q.get('wormFrames') || '400', 10);
                            let f = 0, peak = Infinity;
                            // Run until the worm is well clear of the sand
                            for (; f < maxF; f++) {
                                g.physics.updateMonster(lv, 1);
                                l.x = wx; l.y = wy; l.vx = 0; l.vy = 0;
                                const w = g.physics.sandWorm;
                                if (w) {
                                    peak = Math.min(peak, w.y);
                                    if (w.state === 'holding' || (!w.isBluff && w.lungeTimer > 10)) break;
                                }
                            }
                            const w = g.physics.sandWorm;
                            log.push(`wormWatch @(${wx},${wy}) bluff=${wantBluff} frames=${f}`);
                            log.push(w ? `  state=${w.state} isBluff=${!!w.isBluff} y=${w.y.toFixed(0)} peak=${peak.toFixed(0)}`
                                       : '  NO WORM SURFACED');
                            log.push(`  hull=${l.integrity.toFixed(1)}`);
                        } catch (simErr) {
                            log.push('SIM ERROR: ' + simErr.message);
                        } finally {
                            Math.random = realRandom;
                        }
                        iw.__probeSimLog = log;
                    } else if (script === 'dustLane') {
                        // Altitude fog band + freight lane check (L6). Parks the
                        // lander at `laneY` (default: mid-band) and drives the
                        // traffic/fog physics in a synchronous loop, since
                        // --virtual-time-budget doesn't reliably tick rAF. Shows
                        // the dust gradient, the lander's clear bubble, the
                        // running-light glows punched through the murk, and
                        // stamps hull loss so the abrasion rate is checkable.
                        const l = g.physics.lander;
                        const lv = g.physics.currentLevelConfig;
                        const laneY = parseFloat(q.get('laneY') || String(((lv.fogBandTopY ?? 0) + (lv.fogBandBottomY ?? 0)) / 2));
                        l.landed = false; l.currentPad = null;
                        l.x = parseFloat(q.get('laneX') || '900');
                        l.y = laneY;
                        l.vx = 0; l.vy = 0;
                        if (iw.Matter && g.physics.landerBody) {
                            iw.Matter.Body.setPosition(g.physics.landerBody, { x: l.x, y: l.y });
                        }
                        const hull0 = l.integrity;
                        const frames = parseInt(q.get('laneFrames') || '600');
                        const log = [];
                        try {
                            for (let i = 0; i < frames; i++) {
                                // Pin the lander in the lane — we're inspecting the
                                // band, not flying through it.
                                l.y = laneY; l.vy = 0; l.vx = 0;
                                g.physics.updateAmbientTraffic(1);
                                g.physics.updateAltitudeFog(1);
                            }
                        } catch (simErr) {
                            log.push('SIM ERROR: ' + simErr.message);
                        }
                        const inBand = g.physics.ambientTraffic.filter(t => g.physics.fogDensityAt(t.y) > 0.05).length;
                        log.push(`laneY=${laneY} density=${g.physics.fogDensity.toFixed(3)}`);
                        log.push(`traffic=${g.physics.ambientTraffic.length} (in fog: ${inBand})`);
                        log.push(`hull ${hull0.toFixed(1)} -> ${l.integrity.toFixed(1)} over ${frames}f (${(hull0 - l.integrity).toFixed(1)} lost / ${(frames / 60).toFixed(1)}s)`);
                        // Stamp on the iframe's window — the status readout below
                        // reads these off `iw`, not off the probe page itself.
                        iw.__probeSimLog = log;
                    } else if (script === 'parachute') {
                        // Headless Chrome's --virtual-time-budget fast-forwards
                        // setTimeout but doesn't reliably keep requestAnimationFrame
                        // ticking for --screenshot captures, so the real ~1s timer
                        // in applyGravityAndWind() can't be observed this way — force
                        // the deployed state directly to verify the visual instead.
                        g.physics.lander.landed = false;
                        g.physics.lander.y -= 300;
                        g.physics.lander.vy = 8;
                        g.physics.lander.fuel = 0;
                        g.physics.lander.chuteDeployed = true;
                    }

                    const st = document.createElement('div');
                    st.style.cssText = 'position:fixed;left:4px;bottom:4px;background:#000;color:#0f0;font:11px monospace;padding:2px 6px;z-index:99;max-width:1270px;white-space:pre-wrap';
                    try {
                        const sh = g.shaders, gl = sh && sh.gl;
                        let msg = !gl ? 'no webgl'
                            : 'postFX link: ' + gl.getProgramParameter(sh.postFXProgram, gl.LINK_STATUS);
                        if (gl && !gl.getProgramParameter(sh.postFXProgram, gl.LINK_STATUS)) {
                            st.style.color = '#f00';
                            msg += ' | ' + gl.getProgramInfoLog(sh.postFXProgram);
                        }
                        if (debug) {
                            const doc = iw.document;
                            const radarContainer = doc.getElementById('radar-container');
                            const radarCanvas = doc.getElementById('radar-canvas');
                            const cs = radarContainer ? iw.getComputedStyle(radarContainer) : null;
                            msg += '\nradar-container: ' + (radarContainer ? `found, display=${cs.display} visibility=${cs.visibility} w=${cs.width} h=${cs.height} opacity=${cs.opacity}` : 'MISSING FROM DOM');
                            msg += '\nradar-canvas: ' + (radarCanvas ? `found, ${radarCanvas.width}x${radarCanvas.height}` : 'MISSING FROM DOM');
                            msg += '\nuiCollapsed=' + g.uiCollapsed + ' gameState=' + g.gameState;
                            const l = g.physics.lander;
                            msg += '\nlander: fuel=' + l.fuel.toFixed(2) + ' vy=' + l.vy.toFixed(2) + ' chuteTimer=' + (l.chuteTimer || 0).toFixed(1) + ' chuteDeployed=' + !!l.chuteDeployed + ' landed=' + l.landed;
                            msg += '\nconsole errors: ' + (consoleErrors.length ? consoleErrors.join(' || ') : 'none');
                            if (iw.__parachuteSimLog) msg += '\n' + iw.__parachuteSimLog.join('\n');
                        }
                        // A sim script's readout IS its check, so it stamps without
                        // needing &debug=1.
                        if (iw.__probeSimLog) msg += '\n' + iw.__probeSimLog.join('\n');
                        st.textContent = msg;
                    } catch (e) { st.style.color = '#f00'; st.textContent = 'probe err: ' + e.message; }
                    document.body.appendChild(st);
                }, 600);
            }, 1200);
        });
    </script>
</body>

</html>
