<!doctype html>
<!-- Temporary script-load smoke check (safe to delete): loads each core game
     script alone and dumps any parse/runtime error into #err for headless
     --dump-dom capture. -->
<html><body>
<pre id="err">no errors</pre>
<script>
  const errs = [];
  window.addEventListener('error', e => {
    errs.push(`${e.filename}:${e.lineno}:${e.colno} ${e.message}`);
    document.getElementById('err').textContent = errs.join('\n');
  });
</script>
<script src="levels.js"></script>
<script src="upgrades.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="physics.js"></script>
<script src="render.js"></script>
<script src="render/background.js"></script>
<script src="render/entities.js"></script>
<script src="physics/atmosphere.js"></script>
<script src="game/hud.js"></script>
<script src="levelSchema.js"></script>
<script>
  if (typeof CargoGame === 'undefined') errs.push('CargoGame still undefined after game.js');
  document.getElementById('err').textContent = errs.join('\n') || 'no errors';
</script>
</body></html>
