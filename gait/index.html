    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(255, 255, 255, 0.05);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #34d399;
            --accent-rgb: 52, 211, 153;
            --pull: #fb7185;
            --stretch: #60a5fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(ellipse at 50% 0%, #17233f 0%, var(--bg) 60%);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100dvh;
            display: flex; flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }
        button, input { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .bar { display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 1rem; flex-wrap: wrap; }
        .back {
            color: var(--muted); text-decoration: none; font-size: 0.85rem;
            padding: 0.35rem 0.7rem; border-radius: 999px;
            border: 1px solid var(--panel-border); background: var(--panel);
        }
        .back:hover { color: var(--text); }
        h1 { font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
        h1 span { color: var(--accent); }
        .tag { color: var(--muted); font-size: 0.85rem; }

        .wrap { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 1rem 1.2rem; display: flex; flex-direction: column; gap: 0.9rem; }

        .glass {
            background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .stage { position: relative; overflow: hidden; }
        #stage { display: block; width: 100%; height: min(52dvh, 480px); touch-action: none; border-radius: 16px; }
        .caption {
            position: absolute; left: 1rem; top: 0.8rem; right: 1rem;
            font-size: 0.9rem; color: #cbd5e1; text-shadow: 0 1px 6px rgba(0,0,0,0.7); pointer-events: none;
        }
        .caption b { font-family: 'Outfit', sans-serif; font-size: 1.05rem; color: var(--text); margin-right: 0.5rem; }
        .legend { position: absolute; right: 1rem; bottom: 0.7rem; display: flex; gap: 0.9rem; font-size: 0.72rem; color: var(--muted); pointer-events: none; }
        .legend i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 0.3rem; }
        .legend .dot { width: 9px; height: 9px; border-radius: 50%; }

        .tools { position: absolute; left: 0.8rem; bottom: 0.7rem; display: none; gap: 0.35rem; flex-wrap: wrap; }
        body.build .tools { display: flex; }
        body.build .legend { display: none; }

        .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 2.2fr); gap: 0.9rem; }
        .stat { padding: 0.8rem 1rem; }
        .stat small { display: block; color: var(--muted); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
        .stat strong { font-family: 'Outfit', sans-serif; font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
        .stat strong span { font-size: 0.9rem; font-weight: 600; color: var(--muted); margin-left: 0.15rem; }
        .chart { padding: 0.6rem 0.8rem; display: flex; flex-direction: column; gap: 0.3rem; justify-content: center; }
        .chart small { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; display: flex; gap: 0.9rem; }
        .chart small i { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 500; }
        .chart small .b { color: var(--accent); }
        #chart { width: 100%; height: 64px; flex: none; display: block; }

        .controls { display: flex; flex-wrap: wrap; gap: 0.5rem 1.4rem; align-items: center; padding: 0.8rem 1rem; }
        .group { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
        .group > span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-right: 0.2rem; }
        .chip {
            font-size: 0.82rem; padding: 0.38rem 0.8rem; border-radius: 999px; cursor: pointer;
            background: rgba(255,255,255,0.06); border: 1px solid var(--panel-border); color: #cbd5e1;
        }
        .chip:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .chip[aria-pressed="true"] { background: rgba(var(--accent-rgb), 0.16); border-color: rgba(var(--accent-rgb), 0.55); color: var(--accent); }
        .chip.primary { background: var(--accent); border-color: var(--accent); color: #05281c; font-weight: 600; }
        .chip:disabled { opacity: 0.45; cursor: not-allowed; }
        .grow { flex: 1; }
        #why { font-size: 0.82rem; color: #fca5a5; min-height: 1.2em; }
        .how { font-size: 0.82rem; color: var(--muted); line-height: 1.55; padding: 0 0.2rem; }
        .how b { color: #cbd5e1; font-weight: 600; }

        @media (max-width: 820px) {
            .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .chart { grid-column: 1 / -1; }
            .stat strong { font-size: 1.35rem; }
            #stage { height: 44dvh; }
            .tag { display: none; }
            .legend { display: none; }
        }
    </style>

<body>
    <header class="bar">
        <a class="back" href="../">← Back</a>
        <h1>Gait <span>Lab</span></h1>
        <span class="tag">Nobody tells them how to walk.</span>
    </header>

    <main class="wrap">
        <section class="stage glass">
            <canvas id="stage" aria-label="Creatures racing to the right across flat ground"></canvas>
            <div class="caption" id="caption"></div>
            <div class="legend">
                <span><i style="background:var(--pull)"></i>muscle pulling</span>
                <span><i style="background:var(--stretch)"></i>stretching</span>
                <span><i style="background:#e2e8f0"></i>bone</span>
                <span><i class="dot" style="background:#0b1220;border:2px solid #e2e8f0"></i>grippy foot</span>
            </div>
            <div class="tools" role="group" aria-label="Building tools">
                <button class="chip" type="button" data-tool="muscle" aria-pressed="true">Muscle</button>
                <button class="chip" type="button" data-tool="bone" aria-pressed="false">Bone</button>
                <button class="chip" type="button" data-tool="move" aria-pressed="false">Move</button>
                <button class="chip" type="button" data-tool="erase" aria-pressed="false">Erase</button>
            </div>
        </section>

        <section class="row">
            <div class="stat glass"><small>Generation</small><strong id="s-gen">1</strong></div>
            <div class="stat glass"><small>This race</small><strong id="s-now">0.0<span>m</span></strong></div>
            <div class="stat glass"><small>Record</small><strong id="s-rec">0.0<span>m</span></strong></div>
            <div class="stat glass"><small>Its tempo</small><strong id="s-hz">0.0<span>beats/s</span></strong></div>
            <div class="chart glass">
                <small>Distance by generation <i class="b">— best</i><i>— average</i></small>
                <canvas id="chart"></canvas>
            </div>
        </section>

        <section class="controls glass">
            <div class="group" id="presets"><span>Body</span></div>
            <div class="group">
                <button class="chip" type="button" id="btn-build">Build your own</button>
                <button class="chip primary" type="button" id="btn-go" hidden>Evolve it</button>
            </div>
            <div class="group" id="skips"><span>Each race skips</span>
                <button class="chip" type="button" data-skip="1" aria-pressed="true">nothing</button>
                <button class="chip" type="button" data-skip="5" aria-pressed="false">5 generations</button>
                <button class="chip" type="button" data-skip="25" aria-pressed="false">25</button>
            </div>
            <div class="group" id="speeds"><span>Speed</span>
                <button class="chip" type="button" data-speed="1" aria-pressed="false">1×</button>
                <button class="chip" type="button" data-speed="2" aria-pressed="true">2×</button>
                <button class="chip" type="button" data-speed="5" aria-pressed="false">5×</button>
            </div>
            <div class="grow"></div>
            <div class="group">
                <button class="chip" type="button" id="btn-restart">Start over</button>
                <button class="chip" type="button" id="btn-share">Copy link</button>
            </div>
        </section>
        <div id="why" role="status"></div>

        <p class="how" id="how"></p>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
