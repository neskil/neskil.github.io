            assert('a tee on a lap is caught', bad(tee).some(function (m) { return /tee is on a skater/.test(m); }));
            var edge = rink({ skaters: [Hs.skater(480, 320, 300, 300, 0.5, 0)] });
            assert('a lap off the field is caught', bad(edge).some(function (m) { return /too big|near the cushion/.test(m); }));
            var quick = rink({ skaters: [Hs.skater(480, 320, 200, 100, 2, 0)] });
            assert('a skater too quick to read is caught', bad(quick).some(function (m) { return /too quick/.test(m); }));
            var meet = rink({ skaters: [oval, Hs.skater(480, 320, 150, 100, -1, 0)] });
            assert('two laps that meet are caught', bad(meet).some(function (m) { return /laps that meet/.test(m); }));
        })();

        /* ── scenery ───────────────────────────────────────────────────── */
        section('Scenery');

        /* What a hole looks like is not allowed to change what it is. The
           outline a hazard is drawn as has to cover exactly what the physics
           tests, and decoration has to stay out of the way of the ball, the
           cup, the tee and every tunnel mouth. Checked on every shipped hole
           and a handful of draws. */
        (function () {
            var SCN = GOLF.scenery;
            var holes = [];
            everyHole(function (h, i, course) { holes.push({ h: h, course: course, tag: course.id + ' ' + h.name }); });
            [1, 42, 31337].forEach(function (seed) {
                var d = GOLF.generateCourse(seed);
                d.holes.forEach(function (h) { holes.push({ h: h, course: d, tag: 'draw ' + seed + ' ' + h.name }); });
            });

            function exact(list) {
                var xs = [], ys = [];
                list.forEach(function (z) { xs.push(z.x, z.x + z.w); ys.push(z.y, z.y + z.h); });
                xs = xs.sort(function (a, b) { return a - b; }); ys = ys.sort(function (a, b) { return a - b; });
                var a = 0;
                for (var i = 0; i < xs.length - 1; i++) {
                    for (var j = 0; j < ys.length - 1; j++) {
                        if (xs[i + 1] === xs[i] || ys[j + 1] === ys[j]) continue;
                        if (P.zoneAt(list, (xs[i] + xs[i + 1]) / 2, (ys[j] + ys[j + 1]) / 2)) a += (xs[i + 1] - xs[i]) * (ys[j + 1] - ys[j]);
                    }
                }
                return a;
            }
            var wrong = [];
            holes.forEach(function (e) {
                ['water', 'sand', 'rough', 'ice'].forEach(function (k) {
                    var rects = e.h[k].filter(function (z) { return !z.pts; });
                    if (!rects.length) return;
                    var drawn = SCN.outline(rects).reduce(function (t, l) { return t + SCN.signedArea(l); }, 0);
                    if (Math.abs(drawn - exact(rects)) > 1e-6) wrong.push(e.tag + ' ' + k);
                });
            });
            assert('a hazard is drawn as exactly the union of its rectangles', wrong.length === 0, wrong.slice(0, 3).join(' · '));
            var ring = SCN.outline([{ x: 100, y: 100, w: 300, h: 40 }, { x: 100, y: 260, w: 300, h: 40 },
                                    { x: 100, y: 140, w: 40, h: 120 }, { x: 360, y: 140, w: 40, h: 120 }]);
            assert('a ring of rectangles is one shore round the outside and one round the island',
                ring.length === 2 && ring.some(function (l) { return SCN.signedArea(l) < 0; }));
            var cw = SCN.outline([{ pts: [100, 100, 100, 300, 300, 300] }])[0];
            assert('a polygon drawn the other way round is turned clockwise, so overlaps add up', SCN.signedArea(cw) > 0);

            /* Every hole in its own biome, and every hole in every other one
               too: the Scenery row can put any course in any of them. */
            var problems = [], fairway = [], night = [], dressed = 0;
            holes.forEach(function (e) {
              [SCN.themeOf(e.course)].concat(SCN.ORDER.map(SCN.themeNamed)).forEach(function (theme, ti) {
                if (ti > 0 && theme === SCN.themeOf(e.course)) return;
                dressed++;
                var d = SCN.decor(e.h, theme);
                var again = SCN.decor(e.h, theme);
                if (JSON.stringify(d) !== JSON.stringify(again)) problems.push(e.tag + ': decoration moved between two loads');
                var soft = d.decals.filter(function (p) { return p.soft; }), showy = d.decals.length - soft.length;
                d.decals.forEach(function (p) {
                    if (p.soft ? theme.lawn.indexOf(p.kind) < 0 : theme.border.indexOf(p.kind) < 0) fairway.push(e.tag + ' ' + theme.id + ': a ' + p.kind + ' that is not this biome\'s');
                    if (!p.soft && !SCN.border(e.h, p.x, p.y)) fairway.push(e.tag + ' ' + theme.id + ': a ' + p.kind + ' out on the fairway');
                    if (p.soft && SCN.border(e.h, p.x, p.y)) fairway.push(e.tag + ' ' + theme.id + ': a faint stray in the border');
                });
                if (soft.length > SCN.LAWN_MAX) fairway.push(e.tag + ' ' + theme.id + ': ' + soft.length + ' strays on the fairway');
                // A patch is started while there is room for one, so the last
                // can run a few over.
                if (showy > SCN.BORDER_MAX + 6) fairway.push(e.tag + ' ' + theme.id + ': ' + showy + ' flowers');
                if (!!theme.night !== d.lamps.length > 0) night.push(e.tag + ' ' + theme.id + ': lamps by day or none at night');
                d.lamps.forEach(function (l) {
                    if (Math.min(l.x, l.y, C.WORLD_W - l.x, C.WORLD_H - l.y) > 12) night.push(e.tag + ': a lamp off the cushion');
                });
                if (d.moon && !P.zoneAt(e.h.water, d.moon.x, d.moon.y)) night.push(e.tag + ': a moon that is not on the water');
                var keep = SCN.keepouts(e.h);
                d.decals.forEach(function (p) {
                    if (keep.some(function (k) { return Math.hypot(p.x - k.x, p.y - k.y) < k.r; })) problems.push(e.tag + ': a decal on the tee, the cup or a mouth');
                    if (P.zoneAt(e.h.water, p.x, p.y) || P.zoneAt(e.h.sand, p.x, p.y) || P.zoneAt(e.h.ice, p.x, p.y) ||
                        P.zoneAt(e.h.lava, p.x, p.y) || P.zoneAt(e.h.avalanches, p.x, p.y)) problems.push(e.tag + ': a decal in a hazard');
                });
                d.shore.concat(d.pads, d.ducks).forEach(function (p) {
                    if (!P.zoneAt(e.h.water, p.x, p.y)) problems.push(e.tag + ': water dressing out of the water');
                });
                d.ducks.forEach(function (k) {
                    var loops = SCN.outline(e.h.water, true);
                    if (SCN.shoreDistance(loops, k.x, k.y) < k.r + 14) problems.push(e.tag + ': a duck that would paddle ashore');
                });
                d.canopies.forEach(function (c) {
                    keep.forEach(function (k) {
                        if (Math.hypot(c.x - k.x, c.y - k.y) < c.r + k.r + 60) problems.push(e.tag + ': a tree crown over the tee, the cup or a mouth');
                    });
                    // Standing off the field, reaching in over its edge.
                    if (c.x > 0 && c.x < C.WORLD_W && c.y > 0 && c.y < C.WORLD_H) problems.push(e.tag + ': a tree standing on the course');
                });
              });
            });
            note(dressed + ' holes dressed, every hole in every biome');
            assert('decoration keeps every rule on every hole, in every biome', problems.length === 0, problems.slice(0, 3).join(' · '));
            assert('flowers grow in the borders, and the fairway gets a few faint strays at most', fairway.length === 0, fairway.slice(0, 3).join(' · '));
            assert('lamps only after dark, on the cushion, and the moon on the water', night.length === 0, night.slice(0, 3).join(' · '));
            assert('the open fairway is the fairway: the middle of the field is not a border',
                !SCN.border({ rough: [], walls: [], rails: [], bumpers: [] }, C.WORLD_W / 2, C.WORLD_H / 2) &&
                SCN.border({ rough: [], walls: [], rails: [], bumpers: [] }, 20, C.WORLD_H / 2));

            var keys = Object.keys(SCN.THEMES);
            assert('the order names every biome exactly once', SCN.ORDER.length === keys.length &&
                keys.every(function (k) { return SCN.ORDER.indexOf(k) >= 0; }));
            var incomplete = [];
            SCN.ORDER.forEach(function (k) {
                var t = SCN.THEMES[k];
                ['turf', 'rough', 'sand', 'water', 'wall', 'bumper', 'rim', 'canopy', 'border', 'lawn', 'leaves', 'ambient', 'sound', 'backdrop', 'plan', 'name']
                    .forEach(function (f) { if (t[f] === undefined) incomplete.push(k + ' has no ' + f); });
                if (t.id !== k) incomplete.push(k + ' does not know its own id');
                if (!t.border.length || !t.lawn.length || !t.leaves.length) incomplete.push(k + ' has an empty list');
            });
            assert('every biome says everything the renderer will ask it', incomplete.length === 0, incomplete.slice(0, 3).join(' · '));

            assert('every course is drawn in a biome that exists', GOLF.COURSES.every(function (c) {
                return !c.theme || !!SCN.THEMES[c.theme];
            }));
            assert('no two hand-built courses share a biome', (function () {
                var t = GOLF.COURSES.map(function (c) { return c.theme; });
                return t.every(function (x, i) { return t.indexOf(x) === i; });
            })());
            var d1 = GOLF.generateCourse(7), d2 = GOLF.generateCourse(7);
            assert('a draw takes its biome from its seed', SCN.themeOf(d1) === SCN.themeOf(d2) && !!SCN.themeOf(d1).id);
        })();

        /* ── course data ────────────────────────────────────────────────── */
        section('Course data');

        /* Every hole on the rack, course by course, in the order the rack
           lists them. The order matters to the shared random streams below:
           the starter comes first, so its shots are the shots it has always
           been played with and adding a course cannot turn one of them
           red. */
        function byId(id) {
            return GOLF.COURSES.filter(function (c) { return c.id === id; })[0] || null;
        }

        function everyHole(fn) {
            GOLF.COURSES.forEach(function (course) {
                course.holes.forEach(function (h, i) { fn(h, i, course); });
            });
        }

        /* Everything in this section holds for every course on the rack, not
           just the one GOLF.COURSE happens to point at. A rule the second
           course is exempt from is a rule the second course will break. */

        (function () {
            assert('the rack holds more than one course', GOLF.COURSES.length > 1);
            assert('every course has an id, a name and a blurb',
                GOLF.COURSES.every(function (c) { return c.id && c.name && c.blurb; }));
            var ids = GOLF.COURSES.map(function (c) { return c.id; });
            assert('course ids are unique — they key the save file',
                ids.every(function (id, i) { return ids.indexOf(id) === i; }));
            /* Pinned rather than derived: the hole count is what the stored
               round is validated against, so a change to it has to be a
               deliberate one made here as well as in courses.js. Pinned by
               id rather than by rack position, because the order of the rack
               is a matter of taste and the length of a card is not. */
            var counts = { short: 6, links: 6, tide: 6, harvest: 6, wild: 6, dunes: 6, warren: 6, icerun: 6, alpine: 6, funfair: 6, desk: 6, ember: 6, orbit: 6 };
            Object.keys(counts).forEach(function (id) {
                var c = byId(id);
                assert(id + ' is on the rack', !!c);
                if (c) {
                    assert(id + ' still has ' + counts[id] + ' holes', c.holes.length === counts[id],
                        'got ' + c.holes.length);
                }
            });
            assert('every course on the rack is pinned above',
                GOLF.COURSES.length === Object.keys(counts).length, 'rack of ' + GOLF.COURSES.length);
            assert('GOLF.COURSE starts on the first course of the rack',
                GOLF.COURSE === GOLF.COURSES[0].holes && GOLF.COURSE_ID === GOLF.COURSES[0].id);

            /* Forty-two holes and no two the same name. The save file remaps a
               rebuilt card by hole name (scoring.js), so a name has to mean
               one hole wherever it is on the rack. */
            var names = [];
            GOLF.COURSES.forEach(function (c) { c.holes.forEach(function (h) { names.push(h.name); }); });
            assert('no two holes on the rack share a name', names.every(function (n, i) { return names.indexOf(n) === i; }),
                names.filter(function (n, i) { return names.indexOf(n) !== i; }).join(', '));

            /* The ladder inside a card: it gets harder as it goes, which par
               is the honest short measure of. A card that opened on its par
               five would be a card in the wrong order. */
            var climbs = GOLF.COURSES.filter(function (c) {
                return c.holes.some(function (h, i) { return i > 0 && h.par < c.holes[i - 1].par; });
            }).map(function (c) { return c.id; });
            assert('par never falls going down a card', climbs.length === 0, climbs.join(', '));

            /* Nine holes in ten on the old rack ran left to right. A card is
               a place when its holes face different ways. */
            var ways = GOLF.COURSES.map(function (c) {
                var dirs = {};
                c.holes.forEach(function (h) {
                    var dx = h.hole.x - h.tee.x, dy = h.hole.y - h.tee.y;
                    dirs[Math.abs(dx) > Math.abs(dy) * 2 ? (dx > 0 ? 'e' : 'w') : Math.abs(dy) > Math.abs(dx) * 2 ? (dy > 0 ? 's' : 'n') : 'diag'] = 1;
                });
                return { id: c.id, n: Object.keys(dirs).length };
            });
            assert('every card is played in at least two directions', ways.every(function (w) { return w.n >= 2; }),
                ways.filter(function (w) { return w.n < 2; }).map(function (w) { return w.id; }).join(', '));
        })();

        GOLF.COURSES.forEach(function (course) {
            var all = [], posts = [];
            course.holes.forEach(function (h) {
                all = all.concat(h.walls, h.water, h.sand, h.rough, h.ice, h.slopes, h.lava, h.avalanches);
                posts = posts.concat(h.bumpers);
            });

            var n = course.holes.length;
            var par = course.holes.reduce(function (t, h) { return t + h.par; }, 0);
            assert(course.id + ': total par is sane', par >= 2 * n && par <= 5 * n,
                'par ' + par + ' over ' + n + ' holes');

            // The normaliser exists so nothing downstream has to guard; if it
            // ever stops running, everything else fails in confusing ways.
            var lists = course.holes.every(function (h) {
                return ['walls', 'water', 'sand', 'rough', 'ice', 'bumpers', 'slopes', 'tunnels', 'rails',
                        'lava', 'avalanches', 'vents'].every(function (k) {
                    return Array.isArray(h[k]);
                });
            });
            assert(course.id + ': every hole has every hazard list, declared or not', lists);

            // Polygons have no width and height to compare; a sliver of one
            // would have passed this silently, so they are counted apart
            // and held to the rule book's measure of their width instead.
            var thin = all.filter(function (r) { return !r.pts && Math.min(r.w, r.h) < 20; });
            assert(course.id + ': every rectangle is at least 20px thick', thin.length === 0,
                thin.length + ' too thin — the substep cap cannot protect them');
            var slim = all.filter(function (r) {
                if (!r.pts) return false;
                var p = r.pts, area = 0, perim = 0;
                for (var i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
                    area += p[j] * p[i + 1] - p[i] * p[j + 1];
                    perim += Math.hypot(p[i] - p[j], p[i + 1] - p[j + 1]);
                }
                return p.length < 6 || Math.abs(area) / perim < 10;
            });
            assert(course.id + ': every polygon is at least 20px across', slim.length === 0, slim.length + ' slivers');
            var rails = course.holes.reduce(function (a, h) { return a.concat(P.railsOf(h)); }, []);
            assert(course.id + ': every rail, curve and kerb is at least 20px thick', rails.every(function (r) { return r.w >= 20; }));

            var small = posts.filter(function (b) { return b.r < C.BUMPER_MIN_R; });
            assert(course.id + ': every bumper is at least BUMPER_MIN_R across the radius', small.length === 0,
                small.length + ' too small — the substep cap cannot protect them');

            var named = course.holes.every(function (h) { return h.name && h.blurb; });
            assert(course.id + ': every hole has a name and a blurb', named);

            /* A card is built round one thing its place does, so it does not
               carry every hazard the game has — the volcano has no ice — but
               six holes of one hazard would be one hole six times. */
            var used = GOLF.HAZARD_KEYS.filter(function (k) {
                return course.holes.some(function (h) { return h[k].length > 0; });
            });
            assert(course.id + ': the course uses at least four kinds of hazard', used.length >= 4, used.join(', '));
        });

        // Hazards are not decoration: each one has to be in play somewhere.
        GOLF.HAZARD_KEYS.forEach(function (k) {
            assert('the rack uses ' + k + ' somewhere', GOLF.COURSES.some(function (c) {
                return c.holes.some(function (h) { return h[k].length > 0; });
            }));
        });

        /* The Warren is the card with a word nobody else has, so the word has
           to be on every hole of it — a tunnel course with a hole that has no
           tunnel is a hole from some other card. */
        (function () {
            var warren = byId('warren');
            assert('warren: every hole has a tunnel', warren && warren.holes.every(function (h) { return h.tunnels.length > 0; }));
            // The volcano is the card of lava; space, past it, is the last
            // the stars open.
            var ember = byId('ember');
            assert('ember: every hole has lava', ember && ember.holes.every(function (h) { return h.lava.length > 0; }));
            var orbit = byId('orbit');
            assert('orbit: is the last hand-built card the stars open',
                orbit && GOLF.COURSES.every(function (c) { return (c.unlock || 0) <= orbit.unlock; }));
            // And the desk is the card of the turntable.
            var desk = byId('desk');
            assert('desk: the record player is on the card', desk && desk.holes.some(function (h) { return h.turntables.length > 0; }));
            // And the mountain is the card of the clock.
            var alpine = byId('alpine');
            assert('alpine: most of its holes have a chute', alpine &&
                alpine.holes.filter(function (h) { return h.avalanches.length > 0; }).length >= 4);
        })();

        /* A force with no cause in sight reads as the game cheating, so a
           wind is never on its own: every wind has a fan standing at its head,
           and every fan has a wind to blow. And the one prop drawn over the
           ball — a windmill's sails — never reaches the tee, the cup or a
           tunnel mouth, so it can never hide anything a hole is about. */
        (function () {
            var orphans = [], idle = [], shaded = [];
            everyHole(function (h, i, course) {
                var fans = h.blocks.filter(function (b) { return b.look === 'fan'; });
                var winds = h.slopes.filter(function (s) { return s.wind; });
                winds.forEach(function (s) {
                    var m = Math.hypot(s.ax, s.ay), ux = s.ax / m, uy = s.ay / m;
                    // The middle of the edge the wind blows from.
                    var hx = s.x + s.w / 2 - ux * s.w / 2, hy = s.y + s.h / 2 - uy * s.h / 2;
                    var fed = fans.some(function (f) {
                        var p = GOLF.props.pole(f.pts);
                        return Math.hypot(p.x - hx, p.y - hy) < p.r + (f.w || 20) + 60;
                    });
                    if (!fed) orphans.push(course.id + ' ' + h.name);
                });
                if (fans.length && !winds.length) idle.push(course.id + ' ' + h.name);
                h.blocks.filter(function (b) { return b.look === 'windmill' || b.look === 'wheel'; }).forEach(function (b) {
                    var reach = GOLF.props.sailReach(b);
                    var spots = [{ x: h.tee.x, y: h.tee.y, r: 20 }, { x: h.hole.x, y: h.hole.y, r: C.HOLE_R + 10 }];
                    h.tunnels.forEach(function (t) { spots.push({ x: t.x, y: t.y, r: C.TUNNEL_R }, { x: t.tx, y: t.ty, r: C.TUNNEL_R }); });
                    if (spots.some(function (q) { return Math.hypot(q.x - reach.x, q.y - reach.y) < reach.r + q.r; })) shaded.push(course.id + ' ' + h.name);
                });
            });
            assert('every wind has a fan at its head', orphans.length === 0, orphans.join(', '));
            assert('…and every fan has a wind to blow', idle.length === 0, idle.join(', '));
            assert('a windmill\'s sails and a big wheel never reach the tee, the cup or a tunnel mouth', shaded.length === 0, shaded.join(', '));
            /* The starter is a walk through the rack: every hole of it in a
               biome of its own, and those biomes the ones the rest of the
               rack is set in. */
            var starter = GOLF.COURSES.filter(function (c) { return c.starter; })[0];
            var homes = GOLF.COURSES.map(function (c) { return c.theme; });
            var worn = starter.holes.map(function (h) { return GOLF.scenery.themeOf(starter, h).id; });
            assert('the starter walks through a different biome on every hole',
                worn.every(function (t, i) { return worn.indexOf(t) === i; }), worn.join(', '));
            assert('…every one of them a place the rack goes', worn.every(function (t) { return homes.indexOf(t) >= 0; }), worn.join(', '));
            assert('…starting at home', worn[0] === starter.theme);
        })();

        GOLF.COURSES.forEach(function (course) {
            var tunnels = course.holes.reduce(function (n, h) { return n + h.tunnels.length; }, 0);
            if (!tunnels) return;
            // Each pair wears its own colour on the board; past the palette
            // two would match and the matching is the whole of the reading.
            assert(course.id + ': no hole has more tunnels than there are tunnel colours',
                course.holes.every(function (h) { return h.tunnels.length <= C.TUNNEL_COLORS.length; }));
        });

        everyHole(function (h, i, course) {
            var tag = course.id + ' hole ' + (i + 1) + ' (' + h.name + ')';
            var margin = C.BALL_R + 1;

            assert(tag + ': par is between 2 and 5', h.par >= 2 && h.par <= 5);

            assert(tag + ': tee is inside the field',
                h.tee.x > margin && h.tee.x < C.WORLD_W - margin &&
                h.tee.y > margin && h.tee.y < C.WORLD_H - margin);

            assert(tag + ': cup is inside the field',
                h.hole.x > C.HOLE_R && h.hole.x < C.WORLD_W - C.HOLE_R &&
                h.hole.y > C.HOLE_R && h.hole.y < C.WORLD_H - C.HOLE_R);

            var teeBlocked = h.walls.some(function (w) {
                    return P.circleRect(h.tee.x, h.tee.y, C.BALL_R, P.wallRect(w, 0)) !== null;
                }) || h.rails.some(function (r) {
                    return P.circleRail(h.tee.x, h.tee.y, C.BALL_R, r) !== null;
                }) || h.bumpers.some(function (b) {
                    return P.circleCircle(h.tee.x, h.tee.y, C.BALL_R, b) !== null;
                }) || P.zoneAt(h.water, h.tee.x, h.tee.y) !== null || P.zoneAt(h.lava, h.tee.x, h.tee.y) !== null;
            assert(tag + ': the ball does not start inside a wall, a post, a lake or lava', !teeBlocked);

            // The cup needs clearance too: a flag half-buried in a wall would
            // be unputtable from one side, and a post on the lip would keep
            // out the very shots that deserve to drop.
            var cupBlocked = h.walls.some(function (w) {
                    return P.circleRect(h.hole.x, h.hole.y, C.HOLE_R, P.wallRect(w, 0)) !== null;
                }) || h.rails.some(function (r) {
                    return P.circleRail(h.hole.x, h.hole.y, C.HOLE_R, r) !== null;
                }) || h.bumpers.some(function (b) {
                    return P.circleCircle(h.hole.x, h.hole.y, C.HOLE_R, b) !== null;
                }) || P.zoneAt(h.water, h.hole.x, h.hole.y) !== null || P.zoneAt(h.lava, h.hole.x, h.hole.y) !== null;
            assert(tag + ': the cup is clear of walls, posts, water and lava', !cupBlocked);

            // Two posts closer than this leave a mouth the ball cannot be
            // putted through, which is a hole that looks open and is not.
            var pinched = [];
            h.bumpers.forEach(function (a, ai) {
                h.bumpers.forEach(function (b, bi) {
                    if (bi <= ai) return;
                    var gap = Math.hypot(a.x - b.x, a.y - b.y) - a.r - b.r;
                    if (gap > 0 && gap < C.BALL_R * 2 + 6) pinched.push(gap);
                });
            });
            assert(tag + ': no two posts leave an unusable slot', pinched.length === 0,
                pinched.length + ' gap(s), tightest ' + Math.min.apply(null, pinched).toFixed(1) + 'px');

            assert(tag + ': tee and cup are not on top of each other',
                Math.hypot(h.hole.x - h.tee.x, h.hole.y - h.tee.y) > 100);

            // A moving wall must stay on the field over its whole travel,
            // including the half of the sine nobody thinks to check.
            var strays = h.walls.filter(function (w) {
                if (!w.move) return false;
                for (var t = 0; t < 2 * Math.PI / w.move.speed; t += 0.05) {
                    var R = P.wallRect(w, t);
                    if (R.x < -1 || R.y < -1 || R.x + R.w > C.WORLD_W + 1 || R.y + R.h > C.WORLD_H + 1) return true;
                }
                return false;
            });
            assert(tag + ': moving walls stay on the field', strays.length === 0);

            // And they must always leave a gap wide enough for the ball,
            // otherwise the hole locks shut at some phase of the cycle.
            // Measured along the axis the wall travels on: a gate that rises
            // and falls has to leave room above or below it, a door that
            // slides has to leave room to one side.
            var sealed = h.walls.filter(function (w) {
                if (!w.move) return false;
                var vertical = w.move.axis === 'y';
                for (var t = 0; t < 2 * Math.PI / w.move.speed; t += 0.05) {
                    var R = P.wallRect(w, t);
                    var gap = vertical
                        ? Math.max(R.y, C.WORLD_H - (R.y + R.h))
                        : Math.max(R.x, C.WORLD_W - (R.x + R.w));
                    if (gap < C.BALL_R * 3) return true;
                }
                return false;
            });
            assert(tag + ': moving gates always leave a way past', sealed.length === 0);
        });

        /* ── scoring ────────────────────────────────────────────────────── */
        section('Scoring');

        (function () {
            assert('one stroke is an ace whatever the par', S.term(1, 3).kind === 'ace' && S.term(1, 2).kind === 'ace');
            assert('two under par on a par 4 is an eagle', S.term(2, 4).label === 'Eagle');
            assert('one under is a birdie', S.term(2, 3).label === 'Birdie');
            assert('level is par', S.term(3, 3).label === 'Par');
            assert('one over is a bogey', S.term(4, 3).label === 'Bogey');
            assert('three over is a triple bogey', S.term(6, 3).label === 'Triple Bogey');
            // Past the allowance a ball never dropped: the card can only
            // be holding a pick-up, so that is what it is called.
            assert('one past the allowance is a pick-up', S.term(S.pickupScore(3), 3).label === 'Picked up');
            assert('the last stroke of the allowance still counts as holed', S.term(S.strokeLimit(3), 3).label === 'Triple Bogey');
            assert('three under is an albatross', S.term(2, 5).label === 'Albatross');

            assert('level par formats as E', S.formatVsPar(0) === 'E');
            assert('over par carries a plus', S.formatVsPar(3) === '+3');
            assert('under par carries a minus', S.formatVsPar(-2) === '-2');
        })();

        (function () {
            var course = GOLF.COURSE;
            var partial = [];
            partial[0] = 2; partial[1] = 4;
            var t = S.totals(partial, course);
            assert('totals count only the holes played', t.played === 2 && t.strokes === 6);
            assert('totals compare against the par of those holes only',
                t.par === course[0].par + course[1].par);
            assert('an empty card totals to nothing', S.totals([], course).played === 0);

            // Holes finished out of order (never happens in play, but the
            // arithmetic should not care) must still add up.
            var sparse = [];
            sparse[4] = 3;
            assert('a gap in the card does not break the total', S.totals(sparse, course).strokes === 3);
        })();

        (function () {
            var fresh = S.emptySave();
            assert('a fresh save has no record', fresh.best === null && fresh.rounds === 0);

            var card = GOLF.COURSE.map(function (h) { return h.par; });
            var first = S.recordRound(fresh, card, GOLF.COURSE);
            assert('the first round is always a personal best', first.isBest);
            assert('the record is the round total', first.save.best === GOLF.coursePar());
            assert('level par is recorded as E', first.save.bestVsPar === 0);
            assert('the round counter ticks', first.save.rounds === 1);

            var worse = card.map(function (p) { return p + 2; });
            var second = S.recordRound(first.save, worse, GOLF.COURSE);
            assert('a worse round does not overwrite the record', !second.isBest && second.save.best === first.save.best);
            assert('but it still counts as a round played', second.save.rounds === 2);

            // One under on the last hole. Deliberately not the first hole,
            // which is a par 2 — one under there would be an ace and would
            // quietly contaminate the ace count checked below.
            var lastHole = GOLF.COURSE.length - 1;
            var better = card.map(function (p, i) { return i === lastHole ? p - 1 : p; });
            var third = S.recordRound(second.save, better, GOLF.COURSE);
            assert('a better round takes the record', third.isBest && third.save.best === GOLF.coursePar() - 1);
            assert('the winning card is kept', third.save.bestCard.length === GOLF.COURSE.length);

            var withAce = card.slice();
            withAce[0] = 1;
            var fourth = S.recordRound(third.save, withAce, GOLF.COURSE);
            assert('aces accumulate across rounds', fourth.save.aces === 1);
        })();

        (function () {
            var bad = S.load.call(null);
            assert('load always returns a usable save object',
                bad && typeof bad === 'object' && 'best' in bad);
        })();

        /* The pick-up and the stars. A hole allows par + STROKE_ALLOWANCE;
           missing with the last of them scores one more, which is the only
           way a card can hold a number above the limit — so the stars can
           tell a pick-up from a hole-out without being told. */
        (function () {
            assert('a hole allows par plus the allowance', S.strokeLimit(3) === 3 + C.STROKE_ALLOWANCE);
            assert('a pick-up scores one more than the limit', S.pickupScore(2) === S.strokeLimit(2) + 1);
            assert('under par is three stars', S.stars(2, 3) === 3 && S.stars(1, 2) === 3);
            assert('par is two', S.stars(3, 3) === 2);
            assert('anything holed over par is one', S.stars(4, 3) === 1 && S.stars(S.strokeLimit(3), 3) === 1);
            assert('a pick-up is none', S.stars(S.pickupScore(3), 3) === 0);
            assert('a hole not played is none', S.stars(null, 3) === 0 && S.stars(undefined, 3) === 0);

            var save = S.emptySave();
            var a = S.recordHole(save, 2, 4);
            assert('a first score on a hole is a best', a.improved && a.before === null && a.save.holes[2] === 4);
            assert('recording a hole hands back a new save', save.holes.length === 0);
            assert('the holes before it are filled with nothing, not with gaps',
                a.save.holes[0] === null && a.save.holes[1] === null);
            var b = S.recordHole(a.save, 2, 5);
            assert('a worse score does not take a hole\'s best', !b.improved && b.save.holes[2] === 4 && b.before === 4);
            var c = S.recordHole(b.save, 2, 3);
            assert('a better one does', c.improved && c.save.holes[2] === 3);
            assert('a hole best leaves the round record alone', c.save.best === null && c.save.rounds === 0);

            var course = GOLF.COURSE;
            var card = course.map(function (h) { return h.par; });
            var st = S.courseStars({ holes: card }, course);
            assert('par everywhere is two stars a hole', st.got === course.length * 2 && st.max === course.length * 3);
            assert('an empty save has no stars', S.courseStars(S.emptySave(), course).got === 0);
            var rec = S.recordRound(c.save, card, course);
            assert('folding in a round keeps the per-hole bests', rec.save.holes[2] === 3);

            /* A save from before there were per-hole bests: its best card is
               the one round it knows hole by hole, and the stars start there
               rather than at nothing. */
            var here = S.key(C.SAVE_KEY);
            var raw = localStorage.getItem(here);
            localStorage.setItem(here, JSON.stringify({ best: 40, bestVsPar: -3, rounds: 2, aces: 0, bestCard: card }));
            var old = S.load();
            assert('an old save\'s best card becomes its per-hole bests',
                old.holes.length === course.length && old.holes[0] === card[0]);
            localStorage.setItem(here, JSON.stringify({ best: 40, holes: [2, 'x', -1] }));
            var dirty = S.load();
            assert('stored per-hole bests are cleaned, not trusted',
                dirty.holes[0] === 2 && dirty.holes[1] === null && dirty.holes[2] === null);
            if (raw === null) localStorage.removeItem(here); else localStorage.setItem(here, raw);

            /* A card that has been rebuilt. The Old Course was eighteen holes
               once; a save from then, with no names in it, is read as the old
               card and remapped by hole name, so a best on Pinball (hole 11
               then) is still a best on Pinball — and the best round, over a
               card that no longer exists, is dropped. */
            var links = GOLF.COURSES.filter(function (c) { return c.id === 'links'; })[0];
            var legacy = S.LEGACY.links;
            var oldCard = legacy.map(function (n, i) { return i + 1; });
            var bare = localStorage.getItem(C.SAVE_KEY);
            localStorage.setItem(C.SAVE_KEY, JSON.stringify({ best: 70, bestVsPar: 5, rounds: 3, aces: 1, bestCard: oldCard, holes: oldCard }));
            var moved = S.load('links');
            var pin = links.holes.map(function (h) { return h.name; }).indexOf('Pinball');
            assert('a rebuilt card keeps each hole\'s best under its name',
                moved.holes.length === links.holes.length && moved.holes[pin] === legacy.indexOf('Pinball') + 1);
            assert('…drops the best round, which was over another card',
                moved.best === null && moved.bestCard === null && moved.bestVsPar === null);
            assert('…and keeps what it can still vouch for', moved.rounds === 3 && moved.aces === 1);
            var stored = JSON.parse(localStorage.getItem(C.SAVE_KEY));
            assert('the remap is written back at once, names and all, so the landing page never shows the old best',
                stored.best === null && Array.isArray(stored.names) && stored.holes[pin] === moved.holes[pin]);
            var wasId = GOLF.COURSE_ID;
            GOLF.selectCourse('links');
            S.save(moved);
            var again = S.load('links');
            GOLF.selectCourse(wasId);
            assert('a save written now names its holes, so it is not remapped twice',
                JSON.parse(localStorage.getItem(C.SAVE_KEY)).names.length === links.holes.length &&
                again.holes[pin] === moved.holes[pin]);
            if (bare === null) localStorage.removeItem(C.SAVE_KEY); else localStorage.setItem(C.SAVE_KEY, bare);
        })();

        /* One card per course. Two cards are not comparable
           totals, so they cannot share a record — and the course everyone has
           already played has to keep the bare key its record is under. */
        (function () {
            // Two cards that are neither the Old Course nor each other.
            var others = GOLF.COURSES.filter(function (c) { return c.id !== 'links'; });
            var first = others[0].id, second = others[1].id;
            assert('the Old Course keeps the bare save key wherever it stands on the rack',
                S.key(C.SAVE_KEY, 'links') === C.SAVE_KEY && S.key(C.ROUND_KEY, 'links') === C.ROUND_KEY &&
                GOLF.COURSES[0].id !== 'links');
            GOLF.selectCourse('links');
            assert('…and while it is being played', S.key(C.SAVE_KEY) === C.SAVE_KEY);

            GOLF.selectCourse(second);
            assert('a second course gets a key of its own',
                S.key(C.SAVE_KEY) === C.SAVE_KEY + '.' + second &&
                S.key(C.ROUND_KEY) === C.ROUND_KEY + '.' + second);

            // A round stored under one course must not be readable as the
            // other's, whatever the hole counts happen to be.
            S.saveRound(3, [2, 3, 4], GOLF.COURSE);
            var mine = S.loadRound(GOLF.COURSE);
            GOLF.selectCourse(first);
            assert('the round in progress does not leak across courses',
                mine !== null && S.loadRound(GOLF.COURSE) === null);

            GOLF.selectCourse(second);
            S.clearRound();
            assert('clearing a round clears that course\'s key', S.loadRound(GOLF.COURSE) === null);

            assert('an id that is not on the rack changes nothing',
                GOLF.selectCourse('no-such-course') === null && GOLF.COURSE_ID === second);
            GOLF.selectCourse(GOLF.COURSES[0].id);
            assert('and the rack can always be put back', GOLF.COURSE === GOLF.COURSES[0].holes);
        })();

        /* The round in progress. A round is long enough that losing one
           to a refresh matters, and every one of these rejections is a way a
           stored card could come back wrong rather than merely absent. */
        (function () {
            var course = GOLF.COURSE;
            var card = [];
            card[0] = 3; card[1] = 2;

            S.clearRound();
            assert('no stored round means nothing to resume', S.loadRound(course) === null);

            S.saveRound(2, card, course);
            var back = S.loadRound(course);
            assert('a stored round comes back', back !== null);
            assert('it resumes on the hole it was left at', back && back.holeIndex === 2);
            assert('the card comes back with it', back && back.scores[0] === 3 && back.scores[1] === 2);
            assert('unplayed holes stay unplayed', back && typeof back.scores[5] !== 'number');

            // Hole one with an empty card is not a round, it is a page load.
            S.saveRound(0, [], course);
            assert('a round that never started is not resumed', S.loadRound(course) === null);

            // The nine-to-eighteen rewrite invalidated every stored card, and
            // the next change to the hole count will do the same.
            S.saveRound(2, card, course);
            assert('a card from a course of another size is discarded',
                S.loadRound(course.slice(0, 4)) === null);

            var roundKey = S.key(C.ROUND_KEY);
            var raw = localStorage.getItem(roundKey);
            localStorage.setItem(roundKey, '{not json');
            assert('corrupt storage is discarded, not thrown', S.loadRound(course) === null);
            localStorage.setItem(roundKey, JSON.stringify({ holes: course.length, holeIndex: 99, scores: [3] }));
            assert('an index off the end of the course is discarded', S.loadRound(course) === null);
            if (raw) localStorage.setItem(roundKey, raw);

            S.clearRound();
            assert('clearing a round removes it', S.loadRound(course) === null);
        })();

        /* ── progression ────────────────────────────────────────────────── */
        section('Progression');

        /* Stars open courses, nothing a player had is taken away, and a link
           is a key. Every assertion here rewrites storage, so all of it is
           put back afterwards — opening the suite must not cost anybody
           their stars. */
        (function () {
            var PR = GOLF.progress;
            var kept = {};
            for (var i = localStorage.length - 1; i >= 0; i--) {
                var k = localStorage.key(i);
                if (/^miniGolf\./.test(k)) { kept[k] = localStorage.getItem(k); localStorage.removeItem(k); }
            }
            function byIdP(id) { return GOLF.COURSES.filter(function (c) { return c.id === id; })[0]; }
            function starsOnShort(n) {
                // n stars' worth of par-or-better on the Short Six, two at a time.
                var short = byIdP('short');
                var card = short.holes.map(function (h, j) { return j < Math.ceil(n / 2) ? h.par : null; });
                localStorage.setItem(S.key(C.SAVE_KEY, 'short'), JSON.stringify({ best: null, holes: card }));
            }

            try {
                PR.reload();
                assert('a first visit is not a veteran', !PR.get().veteran && !PR.get().all);
                assert('a first visit is pointed at the starter course', PR.starter().id === 'short');
                assert('the starter heads the rack and is open from the start',
                    GOLF.COURSES[0].id === 'short' && PR.isOpen(byIdP('short')));
                assert('every other card waits for stars', GOLF.COURSES.slice(1).every(function (c) {
                    return !PR.isOpen(c);
                }));
                assert('the first visit is written down, so the second is not mistaken for it',
                    localStorage.getItem(C.PROGRESS_KEY) !== null);

                // Thresholds read in rack order, so the picker reads as a ladder.
                var needs = GOLF.COURSES.map(function (c) { return PR.need(c); });
                assert('unlock thresholds never fall going down the rack',
                    needs.every(function (n, j) { return j === 0 || n >= needs[j - 1]; }), needs.join(', '));
                var all = PR.totalStars();
                assert('every threshold can actually be reached',
                    needs.every(function (n) { return n <= all.max; }), 'max ' + all.max);
                assert('the stars on offer are three a hole on every recorded card',
                    all.max === GOLF.COURSES.reduce(function (t, c) { return t + (c.record === false ? 0 : c.holes.length * 3); }, 0));

                var next = PR.nextUnlock();
                assert('the next unlock is the cheapest locked card', next && next.course.id === 'links' && next.short === PR.need(next.course));

                var before = PR.openIds();
                starsOnShort(PR.need(byIdP('links')));
                assert('stars read straight off the per-hole bests', PR.totalStars().got >= PR.need(byIdP('links')));
                var fresh = PR.opened(before);
                assert('reaching a threshold opens that course, and says so',
                    fresh.length === 1 && fresh[0].id === 'links' && PR.isOpen(byIdP('links')));
                assert('a course the stars opened is granted for good', PR.get().granted.links === true);
                localStorage.removeItem(S.key(C.SAVE_KEY, 'short'));
                PR.reload();
                assert('…and stays open when the stars are gone', PR.isOpen(byIdP('links')));
                assert('the next door along is still shut', !PR.isOpen(byIdP('tide')));

                PR.grant('warren');
                PR.reload();
                assert('a grant (a link, a started course) survives a reload', PR.isOpen(byIdP('warren')));

                PR.unlockAll();
                assert('opening everything opens everything', PR.everythingOpen() && PR.nextUnlock() === null);

                /* A veteran: somebody with a save from before stars existed.
                   Locking a card on a player with a record on it would be the
                   game forgetting them. */
                for (var j = localStorage.length - 1; j >= 0; j--) {
                    if (/^miniGolf\./.test(localStorage.key(j))) localStorage.removeItem(localStorage.key(j));
                }
                localStorage.setItem(C.SAVE_KEY, JSON.stringify({ best: 60, bestVsPar: 6, rounds: 1, aces: 0 }));
                PR.reload();
                assert('a save from before progression makes a veteran', PR.get().veteran);
                assert('a veteran finds every course open', PR.everythingOpen());
                assert('a veteran is not shown the first stroke again', PR.coached());
                assert('a veteran has met every old hazard, and not the new one',
                    PR.get().seen.water && PR.get().seen.gates && !PR.get().seen.tunnels);

                /* Lessons: one per hazard, once. */
                localStorage.removeItem(C.SAVE_KEY);
                localStorage.removeItem(C.PROGRESS_KEY);
                PR.reload();
                var gated = [];
                GOLF.COURSES.forEach(function (c) { c.holes.forEach(function (h) { if (h.walls.some(function (w) { return !!w.move; })) gated.push(h); }); });
                assert('a moving wall is taught as a gate', gated.length > 0 && PR.kindsOn(gated[0]).indexOf('gates') >= 0);
                var cannon = byIdP('short').holes.filter(function (h) { return h.name === 'Snow Cannon'; })[0];
                var mole = byIdP('short').holes.filter(function (h) { return h.name === 'Molehill'; })[0];
                assert('a wind is its own lesson, not a slope\'s', PR.kindsOn(cannon).indexOf('wind') >= 0 && PR.kindsOn(cannon).indexOf('slopes') < 0);
                assert('…and a hill is one too', PR.kindsOn(mole).indexOf('hills') >= 0);
                var faithful = byIdP('ember').holes.filter(function (h) { return h.name === 'Old Faithful'; })[0];
                var tracks = byIdP('alpine').holes[0];
                assert('lava, a geyser and a chute are each a lesson',
                    PR.kindsOn(faithful).indexOf('lava') >= 0 && PR.kindsOn(faithful).indexOf('vents') >= 0 &&
                    PR.kindsOn(tracks).indexOf('avalanches') >= 0);
                var opener = GOLF.COURSES[0].holes[0];
                assert('a still wall is not a lesson', PR.kindsOn(opener).indexOf('gates') < 0);
                var lessonsBefore = PR.unseen(opener).length;
                PR.unseen(opener).forEach(function (k) { PR.markSeen(k); });
                PR.reload();
                assert('a lesson once shown is not shown again', lessonsBefore > 0 && PR.unseen(opener).length === 0);
                assert('the first stroke is shown until it is taken', !PR.coached());
                PR.markCoached();
                PR.reload();
                assert('…and then never again', PR.coached());

                /* Starting over, both ways. */
                starsOnShort(6);
                localStorage.setItem('miniGolf.muted', '1');
                localStorage.setItem(C.SCENERY_KEY, 'winter');
                localStorage.setItem('miniGolf.editor.v1', '{"name":"draft"}');
                PR.replayIntro();
                PR.reload();
                assert('replaying the intro shows the first stroke again', !PR.coached());
                assert('…and every lesson', PR.unseen(opener).length === lessonsBefore);
                assert('…and costs no stars', PR.totalStars().got >= 6);
                PR.grant('wild');
                PR.resetAll();
                PR.reload();
                assert('a reset takes every star', PR.totalStars().got === 0);
                assert('…and every record', localStorage.getItem(S.key(C.SAVE_KEY, 'short')) === null);
                assert('…and is a first visit, not a veteran', !PR.get().veteran && !PR.everythingOpen() && !PR.isOpen(byIdP('wild')));
                assert('…which shows the first stroke', !PR.coached());
                assert('it leaves the sound setting alone', localStorage.getItem('miniGolf.muted') === '1');
                assert('…and the scenery', localStorage.getItem(C.SCENERY_KEY) === 'winter');
                assert('…and a hole half-built in the editor', localStorage.getItem('miniGolf.editor.v1') !== null);
            } finally {
                for (var m = localStorage.length - 1; m >= 0; m--) {
                    if (/^miniGolf\./.test(localStorage.key(m))) localStorage.removeItem(localStorage.key(m));
                }
                Object.keys(kept).forEach(function (k) { localStorage.setItem(k, kept[k]); });
                PR.reload();
            }
        })();

        /* ── the bot ────────────────────────────────────────────────────── */
        section('Playability (bot)');

        /* Every hole has to be finishable. Rather than assert that by eye, a
           bot searches for a way round it: if a hole is sealed off,
           unreachable, or has a cup buried where nothing can settle, nothing
           the search tries ever drops and this goes red.

           It searches rather than walks, and that is the whole of it. The old
           bot played greedily — fan out a handful of shots, keep the one that
           finished nearest the cup, play it — and greed has local minima that
           a mini golf course is *made* of: the wall you have to play away
           from, the moat you have to go round. It carried a hack for exactly
           that (when a turn bought no ground, take an arbitrary shot instead
           of the best one) and the hack got it round a dogleg and no further.
           A hole that asks the player to spend a whole leg getting further
           from the cup — anything built round a long wall — it could not
           finish, and reported as unplayable.

           So: a breadth-first search over shots. The field is bucketed into
           `BOT_CELL` squares, the tee is where the search starts, and every
           state fans out the same shots the greedy bot did and records the
           cell each one comes to rest in. Cells come off the queue in stroke
           order, so the first putt that drops is the fewest strokes the
           search found, and the line behind it is real — every edge is a
           simulated shot played from where the one before it left the ball.

           A cell may be expanded `BOT_VISITS` times rather than once. That is
           for the moving gates: the first arrival in a cell fixes the clock
           as well as the position, and a cell that is a dead end at one phase
           of a sweeping bar is a way through at another.

           What has *not* changed is the stroke. Power, aim spread, the wait
           before striking and the overswing scatter are the player's, exactly
           as they were — a bot with a truer stroke than the game allows would
           sign off holes only finishable by a shot nobody can reliably play.
           It is allowed to be a better planner than a greedy walk, because a
           player looking at the screen is one.

           Each hole gets its own seed rather than sharing one stream down the
           course. With a shared stream, adding or editing any hole reshuffles
           the shots every later hole is played with, so a change to the second
           hole can turn the eighth red — which is a report about the PRNG, not
           about the course. Per-hole seeds keep a failure local to the hole
           that caused it. */
        var BOT_CELL = 48;      // world px; a putt has to move about this far to be progress
        var BOT_VISITS = 2;     // expansions of one cell, for timing round the moving gates

        function playHole(hole, rand, opts) {
            var maxShots = opts.maxShots;
            var fan = opts.tries;
            // A hole nothing can finish would otherwise sweep every cell of
            // the field twice over before saying so; this is the ceiling on
            // how long a red hole is allowed to take to go red.
            var budget = opts.budget || 9000;
            var cols = Math.ceil(C.WORLD_W / BOT_CELL);
            var visits = {};

            function cell(x, y) {
                return Math.floor(y / BOT_CELL) * cols + Math.floor(x / BOT_CELL);
            }

            // The queue is in non-decreasing stroke order by construction: a
            // state only ever appends states one stroke deeper, so nothing
            // needs sorting and the first hole-out is the shallowest one.
            var queue = [{ x: hole.tee.x, y: hole.tee.y, time: 0, shots: 0 }];
            visits[cell(hole.tee.x, hole.tee.y)] = 1;
            var sims = 0;

            for (var head = 0; head < queue.length; head++) {
                var s = queue[head];
                // The queue is in stroke order, so once one state is out of
                // strokes so is everything behind it.
                if (s.shots >= maxShots) break;

                for (var k = 0; k < fan; k++) {
                    if (sims >= budget) return null;
                    var toHole = Math.atan2(hole.hole.y - s.y, hole.hole.x - s.x);
                    var angle = rand() < 0.65
                        ? toHole + (rand() - 0.5) * 0.9
                        : rand() * Math.PI * 2;
                    var power = C.MIN_POWER + rand() * (C.MAX_POWER - C.MIN_POWER);
                    var wait = rand() * 3;
                    angle += P.scatter(power, rand());

                    var w = P.simulateShot(hole, s, angle, power, s.time + wait);
                    sims++;
                    if (w.sunk) return s.shots + 1;
                    if (w.splash) continue;              // a stroke and a replay; not an edge

                    var c = cell(w.ball.x, w.ball.y);
                    if ((visits[c] || 0) >= BOT_VISITS) continue;
                    visits[c] = (visits[c] || 0) + 1;
                    queue.push({ x: w.ball.x, y: w.ball.y, time: w.time, shots: s.shots + 1 });
                }
            }
            return null;
        }

        /* The claim under test is that the hole is finishable, not that this
           particular search got lucky, so a hole gets a second go with a
           fresh stream before it is called unplayable. The greedy bot needed
           three; a search that has swept the reachable field once rarely
           changes its mind on the second sweep, and two runs of it cost more
           than three runs of the walk did. */
        function botCanFinish(hole, index, opts) {
            for (var a = 0; a < opts.attempts; a++) {
                var shots = playHole(hole, mulberry32(20260815 + index * 7919 + a * 104729), opts);
                if (shots !== null) return shots;
            }
            return null;
        }

        (function () {
            var LIMIT = 10;
            /* The seed is per hole and per course index, not per position in
               one long stream down the rack. Sharing a stream means adding a
               hole — or a whole course — reshuffles the shots every later
               hole is played with, so a change here turns a hole there red. */
            GOLF.COURSES.forEach(function (course) {
                var total = 0, allDone = true;
                course.holes.forEach(function (h, i) {
                    var shots = botCanFinish(h, i, { maxShots: LIMIT, tries: 28, attempts: 2 });
                    assert(course.id + ' hole ' + (i + 1) + ' (' + h.name + ') can be holed out', shots !== null,
                        'the search found no way to finish it in ' + LIMIT + ' shots, twice over');
                    if (shots === null) { allDone = false; } else { total += shots; }
                });
                var par = course.holes.reduce(function (t, h) { return t + h.par; }, 0);
                if (allDone) {
                    note('best line found on ' + course.name + ': ' + total + ' strokes against a par of ' +
                         par + ' (' + S.formatVsPar(total - par) + ')');
                }
            });
        })();

        /* Resting position sanity: after any shot the ball must never be left
           overlapping a static wall. Overlap means the push-out failed, and a
           ball stuck in a wall is unplayable. */
        (function () {
            var rand = mulberry32(7);
            var stuck = 0, samples = 0;
            everyHole(function (h) {
                var statics = h.walls.filter(function (w) { return !w.move; });
                var rails = P.railsOf(h);
                if (!statics.length && !h.bumpers.length && !rails.length) return;
                for (var i = 0; i < 60; i++) {
                    var w = P.simulateShot(h, h.tee, rand() * Math.PI * 2, C.MIN_POWER + rand() * C.MAX_POWER);
                    samples++;
                    var bad = statics.some(function (s) {
                        return P.circleRect(w.ball.x, w.ball.y, C.BALL_R - 0.5, s) !== null;
                    }) || h.bumpers.some(function (b) {
                        return P.circleCircle(w.ball.x, w.ball.y, C.BALL_R - 0.5, b) !== null;
                    }) || rails.some(function (r) {
                        return P.circleRail(w.ball.x, w.ball.y, C.BALL_R - 0.5, r) !== null;
                    }) || P.inBlock(h, w.ball.x, w.ball.y) !== null;
                    if (bad) stuck++;
                }
            });
            assert('the ball never comes to rest inside a wall or a post', stuck === 0,
                stuck + ' of ' + samples + ' shots ended overlapping');
        })();

        /* Every shot has to end. Ice lengthens a roll by about four times and
           bumpers keep it alive, so the pair of them is exactly where a hole
           could quietly stop handing control back to the player: the game loop
           has no timeout, it simply waits for the ball to stop. */
        (function () {
            var rand = mulberry32(4242);
            var slowest = 0, hung = 0, name = '';
            everyHole(function (h) {
                for (var i = 0; i < 30; i++) {
                    var w = P.createWorld(h, h.tee, rand() * 6);
                    P.launch(w, rand() * Math.PI * 2, C.MAX_POWER);
                    var steps = 0;
                    while (w.moving && steps < Math.ceil(C.MAX_SHOT_SECONDS / C.SIM_DT)) {
                        P.advance(w, C.SIM_DT);
                        steps++;
                    }
                    var secs = steps * C.SIM_DT;
                    if (secs > slowest) { slowest = secs; name = h.name; }
                    if (w.moving) hung++;
                }
            });
            note('longest shot on the rack: ' + slowest.toFixed(1) + 's on ' + name +
                 ' (limit ' + C.MAX_SHOT_SECONDS + 's)');
            assert('every full-power shot settles inside MAX_SHOT_SECONDS', hung === 0,
                hung + ' shots were still rolling');
        })();

        (function () {
            var rand = mulberry32(99);
            var escaped = 0;
            everyHole(function (h) {
                for (var i = 0; i < 40; i++) {
                    var w = P.simulateShot(h, h.tee, rand() * Math.PI * 2, C.MAX_POWER);
                    if (w.ball.x < 0 || w.ball.x > C.WORLD_W || w.ball.y < 0 || w.ball.y > C.WORLD_H) escaped++;
                }
            });
            assert('no shot escapes the field on any hole', escaped === 0, escaped + ' escaped');
        })();

        /* ── the generator ──────────────────────────────────────────────── */
        section('Procedural courses');

        /* A generated hole gets no benefit of the doubt: it goes through the
           same rules as a shipped one, and then the same bot.

           The rules themselves live in generator.js as `GOLF.validateHole`
           rather than here, so the generator can re-roll a hole that breaks
           one. That would be a second rule book waiting to drift from this
           one, except for the first assertion below: every shipped hole has
           to pass the shared function too. Break one and the other goes red.

           Seeds are fixed rather than drawn, for the reason the bot's are:
           a suite that fails one run in fifty is a suite nobody believes. */

        var SEEDS = [1, 7, 42, 1234, 20260908, 0xC0FFEE, 987654321, 31337,
                     555, 900001, 12, 77777];

        /* A seed always deals the same course — the section below asserts
           it — so the sections that only read a draw share one dealing of
           each seed rather than paying for it four times over. Each gets its
           own copy, so nothing one section does to a hole reaches another. */
        var dealt = {};
        function deal(seed) {
            if (!dealt[seed]) dealt[seed] = JSON.stringify(GOLF.generateCourse(seed));
            return JSON.parse(dealt[seed]);
        }

        (function () {
            var G = GOLF.generator;
            assert('the generator is loaded', !!G && typeof GOLF.generateCourse === 'function');

            // Loading generator.js must not put anything on the rack: the
            // picker, the save keys and every course test above assume the
            // rack is the hand-built one.
            assert('loading the generator leaves the rack alone',
                GOLF.COURSES.every(function (c) { return c.id !== G.DRAW_ID; }));

            // The shared rule book, run over the courses somebody wrote by
            // hand. This is the pin between the two.
            var shipped = [];
            everyHole(function (h, i, course) {
                var bad = GOLF.validateHole(h);
                if (bad.length) shipped.push(course.id + ' ' + h.name + ': ' + bad[0]);
            });
            assert('every shipped hole passes the generator\'s own rule book', shipped.length === 0,
                shipped.slice(0, 3).join(' · '));

            // The straight putt. No hole on the rack may be aced by a putt
            // struck at the flag — at any weight, a hair either side, or at
            // any moment of a clock — unless it says it means it, and only
            // a few may: a first hole, or one whose whole question is the
            // weight. The check has to be able to see one: an empty field
            // is nothing but a straight putt.
            var straight = [], allowed = [];
            everyHole(function (h, i, course) {
                if (h.straight) { allowed.push(course.id + ' ' + h.name); return; }
                var hit = GOLF.physics.straightAce(h);
                if (hit) straight.push(course.id + ' ' + h.name + ' (' + Math.round(hit.power) + ' at ' + hit.at.toFixed(1) + 's)');
            });
            assert('no shipped hole is aced by a putt struck straight at the cup unless it says so', straight.length === 0,
                straight.slice(0, 4).join(' · '));
            assert('only a few holes say a straight putt may drop', allowed.length <= 8, allowed.join(' · '));
            var bare = { par: 2, tee: { x: 200, y: 320 }, hole: { x: 600, y: 320 } };
            GOLF.HAZARD_KEYS.forEach(function (k) { bare[k] = []; });
            assert('…and the check finds the one an empty field gives', GOLF.physics.straightAce(bare) !== null);
            var posted = JSON.parse(JSON.stringify(bare));
            posted.bumpers = [{ x: 400, y: 320, r: 24 }];
            assert('…and a post on the line answers it', GOLF.physics.straightAce(posted) === null);

            var a = GOLF.generateCourse(4242);
            var b = GOLF.generateCourse(4242);
            var c = GOLF.generateCourse(4243);
            assert('the same seed deals the same course',
                JSON.stringify(a.holes) === JSON.stringify(b.holes));
            assert('a different seed deals a different one',
                JSON.stringify(a.holes) !== JSON.stringify(c.holes));
            assert('a seed reads back off a URL as itself',
                G.seedFrom(G.seedLabel(4242)) === 4242);
            assert('anything else becomes a seed rather than a crash',
                typeof G.seedFrom('a birthday, or something like one') === 'number');
            assert('a draw is not a course you can hold a record on', a.record === false);
            assert('a draw carries its seed', a.seed === 4242);
        })();

        (function () {
            var families = ['walls', 'water', 'sand', 'rough', 'ice', 'bumpers', 'slopes'];
            var problems = [], thin = 0, features = 0;

            SEEDS.forEach(function (seed) {
                var course = deal(seed);
                var tag = 'seed ' + GOLF.generator.seedLabel(seed);
                var names = {};
                var seen = {};

                assert(tag + ': deals nine holes', course.holes.length === 9,
                    'got ' + course.holes.length);

                course.holes.forEach(function (h, i) {
                    var bad = GOLF.validateHole(h, { strict: true });
                    if (bad.length) problems.push(tag + ' hole ' + (i + 1) + ': ' + bad[0]);
                    if (names[h.name]) problems.push(tag + ': two holes called ' + h.name);
                    names[h.name] = true;
                    if (!h.name || !h.blurb) problems.push(tag + ' hole ' + (i + 1) + ': no name or blurb');
                    if (GOLF.physics.straightAce(h)) problems.push(tag + ' hole ' + (i + 1) + ': a putt straight at the cup holes it');
                    families.forEach(function (k) {
                        if (!Array.isArray(h[k])) thin++;
                        if (h[k].length) seen[k] = true;
                        features += h[k].length ? 1 : 0;
                    });
                });

                var par = course.holes.reduce(function (t, h) { return t + h.par; }, 0);
                assert(tag + ': total par is sane', par >= 18 && par <= 45, 'par ' + par);

                // One feature per hole, dealt from a shuffled deck of nine —
                // so a draw always carries the whole vocabulary. Drawn
                // independently, a course with no water on it would turn up
                // sooner or later, and that is a field rather than a course.
                var missing = families.filter(function (k) { return !seen[k]; });
                assert(tag + ': every hazard the game has is somewhere on the card',
                    missing.length === 0, 'missing ' + missing.join(', '));
            });

            assert('every generated hole passes the strict rule book', problems.length === 0,
                problems.length + ' problem(s): ' + problems.slice(0, 3).join(' · '));
            assert('every generated hole has every hazard list', thin === 0);
            note('across ' + SEEDS.length + ' draws: ' +
                 (features / (SEEDS.length * 9)).toFixed(1) + ' hazard kinds per hole');
        })();

        /* The shape of the card, not just the furniture on it. A draw that
           dealt nine corridors with different hazards in them would pass
           every rule above and still be nine of the same hole, so this counts
           the holes built round a *spine*: one static wall that reaches a
           cushion, runs most of the length of the field, and has the tee on
           one side of it and the cup on the other.

           It is deliberately a property rather than a name — a dogleg's
           blocker answers to it too, and that is fine, because the claim
           being made is about what the player is looking at rather than about
           which builder produced it. */
        (function () {
            function spine(h) {
                return h.walls.some(function (w) {
                    if (w.move) return false;
                    var horiz = w.w >= w.h;
                    var len = horiz ? w.w : w.h;
                    var field = horiz ? C.WORLD_W : C.WORLD_H;
                    if (len < field * 0.6) return false;
                    var a0 = horiz ? w.x : w.y;
                    if (a0 > 1 && a0 + len < field - 1) return false;   // has to reach a cushion
                    var b0 = horiz ? w.y : w.x;
                    var b1 = b0 + (horiz ? w.h : w.w);
                    var t = horiz ? h.tee.y : h.tee.x;
                    var c = horiz ? h.hole.y : h.hole.x;
                    return (t < b0 && c > b1) || (c < b0 && t > b1);
                });
            }

            var round = 0, total = 0, flat = [], cheap = [];
            SEEDS.forEach(function (seed) {
                var course = deal(seed);
                var here = 0;
                course.holes.forEach(function (h, i) {
                    total++;
                    if (!spine(h)) return;
                    here++; round++;
                    if (h.par < 3) cheap.push(GOLF.generator.seedLabel(seed) + ' hole ' + (i + 1));
                });
                if (!here) flat.push(GOLF.generator.seedLabel(seed));
            });

            assert('every draw deals a hole built round a wall, not only corridors',
                flat.length === 0, 'nothing but corridors on: ' + flat.join(', '));
            assert('and not so many that the card is nothing else',
                round / total < 0.6, Math.round(round / total * 100) + '%');
            // A wall between the tee and the cup is a stroke before anything
            // else on the hole has been considered, so it is never a two.
            assert('a hole with a wall between the tee and the cup is never a two',
                cheap.length === 0, cheap.slice(0, 3).join(' · '));
            note('across ' + SEEDS.length + ' draws: ' + Math.round(round / total * 100) +
                 '% of holes are played round a wall rather than through bands');
        })();

        /* And then the bot, which is the only test that knows whether a hole
           can actually be finished. The generator argues that it never builds
           a band without a mouth in it; this is what checks the argument. */
        (function () {
            var LIMIT = 10;
            var failed = [], total = 0, holes = 0;
            SEEDS.slice(0, 8).forEach(function (seed, s) {
                var course = deal(seed);
                course.holes.forEach(function (h, i) {
                    var shots = botCanFinish(h, s * 31 + i, { maxShots: LIMIT, tries: 28, attempts: 2 });
                    holes++;
                    if (shots === null) failed.push(GOLF.generator.seedLabel(seed) + ' hole ' + (i + 1));
                    else total += shots;
                });
            });
            assert('the search finds a way to hole out on every generated hole', failed.length === 0,
                failed.length + ' of ' + holes + ' never finished: ' + failed.slice(0, 4).join(', '));
            note('best line over ' + holes + ' generated holes: ' + (total / holes).toFixed(2) + ' strokes a hole');
        })();

        /* The two measured rules, on generated ground. A hole nobody wrote is
           exactly where a slope that pins the ball or a rink it never leaves
           would turn up. */
        (function () {
            var rand = mulberry32(606);
            var hung = 0, slowest = 0, escaped = 0, stuck = 0, holes = 0;
            SEEDS.slice(0, 6).forEach(function (seed) {
                deal(seed).holes.forEach(function (h) {
                    holes++;
                    for (var i = 0; i < 24; i++) {
                        var w = P.createWorld(h, h.tee, rand() * 6);
                        P.launch(w, rand() * Math.PI * 2, C.MAX_POWER);
                        var steps = 0, cap = Math.ceil(C.MAX_SHOT_SECONDS / C.SIM_DT);
                        while (w.moving && steps < cap) { P.advance(w, C.SIM_DT); steps++; }
                        if (w.moving) hung++;
                        if (steps * C.SIM_DT > slowest) slowest = steps * C.SIM_DT;
                        if (w.ball.x < 0 || w.ball.x > C.WORLD_W || w.ball.y < 0 || w.ball.y > C.WORLD_H) escaped++;
                        var statics = h.walls.filter(function (x) { return !x.move; });
                        if (statics.some(function (x) { return P.circleRect(w.ball.x, w.ball.y, C.BALL_R - 0.5, x) !== null; }) ||
                            h.bumpers.some(function (b) { return P.circleCircle(w.ball.x, w.ball.y, C.BALL_R - 0.5, b) !== null; })) {
                            stuck++;
                        }
                    }
                });
            });
            assert('every full-power shot on a generated hole settles', hung === 0, hung + ' still rolling');
            assert('no shot escapes a generated field', escaped === 0, escaped + ' escaped');
            assert('no shot ends inside a wall or a post on a generated hole', stuck === 0,
                stuck + ' ended overlapping');
            note('longest shot over ' + holes + ' generated holes: ' + slowest.toFixed(1) + 's (limit ' +
                 C.MAX_SHOT_SECONDS + 's)');
        })();

        /* The round in progress, on a card that can be re-dealt under it. */
        (function () {
            var course = GOLF.generateCourse(99).holes;
            var wasId = GOLF.COURSE_ID, wasSeed = GOLF.COURSE_SEED;
            GOLF.COURSE_ID = 'draw';
            GOLF.COURSE_SEED = 99;
            S.saveRound(4, [3, 4, 2, 5], course);
            assert('a draw resumes its own round', S.loadRound(course) !== null);
            GOLF.COURSE_SEED = 100;
            assert('a round written for one draw is not offered to the next',
                S.loadRound(course) === null);
            GOLF.COURSE_SEED = 99;
            S.clearRound();
            GOLF.COURSE_ID = wasId;
            GOLF.COURSE_SEED = wasSeed;
            assert('clearing it leaves the hand-built courses alone', S.loadRound(GOLF.COURSES[0].holes) === null);
        })();

        /* ── the caddie ──────────────────────────────────────────────────── */
        section('The caddie (autoplay)');

        /* js/bot.js is what plays when the 🤖 chip is pressed. The search
           above proves a hole can be finished; this proves the caddie
           *does* finish it, playing the way game.js plays it: a line read,
           then played out a shot at a time on the beat between shots the
           game really keeps, read again only when the ball is not where the
           line said. Every shipped hole and every hole of one draw, inside
           the stroke allowance. */
        (function () {
            var B = GOLF.bot;
            var GAP = C.BOT_PAUSE + C.BOT_TURN + C.BOT_WIND + C.BOT_SLACK;
            var LEAD = C.BOT_TURN + C.BOT_WIND;
            var over = 0, drift = 0, picked = [], reads = 0, holes = 0, strokes = 0, par = 0;

            function caddie(h, i) {
                var limit = S.strokeLimit(h.par);
                var ball = { x: h.tee.x, y: h.tee.y }, time = 0, n = 0, plan = [];
                while (n < limit) {
                    var shot = plan.shift();
                    if (!shot || Math.hypot(shot.from.x - ball.x, shot.from.y - ball.y) > 0.01 ||
                        shot.at < time + LEAD) {
                        var found = B.bestShot(h, ball, time + LEAD,
                            { strokes: limit - n, gap: GAP, budget: C.BOT_BUDGET, seed: 1 + i * 7919 + n * 104729 });
                        reads++;
                        if (!found) return null;
                        plan = found.shots;
                        shot = plan.shift();
                    }
                    if (shot.power > C.SAFE_POWER) over++;
                    var w = P.createWorld(h, ball, shot.at);
                    P.launch(w, shot.aim, shot.power);
                    P.settle(w);
                    n++;
                    if (w.sunk) return n;
                    if (w.splash) { n += C.WATER_PENALTY; time = w.time + C.BOT_PAUSE; continue; }
                    // The game rolls the same steps from the same instant, so
                    // a planned shot comes to rest exactly where it said.
                    if (shot.to && Math.hypot(shot.to.x - w.ball.x, shot.to.y - w.ball.y) > 1e-9) drift++;
                    ball = { x: w.ball.x, y: w.ball.y };
                    time = w.time + C.BOT_PAUSE;
                }
                return null;
            }

            var rack = GOLF.COURSES.filter(function (c) { return c.id !== 'draw'; })
                .map(function (c) { return { id: c.id, holes: c.holes }; });
            rack.push({ id: 'draw ' + GOLF.generator.seedLabel(4242), holes: GOLF.generateCourse(4242).holes });
            rack.forEach(function (course) {
                course.holes.forEach(function (h, i) {
                    holes++;
                    par += h.par;
                    var got = caddie(h, i);
                    if (got === null) picked.push(course.id + ' ' + (i + 1));
                    else strokes += got;
                });
            });
            assert('the caddie holes out on every hole it is handed', picked.length === 0,
                'picked up on ' + picked.join(', '));
            assert('it never swings into the overswing', over === 0, over + ' shots past SAFE_POWER');
            assert('every planned shot stops exactly where the plan said', drift === 0, drift + ' drifted');
            assert('a line is read about once a hole, not once a shot', reads <= holes * 1.5,
                reads + ' reads over ' + holes + ' holes');
            note('the caddie round the rack: ' + strokes + ' strokes against a par of ' + par +
                 ' over ' + holes + ' holes, ' + reads + ' reads');
        })();

        /* The walking map it ranks lies by: round the walls and the water,
           through a tunnel for nothing. Every tee has to be on it — a tee the
           flood never reaches would leave the beam ranking every lie as
           equally hopeless — and nothing but a tunnel may make the walk to
           the cup shorter than the crow flies. */
        (function () {
            var B = GOLF.bot, cut = [], lost = [];
            var all = [];
            GOLF.COURSES.forEach(function (c) {
                c.holes.forEach(function (h, i) { all.push({ name: c.id + ' ' + (i + 1), h: h }); });
            });
            GOLF.generateCourse(606).holes.forEach(function (h, i) { all.push({ name: 'draw ' + (i + 1), h: h }); });
            all.forEach(function (x) {
                var h = x.h, m = B.walkingMap(h);
                var d = B.walk(m, h.tee.x, h.tee.y);
                var crow = Math.hypot(h.tee.x - h.hole.x, h.tee.y - h.hole.y);
                if (d >= 1e6) lost.push(x.name);
                else if (!(h.tunnels || []).length && d < crow - 20) cut.push(x.name);
            });
            assert('every tee is on the walking map', lost.length === 0, lost.join(', '));
            assert('only a tunnel walks shorter than the crow flies', cut.length === 0, cut.join(', '));
            // Snow Globe: the cup is shut in a box whose only door is a tunnel.
            var ferry = GOLF.COURSES.filter(function (c) { return c.id === 'warren'; })[0].holes[1];
            var fm = B.walkingMap(ferry);
            assert('…and a tunnel does',
                B.walk(fm, ferry.tee.x, ferry.tee.y) < Math.hypot(ferry.tee.x - ferry.hole.x, ferry.tee.y - ferry.hole.y));
            assert('the map is read once per hole and kept', B.walkingMap(ferry) === fm);
        })();

        /* ── done ───────────────────────────────────────────────────────── */

        var summary = document.getElementById('summary');
        var ms = Math.round(performance.now() - t0);
        summary.textContent = failed === 0
            ? '✓ ' + passed + ' passed in ' + ms + 'ms'
            : '✗ ' + failed + ' failed, ' + passed + ' passed in ' + ms + 'ms';
        summary.className = failed === 0 ? 'ok' : 'bad';
        window.TESTS_DONE = true;
        window.TEST_RESULT = { passed: passed, failed: failed, fails: window.FAILS };
    })();
    </script>
</body>
