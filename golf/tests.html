<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pocket Links — logic tests</title>
    <meta name="robots" content="noindex">
    <style>
        body { background: #071a10; color: #ecfdf5; font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 1rem; line-height: 1.5; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: bold; }
        h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: #a7c4b5; margin: 1.4rem 0 0.3rem; border-bottom: 1px solid #ffffff1a; padding-bottom: 0.2rem; }
        #summary { font-size: 1.2rem; margin-bottom: 0.5rem; padding: 0.6rem 0.9rem; border-radius: 10px; background: #ffffff0d; }
        #summary.ok { color: #4ade80; }
        #summary.bad { color: #f87171; }
        .note { color: #a7c4b5; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="summary">running…</div>
    <div id="results"></div>

    <!-- Pure logic only: config, course data, physics and scoring. No render,
         audio or game module, so nothing here needs a canvas, an AudioContext
         or a DOM beyond this page. -->
    <script src="js/config.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/bot.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/scenery.js"></script>
    <!-- Only for where its props stand; nothing here draws them. -->
    <script src="js/props.js"></script>

    <script>
    (function () {
        'use strict';

        var C = GOLF.CONFIG, P = GOLF.physics, S = GOLF.scoring;
        var passed = 0, failed = 0;
        window.FAILS = [];
        var out = document.getElementById('results');
        var t0 = performance.now();

        function section(name) {
            var h = document.createElement('h2');
            h.textContent = name;
            out.appendChild(h);
        }

        function assert(name, cond, detail) {
            var div = document.createElement('div');
            if (cond) {
                passed++;
                div.className = 'pass';
                div.textContent = '✓ ' + name;
            } else {
                failed++;
                window.FAILS.push(name + (detail ? ' — ' + detail : ''));
                div.className = 'fail';
                div.textContent = 'FAIL: ' + name + (detail ? ' — ' + detail : '');
            }
            out.appendChild(div);
        }

        function note(text) {
            var div = document.createElement('div');
            div.className = 'note';
            div.textContent = '  ' + text;
            out.appendChild(div);
        }

        function approx(a, b, eps) { return Math.abs(a - b) <= (eps === undefined ? 0.001 : eps); }

        // Seeded PRNG so a failing bot run is reproducible rather than a
        // "sometimes red" test nobody trusts.
        function mulberry32(seed) {
            return function () {
                seed |= 0; seed = seed + 0x6D2B79F5 | 0;
                var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function rect(x, y, w, h) { return { x: x, y: y, w: w, h: h }; }

        /* ── geometry ───────────────────────────────────────────────────── */
        section('Geometry');

        (function () {
            var R = rect(100, 100, 50, 50);
            assert('circle clear of a box does not collide', P.circleRect(10, 10, 7.5, R) === null);
            assert('circle overlapping a box collides', P.circleRect(96, 125, 7.5, R) !== null);

            var left = P.circleRect(96, 125, 7.5, R);
            assert('normal points out of the left face', approx(left.nx, -1) && approx(left.ny, 0));
            assert('penetration depth is the overlap', approx(left.depth, 7.5 - 4, 0.0001), 'got ' + left.depth);

            var top = P.circleRect(125, 95, 7.5, R);
            assert('normal points out of the top face', approx(top.nx, 0) && approx(top.ny, -1));

            var corner = P.circleRect(96, 96, 7.5, R);
            assert('corner contact gives a diagonal normal', corner.nx < 0 && corner.ny < 0);

            // The case that used to stick the ball inside a moving gate.
            var inside = P.circleRect(105, 125, 7.5, R);
            assert('center inside the box escapes through the nearest face',
                inside !== null && approx(inside.nx, -1) && inside.depth > 7.5);

            var B = { x: 200, y: 200, r: 20 };
            assert('circle clear of a bumper does not collide', P.circleCircle(300, 200, 7.5, B) === null);
            assert('circle touching a bumper collides', P.circleCircle(224, 200, 7.5, B) !== null);
            var kiss = P.circleCircle(224, 200, 7.5, B);
            assert('bumper normal points away from its center', approx(kiss.nx, 1) && approx(kiss.ny, 0));
            assert('bumper penetration is the overlap', approx(kiss.depth, 27.5 - 24, 0.0001), 'got ' + kiss.depth);
            assert('a concentric hit still yields a direction',
                P.circleCircle(200, 200, 7.5, B).depth === 27.5);

            assert('point inside rect', P.pointInRect(120, 120, R));
            assert('point outside rect', !P.pointInRect(120, 200, R));
            assert('zoneAt finds the containing rect', P.zoneAt([rect(0, 0, 10, 10), R], 120, 120) === R);
            assert('zoneAt returns null outside every rect', P.zoneAt([R], 5, 5) === null);
            assert('zoneAt tolerates a missing list', P.zoneAt(undefined, 0, 0) === null);
        })();

        (function () {
            var stat = rect(10, 20, 30, 40);
            assert('static wall ignores time', P.wallRect(stat, 12.5) === stat);

            var mover = { x: 100, y: 100, w: 20, h: 100, move: { axis: 'y', amp: 50, speed: 2, phase: 0 } };
            assert('moving wall is at its base at t=0', approx(P.wallRect(mover, 0).y, 100));
            assert('moving wall reaches +amp at a quarter period',
                approx(P.wallRect(mover, Math.PI / 4).y, 150, 1e-9));
            assert('moving wall does not drift on the other axis', approx(P.wallRect(mover, 1.3).x, 100));

            // Velocity must be the actual derivative, or a swept gate pushes
            // the ball by the wrong amount.
            var h = 1e-5, t = 0.7;
            var fd = (P.wallRect(mover, t + h).y - P.wallRect(mover, t - h).y) / (2 * h);
            assert('wall velocity matches the finite difference',
                approx(P.wallVelocity(mover, t).y, fd, 1e-3), 'analytic ' + P.wallVelocity(mover, t).y + ' vs ' + fd);
            assert('static wall has zero velocity', P.wallVelocity(stat, 3).x === 0 && P.wallVelocity(stat, 3).y === 0);
        })();

        /* ── the overswing ──────────────────────────────────────────────── */
        section('Overswing');

        (function () {
            assert('a shot inside the safe zone has no spread',
                P.spread(C.SAFE_POWER) === 0 && P.spread(C.SAFE_POWER - 100) === 0 && P.spread(C.MIN_POWER) === 0);
            assert('the top of the dial spreads by SPREAD_MAX',
                approx(P.spread(C.MAX_POWER), C.SPREAD_MAX, 1e-9));
            assert('spread never exceeds SPREAD_MAX, even past the dial',
                P.spread(C.MAX_POWER * 3) <= C.SPREAD_MAX + 1e-9);

            // Quadratic, so the first sliver past the line is nearly free.
            var quarter = C.SAFE_POWER + (C.MAX_POWER - C.SAFE_POWER) * 0.25;
            var half = C.SAFE_POWER + (C.MAX_POWER - C.SAFE_POWER) * 0.5;
            assert('spread grows, and grows faster the further past the line',
                P.spread(quarter) > 0 && P.spread(quarter) < P.spread(half) &&
                P.spread(half) - P.spread(quarter) < P.spread(C.MAX_POWER) - P.spread(half));
            assert('a quarter past the line costs almost nothing',
                P.spread(quarter) < C.SPREAD_MAX * 0.1, 'got ' + P.spread(quarter).toFixed(4));

            assert('the middle of the draw is dead straight', P.scatter(C.MAX_POWER, 0.5) === 0);
            assert('the draw is symmetric',
                approx(P.scatter(C.MAX_POWER, 0.2), -P.scatter(C.MAX_POWER, 0.8), 1e-12));
            assert('the draw is bounded by the spread',
                Math.abs(P.scatter(C.MAX_POWER, 0)) <= C.SPREAD_MAX + 1e-9 &&
                Math.abs(P.scatter(C.MAX_POWER, 0.999999)) <= C.SPREAD_MAX + 1e-9);
            assert('a safe shot cannot be pushed off line at all',
                P.scatter(C.SAFE_POWER, 0) === 0 && P.scatter(C.SAFE_POWER, 1) === 0);

            // Concentrated near the middle: half the draws land inside a
            // quarter of the cone, which is what makes an overswing feel like
            // a shot you did not quite control rather than a coin toss.
            var inner = 0, n = 2001;
            for (var i = 0; i < n; i++) {
                if (Math.abs(P.scatter(C.MAX_POWER, i / (n - 1))) < C.SPREAD_MAX * 0.25) inner++;
            }
            note('overswing draws inside a quarter of the cone: ' + Math.round(inner / n * 100) + '%');
            assert('the draw bunches near the middle', inner / n > 0.45, Math.round(inner / n * 100) + '%');

            /* The property that keeps the rest of this file honest: the luck is
               drawn by the caller, never inside the simulation. */
            var field = {
                name: 'spread', par: 3, tee: { x: 60, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], sand: [], rough: [], ice: [], bumpers: [], slopes: []
            };
            var a1 = P.simulateShot(field, { x: 60, y: 320 }, 0.3, C.MAX_POWER);
            var a2 = P.simulateShot(field, { x: 60, y: 320 }, 0.3, C.MAX_POWER);
            assert('the same shot simulated twice lands in the same place',
                a1.ball.x === a2.ball.x && a1.ball.y === a2.ball.y);

            // And the safe zone still reaches across the field, or the
            // overswing would not be a choice but a requirement.
            var roll = P.createWorld({
                name: 'roll', par: 3, tee: { x: 20, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], sand: [], rough: [], ice: [], bumpers: [], slopes: []
            }, { x: 20, y: 320 }, 0);
            P.launch(roll, 0, C.SAFE_POWER);
            var travelled = 0, px = roll.ball.x;
            for (var k = 0; k < 2400 && roll.moving; k++) {
                P.advance(roll, 1 / 120);
                travelled += Math.abs(roll.ball.x - px);
                px = roll.ball.x;
            }
            note('safe-zone roll: ' + Math.round(travelled) + 'px, full-power adds ' +
                 Math.round((C.MAX_POWER - C.SAFE_POWER) / -Math.log(C.FRICTION_GRASS)) + 'px more');
            assert('the safe zone alone outruns the field', travelled > C.WORLD_W,
                'only rolled ' + Math.round(travelled) + 'px');
        })();

        /* ── integrator ─────────────────────────────────────────────────── */
        section('Integrator');

        var open = {
            name: 'test field', par: 3,
            tee: { x: 60, y: 320 }, hole: { x: 900, y: 40 },
            walls: [], water: [], sand: [], slopes: []
        };

        (function () {
            var w = P.simulateShot(open, { x: 60, y: 320 }, 0, C.MAX_POWER);
            assert('a shot eventually comes to rest', !w.moving);
            assert('the ball stays inside the field',
                w.ball.x >= 0 && w.ball.x <= C.WORLD_W && w.ball.y >= 0 && w.ball.y <= C.WORLD_H);

            // The calibration the course design leans on: full power must be
            // able to cross the field, or holes stop being reachable in one.
            // Measured as total distance rolled, not resting position — a
            // full-power ball reaches the far cushion and comes back, so where
            // it stops says nothing about how far it can travel.
            var straight = {
                name: 'roll', par: 3, tee: { x: 20, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], sand: [], slopes: []
            };
            var roll = P.createWorld(straight, { x: 20, y: 320 }, 0);
            P.launch(roll, 0, C.MAX_POWER);
            var travelled = 0, px = roll.ball.x;
            for (var n = 0; n < 2400 && roll.moving; n++) {
                P.advance(roll, 1 / 120);
                travelled += Math.abs(roll.ball.x - px);
                px = roll.ball.x;
            }
            note('full-power roll: ' + Math.round(travelled) + 'px of travel across a ' + C.WORLD_W + 'px field');
            assert('full power outruns the width of the field', travelled > C.WORLD_W,
                'only rolled ' + Math.round(travelled) + 'px');
        })();

        (function () {
            // The whole point of exponential friction and substepping: the
            // result must not depend on how finely the caller samples time.
            function settleAt(angle, power, dt) {
                var w = P.createWorld(open, open.tee, 0);
                P.launch(w, angle, power);
                for (var i = 0; i < Math.ceil(20 / dt) && w.moving; i++) P.advance(w, dt);
                return w.ball;
            }

            /* Clean roll, no cushion: friction and integration alone, which
               should agree to well under a ball radius — the closed form makes
               a substep exact at any dt, so the two ought to be identical.

               The power is chosen to stop short of the far cushion and the
               test then checks that it did. It used to be a fraction of
               MAX_POWER, and when the dial grew an overswing zone the same
               fraction started reaching the wall: the assertion went on
               measuring something, but no longer the thing it is named after. */
            var CLEAN = 620;
            var a = settleAt(0, CLEAN, 1 / 120);
            var b = settleAt(0, CLEAN, 1 / 30);
            assert('the clean-roll fixture never reaches a cushion',
                a.x < C.WORLD_W - C.BALL_R - 1 && b.x < C.WORLD_W - C.BALL_R - 1,
                'ended at ' + a.x.toFixed(0));
            var clean = Math.hypot(a.x - b.x, a.y - b.y);
            /* The bound is not arbitrary. The closed form makes the roll
               itself exact at any dt, so the only thing left that can differ is
               *when the ball is noticed to have stopped*: the rest check runs
               at substep boundaries, and at STOP_SPEED a 30Hz caller can carry
               the ball STOP_SPEED / 30 further than a 120Hz one before it
               fires. That is 0.47px, and no roll can beat it.

               This assertion used to read `< 0.3`, which the fixture happened
               to satisfy — the ball stopped at a lucky phase of the sampling
               grid. Retuning the power dial moved that luck and the test went
               red without anything being broken. A bound derived from the
               mechanism does not have that failure mode. */
            var restBound = C.STOP_SPEED / 30;
            note('120Hz vs 30Hz, no cushion: ' + clean.toFixed(3) + 'px apart (bound ' +
                 restBound.toFixed(2) + 'px, one 30Hz frame at STOP_SPEED)');
            assert('an unobstructed roll is frame-rate independent to within one rest check',
                clean <= restBound, clean.toFixed(3) + 'px apart');

            // With bounces the two disagree slightly and always will: a
            // collision is resolved at a substep boundary rather than at the
            // exact time of impact, so a coarse sampler loses a sliver of
            // travel at every cushion. Bounded, not eliminated.
            var c = settleAt(0.6, C.MAX_POWER * 0.8, 1 / 120);
            var d = settleAt(0.6, C.MAX_POWER * 0.8, 1 / 30);
            var bounced = Math.hypot(c.x - d.x, c.y - d.y);
            note('120Hz vs 30Hz, several cushions: ' + bounced.toFixed(3) + 'px apart');
            assert('bounce sampling error stays small', bounced < 1.5, bounced.toFixed(3) + 'px apart');
        })();

        (function () {
            var sandy = {
                name: 'sand', par: 3, tee: { x: 40, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], slopes: [],
                sand: [rect(200, 200, 400, 240)]
            };
            var grassy = {
                name: 'grass', par: 3, tee: { x: 40, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], slopes: [], sand: []
            };
            var icy = {
                name: 'ice', par: 3, tee: { x: 40, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], slopes: [], sand: [],
                ice: [rect(100, 200, 800, 240)]
            };
            var both = {
                name: 'sand over ice', par: 3, tee: { x: 40, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], slopes: [],
                sand: [rect(200, 200, 400, 240)],
                ice: [rect(200, 200, 400, 240)]
            };
            var a = P.simulateShot(sandy, { x: 40, y: 320 }, 0, C.MAX_POWER * 0.6);
            var b = P.simulateShot(grassy, { x: 40, y: 320 }, 0, C.MAX_POWER * 0.6);
            var d = P.simulateShot(both, { x: 40, y: 320 }, 0, C.MAX_POWER * 0.6);
            assert('sand stops the ball short of the same shot on grass', a.ball.x < b.ball.x - 50,
                'sand ' + a.ball.x.toFixed(0) + ' vs grass ' + b.ball.x.toFixed(0));
            assert('sand wins where sand and ice overlap', approx(d.ball.x, a.ball.x, 0.5),
                'overlap ' + d.ball.x.toFixed(1) + ' vs sand ' + a.ball.x.toFixed(1));
            // A course written before ice existed must still simulate.
            assert('a hole with no ice list is fine', !isNaN(b.ball.x));

            /* Ice has to be worth putting on a hole: the same shot must run
               away from the grass one, not merely tie with it. Measured at a
               fifth of full power so that neither ball reaches the far cushion
               — a bounce would make resting position meaningless, which is why
               the far-cushion clearance is asserted rather than assumed. */
            var soft = C.MAX_POWER * 0.2;
            var onGrass = P.simulateShot(grassy, { x: 40, y: 320 }, 0, soft);
            var onIce = P.simulateShot(icy, { x: 40, y: 320 }, 0, soft);
            note('a fifth-power roll: ' + Math.round(onGrass.ball.x - 40) + 'px on grass, ' +
                 Math.round(onIce.ball.x - 40) + 'px on ice');
            assert('neither soft roll reaches the far cushion',
                onIce.ball.x < C.WORLD_W - 30 && onGrass.ball.x < C.WORLD_W - 30);
            assert('ice carries the ball well past the same shot on grass',
                onIce.ball.x > onGrass.ball.x + 200,
                'ice ' + onIce.ball.x.toFixed(0) + ' vs grass ' + onGrass.ball.x.toFixed(0));
        })();

        (function () {
            var scrub = {
                name: 'rough', par: 3, tee: { x: 40, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], sand: [], ice: [], slopes: [],
                rough: [rect(100, 200, 800, 240)]
            };
            var sandOverRough = {
                name: 'sand over rough', par: 3, tee: { x: 40, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], ice: [], slopes: [],
                sand: [rect(100, 200, 800, 240)],
                rough: [rect(100, 200, 800, 240)]
            };
            var plain = {
                name: 'grass', par: 3, tee: { x: 40, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], sand: [], ice: [], rough: [], slopes: []
            };
            var bunker = {
                name: 'sand', par: 3, tee: { x: 40, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], ice: [], rough: [], slopes: [],
                sand: [rect(100, 200, 800, 240)]
            };
            var soft2 = C.MAX_POWER * 0.4;
            var g2 = P.simulateShot(plain, { x: 40, y: 320 }, 0, soft2);
            var r2 = P.simulateShot(scrub, { x: 40, y: 320 }, 0, soft2);
            var s2 = P.simulateShot(bunker, { x: 40, y: 320 }, 0, soft2);
            var o2 = P.simulateShot(sandOverRough, { x: 40, y: 320 }, 0, soft2);
            note('a two-fifths roll: ' + Math.round(g2.ball.x - 40) + 'px on grass, ' +
                 Math.round(r2.ball.x - 40) + 'px in rough');
            assert('rough is slower than grass', r2.ball.x < g2.ball.x - 80,
                'rough ' + r2.ball.x.toFixed(0) + ' vs grass ' + g2.ball.x.toFixed(0));
            assert('rough is kinder than sand', r2.ball.x > s2.ball.x + 80,
                'rough ' + r2.ball.x.toFixed(0) + ' vs sand ' + s2.ball.x.toFixed(0));
            assert('sand wins where sand and rough overlap', approx(o2.ball.x, s2.ball.x, 0.5),
                'overlap ' + o2.ball.x.toFixed(1) + ' vs sand ' + s2.ball.x.toFixed(1));
            assert('a hole with no rough list is fine', !isNaN(g2.ball.x));
        })();

        (function () {
            var lane = {
                name: 'bumper', par: 3, tee: { x: 40, y: 320 }, hole: { x: -999, y: -999 },
                walls: [], water: [], sand: [], slopes: [],
                bumpers: [{ x: 400, y: 320, r: 24 }]
            };
            var head = P.simulateShot(lane, { x: 40, y: 320 }, 0, C.MAX_POWER * 0.5);
            assert('a bumper turns the ball back', head.ball.x < 400 - 24,
                'ended at x=' + head.ball.x.toFixed(0));
            assert('the ball never rests inside a bumper',
                P.circleCircle(head.ball.x, head.ball.y, C.BALL_R - 0.5, lane.bumpers[0]) === null);

            // The property the whole design rests on: a bumper may not hand
            // the ball energy. If it could, a ball wedged between a bumper and
            // a wall would rattle for ever and the hole would never hand
            // control back to the player.
            var w = P.createWorld(lane, { x: 40, y: 320 }, 0);
            P.launch(w, 0, C.MAX_POWER);
            var peak = P.speedOf(w.ball), grew = 0;
            for (var i = 0; i < 2400 && w.moving; i++) {
                P.advance(w, 1 / 120);
                var sp = P.speedOf(w.ball);
                if (sp > peak + 1e-6) grew++;
                peak = Math.max(peak, sp);
            }
            assert('a bumper never speeds the ball up', grew === 0, grew + ' substeps gained speed');
            assert('a shot into a bumper still comes to rest', !w.moving);

            // Bumpers are round, so the wall tunnelling test cannot cover
            // them. Fire a fan at full power from close range along lines that
            // all geometrically intersect the post, and require every one of
            // them to actually register a contact. Resting position would be
            // the wrong measure — a deflected ball can come back round the
            // far side — but a missed contact is unambiguous.
            var missed = 0;
            for (var k = 0; k < 120; k++) {
                var ang = -0.12 + (k / 119) * 0.24;
                var f = P.createWorld(lane, { x: 300, y: 320 }, 0);
                P.launch(f, ang, C.MAX_POWER);
                var touched = false;
                for (var n = 0; n < 240 && f.moving && f.ball.x < 460; n++) {
                    if (P.advance(f, 1 / 120, {}).bumper) touched = true;
                }
                if (!touched) missed++;
            }
            assert('no shot passes through a bumper untouched', missed === 0,
                missed + ' of 120 got through');
        })();

        (function () {
            var wet = {
                name: 'water', par: 3, tee: { x: 40, y: 320 }, hole: { x: 900, y: 320 },
                walls: [], sand: [], slopes: [],
                water: [rect(300, 200, 200, 240)]
            };
            var w = P.simulateShot(wet, { x: 40, y: 320 }, 0, C.MAX_POWER);
            assert('a ball hit into water splashes', w.splash);
            assert('a splashed ball stops moving', !w.moving && P.speedOf(w.ball) === 0);
            assert('a splashed ball does not also count as holed', !w.sunk);
            assert('the shot origin is kept for the penalty replay',
                approx(w.origin.x, 40) && approx(w.origin.y, 320));
        })();

        /* Skipping: a fast ball skips off water, a slow one goes in, and
           water is still water — see SKIP_SPEED in config.js. */
        (function () {
            function pond(x, w) {
                return {
                    name: 'pond', par: 3, tee: { x: 40, y: 320 }, hole: { x: -999, y: -999 },
                    walls: [], sand: [], slopes: [], water: [rect(x, 0, w, 640)]
                };
            }
            var creek = pond(300, 40);
            var hard = P.simulateShot(creek, { x: 200, y: 320 }, 0, C.SAFE_POWER);
            assert('a firm shot skips a 40px creek', !hard.splash && hard.ball.x > 340 && hard.skips === 1,
                'skips ' + hard.skips + ', ended at x=' + hard.ball.x.toFixed(0) + (hard.splash ? ' in the water' : ''));
            var soft = P.simulateShot(creek, { x: 200, y: 320 }, 0, 500);
            assert('a soft one into the same creek goes in', soft.splash && soft.skips === 0);

            // From right at the edge with the whole dial, the most there is.
            var lake = P.simulateShot(pond(300, 200), { x: 290, y: 320 }, 0, C.MAX_POWER);
            assert('no shot skips a 200px pond', lake.splash, 'ended at x=' + lake.ball.x.toFixed(0));
            assert('a skip chain ends in a few skips', lake.skips >= 1 && lake.skips <= 3, lake.skips + ' skips');
            assert('a ball that sinks after skipping sinks where it came down, past where it went in',
                lake.ball.x > 360 && P.zoneAt(lake.course.water, lake.ball.x, lake.ball.y) !== null);
            assert('the replay is still from where it was hit', approx(lake.origin.x, 290));

            // Nothing may hand the ball energy — a skip included.
            var w = P.createWorld(pond(300, 200), { x: 290, y: 320 }, 0);
            P.launch(w, 0, C.MAX_POWER);
            var last = P.speedOf(w.ball), rose = 0, flew = false;
            for (var n = 0; n < 2400 && w.moving; n++) {
                P.advance(w, 1 / 120, {});
                if (w.air > 0) flew = true;
                var s = P.speedOf(w.ball);
                if (s > last + 1e-9) rose++;
                last = s;
            }
            assert('the ball is in the air between skips', flew);
            assert('a skip never speeds the ball up', rose === 0, rose + ' steps sped up');

            // In the air it is over the sand as well as the water: a strip of
            // bunker under the hop changes nothing about where it comes down.
            var trap = pond(300, 40);
            trap.sand = [rect(344, 0, 14, 640)];
            var over = P.simulateShot(trap, { x: 200, y: 320 }, 0, C.SAFE_POWER);
            assert('a skipping ball flies over sand under its hop', approx(over.ball.x, hard.ball.x, 1e-6),
                over.ball.x.toFixed(2) + ' against ' + hard.ball.x.toFixed(2));

            // A new shot starts on the ground with no skips to its name.
            P.launch(hard, Math.PI, 300);
            assert('launch clears the last shot\'s skips', hard.skips === 0 && hard.air === 0);

            // A knock says where and how hard, for the effects.
            var box = pond(300, 0); box.water = [];
            var k = P.createWorld(box, { x: 900, y: 320 }, 0);
            P.launch(k, 0, 600);
            var got = null;
            for (var m = 0; m < 240 && !got; m++) got = P.advance(k, 1 / 120, {}).impact || null;
            assert('a cushion knock reports its normal and its speed in',
                got && got.nx === -1 && got.ny === 0 && got.vn > 400 && approx(got.x, C.WORLD_W),
                got ? JSON.stringify(got) : 'no knock');
        })();

        (function () {
            var hilly = {
                name: 'slope', par: 3, tee: { x: 480, y: 100 }, hole: { x: -999, y: -999 },
                walls: [], water: [], sand: [],
                slopes: [{ x: 0, y: 0, w: 960, h: 640, ax: 0, ay: 250 }]
            };
            // A ball placed at rest on a hill must slide, not hang there.
            var w = P.createWorld(hilly, { x: 480, y: 100 }, 0);
            w.moving = true;
            for (var i = 0; i < 240; i++) P.advance(w, 1 / 120);
            assert('a resting ball slides down a slope', w.ball.y > 140, 'ended at y=' + w.ball.y.toFixed(0));
        })();

        (function () {
            var cup = {
                name: 'cup', par: 3, tee: { x: 300, y: 320 }, hole: { x: 600, y: 320 },
                walls: [], water: [], sand: [], slopes: []
            };
            var slow = P.simulateShot(cup, { x: 300, y: 320 }, 0, 430);
            assert('a well-weighted putt drops', slow.sunk);
            assert('a holed ball sits in the cup', approx(slow.ball.x, 600) && approx(slow.ball.y, 320));

            // Too fast to drop: watched as it crosses the cup, not after it
            // settles — a runaway ball bounces off the far cushion and often
            // rolls back in, which is a feature and not a failed lip-out.
            var fast = P.createWorld(cup, { x: 300, y: 320 }, 0);
            P.launch(fast, 0, C.MAX_POWER);
            var crossed = false;
            for (var i = 0; i < 2400 && fast.moving; i++) {
                P.advance(fast, 1 / 120);
                if (fast.ball.x > cup.hole.x + C.HOLE_R * 3) { crossed = true; break; }
            }
            assert('a ball hit far too hard runs past the cup', crossed && !fast.sunk);

            var wide = P.simulateShot(cup, { x: 300, y: 320 }, 0.25, 430);
            assert('a putt pushed off line misses', !wide.sunk);
        })();

        /* The cup in three dimensions: a ball over the hole falls, and the lip
           is a circle it can lean on, ride round, hit and climb out over. Each
           shot here is set up to *arrive* at the rim on a given line at a
           given speed. */
        (function () {
            var cup = {
                name: 'cup', par: 3, tee: { x: 200, y: 320 }, hole: { x: 600, y: 320 },
                walls: [], water: [], sand: [], rough: [], ice: [], bumpers: [], slopes: [], tunnels: [], rails: []
            };
            function arrive(off, v) {
                var w = P.createWorld(cup, { x: 600 - C.HOLE_R - 40, y: 320 + off }, 0);
                P.launch(w, 0, v + 40 * -Math.log(C.FRICTION_GRASS));
                var out = { w: w, lip: false, knock: 0, high: 0, turn: 0, worst: 0, exit: null };
                var energy = function (b) {
                    return 0.5 * (b.vx * b.vx + b.vy * b.vy + b.vz * b.vz) + C.CUP_GRAVITY * b.z;
                };
                for (var i = 0; i < 2400 && w.moving && !w.sunk; i++) {
                    var e0 = energy(w.ball);
                    var ev = P.advance(w, 1 / 480);
                    if (w.sunk) break;
                    // Friction takes and gravity trades; nothing may give.
                    out.worst = Math.max(out.worst, energy(w.ball) - e0);
                    if (ev.lip) out.lip = true;
                    if (ev.rim) out.knock = Math.max(out.knock, ev.rim);
                    out.high = Math.max(out.high, w.ball.z - C.BALL_R);
                    if (w.ball.vx || w.ball.vy) out.turn = Math.max(out.turn, Math.abs(Math.atan2(w.ball.vy, w.ball.vx)));
                    if (!out.exit && out.lip && Math.hypot(w.ball.x - 600, w.ball.y - 320) > C.HOLE_R + C.BALL_R) out.exit = P.speedOf(w.ball);
                    if (w.ball.x > 700) break;
                }
                return out;
            }
            assert('a ball creeping over the edge of the cup topples in', arrive(14, 80).w.sunk);
            var firm = arrive(0, 280);
            assert('a firm putt at the middle hits the back of the cup and drops', firm.w.sunk && firm.lip);
            var hard = arrive(0, 380);
            assert('too firm, and it hops out over the back of the cup', !hard.w.sunk && hard.high > 2, 'rose ' + hard.high.toFixed(1) + 'px');
            assert('…slower than it went in', hard.exit !== null && hard.exit < 380 * 0.8, hard.exit && hard.exit.toFixed(0));
            assert('hitting the back of the cup is a knock you hear', firm.knock > C.RIM_KNOCK && hard.knock > C.RIM_KNOCK,
                firm.knock.toFixed(0) + ' / ' + hard.knock.toFixed(0));
            var ride = arrive(11, 180);
            assert('a ball that catches the edge rides round the lip and spins out', !ride.w.sunk && ride.lip && ride.turn > 0.5,
                'turned ' + (ride.turn * 180 / Math.PI).toFixed(0) + '°');
            var hang = arrive(C.HOLE_R + 2, 80);
            assert('a ball dying on the edge of the funnel round the cup topples in', hang.w.sunk);
            assert('…without a knock: toppling in is not hitting anything', arrive(14, 80).knock === 0);
            var past = arrive(C.HOLE_R + C.CUP_BEVEL + 1, 200);
            assert('a ball that never reaches the funnel rolls by untouched', !past.w.sunk && !past.lip && past.high === 0 && past.turn === 0);
            var worst = 0, rest = 0;
            [0, 4, 8, 11, 13, 14, 16, 19].forEach(function (o) {
                [90, 200, 320, 450, 700].forEach(function (v) {
                    var r = arrive(o, v);
                    worst = Math.max(worst, r.worst);
                    if (!r.w.sunk && !r.w.moving && !P.grounded(r.w.ball, cup.hole)) rest++;
                });
            });
            // A step's worth of slack where the funnel meets the green — under
            // a twentieth of a pixel of height. A real source of energy, like
            // a lip that kicks, shows up in the hundreds.
            assert('nothing at the cup hands the ball energy', worst < 40, 'gained ' + worst.toFixed(2));
            assert('no shot comes to rest hanging in the air or over the hole', rest === 0, rest + ' did');
            var far = P.createWorld(cup, { x: 200, y: 200 }, 0);
            P.launch(far, 0, 900);
            var flat = true;
            for (var k = 0; k < 600 && far.moving; k++) { P.advance(far, 1 / 120); if (far.ball.z !== C.BALL_R) flat = false; }
            assert('away from the cup the ball never leaves the green', flat);
        })();

        (function () {
            // Tunnelling check: fire a fan of full-power shots at a thin wall
            // from close range and make sure none of them get through.
            var boxed = {
                name: 'wall', par: 3, tee: { x: 100, y: 320 }, hole: { x: -999, y: -999 },
                walls: [rect(300, 0, 20, 640)],
                water: [], sand: [], slopes: []
            };
            var through = 0;
            for (var i = 0; i < 120; i++) {
                var ang = -0.6 + (i / 119) * 1.2;
                var w = P.simulateShot(boxed, { x: 100, y: 320 }, ang, C.MAX_POWER);
                if (w.ball.x > 300) through++;
            }
            assert('no shot tunnels through a 20px wall', through === 0, through + ' of 120 got through');
        })();

        /* ── tunnels ────────────────────────────────────────────────────── */
        section('Tunnels');

        /* A tunnel keeps the shot and changes the place. Everything below is
           a consequence of that sentence or a guard on it: same speed, same
           heading, both ways, no energy, no second trip down the mouth you
           came out of, and no trip at all for a ball that was not played. */
        (function () {
            var field = {
                tee: { x: 100, y: 320 }, hole: { x: 880, y: 560 },
                walls: [r(460, 0, 40, 640)], water: [], sand: [], rough: [], ice: [], bumpers: [], slopes: [],
                tunnels: [{ x: 300, y: 320, tx: 660, ty: 200 }]
            };
            function r(x, y, w, h) { return { x: x, y: y, w: w, h: h }; }

            var w = P.createWorld(field, { x: 160, y: 320 }, 0);
            P.launch(w, 0, 500);
            var seen = null, speedIn = 0, speedOut = 0;
            for (var i = 0; i < 400 && w.moving; i++) {
                var before = P.speedOf(w.ball);
                var ev = P.advance(w, 1 / 120);
                if (ev.tunnel && !seen) {
                    seen = ev.tunnel;
                    speedIn = before;
                    speedOut = P.speedOf(w.ball);
                    assert('it comes out of the other mouth', approx(w.ball.x, 660, 8) && approx(w.ball.y, 200, 8),
                        w.ball.x.toFixed(1) + ',' + w.ball.y.toFixed(1));
                    assert('on the heading it went in on', approx(Math.atan2(w.ball.vy, w.ball.vx), 0, 1e-9));
                }
            }
            assert('a ball rolled into a mouth goes down it', !!seen);
            assert('and keeps its speed — no more, give or take a substep of grass',
                speedOut <= speedIn && speedOut > speedIn * 0.97, speedIn.toFixed(1) + ' → ' + speedOut.toFixed(1));
            assert('it does not go straight back down the mouth it came out of', w.ball.x > 660 || !w.moving);

            // Both ways.
            var back = P.createWorld(field, { x: 760, y: 200 }, 0);
            P.launch(back, Math.PI, 400);
            var went = false;
            for (var j = 0; j < 400 && back.moving; j++) { if (P.advance(back, 1 / 120).tunnel) went = true; }
            assert('a tunnel runs both ways', went && back.ball.x < 460);

            // Struck from inside a mouth: leaving it, not entering it.
            var sat = P.createWorld(field, { x: 300, y: 320 }, 0);
            P.launch(sat, Math.PI / 2, 300);
            var tripped = false;
            for (var k = 0; k < 60; k++) { if (P.advance(sat, 1 / 120).tunnel) tripped = true; }
            assert('a ball struck from inside a mouth leaves it', !tripped && sat.ball.y > 340);

            // At rest in a mouth (a splash puts it back there) it stays put.
            var still = P.createWorld(field, { x: 300, y: 320 }, 0);
            for (var q = 0; q < 60; q++) P.advance(still, 1 / 120);
            assert('a ball at rest in a mouth is not taken down it unplayed',
                still.ball.x === 300 && still.ball.y === 320);

            // Frame rate does not change the outcome, tunnel or no tunnel.
            function settleAt(dt) {
                var s = P.createWorld(field, { x: 160, y: 320 }, 0);
                P.launch(s, 0, 500);
                for (var n = 0; n < 20 / dt && s.moving; n++) P.advance(s, dt);
                return s.ball;
            }
            var a30 = settleAt(1 / 30), a120 = settleAt(1 / 120);
            assert('30Hz and 120Hz agree about where a tunnelled shot stops',
                Math.hypot(a30.x - a120.x, a30.y - a120.y) < 1.5,
                Math.hypot(a30.x - a120.x, a30.y - a120.y).toFixed(2) + 'px apart');

            // The rule book knows them.
            function bad(t) {
                var h = JSON.parse(JSON.stringify(field));
                h.par = 3; h.tunnels = [t];
                return GOLF.validateHole(h);
            }
            assert('a well-placed tunnel passes the rule book', bad(field.tunnels[0]).length === 0, bad(field.tunnels[0]).join('; '));
            assert('a mouth on the cup is caught', bad({ x: 300, y: 320, tx: 870, ty: 560 }).some(function (b) { return /cup/.test(b); }));
            assert('a mouth against a wall is caught', bad({ x: 300, y: 320, tx: 515, ty: 200 }).some(function (b) { return /crowded/.test(b); }));
            assert('a tunnel that goes nowhere is caught', bad({ x: 300, y: 320, tx: 330, ty: 330 }).some(function (b) { return /short/.test(b); }));
            assert('a mouth over the cushion is caught', bad({ x: 300, y: 320, tx: 950, ty: 200 }).some(function (b) { return /off the field/.test(b); }));
        })();

        /* ── rails and polygons ─────────────────────────────────────────── */
        section('Avalanches, lava and geysers');

        /* Three hazards on a clock or a temperature. A chute's slide is a
           band you can watch coming and wait out, and it carries what it is
           over to the foot; lava is water nothing skips across; a geyser lifts
           a ball over what is beyond while it blows and is a grate while it
           does not — and none of the three may hand the ball energy it did
           not have, except the slide, which is a moving thing pushing. */
        (function () {
            function r(x, y, w, h) { return { x: x, y: y, w: w, h: h }; }
            function field(extra) {
                var f = { tee: { x: 100, y: 320 }, hole: { x: 880, y: 320 } };
                GOLF.HAZARD_KEYS.forEach(function (k) { f[k] = []; });
                Object.keys(extra).forEach(function (k) { f[k] = extra[k]; });
                return f;
            }

            // The slide's arithmetic.
            var a = { x: 400, y: 0, w: 120, h: 500, dir: 'down', every: 4, at: 1 };
            var len = C.AVALANCHE_LEN, V = C.AVALANCHE_SPEED;
            assert('before a slide sets off the chute is clear', P.slideAt(a, 0.99) === null || P.slideAt(a, 0.99).from >= 500);
            var band = P.slideAt(a, 1 + 200 / V);
            assert('a slide is a band LEN deep, its front SPEED px a second down the chute',
                band && approx(band.to, 200, 1e-6) && approx(band.to - band.from, len, 1e-6));
            var covered = 0;
            for (var t = 0; t < 4; t += 0.005) {
                var b = P.slideAt(a, t);
                if (b && b.from <= 250 && b.to >= 250) covered += 0.005;
            }
            assert('each point of the chute is under a slide for LEN / SPEED a cycle', approx(covered, len / V, 0.02),
                covered.toFixed(3) + 's');
            assert('and clear for the rest of it', 4 - covered >= C.AVALANCHE_CLEAR);
            assert('the downhill turns with the chute', P.chuteDir({ dir: 'left' }).x === -1 && P.chuteDir({ dir: 'up' }).y === -1);

            // A ball crossing the chute: between slides it goes straight
            // over, and under one it is carried down to the foot.
            var f = field({ avalanches: [a], sand: [r(380, 520, 160, 120)] });
            var clear = P.simulateShot(f, { x: 200, y: 250 }, 0, 700, 2.6);
            assert('between slides a putt crosses the chute on its line', clear.ball.x > 520 && approx(clear.ball.y, 250, 2),
                clear.ball.x.toFixed(0) + ',' + clear.ball.y.toFixed(0));
            var caught = P.simulateShot(f, { x: 330, y: 250 }, 0, 400, 1 + 250 / V - 0.2);
            assert('a ball the slide is over goes with it, out of the foot', caught.ball.y > 500,
                caught.ball.x.toFixed(0) + ',' + caught.ball.y.toFixed(0));

            // A ball resting in the chute is not safe there: the next slide
            // takes it, whether or not anybody played it.
            var rest = P.createWorld(f, { x: 460, y: 300 }, 0);
            for (var i = 0; i < 120 * 4; i++) P.advance(rest, 1 / 120);
            assert('a ball left in a chute is swept away by the next slide', rest.ball.y > 500, rest.ball.y.toFixed(0));
            var still = P.createWorld(f, { x: 600, y: 300 }, 0);
            for (i = 0; i < 120 * 4; i++) P.advance(still, 1 / 120);
            assert('one beside it is not', still.ball.x === 600 && still.ball.y === 300);

            // Lava: no pace is enough.
            var hot = field({ lava: [r(400, 0, 60, 640)], water: [r(600, 0, 60, 640)] });
            var burnt = P.simulateShot(hot, { x: 300, y: 320 }, 0, C.MAX_POWER, 0);
            assert('a full-power ball into lava does not skip — it is gone', burnt.splash && burnt.lava && burnt.skips === 0);
            var wet = P.simulateShot(field({ water: [r(400, 0, 60, 640)] }), { x: 300, y: 320 }, 0, C.MAX_POWER, 0);
            assert('the same ball skips the same width of water', wet.skips > 0 && !wet.splash);
            var slow = P.simulateShot(hot, { x: 300, y: 320 }, 0, 200, 0);
            assert('and a slow one is gone too, as into water', slow.splash && slow.lava);

            // Geysers.
            var vt = { x: 400, y: 320, every: 3, at: 0, run: 1 };
            var spring = field({ vents: [vt], lava: [r(470, 0, 100, 640)] });
            assert('a vent blows for `run` of every `every`',
                P.ventBlowing(vt, 0.5) && !P.ventBlowing(vt, 1.5) && P.ventBlowing(vt, 3.2));
            var up = P.createWorld(spring, { x: 330, y: 320 }, 0);
            P.launch(up, 0, 450);
            var lifted = false, fastest = 0, liftSpeed = 0, rising = false;
            for (i = 0; i < 1200 && up.moving && !up.splash; i++) {
                var sp = P.speedOf(up.ball);
                var ev = P.advance(up, 1 / 120);
                if (ev.vent) { lifted = true; liftSpeed = sp; }
                if (lifted && P.speedOf(up.ball) > liftSpeed + 1e-6) rising = true;
                if (up.air > 0) fastest = Math.max(fastest, up.airMax);
            }
            assert('a ball over a blowing vent is thrown up', lifted && approx(fastest, C.VENT_AIR, 1e-9));
            assert('and carried on its line over the lava beyond', !up.splash && up.ball.x > 570 && approx(up.ball.y, 320, 1),
                up.ball.x.toFixed(0) + (up.splash ? ' (burnt)' : ''));
            assert('a vent lifts — it never adds speed', !rising);
            var quiet = P.simulateShot(spring, { x: 330, y: 320 }, 0, 450, 1.4);
            assert('the same putt over a quiet vent rolls on into the lava', quiet.splash && quiet.lava);
            var sat = P.createWorld(spring, { x: 400, y: 320 }, 0.2);
            for (i = 0; i < 120 * 3; i++) P.advance(sat, 1 / 120);
            assert('a ball resting on a vent is juggled, and stays put', approx(sat.ball.x, 400, 1e-6) && approx(sat.ball.y, 320, 1e-6) && !sat.splash);
        })();

        section('Rails and polygons');

        /* The two shapes that let a hole be drawn on the slant: a wall at any
           angle, collided as a capsule, and a zone with corners that are not
           right angles. Held to everything a box is held to — they bounce
           like wood, nothing tunnels through them, a frame rate cannot change
           what they do — and the rule book knows them. */
        (function () {
            function r(x, y, w, h) { return { x: x, y: y, w: w, h: h }; }
            var flat = { tee: { x: 100, y: 320 }, hole: { x: 880, y: 320 },
                walls: [], water: [], sand: [], rough: [], ice: [], bumpers: [], slopes: [], tunnels: [],
                rails: [{ x: 480, y: 100, tx: 480, ty: 540, w: 24 }] };

            // Head-on into an upright rail: it comes back at RESTITUTION.
            var w = P.createWorld(flat, { x: 300, y: 320 }, 0);
            P.launch(w, 0, 600);
            var before = null, after = null;
            for (var i = 0; i < 240 && w.moving; i++) {
                var vx = w.ball.vx;
                P.advance(w, 1 / 120);
                if (before === null && w.ball.vx < 0) { before = vx; after = w.ball.vx; }
            }
            assert('a rail sends the ball back', before !== null);
            assert('…at a wall\'s restitution', before !== null && approx(-after / before, C.RESTITUTION, 0.02),
                before && (-after / before).toFixed(3));

            // Glancing off a 45° rail turns a horizontal roll vertical.
            var slant = JSON.parse(JSON.stringify(flat));
            slant.rails = [{ x: 380, y: 520, tx: 620, ty: 280, w: 24 }];
            var g = P.createWorld(slant, { x: 200, y: 450 }, 0);
            P.launch(g, 0, 500);
            for (i = 0; i < 120 && g.moving && g.ball.vy > -1; i++) P.advance(g, 1 / 120);
            assert('a rail on the slant turns the roll the way a slant should', g.ball.vy < -50,
                'vy ' + g.ball.vy.toFixed(1));

            /* Watched every step, not judged by where it stops: a full-power
               shot comes back off the far cushion, and one that had gone
               through would finish on the near side looking innocent. */
            var through = 0;
            for (var k = 0; k < 120; k++) {
                var sw = P.createWorld(flat, { x: 200, y: 140 + k * 3 }, 0);
                P.launch(sw, (k % 7 - 3) * 0.05, C.MAX_POWER);
                for (var st = 0; st < 2400 && sw.moving; st++) {
                    P.advance(sw, 1 / 120);
                    if (sw.ball.x > 480) { through++; break; }
                }
            }
            assert('no full-power shot tunnels through a 24px rail', through === 0, through + ' of 120 got through');

            function settleAt(dt) {
                var s = P.createWorld(slant, { x: 200, y: 450 }, 0);
                P.launch(s, 0, 500);
                for (var n = 0; n < 20 / dt && s.moving; n++) P.advance(s, dt);
                return s.ball;
            }
            var a = settleAt(1 / 30), b = settleAt(1 / 120);
            assert('30Hz and 120Hz agree about where a shot off a rail stops',
                Math.hypot(a.x - b.x, a.y - b.y) < 1.5, Math.hypot(a.x - b.x, a.y - b.y).toFixed(2) + 'px apart');

            // Polygons: inside, outside, and the notch of a concave one.
            var vee = [100, 100, 300, 100, 200, 200, 300, 300, 100, 300];
            assert('a point inside a polygon is inside', P.pointInPoly(150, 200, vee));
            assert('a point outside it is outside', !P.pointInPoly(350, 200, vee));
            assert('the notch of a concave polygon is outside', !P.pointInPoly(270, 200, vee));
            assert('a zone may be a polygon wherever a zone is asked about',
                P.zoneAt([{ pts: vee }], 150, 200) !== null && P.zoneAt([r(0, 0, 50, 50), { pts: vee }], 25, 25) !== null);

            var pond = JSON.parse(JSON.stringify(flat));
            pond.rails = [];
            pond.water = [{ pts: [400, 200, 560, 260, 520, 440, 380, 400] }];
            var sp = P.simulateShot(pond, { x: 200, y: 320 }, 0, 700);
            assert('a polygon of water takes the ball', sp.splash);
            var bunker = JSON.parse(JSON.stringify(pond));
            bunker.sand = bunker.water; bunker.water = [];
            var sb = P.simulateShot(bunker, { x: 200, y: 320 }, 0, 700);
            var free = JSON.parse(JSON.stringify(pond)); free.water = [];
            var sf = P.simulateShot(free, { x: 200, y: 320 }, 0, 700);
            assert('a polygon of sand slows it like a rectangle of sand does', sb.ball.x < sf.ball.x - 100,
                sb.ball.x.toFixed(0) + ' against ' + sf.ball.x.toFixed(0));

            // The rule book.
            function bad(h) { return GOLF.validateHole(h); }
            var ok = JSON.parse(JSON.stringify(slant)); ok.par = 3;
            assert('a well-placed rail passes the rule book', bad(ok).length === 0, bad(ok).join('; '));
            var thin = JSON.parse(JSON.stringify(ok)); thin.rails[0].w = 12;
            assert('a rail thinner than 20px is caught', bad(thin).some(function (m) { return /rail thinner/.test(m); }));
            var onTee = JSON.parse(JSON.stringify(ok)); onTee.rails.push({ x: 60, y: 320, tx: 140, ty: 320, w: 24 });
            assert('a rail across the tee is caught', bad(onTee).some(function (m) { return /tee is inside/.test(m); }));
            var sliver = JSON.parse(JSON.stringify(ok)); sliver.water = [{ pts: [400, 100, 600, 100, 600, 106] }];
            assert('a sliver of a polygon is caught', bad(sliver).some(function (m) { return /polygon thinner/.test(m); }));
            var wallPoly = JSON.parse(JSON.stringify(ok)); wallPoly.walls = [{ pts: [300, 100, 340, 100, 340, 200] }];
            assert('a polygon wall is caught — a wall at an angle is a rail',
                bad(wallPoly).some(function (m) { return /polygon wall/.test(m); }));
            var lake = JSON.parse(JSON.stringify(ok)); lake.water = [{ pts: [40, 280, 160, 280, 160, 360, 40, 360] }];
            assert('a tee in a polygon lake is caught', bad(lake).some(function (m) { return /tee is inside/.test(m); }));
        })();

        section('Curves, blocks, hills and wind');

        /* The shapes that let a hole stop being boxes. A curve and a block
           are rails underneath — so they are held to what a rail is held
           to — and a hill is a slope that is round. The things worth pinning
           are the ones that would be invisible from a screenshot: that a
           chain of rails has no seam, that a block has no way in, that a
           bowl lets a ball rest at its bottom and a slope still does not. */
        (function () {
            var Hs = GOLF.helpers;
            function field(extra) {
                var h = { par: 3, tee: { x: 100, y: 320 }, hole: { x: 880, y: 320 } };
                GOLF.HAZARD_KEYS.forEach(function (k) { h[k] = []; });
                Object.keys(extra || {}).forEach(function (k) { h[k] = extra[k]; });
                return h;
            }

            // A curve is a chain: each link ends where the next begins, every
            // end is on the circle, and no link turns more than ARC_STEP.
            var ring = Hs.arc(480, 200, 200, 0, 180, 24), links = P.arcRails(ring), seamless = true, onCircle = true;
            links.forEach(function (l, i) {
                if (i && (l.x !== links[i - 1].tx || l.y !== links[i - 1].ty)) seamless = false;
                [[l.x, l.y], [l.tx, l.ty]].forEach(function (e) {
                    if (Math.abs(Math.hypot(e[0] - 480, e[1] - 200) - 200) > 1e-6) onCircle = false;
                });
            });
            assert('a curve is laid as a seamless chain of rails on its circle', links.length >= 180 / 8 && seamless && onCircle,
                links.length + ' links');

            // Sent along the inside of a curve, a ball rides it round.
            var bowlField = field({ arcs: [ring] });
            var rider = P.createWorld(bowlField, { x: 480, y: 372 }, 0);
            P.launch(rider, 0, 650);
            var turned = false, outside = false;
            for (var i = 0; i < 2400 && rider.moving; i++) {
                P.advance(rider, 1 / 120);
                if (rider.ball.vy < -80 && rider.ball.x > 600) turned = true;
                if (Math.hypot(rider.ball.x - 480, rider.ball.y - 200) > 200 && rider.ball.y > 200) outside = true;
            }
            assert('a ball sent along the inside of a curve rides it round', turned);
            assert('…and never through it', !outside);

            // Shut in a whole ring and fired at every angle, nothing gets out.
            var cage = field({ arcs: [Hs.arc(480, 320, 200, 0, 360, 24)] });
            var leaks = 0;
            for (var k = 0; k < 90; k++) {
                var lw = P.createWorld(cage, { x: 480, y: 320 }, 0);
                P.launch(lw, k / 90 * Math.PI * 2, C.MAX_POWER);
                for (var st = 0; st < 2400 && lw.moving; st++) {
                    P.advance(lw, 1 / 120);
                    if (Math.hypot(lw.ball.x - 480, lw.ball.y - 320) > 200) { leaks++; break; }
                }
            }
            assert('no full-power shot gets through a curve', leaks === 0, leaks + ' of 90 got out');

            function rideAt(dt) {
                var s = P.createWorld(bowlField, { x: 480, y: 372 }, 0);
                P.launch(s, 0.2, 650);
                for (var n = 0; n < 20 / dt && s.moving; n++) P.advance(s, dt);
                return s.ball;
            }
            var a30 = rideAt(1 / 30), a120 = rideAt(1 / 120);
            assert('30Hz and 120Hz agree about where a ride round a curve stops',
                Math.hypot(a30.x - a120.x, a30.y - a120.y) < 1.5, Math.hypot(a30.x - a120.x, a30.y - a120.y).toFixed(2) + 'px apart');

            var flip = Hs.mirror(field({ arcs: [Hs.arc(300, 200, 120, 10, 100, 24)] }));
            var flipped = P.arcRails(flip.arcs[0]), plain = P.arcRails(Hs.arc(300, 200, 120, 10, 100, 24));
            assert('a mirrored curve is the curve, mirrored', flipped.length === plain.length && plain.every(function (l, i) {
                var m = flipped[flipped.length - 1 - i];
                return approx(m.tx, C.WORLD_W - l.x, 1e-6) && approx(m.ty, l.y, 1e-6);
            }));

            // A block: rails all round, and nothing ever gets inside it.
            var wedge = Hs.block('bed', [400, 200, 600, 260, 520, 460]);
            var bf = field({ blocks: [wedge] });
            assert('a block is its outline, as rails', P.blockRails(wedge).length === 3 && P.railsOf(bf).length === 3);
            var inside = 0;
            for (k = 0; k < 160; k++) {
                var bw = P.createWorld(bf, { x: 200 + (k % 4) * 10, y: 120 + k * 2.5 }, 0);
                P.launch(bw, (k % 9 - 4) * 0.12, C.MIN_POWER + (k % 5) / 4 * (C.MAX_POWER - C.MIN_POWER));
                for (st = 0; st < 2400 && bw.moving; st++) {
                    P.advance(bw, 1 / 120);
                    if (P.inBlock(bf, bw.ball.x, bw.ball.y)) { inside++; break; }
                }
            }
            assert('no shot ever gets inside a block', inside === 0, inside + ' of 160 did');

            // Hills: level at the middle and the rim, steepest halfway out.
            var mound = Hs.mound(480, 320, 120, 150), dip = Hs.bowl(480, 320, 120, 150);
            function pullAt(hl, d) { var o = P.hillPull([hl], 480 + d, 320, { x: 0, y: 0 }); return o.x; }
            assert('a hill is level at its middle and at its rim', approx(pullAt(mound, 0), 0, 1e-9) && approx(pullAt(mound, 120), 0, 1e-9));
            assert('…and pulls hardest halfway out, by as much as it says', approx(pullAt(mound, 60), 150, 1e-6));
            assert('a mound sheds outwards and a bowl gathers in', pullAt(mound, 30) > 0 && pullAt(dip, 30) < 0);

            assert('the pull a ball may rest under is the one that could never roll it past STOP_SPEED',
                approx(C.REST_PULL / -Math.log(C.FRICTION_GRASS), C.STOP_SPEED, 1e-9));

            var off = P.createWorld(field({ hills: [mound] }), { x: 520, y: 330 }, 0);
            off.moving = true;
            P.settle(off);
            assert('a ball left on a mound rolls off it and stops', !off.moving && Math.hypot(off.ball.x - 480, off.ball.y - 320) > 110,
                Math.hypot(off.ball.x - 480, off.ball.y - 320).toFixed(1) + 'px out');
            var down = P.createWorld(field({ hills: [dip] }), { x: 540, y: 300 }, 0);
            down.moving = true;
            P.settle(down);
            assert('a ball left in a bowl comes to rest at its bottom', !down.moving && Math.hypot(down.ball.x - 480, down.ball.y - 320) < 4,
                Math.hypot(down.ball.x - 480, down.ball.y - 320).toFixed(2) + 'px off, ' + down.time.toFixed(1) + 's');
            // A cup on a mound's crown: the green round it is cut level, so
            // a ball can never be held on the lip between the two.
            var crown = field({ hills: [Hs.mound(480, 320, 170, 170)] });
            crown.hole = { x: 480, y: 320 };
            var lip = C.HOLE_R + C.CUP_BEVEL;
            var lp = P.pull(crown, 480 + lip + 1, 320);
            assert('the ground round a cup on a mound is level', Math.hypot(lp.x, lp.y) < C.REST_PULL, Math.hypot(lp.x, lp.y).toFixed(1));
            var hung = 0;
            for (k = 0; k < 24; k++) {
                var cr = C.HOLE_R + k % 8 * 3, ca = k / 24 * 2 * Math.PI;
                var cw = P.createWorld(crown, { x: 480 + Math.cos(ca) * cr, y: 320 + Math.sin(ca) * cr }, 0);
                cw.moving = true;
                P.settle(cw);
                if (cw.moving) hung++;
            }
            assert('…and a ball left beside it always settles', hung === 0, hung + ' of 24 still rolling');

            var tilt = P.createWorld(field({ slopes: [{ x: 300, y: 100, w: 360, h: 440, ax: 0, ay: 140 }], rough: [Hs.r(0, 560, 960, 80)] }), { x: 480, y: 200 }, 0);
            tilt.moving = true;
            P.advance(tilt, 1 / 120);
            assert('nothing rests on a slope, still', tilt.moving && tilt.ball.vy > 0);

            // A wind is a slope to the ball. It is only shown differently.
            var lane = { x: 300, y: 200, w: 360, h: 240, ax: -120, ay: 40 };
            var breeze = JSON.parse(JSON.stringify(lane)); breeze.wind = true;
            var g1 = P.simulateShot(field({ slopes: [lane] }), { x: 100, y: 320 }, 0, 700);
            var g2 = P.simulateShot(field({ slopes: [breeze] }), { x: 100, y: 320 }, 0, 700);
            assert('a wind pulls exactly as a slope does', g1.ball.x === g2.ball.x && g1.ball.y === g2.ball.y);

            // The rule book.
            function bad(h) { return GOLF.validateHole(h); }
            var ok = field({ arcs: [Hs.arc(480, 320, 150, 200, 340, 24)], blocks: [wedge], hills: [Hs.bowl(780, 470, 90, 60)] });
            assert('curves, blocks and hills that keep the rules pass the rule book', bad(ok).length === 0, bad(ok).join('; '));
            var back = JSON.parse(JSON.stringify(ok)); back.arcs[0].to = back.arcs[0].from - 10;
            assert('a curve that runs backwards is caught', bad(back).some(function (m) { return /sweep forwards/.test(m); }));
            var walled = JSON.parse(JSON.stringify(ok)); walled.blocks.push(Hs.block('bed', [60, 260, 140, 260, 140, 380, 60, 380]));
            assert('a block round the tee is caught', bad(walled).some(function (m) { return /tee is inside/.test(m); }));
            var thinKerb = JSON.parse(JSON.stringify(ok)); thinKerb.blocks[0].w = 10;
            assert('a kerb thinner than 20px is caught', bad(thinKerb).some(function (m) { return /rail thinner/.test(m); }));
            var edgeHill = JSON.parse(JSON.stringify(ok)); edgeHill.hills.push(Hs.mound(80, 80, 100, 120));
            assert('a hill that reaches the cushion is caught', bad(edgeHill).some(function (m) { return /reaches the cushion/.test(m); }));
            var postHill = JSON.parse(JSON.stringify(ok)); postHill.bumpers.push(Hs.post(780, 470, 20));
            assert('a post on a hill is caught', bad(postHill).some(function (m) { return /solid on it/.test(m); }));
            var teeHill = JSON.parse(JSON.stringify(ok)); teeHill.hills.push(Hs.mound(140, 320, 70, 120));
            assert('a tee on a hill is caught', bad(teeHill).some(function (m) { return /tee is on a hill/.test(m); }));
        })();

        section('Spinners, belts and turntables');

        /* The two things on the green that move without a clock you have to
           wait for: an arm that comes round and a floor that goes along. Both
           hand the ball speed — a moving thing pushing, like a gate — so what
           is pinned is that they can never keep it: a spinner never crushes
           a ball or leaves it inside an arm, and a belt always puts it down. */
        (function () {
            var Hs = GOLF.helpers;
            function field(extra) {
                var h = { par: 3, tee: { x: 100, y: 320 }, hole: { x: 880, y: 320 } };
                GOLF.HAZARD_KEYS.forEach(function (k) { h[k] = []; });
                Object.keys(extra || {}).forEach(function (k) { h[k] = extra[k]; });
                return h;
            }
            var turn = Hs.spinner(480, 320, 110, 3, 1.2, 0, 22);
            var arms0 = P.spinnerArms(turn, 0), arms1 = P.spinnerArms(turn, 1);
            assert('a spinner has its arms, each as long as it says',
                arms0.length === 3 && arms0.every(function (a) { return approx(Math.hypot(a.tx - a.x, a.ty - a.y), 110, 1e-9); }));
            assert('…and they turn at its speed', approx(Math.atan2(arms1[0].ty - 320, arms1[0].tx - 480), 1.2, 1e-9));

            var sf = field({ spinners: [turn] });
            var sat = P.createWorld(sf, { x: 540, y: 380 }, 0);
            for (var i = 0; i < 600; i++) P.advance(sat, 1 / 60);
            assert('a ball left in a sweep is batted out of it', Math.hypot(sat.ball.x - 480, sat.ball.y - 320) > P.sweepOf(turn),
                Math.hypot(sat.ball.x - 480, sat.ball.y - 320).toFixed(1) + 'px out');

            var inArm = 0, hung = 0;
            for (var k = 0; k < 160; k++) {
                var w = P.simulateShot(sf, sf.tee, (k % 13 - 6) * 0.05, 300 + (k % 7) * 160, k * 0.07);
                if (w.moving) hung++;
                if (P.spinnerArms(turn, w.time).some(function (a) { return P.circleRail(w.ball.x, w.ball.y, C.BALL_R - 0.5, a); })) inArm++;
            }
            assert('no shot through a spinner ends inside an arm', inArm === 0, inArm + ' of 160');
            assert('…or fails to settle', hung === 0, hung + ' of 160');

            var flipped = Hs.mirror(field({ spinners: [Hs.spinner(300, 200, 90, 2, 0.8, 0.3, 20)] })).spinners[0];
            var a0 = P.spinnerArms(Hs.spinner(300, 200, 90, 2, 0.8, 0.3, 20), 1.7)[0], m0 = P.spinnerArms(flipped, 1.7)[0];
            assert('a mirrored spinner turns the other way, from a mirrored start',
                approx(m0.tx, C.WORLD_W - a0.tx, 1e-6) && approx(m0.ty, a0.ty, 1e-6));

            // Belts.
            var lane = Hs.belt(300, 280, 300, 80, 'right', 150);
            var ride = P.createWorld(field({ belts: [lane] }), { x: 320, y: 320 }, 0);
            ride.moving = true;
            P.advance(ride, 0.5);
            assert('a ball on a belt is not at rest: it comes up to the belt\'s pace', ride.moving && ride.ball.vx > 40, ride.ball.vx.toFixed(1));
            P.settle(ride);
            assert('…and is carried off the far end and stops', !ride.moving && ride.ball.x > 600, ride.ball.x.toFixed(1));
            var up = P.simulateShot(field({ belts: [Hs.belt(300, 280, 300, 80, 'left', 150)] }), { x: 100, y: 320 }, 0, 700);
            var flat = P.simulateShot(field({}), { x: 100, y: 320 }, 0, 700);
            assert('a putt into a belt\'s teeth is cut short', up.ball.x < flat.ball.x - 80, up.ball.x.toFixed(0) + ' against ' + flat.ball.x.toFixed(0));
            function rideAt(dt) {
                var r = P.createWorld(field({ belts: [lane] }), { x: 200, y: 300 }, 0);
                P.launch(r, 0.2, 500);
                for (var n = 0; n < 20 / dt && r.moving; n++) P.advance(r, dt);
                return r.ball;
            }
            var b30 = rideAt(1 / 30), b120 = rideAt(1 / 120);
            assert('30Hz and 120Hz agree about where a ride on a belt stops',
                Math.hypot(b30.x - b120.x, b30.y - b120.y) < 1.5, Math.hypot(b30.x - b120.x, b30.y - b120.y).toFixed(2) + 'px apart');

            // The rule book.
            function bad(h) { return GOLF.validateHole(h); }
            var ok = field({ spinners: [turn], belts: [Hs.belt(240, 470, 400, 70, 'right', 160)] });
            assert('a spinner and a belt that keep the rules pass the rule book', bad(ok).length === 0, bad(ok).join('; '));
            var crushed = JSON.parse(JSON.stringify(ok)); crushed.walls.push(Hs.r(560, 200, 26, 60));
            assert('a wall in a spinner\'s sweep is caught', bad(crushed).some(function (m) { return /solid in its sweep/.test(m); }));
            var teed = JSON.parse(JSON.stringify(ok)); teed.tee = { x: 420, y: 320 };
            assert('a tee in a sweep is caught', bad(teed).some(function (m) { return /tee is in a spinner/.test(m); }));
            var wall = JSON.parse(JSON.stringify(ok)); wall.belts[0] = Hs.belt(600, 470, 360, 70, 'right', 160);
            assert('a belt into the cushion is caught', bad(wall).some(function (m) { return /into the cushion/.test(m); }));
            var blocked = JSON.parse(JSON.stringify(ok)); blocked.walls.push(Hs.r(650, 450, 30, 110));
            assert('a belt into a wall is caught', bad(blocked).some(function (m) { return /into something solid/.test(m); }));
            var sandy = JSON.parse(JSON.stringify(ok)); sandy.sand.push(Hs.r(300, 480, 60, 40));
            assert('a belt over a bunker is caught', bad(sandy).some(function (m) { return /over another surface/.test(m); }));

            // Turntables: ground that turns, with a spindle at the middle.
            var deck = Hs.turntable(480, 320, 120, 1.5);
            var onDeck = P.createWorld(field({ turntables: [deck] }), { x: 540, y: 320 }, 0);
            onDeck.moving = true;
            P.advance(onDeck, 0.3);
            assert('a ball left on a turntable is not at rest: the platter swings it the way it turns',
                onDeck.moving && onDeck.ball.vy > 10, onDeck.ball.vy.toFixed(1));
            P.settle(onDeck);
            assert('…and flings it off the rim, where it stops',
                !onDeck.moving && Math.hypot(onDeck.ball.x - 480, onDeck.ball.y - 320) > 120 + C.BALL_R,
                Math.hypot(onDeck.ball.x - 480, onDeck.ball.y - 320).toFixed(1) + 'px out');
            var still = P.createWorld(field({ turntables: [deck] }), { x: 480, y: 320 - C.SPINDLE_R - C.BALL_R - 1 }, 0);
            still.moving = true;
            P.settle(still);
            assert('a ball put down by the spindle is still sent on its way', !still.moving &&
                Math.hypot(still.ball.x - 480, still.ball.y - 320) > 120, Math.hypot(still.ball.x - 480, still.ball.y - 320).toFixed(1));
            // Across the top of a platter turning clockwise the ground runs
            // with the putt; turning the other way, against it.
            var withIt = P.simulateShot(field({ turntables: [deck] }), { x: 200, y: 250 }, 0, 600);
            var against = P.simulateShot(field({ turntables: [Hs.turntable(480, 320, 120, -1.5)] }), { x: 200, y: 250 }, 0, 600);
            assert('a putt across the side of a platter turning with it runs on, and against it is cut short',
                withIt.ball.x > against.ball.x + 40, withIt.ball.x.toFixed(0) + ' against ' + against.ball.x.toFixed(0));
            // A slow ball is swung the way the platter's near edge is going —
            // up the field, on the left of a record turning clockwise — and
            // comes off well round from where it was aimed.
            var swung = P.simulateShot(field({ turntables: [deck] }), { x: 300, y: 270 }, 0, 170);
            assert('a slow ball onto a platter is swung round it', swung.ball.y < 230, swung.ball.x.toFixed(0) + ',' + swung.ball.y.toFixed(0));
            var hub = P.simulateShot(field({ turntables: [Hs.turntable(480, 320, 120, 0.5)] }), { x: 200, y: 320 }, 0, 900);
            assert('the spindle is a post: a putt down the middle hits it', hub.ball.x < 480, hub.ball.x.toFixed(0));
            assert('a mirrored turntable turns the other way', Hs.mirror(field({ turntables: [Hs.turntable(300, 320, 90, 1.2)] })).turntables[0].speed === -1.2);
            var deckOk = field({ turntables: [Hs.turntable(480, 320, 110, 1.4)] });
            assert('a turntable that keeps the rules passes the rule book', bad(deckOk).length === 0, bad(deckOk).join('; '));
            var edge = field({ turntables: [Hs.turntable(480, 120, 110, 1.4)] });
            assert('a turntable against the cushion is caught', bad(edge).some(function (m) { return /near the cushion/.test(m); }));
            var stacked = JSON.parse(JSON.stringify(deckOk)); stacked.bumpers.push(Hs.post(520, 330, 20));
            assert('a post on a turntable is caught', bad(stacked).some(function (m) { return /something solid on it/.test(m); }));
            var wet = JSON.parse(JSON.stringify(deckOk)); wet.water.push(Hs.r(440, 300, 60, 40));
            assert('a turntable over water is caught', bad(wet).some(function (m) { return /over another surface/.test(m); }));
            var cupped = JSON.parse(JSON.stringify(deckOk)); cupped.hole = { x: 520, y: 320 };
            assert('a cup on a turntable is caught', bad(cupped).some(function (m) { return /cup is on a turntable/.test(m); }));
        })();

        /* ── skaters ────────────────────────────────────────────────────── */
        section('Skaters');

        /* The one thing on the rack that takes the ball away from you. What
           is pinned is that it is fair in the ways that matter: it leaves a
           ball at rest alone, it always gives the ball back, it plays a ball
           once a shot so a shot always ends, and its coin toss is the same
           toss every time the same shot is played. */
        (function () {
            var Hs = GOLF.helpers;
            function rink(extra) {
                var h = { par: 3, tee: { x: 100, y: 320 }, hole: { x: 880, y: 320 } };
                GOLF.HAZARD_KEYS.forEach(function (k) { h[k] = []; });
                h.ice = [Hs.r(40, 40, 880, 560)];
                Object.keys(extra || {}).forEach(function (k) { h[k] = extra[k]; });
                return h;
            }
            var oval = Hs.skater(480, 320, 160, 110, 1.1, 0);
            var a0 = P.skaterAt(oval, 0), q = P.skaterAt(oval, Math.PI / 2 / 1.1);
            assert('a skater starts at its phase on the lap and goes round it',
                Math.abs(a0.x - 640) < 1e-9 && Math.abs(a0.y - 320) < 1e-9 && Math.abs(q.x - 480) < 1e-6 && Math.abs(q.y - 430) < 1e-6,
                a0.x + ',' + a0.y + ' then ' + q.x.toFixed(1) + ',' + q.y.toFixed(1));
            var eight = Hs.skater(480, 320, 160, 80, 0.8, 0, true), e1 = P.skaterAt(eight, Math.PI / 0.8);
            assert('an eight crosses its own middle', Math.abs(P.skaterAt(eight, Math.PI / 2 / 0.8).x - 480) < 1e-6 &&
                Math.abs(P.skaterAt(eight, Math.PI / 2 / 0.8).y - 320) < 1e-6, e1.x.toFixed(1) + ',' + e1.y.toFixed(1));
            var h = rink({ skaters: [oval] });

            // A ball at rest on the lap: the skater goes by and leaves it.
            var lazy = P.createWorld(h, { x: 480, y: 210 }, 0);
            for (var k = 0; k < 8 * 120; k++) P.advance(lazy, C.SIM_DT, {});
            assert('a skater leaves a ball at rest alone', lazy.ball.x === 480 && lazy.ball.y === 210 && !lazy.held,
                lazy.ball.x + ',' + lazy.ball.y);

            // Moving balls into the lap until one is taken.
            function play(hole, angle, power, at) {
                var w = P.createWorld(hole, hole.tee, at), log = { caught: [], pass: [], w: w };
                P.launch(w, angle, power);
                for (var s = 0; s < C.MAX_SHOT_SECONDS / C.SIM_DT && w.moving; s++) {
                    var ev = {};
                    P.advance(w, C.SIM_DT, ev);
                    if (ev.caught) log.caught.push({ t: w.time, i: ev.caught.i, held: JSON.parse(JSON.stringify(w.held)) });
                    if (ev.pass) log.pass.push({ t: w.time, i: ev.pass.i, x: w.ball.x, y: w.ball.y, vx: w.ball.vx, vy: w.ball.vy, angle: ev.pass.angle });
                }
                return log;
            }
            var taken = null, tries = 0;
            for (var ang = -30; ang <= 30 && !taken; ang += 3) {
                for (var at = 0; at < 6 && !taken; at += 0.5) {
                    tries++;
                    var lg = play(h, ang * Math.PI / 180, 700, at);
                    if (lg.caught.length) taken = { log: lg, ang: ang, at: at };
                }
            }
            assert('a moving ball that meets a skater is taken', !!taken, tries + ' shots tried');
            if (taken) {
                var c0 = taken.log.caught[0], p0 = taken.log.pass[0];
                assert('…and always passed on', !!p0 && p0.i === c0.i);
                var hold = p0.t - c0.t;
                assert('…after a dribble of ' + C.SKATER_HOLD[0] + ' to ' + C.SKATER_HOLD[1] + 's',
                    hold >= C.SKATER_HOLD[0] - 0.02 && hold <= C.SKATER_HOLD[1] + 0.02, hold.toFixed(3) + 's');
                var sk = P.skaterAt(oval, p0.t), rel = { x: p0.vx - sk.vx, y: p0.vy - sk.vy };
                var relSpeed = Math.hypot(rel.x, rel.y), off = Math.atan2(rel.y, rel.x) - Math.atan2(sk.vy, sk.vx);
                off = Math.atan2(Math.sin(off), Math.cos(off));
                assert('…at a pace off the skater between ' + C.SKATER_PASS[0] + ' and ' + C.SKATER_PASS[1] + 'px/s',
                    relSpeed >= C.SKATER_PASS[0] - 1 && relSpeed <= C.SKATER_PASS[1] + 1, relSpeed.toFixed(1));
                assert('…somewhere ahead of the skater, never back through it', Math.abs(off) <= C.SKATER_CONE + 1e-6,
                    (off * 180 / Math.PI).toFixed(1) + '°');
                assert('…from just ahead of the stick', Math.hypot(p0.x - sk.x, p0.y - sk.y) < P.reachOf() + 5,
                    Math.hypot(p0.x - sk.x, p0.y - sk.y).toFixed(1) + 'px out');
                assert('a skater plays the ball once a shot', taken.log.caught.length === 1, taken.log.caught.length + ' catches');
                assert('…and the shot ends', !taken.log.w.moving);
                var again = play(h, taken.ang * Math.PI / 180, 700, taken.at);
                assert('the same shot is the same pass, every time it is played',
                    JSON.stringify(again.pass) === JSON.stringify(taken.log.pass), JSON.stringify(again.pass[0]));
            }
            // The toss changes with the half-second: over a spread of
            // moments, the passes do not all go the same way.
            var turns = {};
            for (var t = 0; t < 40; t += 0.5) {
                var n = 2 * 7919 + Math.floor(t * 2) * 104729;
                turns[Math.round((P.chance(n + 1) * 2 - 1) * 4)] = true;
            }
            assert('the toss lands all over the cone', Object.keys(turns).length >= 7, Object.keys(turns).join(' '));

            // A shot that meets two skaters is passed by both and still ends.
            var two = rink({ skaters: [Hs.skater(330, 320, 110, 110, 1.2, 0), Hs.skater(680, 320, 110, 110, -1.2, 0)] });
            var ended = 0, both = 0;
            for (var a2 = -20; a2 <= 20; a2 += 4) {
                for (var t2 = 0; t2 < 5; t2 += 1) {
                    var l2 = play(two, a2 * Math.PI / 180, 1100, t2);
                    if (!l2.w.moving) ended++;
                    if (l2.pass.length === 2) both++;
                }
            }
            assert('every shot through two skaters ends inside MAX_SHOT_SECONDS', ended === 55, ended + ' of 55');

            // A mirror: the lap reflects, and so does where the skater is on it.
            [oval, eight].forEach(function (sk) {
                var m = Hs.mirror(rink({ skaters: [JSON.parse(JSON.stringify(sk))] })).skaters[0];
                var worst = 0;
                for (var tm = 0; tm < 6; tm += 0.37) {
                    var aa = P.skaterAt(sk, tm), bb = P.skaterAt(m, tm);
                    worst = Math.max(worst, Math.abs(C.WORLD_W - aa.x - bb.x) + Math.abs(aa.y - bb.y));
                }
                assert('a mirrored ' + (sk.eight ? 'eight' : 'oval') + ' is the same skater in the glass', worst < 1e-6, worst.toExponential(2));
            });

            // The rule book.
            function bad(hole) { return GOLF.validateHole(hole); }
            assert('a skater that keeps the rules passes the rule book', bad(h).length === 0, bad(h).join('; '));
            var grass = rink({ skaters: [oval] }); grass.ice = [Hs.r(40, 40, 520, 560)];
            assert('a skater off the ice is caught', bad(grass).some(function (m) { return /off the ice/.test(m); }));
            var posted = rink({ skaters: [oval] }); posted.bumpers.push(Hs.post(640, 330, 16));
            assert('a post on a lap is caught', bad(posted).some(function (m) { return /something solid on it/.test(m); }));
            var holed = rink({ skaters: [oval] }); holed.water.push(Hs.r(460, 190, 40, 40));
            assert('water on a lap is caught', bad(holed).some(function (m) { return /over water/.test(m); }));
            var tee = rink({ skaters: [oval] }); tee.tee = { x: 320, y: 320 };
