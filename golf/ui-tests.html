<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pocket Links — page chrome tests</title>
    <meta name="robots" content="noindex">
    <style>
        body { background: #071a10; color: #ecfdf5; font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 1rem; line-height: 1.5; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: bold; }
        h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: #a7c4b5; margin: 1.4rem 0 0.3rem; border-bottom: 1px solid #ffffff1a; padding-bottom: 0.2rem; }
        #summary { font-size: 1.2rem; margin-bottom: 0.5rem; padding: 0.6rem 0.9rem; border-radius: 10px; background: #ffffff0d; }
        #summary.ok { color: #4ade80; }
        #summary.bad { color: #f87171; }
        .note { color: #a7c4b5; font-size: 0.8rem; }
        /* Off screen rather than hidden: a display:none iframe lays nothing
           out, and half of what is asserted below is about laid-out boxes. */
        #stage { position: absolute; left: -9999px; top: 0; width: 1100px; height: 900px; border: 0; }
    </style>
</head>
<body>
    <div id="summary">running…</div>
    <div id="results"></div>
    <iframe id="stage" title="index.html under test"></iframe>

    <script>
    /* The second suite, and the one about the page rather than the game.

       `tests.html` is pure logic — config, courses, physics, scoring, the
       generator — and by design it never opens a document. That left the
       clubhouse untested: the chips, the ☰ panel and the course picker, which
       is the first thing a player touches and the last thing anything here
       had an opinion about. Two of the bugs found while building the picker
       were invisible to every assertion in the other file:

         · `.chip-menu { display: none }` was written *above* `.chip
           { display: inline-flex }`. Both are one class deep, so the later
           rule won and ☰ stood in the bar on a desktop, beside the five
           chips it exists to replace. Nothing is broken in either rule.
         · A plan drawn into a folded strip is drawn against a zero-width box
           and then cached at that size, so unfolding the strip showed six
           one-pixel smears that no amount of redrawing would replace.

       Unlike `golf3d/ui-tests.html` this loads the page *with* its scripts:
       there is no WebGL here and no three.js, so the real game boots in a
       frame in a few milliseconds and the picker can actually be opened,
       pressed and measured rather than merely read.

       What is stripped is everything cross-origin — the font stylesheet and
       the analytics tag — because a suite that waits on the network is a
       suite that is red behind a proxy. */
    (function () {
        'use strict';

        var passed = 0, failed = 0;
        window.FAILS = [];
        var out = document.getElementById('results');
        var t0 = performance.now();

        function section(name) {
            var h = document.createElement('h2');
            h.textContent = name;
            out.appendChild(h);
        }

        function assert(name, cond, detail) {
            var div = document.createElement('div');
            if (cond) {
                passed++;
                div.className = 'pass';
                div.textContent = '✓ ' + name;
            } else {
                failed++;
                window.FAILS.push(name + (detail ? ' — ' + detail : ''));
                div.className = 'fail';
                div.textContent = 'FAIL: ' + name + (detail ? ' — ' + detail : '');
            }
            out.appendChild(div);
        }

        function note(text) {
            var div = document.createElement('div');
            div.className = 'note';
            div.textContent = '  ' + text;
            out.appendChild(div);
        }

        function done() {
            var el = document.getElementById('summary');
            el.className = failed ? 'bad' : 'ok';
            el.textContent = (failed ? '✗ ' + failed + ' failed, ' : '✓ ') + passed + ' passed' +
                ' — ' + Math.round(performance.now() - t0) + 'ms';
            window.TEST_RESULT = { passed: passed, failed: failed, fails: window.FAILS };
            window.PASSED = passed;
            window.FAILED = failed;
            window.DONE = true;
        }

        /* ── the page under test ────────────────────────────────────────── */

        /* An `about:srcdoc` frame inherits this document's origin and base
           URL, so the relative script tags resolve and localStorage is the
           same store the real page uses. That store is put back at the end:
           a player who opens this file should lose a second, not a record. */
        var STORE = {};

        function saveStore() {
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (/^miniGolf\./.test(k)) STORE[k] = localStorage.getItem(k);
                }
                Object.keys(STORE).forEach(function (k) { localStorage.removeItem(k); });
            } catch (e) { /* storage off: nothing to protect */ }
        }

        function restoreStore() {
            try {
                for (var i = localStorage.length - 1; i >= 0; i--) {
                    var k = localStorage.key(i);
                    if (/^miniGolf\./.test(k)) localStorage.removeItem(k);
                }
                Object.keys(STORE).forEach(function (k) { localStorage.setItem(k, STORE[k]); });
            } catch (e) { /* ignore */ }
        }

        function chromeOnly(html) {
            return html
                .replace(/<script[^>]*\ssrc="https?:[^>]*><\/script>/gi, '')
                .replace(/<link[^>]+https?:\/\/[^>]*>/gi, '')
                .replace(/<\/head>/i,
                    '<style>*,*::before,*::after{transition:none!important;animation:none!important}</style></head>');
        }

        /* Transitions are killed rather than waited out. Most of what is read
           below is read one frame after a class was added, and an element
           mid-transition reports the state it is leaving — which is the old
           one, and would pass the very bugs this file exists for. */

        function load(html) {
            return new Promise(function (resolve, reject) {
                var frame = document.getElementById('stage');
                frame.addEventListener('load', function () {
                    var w = frame.contentWindow, tries = 0;
                    (function wait() {
                        if (w.GOLF && w.GOLF.game && w.GOLF.game.getState()) return resolve(frame);
                        if (++tries > 400) return reject(new Error('the game never booted in the frame'));
                        setTimeout(wait, 10);
                    })();
                }, { once: true });
                frame.srcdoc = html;
            });
        }

        function frame() { return document.getElementById('stage').contentWindow; }
        function doc() { return document.getElementById('stage').contentDocument; }
        function $(id) { return doc().getElementById(id); }
        function css(el, prop) { return doc().defaultView.getComputedStyle(el)[prop]; }
        /* Laid out *and* painted. A shut ☰ panel is `opacity: 0` with its
           boxes still in the flow, so a box test alone reports every chip
           behind it as on screen — which is the state this suite most has to
           be able to tell apart. */
        function shown(el) {
            if (!el || !(el.offsetWidth + el.offsetHeight)) return false;
            for (var n = el; n && n.nodeType === 1; n = n.parentElement) {
                var st = doc().defaultView.getComputedStyle(n);
                if (st.visibility === 'hidden' || +st.opacity === 0) return false;
            }
            return true;
        }

        /* Long enough for the plans to have been drawn. They are drawn from a
           `requestAnimationFrame` inside the frame, and waiting on one of
           *those* from out here is waiting on another window's queue — which
           headless, running on a fast-forwarded clock with the frame parked
           off screen, is under no obligation to service at all. A timer is
           the one thing `--virtual-time-budget` is guaranteed to run.

           A timer *polled*, rather than one wait of a length that is usually
           enough. One 60ms window is enough almost always and not always:
           with the other suites running beside this one the frame can miss
           it, and the two plan assertions below then go red on a page that is
           perfectly fine — which is the kind of red nobody believes and
           everybody re-runs. Polling asks the same question over the same
           span instead of once at the end of it, so it costs nothing when the
           answer is already yes and waits when it is not. The cap is there so
           a genuinely unpainted plan still fails the assertion rather than
           hanging the suite. */
        function tick(ready) {
            return new Promise(function (resolve) {
                var waited = 0;
                (function poll() {
                    if (waited >= 60 && (!ready || ready())) return resolve();
                    if (waited >= 1200) return resolve();     // let the assertion say it
                    waited += 10;
                    setTimeout(poll, 10);
                })();
            });
        }

        function compact(on) {
            doc().body.classList.toggle('compact-ui', on);
        }

        function parseColor(str) {
            var m = str && str.match(/^rgba?\(([^)]+)\)$/);
            if (!m) return null;
            var p = m[1].split(/[\s,/]+/).filter(function (s) { return s.length; });
            return { r: +p[0], g: +p[1], b: +p[2], a: p.length > 3 ? +p[3] : 1 };
        }

        /* Whether a canvas has anything on it. A plan drawn into a folded
           strip, or into a canvas nobody sized, comes back one pixel wide and
           uniformly transparent — both of which this catches. */
        function painted(canvas) {
            if (!canvas || canvas.width < 8) return false;
            var g = canvas.getContext('2d');
            var d = g.getImageData(0, 0, canvas.width, canvas.height).data;
            var seen = {}, n = 0;
            for (var i = 0; i < d.length; i += 4) {
                if (d[i + 3] === 0) continue;
                var key = d[i] + ',' + d[i + 1] + ',' + d[i + 2];
                if (!seen[key]) { seen[key] = 1; n++; }
                if (n > 3) return true;
            }
            return false;
        }

        /* ── the suite ──────────────────────────────────────────────────── */

        function run() {
            var G = frame().GOLF;

            /* First, before anything is pressed: the store was emptied
               above, so this is a first visit, and a first visit opens on
               the clubhouse door pointing at the course that says it is the
               place to start. */
            section('the title screen');

            assert('a first visit opens on the title screen', $('title').classList.contains('show'));
            assert('…pointed at the starter course', G.COURSE_ID === G.progress.starter().id && G.COURSE_ID === 'short');
            assert('…which it calls the place to start',
                /Start here/.test($('title-play').textContent) && $('title-play').textContent.indexOf('The Short Six') >= 0,
                $('title-play').textContent);
            assert('it counts the stars, from nothing', $('tp-stars').textContent === '0' && +$('tp-max').textContent > 0);
            assert('it names the next door and the price of it', /opens at \d+ ★ — \d+ to go/.test($('tp-next').textContent),
                $('tp-next').textContent);
            assert('no party to resume on a first visit', $('title-resume-party').hidden);
            assert('the first tee is coached', G.game.getState().coach === true);
            $('title-play').click();
            assert('the play button goes to the tee it was showing', !$('title').classList.contains('show') && G.COURSE_ID === 'short');
            var W0 = frame();
            W0.dispatchEvent(new W0.KeyboardEvent('keydown', { key: 'Escape' }));
            assert('Esc with nothing open brings the menu up', $('title').classList.contains('show'));
            W0.dispatchEvent(new W0.KeyboardEvent('keydown', { key: 'Escape' }));
            assert('…and Esc on the menu goes back to the game', !$('title').classList.contains('show'));
            $('btn-title').click();
            assert('the ★ chip opens it too', $('title').classList.contains('show'));
            /* The keys that play a shot belong to a dialog while one is
               open: Space on a focused button presses the button, and must
               not also wind up a putt behind it. */
            W0.dispatchEvent(new W0.KeyboardEvent('keydown', { key: 'ArrowUp' }));
            assert('the arrow keys do not aim behind an open dialog', !G.game.getState().aim.active);
            $('title-courses').click();
            assert('Courses on the title opens the picker in its place',
                $('menu').classList.contains('show') && !$('title').classList.contains('show'));
            $('menu-close').click();
            var startedOn = G.COURSE_ID;

            section('the topbar, wide');

            compact(false);
            var CHIPS = ['btn-full', 'btn-title', 'btn-courses', 'btn-restart', 'btn-card', 'chip-editor', 'btn-mute'];
            CHIPS.forEach(function (id) {
                assert('#' + id + ' is in the bar', shown($(id)));
            });
            assert('the ☰ button is not in a wide bar', !shown($('btn-menu')),
                'display: ' + css($('btn-menu'), 'display'));
            assert('every chip keeps its label out here',
                CHIPS.every(function (id) { return shown($(id).querySelector('.chip-text')); }));
            assert('the whole bar is one row',
                $('btn-full').getBoundingClientRect().top === $('btn-mute').getBoundingClientRect().top);
            assert('nothing in the bar runs off the page',
                doc().documentElement.scrollWidth <= doc().documentElement.clientWidth,
                doc().documentElement.scrollWidth + ' > ' + doc().documentElement.clientWidth);
            assert('the picker starts shut', !$('menu').classList.contains('show'));

            section('the topbar, compact');

            compact(true);
            assert('the ☰ button appears', shown($('btn-menu')));
            assert('the panel is shut to begin with', !shown($('btn-courses')),
                'a chip behind an unopened ☰ is on screen');
            assert('fullscreen stays out of the panel', shown($('btn-full')));
            assert('the labelled word goes from the chips left in the bar',
                !shown($('btn-full').querySelector('.chip-text')));

            $('btn-menu').click();
            assert('☰ opens the panel', shown($('btn-courses')));
            assert('the panel says it is open', $('btn-menu').getAttribute('aria-expanded') === 'true');
            assert('the chips get their words back inside the panel',
                shown($('btn-courses').querySelector('.chip-text')));

            /* The bug this pair exists for: the panel and the bar both repaint
               a chip's background without saying anything about its colour,
               which leaves a lit ☰ painted dark green on dark green. */
            var lit = parseColor(css($('btn-menu'), 'backgroundColor'));
            var panel = parseColor(css($('topbar-menu'), 'backgroundColor'));
            assert('a lit ☰ is painted on the accent, not on the panel backing',
                lit && lit.g > 150 && lit.r < 140,
                'background ' + css($('btn-menu'), 'backgroundColor'));
            assert('its ink is dark enough to read on that',
                parseColor(css($('btn-menu'), 'color')).g < 120,
                'colour ' + css($('btn-menu'), 'color'));
            assert('the panel itself is opaque enough to sit over the board',
                panel && panel.a > 0.9, 'alpha ' + (panel && panel.a));

            $('btn-menu').click();
            assert('☰ shuts the panel again', !shown($('btn-courses')));
            compact(false);

            section('the course picker');

            $('btn-courses').click();
            assert('the Courses chip opens the picker', $('menu').classList.contains('show'));

            var cards = doc().querySelectorAll('#menu-list .course-card');
            assert('one card per course on the rack', cards.length === G.COURSES.length,
                cards.length + ' cards for ' + G.COURSES.length + ' courses');
            note(G.COURSES.map(function (c) { return c.id; }).join(', '));

            var plansOk = true, headsOk = true;
            for (var i = 0; i < cards.length; i++) {
                if (cards[i].querySelectorAll('.cc-hole').length !== G.COURSES[i].holes.length) plansOk = false;
                if (!cards[i].querySelector('.cc-head')) headsOk = false;
            }
            assert('every hole of every course has a plan of its own', plansOk);
            assert('every card is a button in its own right', headsOk);

            var here = doc().querySelector('#menu-list .course-card.playing');
            assert('the card being played is marked', !!here);
            assert('…and it is the one the game is on',
                here && here.querySelector('.cc-head').textContent.indexOf(
                    G.COURSES.filter(function (c) { return c.id === G.COURSE_ID; })[0].name) === 0);

            var redraws = doc().querySelectorAll('#menu-list .cc-redraw');
            assert('only the draw can be re-dealt', redraws.length === 1,
                redraws.length + ' re-deal buttons');
            assert('…and it is on the draw’s own card',
                redraws.length === 1 &&
                redraws[0].closest('.course-card').querySelector('.cc-head')
                    .textContent.indexOf('Random Draw') === 0);

            var meta = doc().querySelector('#menu-list .course-card .cc-meta').textContent;
            assert('a card prices itself: holes, par and the record',
                /\d+ holes/.test(meta) && /par \d+/.test(meta) && /best/.test(meta), meta);
            var drawMeta = redraws[0].closest('.course-card').querySelector('.cc-meta').textContent;
            assert('the draw says it holds no record rather than showing an empty one',
                /not recorded/.test(drawMeta), drawMeta);

            // The picker prices every card at once, which means reading four
            // other courses' save keys. None of that may move the pointer the
            // ball is rolling on.
            assert('pricing the rack did not move the course being played',
                G.COURSE_ID === startedOn, G.COURSE_ID + ' was ' + startedOn);

            return tick(function () {
                var first = doc().querySelector('#menu-list .cc-hole .cc-map');
                var last = cards[cards.length - 1].querySelector('.cc-map');
                return painted(first) && painted(last);
            }).then(function () {
                section('the hole plans');

                var cells = doc().querySelectorAll('#menu-list .cc-hole');
                assert('a plan canvas is sized from its laid-out box',
                    cells[0].querySelector('.cc-map').width > 40,
                    'width ' + cells[0].querySelector('.cc-map').width);
                assert('and something was actually drawn on it',
                    painted(cells[0].querySelector('.cc-map')));
                var lastCard = cards[cards.length - 1];
                assert('the last card’s plans are drawn too, not just the first’s',
                    painted(lastCard.querySelector('.cc-map')));
                assert('every plan carries its number and its par',
                    cells[0].querySelector('.cc-num').textContent === '1' &&
                    /^\d+$/.test(cells[0].querySelector('.cc-par').textContent));

                // Two draws are two courses under one id. A cache that keyed on
                // the id alone would hand the second one the first one's plans.
                var a = G.plan.plan('links', 0, 64, 43, null);
                var b = G.plan.plan('links', 0, 64, 43, null);
                assert('a plan is drawn once and kept', a === b);
                assert('a different seed is a different plan',
                    G.plan.plan(G.generator.DRAW_ID, 0, 64, 43, 1) !==
                    G.plan.plan(G.generator.DRAW_ID, 0, 64, 43, 2));
                assert('a hole that is not there draws nothing rather than throwing',
                    G.plan.plan('links', 999, 64, 43, null) === null);

                section('picking with it');

                // Second course on the rack, third hole: a plan press is a new
                // round teeing off there, not a resumed one.
                var second = G.COURSES[1];
                cards[1].querySelectorAll('.cc-hole')[2].click();
                assert('pressing a plan takes you to that course', G.COURSE_ID === second.id);
                assert('…and starts you on that hole',
                    frame().GOLF.game.getState().holeIndex === 2);
                assert('…on a card with nothing filled in',
                    frame().GOLF.game.getState().scores.filter(function (s) {
                        return typeof s === 'number';
                    }).length === 0);
                assert('choosing shuts the picker', !$('menu').classList.contains('show'));

                $('btn-courses').click();
                var first = G.COURSES[0];
                doc().querySelectorAll('#menu-list .course-card')[0]
                    .querySelector('.cc-head').click();
                assert('pressing a card head takes you to that course', G.COURSE_ID === first.id);
                assert('…from the first tee when there is no round waiting',
                    frame().GOLF.game.getState().holeIndex === 0);

                section('getting out of it');

                $('btn-courses').click();
                var W = frame();
                doc().dispatchEvent(new W.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
                assert('Escape shuts the picker', !$('menu').classList.contains('show'));

                $('btn-courses').click();
                $('menu').click();                     // the scrim, not the dialog
                assert('a press outside the dialog shuts it', !$('menu').classList.contains('show'));

                $('btn-courses').click();
                $('menu-close').click();
                assert('Keep playing shuts it', !$('menu').classList.contains('show'));

                assert('C opens it from the keyboard', (function () {
                    W.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'c' }));
                    return $('menu').classList.contains('show');
                })());
                $('menu-close').click();

                section('folded strips on a phone');

                compact(true);
                $('btn-courses').click();
                var open = doc().querySelectorAll('#menu-list .course-card.expanded');
                assert('only the card you are standing on starts open', open.length === 1,
                    open.length + ' cards open');
                assert('…and it is the one being played', open[0].classList.contains('playing'));
                var shut = doc().querySelector('#menu-list .course-card:not(.expanded)');
                assert('a folded strip lays nothing out',
                    shut.querySelector('.cc-holes').clientHeight === 0);
                assert('its head is still a one-tap start', shown(shut.querySelector('.cc-head')));

                shut.querySelector('.cc-toggle').click();
                assert('the toggle unfolds it', shut.classList.contains('expanded'));
                assert('…and says so', shut.querySelector('.cc-toggle')
                    .getAttribute('aria-expanded') === 'true');

                return tick(function () {
                    return painted(shut.querySelector('.cc-map'));
                }).then(function () {
                    /* The second bug: a plan drawn while its strip was folded
                       is drawn at a zero-width box and cached there. */
                    assert('the plans in an unfolded strip are drawn at full size',
                        painted(shut.querySelector('.cc-map')),
                        'width ' + shut.querySelector('.cc-map').width);
                    $('menu-close').click();
                    compact(false);
                    return more(G);
                }).then(done);
            });
        }

        /* ── what came with the stars ───────────────────────────────────── */

        function more(G) {
            var W = frame();

            section('locks');

            $('btn-courses').click();
            var cards = doc().querySelectorAll('#menu-list .course-card');
            var locked = doc().querySelectorAll('#menu-list .course-card.locked');
            assert('on a first visit the later cards are locked', locked.length >= 3, locked.length + ' locked');
            assert('…and the two at the top are not', !cards[0].classList.contains('locked') && !cards[1].classList.contains('locked'));
            var lk = locked[0];
            var lockedId = lk.querySelector('.cc-hole').getAttribute('data-course');
            assert('a locked card says what it costs', /opens at \d+ ★, \d+ to go/.test(lk.querySelector('.cc-meta').textContent),
                lk.querySelector('.cc-meta').textContent);
            assert('a locked card still shows its holes', lk.querySelectorAll('.cc-hole').length > 0);
            assert('…but none of them can be pressed', Array.prototype.every.call(lk.querySelectorAll('.cc-hole'), function (c) { return c.disabled; }));
            var was = G.COURSE_ID;
            lk.querySelector('.cc-head').click();
            assert('pressing a locked head does not take you there', G.COURSE_ID === was && $('menu').classList.contains('show'));
            assert('…it says why instead', /opens at/.test($('toast').textContent), $('toast').textContent);
            var dealt = {};
            for (var i = 0; i < 60; i++) dealt[G.game.randomCourseId()] = true;
            assert('the die only deals what is open', Object.keys(dealt).every(function (id) {
                return G.progress.isOpen(G.COURSES.filter(function (c) { return c.id === id; })[0]);
            }), Object.keys(dealt).join(', '));
            assert('the way past the ladder is offered', !$('menu-unlock').hidden);
            $('menu-unlock').click();
            assert('one press only arms it', doc().querySelectorAll('#menu-list .course-card.locked').length === locked.length &&
                $('menu-unlock').classList.contains('armed'));
            $('menu-unlock').click();
            assert('the second opens every course', doc().querySelectorAll('#menu-list .course-card.locked').length === 0);
            assert('…and the offer goes away', $('menu-unlock').hidden);
            $('menu-close').click();
            assert('a course that was locked can now be played', G.game.playCourse(lockedId, null) && G.COURSE_ID === lockedId);

            section('stars');

            G.game.playCourse('short', null, 0);
            var st = G.game.getState();
            st.strokes = G.COURSE[0].par - 1;
            G.game.holeComplete(false);
            assert('a birdie is three stars on the banner', $('banner-stars').textContent.indexOf('★★★') === 0,
                $('banner-stars').textContent);
            assert('…and three on the scoreboard', $('hole-stars').textContent === '★★★');
            assert('the hole best is written down at once', G.scoring.load('short').holes[0] === G.COURSE[0].par - 1);
            G.game.advanceHole();
            $('btn-courses').click();
            var shortCard = doc().querySelectorAll('#menu-list .course-card')[1];
            assert('the plan carries the stars it gave', shortCard.querySelector('.cc-stars').textContent === '★★★',
                shortCard.querySelector('.cc-stars').textContent);
            assert('the card head counts them', /★ 3\/18/.test(shortCard.querySelector('.cc-meta').textContent),
                shortCard.querySelector('.cc-meta').textContent);
            $('menu-close').click();
            st = G.game.getState();
            st.strokes = G.scoring.strokeLimit(G.COURSE[1].par);
            G.game.holeComplete(true);
            assert('running out of strokes is a pick-up', $('banner-term').textContent === 'Picked up');
            assert('…written down as one past the limit', st.scores[1] === G.scoring.pickupScore(G.COURSE[1].par));
            assert('…and worth no stars', $('banner-stars').textContent.indexOf('☆☆☆') === 0, $('banner-stars').textContent);

            section('a door opening');

            /* Stars up to one short of a threshold, then the hole that
               crosses it: the banner has to say so, and the card has to be
               open afterwards. Everything was unlocked above, so progress is
               written back as a player who has opened nothing — written, not
               removed: with save files in the store and no progress record,
               the game would rightly take this browser for a veteran's. */
            localStorage.setItem(G.CONFIG.PROGRESS_KEY, JSON.stringify({
                v: 1, all: false, granted: {}, seen: {}, coached: true, veteran: false
            }));
            G.progress.reload();
            var tide = G.COURSES.filter(function (c) { return c.id === 'tide'; })[0];
            var need = G.progress.need(tide);
            var shortHoles = G.COURSES[1].holes;
            var seed = shortHoles.map(function () { return null; });
            var have = 0;
            for (var h = 1; h < shortHoles.length && have + 3 < need; h++) { seed[h] = shortHoles[h].par - 1; have += 3; }
            localStorage.setItem(G.scoring.key(G.CONFIG.SAVE_KEY, 'short'), JSON.stringify({ best: null, holes: seed }));
            G.progress.reload();
            assert('one hole short of the Tidewater Nine, it is still shut', !G.progress.isOpen(tide),
                G.progress.totalStars().got + ' of ' + need);
            G.game.playCourse('short', null, 0);
            st = G.game.getState();
            st.strokes = 1;
            G.game.holeComplete(false);
            assert('the hole that crosses the line says the door is open',
                /The Tidewater Nine is now open/.test($('banner-note').textContent), $('banner-note').textContent);
            assert('…and it is', G.progress.isOpen(tide) && G.progress.get().granted.tide);
            G.game.advanceHole();
            G.progress.unlockAll();

            section('a party');

            $('btn-title').click();
            $('title-party').click();
            assert('Party opens its dialog', $('party').classList.contains('show') && !$('title').classList.contains('show'));
            assert('a party starts with two players', $('party-players').querySelectorAll('input').length === 2);
            $('party-add').click();
            assert('a third can be added', $('party-players').querySelectorAll('input').length === 3);
            var inputs = $('party-players').querySelectorAll('input');
            inputs[0].value = 'Ana'; inputs[1].value = 'Ben'; inputs[2].value = 'Cy';
            assert('the inputs are big enough not to zoom a phone', parseFloat(css(inputs[0], 'fontSize')) >= 16);
            assert('only open courses are offered', doc().querySelectorAll('#party-courses .party-course').length === G.COURSES.length);
            $('party-go').click();
            st = G.game.getState();
            assert('Tee off starts the party', !!st.party && st.party.players.length === 3 && !$('party').classList.contains('show'));
            assert('the running order is on the page', !$('party-strip').hidden &&
                doc().querySelectorAll('#party-strip .ps').length === 3);
            assert('the first name is up', doc().querySelector('#party-strip .ps.up').textContent.indexOf('Ana') >= 0);
            assert('each player has a ball of their own', st.ballColor === G.CONFIG.PLAYER_COLORS[0]);
            assert('a party is nobody\'s record', $('hole-stars').textContent === '');
            st.strokes = 3;
            G.game.holeComplete(false);
            assert('the banner hands the hole on by name', /Ben’s turn/.test($('banner-next').textContent), $('banner-next').textContent);
            G.game.advanceHole();
            st = G.game.getState();
            assert('the next player tees off the same hole', st.holeIndex === 0 && st.party.players[st.party.order[st.party.pos]].name === 'Ben');
            assert('…with their own ball', st.ballColor === G.CONFIG.PLAYER_COLORS[1]);
            st.strokes = 1;
            $('btn-restart').click();
            assert('in a party the tee is free but the strokes stand', G.game.getState().strokes === 1);
            st.strokes = 2;
            G.game.holeComplete(false);
            G.game.advanceHole();
            st = G.game.getState();
            st.strokes = 4;
            G.game.holeComplete(false);
            assert('the last putt of a hole shows everybody\'s score', doc().querySelectorAll('#banner-note .hb').length === 3);
            G.game.advanceHole();
            st = G.game.getState();
            assert('the best score has the honour on the next tee',
                st.holeIndex === 1 && st.party.players[st.party.order[0]].name === 'Ben', st.party.order.join(','));
            assert('the party is saved after every turn', !!localStorage.getItem(G.CONFIG.PARTY_KEY));

            // Away to a solo course, and back.
            G.game.playCourse('links', null);
            assert('a solo course leaves the party behind', !G.game.getState().party && $('party-strip').hidden);
            $('btn-title').click();
            assert('…and the menu offers it back', !$('title-resume-party').hidden &&
                /Ana, Ben, Cy/.test($('title-resume-party').textContent));
            $('title-resume-party').click();
            st = G.game.getState();
            assert('resuming puts the party back where it was',
                !!st.party && st.holeIndex === 1 && st.party.players[st.party.order[st.party.pos]].name === 'Ben');
            G.game.playCourse('links', null);
            localStorage.removeItem(G.CONFIG.PARTY_KEY);

            section('the turned board');

            /* A phone held upright. The frame is narrowed to a phone's width
               and the board is asked to fit again; it should turn, and the
               pointer has to land where the drawing says it does — checked
               by sending world points through the canvas's own transform and
               back through toWorld. */
            var f = document.getElementById('stage');
            f.style.width = '390px';
            f.style.height = '800px';
            G.game.resize();
            var cv = $('board');
            var box = cv.getBoundingClientRect();
            assert('an upright phone turns the board', doc().body.classList.contains('is-turned') && box.height > box.width,
                Math.round(box.width) + 'x' + Math.round(box.height));
            var tr = cv.getContext('2d').getTransform();
            var ok = [[140, 320], [830, 120], [480, 600]].every(function (p) {
                var dx = tr.a * p[0] + tr.c * p[1] + tr.e, dy = tr.b * p[0] + tr.d * p[1] + tr.f;
                var back = G.game.toWorld({
                    clientX: box.left + dx / cv.width * box.width,
                    clientY: box.top + dy / cv.height * box.height
                });
                return Math.abs(back.x - p[0]) < 1 && Math.abs(back.y - p[1]) < 1;
            });
            assert('the pointer lands where the turned drawing puts things', ok);
            var teeY = tr.b * 140 + tr.d * 320 + tr.f;
            assert('the tee end is at the bottom of the screen', teeY > cv.height / 2);

            section('the side layout');

            f.style.width = '760px';
            f.style.height = '360px';
            G.game.resize();
            box = $('board').getBoundingClientRect();
            assert('a phone on its side puts the scoreboard beside the board', doc().body.classList.contains('is-side'));
            assert('the board takes nearly the full height', box.height > 360 * 0.85, Math.round(box.height) + 'px of 360');
            assert('the board sits left of the column', box.right <= $('power').getBoundingClientRect().left + 1);
            assert('nothing scrolls', doc().documentElement.scrollHeight <= doc().documentElement.clientHeight + 1,
                doc().documentElement.scrollHeight + ' > ' + doc().documentElement.clientHeight);

            f.style.width = '';
            f.style.height = '';
            G.game.resize();
            assert('and a wide window puts it all back', !doc().body.classList.contains('is-side') &&
                !doc().body.classList.contains('is-turned'));

            section('starting over');

            $('btn-title').click();
            $('title-intro').click();
            st = G.game.getState();
            assert('Replay the intro goes to the first tee of the starter course',
                G.COURSE_ID === G.progress.starter().id && st.holeIndex === 0 && !$('title').classList.contains('show'));
            assert('…with the first stroke shown again', st.coach === true);
            var had = G.progress.totalStars().got;
            assert('…and no star lost to it', had > 0, had + ' stars');
            $('btn-title').click();
            $('title-reset').click();
            assert('one press of Reset only arms it', $('title-reset').classList.contains('armed') &&
                G.progress.totalStars().got === had);
            $('title-reset').click();
            assert('the second wipes every star', G.progress.totalStars().got === 0);
            assert('…locks the ladder again', !G.progress.isOpen(G.COURSES.filter(function (c) { return c.id === 'tide'; })[0]));
            assert('…and leaves the title saying Start here', $('title').classList.contains('show') &&
                /Start here/.test($('title-play').textContent), $('title-play').textContent);

            section('every hole draws');

            /* Every hole of every card, the draw included, in both
               orientations, through the real renderer into a canvas of its
               own. A biome that cannot draw some hole, or a shape a theme
               does not know, would otherwise be found by whoever reached it. */
            var cv = doc().createElement('canvas');
            cv.width = 240; cv.height = 160;
            var g = cv.getContext('2d');
            var broken = [], blank = 0, drawn = 0;
            G.COURSES.forEach(function (c) {
                c.holes.forEach(function (h, i) {
                    [false, true].forEach(function (turned) {
                        g.setTransform(0.25, 0, 0, 0.25, 0, 0);
                        g.clearRect(0, 0, 960, 640);
                        try {
                            G.render.frame(g, {
                                world: G.physics.createWorld(h, h.tee, 0), holeIndex: i, trail: [],
                                aim: { active: false, angle: 0, power: 0 }, theme: G.scenery.themeOf(c).id,
                                sceneKey: 'ui-tests/' + c.id + '/' + i, res: 0.25, turned: turned, ballColor: '#ffffff'
                            }, 1 / 60);
                            drawn++;
                            if (!painted(cv)) blank++;
                        } catch (e) {
                            broken.push(c.id + ' ' + h.name + (turned ? ' (turned)' : '') + ': ' + e.message);
                        }
                    });
                });
            });
            note(drawn + ' frames drawn across ' + G.COURSES.length + ' courses');
            assert('every hole of every course draws, flat and turned', broken.length === 0, broken.slice(0, 2).join(' · '));
            assert('…and none of them comes out blank', blank === 0, blank + ' blank');
            return Promise.resolve();
        }

        saveStore();

        // The page's own markup, fetched rather than inlined so this file can
        // never drift from the one it is testing.
        fetch('index.html')
            .then(function (r) { return r.text(); })
            .then(function (html) { return load(chromeOnly(html)); })
            .then(run)
            .catch(function (e) {
                assert('the suite ran to the end', false, e && e.message);
                done();
            })
            .then(restoreStore, restoreStore);
    })();
    </script>
</body>
</html>
