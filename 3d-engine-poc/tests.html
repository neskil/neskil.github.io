<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yard Master — core tests</title>
    <style>
        body { background: #0f172a; color: #e2e8f0; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 24px; }
        h1 { font-size: 1.1rem; margin: 0 0 4px; }
        #summary { padding: 10px 14px; border-radius: 8px; margin: 12px 0 18px; font-weight: 700; }
        .ok { background: rgba(16,185,129,.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,.4); }
        .bad { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.4); }
        .suite { margin: 0 0 6px; color: #38bdf8; font-weight: 700; }
        .case { padding-left: 18px; color: #94a3b8; }
        .case.fail { color: #fca5a5; }
        .case.pass::before { content: '✓ '; color: #34d399; }
        .case.fail::before { content: '✗ '; }
        .note { color: #64748b; }
    </style>
</head>
<body>
    <h1>Yard Master — core logic tests</h1>
    <p class="note">Pure <code>core/</code> + <code>missions/</code>. No WebGL, no DOM dependency — runs over <code>file://</code>.</p>
    <div id="summary">running…</div>
    <div id="out"></div>

    <script src="core/constants.js"></script>
    <script src="core/grid.js"></script>
    <script src="core/rules.js"></script>
    <script src="core/scoring.js"></script>
    <script src="core/manifest.js"></script>
    <script src="core/contracts.js"></script>
    <script src="core/cascade.js"></script>
    <script src="core/storage.js"></script>
    <script src="missions/missionSchema.js"></script>
    <script src="missions/campaign.js"></script>

    <script>
    (function () {
        'use strict';

        const out = document.getElementById('out');
        let passed = 0, failed = 0;
        const failures = [];

        function suite(name, fn) {
            const h = document.createElement('div');
            h.className = 'suite';
            h.textContent = name;
            out.appendChild(h);
            try {
                fn();
            } catch (e) {
                report(false, name + ' threw: ' + (e && e.message));
            }
        }

        function report(ok, label) {
            const el = document.createElement('div');
            el.className = 'case ' + (ok ? 'pass' : 'fail');
            el.textContent = label;
            out.appendChild(el);
            if (ok) passed++; else { failed++; failures.push(label); }
        }

        function ok(cond, label) { report(!!cond, label); }
        function eq(a, b, label) { report(a === b, label + '  (got ' + a + ', want ' + b + ')'); }
        function near(a, b, tol, label) {
            report(Math.abs(a - b) <= tol, label + '  (got ' + a + ', want ~' + b + ')');
        }

        const C = window.Cargo3D.Constants;
        const Grid = window.Cargo3D.YardGrid;
        const Rules = window.Cargo3D.Rules;
        const Scoring = window.Cargo3D.Scoring;
        const ManifestLib = window.Cargo3D.Manifest;
        const Campaign = window.Cargo3D.Campaign;
        const Schema = window.Cargo3D.MissionSchema;

        function unit(type, extra) {
            return Object.assign({
                uid: 'test-' + type, type: type, carrier: 'maersk',
                traits: [], departure: 0, massT: 10, label: type
            }, extra || {});
        }

        // ── constants ───────────────────────────────────────────────────────
        suite('constants — footprints', function () {
            eq(C.footprint('20ft', 0).length, 2, '20ft covers 2 cells');
            eq(C.footprint('40ft', 0).length, 4, '40ft covers 4 cells');
            eq(C.footprint('crate', 0).length, 4, 'crate covers 4 cells');
            eq(C.span('40ft', 0)[0], 4, '40ft spans 4 in X unrotated');
            eq(C.span('40ft', 1)[1], 4, '40ft spans 4 in Z rotated');
            eq(C.span('crate', 1)[0], 2, 'crate is rotation-symmetric');
            eq(C.cellCount('10ft'), 1, '10ft is one cell');
            eq(C.footprint('flatrack', 0).length, 2, 'flatrack covers 2 cells');
            ok(C.CARGO_TYPES.flatrack.gridPiece === true, 'flatrack is a grid piece');
            ok(C.CARGO_TYPES.tank.noTopLoad === true, 'tanks are flagged noTopLoad');
            ok(C.GRID.CELL_VOLUME > 26 && C.GRID.CELL_VOLUME < 27, 'cell volume is ~27 m³');
        });

        // ── grid ────────────────────────────────────────────────────────────
        suite('grid — placement and gravity', function () {
            const g = new Grid(6, 4, 4);

            ok(g.bounds() === null, 'empty grid has no bounds');
            eq(g.restTier('20ft', 0, 0, 0), 0, 'first unit rests on tier 0');

            const a = g.place(unit('20ft'), 0, 0, 0, 0);
            ok(!!a, '20ft placed at origin');
            eq(g.get(0, 0, 0), a.id, 'cell 0,0,0 holds the placement');
            eq(g.get(1, 0, 0), a.id, 'cell 1,0,0 holds the same placement');
            eq(g.get(2, 0, 0), 0, 'cell 2,0,0 is still empty');
            eq(g.occupiedCells(), 2, 'two cells occupied');

            eq(g.restTier('20ft', 0, 0, 0), 1, 'next unit at the same spot rests on tier 1');
            eq(g.restTier('20ft', 0, 2, 0), 0, 'a clear column still rests on the ground');
            eq(g.restTier('40ft', 0, 0, 0), 1, '40ft overlapping the stack rides up to tier 1');

            ok(g.absCells('40ft', 0, 4, 0) === null, '40ft at x=4 falls off a 6-wide bay');
            ok(g.absCells('40ft', 1, 0, 1) === null, 'rotated 40ft at z=1 runs off the back of the bay');

            const b = g.place(unit('10ft'), 0, 0, 1, 0);
            ok(!!b, '10ft stacked on tier 1');
            ok(g.isBuried(a.id), 'the 20ft below is buried');
            ok(!g.isBuried(b.id), 'the top unit is not buried');

            const removed = g.removeById(b.id);
            ok(!!removed, 'placement removed');
            ok(!g.isBuried(a.id), 'no longer buried after removal');
            eq(g.occupiedCells(), 2, 'cells freed on removal');
        });

        suite('grid — support, neighbours, perimeter', function () {
            const g = new Grid(5, 3, 3);
            g.place(unit('20ft'), 0, 0, 0, 0);            // covers (0,0) (1,0)

            const full = g.supportInfo(g.absCells('20ft', 0, 0, 0), 1);
            near(full.ratio, 1, 1e-9, 'fully supported on top of the 20ft');

            const half = g.supportInfo(g.absCells('20ft', 0, 1, 0), 1);
            near(half.ratio, 0.5, 1e-9, 'half overhang gives 0.5 support');

            const none = g.supportInfo(g.absCells('20ft', 0, 3, 0), 1);
            near(none.ratio, 0, 1e-9, 'floating in mid-air gives 0 support');

            const ground = g.supportInfo(g.absCells('20ft', 0, 3, 0), 0);
            near(ground.ratio, 1, 1e-9, 'the ground supports everything');

            const nb = g.neighboursAt(g.absCells('10ft', 0, 2, 0), 0);
            eq(nb.length, 1, 'a 10ft beside the 20ft has one neighbour');

            ok(g.touchesPerimeter(g.absCells('10ft', 0, 0, 0)), 'corner cell is on the perimeter');
            ok(!g.touchesPerimeter(g.absCells('10ft', 0, 2, 1)), 'the middle cell of a 5×3 bay is interior');

            const under = g.idsUnder(g.absCells('20ft', 0, 0, 0), 2);
            eq(under.length, 1, 'the column below reports the buried unit');
        });

        suite('grid — bounds', function () {
            const g = new Grid(8, 6, 4);
            g.place(unit('10ft'), 0, 0, 0, 0);
            g.place(unit('10ft'), 3, 2, 0, 0);

            const b = g.bounds();
            eq(b.spanX, 4, 'bounds span 4 cells in X');
            eq(b.spanZ, 3, 'bounds span 3 cells in Z');
            eq(b.spanTiers, 1, 'bounds span one tier');

            g.place(unit('10ft'), 3, 2, 1, 0);
            eq(g.bounds().spanTiers, 2, 'stacking grows the tier span');
        });

        // ── rules ───────────────────────────────────────────────────────────
        suite('rules — parsing', function () {
            const p = Rules.parseRule('maxTier:3');
            eq(p.rule.id, 'maxTier', 'parses the rule id');
            eq(p.param, 3, 'parses the parameter');
            eq(Rules.parseRule('support').param, 1, 'falls back to the default parameter');
            ok(Rules.parseRule('nonsense') === null, 'unknown rules resolve to null');
            eq(Rules.describeRules(['support:1', 'maxTier:2']).length, 2, 'describes each rule for the briefing');
        });

        suite('rules — support and reach', function () {
            const g = new Grid(6, 3, 4);
            g.place(unit('20ft'), 0, 0, 0, 0);

            const overhang = Rules.validate(g, unit('20ft'), { x: 1, z: 0, tier: 1, rot: 0 }, ['support:1']);
            ok(!overhang.ok, 'full-support rule rejects a half overhang');

            const lenient = Rules.validate(g, unit('20ft'), { x: 1, z: 0, tier: 1, rot: 0 }, ['support:0.5']);
            ok(lenient.ok, 'a 50% support rule allows the same overhang');

            const stacked = Rules.validate(g, unit('20ft'), { x: 0, z: 0, tier: 1, rot: 0 }, ['support:1']);
            ok(stacked.ok, 'a squarely stacked unit is legal');

            const tooHigh = Rules.validate(g, unit('20ft'), { x: 0, z: 0, tier: 2, rot: 0 }, ['maxTier:2']);
            ok(!tooHigh.ok, 'maxTier:2 rejects tier index 2');

            const offBay = Rules.validate(g, unit('40ft'), { x: 4, z: 0, tier: 0, rot: 0 }, []);
            ok(!offBay.ok && offBay.violations[0].id === 'fit', 'off-bay placements fail the fit check');

            const occupied = Rules.validate(g, unit('10ft'), { x: 0, z: 0, tier: 0, rot: 0 }, []);
            ok(!occupied.ok, 'an occupied slot is rejected');
        });

        suite('rules — cargo regulations', function () {
            const g = new Grid(6, 4, 4);

            // noTopLoad
            g.place(unit('tank'), 0, 0, 0, 0);
            ok(!Rules.validate(g, unit('20ft'), { x: 0, z: 0, tier: 1, rot: 0 }, ['noTopLoad']).ok,
                'nothing stacks on a tank');
            ok(Rules.validate(g, unit('20ft'), { x: 0, z: 0, tier: 1, rot: 0 }, []).ok,
                'without the rule the same placement is fine');

            // heavyBelow
            const g2 = new Grid(6, 4, 4);
            g2.place(unit('20ft', { massT: 8 }), 0, 0, 0, 0);
            ok(!Rules.validate(g2, unit('20ft', { massT: 25 }), { x: 0, z: 0, tier: 1, rot: 0 }, ['heavyBelow']).ok,
                'a heavy unit may not sit on a light one');
            ok(Rules.validate(g2, unit('20ft', { massT: 4 }), { x: 0, z: 0, tier: 1, rot: 0 }, ['heavyBelow']).ok,
                'a lighter unit on top is fine');

            // hazmatGap
            const g3 = new Grid(6, 4, 4);
            g3.place(unit('20ft', { traits: ['hazmat'] }), 0, 0, 0, 0);
            ok(!Rules.validate(g3, unit('20ft', { traits: ['hazmat'] }), { x: 2, z: 0, tier: 0, rot: 0 }, ['hazmatGap']).ok,
                'hazmat may not touch hazmat side by side');
            ok(Rules.validate(g3, unit('20ft', { traits: ['hazmat'] }), { x: 3, z: 0, tier: 0, rot: 0 }, ['hazmatGap']).ok,
                'a one-slot gap satisfies the separation');
            ok(Rules.validate(g3, unit('20ft', { traits: ['hazmat'] }), { x: 0, z: 0, tier: 1, rot: 0 }, ['hazmatGap']).ok,
                'hazmat may stack vertically');
            ok(Rules.validate(g3, unit('20ft'), { x: 2, z: 0, tier: 0, rot: 0 }, ['hazmatGap']).ok,
                'non-hazmat is unaffected by the rule');

            // reeferEdge
            const g4 = new Grid(5, 5, 3);
            ok(Rules.validate(g4, unit('10ft', { traits: ['reefer'] }), { x: 0, z: 2, tier: 0, rot: 0 }, ['reeferEdge']).ok,
                'a reefer on the bay edge finds power');
            ok(!Rules.validate(g4, unit('10ft', { traits: ['reefer'] }), { x: 2, z: 2, tier: 0, rot: 0 }, ['reeferEdge']).ok,
                'a reefer in the middle has no power point');

            // departureOrder
            const g5 = new Grid(6, 4, 4);
            g5.place(unit('20ft', { departure: 1 }), 0, 0, 0, 0);
            ok(!Rules.validate(g5, unit('20ft', { departure: 3 }), { x: 0, z: 0, tier: 1, rot: 0 }, ['departureOrder']).ok,
                'a late departure may not bury an early one');
            ok(Rules.validate(g5, unit('20ft', { departure: 1 }), { x: 0, z: 0, tier: 1, rot: 0 }, ['departureOrder']).ok,
                'same-day cargo may stack');
            g5.place(unit('20ft', { departure: 3 }), 2, 0, 0, 0);
            ok(Rules.validate(g5, unit('20ft', { departure: 1 }), { x: 2, z: 0, tier: 1, rot: 0 }, ['departureOrder']).ok,
                'an early departure may sit on top of a late one');
        });

        suite('rules — dead-end detection', function () {
            const g = new Grid(2, 1, 1);
            ok(Rules.hasLegalPlacement(g, unit('20ft'), ['support:1']), 'an empty bay accepts the unit');
            g.place(unit('20ft'), 0, 0, 0, 0);
            ok(!Rules.hasLegalPlacement(g, unit('20ft'), ['support:1']), 'a full single-tier bay is a dead end');
        });

        // ── scoring ─────────────────────────────────────────────────────────
        suite('scoring — envelope', function () {
            const cell = C.GRID.CELL_VOLUME;
            const g = new Grid(6, 4, 4);

            eq(Scoring.measure(g).envelope, 0, 'an empty yard has no envelope');

            g.place(unit('20ft'), 0, 0, 0, 0);
            near(Scoring.measure(g).envelope, 2 * cell, 1e-6, 'a lone 20ft measures two cells');

            g.place(unit('20ft'), 2, 0, 0, 0);
            near(Scoring.measure(g).envelope, 4 * cell, 1e-6, 'two abutting 20ft measure four cells');

            const tidy = Scoring.measure(g);
            near(tidy.slotEfficiency, 1, 1e-9, 'a solid row is 100% slot-efficient');

            // A unit parked away from the pile inflates the envelope on every tier.
            const sprawl = new Grid(6, 4, 4);
            sprawl.place(unit('10ft'), 0, 0, 0, 0);
            sprawl.place(unit('10ft'), 5, 3, 0, 0);
            near(Scoring.measure(sprawl).envelope, 6 * 4 * 1 * cell, 1e-6, 'opposite corners cost the whole floor');

            const tall = new Grid(6, 4, 4);
            tall.place(unit('10ft'), 0, 0, 0, 0);
            tall.place(unit('10ft'), 0, 0, 1, 0);
            near(Scoring.measure(tall).envelope, 2 * cell, 1e-6, 'stacking two 10ft measures two cells');
        });

        suite('scoring — par and medals', function () {
            const cell = C.GRID.CELL_VOLUME;
            const units = [unit('40ft'), unit('20ft'), unit('10ft')];
            near(Scoring.parFor(units), 7 * cell, 1e-6, 'par is the perfect-pack cell volume');
            eq(Scoring.cellsFor(units), 7, 'cell count matches the manifest');

            const par = 100;
            eq(Scoring.medalFor(100, par), 'gold', 'hitting par is gold');
            eq(Scoring.medalFor(109, par), 'gold', 'within 10% of par is gold');
            eq(Scoring.medalFor(125, par), 'silver', 'within 30% is silver');
            eq(Scoring.medalFor(150, par), 'bronze', 'within 60% is bronze');
            ok(Scoring.medalFor(200, par) === null, 'well over par earns nothing');
            eq(Scoring.medalFor(112, par, { gold: 1.15 }), 'gold', 'missions can loosen the gold threshold');
            near(Scoring.targetFor(100, null, 'gold'), 110, 1e-9, 'gold target is par × 1.10');
        });

        suite('scoring — mission result', function () {
            const mission = Campaign.byId('m01');
            const units = ManifestLib.build(mission);
            const g = new Grid(mission.bay.cols, mission.bay.rows, mission.bay.tiers);

            const partial = Scoring.buildResult(g, mission, units, null);
            ok(!partial.complete, 'an untouched bay is not complete');
            ok(partial.medal === null, 'an incomplete run earns no medal');

            // Fill the 4×3 floor exactly: four 20ft in two rows, four 10ft in the third.
            // The manifest arrives shuffled, so pick by type rather than by index.
            const twenties = units.filter(function (u) { return u.type === '20ft'; });
            const tens = units.filter(function (u) { return u.type === '10ft'; });
            [[0, 0], [2, 0], [0, 1], [2, 1]].forEach(function (at, i) {
                g.place(twenties[i], at[0], at[1], 0, 0);
            });
            [[0, 2], [1, 2], [2, 2], [3, 2]].forEach(function (at, i) {
                g.place(tens[i], at[0], at[1], 0, 0);
            });

            const perfect = Scoring.buildResult(g, mission, units, null);
            ok(perfect.complete, 'every unit placed completes the mission');
            near(perfect.ratio, 1, 1e-9, 'a zero-waste pack lands exactly on par');
            eq(perfect.medal, 'gold', 'par earns gold');
        });

        suite('scoring — sprawl mode runs the ladder backwards', function () {
            const cell = C.GRID.CELL_VOLUME;
            const bay = { cols: 6, rows: 4, tiers: 2 };

            near(Scoring.bayVolume(bay), 48 * cell, 1e-6, 'bay volume is cols × rows × tiers of cells');

            const mission = { bay: bay, scoreMode: 'sprawl', medals: { gold: 0.90, silver: 0.65, bronze: 0.40 } };
            const units = [{ type: '20ft' }, { type: '20ft' }, { type: '20ft' }];
            const target = Scoring.scoreTarget(mission, units);
            near(target, Scoring.bayVolume(bay), 1e-6, 'sprawl scores against the bay, not a zero-waste pack');

            eq(Scoring.medalFor(target * 0.95, target, mission.medals, 'sprawl'), 'gold', 'filling nearly the whole bay is gold');
            eq(Scoring.medalFor(target * 0.70, target, mission.medals, 'sprawl'), 'silver', 'a smaller share is silver');
            eq(Scoring.medalFor(target * 0.50, target, mission.medals, 'sprawl'), 'bronze', 'a smaller share still is bronze');
            ok(Scoring.medalFor(target * 0.10, target, mission.medals, 'sprawl') === null, 'a bunched-up envelope earns nothing');
            ok(Scoring.medalFor(target * 0.95, target, mission.medals) === null, 'omitting the mode reads it as pack, which this is not');

            // Show Bay itself: two units spread to opposite corners of the floor,
            // the third stacked directly on top of one of them.
            const showBay = Campaign.byId('m17');
            const grid = new Grid(showBay.bay.cols, showBay.bay.rows, showBay.bay.tiers);
            const three = ManifestLib.build(showBay);

            grid.place(three[0], 0, 0, 0, 0);
            grid.place(three[1], 4, 3, 0, 0);
            grid.place(three[2], 0, 0, 1, 0);

            const spread = Scoring.buildResult(grid, showBay, three, null);
            ok(spread.complete, 'three units finish the manifest');
            near(spread.envelope, Scoring.bayVolume(showBay.bay), 1e-6, 'two corners plus a roof claim the whole bay');
            eq(spread.medal, 'gold', 'claiming the whole bay is gold');

            const bunched = new Grid(showBay.bay.cols, showBay.bay.rows, showBay.bay.tiers);
            bunched.place(three[0], 0, 0, 0, 0);
            bunched.place(three[1], 2, 0, 0, 0);
            bunched.place(three[2], 4, 0, 0, 0);
            const packed = Scoring.buildResult(bunched, showBay, three, null);
            ok(packed.medal === null, 'the same three boxes in a tidy row earn nothing under sprawl scoring');
        });

        // ── manifest ────────────────────────────────────────────────────────
        suite('manifest — determinism', function () {
            const mission = Campaign.byId('m07');
            const a = ManifestLib.build(mission);
            const b = ManifestLib.build(mission);
            eq(JSON.stringify(a), JSON.stringify(b), 'the same seed rebuilds the same manifest');

            const c = ManifestLib.build(mission, 424242);
            ok(JSON.stringify(a) !== JSON.stringify(c), 'a different seed gives a different manifest');
            eq(a.length, c.length, 'the unit count is seed-independent');

            const rand = ManifestLib.rng(7);
            const first = [rand(), rand(), rand()];
            const rand2 = ManifestLib.rng(7);
            eq(JSON.stringify(first), JSON.stringify([rand2(), rand2(), rand2()]), 'the PRNG is reproducible');

            const summary = ManifestLib.summarise(a);
            eq(summary.total, a.length, 'the summary counts every unit');
            eq(summary.traits.reefer, 3, 'm07 ships three reefers');
        });

        suite('manifest — unit records', function () {
            const units = ManifestLib.build(Campaign.byId('m05'));
            units.forEach(function (u) {
                if (u.massT <= 0) ok(false, 'unit ' + u.uid + ' has a mass');
            });
            ok(true, 'every unit has a positive mass');

            const heavy = units.filter(function (u) { return u.type === '40ft'; })[0];
            const light = units.filter(function (u) { return u.type === '10ft'; })[0];
            ok(heavy.massT > light.massT, 'loaded 40ft outweighs a light 10ft');
        });

        // ── campaign ────────────────────────────────────────────────────────
        suite('campaign — schema', function () {
            const problems = Schema.validateCampaign(Campaign.MISSIONS);
            problems.forEach(function (p) { report(false, p); });
            ok(problems.length === 0, 'every mission validates (' + Campaign.MISSIONS.length + ' missions)');

            eq(Campaign.byId('m01').id, 'm01', 'missions are addressable by id');
            eq(Campaign.nextAfter('m01').id, 'm02', 'the chain links forward');
            // Derived, not hardcoded: this assertion broke silently the last
            // time a mission was appended to the campaign.
            const lastId = Campaign.MISSIONS[Campaign.MISSIONS.length - 1].id;
            ok(Campaign.nextAfter(lastId) === null, 'the last mission ends the chain (' + lastId + ')');
        });

        suite('campaign — par is geometrically reachable', function () {
            // Par assumes a zero-waste pack. That is only honest if the manifest's
            // cell count actually factors into a box the bay can hold.
            Campaign.MISSIONS.forEach(function (mission) {
                const units = ManifestLib.build(mission);
                const cells = Scoring.cellsFor(units);

                let tiers = mission.bay.tiers;
                (mission.rules || []).forEach(function (spec) {
                    const parsed = Rules.parseRule(spec);
                    if (parsed && parsed.rule.id === 'maxTier') tiers = Math.min(tiers, parsed.param);
                });

                let fits = false;
                for (let a = 1; a <= mission.bay.cols && !fits; a++) {
                    for (let b = 1; b <= mission.bay.rows && !fits; b++) {
                        for (let c = 1; c <= tiers && !fits; c++) {
                            if (a * b * c === cells) fits = true;
                        }
                    }
                }
                report(fits, mission.id + ' — ' + cells + ' cells factor into a box inside ' +
                    mission.bay.cols + '×' + mission.bay.rows + '×' + tiers);
            });
        });

        suite('campaign — every mission needs its full height', function () {
            // If the floor alone holds the manifest there is no reason to stack,
            // which makes the mid-campaign lessons meaningless. Tutorials are
            // exempt, and so is a sprawl mission — its whole point is a manifest
            // with room to spare, not one that forces stacking through scarcity.
            Campaign.MISSIONS.slice(2).forEach(function (mission) {
                if (mission.scoreMode === 'sprawl') return;
                const cells = Scoring.cellsFor(ManifestLib.build(mission));
                const floor = mission.bay.cols * mission.bay.rows;
                report(cells > floor, mission.id + ' — ' + cells + ' cells exceed the ' + floor + '-slot floor');
            });
        });

        suite('grid — ground lost to a collapse', function () {
            const g = new Grid(6, 4, 4);

            ok(!g.isBlocked(2, 1), 'a fresh bay has all its ground');
            eq(g.blockedCount(), 0, 'and nothing blocked');

            eq(g.blockCells([[2, 1], [3, 1]]), 2, 'a collapse takes two squares');
            eq(g.blockCells([[3, 1], [4, 1]]), 1, 'and only new ground counts the second time');
            ok(g.isBlocked(2, 1), 'the square is out of play');
            eq(g.blockedCount(), 3, 'three squares lost in total');

            // Blocked ground reads exactly like being off the bay: no tier.
            ok(g.restTier('10ft', 0, 2, 1) === null, 'nothing rests on wreckage');
            ok(g.place(unit('10ft'), 2, 1, 0, 0) === null, 'and nothing can be placed on it');

            ok(g.restTier('10ft', 0, 0, 0) === 0, 'clear ground still takes a unit');
            ok(g.place(unit('10ft'), 0, 0, 0, 0) !== null, 'and accepts it');

            // A 20ft spans two cells: one blocked cell is enough to refuse it.
            ok(g.restTier('20ft', 0, 1, 1) === null, 'a footprint touching wreckage has no tier');

            eq(g.blockedCells().length, 3, 'the renderer can enumerate them');
            g.clear();
            eq(g.blockedCount(), 0, 'and a cleared bay gets its ground back');
        });

        suite('rules — physics is declared, not decided here', function () {
            // The verdict needs a rigid-body solver, which needs THREE, which
            // core/ may never touch. The entry exists so the UI can describe it.
            const parsed = Cargo3D.Rules.parseRule('physics');
            ok(parsed !== null, 'physics parses as a rule');
            eq(parsed.rule.id, 'physics', 'with its own id');
            ok(parsed.rule.describe(1).length > 10, 'and a briefing line');

            const g = new Grid(4, 4, 3);
            g.place(unit('10ft'), 0, 0, 0, 0);

            // A wildly unsupported placement is legal as far as core/ is
            // concerned — that is the whole point of the rule.
            const check = Rules.validate(g, unit('10ft'), { x: 3, z: 3, tier: 0, rot: 0 }, ['physics']);
            ok(check.ok, 'core/ passes what the simulation will judge later');
        });

        // ── storage ─────────────────────────────────────────────────────────
        suite('storage — progress', function () {
            Cargo3D.Storage.resetProgress();

            const mission = Campaign.byId('m01');
            ok(Cargo3D.Storage.isUnlocked(Campaign.MISSIONS, 'm01'), 'the first mission is always open');
            ok(!Cargo3D.Storage.isUnlocked(Campaign.MISSIONS, 'm02'), 'later missions start locked');

            const first = Cargo3D.Storage.recordResult({
                missionId: 'm01', complete: true, placed: 8, envelope: 400, par: 380, medal: 'gold'
            });
            ok(first.improved, 'a first completion is an improvement');
            ok(Cargo3D.Storage.isUnlocked(Campaign.MISSIONS, 'm02'), 'completing m01 unlocks m02');

            const worse = Cargo3D.Storage.recordResult({
                missionId: 'm01', complete: true, placed: 8, envelope: 500, par: 380, medal: 'silver'
            });
            ok(!worse.improved, 'a worse run is not an improvement');
            eq(Cargo3D.Storage.missionRecord('m01').best, 400, 'the best envelope is kept');
            eq(Cargo3D.Storage.missionRecord('m01').medal, 'gold', 'the best medal is kept');
            eq(Cargo3D.Storage.missionRecord('m01').plays, 2, 'plays are counted');

            const better = Cargo3D.Storage.recordResult({
                missionId: 'm01', complete: true, placed: 8, envelope: 350, par: 380, medal: 'gold'
            });
            ok(better.improved, 'a tighter pack is an improvement');
            eq(better.previousBest, 400, 'the previous best is reported back');

            const s = Cargo3D.Storage.summary(Campaign.MISSIONS);
            eq(s.gold, 1, 'the summary counts gold medals');
            eq(s.completed, 1, 'the summary counts completed missions');

            Cargo3D.Storage.resetProgress();
            ok(Cargo3D.Storage.missionRecord('m01') === null, 'reset clears progress');
            ok(mission !== null, 'campaign is still intact after a reset');
        });

        suite('storage — physics tower records', function () {
            Cargo3D.Storage.resetProgress();

            const blank = Cargo3D.Storage.getPhysics();
            eq(blank.bestHeight, 0, 'a fresh save has no tower on the board');
            eq(blank.runs, 0, 'a fresh save has no attempts');

            const first = Cargo3D.Storage.recordTower({ height: 14.2, units: 6 });
            ok(first.improved, 'a first tower is an improvement');
            eq(first.previousBest, 0, 'with no previous best to beat');
            eq(first.best.bestHeight, 14.2, 'the height is kept');
            eq(first.best.runs, 1, 'the attempt is counted');

            const worse = Cargo3D.Storage.recordTower({ height: 9.1, units: 4 });
            ok(!worse.improved, 'a shorter tower is not an improvement');
            eq(worse.best.bestHeight, 14.2, 'the taller tower is kept');
            eq(worse.best.bestUnits, 6, 'and so is its container count');
            eq(worse.best.runs, 2, 'but the attempt still counts');

            const better = Cargo3D.Storage.recordTower({ height: 20.7, units: 8 });
            ok(better.improved, 'a taller tower is an improvement');
            eq(better.previousBest, 14.2, 'the previous best is reported back');

            Cargo3D.Storage.resetProgress();
            eq(Cargo3D.Storage.getPhysics().bestHeight, 0, 'reset clears the tower record');
        });

        suite('storage — schema stays backwards compatible', function () {
            // A save written before the physics mode existed has no `physics`
            // key. It must still read at version 1 rather than being discarded,
            // because the portfolio card reads the same key.
            Cargo3D.Storage.write({
                version: Cargo3D.Storage.SAVE_VERSION,
                missions: { m01: { plays: 3, best: 410, medal: 'silver', completed: true } },
                settings: { muted: true, weather: 'dusk' },
                stats: { unitsPlaced: 42, missionsRun: 3 },
                contracts: null
            });

            const data = Cargo3D.Storage.read();
            eq(data.missions.m01.best, 410, 'an old save keeps its mission records');
            eq(data.settings.weather, 'dusk', 'and its settings');
            eq(data.stats.unitsPlaced, 42, 'and its stats');
            eq(data.physics.bestHeight, 0, 'and gains a blank physics record');
            eq(Cargo3D.Storage.getPhysics().runs, 0, 'readable through the accessor');

            Cargo3D.Storage.resetProgress();
        });

        // ── contracts ───────────────────────────────────────────────────────
        const Contracts = window.Cargo3D.Contracts;

        suite('contracts — issuing orders', function () {
            const state = Contracts.createState();
            eq(state.money, 15000, 'the yard starts with its working capital');
            eq(state.rating, 100, 'reputation starts perfect');
            ok(state.active === null, 'no order is active until one is generated');

            const first = Contracts.generate(state, function () { return 0; });
            eq(first.type, 'unload_train', 'a 0 roll picks the first template');
            eq(state.active, first, 'the generated order becomes the active one');
            eq(first.timeRemaining, Contracts.CONTRACT_SECONDS, 'the clock starts full');

            const last = Contracts.generate(state, function () { return 0.999; });
            eq(last.type, 'express_delivery', 'a 1 roll picks the last template');
            ok(first.id !== last.id, 'each order gets its own id');
        });

        suite('contracts — delivery zones', function () {
            const state = Contracts.createState();
            const contract = Contracts.generate(state, function () { return 0.5; }); // central depot

            ok(Contracts.inZone(0, 0, contract), 'the depot centre is inside the zone');
            ok(!Contracts.inZone(25, 0, contract), 'the truck deck is outside the depot zone');
            ok(!Contracts.inZone(0, 40, contract), 'far down the rail is outside the zone');
            ok(!Contracts.inZone(0, 0, null), 'no contract means nothing is in zone');
        });

        suite('contracts — payout and expiry', function () {
            const state = Contracts.createState();
            Contracts.generate(state, function () { return 0.5; });
            const payout = state.active.payout;

            ok(Contracts.tryComplete(state, 25, 0) === null, 'cargo outside the zone pays nothing');
            eq(state.money, 15000, 'a miss leaves capital untouched');

            const done = Contracts.tryComplete(state, 0, 0);
            ok(done && done.type === 'completed', 'cargo in the zone completes the order');
            eq(state.money, 15000 + payout, 'the payout lands');
            eq(state.delivered, 1, 'the delivery is counted');
            ok(state.active && state.active.payout !== undefined, 'a fresh order is issued straight away');

            const before = state.money;
            state.active.timeRemaining = 4;
            ok(Contracts.tick(state, 1) === null, 'the clock ticking down is not an event');
            near(state.active.timeRemaining, 3, 1e-9, 'time is deducted');

            const expiry = Contracts.tick(state, 10);
            ok(expiry && expiry.type === 'expired', 'running out of time expires the order');
            eq(state.money, before - Contracts.EXPIRY_PENALTY, 'the penalty is charged');
            // The earlier delivery bonus was capped at 100, so expiry takes it to 95.
            eq(state.rating, 95, 'reputation drops five points on expiry');
            ok(state.active !== null, 'a replacement order is issued');
        });

        suite('contracts — rating floor and ceiling', function () {
            const state = Contracts.createState({ rating: 51 });
            Contracts.generate(state, function () { return 0; });
            state.active.timeRemaining = 0;
            Contracts.tick(state, 1);
            eq(state.rating, 50, 'reputation bottoms out at 50');

            const good = Contracts.createState({ rating: 99 });
            Contracts.generate(good, function () { return 0.5; });
            Contracts.tryComplete(good, 0, 0);
            eq(good.rating, 100, 'reputation cannot exceed 100');

            const broke = Contracts.createState({ money: 500 });
            Contracts.generate(broke, function () { return 0; });
            broke.active.timeRemaining = 0;
            Contracts.tick(broke, 1);
            eq(broke.money, 0, 'capital cannot go negative');
        });

        suite('contracts — upgrades', function () {
            const state = Contracts.createState();
            const cost = Contracts.UPGRADES.fastWinch.cost;

            const bought = Contracts.buyUpgrade(state, 'fastWinch');
            ok(bought.ok, 'an affordable upgrade is bought');
            eq(state.money, 15000 - cost, 'the cost is deducted');
            ok(state.upgrades.fastWinch, 'ownership is recorded');

            const again = Contracts.buyUpgrade(state, 'fastWinch');
            ok(!again.ok, 'the same upgrade cannot be bought twice');
            eq(state.money, 15000 - cost, 'a refused purchase costs nothing');

            ok(!Contracts.buyUpgrade(state, 'nonsense').ok, 'unknown upgrades are refused');

            const poor = Contracts.createState({ money: 10 });
            ok(!Contracts.buyUpgrade(poor, 'autoDispatch').ok, 'an unaffordable upgrade is refused');

            const dispatcher = Contracts.createState();
            Contracts.buyUpgrade(dispatcher, 'autoDispatch');
            eq(Contracts.contractDuration(dispatcher), Contracts.CONTRACT_SECONDS + 30,
                'auto dispatch lengthens the clock');
            eq(Contracts.generate(dispatcher, function () { return 0; }).timeRemaining,
                Contracts.CONTRACT_SECONDS + 30, 'new orders get the longer clock');
        });

        suite('contracts — persistence', function () {
            Cargo3D.Storage.resetProgress();
            ok(Cargo3D.Storage.getContracts() === null, 'no economy is stored on a fresh save');

            const state = Contracts.createState();
            Contracts.buyUpgrade(state, 'extendedSnap');
            state.delivered = 3;
            Cargo3D.Storage.saveContracts(state);

            const loaded = Cargo3D.Storage.getContracts();
            eq(loaded.money, state.money, 'capital survives a save');
            eq(loaded.delivered, 3, 'deliveries survive a save');
            ok(loaded.upgrades.extendedSnap, 'upgrades survive a save');

            const resumed = Contracts.createState(loaded);
            eq(resumed.money, state.money, 'a saved economy can be resumed');
            ok(resumed.active === null || resumed.active === undefined, 'the active order is not resumed');

            Cargo3D.Storage.resetProgress();
        });

        suite('contracts — rating labels', function () {
            eq(Contracts.ratingLabel(100), 'A+', '100% is A+');
            eq(Contracts.ratingLabel(92), 'A', '92% is A');
            eq(Contracts.ratingLabel(50), 'E', 'the floor is E');
        });

        // ── cascade ─────────────────────────────────────────────────────────

        const Cascade = window.Cargo3D.Cascade;

        /** A small bay keeps a tier fillable inside a test. */
        function cascade(opts) {
            return new Cascade.Game(Object.assign({
                bay: { cols: 4, rows: 4, tiers: 6 }, seed: 42
            }, opts || {}));
        }

        /** Take the queue out of the equation — the piece is plain data. */
        function forcePiece(game, type, x, z, tier) {
            game.piece = {
                unit: unit(type, { uid: 'forced-' + type + x + z + tier }),
                type: type, rot: 0, x: x, z: z, tier: tier
            };
            game.fallAccum = 0;
            game.lockAccum = 0;
            game.lockResets = 0;
            return game.piece;
        }

        /**
         * Play `seconds` of game time at a plausible frame length. Handing tick()
         * one huge delta is not the same test: the lock grace is shorter than a
         * fall step, so a single second-long frame both lands a piece and locks it.
         */
        function tickFor(game, seconds, dt) {
            const step = dt || 1 / 60;
            const frames = Math.round(seconds / step);
            let events = [];
            for (let i = 0; i < frames; i++) events = events.concat(game.tick(step));
            return events;
        }

        /** Fill a tier with 1×1 boxes, optionally leaving one cell open. */
        function fillTier(game, tier, holeX, holeZ) {
            for (let x = 0; x < game.bay.cols; x++) {
                for (let z = 0; z < game.bay.rows; z++) {
                    if (x === holeX && z === holeZ) continue;
                    game.grid.place(unit('10ft', { uid: 'fill-' + tier + x + z }), x, z, tier, 0);
                }
            }
        }

        suite('cascade — the falling piece', function () {
            const game = cascade();

            ok(!!game.piece, 'a run starts with a piece in the air');
            eq(game.piece.tier, game.bay.tiers - 1, 'it starts at the top tier');
            eq(game.over, false, 'a fresh run is not over');
            eq(game.queue.length, Cascade.PREVIEW, 'the preview queue is kept full');

            const sp = C.span(game.piece.type, game.piece.rot);
            ok(game.piece.x >= 0 && game.piece.x + sp[0] <= game.bay.cols, 'it spawns inside the bay in X');
            ok(game.piece.z >= 0 && game.piece.z + sp[1] <= game.bay.rows, 'it spawns inside the bay in Z');

            ok(game.canFall(), 'an empty bay lets it fall');
            eq(game.landingTier(), 0, 'with nothing below, it lands on the floor');
        });

        suite('cascade — the same seed plays the same run', function () {
            const a = cascade({ seed: 1234 });
            const b = cascade({ seed: 1234 });
            const c = cascade({ seed: 9999 });

            const typesOf = function (g) {
                return [g.piece.type].concat(g.queue.map(function (u) { return u.type; })).join(',');
            };
            // Long enough that two seeds agreeing by luck is not a thing that
            // happens: twenty units of type and livery each.
            const runOf = function (g) {
                const out = [];
                for (let i = 0; i < 20; i++) {
                    const u = g.makeUnit();
                    out.push(u.type + ':' + u.carrier);
                }
                return out.join(',');
            };

            eq(typesOf(a), typesOf(b), 'two games on one seed deal the same cargo');
            ok(runOf(a) !== runOf(c), 'a different seed deals a different run');

            a.reset();
            eq(typesOf(a), typesOf(b), 'a reset replays the same seeded run');
        });

        suite('cascade — steering', function () {
            const game = cascade();
            forcePiece(game, '10ft', 1, 1, 3);

            ok(game.moveBy(1, 0), 'a clear cell accepts the piece');
            eq(game.piece.x, 2, 'the origin moved');

            ok(game.moveTo(1, 1), 'moveTo reports a real move');
            eq(game.piece.x + ',' + game.piece.z, '1,1', 'moveTo lands where it was asked');

            ok(game.moveBy(-4, 0), 'an aim off the west edge slides along the wall');
            eq(game.piece.x, 0, 'and stops at the first column');
            ok(!game.moveBy(-1, 0), 'a piece already against the wall does not move');

            // A neighbour on the same tier blocks the slide into its cell.
            game.grid.place(unit('10ft', { uid: 'wall' }), 1, 0, 3, 0);
            forcePiece(game, '10ft', 0, 0, 3);
            ok(!game.moveBy(1, 0), 'an occupied cell refuses the slide');
            eq(game.piece.x, 0, 'and the piece has not moved');
        });

        suite('cascade — rotation', function () {
            const game = cascade();
            forcePiece(game, '20ft', 0, 0, 3);

            eq(C.span('20ft', 0)[0], 2, 'a 20ft is two cells long unrotated');
            ok(game.rotate(), 'a clear tier accepts the turn');
            eq(game.piece.rot, 1, 'the rotation is recorded');
            eq(C.span('20ft', game.piece.rot)[0], 1, 'the footprint swapped axes');

            // A 40ft is four cells long: in a four-wide bay it fits both ways,
            // and the kick list slides it back inside when it would overhang.
            const wide = cascade();
            forcePiece(wide, '40ft', 0, 3, 3);
            ok(wide.rotate(), 'a 40ft turns when the bay is square');
            eq(wide.piece.z, 0, 'the kick pulled it back inside the bay');

            const narrow = new Cascade.Game({ bay: { cols: 4, rows: 2, tiers: 4 }, seed: 3 });
            forcePiece(narrow, '40ft', 0, 0, 2);
            ok(!narrow.rotate(), 'a 40ft cannot turn into a bay only two deep');
        });

        suite('cascade — gravity and the lock delay', function () {
            const game = cascade();
            forcePiece(game, '10ft', 0, 0, 3);

            const step = game.fallInterval();
            eq(tickFor(game, step * 0.4).length, 0, 'a part-step does nothing');
            eq(game.piece.tier, 3, 'and leaves the piece where it was');
            near(game.fallProgress(), 0.4, 0.05, 'the fall progress reads the part-step');

            tickFor(game, step * 0.7);
            eq(game.piece.tier, 2, 'a full step drops it one tier');

            tickFor(game, step * 2.0);
            eq(game.piece.tier, 0, 'it keeps falling to the floor');
            ok(!game.canFall(), 'the floor stops it');
            eq(game.fallProgress(), 0, 'a grounded piece has no fall progress');

            eq(tickFor(game, Cascade.LOCK_DELAY * 0.4).length, 0, 'the grace period holds it unlocked');
            const events = tickFor(game, Cascade.LOCK_DELAY);
            ok(events.some(function (e) { return e.type === 'lock'; }), 'the grace runs out and it locks');
            eq(game.grid.count(), 1, 'the container is in the yard');
            ok(!!game.piece, 'and the next one is already falling');
        });

        suite('cascade — hard drop', function () {
            const game = cascade();
            game.grid.place(unit('10ft', { uid: 'floor' }), 2, 2, 0, 0);
            forcePiece(game, '10ft', 2, 2, 5);

            const before = game.score;
            const events = game.hardDrop();
            ok(events.some(function (e) { return e.type === 'lock'; }), 'a hard drop locks immediately');
            ok(game.score > before, 'and pays for the tiers given up');

            const placed = game.grid.list().filter(function (p) { return p.unit.uid.indexOf('forced') === 0; })[0];
            eq(placed.tier, 1, 'it comes to rest on top of what was below it');
        });

        suite('cascade — a filled tier ships out', function () {
            const game = cascade();
            fillTier(game, 0, 3, 3);
            game.grid.place(unit('20ft', { uid: 'rider' }), 0, 0, 1, 0);
            forcePiece(game, '10ft', 3, 3, 4);

            const events = game.hardDrop();
            const clear = events.filter(function (e) { return e.type === 'clear'; })[0];

            ok(!!clear, 'completing every cell of a tier ships it');
            eq(clear.tiers.join(','), '0', 'the bottom tier is the one that went');
            eq(game.layers, 1, 'the run counts the tier');
            eq(game.combo, 1, 'and opens a combo');
            eq(game.grid.count(), 1, 'only what was above the tier is left');

            const rider = game.grid.list()[0];
            eq(rider.tier, 0, 'the survivor settled down a tier');
            eq(rider.unit.uid, 'rider', 'and it is the container that was on top');
            eq(clear.moved.length, 1, 'the clear reports the mesh that has to follow it');
            ok(clear.moved[0].to.id !== clear.moved[0].from.id, 'a re-placed unit gets a new placement id');
            eq(clear.removed.length, 16, 'every container on the tier went with it');
        });

        suite('cascade — scoring', function () {
            const game = cascade();
            fillTier(game, 0, 0, 0);
            forcePiece(game, '10ft', 0, 0, 3);

            const before = game.score;
            const events = game.hardDrop();
            ok(game.score > before + Cascade.SCORE.layer, 'a tier is worth far more than a placement');
            ok(events.filter(function (e) { return e.type === 'clear'; })[0].perfect,
                'emptying the bay entirely is a perfect clear');

            eq(game.comboMultiplier(), 1, 'the first clear of a run is a flat multiplier');
            game.combo = 3;
            eq(game.comboMultiplier(), 2, 'a third consecutive clear doubles it');

            const cold = cascade();
            forcePiece(cold, '10ft', 0, 0, 0);
            cold.combo = 4;
            cold.hardDrop();
            eq(cold.combo, 0, 'a placement that clears nothing breaks the combo');
        });

        suite('cascade — level and speed', function () {
            const game = cascade();
            eq(game.level(), 1, 'a run starts at level 1');
            near(game.fallInterval(), Cascade.BASE_FALL, 0.001, 'and at the base fall interval');

            game.layers = Cascade.TIERS_PER_LEVEL * 3;
            eq(game.level(), 4, 'every few tiers is a level');
            ok(game.fallInterval() < Cascade.BASE_FALL, 'a higher level falls faster');

            game.layers = 500;
            ok(game.fallInterval() >= Cascade.MIN_FALL - 1e-9, 'the interval never goes below its floor');

            const soft = cascade();
            soft.setSoft(true);
            near(soft.stepInterval(), soft.fallInterval() / Cascade.SOFT_FACTOR, 0.001,
                'a soft drop divides the interval');
            soft.setSoft(false);
            near(soft.stepInterval(), soft.fallInterval(), 0.001, 'and releasing it restores the interval');
        });

        suite('cascade — the run ends when the roof is reached', function () {
            const game = cascade();
            fillTier(game, game.bay.tiers - 1);

            ok(!game.spawn(), 'a full top tier has no room for the next container');
            ok(game.over, 'which is the end of the run');
            ok(game.piece === null, 'and nothing is left falling');
            eq(tickFor(game, 10).length, 0, 'a finished run ignores the clock');
        });

        suite('cascade — readouts', function () {
            const game = cascade();
            eq(game.stackHeight(), 0, 'an empty bay is zero tiers tall');
            eq(game.tierFill(), 0, 'and nothing is part-filled');

            fillTier(game, 0, 3, 3);
            eq(game.stackHeight(), 1, 'a filled floor is one tier tall');
            near(game.tierFill(), 15 / 16, 0.001, 'the fill is the lowest unfinished tier');

            const snap = game.snapshot();
            eq(snap.tiers, game.bay.tiers, 'the snapshot carries the bay height');
            eq(snap.upcoming.length, Cascade.PREVIEW, 'and the lookahead the HUD draws');
            ok(!!snap.current, 'and what is coming down');
        });

        suite('cascade — persistence', function () {
            Cargo3D.Storage.resetProgress();
            const blank = Cargo3D.Storage.getCascade();
            eq(blank.bestScore, 0, 'a fresh save has no best run');
            eq(blank.runs, 0, 'and no attempts');

            const first = Cargo3D.Storage.recordCascade({ score: 900, layers: 3, level: 2 });
            ok(first.improved, 'the first run is a personal best');
            eq(first.best.bestScore, 900, 'and is stored');
            eq(first.best.runs, 1, 'attempts are counted');

            const worse = Cargo3D.Storage.recordCascade({ score: 400, layers: 1, level: 1 });
            ok(!worse.improved, 'a worse run does not overwrite the best');
            eq(worse.best.bestScore, 900, 'the best survives');
            eq(worse.best.bestLayers, 3, 'and keeps the tiers that went with it');
            eq(worse.best.runs, 2, 'but still counts as an attempt');

            // Additive, like the physics record: a save written before Cascade
            // existed has to read back at version 1 rather than being discarded.
            //
            // Only assertable when localStorage really is available — under the
            // in-memory fallback read() hands back the very object it was given,
            // so there is no parse to migrate and nothing here is being tested.
            let stored = null;
            try { stored = window.localStorage.getItem(Cargo3D.Storage.SAVE_KEY); } catch (e) { stored = null; }

            if (stored) {
                const old = JSON.parse(stored);
                delete old.cascade;
                window.localStorage.setItem(Cargo3D.Storage.SAVE_KEY, JSON.stringify(old));

                eq(Cargo3D.Storage.getCascade().bestScore, 0, 'a save without the block reads as blank');
                eq(Cargo3D.Storage.read().version, Cargo3D.Storage.SAVE_VERSION,
                    'and is still a version 1 save');
            } else {
                ok(true, 'localStorage is unavailable — migration assertion skipped');
            }

            Cargo3D.Storage.resetProgress();
        });

        // ── summary ─────────────────────────────────────────────────────────
        const summary = document.getElementById('summary');
        summary.className = failed === 0 ? 'ok' : 'bad';
        summary.textContent = failed === 0
            ? 'ALL TESTS PASSED — ' + passed + ' assertions'
            : 'FAILED — ' + failed + ' of ' + (passed + failed) + ' assertions';
        document.title = (failed === 0 ? 'PASS' : 'FAIL') + ' — Yard Master core tests';
        window.__TEST_RESULT__ = { passed: passed, failed: failed, failures: failures };
    })();
    </script>
</body>
</html>
