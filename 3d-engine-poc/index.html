<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yard Master has moved</title>
    <!--
      The game lived at /3d-engine-poc/ for its first year, under the name of the
      experiment it started as. It is Yard Master now and it lives at
      /yard-master/ — but a URL that has been in a browser's history, a phone's
      home screen or somebody else's link is not free to break. So the old path
      keeps a stub that forwards, and says so if the forward does not take.

      Canonical points at the new address, and the redirect is client-side
      because GitHub Pages serves static files and cannot issue a 301.
    -->
    <link rel="canonical" href="https://neskil.github.io/yard-master/">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=../yard-master/">
    <script>
        // Carries the query and hash across, so a deep link keeps its state.
        location.replace('../yard-master/' + location.search + location.hash);
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 24px;
        }
        h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 10px; }
        p { color: #94a3b8; margin: 0 0 18px; line-height: 1.5; }
        a { color: #38bdf8; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>Yard Master has moved</h1>
        <p>This game now lives at <code>/yard-master/</code>.</p>
        <p><a href="../yard-master/">Continue to Yard Master →</a></p>
    </main>
</body>
</html>
