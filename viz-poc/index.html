<body>
    <div id="stage"></div>
    <div id="vignette"></div>

    <!-- Everything below floats over the canvas and can be folded away with
         the chevron. The visualization is the page; this is instrumentation. -->
    <div id="chrome">
        <div class="topbar">
            <a class="icon-btn glass" href="../index.html" title="Back to home" aria-label="Back to home">
                <svg viewBox="0 0 24 24"><path d="M19 12H5m7-7l-7 7 7 7"/></svg>
            </a>
            <div class="brand glass">
                <span class="brand-name">Data Room</span>
            </div>

            <div class="tool-group glass">
                <button type="button" class="icon-btn flat" id="btn-controls"
                    aria-pressed="false" title="Controls" aria-label="Controls">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/>
                        <circle cx="15" cy="7" r="2.1"/><circle cx="9" cy="17" r="2.1"/>
                    </svg>
                </button>
                <button type="button" class="icon-btn flat" id="btn-info"
                    aria-pressed="false" title="About this scene" aria-label="About this scene">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.4"/><path d="M12 7.7v.1"/>
                    </svg>
                </button>
                <button type="button" class="icon-btn flat" id="btn-full"
                    aria-pressed="false" title="Fullscreen" aria-label="Fullscreen">
                    <svg viewBox="0 0 24 24" class="ico-expand">
                        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
                    </svg>
                    <svg viewBox="0 0 24 24" class="ico-shrink">
                        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
                    </svg>
                </button>
                <button type="button" class="icon-btn flat" id="btn-hide"
                    title="Hide the interface" aria-label="Hide the interface">
                    <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                </button>
            </div>
        </div>

        <!-- Scene notes. Folded to nothing until asked for, because on a phone
             four lines of prose is half the visualization. -->
        <div class="info-card glass" id="info-card" hidden>
            <h1 class="info-title" id="info-title">&nbsp;</h1>
            <p class="info-text" id="info-text">&nbsp;</p>
            <p class="info-hint" id="info-hint"></p>
        </div>

        <div class="panel glass" id="controls-panel" hidden>
            <div class="panel-head">
                <span id="controls-title">Controls</span>
                <button type="button" class="panel-close" id="controls-close" aria-label="Close controls">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div class="panel-body" id="controls-body"></div>
        </div>

        <div class="readout glass" id="readout" aria-live="polite"></div>

        <div class="legend" id="legend" hidden></div>

        <div class="switcher glass" id="switcher" role="group" aria-label="Choose a visualization"></div>

        <div id="fps">—</div>
    </div>

    <!-- The one thing that survives hiding the chrome, or there is no way back. -->
    <button type="button" class="reveal" id="btn-reveal" title="Show the interface" aria-label="Show the interface" hidden>
        <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    </button>

    <div id="boot">
        <div class="boot-inner">
            <div class="boot-spinner" id="boot-spinner"></div>
            <div class="boot-title" id="boot-title">Data Room</div>
            <div class="boot-text" id="boot-text">Warming up the renderer…</div>
        </div>
    </div>

    <script src="vendor/three.min.js"></script>

    <script src="js/data/land.js?v=1.0.0"></script>

    <script src="js/scene-particles.js?v=1.0.0"></script>
    <script src="js/scene-nebula.js?v=1.0.0"></script>
    <script src="js/scene-boids.js?v=1.0.0"></script>
    <script src="js/scene-mandelbulb.js?v=1.0.0"></script>
    <script src="js/scene-attractor.js?v=1.0.0"></script>
    <script src="js/scene-waves.js?v=1.0.0"></script>
    <script>VizApp.start();</script>
