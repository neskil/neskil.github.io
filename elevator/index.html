<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Elevator Tycoon | Niklas Billgren</title>
    <meta name="description" content="Program a building's elevators and watch the queues. Pick how each car chooses its next stop, which floors it serves and where it waits, then run the day: six levels from a quiet Tuesday to the five o'clock rush.">
    <meta name="theme-color" content="#0d1117">
    <meta name="color-scheme" content="dark">
    <meta name="author" content="Niklas Billgren">
    <link rel="canonical" href="https://neskil.github.io/elevator/">
    <meta property="og:site_name" content="Niklas Billgren">
    <meta property="og:title" content="Tiny Elevator Tycoon">
    <meta property="og:description" content="Program a building's elevators, run the day, and see how long everyone waited.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://neskil.github.io/elevator/">
    <meta property="og:image" content="https://neskil.github.io/assets/og/elevator.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A ten-floor building in cross-section with two elevator cars mid-run, queues of people at the lobby, beside the panel for programming each car.">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="../favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --panel: rgba(255, 255, 255, 0.045);
            --panel-border: rgba(255, 255, 255, 0.09);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #f59e0b;
            --accent-rgb: 245, 158, 11;
            --good: #34d399;
            --bad: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        [hidden] { display: none !important; }

        body {
            background: radial-gradient(ellipse at 30% 0%, #1a1f2e 0%, var(--bg) 60%);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        button { font: inherit; color: inherit; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .bar {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.7rem 1rem;
        }

        .back {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            border: 1px solid var(--panel-border);
            background: var(--panel);
        }

        .back:hover { color: var(--text); }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-right: auto;
        }

        h1 span { color: var(--accent); }

        #total {
            font-family: 'Outfit', sans-serif;
            color: var(--accent);
            font-weight: 600;
        }

        #levels {
            display: flex;
            gap: 0.4rem;
            padding: 0 1rem 0.8rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        #levels::-webkit-scrollbar { display: none; }

        .level {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            border: 1px solid var(--panel-border);
            background: var(--panel);
            border-radius: 12px;
            padding: 0.4rem 0.7rem;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.82rem;
        }

        .level[aria-pressed="true"] {
            border-color: rgba(var(--accent-rgb), 0.7);
            background: rgba(var(--accent-rgb), 0.12);
        }

        .level:disabled { opacity: 0.45; cursor: not-allowed; }

        .lv-num {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: var(--muted);
        }

        .lv-stars { color: var(--accent); letter-spacing: 1px; font-size: 0.75rem; }

        .dim { color: rgba(255, 255, 255, 0.15); }

        .layout {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
            gap: 1rem;
            padding: 0 1rem 1rem;
            min-height: 0;
        }

        .stage {
            position: relative;
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.05), rgba(0, 0, 0, 0.2));
            overflow: hidden;
            /* The whole building on screen at once, whatever the panel does. */
            height: max(440px, calc(100dvh - 125px));
            align-self: start;
            position: sticky;
            top: 0.5rem;
        }

        /* Out of the flow: the canvas is sized to the stage, so if it took
           part in the stage's height the two would chase each other upward. */
        #building { display: block; position: absolute; inset: 0; }

        .stats {
            position: absolute;
            right: 0.7rem;
            top: 0.6rem;
            display: grid;
            grid-template-columns: auto auto;
            gap: 0.1rem 0.8rem;
            font-size: 0.78rem;
            color: var(--muted);
            background: rgba(13, 17, 23, 0.7);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 0.5rem 0.7rem;
            backdrop-filter: blur(8px);
        }

        .stats b {
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            align-self: start;
        }

        #lv-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
        }

        #lv-blurb { color: var(--text); font-size: 0.9rem; }

        #lv-facts { color: var(--muted); font-size: 0.76rem; line-height: 1.5; margin-top: 0.25rem; }

        .section-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        #program { display: flex; flex-direction: column; gap: 0.8rem; }

        .car-rules {
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 0.6rem 0.7rem;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            background: rgba(0, 0, 0, 0.15);
        }

        .car-head {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .car-chip {
            display: inline-grid;
            place-items: center;
            width: 1.35rem;
            height: 1.35rem;
            border-radius: 6px;
            border: 2px solid var(--c);
            color: var(--c);
            font-size: 0.75rem;
        }

        .field {
            display: grid;
            grid-template-columns: 5.6rem 1fr;
            align-items: center;
            gap: 0.5rem;
        }

        .field.share { grid-template-columns: 1fr auto; }

        .field-label { font-size: 0.78rem; color: var(--muted); }

        .seg {
            display: flex;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            overflow: hidden;
        }

        .seg button {
            flex: 1;
            border: 0;
            background: transparent;
            padding: 0.35rem 0.4rem;
            font-size: 0.76rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .seg button + button { border-left: 1px solid var(--panel-border); }

        .seg button[aria-checked="true"] {
            background: rgba(var(--accent-rgb), 0.2);
            color: #fde68a;
        }

        .seg button:disabled { cursor: not-allowed; opacity: 0.6; }

        #locked-hint { font-size: 0.75rem; color: var(--muted); }

        .controls { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }

        .btn {
            border: 1px solid var(--panel-border);
            background: var(--panel);
            border-radius: 999px;
            padding: 0.45rem 0.9rem;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.09); }

        .btn-primary {
            background: rgba(var(--accent-rgb), 0.22);
            border-color: rgba(var(--accent-rgb), 0.6);
            color: #fde68a;
            font-weight: 600;
        }

        .btn[aria-pressed="true"] { border-color: rgba(var(--accent-rgb), 0.6); color: #fde68a; }

        .speeds { display: inline-flex; gap: 0.25rem; margin-left: auto; }

        .speeds .btn { padding: 0.35rem 0.6rem; font-size: 0.78rem; }

        #result {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: rgba(13, 17, 23, 0.72);
            backdrop-filter: blur(6px);
        }

        .card {
            width: min(92%, 380px);
            background: #161b26;
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 1.3rem;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        #res-stars { font-size: 2.2rem; color: var(--accent); letter-spacing: 4px; }

        #res-title { font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 700; margin: 0.2rem 0 0.8rem; }

        .res-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 0.3rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--muted);
        }

        .res-line b { color: var(--text); font-family: 'Outfit', sans-serif; }
        .res-line.good b { color: var(--good); }
        .res-line.bad b { color: var(--bad); }

        #res-hint { font-size: 0.8rem; color: var(--muted); margin: 0.8rem 0; line-height: 1.5; }

        .res-actions { display: flex; gap: 0.5rem; justify-content: center; }

        @media (max-width: 480px) {
            .field { grid-template-columns: 1fr; gap: 0.25rem; }
            .seg button { font-size: 0.72rem; padding: 0.4rem 0.2rem; }
        }

        @media (max-width: 860px) {
            .layout { grid-template-columns: 1fr; }
            .stage { height: 62dvh; position: relative; top: auto; }
        }

        @media (max-width: 639px) {
            .stats {
                top: auto;
                left: 0.5rem;
                right: 0.5rem;
                bottom: 0.5rem;
                grid-template-columns: repeat(3, auto auto);
                font-size: 0.7rem;
                padding: 0.35rem 0.55rem;
            }
        }
    </style>

</head>
<body>
    <header class="bar">
        <a class="back" href="../index.html">← Back</a>
        <h1>Tiny Elevator <span>Tycoon</span></h1>
        <span id="total" title="Stars across all levels"></span>
    </header>

    <nav id="levels" aria-label="Levels"></nav>

    <main class="layout">
        <div class="stage">
            <canvas id="building" aria-label="Cross-section of the building: floors, people waiting at each floor, and the elevator cars in their shafts."></canvas>
            <div class="stats" aria-live="off">
                <span>Clock</span><b id="st-time">0:00</b>
                <span>Waiting</span><b id="st-waiting">0</b>
                <span>Riding</span><b id="st-riding">0</b>
                <span>Arrived</span><b id="st-served">0</b>
                <span>Took stairs</span><b id="st-lost">0</b>
                <span>Avg wait</span><b id="st-wait">—</b>
            </div>
            <div id="result" hidden>
                <div class="card" role="dialog" aria-label="End of the day">
                    <div id="res-stars"></div>
                    <div id="res-title"></div>
                    <div id="res-lines"></div>
                    <p id="res-hint"></p>
                    <div class="res-actions">
                        <button type="button" class="btn" id="res-again">Tweak and retry</button>
                        <button type="button" class="btn btn-primary" id="res-next">Next level →</button>
                    </div>
                </div>
            </div>
        </div>

        <section class="panel" aria-label="Program the cars">
            <div>
                <div id="lv-title"></div>
                <div id="lv-blurb"></div>
                <div id="lv-facts"></div>
            </div>
            <div class="section-label">Program</div>
            <div id="program"></div>
            <div id="locked-hint" hidden>The day is under way. Reset to change the program.</div>
            <div class="controls">
                <button type="button" class="btn btn-primary" id="run">▶ Run the day</button>
                <button type="button" class="btn" id="reset">↺ Reset</button>
                <button type="button" class="btn" id="instant" title="Run the whole day instantly and see the score">⚡ Skip to results</button>
                <span class="speeds" role="group" aria-label="Speed">
                    <button type="button" class="btn" data-speed="1">1×</button>
                    <button type="button" class="btn" data-speed="4">4×</button>
                    <button type="button" class="btn" data-speed="16">16×</button>
                </span>
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
