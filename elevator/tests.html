<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Elevator Tycoon — Simulation Tests</title>
    <meta name="robots" content="noindex">
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, monospace; padding: 1.5rem; line-height: 1.5; }
        h1 { font-size: 1.4rem; margin-bottom: 1rem; color: #f59e0b; }
        .pass { color: #34d399; }
        .fail { color: #f87171; font-weight: bold; }
        #summary { font-size: 1.2rem; margin-bottom: 1rem; padding: 0.5rem; background: #1e293b; border-radius: 6px; }
        .test-row { margin-bottom: 0.25rem; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🛗 Tiny Elevator Tycoon — Test Suite</h1>
    <div id="summary">Running tests…</div>
    <div id="results"></div>

    <script type="module">
        import * as E from './js/sim.js';

        const results = document.getElementById('results');
        let passed = 0, failed = 0;
        function ok(cond, name, detail = '') {
            const row = document.createElement('div');
            row.className = 'test-row ' + (cond ? 'pass' : 'fail');
            row.textContent = (cond ? '✓ ' : '✗ ') + name + (detail ? ' — ' + detail : '');
            results.appendChild(row);
            cond ? passed++ : failed++;
        }
        const one = (strategy, zone = 'all', park = 'stay') => ({ strategy, zone, park });

        // ── Arrivals ──
        for (const L of E.LEVELS) {
            const a = E.arrivals(L), b = E.arrivals(L);
            ok(JSON.stringify(a) === JSON.stringify(b), `${L.id}: the same people arrive every run`, a.length + ' people');
            ok(a.every(p => p.from !== p.to && p.from >= 0 && p.to >= 0 && p.from < L.floors && p.to < L.floors && p.t < L.day),
                `${L.id}: every trip is a real trip inside the building during the day`);
        }
        {
            const m = E.arrivals(E.LEVELS.find(l => l.id === 'morning'));
            ok(m.filter(p => p.from === 0).length / m.length > 0.7, 'the morning rush starts in the lobby');
            const e = E.arrivals(E.LEVELS.find(l => l.id === 'evening'));
            ok(e.filter(p => p.to === 0).length / e.length > 0.7, 'and five o’clock ends there');
            const party = E.LEVELS.find(l => l.id === 'party');
            const pa = E.arrivals(party);
            const top = party.floors - 1;
            const early = pa.filter(p => p.t < party.day / 3), late = pa.filter(p => p.t > party.day * 2 / 3);
            ok(early.filter(p => p.to === top).length > late.filter(p => p.to === top).length, 'party guests arrive early and leave late');
        }

        // ── Invariants, watched tick by tick ──
        function watch(L, rules) {
            const sim = E.createSim(L, rules);
            const problems = new Set();
            const prev = sim.cars.map(c => c.pos);
            while (!E.finished(sim) && sim.t < L.day * 3) {
                E.step(sim);
                sim.cars.forEach((c, i) => {
                    if (c.riders.length > L.capacity) problems.add('over capacity');
                    const lo = Math.min(prev[i], c.pos), hi = Math.max(prev[i], c.pos);
                    for (const p of c.riders) {
                        if (p.to > lo && p.to < hi) problems.add('rode past a rider’s floor');
                        if (!E.serves(L, c.rules.zone, p.to) || !E.serves(L, c.rules.zone, p.from)) problems.add('carried someone outside its zone');
                    }
                    if (c.pos < -1e-9 || c.pos > L.floors - 1 + 1e-9) problems.add('left the building');
                    prev[i] = c.pos;
                });
                if (rules.share) {
                    for (const p of sim.waiting) if (p.claim != null && !sim.cars[p.claim]) problems.add('claimed by a car that does not exist');
                }
                sim.events.length = 0;
            }
            const r = E.score(sim);
            if (r.served + r.gaveUp !== r.people) problems.add('lost count of people');
            return { r, problems: [...problems] };
        }

        for (const L of E.LEVELS) {
            let bad = [];
            let runs = 0;
            for (const rules of E.allRules(L)) {
                const { problems } = watch(L, rules);
                runs++;
                if (problems.length) bad.push(JSON.stringify(rules) + ': ' + problems.join(', '));
            }
            ok(bad.length === 0, `${L.id}: no program breaks the building (${runs} programs)`, bad[0] || '');
        }

        // ── Each strategy behaves like its name ──
        function tiny(pending, car, extra = {}) {
            const L = { id: 't', floors: 8, cars: 1, capacity: 6, traffic: 'mixed', rate: 1, day: 60, patience: 500, seed: 1, stars: [99, 99], maxGaveUp: 1, ...extra };
            const sim = E.createSim(L, { share: false, cars: [car] });
            sim.pending = pending;
            return sim;
        }
        function runLog(sim) {
            const log = [];
            while (!E.finished(sim) && sim.t < 300) {
                E.step(sim);
                for (const e of sim.events) log.push(e.kind + ':' + e.p.id + '@' + e.floor);
                sim.events.length = 0;
            }
            return log;
        }
        {
            // A rider heading for 6, and someone at 3 also going up, who calls
            // after the car has left: a sweep stops for them on the way.
            const sim = tiny([{ id: 0, t: 0.1, from: 0, to: 6 }, { id: 1, t: 2, from: 3, to: 7 }], one('collective'));
            const log = runLog(sim);
            ok(log.indexOf('board:1@3') >= 0 && log.indexOf('board:1@3') < log.indexOf('arrive:0@6'), 'a sweep picks up someone going its way en route');
        }
        {
            const sim = tiny([{ id: 0, t: 0.1, from: 0, to: 6 }, { id: 1, t: 2, from: 3, to: 1 }], one('collective'));
            const log = runLog(sim);
            ok(log.indexOf('arrive:0@6') < log.indexOf('board:1@3'), 'but leaves someone going the other way for the return trip');
        }
        {
            const sim = tiny([{ id: 0, t: 0.1, from: 0, to: 6 }, { id: 1, t: 2, from: 3, to: 7 }], one('oldest'));
            const log = runLog(sim);
            ok(log.indexOf('arrive:0@6') < log.indexOf('board:1@3'), 'oldest-first finishes one errand before the next');
        }
        {
            const sim = tiny([{ id: 0, t: 0.1, from: 7, to: 0 }, { id: 1, t: 0.2, from: 1, to: 2 }], one('nearest'));
            const log = runLog(sim);
            ok(log.indexOf('board:1@1') < log.indexOf('board:0@7'), 'nearest-call goes to the closer floor first');
        }
        {
            const sim = tiny([{ id: 0, t: 0.1, from: 0, to: 6 }], one('oldest', 'all', 'lobby'));
            runLog(sim);
            for (let k = 0; k < 200; k++) E.step(sim);
            ok(sim.cars[0].pos === 0, 'a car told to park at the lobby goes home when idle');
        }
        {
            const sim = tiny([{ id: 0, t: 0.1, from: 0, to: 6 }], one('oldest', 'all', 'stay'));
            runLog(sim);
            for (let k = 0; k < 200; k++) E.step(sim);
            ok(sim.cars[0].pos === 6, 'one told to stay put stays where it stopped');
        }
        {
            const L = { id: 't', floors: 10, cars: 2, capacity: 6, traffic: 'mixed', rate: 1, day: 60, patience: 500, seed: 1, stars: [99, 99], maxGaveUp: 1 };
            const sim = E.createSim(L, { share: false, cars: [one('oldest', 'low'), one('oldest', 'high')] });
            sim.pending = [{ id: 0, t: 0.1, from: 0, to: 8 }, { id: 1, t: 0.1, from: 0, to: 2 }];
            const log = runLog(sim);
            const boarded = {};
            sim.done.forEach(p => { boarded[p.id] = p.car; });
            ok(boarded[0] === 1 && boarded[1] === 0, 'an express to the high floors takes the high floors, the local takes the low');
        }
        {
            // Two cars at the lobby, one call on floor 5. With sharing on only
            // one goes; with it off both set off after it.
            const L = { id: 't', floors: 8, cars: 2, capacity: 6, traffic: 'mixed', rate: 1, day: 60, patience: 500, seed: 1, stars: [99, 99], maxGaveUp: 1 };
            for (const share of [false, true]) {
                const sim = E.createSim(L, { share, cars: [one('nearest'), one('nearest')] });
                sim.pending = [{ id: 0, t: 0.1, from: 5, to: 0 }];
                for (let k = 0; k < 20; k++) E.step(sim);
                const moving = sim.cars.filter(c => c.pos > 0).length;
                ok(moving === (share ? 1 : 2), share ? 'shared calls send one car' : 'unshared calls send them all', moving + ' moving');
            }
        }
        {
            const sim = tiny(Array.from({ length: 10 }, (_, i) => ({ id: i, t: 0.1, from: 0, to: 5 })), one('collective'), { capacity: 4 });
            for (let k = 0; k < 40; k++) E.step(sim);
            ok(sim.cars[0].riders.length === 4 && sim.waiting.length === 6, 'a full car leaves the rest waiting');
        }
        {
            const sim = tiny([{ id: 0, t: 0.1, from: 4, to: 0 }], one('oldest'), { patience: 3 });
            runLog(sim);
            ok(sim.gaveUp.length === 1 && sim.done.length === 0, 'someone who waits past their patience takes the stairs');
        }

        // ── The levels as puzzles ──
        for (const L of E.LEVELS) {
            const a = E.runDay(L, E.defaultRules(L)), b = E.runDay(L, E.defaultRules(L));
            ok(JSON.stringify(a) === JSON.stringify(b), `${L.id}: the same program scores the same twice`);
            ok(a.stars < 3, `${L.id}: the starting program does not already win`, a.stars + '★');
            let bestStars = 0, bestRules = null;
            for (const r of E.allRules(L)) {
                const s = E.runDay(L, r);
                if (s.stars > bestStars) { bestStars = s.stars; bestRules = r; }
            }
            ok(bestStars === 3, `${L.id}: three stars are possible`, bestRules ? bestRules.cars.map(c => c.strategy + '/' + c.zone + '/' + c.park).join(' ') + (bestRules.share ? ' shared' : '') : '');
        }

        const summary = document.getElementById('summary');
        summary.textContent = passed + ' passed, ' + failed + ' failed';
        summary.className = failed ? 'fail' : 'pass';
    </script>
</body>
</html>
