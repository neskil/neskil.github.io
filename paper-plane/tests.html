<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Plane Glider — Folding &amp; Flight Tests</title>
    <meta name="robots" content="noindex">
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, monospace; padding: 1.5rem; line-height: 1.5; }
        h1 { font-size: 1.4rem; margin-bottom: 1rem; color: #facc15; }
        .pass { color: #34d399; }
        .fail { color: #f87171; font-weight: bold; }
        #summary { font-size: 1.2rem; margin-bottom: 1rem; padding: 0.5rem; background: #1e293b; border-radius: 6px; }
        .test-row { margin-bottom: 0.25rem; font-family: monospace; }
    </style>
</head>
<body>
    <h1>✈️ Paper Plane Glider — Test Suite</h1>
    <div id="summary">Running tests…</div>
    <div id="results"></div>

    <script type="module">
        import * as F from './js/fold.js';
        import * as P from './js/flight.js';
        import * as P3 from './js/flight3d.js';
        import { buildModel } from './js/model.js';

        const results = document.getElementById('results');
        let passed = 0, failed = 0;
        function ok(cond, name, detail = '') {
            const row = document.createElement('div');
            row.className = 'test-row ' + (cond ? 'pass' : 'fail');
            row.textContent = (cond ? '✓ ' : '✗ ') + name + (detail ? ' — ' + detail : '');
            results.appendChild(row);
            cond ? passed++ : failed++;
        }
        const near = (a, b, t) => Math.abs(a - b) <= t;
        const totalArea = (p) => p.facets.reduce((s, f) => s + Math.abs(F.area(f.pts)), 0);
        const hasVertex = (p, x, y) => p.facets.some(f => f.pts.some(v => near(v[0], x, 0.05) && near(v[1], y, 0.05)));
        function folded(id, upto = Infinity) {
            const d = F.DESIGNS.find(x => x.id === id);
            return F.build(d.steps.slice(0, upto)).paper;
        }

        // ── The sheet ──
        {
            const s = F.newSheet();
            ok(near(totalArea(s), 210 * 297, 1e-6), 'a sheet of A4 is 210 × 297 mm');
            ok(near(F.SHEET_MASS * 1000, 4.99, 0.01), 'and weighs 5 g at 80 gsm');
            const an = F.analyze(s);
            ok(near(an.cg[0], 0, 1e-9) && near(an.cg[1], 148.5, 1e-9), 'its balance point is in the middle');
        }

        // ── Folding ──
        {
            const s = F.newSheet();
            const p = F.fold(s, [-105, 0], [0, 105]);
            ok(p && hasVertex(p, 0, 105), 'a corner picked up lands exactly where it is put');
            ok(near(totalArea(p), 210 * 297, 0.01), 'and no paper is made or lost');
            ok(p.facets.length === 2, 'one crease makes two facets');
            const flap = p.facets.find(f => f.face === 1);
            ok(flap && flap.z > p.facets.find(f => f.face === 0).z, 'the flap is turned over and lies on top');
            const under = F.fold(s, [-105, 0], [0, 105], true);
            ok(under.facets.find(f => f.face === 1).z < under.facets.find(f => f.face === 0).z, 'folding under puts it beneath');
            ok(F.fold(s, [-105, 0], [-104, 0.5]) === null, 'a twitch is not a fold');
            ok(F.fold(s, [500, 500], [0, 0]) === null, 'grabbing thin air folds nothing');
        }
        {
            for (const d of F.DESIGNS) {
                const p = folded(d.id);
                const an = F.analyze(p);
                ok(p.folds.length === d.steps.length && near(totalArea(p), 210 * 297, 0.5), `${d.name}: folds cleanly, all paper accounted for`, p.facets.length + ' facets');
                ok(near(an.cg[0], 0, 0.05), `${d.name}: mirrored folds keep it balanced side to side`);
                const w = F.wingStats(an, d.keel);
                ok(w.asymmetry < 0.02, `${d.name}: and the same shape both sides`, (w.asymmetry * 100).toFixed(1) + '%');
            }
        }
        {
            // Nakamura step 4 folds the little tip only: the long tail stays put.
            const before = folded('nakamura', 3);
            const st = F.DESIGNS.find(d => d.id === 'nakamura').steps[3];
            const after = F.applyStep(before, st);
            ok(F.bounds(after).y1 === F.bounds(before).y1, 'folding a loose tip leaves the rest of the sheet where it was');
            const shapes = new Set(before.facets.map(f => JSON.stringify(f.pts)));
            const changed = after.facets.filter(f => !shapes.has(JSON.stringify(f.pts))).length;
            const tail = (p) => p.facets.filter(f => F.centroid(f.pts)[1] > 240).reduce((s, f) => s + Math.abs(F.area(f.pts)), 0);
            ok(changed > 0 && changed <= 8 && near(tail(after), tail(before), 0.01), 'it moves the tip and only the tip', changed + ' facets changed');
            ok(JSON.stringify(folded('nakamura', 3).facets.map(f => [f.z, f.pts])) === JSON.stringify(before.facets.map(f => [f.z, f.pts])),
                'and leaves the sheet it was folded from as it was');
            // Wide Glider step 3: the corner has the folded-down triangle joined
            // to it along the crease, so both layers come with it.
            const g2 = folded('glider', 2);
            const plan = F.planFold(g2, [-105, 105], [0, 210]);
            ok(plan && plan.moving.size >= 2, 'a corner where layers meet at a crease takes all of them', plan ? plan.moving.size + ' layers' : '');
        }
        {
            const s = F.newSheet();
            const r = F.foldMirrored(s, [-105, 0], [60, 150]);
            ok(r.error === 'crosses', 'a mirrored fold across the middle is refused');
            const c = F.foldMirrored(s, [0, 0], [0, 120]);
            ok(c.paper && c.paper.folds.length === 1, 'a fold straight down the middle happens once');
            const m = F.foldMirrored(s, [-105, 0], [0, 105]);
            ok(m.paper && m.paper.folds.length === 1 && m.paper.facets.length === 3, 'a mirrored fold is one step with two flaps');

            // Layers over a grid sampled symmetrically about the centre line.
            const lopsided = (p) => {
                let d = 0;
                for (let y = 0.37; y < 300; y += 2.5) for (let x = 0.75; x < 110; x += 2.5) {
                    const at = (px) => p.facets.filter(f => F.contains(f.pts, px, y)).length;
                    d += Math.abs(at(x) - at(-x));
                }
                return d;
            };
            const across = F.foldMirrored(s, [-105, 297], [-105, 200]);
            ok(across.paper && across.paper.facets.length === 2 && near(totalArea(across.paper), 210 * 297, 1e-6) && F.bounds(across.paper).y1 < 250,
                'mirrored, a fold straight across folds the whole width, once', across.error || '');
            const over = F.foldMirrored(s, [-105, 297], [46.4, 297]);
            ok(over.paper && lopsided(over.paper) === 0 && near(totalArea(over.paper), 210 * 297, 1e-6),
                'mirrored flaps that reach over the middle onto each other stay symmetric', over.paper ? lopsided(over.paper) + ' cells off' : over.error);
            ok(F.foldMirrored(s, [-10, 150], [60, 150]).error === 'crosses', 'a mirrored fold that would lift the centre line is refused');
            ok(F.fold(s, [0, 297], [0, 330]) === null && F.planFold(s, [-105, 297], [-105, 320]) === null, 'turning the whole sheet over is not a fold');
            const g = F.build(F.DESIGNS.find(d => d.id === 'glider').steps).paper;
            const tips = F.foldMirrored(g, [-105, 297], [-85, 297]);
            ok(tips.paper && lopsided(tips.paper) === 0, 'and wing tips folded up on a glider come out the same both sides');

            // What the table folds is what the list re-folds, exactly.
            let p = F.foldMirrored(s, [-105, 0], [0, 105]).paper;
            const S1 = [-105, 105], T1 = F.snapTarget(p, [-40.3, 211.7], 6).p;
            const direct = F.fold(p, S1, T1);
            const step = F.recognise(p, S1, T1, false, false);
            const again = F.build([F.recognise(s, [-105, 0], [0, 105], true, false), step]).paper;
            ok(JSON.stringify(direct.facets.map(f => f.pts)) === JSON.stringify(again.facets.map(f => f.pts)), 'a dragged fold, folded again from the list, is the same sheet');
            const back1 = F.decodeSteps(F.encodeSteps([step]))[0];
            ok(Math.abs(back1.T[0] - T1[0]) <= 0.005 && Math.abs(back1.T[1] - T1[1]) <= 0.005, 'and a share link keeps it to a hundredth of a millimetre');
        }
        {
            const steps = F.DESIGNS.find(d => d.id === 'nakamura').steps;
            const a = F.build(steps).paper, b2 = F.build(steps).paper;
            ok(JSON.stringify(a.facets.map(f => f.pts)) === JSON.stringify(b2.facets.map(f => f.pts)), 'folding the same steps makes the same plane (undo and reload work)');
            const mixed = [...steps.map(({ say, ...st }) => st), { kind: 'free', S: [-105, 297], T: [-60, 260], mirrored: true, under: true }];
            const code = F.encodeSteps(mixed);
            const back = F.decodeSteps(code);
            ok(JSON.stringify(back.map(st => F.describeStep(st))) === JSON.stringify(mixed.map(st => F.describeStep(st))) && F.build(back).ok.every(Boolean),
                'a plane survives a share link', code);
            ok([F.decodeSteps('x'), F.decodeSteps('c9'), F.decodeSteps('n999'), F.decodeSteps('f1,2,3'), F.decodeSteps('c1;f9e9,0,0,0')].every(v => v === null), 'a broken link folds nothing');
        }

        // ── Folds as steps ──
        {
            const s = F.newSheet();
            const r = F.resolveStep(s, { kind: 'corner', reach: 1 });
            ok(r && near(r.S[0], -105, 1e-9) && near(r.S[1], 0, 1e-9) && near(r.T[1], 105, 1e-6), '“corners in” on a fresh sheet is the dart’s first fold');
            const second = F.resolveStep(F.applyStep(s, { kind: 'corner', reach: 1 }), { kind: 'corner', reach: 1 });
            ok(second && near(second.S[1], 105, 0.01) && near(second.T[1], 148.49, 0.01), 'and on a folded one, finds the new corner');
            const nose = F.resolveStep(s, { kind: 'nose', d: 80 });
            ok(nose && nose.S[1] === 0 && nose.T[1] === 80, '“nose down” finds the nose');
            ok(F.resolveStep(s, { kind: 'tip', d: 40 }) === null, '“tip up” needs a folded-down tip to lift');
            const flat = F.build([{ kind: 'tip', d: 40 }, { kind: 'corner', reach: 1 }]);
            ok(!flat.ok[0] && flat.ok[1], 'a step with nothing to fold where it sits is skipped, and the rest still fold');

            ok(F.recognise(s, [-105, 0], [0, 105], true, false).kind === 'corner', 'dragging the top corner to the centre line is a “corners in” step');
            ok(F.recognise(s, [105, 0], [0, 105], true, false).kind === 'corner', 'from either side');
            const nd = F.recognise(s, [0, 0], [0, 140], false, false);
            ok(nd.kind === 'nose' && nd.d === 140, 'dragging the nose down the centre is a “nose down” step');
            ok(F.recognise(s, [-105, 297], [-50, 250], true, false).kind === 'free', 'anything else is a free fold');

            // Reordering really changes the plane.
            const d = F.DESIGNS.find(x => x.id === 'glider').steps;
            const swapped = [d[1], d[0], d[2]];
            const a = F.analyze(F.build(d).paper), b2 = F.analyze(F.build(swapped).paper);
            ok(Math.abs(a.cg[1] - b2.cg[1]) > 2, 'the same folds in a different order make a different plane', a.cg[1].toFixed(1) + ' vs ' + b2.cg[1].toFixed(1) + ' mm');
            // Tuning a step's depth moves the balance.
            const deep = F.analyze(F.build([d[0], { ...d[1], d: 210 }]).paper), shallow = F.analyze(F.build([d[0], { ...d[1], d: 90 }]).paper);
            ok(deep.cg[1] > shallow.cg[1], 'folding the nose further down moves the paper back with it');
            const rows = F.DESIGNS.flatMap(x => x.steps.map(F.describeStep));
            ok(rows.every(t => typeof t === 'string' && t.length > 4), 'every step can say what it is');
            const front = F.build([{ kind: 'corner', reach: 1 }, { kind: 'corner', reach: 1 }, { kind: 'nose', d: 150 }, { kind: 'corner', reach: 1 }, { kind: 'corner', reach: 1 }, { kind: 'corner', reach: 1 }]);
            ok(front.ok.length === 6, 'a long list of corner folds runs out of front corners gracefully', front.ok.map(v => (v ? '✓' : '·')).join(''));
        }
        {
            const s = F.newSheet();
            const a = F.snapTarget(s, [3, 120], 6);
            ok(a.kind === 'centre' && a.p[0] === 0, 'a point dropped near the middle snaps to the centre line');
            const b = F.snapTarget(s, [103, 2], 6);
            ok(b.kind === 'corner' && b.p[0] === 105 && b.p[1] === 0, 'and near a corner, to the corner');
            const g = F.snapGrab(s, [-101, 4], 8);
            ok(g[0] === -105 && g[1] === 0, 'pressing near a corner picks the corner up');
        }

        // ── What the folds do to the plane ──
        {
            const plain = P.makePlane(F.analyze(F.newSheet()), P.DEFAULT_TRIM);
            ok(plain.margin < 0, 'an unfolded sheet is tail-heavy', plain.margin.toFixed(2));
            for (const d of F.DESIGNS) {
                const pl = P.makePlane(F.analyze(folded(d.id)), { ...P.DEFAULT_TRIM, keel: d.keel });
                ok(pl.margin > plain.margin + 0.15, `${d.name}: folding moves the balance ahead of the lift`, pl.margin.toFixed(2));
            }
            const an = F.analyze(folded('glider'));
            const base = P.makePlane(an, P.DEFAULT_TRIM);
            ok(P.makePlane(an, { ...P.DEFAULT_TRIM, clips: 2 }).margin > base.margin, 'paper clips on the nose steady it');
            ok(P.makePlane(an, { ...P.DEFAULT_TRIM, elevator: 0.5 }).cm0 > base.cm0, 'bending the elevator up pitches the nose up');
            ok(P.makePlane(an, { ...P.DEFAULT_TRIM, keel: 50 }).info.span < base.info.span, 'a deeper keel leaves less wing');
            const wl = P.makePlane(an, { ...P.DEFAULT_TRIM, winglets: true });
            ok(wl.info.span < base.info.span && wl.cmq < base.cmq, 'winglets cost span but steady it in pitch');
        }
        {
            const p = folded('dart');
            const an = F.analyze(p);
            const model = buildModel(p, an, { keel: 30, elevator: 0.5, winglets: true, clips: 0 });
            const zs = model.polys.flatMap(q => q.pts.map(v => v[2]));
            ok(Math.min(...zs) >= -30.5 && Math.min(...zs) < -25, 'the 3D model hangs its keel 30 mm below the wings');
            ok(Math.max(...zs) > 10, 'with the winglets turned up');
            ok(model.polys.every(q => q.pts.every(v => v.every(Number.isFinite))), 'and every point of it is a real number');
        }

        // ── Flying ──
        {
            const plain = P.makePlane(F.analyze(F.newSheet()), P.DEFAULT_TRIM);
            const r = P.fly(plain, 5, 7);
            ok(r.stalls >= 1 && r.distance < 5, 'a flat sheet stalls and drops short', r.stalls + ' stalls, ' + r.distance.toFixed(1) + ' m');
            for (const d of F.DESIGNS) {
                const pl = P.makePlane(F.analyze(folded(d.id)), { ...P.DEFAULT_TRIM, keel: d.keel, elevator: d.elevator, clips: 1 });
                const f = P.fly(pl, 5, 7);
                ok(f.distance > 8 && f.distance > r.distance * 1.5, `${d.name}: flies properly`, f.distance.toFixed(1) + ' m');
            }
            const pl = P.makePlane(F.analyze(folded('dart')), P.DEFAULT_TRIM);
            const a = P.fly(pl, 8, 8), b = P.fly(pl, 8, 8);
            ok(a.distance === b.distance && a.path.length === b.path.length, 'the same plane and throw fly the same flight');
        }
        {
            const pl = P.makePlane(F.analyze(folded('glider')), { ...P.DEFAULT_TRIM, clips: 1 });
            const s = P.launch(pl, 10, 9);
            const E = () => 0.5 * (s.vx * s.vx + s.vy * s.vy) + 9.81 * s.y;
            let e = E(), rises = 0, maxY = 0;
            while (!s.sliding && s.t < 20) {
                P.step(s, pl, P.DT, null);
                const now = E();
                if (now > e + 1e-6 && !s.bonks) rises++;
                e = now;
                maxY = Math.max(maxY, s.y);
            }
            ok(rises === 0, 'no energy appears from nowhere in still air');
            ok(maxY <= P.ROOM.ceiling, 'and nothing goes through the ceiling');
        }
        {
            const pl = P.makePlane(F.analyze(folded('glider')), { ...P.DEFAULT_TRIM, clips: 1 });
            const still = P.fly(pl, 5, 7);
            const fan = P.fly(pl, 5, 7, { fans: [{ x: 4, width: 1.2, height: 2.6, up: 2 }] });
            ok(fan.distance > still.distance, 'a fan’s updraft carries it further', still.distance.toFixed(1) + ' → ' + fan.distance.toFixed(1) + ' m');
            ok(P.throughHoop([[0, 1], [2, 1.5]], { x: 1, y: 1.25, r: 0.1 }) && !P.throughHoop([[0, 1], [2, 1.5]], { x: 1, y: 2, r: 0.1 }), 'a hoop counts only through its ring');
            const desk = { pads: [{ x0: 2, x1: 40, y: 0.74 }] };
            const r = P.fly(pl, 5, 6, desk);
            ok(r.landedOn === 0, 'a plane coming down over a desk lands on it');
        }

        // ── Stalls, steep throws and landings ──
        {
            const stable = P.makePlane(F.analyze(folded('glider')), { ...P.DEFAULT_TRIM, keel: 22, elevator: 0.1 });
            let restoring = true;
            for (let a = stable.stall + 0.01; a < Math.PI - 0.05; a += 0.05) {
                if (!(P.pitchCoefficient(stable, a) < 0 && P.pitchCoefficient(stable, -a) > 0)) restoring = false;
            }
            ok(restoring, 'past the stall, at any angle, a balanced plane swings its nose back into the airflow');
            // Thrown nose-high with the elevator bent right up: it stalls, then
            // drops its nose and dives out of it, and never glides backwards.
            const backwards = (r) => { let far = -Infinity, worst = 0; for (const p of r.path) { far = Math.max(far, p[0]); worst = Math.max(worst, far - p[0]); } return worst; };
            const up = P.makePlane(F.analyze(folded('glider')), { ...P.DEFAULT_TRIM, keel: 22, elevator: 0.6 });
            const st = P.fly(up, 15, 9);
            ok(st.stalls >= 1 && backwards(st) < 0.05 && st.distance > 5, 'a stalled plane noses down and flies on, never backwards', `${st.stalls} stall(s), ${st.distance} m`);
            let worst = 0, shortest = Infinity;
            for (const d of F.DESIGNS) for (const [a, v] of [[25, 10], [40, 12]]) {
                const pl = P.makePlane(F.analyze(folded(d.id)), { ...P.DEFAULT_TRIM, keel: d.keel, elevator: d.elevator });
                const r = P3.fly3d(pl, { angle: a, speed: v, yaw: 0, bank: 0 });
                worst = Math.max(worst, backwards(r));
                shortest = Math.min(shortest, r.distance);
            }
            ok(worst < 0.1 && shortest > 5, 'thrown hard at the ceiling it bounces off and still comes down ahead', `shortest ${shortest} m`);
            ok(P.groundEffect(0.005, 0.15) < 0.3 && P.groundEffect(1, 0.15) > 0.99, 'a wing skimming the floor makes less induced drag');
            ok(P.touchSpeed(3, -0.5) === 0.5 && P.touchSpeed(1, -3) < 0.5, 'a flat landing skids on, a nose-dive digs in');
            const r = P3.fly3d(stable, { angle: 8, speed: 7, yaw: 0, bank: 0 });
            const after = r.path.filter(p => p[1] <= 1e-9).map(p => Math.abs(Math.atan2(P3.rotate([p[3], p[4], p[5], p[6]], [1, 0, 0])[1], 1)));
            ok(after.length > 2 && after[0] > 0.02 && after[after.length - 1] === 0 && after.every((v, i) => !i || v <= after[i - 1] + 1e-12),
                'once down it settles flat as it slides, rather than snapping level', after.length ? (after[0] * 180 / Math.PI).toFixed(1) + '° → 0' : '');
        }

        // ── Missions: each can be done with a guided design ──
        {
            const candidates = [
                ['dart', { keel: 18, elevator: -0.25, clips: 0 }],
                ['dart', { keel: 26, elevator: 0.5, clips: 2 }],
                ['glider', { keel: 26, elevator: 0.25, clips: 1 }],
                ['nakamura', { keel: 18, elevator: 0.25, clips: 1 }],
                ['nakamura', { keel: 24, elevator: 0, clips: 0 }],
            ].map(([id, t]) => P.makePlane(F.analyze(folded(id)), { ...P.DEFAULT_TRIM, ...t }));
            for (const m of P.MISSIONS) {
                let done = null;
                search: for (const pl of candidates) for (const a of [0, 5, 10, 15, 20, 30]) for (let v = 3; v <= 12; v += 0.25) {
                    if (m.check(P.fly(pl, a, v, m.world), m.world)) { done = `${a}° at ${v} m/s`; break search; }
                }
                ok(done, `mission “${m.name}” can be done`, done || 'no throw found');
            }
        }
        {
            const d1 = P.dailyChallenge(new Date(Date.UTC(2026, 9, 12, 3)));
            const d1b = P.dailyChallenge(new Date(Date.UTC(2026, 9, 12, 22)));
            ok(JSON.stringify(d1) === JSON.stringify(d1b), 'the daily bin stays put all day');
            let sane = true;
            for (let k = 0; k < 60; k++) {
                const c = P.dailyChallenge(new Date(Date.UTC(2026, 0, 1 + k)));
                if (c.bin < 7 || c.bin > 18) sane = false;
                for (const f of c.fans) if (f.x <= 0 || f.x >= c.bin) sane = false;
            }
            ok(sane, 'bins are 7–18 m away, with any fan in front of them');
        }

        // ── 3D flight: the contract the view codes against (PLAN.md) ──
        {
            const pl = P.makePlane(F.analyze(folded('dart')), P.DEFAULT_TRIM);
            const r = P3.fly3d(pl, { angle: 8, speed: 7, yaw: 0, bank: 0 });
            ok(r.path.every(p => p.length === 7 && p.every(Number.isFinite)), 'fly3d path is [x, y, z, qw, qx, qy, qz]');
            ok(['distance', 'offset', 'time', 'maxHeight', 'stalls', 'bonks', 'walls', 'landedOn', 'hoops'].every(k => k in r), 'fly3d returns every field the view reads');
            const a = P3.samplePath(r.path, 0), end = P3.samplePath(r.path, 1e6);
            ok(Math.abs(a.y - P3.ROOM3D.release) < 1e-9 && a.x === 0 && !a.done, 'samplePath starts at the hand');
            ok(end.done && Math.abs(end.x - r.path[r.path.length - 1][0]) < 1e-9, 'samplePath ends where the flight does');
            const mid = P3.samplePath(r.path, P3.SAMPLE3D * 2.5);
            ok(mid.x > r.path[2][0] && mid.x < r.path[3][0] && Math.abs(Math.hypot(...mid.q) - 1) < 1e-9, 'samplePath interpolates between samples');
        }

        // ── 3D flight: the same as 2D when nothing is lopsided ──
        {
            let worst = 0, side = 0, n = 0;
            for (const d of F.DESIGNS) for (const t of [{}, { clips: 1, elevator: 0.25 }, { winglets: true }]) {
                const pl = P.makePlane(F.analyze(folded(d.id)), { ...P.DEFAULT_TRIM, keel: d.keel, ...t });
                for (const a of [0, 10, 25]) for (const v of [4, 7, 11]) {
                    const r2 = P.fly(pl, a, v), r3 = P3.fly3d(pl, { angle: a, speed: v, yaw: 0, bank: 0 });
                    worst = Math.max(worst, Math.abs(r3.distance - r2.distance) / Math.max(1, r2.distance));
                    side = Math.max(side, ...r3.path.map(p => Math.abs(p[2])));
                    n++;
                }
            }
            ok(worst < 0.03, `a straight throw flies the 2D distance (${n} throws)`, (worst * 100).toFixed(2) + '% at worst');
            ok(side < 0.01, 'and stays on the centre line', side.toFixed(4) + ' m at most');
            const flat = P.makePlane(F.analyze(F.newSheet()), P.DEFAULT_TRIM);
            const r = P3.fly3d(flat, { angle: 5, speed: 7, yaw: 0, bank: 0 });
            ok(r.stalls >= 1 && r.distance < 5 && Math.abs(r.offset) < 0.01, 'a flat sheet still stalls and drops short', r.distance + ' m');
        }

        // ── 3D flight: roll and yaw ──
        {
            const dart = F.DESIGNS.find(d => d.id === 'dart');
            // The dart with one tail corner folded over: that wing is smaller.
            const lopsided = (side, trim = {}) => P.makePlane(F.analyze(F.build([...dart.steps,
                { kind: 'free', S: [105 * side, 297], T: [75 * side, 267], mirrored: false }]).paper), { ...P.DEFAULT_TRIM, keel: 30, elevator: 0.5, ...trim });
            const aim = { angle: 8, speed: 7, yaw: 0, bank: 0 };
            const right = P3.fly3d(lopsided(1), aim, null), left = P3.fly3d(lopsided(-1), aim, null);
            ok(right.offset > 0.25, 'a smaller right wing veers right', right.offset + ' m');
            ok(left.offset < -0.25 && Math.abs(left.offset + right.offset) < 0.02, 'and the mirror image veers left as far', left.offset + ' m');
            const wl = P3.fly3d(lopsided(1, { winglets: true }), aim, null);
            ok(Math.abs(wl.offset) < Math.abs(right.offset), 'winglets take most of the veer out', wl.offset + ' m');

            // A plane only turns as hard as it is lifting: the dart, trimmed
            // to glide, curves gently enough to stay off the walls.
            const pl = P.makePlane(F.analyze(folded('dart')), { ...P.DEFAULT_TRIM, keel: 30, elevator: 0.5 });
            const bR = P3.fly3d(pl, { ...aim, bank: 15 }), bL = P3.fly3d(pl, { ...aim, bank: -15 });
            ok(bR.offset > 0.5 && !bR.walls, 'a throw banked right curves right', bR.offset + ' m');
            ok(Math.abs(bR.offset + bL.offset) < 0.01 && Math.abs(bR.distance - bL.distance) < 0.01, 'and banked left, the mirror image');
            const more = P3.fly3d(pl, { ...aim, bank: 25 });
            ok(more.offset > bR.offset, 'more bank, more curve', more.offset + ' m');
            const yawed = P3.fly3d(pl, { ...aim, yaw: 8 });
            ok(Math.abs(yawed.offset - yawed.distance * Math.tan(8 * Math.PI / 180)) < 0.4, 'a throw aimed 8° right goes where it was aimed', yawed.offset + ' m');

            // Energy: lift does no work, drag and the keel only take it away.
            const s = P3.launch3d(pl, { angle: 20, speed: 9, yaw: 5, bank: 20 });
            const energy = () => 0.5 * pl.mass * (s.vx ** 2 + s.vy ** 2 + s.vz ** 2) + pl.mass * 9.81 * s.y;
            const e0 = energy();
            let gained = 0;
            while (!s.landed && s.t < 20) { P3.step3d(s, pl, P.DT, null); gained = Math.max(gained, energy() - e0); }
            ok(gained < e0 * 1e-3, 'no energy from nowhere in a banked climbing turn', (gained / e0 * 100).toFixed(4) + '%');

            const wall = P3.fly3d(pl, { angle: 8, speed: 9, yaw: 20, bank: 0 });
            ok(wall.walls >= 1 && wall.path.every(p => Math.abs(p[2]) <= P3.ROOM3D.width / 2), 'the side walls keep it in the room', wall.walls + ' hit(s)');
            ok(wall.path.every(p => Math.abs(Math.hypot(p[3], p[4], p[5], p[6]) - 1) < 1e-9), 'and its orientation stays a unit quaternion');
            const pillar = P3.fly3d(pl, aim, { pillars: [{ x: 4, z: 0, r: 0.3 }] });
            ok(pillar.walls >= 1 && pillar.distance < 4, 'a pillar in the way stops it', pillar.distance + ' m');
            const desk = P3.fly3d(pl, { angle: 0, speed: 6, yaw: 0, bank: 0 }, { pads: [{ x0: 3, x1: 4.5, y: 2 }] });
            ok(desk.walls >= 1 && desk.distance < 3, 'and so does the side of a tall cupboard', desk.distance + ' m');
            const off = P3.fly3d(pl, aim, { pads: [{ x0: 3, x1: 4.5, z0: 1, z1: 2, y: 2 }] });
            ok(!off.walls && Math.abs(off.distance - P3.fly3d(pl, aim).distance) < 1e-9, 'a desk off to the side is not in the way');
            const dartPl = P.makePlane(F.analyze(folded('dart')), { ...P.DEFAULT_TRIM, keel: 30 });
            const side = P3.sidePath(P3.fly3d(dartPl, aim).path), flat2 = P.fly(dartPl, aim.angle, aim.speed).path;
            ok(side.length === flat2.length && side.every((p, i) => Math.abs(p[0] - flat2[i][0]) < 1e-9 && Math.abs(Math.atan2(Math.sin(p[2] - flat2[i][2]), Math.cos(p[2] - flat2[i][2]))) < 1e-6),
                'sidePath turns a straight 3D flight back into the 2D one, pitch and all');
            const office = P3.furnish({ pads: [{ x0: 8.5, x1: 10, y: 0.74 }] });
            ok(office.pads[0].x0 === 8.5 && office.pads.slice(1).every(p => p.scenery && Math.min(Math.abs(p.z0), Math.abs(p.z1)) >= 2.3), 'the office desks stand by the walls, after the mission’s own');
            const intoDesk = P3.fly3d(pl, { angle: 0, speed: 8, yaw: 16, bank: 0 }, office);
            ok(intoDesk.walls >= 1 || intoDesk.landedOn > 0, 'and a throw at the wall meets them', `walls ${intoDesk.walls}, landed on ${intoDesk.landedOn}`);
        }

        // ── 3D missions and the daily bin ──
        {
            const candidates = [
                ['dart', { keel: 26, elevator: 0.5, clips: 2 }],
                ['glider', { keel: 26, elevator: 0.25, clips: 1 }],
                ['nakamura', { keel: 18, elevator: 0.25, clips: 1 }],
                ['nakamura', { keel: 24, elevator: 0, clips: 0 }],
            ].map(([id, t]) => P.makePlane(F.analyze(folded(id)), { ...P.DEFAULT_TRIM, ...t }));
            for (const m of P.MISSIONS) {
                let done = null;
                search: for (const pl of candidates) for (const a of [0, 5, 10, 15, 20, 30]) for (let v = 3; v <= 12; v += 0.25) {
                    if (m.check(P3.fly3d(pl, { angle: a, speed: v, yaw: 0, bank: 0 }, P3.furnish(m.world)), m.world)) { done = `${a}° at ${v} m/s`; break search; }
                }
                ok(done, `mission “${m.name}” can be done in 3D too`, done || 'no throw found');
            }
            for (const m of P3.MISSIONS3D) {
                let done = null;
                search: for (const pl of candidates) for (const bank of [0, -10, 10, -20, 20]) for (const yaw of [0, -5, 5, -10, 10, -15, 15]) for (const a of [0, 5, 10]) for (let v = 5; v <= 12; v += 0.5) {
                    if (m.check(P3.fly3d(pl, { angle: a, speed: v, yaw, bank }, P3.furnish(m.world)), m.world)) { done = `${a}° at ${v} m/s, aimed ${yaw}°, banked ${bank}°`; break search; }
                }
                ok(done, `3D mission “${m.name}” can be done`, done || 'no throw found');
            }
            const days = [3, 41, 77, 120, 199, 260].map(k => P.dailyChallenge(new Date(Date.UTC(2026, 0, k))));
            ok(days.every(c => Math.abs(c.binZ) <= 1.5 && c.fans.every(f => Math.abs(f.z) <= Math.abs(c.binZ))), 'daily bins sit up to 1.5 m off the centre line');
            let beaten = 0;
            for (const c of days) {
                const bearing = Math.atan2(c.binZ, c.bin) * 180 / Math.PI;
                search: for (const pl of candidates) for (const dy of [0, -1, 1, -2, 2]) for (const a of [0, 5, 10, 15]) for (let v = 3; v <= 12; v += 0.25) {
                    const r = P3.fly3d(pl, { angle: a, speed: v, yaw: bearing + dy, bank: 0 }, P3.furnish({ fans: c.fans }));
                    if (P.inBin(r.distance, c, r.offset)) { beaten++; break search; }
                }
            }
            ok(beaten === days.length, 'every sampled daily bin can be hit in 3D', `${beaten}/${days.length}`);
            ok(P.inBin(c0().bin, c0()) && !P.inBin(c0().bin, c0(), c0().binZ + 1), 'inBin: by distance alone for 2D, by the rest point for 3D');
            function c0() { return days[0]; }
        }

        const summary = document.getElementById('summary');
        summary.textContent = passed + ' passed, ' + failed + ' failed';
        summary.className = failed ? 'fail' : 'pass';
    </script>
</body>
</html>
