<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Calculator — Logic & Powertrain Tests</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, monospace; padding: 1.5rem; line-height: 1.5; }
        h1 { font-size: 1.4rem; margin-bottom: 1rem; color: #38bdf8; }
        .pass { color: #34d399; }
        .fail { color: #f87171; font-weight: bold; }
        #summary { font-size: 1.2rem; margin-bottom: 1rem; padding: 0.5rem; background: #1e293b; border-radius: 6px; }
        .test-row { margin-bottom: 0.25rem; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🚗 Car Lease · Rent · Buy Calculator — Test Suite</h1>
    <div id="summary">Running tests…</div>
    <div id="results"></div>

    <!-- DOM Stubs needed for model functions -->
    <div style="display:none">
        <input id="horizon" value="60">
        <input id="price" value="32000">
        <input id="otd" value="35040">
        <input id="taxRate" value="7">
        <input id="fees" value="800">
        <select id="depreciation"><option value="average">US average</option></select>
        <select id="disposal"><option value="instant">Instant offer</option></select>
        <input id="resale" value="0" data-touched="0">
        <input id="miles" value="12000">
        <input id="insurance" value="210">
        <input id="maintenance" value="110">
        <input id="mpg" value="28">
        <input id="gasPrice" value="3.90">
        <input id="evMiPerKwh" value="3.4">
        <input id="evKwhPrice" value="0.15">
        <input id="registration" value="70">
        <input id="cash" value="40000">
        <input id="returnRate" value="5">
        <input id="down" value="5000">
        <input id="apr" value="6.27">
        <input id="loanTerm" value="60">
        <input id="leasePayment" value="365">
        <input id="leaseSigning" value="2500">
        <input id="leaseTerm" value="36">
        <input id="leaseAllowance" value="12">
        <input id="leaseOverage" value="0.25">
        <select id="leaseMileagePlan"><option value="payatend">Pay at end</option></select>
        <input id="leasePrepaidRate" value="0.15">
        <input id="leaseDisposition" value="395">
        <input id="leaseWear" value="250">
        <select id="leaseRenewal"><option value="resign">Re-sign</option></select>
        <input id="rentRate" value="805">
        <input id="rentStartFee" value="0">
        <input id="rentAllowance" value="500">
        <input id="rentBlockPrice" value="199">
        <input id="sixtLdw" value="144">
        <input id="sixtDriver" value="67">
        <input id="sixtRoadside" value="22">
        <input id="sixtLicense" value="6">
        <input id="sixtExcess" value="1000">
        <input id="sixtTax" value="11.9">
        <input id="flexRate" value="454">
        <input id="flexProtection" value="295">
        <input id="ownInsuranceQuote" value="160">
        <input id="flexTax" value="6">
        <input id="flexDelivery" value="0">
        <input id="flexOnTrack" value="50">
        <input id="flexExcess" value="500">
        <input id="flexStartFee" value="249">
        <input id="flexAllowance" value="850">
        <input id="flexBlockPrice" value="50">
        <input id="rentalDaily" value="78">
        <input id="rentalMonthly" value="908">
    </div>

    <!-- Scripts under test -->
    <script src="js/data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/model.js"></script>

    <script>
    let passed = 0, failed = 0;
    const fails = [];

    function assert(name, condition, detail) {
        const div = document.createElement('div');
        div.className = 'test-row ' + (condition ? 'pass' : 'fail');
        if (condition) {
            passed++;
            div.textContent = '✓ ' + name;
        } else {
            failed++;
            fails.push(name);
            div.textContent = '✗ FAIL: ' + name + (detail ? ' — ' + detail : '');
        }
        document.getElementById('results').appendChild(div);
    }

    function approx(a, b, eps = 0.01) {
        return Math.abs(a - b) <= eps;
    }

    // ── 1. Reference Data Tests ─────────────────────────────────────
    (function testData() {
        assert('POWERTRAIN_TYPES defines petrol, hybrid, and ev',
            POWERTRAIN_TYPES.petrol && POWERTRAIN_TYPES.hybrid && POWERTRAIN_TYPES.ev);

        assert('EV maintenance multiplier is 0.50 (-50%)',
            POWERTRAIN_TYPES.ev.maintMult === 0.50);

        assert('EV insurance multiplier is 1.25 (+25%)',
            POWERTRAIN_TYPES.ev.insMult === 1.25);

        assert('GA EV tag surcharge is $238/yr',
            POWERTRAIN_TYPES.ev.evRegistrationSurcharge === 238);

        assert('FLEXCAR_TIERS defines standard, cruiser, and warrior',
            FLEXCAR_TIERS.standard && FLEXCAR_TIERS.cruiser && FLEXCAR_TIERS.warrior);
    })();

    // ── 2. Fuel Math Tests ──────────────────────────────────────────
    (function testFuel() {
        carPowertrain = 'petrol';
        const vPetrol = readInputs();
        vPetrol.miles = 12000;
        vPetrol.mpg = 28;
        vPetrol.gasPrice = 3.90;
        const fuelPetrol = monthlyFuel(vPetrol);
        assert('Petrol fuel cost calculation ($139.29/mo for 12k mi @ 28 mpg, $3.90/gal)',
            approx(fuelPetrol, 139.29, 0.05));

        carPowertrain = 'hybrid';
        const vHybrid = readInputs();
        vHybrid.miles = 12000;
        vHybrid.mpg = 44;
        vHybrid.gasPrice = 3.90;
        const fuelHybrid = monthlyFuel(vHybrid);
        assert('Hybrid fuel cost calculation ($88.64/mo for 12k mi @ 44 mpg, $3.90/gal)',
            approx(fuelHybrid, 88.64, 0.05));

        carPowertrain = 'ev';
        const vEV = readInputs();
        vEV.miles = 12000;
        vEV.evMiPerKwh = 3.4;
        vEV.evKwhPrice = 0.15;
        const fuelEV = monthlyFuel(vEV);
        assert('EV electricity cost calculation ($44.12/mo for 12k mi @ 3.4 mi/kWh, $0.15/kWh)',
            approx(fuelEV, 44.12, 0.05));
    })();


    // ── 3. Powertrain Adjustments Tests ─────────────────────────────
    (function testPowertrainAdjustments() {
        carPowertrain = 'ev';
        const v = readInputs();
        assert('EV registration includes $238 surcharge ($70 + $238 = $308)',
            v.registration === 70 + 238);

        assert('EV maintenance multiplier applied to base ($110 * 0.5 = $55)',
            v.maintenance === 110 * 0.50);

        assert('EV insurance multiplier applied to base ($210 * 1.25 = $262.5)',
            v.insurance === 210 * 1.25);
    })();

    // ── 4. Flexcar Tiers & Credit Pricing Tests ─────────────────────
    (function testFlexcarTiers() {
        /* Both of these are module-level globals, so leaving them set here
           silently repriced every test below this one. */
        const heldTier = flexTier, heldCredit = creditTier;
        flexTier = 'cruiser';
        creditTier = 'prime';
        const vPrime = readInputs();
        const resPrime = computeAll(vPrime);

        creditTier = 'nearprime';
        const vNear = readInputs();
        const resNear = computeAll(vNear);

        creditTier = 'superprime';
        const vSuper = readInputs();
        const resSuper = computeAll(vSuper);

        assert('Flexcar price varies by credit score tier (Nearprime > Prime > Superprime)',
            resNear.flexcar.perMonth > resPrime.flexcar.perMonth &&
            resPrime.flexcar.perMonth > resSuper.flexcar.perMonth);

        flexTier = heldTier;
        creditTier = heldCredit;
    })();


    // ── 5. Lease IRA Credit Test ────────────────────────────────────
    (function testLeaseCredit() {
        carPowertrain = 'ev';
        const vEV = readInputs();
        const resEV = computeAll(vEV);
        assert('EV lease reflects IRA Sec 45W $7,500 credit',
            resEV.lease.total > 0 && vEV.leaseResidualBonus === 7500);
    })();

    // ── 6. Calculation Accountability Test ─────────────────────────
    (function testAccountability() {
        carPowertrain = 'ev';
        const v = readInputs();
        const res = computeAll(v);
        assert('computeAll attaches accountability object',
            res.accountability && res.accountability.fuel && res.accountability.maintenance);
        assert('Accountability includes EV formula string',
            res.accountability.fuel.formula.includes('mi/kWh'));
    })();

    // ── 7. Insurance Age Decay Test ─────────────────────────────
    (function testInsuranceDecay() {
        carPowertrain = 'petrol';
        const v = readInputs();
        v.months = 60;
        v.buyAge = 0;
        v.insurance = 200;
        const res = computeAll(v);
        assert('Insurance decays slightly over 5 years (Month 60 insurance < Month 1 insurance)',
            res.cash.components.insurance < 200 * 60);
    })();

    // ── 8. Price Synchronization Test ─────────────────────────────
    (function testPriceSync() {
        priceAnchor = 'price';
        document.getElementById('price').value = '30000';
        document.getElementById('taxRate').value = '7';
        document.getElementById('fees').value = '800';
        syncPriceFields();
        const expectedOtd = 30000 * 1.07 + 800;
        assert('syncPriceFields calculates OTD price ($30,000 * 1.07 + $800 = $' + expectedOtd + ')',
            approx(num('otd'), expectedOtd, 1));
    })();

    // ── 9. Scenario Uncertainty Spread Test ───────────────────────
    (function testScenarioSpread() {
        const held = scenarioCase;
        scenarioCase = 'optimistic';
        const resOpt = computeAll(readInputs());
        scenarioCase = 'expected';
        const resExp = computeAll(readInputs());
        scenarioCase = 'pessimistic';
        const resPess = computeAll(readInputs());
        scenarioCase = held;

        assert('Scenario uncertainty bounds hold (Optimistic < Expected < Pessimistic)',
            resOpt.cash.perMonth < resExp.cash.perMonth && resExp.cash.perMonth < resPess.cash.perMonth);
    })();

    // ── 10. Depreciation Curve Test ────────────────────────────────
    (function testDepreciationCurves() {
        const valJap = retainedValue(5, 'japanese');
        const valAvg = retainedValue(5, 'average');
        const valLux = retainedValue(5, 'germanLux');
        assert('Japanese 5-yr retention > Average > German Luxury',
            valJap > valAvg && valAvg > valLux);
    })();

    // ── 11. Sixt+ & Flexcar Subscription Math Test ─────────────────
    (function testSubscriptions() {
        const v = readInputs();
        const res = computeAll(v);
        assert('Sixt+ monthly calculation includes LDW and driver charges',
            res.sixt.total > 0 && res.sixt.perMonth > 0);
        assert('Flexcar monthly calculation includes protection and membership fee',
            res.flexcar.total > 0 && res.flexcar.perMonth > 0);
    })();

    // ── 12. Daily Rental Option Test ────────────────────────────────
    (function testDailyRental() {
        const v = readInputs();
        const res = computeAll(v);
        assert('Daily rental includes zero maintenance and zero registration fees',
            res.rental.components.maintenance === 0 && res.rental.components.fees === 0);
    })();

    // ── 13. Vehicle Age Band Maintenance Test ────────────────────────
    (function testAgeBands() {
        const maintNew = maintMultiplierOver(0, 5);
        const maintUsed = maintMultiplierOver(5, 5);
        assert('5-yr-old used car upkeep multiplier > Brand new car upkeep multiplier',
            maintUsed > maintNew);
    })();

    // ── 14. Credit Tier Rates & Gating Test ──────────────────────────
    (function testCreditTiers() {
        const superprime = CREDIT_TIERS.superprime;
        const subprime = CREDIT_TIERS.subprime;
        assert('Superprime loan APR < Subprime loan APR',
            superprime.aprNew < subprime.aprNew);
        assert('Subprime credit gates lease option',
            subprime.avail.lease === 'gated');
    })();

    // ── 15. Flexcar mileage plan ─────────────────────────────────────
    //    Pinned to two itemised Flexcar checkouts (Gwinnett County, GA).
    //    Both quote the car line as "Standard Plan — 850 miles per month
    //    included", which is why a listing rate is a Standard baseline and
    //    the tier offset is what upgrading off it costs.
    (function testFlexcarMileage() {
        const set = (id, val) => { document.getElementById(id).value = val; };
        const held = { rate: flexRate.value, prot: flexProtection.value,
                       allow: flexAllowance.value, tier: flexTier };

        const quote = (rate, prot, allowance, tier) => {
            set('flexRate', rate); set('flexProtection', prot);
            set('flexAllowance', allowance); flexTier = tier;
            return computeAll(readInputs()).flexcar;
        };

        assert('Flexcar reproduces the 2024 Tiguan checkout ($374 + $245 @ 6% = $656.14)',
            approx(quote(374, 245, 850, 'standard').allIn, 656.14),
            'got ' + quote(374, 245, 850, 'standard').allIn.toFixed(2));

        assert('Flexcar reproduces the 2026 Mazda CX-50 checkout ($569 + $245 @ 6% = $862.84)',
            approx(quote(569, 245, 850, 'standard').allIn, 862.84),
            'got ' + quote(569, 245, 850, 'standard').allIn.toFixed(2));

        // The cap is the field's to own — reading it off the tier left the
        // input inert and disagreeing with the panels that quote it.
        assert('Flexcar mileage cap comes from the input, not the tier',
            quote(454, 295, 1200, 'standard').allowance === 1200);

        assert('A cap above the driven miles buys no overage blocks',
            quote(454, 295, 1200, 'standard').overagePerMonth === 0);

        assert('A cap below the driven miles does buy overage blocks',
            quote(454, 295, 850, 'standard').overagePerMonth > 0);

        // ...while the tier still prices the upgrade itself, exactly once.
        assert('Cruiser tier adds its $50 rate offset to the car line',
            quote(454, 295, 1200, 'cruiser').rate -
            quote(454, 295, 1200, 'standard').rate === 50);

        assert('Road Warrior tier adds its $150 rate offset to the car line',
            quote(454, 295, 2000, 'warrior').rate -
            quote(454, 295, 2000, 'standard').rate === 150);

        set('flexRate', held.rate); set('flexProtection', held.prot);
        set('flexAllowance', held.allow); flexTier = held.tier;
    })();

    // ── 16. Flexcar model-year adjustment ────────────────────────────
    (function testFlexcarAge() {
        const heldAge = carAge, heldCase = scenarioCase;
        const rateFor = (age, scen) => {
            carAge = age; scenarioCase = scen;
            return computeAll(readInputs()).flexcar.rate;
        };
        const base = rateFor('three', 'expected');

        assert('No age picked leaves the Flexcar rate exactly as typed',
            rateFor(null, 'expected') === base);

        assert('The 3-yr band is the anchor — it adds nothing',
            rateFor('three', 'expected') === base);

        assert('A current-model-year car costs more than the 3-yr anchor',
            rateFor('new', 'expected') > base);

        assert('Current model year lands in the observed $100–200 spread',
            rateFor('new', 'optimistic') - base === 100 &&
            rateFor('new', 'pessimistic') - base === 200,
            'got ' + (rateFor('new', 'optimistic') - base) + '–' +
            (rateFor('new', 'pessimistic') - base));

        assert('Older bands come in under the anchor',
            rateFor('six', 'expected') < base && rateFor('ten', 'expected') < base);

        assert('The used discount flattens rather than running away',
            rateFor('ten', 'expected') - rateFor('six', 'expected') >
            rateFor('six', 'expected') - rateFor('three', 'expected') - 100);

        // Optimistic is the cheaper end on every band, new or used — the
        // scenario toggle must not invert once the adjustment goes negative.
        for (const age of ['new', 'three', 'six', 'ten']) {
            assert('Optimistic is never dearer than pessimistic (' + age + ')',
                rateFor(age, 'optimistic') <= rateFor(age, 'pessimistic'));
        }

        carAge = heldAge; scenarioCase = heldCase;
    })();

    // Summary output
    const summary = document.getElementById('summary');
    summary.innerHTML = passed + ' passed, ' + failed + ' failed' +
        (failed ? ' (' + fails.join(', ') + ')' : '');
    summary.className = failed ? 'fail' : 'pass';
    </script>
</body>
</html>
