    <style>
        :root {
            --bg: #0a0d18;
            --panel: rgba(255, 255, 255, 0.045);
            --panel-border: rgba(255, 255, 255, 0.09);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #e2c07a;
            --accent-rgb: 226, 192, 122;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        [hidden] { display: none !important; }

        html, body { height: 100%; }

        body {
            background: radial-gradient(ellipse at 50% 0%, #1a1630 0%, var(--bg) 60%);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        button { font: inherit; color: inherit; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .bar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.9rem;
            flex-wrap: wrap;
        }

        .back {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            border: 1px solid var(--panel-border);
            background: var(--panel);
        }

        .back:hover { color: var(--text); }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-right: auto;
        }

        h1 span { color: var(--accent); }

        .chip, .tool {
            border: 1px solid var(--panel-border);
            background: var(--panel);
            border-radius: 999px;
            padding: 0.38rem 0.75rem;
            font-size: 0.82rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .chip:hover, .tool:hover { background: rgba(255, 255, 255, 0.09); }

        .chip[aria-pressed="true"], .tool[aria-pressed="true"] {
            border-color: rgba(var(--accent-rgb), 0.7);
            background: rgba(var(--accent-rgb), 0.16);
        }

        .chip-accent {
            border-color: rgba(var(--accent-rgb), 0.55);
            color: var(--accent);
        }

        #timer {
            font-family: 'Outfit', sans-serif;
            font-variant-numeric: tabular-nums;
            font-size: 0.9rem;
            color: var(--accent);
            min-width: 6rem;
        }

        .group { display: inline-flex; gap: 0.35rem; align-items: center; }

        .group-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-right: 0.15rem;
        }

        #stage {
            flex: 1;
            min-height: 0;
            display: grid;
            place-items: center;
            padding: 0 0.9rem;
        }

        #world {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border-radius: 14px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
            touch-action: none;
            cursor: crosshair;
            background: #0a0d18;
        }

        #stage.turning #world { animation: turn 0.6s cubic-bezier(0.5, 0, 0.3, 1); }

        @keyframes turn {
            from { transform: rotate(-180deg) scale(0.92); }
            to { transform: rotate(0deg) scale(1); }
        }

        .dock {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.6rem 0.9rem 0.9rem;
        }

        /* A wrapping grid, not a scrolling strip: every material is on screen
           at once and each button is a full finger wide. */
        #palette {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(7.6rem, 1fr));
            gap: 0.35rem;
        }

        #palette .tool {
            border-radius: 10px;
            min-height: 2.5rem;
            padding: 0.3rem 0.55rem;
            justify-content: flex-start;
            font-size: 0.84rem;
            position: relative;
        }

        #palette .tool[aria-pressed="true"] {
            box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.7), 0 4px 14px rgba(var(--accent-rgb), 0.18);
        }

        .swatch {
            width: 1.15rem;
            height: 1.15rem;
            flex: none;
            border-radius: 5px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        .swatch-erase {
            background: repeating-linear-gradient(45deg, #475569 0 2px, transparent 2px 4px);
        }

        .key {
            margin-left: auto;
            font-size: 0.66rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            opacity: 0.8;
        }

        .dock-row {
            display: flex;
            gap: 0.9rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .hint {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--muted);
        }

        @media (max-width: 640px) {
            .hint, .key { display: none; }
            /* Five across, swatch over name: fifteen materials in three rows. */
            #palette { grid-template-columns: repeat(5, 1fr); gap: 0.3rem; }
            #palette .tool {
                flex-direction: column;
                justify-content: center;
                gap: 0.2rem;
                min-height: 2.9rem;
                font-size: 0.7rem;
                padding: 0.3rem 0.1rem;
            }
            .dock-row { gap: 0.5rem; }
            .group { flex-wrap: wrap; }
            h1 { font-size: 1.05rem; }
            .bar { gap: 0.4rem; padding: 0.5rem 0.6rem; }
            .dock { padding: 0.5rem 0.6rem 0.7rem; }
            #stage { padding: 0 0.6rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            #stage.turning #world { animation: none; }
        }
    </style>

<body>
    <header class="bar">
        <a class="back" href="../index.html">← Back</a>
        <h1>Sand <span>Clock</span></h1>
        <span id="timer" aria-live="off"></span>
        <button type="button" class="chip chip-accent" id="flip" hidden>⟲ Turn over</button>
        <button type="button" class="chip" id="pause" aria-pressed="false">Pause</button>
        <button type="button" class="chip" id="clear">Clear</button>
    </header>

    <main id="stage">
        <canvas id="world" aria-label="Falling-sand world. Drag to pour the selected material."></canvas>
    </main>

    <div class="dock">
        <div id="palette" role="toolbar" aria-label="Materials"></div>
        <div class="dock-row">
            <div class="group" role="group" aria-label="Brush size">
                <span class="group-label">Brush</span>
                <button type="button" class="chip" data-brush="1">S</button>
                <button type="button" class="chip" data-brush="3">M</button>
                <button type="button" class="chip" data-brush="6">L</button>
                <button type="button" class="chip" data-brush="11">XL</button>
            </div>
            <div class="group" role="group" aria-label="Pour mode">
                <span class="group-label">Mode</span>
                <button type="button" class="chip" data-mode="pour" title="Drag to pour">✋ Pour</button>
                <button type="button" class="chip" data-mode="tap" title="Click to fit a tap that keeps pouring; click it again to remove. An eraser tap is a drain. (T)">🚰 Tap</button>
                <button type="button" class="chip" data-mode="blast" title="Click to set off an explosion (B)">💥 Blast</button>
            </div>
            <div class="group" role="group" aria-label="Scenes">
                <span class="group-label">Scene</span>
                <button type="button" class="chip" data-scene="hourglass">⏳ Hourglass</button>
                <button type="button" class="chip" data-scene="volcano">🌋 Volcano</button>
                <button type="button" class="chip" data-scene="garden">🌱 Garden</button>
                <button type="button" class="chip" data-scene="lab">🧪 Lab</button>
            </div>
            <span class="hint">Right-drag erases · Alt-click picks up a material · wheel or [ ] sizes the brush · 1–0, ⇧1–4 pick · Space pauses · F turns the glass</span>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
